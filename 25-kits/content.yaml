# Media kit, community edition: the source of 60-outputs/content/ on the "community" branch (rendered by _system/kits.py).
# This edition keeps every wording rule and every glossary term, and a small preview of the full media kit: three facts, two myths,
# one story angle and two quotes, each with its id from the full kit. The full kit (158 facts, 64 myths, 80 story angles and 122 quotes)
# is not part of the community edition; _system/edition.yaml says which edition the build makes.
# Everything here is derived from public claims in 20-claims/day1.yaml, day2.yaml and day3.yaml. Every claim id must exist and be public.
# status: documented = at least one cited claim is Google's documentation or a point Google's documentation states or supports
#         (ver confirmed, consistent or source on a Google source); event-only = rests on what was shown or said at the event only.
# A statement or point that rests on an analysis claim starts with "Author's view:" (the author's interpretation, never Google's).
# Names: follow wording rule 5. The build allows a name only where a cited claim's who holds it and sessions.yaml does not mark it
# inferred; everything else is credited "Google at Search Central Live Deep Dive Europe 2026 (Day N)", "a community speaker" or "a speaker".
# Quotes: the text is pulled from the cited claim's quote field (<= 25 words, verbatim). Both preview quotes were checked against the
# slide photo (quote_checked: true).

# This file is the community edition's kit: the build stops unless _system/edition.yaml says "edition: community" too (and
# _system/edition.py is there), so a checkout without those two files never builds the full edition's pages from this preview.
edition: community

wording_rules:
  - "Documented points (status documented): write \"Google's documentation says...\" when you paraphrase a Google page, or \"Google said at the event, and its documentation supports this...\" when the point was said or shown on stage and the documentation only supports it. Link the Google page given in the kit."
  - "Event-only points (status event-only): write \"Google said at Search Central Live Deep Dive Europe 2026 (Day N)...\" or \"a Google slide at the event showed...\". Never present them as documented policy, a guarantee or a confirmed ranking factor; where it matters, add \"this is not in Google's documentation\"."
  - "Community speakers: write \"a community speaker at the event said...\". Their findings, tools and methods are theirs, not Google's, even when Google's documentation agrees."
  - "Unattributed points: where the kit's credit is \"a speaker at Search Central Live Deep Dive Europe 2026 (Day N)\", the knowledge base does not record whether a Googler or a community speaker said it (a point from a session that was not recorded, or a lightning slot with a Google host). Write \"said at the event\" and never attribute it to Google."
  - "Audience questions are questions, not Google's position. Only Google's answer can be attributed to Google."
  - "Names: credit \"Google at Search Central Live Deep Dive Europe 2026 (Day 1)\", \"(Day 2)\" or \"(Day 3)\", or \"a community speaker\", and name a person only where the kit gives a named speaker (speaker in content-library.json, \"Named speaker\" in quotes.md). The knowledge base names a speaker only on proof: the name shown on a slide; a self-introduction or an introduction by name in the recording that matches the official speaker list; or the author's own identification at the event (notes or recording label). Wherever the author recorded any doubt about who was speaking (a speaker marked inferred or probable), the name was dropped, even where similar evidence names another session's speaker. Never add a name from your own knowledge; drop the name and keep the information."
  - "Analysis claims and every point marked \"Author's view:\" are the knowledge base author's interpretation and advice (Ibrahim Anjro). Present them as our view or our recommendation, never as Google's."
  - "Press claims: name the publication (\"as reported by Search Engine Journal\"). A press report is neither Google's documentation nor something said at the event."
  - "Numbers keep their scope: the market (US only, global English-language queries), the period (since launch, past six months, 2022 versus 2021), the basis (Google internal data, a Google-commissioned survey, a third-party study and its year) and the comparison (\"30% faster than AI Mode queries overall\" is not \"30% growth\"). Never round up, combine, annualise or extrapolate a figure. Where a Google figure has no stated market, period or source, say so (\"the slide gave no market or period\")."
  - "Hedges stay. If a claim says \"or mostly\", \"as far as I'm aware\", \"I think\", \"approximately\", \"likely\" or notes an unclear recording, keep the hedge in your wording or leave the point out."
  - "Quotes: use only the kit's quote list or a claim's quote field, verbatim, at most 25 words, inside quotation marks, with no edits, splices or translations inside the marks. Prefer quotes marked checked; label transcript quotes that are not checked as spoken remarks and never show them as slide text."
  - "Partly documented points: an angle point labelled Partly documented rests on documented claims and on claims that were only said or shown at the event. Check each cited claim, and attribute the undocumented part to the event (\"Google said at Search Central Live...\"), never to Google's documentation."
  - "Where the event and Google's documentation differ, follow the documentation and say that they differ (for example canonicals on paginated pages, max-snippet:-1, 'Discovered – currently not indexed', SpamBrain's launch year, PageRank's role in ranking, Google's 2023 testing figures, the source year of the 40 billion spam pages figure)."
  - "No slide photos, screenshots of slides, transcripts, recordings or images of attendees in any content. Recreate charts yourself (for example your own Google Trends charts) and describe slides in your own words."
  - "Companies shown on stage as bad examples stay unnamed (\"a large German banking group\", \"a retail brand\"). Do not name the clients or competitors in community case studies either."
  - "The event is Google Search Central Live Deep Dive Europe 2026, Barcelona: Day 1 on 30 September 2026 (crawling), Day 2 on 1 October 2026 (indexing), Day 3 on 2 October 2026 (serving: ranking, Search Console and performance). Claim ids starting D1 are Day 1, D2 are Day 2 and D3 are Day 3. Day 3's processing times are Google's estimates from internal analysis: always call them estimates. Docs, press and analysis claims only annotate a session; they were not said there."
  - "Do not promise outcomes the claims do not state (rankings, traffic, AI citations, indexing). \"Can\", \"may\" and \"Google said\" must not become \"will\"."
  - "Keep claim ids in drafts so a reviewer can check every sentence against 20-claims/; remove them from the published text."

facts:
  # Preview: headline facts that Google's documentation backs, credited to Google
  - id: F-012
    statement: "A Search Console setting now lets a site leave AI Overviews and AI Mode, and Google says the setting is not used as a ranking or inclusion signal for regular results."
    claims: [D1-C029, D1-C031]
    status: documented
    use: headline
  - id: F-017
    statement: "Google treats network timeouts, connection resets and DNS errors like 5xx server errors: crawling slows down at once, and indexed URLs that stay unreachable are removed from the index within days."
    claims: [D1-C126]
    status: documented
    use: headline
  - id: F-025
    statement: "noindex costs crawl budget because Google must fetch a page to see the rule, while URLs disallowed in robots.txt are not fetched at all."
    claims: [D1-C106, D1-C105]
    status: documented
    use: headline

myths:
  # Preview: myths that Google's documentation answers
  - id: M-001
    myth: "SEO is dead: AI search needs GEO, a new discipline."
    fact: "Google said not to worry about the name: good SEO is good GEO and AEO. Its documentation says optimising for generative AI search is still SEO, because the AI features are built on the core ranking systems and highlight content indexed by Google Search. Day 3 closed on the same line: AI features on Google Search use exactly the same processes as traditional results."
    claims: [D1-C050, D1-C051, D1-C052, D3-C701]
    status: documented
  - id: M-002
    myth: "Cut your content into short, self-contained chunks so Google's AI can use it."
    fact: "Google said chunking matters at the level of an AI model's context window, and Gemini's holds millions of tokens, so Gemini does not need content cut into 100 or 200 word pieces. Google spoke only for its own systems. Google's Day 1 myth slide already said there is no need to chop content."
    claims: [D2-C330, D2-C331, D2-C332, D1-C054]
    status: documented

quotes:
  # Preview: quotes checked against the slide photo (quote_checked: true), credited to Google
  - {id: Q-001, claim: D1-C050}
  - {id: Q-002, claim: D1-C058}

angles:
  # Preview: one story angle
  - id: A-001
    title: "Is SEO dead? Google's own answer from Barcelona"
    audience: [SEO practitioners, marketers, business owners]
    formats: [linkedin, article]
    hook: "Google told a room of SEOs that GEO is a label, not a new discipline: good SEO is good GEO and AEO."
    points:
      - text: "Google's answer to 'SEO is dead, long live GEO': don't worry about the name, good SEO is good GEO and AEO."
        claims: [D1-C050, D1-C049]
      - text: "Three reasons Google gave: generative AI features are built on the core ranking systems, query fan-out expands the query to find related information, and the features highlight content indexed by Google Search. Google's guide calls it still SEO."
        claims: [D1-C051, D1-C052]
      - text: "AI Mode and AI Overviews use the same crawling and the same index as Search; at serving they add grounding and query fan-out."
        claims: [D1-C038]
      - text: "Day 2 repeated it: AI Overviews and AI Mode are built on top of Search results, so what works for web results also works for the AI features."
        claims: [D2-C116, D2-C601]
      - text: "llms.txt is not needed: Google Search ignores such files, so they neither help nor harm."
        claims: [D1-C054, D1-C061]
      - text: "Day 3 closed the event on the same message: AI on Google is just SEO, because AI features on Google Search use exactly the same processes as traditional results, and no new acronym was needed for mobile-first indexing or structured data either."
        claims: [D3-C701, D3-C702]
      - text: "'SEO is dead' posts go back at least to a 'Search engine R.I.P.' forum post of 10 November 1997, Google said on Day 1, adding that the AI features only create more opportunities for site owners."
        claims: [D1-C197, D1-C198]
      - text: "Counterpoint: a community speaker argued for adopting the GEO label as the industry's chance to leave SEO's bad reputation behind."
        claims: [D1-C296]
    caution: "Every Google point except the 1997 history and the 'more opportunities' remark, which were said on stage, is backed by Google's documentation; the GEO counterpoint is a community speaker's view, not Google's. The remark that GEO is a label invented to create a new field comes from the author's notes of a stage talk, so paraphrase it; quote only the checked slide wording."
    cta: "Ask readers which 'GEO' tactic they were sold this year, then check it against Google's guide to generative AI features."

glossary:
  - term: "AI Mode"
    definition: "Google Search's AI mode, where users ask longer questions (about three times as long as a traditional search on average, a Google slide said; the opening keynote said two to three times) and follow-up questions. It uses the same crawling and index as Search and adds grounding and query fan-out when it answers."
    claims: [D1-C038, D1-C017, D1-C019]
  - term: "AI Overviews"
    definition: "AI-generated summaries shown in Google results with links to supporting pages. They are built on Google's core ranking systems and use content indexed by Google Search."
    claims: [D1-C051, D2-C074]
  - term: "Query fan-out"
    definition: "Running several related searches at once to gather more results for an AI answer; a question about lawn weeds may also search herbicides and weed prevention. In Google's AI features an LLM generates the fan-out queries, and each goes through the same query understanding as a typed query; Google said they are not added to Search Console."
    claims: [D1-C053, D2-C729, D3-C058, D3-C062, D3-C063]
  - term: "Grounding"
    definition: "Giving an AI model content from the Google Search index at prompt time, so that its answer rests on that content."
    claims: [D2-C121, D1-C038]
  - term: "GEO and AEO"
    definition: "Labels for generative engine optimisation and answer engine optimisation. Google's answer: don't worry about the name, good SEO is good GEO and AEO."
    claims: [D1-C050, D1-C052]
  - term: "llms.txt"
    definition: "A text file some sites add for AI systems. Google says it isn't necessary: Google Search ignores such AI text files, so they neither help nor harm. On Day 1 Google said llms.txt does not matter for Google Search right now and that it does not expect it to."
    claims: [D1-C054, D1-C061, D1-C454]
  - term: "Search generative AI control"
    definition: "A Search Console property setting (inherit, include or exclude) that controls whether a site appears in AI Overviews, AI Mode and generative AI features in Discover, without affecting web rankings."
    claims: [D1-C029, D1-C030, D1-C031]
  - term: "Google-Extended"
    definition: "A robots.txt control token, not a separate crawler, that decides whether crawled content may train future Gemini models and ground Gemini apps and Vertex AI. It does not affect inclusion or ranking in Google Search. A site can disallow it for a directory or for the whole site."
    claims: [D1-C086, D1-C032, D1-C522]
  - term: "Generative AI performance report"
    definition: "Search Console reports, rolled out worldwide by 31 August 2026, that show impressions, pages, countries, devices (Search only) and dates for generative AI features, with no clicks or queries. Since 24 September 2026 they also include multimodal searches; the regular Performance report still counts AI traffic too."
    claims: [D1-C124, D1-C062, D3-C438, D3-C465]
  - term: "Search profile"
    definition: "A profile publishers and creators can claim in Google Search, with name, photo, bio, links and pinned posts, which users can follow. In the US, 10,000 followers across YouTube, Instagram, X or TikTok qualify since 16 September 2026. Its verified accounts are added automatically as Search Console platform properties."
    claims: [D1-C025, D1-C125, D3-C468]
  - term: "Crawl budget"
    definition: "How much Google crawls a site: the combination of crawl rate limit and crawl demand, the finite resources Google allocates to crawling one website. A site with fewer than a few thousand URLs likely has no crawl budget problem, Google said."
    claims: [D1-C090, D1-C096, D1-C373, D1-C381]
  - term: "Crawl rate limit (hostload)"
    definition: "How much crawling a host can take, shared by all Google crawlers. It goes down when connect time, time to first byte, 429 or 5xx responses go up. It applies per host, so a site's CDN, subdomains and main www host may be counted separately. A drop is most of the time an abrupt step down, and Googlebot then opens fewer connections, a Google panelist said."
    claims: [D1-C091, D1-C092, D1-C132, D1-C376, D1-C493, D1-C494]
  - term: "Crawl demand"
    definition: "How much Google wants to crawl a site, driven by its quality, how often its URLs change and how popular they are. Demand from other Google products, such as Ads, counts too, a Google panelist said."
    claims: [D1-C093, D1-C538]
  - term: "robots.txt"
    definition: "A file in the root of each host (example.com/robots.txt) that tells crawlers which URLs they may fetch. It controls crawling, not indexing, applies only to its own host and is not a security measure: anyone can read it."
    claims: [D1-C084, D2-C058, D2-C209, D1-C515, D1-C514]
  - term: "Robots meta tag"
    definition: "An HTML tag in the head of a page that gives search engines page-specific rules, such as noindex or nosnippet, for indexing and display in results."
    claims: [D2-C054, D2-C056, D2-C057]
  - term: "X-Robots-Tag"
    definition: "An HTTP header that carries the same rules as the robots meta tag, also for files that are not HTML. Like the tag, Google only sees it on URLs it is allowed to crawl."
    claims: [D2-C069, D2-C095, D2-C529]
  - term: "noindex"
    definition: "A robots rule that tells Google not to show a page in search results. It works only if Google can crawl the page and see the rule."
    claims: [D2-C061, D2-C022]
  - term: "nofollow"
    definition: "A hint not to follow links or pass signals through them; as a page-level robots rule it covers every link on the page. It does not block crawling."
    claims: [D1-C127, D2-C063]
  - term: "nosnippet and data-nosnippet"
    definition: "nosnippet stops text snippets and video previews for a page and keeps its content out of AI Overviews and AI Mode as a direct input; the data-nosnippet attribute hides only a marked part of the page."
    claims: [D2-C070, D2-C072, D2-C076]
  - term: "max-snippet"
    definition: "A robots rule that caps a snippet at a number of characters: 0 means no snippet and -1 means no limit. It also limits how much of the page AI features may use."
    claims: [D2-C082, D2-C728]
  - term: "max-image-preview"
    definition: "A robots rule for the largest image preview Google may show: none, standard or large, for example in Discover."
    claims: [D2-C087]
  - term: "unavailable_after"
    definition: "A robots rule that lets a page drop out of search results after a set date and time."
    claims: [D2-C100, D2-C698]
  - term: "Soft 404"
    definition: "A page that returns a success code (200) while its content looks like an error or an empty page. Google keeps it out of the index but may keep crawling it. A CDN captcha page served with 200 is a common cause."
    claims: [D1-C073, D2-C334, D1-C367]
  - term: "Rendering"
    definition: "Running a page's JavaScript in a browser engine to see what users see. Google renders with Chromium and indexes the rendered HTML."
    claims: [D2-C112, D2-C126, D2-C131]
  - term: "Render queue"
    definition: "Where pages wait to be rendered after crawling: a few seconds, but it can take longer, and Google documents no upper limit. On Day 3 Google estimated hours in the queue and said everything in it gets rendered within weeks."
    claims: [D2-C170, D2-C172, D3-C625, D3-C629]
  - term: "Raw HTML and rendered HTML"
    definition: "The raw HTML is what the server sends; the rendered HTML is the page after its JavaScript has run. Google's testing tools show the rendered HTML, and differences between the two point to rendering problems."
    claims: [D2-C176, D2-C215]
  - term: "Viewport expansion"
    definition: "How Google sees content below the first screen without scrolling: it renders the page like a very long phone (around 10,000 pixels high, Google said at the event)."
    claims: [D2-C273, D2-C272]
  - term: "Lazy loading"
    definition: "Loading content only when it is needed. Triggered by an Intersection Observer it can work for Google; triggered by scroll events or clicks it does not."
    claims: [D2-C198, D2-C197, D2-C268]
  - term: "Single-page app (SPA)"
    definition: "A JavaScript application that changes views without full page reloads. Typical search risks: links without real URLs, # routes and error views that return 200."
    claims: [D2-C183, D2-C186, D2-C190, D2-C288]
  - term: "History API"
    definition: "The browser feature (pushState) that lets a single-page app use real, clean URLs instead of # fragments, so Google can follow its links."
    claims: [D2-C285, D2-C288]
  - term: "Shadow DOM"
    definition: "A browser feature that isolates a component's styles. Google flattens shadow DOM content when it renders a page, so the content can be indexed if it appears in the rendered HTML."
    claims: [D2-C228, D2-C235]
  - term: "Main content (centerpiece)"
    definition: "The part of a page that serves its purpose, as opposed to header, navigation and footer: any part that directly helps the page achieve its purpose, including images, video, tools and user-generated content. Google identifies it and treats it as the most important part of the page."
    claims: [D2-C310, D2-C028, D2-C862, D2-C870]
  - term: "Tokenization"
    definition: "Splitting text into small units. Google Search stores words (tokens) with metadata, while AI models split text into sub-word pieces mapped to numeric IDs."
    claims: [D2-C318, D2-C326, D2-C327]
  - term: "Posting list"
    definition: "A classic retrieval structure: for a token, the list of URLs that contain it. Google intersects the lists of a query's important words to find candidate pages."
    claims: [D2-C732, D2-C733, D2-C736]
  - term: "Vector embeddings"
    definition: "Numeric representations of parts of documents and of queries that form a vector space. Besides posting lists, Google can retrieve documents by how close their embeddings are to the query's embedding."
    claims: [D2-C740, D2-C741]
  - term: "Duplicate cluster"
    definition: "A group of pages Google considers essentially equivalent: it stores one in the index and keeps track of the other URLs."
    claims: [D2-C346, D1-C128]
  - term: "Canonical"
    definition: "The representative URL of a duplicate cluster, the one Google would ideally show; signals such as links are forwarded to it."
    claims: [D2-C347, D2-C348]
  - term: "rel=canonical"
    definition: "A link element in the head of a page that names the site owner's preferred URL. Google treats it as a strong signal, not an order."
    claims: [D2-C032, D2-C391, D2-C380]
  - term: "Alternate names"
    definition: "The other URLs of a duplicate cluster that Google keeps tracking, which is why an old domain can still appear after a site move."
    claims: [D2-C352, D2-C357]
  - term: "Canonical chain and canonical loop"
    definition: "A chain is a canonical pointing to a URL that leads on to another URL; a loop leads back to where it started. Google can follow chains but recommends pointing straight at the final URL; a community speaker called loops a structural conflict."
    claims: [D2-C419, D2-C420, D2-C424]
  - term: "hreflang"
    definition: "Annotations that tell Google which pages are language or regional versions of each other, so it can show the right one. They do not set a page's language."
    claims: [D2-C033, D2-C564, D2-C584]
  - term: "hreflang return link"
    definition: "The rule that if page X names page Y as a language version, page Y must name page X back; Google ignores annotations that point only one way."
    claims: [D2-C565, D2-C570]
  - term: "ccTLD"
    definition: "A country-code top-level domain such as .de, one of the strongest signals of which country a site targets."
    claims: [D2-C591, D2-C593]
  - term: "Index selection"
    definition: "The last step before Google's index: it calculates thresholds and decides which documents are kept, using the signals calculated earlier, such as quality, language, country and spam."
    claims: [D2-C682, D2-C688, D2-C687]
  - term: "Discovered – currently not indexed"
    definition: "A Page indexing report status: Google knows the URL but has not crawled it yet."
    claims: [D2-C707, D2-C706]
  - term: "Crawled – currently not indexed"
    definition: "A Page indexing report status: Google crawled the page but did not index it; the page does not need to be resubmitted."
    claims: [D2-C711, D2-C712]
  - term: "SpamBrain"
    definition: "Google's AI-based spam prevention system, launched in 2018 and continuously improved since; Google said it is now built on Gemini."
    claims: [D2-C671, D2-C669]
  - term: "Scaled content abuse"
    definition: "A Google spam policy against generating many pages mainly to manipulate rankings with little value to users, however they are made, including automated translation of scraped content."
    claims: [D2-C611, D1-C129]
  - term: "Structured data"
    definition: "Machine-readable markup that describes a page's content, so Google understands it more accurately and the page can become eligible for rich results."
    claims: [D2-C455, D2-C521]
  - term: "JSON-LD"
    definition: "The structured data syntax Google recommends: one contiguous block that is easier to write correctly. Microdata and RDFa are interpreted the same way."
    claims: [D2-C495, D2-C494]
  - term: "Schema.org"
    definition: "The shared markup vocabulary that major search engines announced together in June 2011; Google uses only the subsets its documentation declares."
    claims: [D2-C484, D2-C487]
  - term: "Rich results"
    definition: "Search results with extra visual features, such as review stars or recipe filters, usually powered by structured data. AI Overviews and AI Mode are not rich results."
    claims: [D2-C454, D2-C521, D3-C324, D3-C325]
  - term: "SHACL"
    definition: "A rule language for validating structured data. Google announced downloadable SHACL rules for each feature as coming soon."
    claims: [D2-C514, D2-C516]
  - term: "Rich Results Test"
    definition: "Google's tool to test and preview structured data: it shows the rich result features it detected and whether the markup is valid. It tests either a URL or a pasted code snippet."
    claims: [D2-C498, D1-C506]
  - term: "URL Inspection tool"
    definition: "Search Console's tool that shows how Google sees a URL, including the rendered HTML; its live test can differ from the indexed version."
    claims: [D2-C176, D2-C178]
  - term: "Search interest"
    definition: "Google Trends' measure: the share of all searches for a term, on a 0 to 100 scale. It is not search volume."
    claims: [D2-C784]
  - term: "Trending now"
    definition: "The Google Trends tab that shows what people are searching for on Google right now, with approximate, bucketed search volumes."
    claims: [D2-C765, D2-C768]
  - term: "Faceted navigation"
    definition: "Filters on listing pages whose combinations create very many URLs, for example the same facets in a different order; Google's guide prefers keeping filter URLs from being crawled."
    claims: [D1-C100, D1-C101]
  - term: "BERT, RankBrain and MUM"
    definition: "AI systems in Google Search: BERT understands words in the context of the sentence, RankBrain interprets the intent behind queries, and MUM is used only for specific applications, not general ranking. On Day 3 Google called BERT a predictive language model, technically an LLM."
    claims: [D1-C042, D1-C043, D1-C130, D3-C684]
  - term: "Query understanding"
    definition: "The first serving step: Google detects a query's language, separates its words, drops stop words where they matter little, recognises entities and expands the query with synonyms before looking it up. Google said it rewrites pretty much every query."
    claims: [D3-C006, D3-C012, D3-C016, D3-C028]
  - term: "Synonyms and siblings"
    definition: "Synonyms are words people use interchangeably, which Google adds to a query automatically even when they are not synonyms linguistically; siblings are related words in the same category that are not interchangeable, such as Canon and Nikon, so a search for one should not show the other."
    claims: [D3-C025, D3-C036, D3-C038, D3-C039]
  - term: "Stop words"
    definition: "Words such as 'a' and 'of' that Google removes from a query when it thinks they matter little; where they matter, Google tries to recognise the whole phrase, stop words included, as an entity."
    claims: [D3-C012, D3-C014]
  - term: "Retrieval"
    definition: "The serving step that looks up the query's words and their expansions in the index's posting lists and orders the candidates, by language, country and quality among other signals, before ranking starts."
    claims: [D3-C073, D3-C075, D3-C079, D3-C083]
  - term: "Commodity content"
    definition: "Content based on very common knowledge that anyone could have written, with little insight or added value, such as a generic top-10 buying-tips list. Non-commodity content offers a unique, expert or experienced take."
    claims: [D3-C178, D3-C179, D3-C180]
  - term: "Content quality (effort, originality, talent or skill, accuracy)"
    definition: "The four attributes Google's rater guidelines use for main content: the extent to which a human put effort, originality, talent or skill and accuracy into creating it."
    claims: [D3-C132, D3-C176]
  - term: "E-E-A-T"
    definition: "Experience, expertise, authoritativeness and trust, from Google's rater guidelines: first-hand experience, the necessary knowledge or skill, and being a go-to source. Trust comes first: untrustworthy pages have low E-E-A-T however expert they seem."
    claims: [D3-C222, D3-C223]
  - term: "Search quality raters"
    definition: "External reviewers who rate results for changes Google is testing, following the Search Quality Rater Guidelines. They cannot affect individual sites' rankings, and nothing in their guidelines is itself a ranking factor."
    claims: [D3-C159, D3-C160, D3-C163, D3-C168]
  - term: "Side-by-side and live traffic experiments"
    definition: "Google's ways of testing a Search change: raters compare results with and without the change side by side, and a change that does well then runs on a small slice of live traffic, usually starting at 0.1% of people."
    claims: [D3-C151, D3-C156, D3-C155]
  - term: "Core update"
    definition: "A significant, broad change to Google's ranking systems, made several times a year and announced on the Google Search Status Dashboard. Core updates do not target specific sites and are not penalties."
    claims: [D3-C259, D3-C260, D3-C262, D3-C258]
  - term: "Spam update"
    definition: "A notable improvement to Google's automated spam detection systems, such as SpamBrain, listed with its ranking updates. Spam updates target spam pages; to recover, a site removes the spam Google described."
    claims: [D3-C287, D3-C203, D3-C289]
  - term: "Back button hijacking"
    definition: "Interfering with the browser's back button, for example sending users to an auto-generated page instead of where they came from. An explicit violation of Google's malicious practices spam policy, enforced since 15 June 2026."
    claims: [D3-C208, D3-C209]
  - term: "Cloaking and doorways"
    definition: "Two spam types in Google's policies: cloaking shows different content to users and to search engines to manipulate rankings; doorways are pages made to rank for similar queries that lead users to less useful intermediate pages."
    claims: [D3-C278, D3-C279]
  - term: "AI slop"
    definition: "Low-quality, mass-produced AI-generated content. Google counts it as scaled content abuse and said it is going to great lengths to keep it out of its results."
    claims: [D3-C252, D3-C695, D3-C696]
  - term: "Hallucination"
    definition: "An AI model making things up when it lacks information or because of issues in its training. Google said it can happen with any model and, with current training methods, cannot be eliminated; grounding reduces it."
    claims: [D3-C686, D3-C688, D3-C687]
  - term: "PageRank and BackRub"
    definition: "PageRank is the link-analysis algorithm Google's founders invented; BackRub was their 1995 Stanford search engine, soon renamed Google. Google's ranking systems guide says PageRank has evolved and is still part of its core ranking systems."
    claims: [D3-C231, D3-C233, D3-C138]
  - term: "Universal search"
    definition: "Google's 2007 launch that blended results from Images, Maps, Books, Video and News into web results, so the results page mixes result types."
    claims: [D3-C307, D3-C306]
  - term: "Search features"
    definition: "Elements of the results page beyond plain text results, built as the last serving step after ranking, mostly from what Google extracted at indexing. Rich results are the features that usually need structured data; AI Overviews and AI Mode are not rich results."
    claims: [D3-C322, D3-C323, D3-C324, D3-C325]
  - term: "Site name"
    definition: "The name Google shows for a site in results, an attribution feature rather than a rich result. Google generates it automatically, and a site can indicate its preferred name with WebSite structured data on its home page."
    claims: [D3-C335, D3-C336]
  - term: "Review snippet"
    definition: "A rich result with an average star rating and often the number of reviews, from Review structured data. Self-serving reviews of a site's own business are not eligible."
    claims: [D3-C337, D3-C340]
  - term: "Google Discover"
    definition: "Google's Discover surface: indexed content that meets Discover's content policies is eligible automatically, with no special tags or structured data, and Discover uses many of the same signals and systems as Search."
    claims: [D3-C219, D3-C220]
  - term: "Merchant Center"
    definition: "Google's tool through which merchants send product data feeds for Shopping ads, Search ads and organic results. Products need it to appear in the Shopping tab; product rich results do not."
    claims: [D3-C352, D3-C346, D3-C343]
  - term: "Conversational attributes"
    definition: "Merchant Center feed attributes for AI shopping experiences such as AI Mode: question and answer, documents, related products, item group title, variant option and popularity rank. Retailers worldwide can use them since May 2026."
    claims: [D3-C365, D3-C362, D3-C367]
  - term: "Product highlights and product details"
    definition: "Two existing Merchant Center attributes Google now emphasises for AI: product_highlight, short bullets about the product itself, and product_detail, specifications as section, name and value."
    claims: [D3-C392, D3-C393, D3-C395]
  - term: "Storebot-Google"
    definition: "Google Shopping's own crawler. It crawls more often than Googlebot, goes through product, cart and checkout pages to verify merchant data, and robots.txt rules for it affect all Google Shopping surfaces."
    claims: [D3-C385, D3-C388, D3-C389]
  - term: "Universal Commerce Protocol (UCP)"
    definition: "An open standard for agentic commerce, covering discovery, buying and post-purchase support, launched by Google on 11 January 2026 with retailers and platforms."
    claims: [D3-C398, D3-C397]
  - term: "Query groups"
    definition: "Search Console groups of queries with very similar intent written differently, computed with AI and titled with the most prominent query. Shown in Search Console Insights for properties with many queries; they do not affect ranking."
    claims: [D3-C413, D3-C422, D3-C463]
  - term: "AI-powered configuration"
    definition: "An experimental Search Console chat box that turns a natural-language request into Performance report filters, applied only after the user confirms."
    claims: [D3-C429, D3-C431, D3-C464]
  - term: "Platform properties"
    definition: "Search Console properties for Instagram, TikTok, X or YouTube accounts, verified through a pop-up from the platform, that show how the account's content performs on Google Search, Discover and Google News."
    claims: [D3-C443, D3-C446, D3-C467]
  - term: "Multimodal search type"
    definition: "A Search Console search type, since September 2026, for searches made with images: Google Lens, Circle to Search, images uploaded to Google Search and Chrome's image search."
    claims: [D3-C458, D3-C459, D3-C465]
  - term: "Branded queries filter"
    definition: "A Search Console filter that splits branded from non-branded queries with an internal AI-assisted system, not a regular expression, on top-level properties with enough queries."
    claims: [D3-C473, D3-C499]
  - term: "Search Console bulk data export"
    definition: "The export of Search Console performance data to BigQuery, the most complete query dataset available, with anonymized queries excluded, a community speaker's slide said."
    claims: [D3-C475, D3-C471]
  - term: "Messy middle"
    definition: "Google's model, used since 2019, of what happens between the trigger of a purchase journey and the purchase: people loop between exploring and evaluating until they feel confident enough to buy."
    claims: [D3-C546, D3-C547, D3-C549]
  - term: "Brand heuristic"
    definition: "A cognitive shortcut in which consumers use a brand's name and reputation as a proxy for product quality, reliability and value, especially in the final reassurance step."
    claims: [D3-C577, D3-C578]
  - term: "Boosted consumers"
    definition: "Google's term for consumers who hand AI the mental effort of a purchase decision without surrendering the choice, and feel more confident thanks to ease, assistance and suggestion."
    claims: [D3-C559, D3-C561, D3-C563, D3-C568]
  - term: "Downstream impact"
    definition: "The effect SEO work has on other channels, such as direct visits or paid search, which a community speaker advised measuring when AI answers take clicks."
    claims: [D3-C515, D3-C517]
  - term: "Web Guide"
    definition: "A Google Search experiment, introduced in Search Labs in July 2025, that uses a custom version of Gemini and query fan-out to group web results into categories with a short summary for each."
    claims: [D3-C707, D3-C712]
  - term: "Honest Results Policy"
    definition: "Google's policy that no website gets an advantage in Search because it is a Google client or partner or has a personal relationship with Google; the Search team gives no site special treatment, and Google does not accept payment to rank websites in organic search."
    claims: [D1-C178, D1-C179, D1-C143]
  - term: "Contractual crawlers (special-case crawlers)"
    definition: "Google crawlers that serve a specific product by agreement with the crawled site, and the only Google crawlers that may ignore robots.txt; AdsBot, for example, ignores the global user agent with the ad publisher's permission."
    claims: [D1-C330, D1-C343]
  - term: "User-triggered fetchers"
    definition: "Fetchers that request a page because a user asked for it, such as a translation service. Google's documentation says they generally ignore robots.txt, and Google said AI agents acting for a user fall into the same category."
    claims: [D1-C273, D1-C434, D1-C435]
  - term: "Crawl Stats report"
    definition: "A Search Console report, under Settings, that shows how much Google crawls a site, the responses and errors it received, the file types fetched by its crawlers and the split between discovery of new URLs and refresh of known ones."
    claims: [D1-C339, D1-C340, D1-C393, D1-C396]
  - term: "Crawl scheduler"
    definition: "The part of Google's crawling that hands the crawler an ordered list of URLs from the crawl queue, putting pages that change often first; Google rarely discusses it in public because the details get taken out of context."
    claims: [D1-C332, D1-C333, D1-C327]
  - term: "HTTP status code classes"
    definition: "1xx informational, 2xx success, 3xx redirection, 4xx client error and 5xx server error. Each class affects crawling differently, and 429 is the 4xx code that tells Google to slow down instead of saying there is nothing at the URL."
    claims: [D1-C345, D1-C353]
  - term: "Similar URLs"
    definition: "Technically different URLs that differ in only a few characters, such as protocol or host, capitalisation, delimiters, the encoding of a space or the order of parameters; a community speaker treated them as a sign of duplicate content and other technical issues."
    claims: [D1-C398, D1-C399, D1-C397]
  - term: "WebMCP"
    definition: "Web Model Context Protocol: a proposed web standard that lets a site declare the actions it offers AI agents, through declarative HTML annotations or imperative tools. Chrome offers it for testing through an origin trial or a flag."
    claims: [D1-C281, D1-C283, D1-C316]
  - term: "ARIA"
    definition: "Accessible Rich Internet Applications: attributes, not a programming language, that add accessibility information to HTML, such as role=button and aria-label on a div used as a button. No ARIA is better than bad ARIA, a community speaker warned."
    claims: [D1-C279, D1-C280]
  - term: "Cumulative Layout Shift (CLS)"
    definition: "The Core Web Vitals metric for visual stability. A community speaker said layout shifts, such as a button popping in after the first load, annoy users and may confuse AI agents."
    claims: [D1-C275]
  - term: "Search agents (information agents)"
    definition: "AI Mode agents set up by typing a natural-language request, which AI Mode interprets to create an alert; Google said they launched globally a day or two before 30 September 2026."
    claims: [D1-C194, D1-C192]
  - term: "Transformer"
    definition: "The neural network architecture of the paper 'Attention Is All You Need', the T in ChatGPT, which Google said it created and published to move the industry forward, competitors included."
    claims: [D1-C161]
  - term: "Google Lens"
    definition: "Google's visual search, which Google said it built after seeing young users upload pictures and expect answers about them; more than 1.5 billion people use it every month, according to Google's May 2025 announcement."
    claims: [D1-C188, D1-C191]
  - term: "Hub pages"
    definition: "Pages such as the homepage or category pages that link out to new or updated pages. Google may visit them more often, and recommended them over HTML sitemaps."
    claims: [D1-C202, D2-C838]
  - term: "cats.txt"
    definition: "A file an SEO created as a satirical take on llms.txt, showing that crawlers fetch whatever files they find. Google said such files have no importance for Google Search."
    claims: [D1-C472, D1-C473]
  - term: "Lost in the middle"
    definition: "A pattern research has found in large language models, which a community speaker linked to the serial-position effect in human memory: information in the middle of a text is used less than at the start or end. Google has not said its systems behave this way."
    claims: [D1-C414, D1-C417]
  - term: "Video watch page"
    definition: "A page dedicated to one video. Google said a video without one is not going to be indexed, and its Video indexing report help says only videos on a watch page are eligible for indexing."
    claims: [D2-C916, D2-C942]
  - term: "Video sitemap"
    definition: "A sitemap or feed that tells Google which URLs carry videos, so it can visit them without checking every page; Google said it ingests video sitemaps much more often than it can process HTML pages."
    claims: [D2-C925, D2-C926, D2-C556]
  - term: "noimageindex"
    definition: "A robots meta rule that tells Google not to index the images on a page. Google said it also affects the page's videos, because a video's thumbnail is an image."
    claims: [D2-C934, D2-C935]
  - term: "Googlebot-Image and Googlebot-Video"
    definition: "The Google crawlers that fetch images and videos; robots.txt rules for their user agent tokens control how Google indexes a site's images and videos."
    claims: [D2-C931, D2-C932]
  - term: "Redirect map"
    definition: "The migration document that gives every old URL an approved destination; a community speaker also recorded, per URL, what must survive, who approves and the test that proves it works."
    claims: [D2-C895, D2-C899]
  - term: "Change of Address tool"
    definition: "A Search Console tool for telling Google that a site moved from one domain or subdomain to another; Google's site move guide pairs it with submitting the new sitemap and updating internal links."
    claims: [D2-C912, D2-C884]
  - term: "Bidirectional text"
    definition: "Text that mixes right-to-left scripts, such as Persian or Arabic, with left-to-right text, which can display in a confusing order in titles, product names and URLs."
    claims: [D2-C963, D2-C964]
  - term: "Transliterated queries"
    definition: "Searches typed in Latin letters for a language written in another script, such as Persian or Hindi, with the same intent as a search in the native script; Google says a Hindi searcher typing in Latin letters may want and get Hindi results written either way."
    claims: [D2-C965, D2-C981]
  - term: "Prompt journalism"
    definition: "A community speaker's name for journalistic and content work, such as interviews and podcasts, done with a prompt-assisted workflow that optimises material already recorded rather than creating more content."
    claims: [D2-C953]
  - term: "RFC 9309 (Robots Exclusion Protocol)"
    definition: "The IETF standard for robots.txt, officially the Robots Exclusion Protocol (REP), supported by basically all major crawlers. It controls which automated clients may access which URLs, not how the content is used, and parsers must skip lines they cannot parse."
    claims: [D1-C512, D1-C513, D1-C518]
  - term: "User-agent group"
    definition: "In robots.txt, one or more user-agent lines followed by their allow and disallow rules. A crawler follows only the most specific group that names it, so groups do not add up; Google combines all groups that name the same user agent."
    claims: [D1-C519, D1-C080, D1-C533, D1-C527]
  - term: "robots.txt report"
    definition: "A Search Console report that shows the robots.txt file as Google last fetched it, with a version history and the errors and successes of each fetch. Google said it uses Google's open-source robots.txt parser."
    claims: [D1-C528, D1-C530]
  - term: "Redirect chain"
    definition: "A series of redirects from one URL to the next. Google's crawlers follow up to 10 hops by default; robots.txt is checked for every URL in the chain, and Search Console reports a block on the first URL, a community speaker said."
    claims: [D1-C370, D1-C534, D1-C535]
