# Developer kit: what a web development team needs to build an SEO-compatible website.
# Single source of truth for 60-outputs/dev/ and 60-outputs/agent-pack/dev-requirements.json (built by _system/kits.py).
# Every requirement cites public claims (20-claims/day1.yaml, day2.yaml, day3.yaml) and Google pages (keys of 20-claims/sources.yaml).
# level: MUST | SHOULD | MAY | AVOID (AVOID = must not). status: documented (a cited Google doc states or supports it)
# | event-only (rests only on undocumented event claims). snippet: key of 25-kits/snippets/<key>.md.
# Names: a person is named only where a cited claim's who holds that proven name (the build checks it); otherwise credit Google or "a community speaker".
areas:
  - id: server-crawling
    title: Server, status codes and crawling
    intro: >-
      How the server answers Google's crawlers decides whether anything else on the site matters. These requirements cover reachability through firewalls and CDNs, status codes for outages and overload, robots.txt on every host, HTTP versions and caching headers.
    requirements:
      - id: DEV-SRV-01
        level: MUST
        title: "Let verified Google crawlers through firewalls, CDNs and bot protection"
        why: >-
          Google does not know that a firewall or bot-protection rule is blocking it; it only sees failing requests. Timeouts, connection resets and DNS errors are treated like 5xx errors: crawling slows down at once, and indexed URLs that stay unreachable drop out of the index within days.
        how: >-
          Allowlist Google's crawlers in WAF, CDN and bot-management rules by the IP ranges Google publishes for its common and special-case crawlers (common-crawlers.json, special-crawlers.json), or by reverse DNS to crawl-*.googlebot.com or geo-crawl-*.geo.googlebot.com hosts; never by user-agent string alone (it is trivial to fake), and never by a whole googleusercontent.com host, where Google Cloud customers' machines resolve too. Do not rate-limit or challenge verified Googlebot with CAPTCHAs or JavaScript puzzles, which it cannot solve. Make sure DNS resolves reliably for every host that serves pages, scripts, styles or APIs. Review the rules after every CDN or security-vendor change, including rules written for HTTP/3 traffic or AI scrapers. When Search Console reports DNS or network errors, first ask the hosting provider, CDN or DNS provider what changed and check for recently added firewall rules: said at Search Central Live, most network errors happen between the origin and Google's data centres, where neither Google nor the site owner can see them.
        test: >-
          Search Console Crawl stats report: host status shows no robots.txt fetch, DNS resolution or server connectivity failures, and no Search Console alert for DNS errors, which can get a site removed from Google Search very aggressively and, with it, from every feature that depends on Search. URL Inspection live test succeeds for one URL per template. WAF/CDN logs show no 403, 429 or challenge responses to IPs that verify as Googlebot.
        snippet: verify-googlebot
        claims: [D1-C069, D1-C126, D2-C374, D2-C375, D1-C138, D1-C358, D1-C359, D1-C360, D1-C361, D1-C362, D1-C363]
        docs: [crawling-december-cdns, dns-network-errors, verify-google-requests, crawlers-overview]
        status: documented
      - id: DEV-SRV-02
        level: AVOID
        title: "Never serve bot challenges or error pages to crawlers with a 200 status"
        why: >-
          Google finds a bot-challenge page very hard to recognise as an error. Served with 200 on many URLs, the identical page can make Google cluster those URLs as duplicates and drop them, and recovery is slow because Google has little reason to recrawl duplicates. A 200 error page is also a soft 404.
        how: >-
          If a crawler must get a challenge or block page, send it with 503 (temporary), as Google's CDN guidance recommends for bot-verification interstitials, or 429 for rate limiting; never 200. Most CDN and bot-management products let you set the status code of challenge responses. Better still, do not challenge verified Google crawlers at all (DEV-SRV-01). A CDN that throttles crawlers by injecting 429 or 503 responses on the network path shows up as a rise in HTTP errors in crawl reports.
        test: >-
          Request a few URLs with a Googlebot user agent from an unverified IP: any challenge comes back as 503 or 429, never 200. The Page indexing report shows no sudden rise of "Duplicate" or "Soft 404" on unrelated URLs.
        claims: [D2-C376, D2-C374, D2-C375, D1-C078, D2-C378, D1-C367, D1-C364]
        docs: [crawling-december-cdns, http-network-errors]
        status: documented
      - id: DEV-SRV-03
        level: MUST
        title: "Answer planned maintenance and short outages with 503, for a day or two at most"
        why: >-
          5xx and 429 responses make Google slow down temporarily and keep already indexed URLs for a while, but URLs that keep failing are eventually dropped. A 200 "we'll be back soon" page becomes a soft 404 or replaces your content in the index, and a 404 removes the URLs. Google's crawl rate guide says crawling picks up again automatically once the errors drop. Said at Search Central Live (October 2026): Google lowers a site's crawl capacity within about four hours of a burst of 500 errors, while increases take one to three weeks, so a botched maintenance window can cost weeks of crawling.
        how: >-
          During maintenance return 503 for every page (Retry-After is optional standard HTTP), keep robots.txt answering normally, and limit the 503 period to one or two days. For a longer pause keep the site online with reduced functionality, for example a disabled cart and an information banner, and update Product markup to the real availability. Use 503 or 429 only for genuine outages or overload, never as a permanent throttle.
        test: >-
          In a maintenance drill, curl -I on any page returns 503 while curl -I on /robots.txt returns 200. Afterwards, the 5xx share in Crawl stats falls back to zero.
        snippet: http-503-maintenance
        claims: [D1-C071, D1-C126, D2-C012, D1-C078, D2-C342, D3-C618, D3-C619, D3-C668, D3-C621, D1-C353, D1-C354]
        docs: [pause-online-business, http-network-errors, dns-network-errors, reduce-crawl-rate]
        status: documented
      - id: DEV-SRV-04
        level: MUST
        title: "Keep robots.txt reachable on every host: 200 with rules, or 404 if there are none"
        why: >-
          If robots.txt answers with a 5xx error, Google stops crawling the site for the first 12 hours and then relies on a cached copy for up to 30 days. robots.txt rules apply per host, so the file on www.example.com does nothing for api.example.com or a CDN host name, and the file is read only at the root of a host: a robots.txt in a subdirectory is never used.
        how: >-
          Serve the file at the root path /robots.txt on every host name that serves pages or rendering resources: www, the bare domain if it answers, API, static and CDN hosts, every country subdomain. Answer 200 with the rules, or 404 if the host has no rules (Google then crawls everything). Exclude robots.txt from maintenance modes, WAF challenges and authentication, and never let an API or CDN host fall back to a blanket Disallow or an error page.
        test: >-
          curl -I https://<each-host>/robots.txt returns 200 or 404, never 5xx, 401/403 or a redirect to a login page. Search Console's robots.txt report (Settings) shows each host's file as fetched.
        snippet: robots-txt
        claims: [D1-C074, D2-C209, D2-C210, D1-C515]
        docs: [robots-spec, pause-online-business]
        status: documented
      - id: DEV-SRV-05
        level: MUST
        title: "Rely only on the fields Google supports (user-agent, allow, disallow, sitemap) and keep robots.txt under 500 KiB"
        why: >-
          Robots.txt is an IETF standard, RFC 9309, that basically all major crawlers follow, and it was kept simple on purpose. Google supports only user-agent, allow, disallow and sitemap in robots.txt; it ignores other lines, such as crawl-delay or Content-Signal, so they save no crawl budget with Google but can stay for other crawlers as long as they never sit between user-agent lines (DEV-SRV-06). Google reads only the first 500 KiB of the file and generally caches it for up to 24 hours, so a change can take a day to apply. Google refreshes its cached copy every 24 hours (its service level objective, as RFC 9309 asks), and the Request a recrawl option in Search Console's robots.txt report refreshes it sooner.
        how: >-
          Everything is allowed by default, so use allow only to re-open a path inside a disallowed one. Cover URL patterns with the * and $ wildcards instead of listing URLs: * matches any run of characters (Disallow: /*/live/ blocks /science/live/ and /sports/live/, and Allow: /science/live/ re-opens one of them), and $ ends the match (Disallow: / with Allow: /$ leaves only the home page open to that group). The longest matching rule wins and, when rules conflict, Google uses the least restrictive one. A crawler follows only the most specific group that names it, so give each named crawler a complete group (DEV-SRV-10). Start comments with # and spell field names exactly: said at Search Central Live, robots.txt is forgiving, Google skips a line it cannot parse and still uses the rest of the file, so a misspelt rule fails silently (Google's open-source parser happens to accept some misspellings of disallow and user-agent, but not of allow, and other crawlers may be stricter). Add the Sitemap line with an absolute URL. To slow Google down in an emergency, return 503 or 429 briefly instead of inventing directives. Plan robots.txt changes a day ahead; for an urgent change, request a recrawl in the robots.txt report. Listing the sitemap in robots.txt is fine, but it makes the sitemap public; submit it only in Search Console if that matters.
        test: >-
          Check the file's fetch status, warnings and errors in Search Console's robots.txt report and test it with an RFC 9309 parser such as Google's open-source robots.txt library (github.com/google/robotstxt); check the size is well under 500 KiB; spot-check important URLs (homepage with tracking parameters, JS bundles, API endpoints, filter URLs) against the rules.
        snippet: robots-txt
        claims: [D1-C084, D1-C085, D1-C080, D1-C081, D1-C082, D1-C108, D1-C140, D3-C613, D3-C614, D3-C615, D3-C667, D1-C512, D1-C516, D1-C517, D1-C518, D1-C520, D1-C521, D1-C525, D1-C532, D1-C528]
        docs: [robots-spec, robots-txt-report, submit-updated-robots-txt, robotstxt-parser]
        status: documented
      - id: DEV-SRV-06
        level: AVOID
        title: "Do not put Content-Signal or other non-standard lines between user-agent lines"
        why: >-
          Googlebot ignores an unknown line placed between two user-agent lines and merges both user agents into one group, so the rules that follow apply to both. A Google slide at Search Central Live showed Bing closing the group at that line instead, so the same file blocks one crawler and not the other. Google's robots.txt talk called this the real trouble spot of the format: while RFC 9309 was being written, opinions on whether the first crawler should inherit the rules that follow split roughly 50-50. Managed robots.txt files from some CDNs add such lines, and said at Search Central Live, CDNs sometimes update a site's robots.txt without the owner's knowledge.
        how: >-
          Keep each group as an uninterrupted run of user-agent lines followed by its allow and disallow rules. If a CDN or plug-in adds Content-Signal or other non-standard lines, make sure they sit after a group's rules, never between user-agent lines, and review the generated file after every CDN setting change. Check the version history in Search Console's robots.txt report for changes nobody on the team made.
        test: >-
          Fetch the live file (curl https://www.example.com/robots.txt) and check that every run of user-agent lines is uninterrupted; test it in Bing Webmaster Tools' robots.txt tester and with Google's open-source robots.txt parser (github.com/google/robotstxt). The robots.txt report's latest fetched version matches the file the team deployed.
        claims: [D1-C087, D1-C123, D1-C088, D1-C526, D1-C529, D1-C528]
        docs: [robots-spec, robots-txt-report]
        status: documented
      - id: DEV-SRV-07
        level: MUST
        title: "Answer crawlers over HTTP/1.1 (HTTP/2 optional); never run a crawlable host on HTTP/3 only"
        why: >-
          Google's crawlers support HTTP/1.1, their default, and HTTP/2, and use whichever crawls best; Googlebot does not support HTTP/3 today. HTTP/2 can save server resources but gives no ranking benefit, and a site can opt out of HTTP/2 crawling by answering such requests with 421.
        how: >-
          Make every crawlable host answer over HTTP/1.1. HTTP/2 may save server resources and is worth enabling on the origin and the CDN; to opt out of HTTP/2 crawling, return 421 to Google's HTTP/2 requests. Treat HTTP/3 as an extra for browsers. Check that CDN, firewall and load-balancer rules written for HTTP/3 (QUIC) traffic do not break HTTP/1.1 or HTTP/2 responses. Support gzip or Brotli compression, which Google's crawlers accept.
        test: >-
          curl -I --http1.1 https://www.example.com/ returns 200, and curl -I --http2 https://www.example.com/ returns the same status, canonical, robots and caching headers (Date and similar headers may differ), unless the site deliberately answers 421 to opt out of HTTP/2 crawling; Crawl stats shows normal response times.
        claims: [D1-C076, D1-C075, D1-C077, D1-C139]
        docs: [crawlers-overview]
        status: documented
      - id: DEV-SRV-08
        level: SHOULD
        title: "Support conditional requests with ETag or Last-Modified and answer 304 when nothing changed"
        why: >-
          A 304 Not Modified response tells Google to reuse its copy, so unchanged pages cost almost nothing to recrawl. Google lists HTTP cache control among the ways to manage crawl budget, and its crawling team has said it prefers ETag.
        how: >-
          Send a strong ETag (a hash of the content) or Last-Modified on HTML and on the JS, CSS and API responses used for rendering, and answer If-None-Match or If-Modified-Since with 304 and no body when nothing changed. Derive the ETag from the content only, not from timestamps, nonces or session data, and keep it identical across CDN nodes.
        test: >-
          curl -sI https://www.example.com/page shows an ETag; repeating the request with -H 'If-None-Match: "<etag>"' returns 304. The Crawl stats response breakdown shows 304 responses.
        snippet: conditional-requests
        claims: [D1-C104, D1-C103, D1-C321, D1-C350, D1-C384]
        docs: [crawl-budget-guide, crawling-december-caching]
        status: documented
      - id: DEV-SRV-09
        level: AVOID
        title: "Do not answer crawlers with 401, 402 or 403 on pages that should be in Search"
        why: >-
          Google does not index URLs that return a 4xx status (except 429) and removes already indexed ones. Said at Search Central Live by Gary Illyes: Google has recently seen more 403 responses to its crawlers (described on stage as "authentication required"), treats them as client errors like 404 or 410 and drops those pages from Search and its AI features; more recently still it has seen an uptick in 402 Payment Required responses, which it treats as a 404 because Googlebot cannot pay. A 403 tells the crawler it may not see the content, so there is nothing to index.
        how: >-
          Check that login walls, paywalls, geo-blocks and bot-management rules never return 401, 402 or 403 to verified Google crawlers on public pages. For paywalled articles serve the content with the paywalled-content markup instead of an error (DEV-SDA-13). Keep 401 and 403 for pages that must stay out of Search, such as account areas.
        test: >-
          Crawl stats and server logs show no 401, 402 or 403 responses to verified Googlebot on indexable templates, and URL Inspection's live test returns 200 for one URL per template.
        claims: [D1-C365, D1-C366, D1-C352, D1-C351, D1-C509]
        docs: [http-network-errors, page-indexing-help, paywalled-content-sd]
        status: documented
      - id: DEV-SRV-10
        level: MUST
        title: "Give a crawler its own robots.txt group only when needed, and make that group complete"
        why: >-
          Robots.txt groups are not additive. A crawler obeys only the most specific group that names it and ignores the * group, so a Googlebot group that blocks only /dogs/ leaves Googlebot free to crawl the /goats/ and /cows/ that the * group blocks (Dave Smart's example at Search Central Live). One group can name several crawlers, and Google combines all groups that name the same user agent into one. In the robots.txt quiz of Google's talk, a Googlebot group with only an allow rule, or an allow rule in the * group, was the wrong answer for opening /staging/preview/ to Googlebot while keeping the rest of /staging/ closed.
        how: >-
          Put the rules every crawler shares in the * group. Add a named group (Googlebot, Storebot-Google, an AI crawler token) only when that crawler needs different rules, and copy into it every rule from the * group that should still apply to it. To give several crawlers the same rules, list their user-agent lines on top of one group. Generate the file from one template so that a change to the shared rules updates every named group too.
        test: >-
          For each named group, run Google's open-source robots.txt parser (github.com/google/robotstxt) with that crawler's token against a list of sample URLs covering every path the * group disallows: each result is the one intended for that crawler. For the quiz case, /staging/preview/ is allowed and /staging/other/ disallowed for Googlebot.
        snippet: robots-txt-groups
        claims: [D1-C533, D1-C531, D1-C527, D1-C519, D1-C080]
        docs: [robots-spec, robotstxt-parser]
        status: documented
      - id: DEV-SRV-11
        level: AVOID
        title: "Never use robots.txt to hide private paths; protect them with authentication"
        why: >-
          Robots.txt is not a security measure: it sits at a predictable public address, so anyone can read the paths it disallows, and it only asks well-behaved crawlers not to fetch them. Google's guide says it is not a mechanism for keeping a page out of Google: a disallowed URL can still be indexed if other sites link to it, and Google points to password protection for private files.
        how: >-
          Put admin areas, internal tools, exports and staging behind authentication or an IP allowlist (DEV-CAN-07), or keep them off the internet; do not list their paths in robots.txt. To keep a public page out of Search, use noindex and leave it crawlable (DEV-IDX-01).
        test: >-
          The live robots.txt names no admin, backup, export or internal paths, and curl -I on each private path returns 401 or 403 without credentials.
        claims: [D1-C514]
        docs: [robots-intro]
        status: documented

  - id: urls-links
    title: URLs, links and discovery
    intro: >-
      Google discovers pages through the links it extracts from HTML and sends them back to the crawl queue; links also tell it how a site is structured and feed ranking. Every page that should rank needs a real URL and a real link to it.
    requirements:
      - id: DEV-URL-01
        level: MUST
        title: "Make every navigational link an <a> element whose href holds a real URL"
        why: >-
          Google extracts links from a elements with an href holding an absolute or relative URL, once from the server HTML and again from the rendered page, and uses them to discover pages, understand the site's structure and rank. Googlebot does not click, so a link that only works through JavaScript leaves its target without a link Google can reliably extract.
        how: >-
          Audit every component that outputs links: main and sub-navigation, breadcrumbs, pagination, filters, product tiles, footers and language selectors. Each needs <a href="/real/path">, and framework link components must render that href. Client-side routing may intercept the click as long as the href stays (DEV-URL-03). Do not rely on plain-text URLs or on sitemaps alone for discovery.
        test: >-
          In URL Inspection (rendered HTML) and in a crawler with JavaScript off and on, every navigation item appears as <a href="...">; a crawl from the homepage reaches all key templates through links; search the rendered HTML for onclick=, javascript:, routerLink and href="#".
        snippet: crawlable-links
        claims: [D2-C039, D2-C043, D2-C038, D2-C169, D2-C287, D2-C036]
        docs: [links-crawlable, javascript-seo-basics]
        status: documented
      - id: DEV-URL-02
        level: AVOID
        title: "Do not navigate with onclick handlers, javascript: URLs, routerLink without href or # pseudo-links"
        why: >-
          A Google slide put onclick-only links, javascript: URLs, routerLink without href and href on non-a elements under "cannot extract"; Google's link documentation calls them not recommended and says Google may still try to parse them. Either way they are not dependable for discovery, and they are common in single-page apps and faceted navigation.
        how: >-
          Replace each pattern with <a href="/path">. Keep buttons for actions that do not change the URL (add to cart, open a dialog). Use URL fragments only where you deliberately do not want Google to follow, such as filter combinations (DEV-URL-08).
        test: >-
          Search templates and the rendered HTML (DevTools Elements panel, URL Inspection) for onclick navigation, javascript:, routerLink without href, href on span or div, and href="#/"; a JavaScript-rendering crawler finds no orphaned templates.
        snippet: crawlable-links
        claims: [D2-C040, D2-C041, D2-C042, D2-C043, D2-C184, D2-C186]
        docs: [links-crawlable, javascript-seo-basics, fix-search-javascript]
        status: documented
      - id: DEV-URL-03
        level: MUST
        title: "Route single-page apps with the History API and real paths, not # fragments"
        why: >-
          A fragment (the part of a URL after #) exists only in the browser and is often ignored by crawlers, so hash-routed views are not separate pages for Google. Google recommends the History API for clean URLs, and moving from hash routes to real paths keeps the same client-side behaviour.
        how: >-
          Run the router in history mode. Render links as <a href="/path">, intercept the click, call history.pushState and handle popstate. Configure the server or hosting rewrites so a direct request to every valid path returns 200 with the page, ideally server-rendered, and unknown paths return 404 (DEV-ERR-02). Real paths also work as deep links on Android, iOS and desktop.
        test: >-
          Open a deep URL directly in a fresh browser session and with curl: it returns 200 and the right content. The rendered HTML in URL Inspection contains no href="#/..." routes.
        snippet: spa-history-routing
        claims: [D2-C185, D2-C284, D2-C285, D2-C288, D2-C286, D2-C289]
        docs: [javascript-seo-basics, fix-search-javascript]
        status: documented
      - id: DEV-URL-04
        level: MUST
        title: "Link every indexable page from the normal navigation or a hub page"
        why: >-
          Discovery works through links: the homepage links to sections, which link to further pages, and Google infers a page's importance from its internal links (how many point to it and how many steps it is from the homepage). A page reachable only through a sitemap is found slowly and attracts little crawl demand. For large sites, Google pointed to category hub pages rather than HTML sitemaps.
        how: >-
          Link menus to category pages, category pages to sub-categories and sub-categories to every product or article, all with <a href>. Keep important pages within a few clicks of the homepage. Where not every item can be linked, list the rest in the XML sitemap or a Merchant Center feed as a supplement, not a replacement. Never let a page be reachable only through a canonical tag (DEV-CAN-04).
        test: >-
          Crawl from the homepage following only <a href> links and compare the result with the sitemap: sitemap URLs missing from the crawl are orphans. Check the click depth of key templates.
        claims: [D1-C040, D2-C005, D2-C006, D2-C820, D2-C003, D1-C067, D2-C838, D1-C202]
        docs: [how-search-works, ecommerce-site-structure]
        status: documented
      - id: DEV-URL-05
        level: SHOULD
        title: "Publish XML sitemaps listing only canonical, indexable URLs with accurate lastmod"
        why: >-
          A sitemap listed in robots.txt can be picked up by any crawler; one that is not listed has to be submitted, for example in Search Console. Sitemap inclusion is a weak canonical signal, so a sitemap full of redirects, parameters or noindexed URLs sends mixed signals.
        how: >-
          Generate sitemaps from the same source as the canonical tags: only URLs that return 200, are indexable and are their own canonical. Change lastmod only for significant updates (main content, structured data or links), never for footer, copyright or timestamp changes; Google uses lastmod only when it is consistently accurate. Split files at 50,000 URLs or 50 MB uncompressed under a sitemap index, and add hreflang (DEV-INT-05), image (DEV-IMG-04) and video (DEV-VID-04) entries where used. Reference the index in robots.txt and submit it in Search Console.
        test: >-
          Crawl the sitemap URLs: every one returns 200, has a self-referencing canonical and no noindex. The Sitemaps report shows each file as read, and the Page indexing report filtered by sitemap shows how many listed URLs are indexed.
        snippet: xml-sitemap
        claims: [D2-C017, D2-C018, D2-C391, D2-C390, D1-C067, D2-C833, D2-C842, D2-C843, D1-C475, D1-C337, D1-C336]
        docs: [build-sitemap, robots-spec, consolidate-duplicate-urls, crawl-budget-guide]
        status: documented
      - id: DEV-URL-06
        level: MUST
        title: "Give each page of a paginated series its own URL, its own canonical and an <a href> to the next page"
        why: >-
          Google's crawlers do not click "next" buttons, and rel=next and rel=prev are no longer used. Pointing the canonical of page 2 and later at page 1 is incorrect because the pages are not duplicates, and items listed only on later pages may never be indexed. A remark at Search Central Live that a canonical to page 1 can sometimes make sense was hedged; the documented rule stands.
        how: >-
          Use ?page=n (or /page/n/) URLs, with page 1 at the clean listing URL. Each page carries a self-referencing canonical and <a href> links to the next page and back to page 1, ideally also to nearby pages; titles and descriptions may stay the same across the series, so a page number in the title is optional. Never put page numbers in # fragments. Keep sort and filter variants out of the crawl (DEV-URL-08).
        test: >-
          For pages 1 to 3 of a listing, curl the HTML: the canonical is self-referencing and the next-page <a href> is present without JavaScript. URL Inspection shows later pages as indexable.
        snippet: pagination-links
        claims: [D1-C115, D2-C395, D2-C394, D2-C393, D1-C114, D2-C832]
        docs: [pagination-guide, rel-canonical-mistakes-blog]
        status: documented
      - id: DEV-URL-07
        level: MUST
        title: "Back infinite scroll and load-more buttons with paginated URLs"
        why: >-
          Google renders a page in a very tall viewport instead of scrolling, which is not efficient and can miss content; a figure of around 10,000 pixels was said at Search Central Live but is not documented. Content that appears only after scrolling beyond that, or after clicking "load more", stays invisible unless each chunk also has its own URL. Said at Search Central Live: a Google panelist called pagination one of the trickiest things in web development and a switch to infinite scroll or a load-more button risky, depending on what you want to achieve, because Googlebot does not click buttons; without crawlable links to them, Google does not see the further pages at all.
        how: >-
          Build load-more and infinite scroll on top of the paginated series (DEV-URL-06): each chunk has a persistent, unique URL that also works on direct load, chunks link to each other with <a href>, and the History API updates the address when a new chunk becomes the main visible element. Trigger loading with an IntersectionObserver, never a scroll listener (DEV-REN-03).
        test: >-
          With JavaScript disabled, follow the "more" link through every page of a listing. In URL Inspection the rendered HTML of page 1 contains a crawlable link to page 2, and server logs show Googlebot fetching the paginated URLs.
        snippet: lazy-loading
        claims: [D2-C276, D2-C273, D2-C271, D2-C272, D1-C114, D1-C491]
        docs: [lazy-loading-guide, pagination-guide, seo-office-hours-2023-03]
        status: documented
      - id: DEV-URL-08
        level: MUST
        title: "Keep faceted navigation out of the crawl with robots.txt rules or URL fragments"
        why: >-
          Facets create near-infinite URL spaces (the same filters in another order, conflicting or excessive combinations, facets on paginated or search pages), one of the things named as burning crawl budget. Google's faceted navigation guide prefers prevention: disallow filter URLs in robots.txt or use URL fragments, which Google generally does not crawl; rel=canonical and nofollow are weaker, slower options.
        how: >-
          Decide per facet whether it deserves an indexable landing page, for example a main category or brand with real search demand, and give those a clean URL, unique content and <a href> links. Put every other filter, sort and view parameter behind a robots.txt Disallow pattern or in the # fragment, and do not link filter combinations with crawlable hrefs. Also disallow internal search results and action URLs (cart, wishlist, compare). Audit CMS plug-ins for generated URL spaces: Google's crawling team said many crawling complaints it receives turn out to come from a plug-in, such as a calendar plug-in that adds calendar parameters to the URLs of every post, page, category and tag page, and Google crawls such URLs until its systems learn from large samples that they are useless. A Google panelist added that useless plug-in parameter URLs can also be handled at the web server, for example with a rewrite rule or a custom module, so that crawl budget goes to the URLs that matter.
        test: >-
          A crawl that respects robots.txt finds a bounded number of listing URLs; server logs and Crawl stats show Googlebot not spending fetches on parameter URLs; Google's open-source robots.txt parser (github.com/google/robotstxt), run with the Googlebot token, returns disallowed for sample filter URLs and allowed for item pages, and URL Inspection shows item pages as Crawl allowed.
        snippet: robots-txt
        claims: [D1-C101, D1-C100, D1-C099, D1-C103, D2-C188, D1-C469, D1-C430, D1-C446, D1-C447, D1-C378, D1-C444, D1-C539]
        docs: [faceted-nav-guide, crawl-budget-guide]
        status: documented
      - id: DEV-URL-09
        level: SHOULD
        title: "If facet URLs must be crawlable, use & separators, a fixed filter order and 404 for empty results"
        why: >-
          Google's faceted navigation guide asks crawlable facet URLs to use the standard & separator, keep filters in a consistent order and return 404 when a combination has no results. Said at Search Central Live: many similar-looking URLs leading to the same or empty content can make Google fold a whole URL pattern into one canonical and stop crawling new URLs that fit it.
        how: >-
          Normalise the parameter order on the server (redirect or canonicalise ?size=m&color=red and ?color=red&size=m to one order). Use key=value pairs joined with &, not custom separators. Return 404, not an empty 200 page, for combinations with no items. Make indexable facet pages differ in their main content (heading, introduction, items), not only in the title.
        test: >-
          Request one combination in two parameter orders: one redirects or canonicalises to the other. curl -I on an empty combination returns 404. The Page indexing report shows no growth of duplicate reasons on facet URLs.
        claims: [D1-C102, D2-C371, D2-C368, D2-C369, D2-C372]
        docs: [faceted-nav-guide, canonicalization-troubleshooting]
        status: documented
      - id: DEV-URL-10
        level: SHOULD
        title: "Group URLs into meaningful section paths and launch new content under sections Google already indexes well"
        why: >-
          Said at Search Central Live: when Google does not yet know a URL's quality or popularity, it uses the aggregate of the URL's parent path, then that path's parent, and index selection is more forgiving with new URLs from a site or a section that already satisfies users well. Neither rule is in Google's documentation. Author's view: URL paths are a lever for crawl demand and index selection, not only for tidiness.
        how: >-
          Plan the URL structure so each template lives under a section path that reflects the site's structure (/chairs/oak-dining-chair rather than /p?id=123 or a flat root). Launch new content types under sections Google already crawls and indexes well rather than under weak or brand-new ones, and improve or remove weak sections before adding to them.
        test: >-
          The URL plan maps every template to a section path, and after launch each new section is reviewed on its own (a URL-prefix property or a sitemap per section) in the Page indexing report and in Crawl stats.
        claims: [D1-C094, D1-C095, D2-C685, D2-C686]
        docs: []
        status: event-only
      - id: DEV-URL-11
        level: SHOULD
        title: "Compute the expected URL for every request and redirect variants to it"
        why: >-
          Google treats URLs that differ as different URLs and crawls them all, even when they show the same content. A community speaker showed five kinds of similar URLs on well-known brand sites: another protocol or host, other capitalisation, extra slashes, a space encoded as %20 in one URL and + in another, and parameters in another order. Such URLs signal duplicate content, broken links and unnecessary redirects, and anyone can link to them from other sites, so the application should be hardened against them.
        how: >-
          In the application, build the expected URL for each request from the route, the page type and ID (reverse routing) and the parameters the page actually uses, in a fixed order. When the requested URL differs, answer one 301 to the expected URL, or an error page when it maps to nothing. Generate internal links with the same function so they are never variants.
        test: >-
          Requests for the uppercase, double-slash, reordered-parameter and unused-parameter variants of a sample URL each return one 301 to the expected URL; a crawl that normalises URLs (lowercase scheme and host, default port removed, dot segments resolved, fragment dropped) finds no two crawled URLs that collapse to the same normalised URL.
        snippet: url-normalization
        claims: [D1-C397, D1-C399, D1-C400, D1-C402, D1-C403, D1-C404, D1-C445, D1-C378]
        docs: [consolidate-duplicate-urls, url-structure-guide, faceted-nav-guide]
        status: documented

  - id: rendering-javascript
    title: Rendering and JavaScript
    intro: >-
      Google renders pages with a headless Chromium in a separate, queued system and indexes what is in the DOM when rendering ends. Content and links that depend on clicks, scrolling, blocked resources, permission prompts or slow APIs can be missing from what Google indexes.
    requirements:
      - id: DEV-REN-01
        level: SHOULD
        title: "Server-render the main content and everything indexing depends on (SSR, static generation or hybrid)"
        why: >-
          Every 200 page waits in a render queue, for seconds or longer, and rendering can fail or time out; content already in the server HTML does not depend on that slower pass. Google named server-side rendering as the fix for slow live reads of a page, and a community speaker stressed that AI systems that cannot render JavaScript see only the raw HTML. Said at Search Central Live (October 2026): content that JavaScript adds is usually seen by indexing within a few hours but at worst within weeks, and a Google speaker doubted that every URL is actually rendered; Google's JavaScript guide says every 200 page is queued for rendering, and queued is not the same as rendered.
        how: >-
          Choose the rendering mode per template before launch: server-render or pre-render every template that must rank (product, category, article, landing pages), including the title, meta description, canonical, robots meta tag, hreflang, main text, prices and internal links. Hydrate on the client for interactivity only. With a headless CMS, render on the server or at build time rather than only in the browser.
        test: >-
          curl -s the page and find the main heading, price and key links in the raw HTML; compare with the rendered HTML in URL Inspection; with JavaScript disabled in DevTools the page still shows its main content.
        snippet: semantic-page-template
        claims: [D2-C131, D2-C172, D2-C124, D2-C139, D2-C133, D2-C125, D3-C627, D3-C628, D3-C676, D2-C247, D2-C249]
        docs: [javascript-seo-basics, dynamic-rendering]
        status: documented
      - id: DEV-REN-02
        level: MUST
        title: "Have all indexable content in the DOM after load, without clicks, typing or scrolling"
        why: >-
          Googlebot does not click, type or scroll. Content that loads only after a user action is not in the DOM when Google renders the page, so it cannot be indexed, while content that is in the DOM but hidden (tabs, accordions, read-more) can be. Google's slide called content missing from the rendered HTML the most common JavaScript indexing issue.
        how: >-
          Ship tab, accordion and read-more content in the initial HTML or DOM and hide it with CSS or the hidden attribute; never fetch it on click. Product specifications, reviews, FAQs and descriptions belong in the page at load. Keep interaction-only loading for content you do not need indexed.
        test: >-
          In URL Inspection (rendered HTML) or the Rich Results Test, find text from every tab and accordion panel. In the DevTools Network panel, no content request waits for a click.
        snippet: tabs-in-dom
        claims: [D2-C195, D2-C268, D2-C201, D2-C196, D2-C202, D2-C262, D2-C261, D2-C866]
        docs: [lazy-loading-guide, mobile-first-indexing, javascript-seo-basics]
        status: documented
      - id: DEV-REN-03
        level: MUST
        title: "Lazy-load with native lazy loading or an IntersectionObserver, never with scroll events"
        why: >-
          Googlebot does not scroll, so a scroll event listener never fires and the content it would load never appears. Google renders with a very tall viewport instead (said at Search Central Live to be around 10,000 pixels), so content loaded when it enters the viewport does load during rendering.
        how: >-
          Use loading="lazy" on img and iframe elements, with a real src plus width and height, and an IntersectionObserver for other components. Never make indexable content depend on scroll position, scroll depth or a timer. Treat the tall viewport as a safety margin, not a target, and give long lists paginated URLs (DEV-URL-07).
        test: >-
          The rendered HTML in URL Inspection contains below-the-fold images and list items. A code search finds no addEventListener('scroll') or onscroll handler that loads content.
        snippet: lazy-loading
        claims: [D2-C198, D2-C197, D2-C271, D2-C274, D2-C199, D2-C272]
        docs: [lazy-loading-guide, seo-office-hours-2023-03]
        status: documented
      - id: DEV-REN-04
        level: AVOID
        title: "Do not block JavaScript, CSS or API endpoints that pages need for rendering in robots.txt"
        why: >-
          Google's renderer fetches scripts, styles and API requests through Googlebot and obeys robots.txt: if it cannot fetch a resource, it cannot run it. Blocking a script folder or a generic /api/ folder leaves blank modules or an empty page, which can be treated as a soft 404 although users see a full page.
        how: >-
          Allow all JS, CSS and font paths. If an API folder must stay disallowed, carve out the endpoints rendering needs (Disallow: /api/ plus Allow: /api/products/), since the longer Allow rule wins. Check the robots.txt of every host the page loads data from, and re-test a rendered page after every robots.txt change touching script or API paths.
        test: >-
          URL Inspection live test, page resources: nothing needed for content is "Blocked by robots.txt". The DevTools Network panel (Fetch/XHR) lists each API host, and each host's robots.txt allows those paths.
        snippet: robots-txt
        claims: [D2-C204, D2-C206, D2-C297, D2-C207, D2-C265, D2-C296, D2-C213]
        docs: [robots-intro, javascript-seo-basics, crawling-december-resources, inside-googlebot-blog]
        status: documented
      - id: DEV-REN-05
        level: AVOID
        title: "Do not add, change or remove robots meta tags with JavaScript"
        why: >-
          Robots rules added with JavaScript take longer to be seen, and removing a noindex with JavaScript does not work: Google may skip rendering a page that arrives with noindex, so it stays out of the index. Google's documentation recommends avoiding JavaScript to inject or change meta tags.
        how: >-
          Decide indexability on the server and send the final robots meta tag or X-Robots-Tag header in the first response. Never ship noindex in the HTML shell and remove it after hydration, and never toggle data-nosnippet with JavaScript. The one documented exception is adding noindex with JavaScript to an error view in a client-rendered app (DEV-ERR-02).
        test: >-
          The robots meta tag in curl output and in URL Inspection's rendered HTML is identical on every indexable template. A search of the client bundle finds no code that writes meta[name="robots"] except error views.
        claims: [D2-C108, D2-C106, D2-C107, D2-C257, D2-C109, D2-C079, D2-C852, D2-C853, D2-C854]
        docs: [meta-tags-supported, javascript-seo-basics, robots-meta-tag-spec]
        status: documented
      - id: DEV-REN-06
        level: SHOULD
        title: "Make rendering robust: no slow API dependencies and no unresolved placeholders"
        why: >-
          Said at Search Central Live by a community speaker: a renderer does not wait forever before taking its snapshot, so content from slow internal systems can be missing and template placeholders can end up in indexed titles and snippets; because timing varies, the broken page changes from crawl to crawl. Server-side or hybrid rendering, fallbacks and never leaving placeholders in the DOM were named as safeguards.
        how: >-
          Render critical content on the server from data available at request time, give slow services timeouts with sensible fallbacks, and never write a template variable, undefined or null into the DOM, title or meta description (render nothing or a neutral default). Keep JavaScript bundles and API waterfalls small so the main content appears quickly. Never make content depend on cookies, localStorage, sessionStorage or a consent state from an earlier page, because Google's renderer clears them between page loads, and give JS and CSS bundles content-hashed file names (main.2bb85551.js), because the renderer may ignore caching headers and use stale files.
        test: >-
          Render the same URLs several times with a JavaScript-rendering crawler and search titles, descriptions and body text for {{, undefined, null and NaN; investigate any URL whose rendered output differs between runs.
        claims: [D2-C259, D2-C149, D2-C263, D2-C175, D2-C151, D2-C154, D2-C828, D2-C829]
        docs: [javascript-seo-basics, fix-search-javascript]
        status: documented
      - id: DEV-REN-07
        level: SHOULD
        title: "Keep prices, offer counts and other commercial data identical in raw and rendered HTML"
        why: >-
          Said at Search Central Live by a community speaker: offer counts, prices and promotions sometimes differ between the server HTML and the rendered page, for example a different newsletter discount in each, so bots and users can get different versions. Google's documentation does not cover this case specifically.
        how: >-
          Generate both versions from the same data source with the same filters, and treat any difference in prices, availability, offer counts, links or meta tags between raw and rendered HTML as a bug.
        test: >-
          On every release, diff the raw HTML (curl) and the rendered HTML (headless Chrome or URL Inspection) of each key template for prices, offer counts, links and meta tags.
        claims: [D2-C147, D2-C137, D2-C148]
        docs: []
        status: event-only
      - id: DEV-REN-08
        level: SHOULD
        title: "Feature-detect permission-based APIs and WebGL, and render the content without them"
        why: >-
          Browser APIs that need user permission, such as location and payments, are not supported when Google renders a page, and WebGL effects are not applied. Google recommends feature detection with polyfills or differential serving, and prerendering on the server for content that depends on WebGL.
        how: >-
          Render indexable content first; ask for permissions only after a user action and keep a complete default (for example the full store list) if the request is declined. Wrap WebGL and other optional APIs in feature detection with a plain HTML fallback. Add polyfills for missing APIs the content needs, knowing that some features cannot be polyfilled.
        test: >-
          In URL Inspection the screenshot and rendered HTML show the main content, and the JavaScript console messages of the live test show no uncaught errors from missing APIs.
        snippet: feature-detection-fallback
        claims: [D2-C269, D2-C277, D2-C278, D2-C280, D2-C282]
        docs: [fix-search-javascript, javascript-seo-basics]
        status: documented
      - id: DEV-REN-09
        level: SHOULD
        title: "Monitor JavaScript console errors and Content Security Policy violations on key templates"
        why: >-
          Console messages reveal problems that remove content, such as uncaught exceptions and Content Security Policy violations that block a script or a video. An unhandled exception in an embedded third-party or AI-generated app can break the host page as well.
        how: >-
          Collect console errors in automated browser tests and in a rendering crawl of one URL per template. List in the CSP every host the page needs (scripts, APIs, media, fonts) and test CSP changes in staging, for example with Content-Security-Policy-Report-Only first. Isolate third-party widgets so their errors cannot stop the main content from rendering.
        test: >-
          URL Inspection live test, JavaScript console messages: no errors on key templates. Browser tests fail on new console errors or securitypolicyviolation events.
        claims: [D2-C144, D2-C155, D2-C222, D2-C158]
        docs: [fix-search-javascript, url-inspection-help]
        status: documented
      - id: DEV-REN-10
        level: SHOULD
        title: "Keep indexable content out of iframes, and check web components in the rendered HTML"
        why: >-
          Google generally tries to index iframe content as part of the embedding page, but that is not guaranteed because both are normal pages of their own. Google flattens shadow DOM and light DOM when it renders web components, and content that does not appear in the rendered HTML cannot be indexed.
        how: >-
          Put the main content in the page's own DOM and use iframes for third-party widgets you do not need indexed. For web components and micro-frontend libraries that patch browser APIs, verify the result in Google's tools rather than trusting a library's promise of indexability.
        test: >-
          The rendered HTML in URL Inspection or the Rich Results Test shows the component's and embedded content's text as part of the page.
        claims: [D2-C227, D2-C235, D2-C250, D2-C240]
        docs: [javascript-seo-basics, fix-search-javascript, seo-office-hours-2023-12, indexifembedded-blog]
        status: documented

  - id: indexing-controls
    title: Indexing and snippet controls
    intro: >-
      robots.txt controls crawling; the robots meta tag and the X-Robots-Tag header control indexing and how a page appears, including how much of it AI Overviews and AI Mode may use. Search Console and the Google-Extended token add controls for generative AI.
    requirements:
      - id: DEV-IDX-01
        level: MUST
        title: "Use noindex to keep a page out of Search, and leave that URL crawlable"
        why: >-
          robots.txt does not control indexing: a disallowed URL can still appear in results without its content when other pages link to it, and Google never sees a noindex on a page it may not fetch. Google said it does not treat a disallow as noindex because important sites sometimes disallow their most important pages by mistake, and robots meta rules only work if robots.txt lets Google fetch the page.
        how: >-
          For admin, thin, temporary or internal-search pages that may be crawled but should not be indexed, send <meta name="robots" content="noindex"> or X-Robots-Tag: noindex in the server response and do not disallow the URL. Use robots.txt only for URLs that should never be fetched. Use name="googlebot" only for Google-specific rules. To de-index URLs that are already disallowed, add the noindex first (or in the same release), then remove the disallow so Google can see it.
        test: >-
          For each noindexed URL: URL Inspection shows Crawl allowed: Yes, curl shows the noindex, and URL Inspection and the Page indexing report list it as excluded by the noindex tag.
        snippet: robots-meta-tags
        claims: [D2-C022, D2-C069, D2-C021, D2-C020, D2-C061, D1-C110, D2-C023, D2-C850, D2-C851, D2-C846, D2-C844, D2-C845]
        docs: [block-indexing-noindex, robots-meta-tag-spec, robots-intro]
        status: documented
      - id: DEV-IDX-02
        level: AVOID
        title: "Do not use noindex, nofollow or crawl-delay to save crawl budget"
        why: >-
          noindex consumes crawl budget because Google must fetch the page to see it; nofollow is a hint, and the linked URLs may still be crawled through other links or sitemaps; crawl-delay is not processed at all. Google advises against noindex for crawl budget and against using robots.txt to reallocate it temporarily.
        how: >-
          To stop Google fetching URLs on your own site, disallow them in robots.txt; return 404 or 410 for removed pages; consolidate duplicates with redirects or canonicals. Keep crawl rules stable instead of switching them to steer Googlebot around.
        test: >-
          Server logs show few or no Googlebot fetches of parameter and action URLs; robots.txt has no crawl-delay meant for Google; Crawl stats shows fewer fetches of low-value URLs after fixes.
        claims: [D1-C106, D1-C109, D1-C127, D1-C107, D1-C108, D1-C105]
        docs: [crawl-budget-guide, qualify-outbound-links, robots-spec]
        status: documented
      - id: DEV-IDX-03
        level: SHOULD
        title: "Send robots rules for PDFs, images and other non-HTML files in the X-Robots-Tag header"
        why: >-
          Files without an HTML head can carry robots rules only in the HTTP response. X-Robots-Tag accepts the same rules as the meta tag and, like the tag, is seen only when the URL is crawled.
        how: >-
          Add X-Robots-Tag in the web server or CDN for the file types or folders that should stay out of Search (internal PDFs, exports, private images), and do not also disallow those URLs in robots.txt. Use the user-agent form (X-Robots-Tag: googlebot: noindex) only for crawler-specific rules.
        test: >-
          curl -I on a sample file shows the X-Robots-Tag header; URL Inspection of the file reports it excluded by noindex.
        snippet: x-robots-tag
        claims: [D2-C069, D2-C529, D2-C095]
        docs: [robots-meta-tag-spec, remove-images]
        status: documented
      - id: DEV-IDX-04
        level: SHOULD
        title: "Allow full snippets and large previews with max-snippet:-1 and max-image-preview:large"
        why: >-
          Robots meta rules can make a page more visible than having none. max-image-preview:large allows the largest image previews, which matters mainly in Discover, and max-snippet:-1 removes the length limit so Google picks the length it finds most effective. Google's closing slide on robots meta tags recommended exactly these two rules for maximum visibility.
        how: >-
          Add <meta name="robots" content="max-snippet:-1, max-image-preview:large"> (optionally with max-video-preview:-1) to every indexable template unless licensing requires limits, and check that no CMS, SEO plug-in or CDN feature adds lower limits by default. Provide large, high-quality images, at least 1,200 px wide for Discover.
        test: >-
          curl the HTML of each template and check the robots meta content; the Discover performance report in Search Console shows impressions for article templates.
        snippet: robots-meta-tags
        claims: [D2-C087, D2-C082, D2-C086, D2-C104, D2-C053, D2-C105, D3-C224, D2-C936]
        docs: [robots-meta-tag-spec, google-discover]
        status: documented
      - id: DEV-IDX-05
        level: AVOID
        title: "Do not add nosnippet or a short max-snippet unless you accept losing snippets and AI feature use"
        why: >-
          nosnippet removes the text snippet and video preview and also stops the page's content being used as a direct input for AI Overviews and AI Mode; max-snippet limits that use too. A page must be eligible for a snippet to be a supporting link in AI features, and Google said its AI answers are built from snippets. Said at Search Central Live: a value too short for a useful snippet may lead to no snippet at all.
        how: >-
          Keep nosnippet and max-snippet limits off by default. To hide one detail, such as a phone number or a member price, use data-nosnippet on that element instead (DEV-IDX-07). If licensing requires limits, set them per template deliberately and record the trade-off.
        test: >-
          Search the codebase, CMS settings and CDN transforms for nosnippet and max-snippet; curl key templates to confirm none is present unless intended.
        claims: [D2-C728, D2-C072, D2-C074, D2-C070, D2-C073, D2-C084]
        docs: [robots-meta-tag-spec, ai-features-guide, snippets-guide]
        status: documented
      - id: DEV-IDX-06
        level: SHOULD
        title: "Prefer rel attributes on individual links to a page-level nofollow"
        why: >-
          The page-level nofollow rule tells search engines not to pass signals through any link on the page, a very broad rule that, as Google put it at Search Central Live, makes the page stand on its own, while an explicit robots all rule does nothing. Google recommends rel attributes on individual links so a site chooses which links to qualify; its documentation does not forbid a page-level nofollow.
        how: >-
          Remove page-level nofollow and redundant all or index, follow values from template and plug-in robots meta tags; where a template uses none, replace it with noindex if the page must stay out of Search (none also means nofollow), never simply delete it. Mark individual links instead: rel="sponsored" for paid links, rel="ugc" for user-generated content and rel="nofollow" for other links you do not vouch for. nofollow is not an access control; use robots.txt to keep crawlers out (DEV-IDX-02).
        test: >-
          A crawl lists no page with a page-level nofollow (none included) that lacks a recorded reason, and every page that must stay out of Search still carries noindex; outbound links in comments, ads and affiliate modules carry the right rel values.
        claims: [D2-C063, D2-C064, D2-C059, D1-C127, D2-C065, D2-C068]
        docs: [qualify-outbound-links, nofollow-hints-blog, robots-meta-tag-spec]
        status: documented
      - id: DEV-IDX-07
        level: MAY
        title: "Use data-nosnippet on a span, div or section to keep one detail out of snippets"
        why: >-
          data-nosnippet keeps a passage such as a phone number or a member price out of snippets while the page can still be found for it. It works on only a handful of elements, may be read before and after rendering, and broken HTML can widen it: an unclosed element marked data-nosnippet can hide the rest of the page from snippets.
        how: >-
          Wrap the passage in <span data-nosnippet>, <div data-nosnippet> or <section data-nosnippet> in the server HTML, never add or remove the attribute with JavaScript, and validate the HTML of templates that use it so every element is closed.
        test: >-
          An HTML validator (W3C Nu or html-validate in CI) reports no unclosed elements on templates that use data-nosnippet; after recrawl, the page's snippet avoids the marked text.
        snippet: data-nosnippet
        claims: [D2-C077, D2-C078, D2-C079, D2-C076, D2-C080, D2-C081]
        docs: [robots-meta-tag-spec]
        status: documented
      - id: DEV-IDX-08
        level: MAY
        title: "Use unavailable_after on pages with a known end date"
        why: >-
          The unavailable_after rule drops a page from results after a set date and time, and Googlebot considerably reduces how often it crawls the URL after that date. Index selection was described as checking the rule and dropping the page once the date is reached.
        how: >-
          Add <meta name="robots" content="unavailable_after: 2026-12-31T23:59:59+01:00"> (ISO 8601, RFC 822 or RFC 850 dates) to event pages, time-limited offers and job ads when they are published. After the end date, either keep the page as an archive without the rule or return 404 or 410 if it is gone.
        test: >-
          curl shows the rule with a valid date; after the date, URL Inspection reports the page as not indexed.
        snippet: robots-meta-tags
        claims: [D2-C100, D2-C101, D2-C698, D2-C699]
        docs: [robots-meta-tag-spec]
        status: documented
      - id: DEV-IDX-09
        level: SHOULD
        title: "Leave notranslate and noimageindex out of templates unless translation or image indexing must be prevented"
        why: >-
          notranslate, as a robots or googlebot rule or in X-Robots-Tag, opts a page out of all translation features in Google Search, and the meta tag named google with notranslate also turns off Chrome's automatic translation for visitors who cannot read the language. noimageindex stops Google indexing every image on the page; said at Search Central Live, it also affects the page's videos, because Google has to index a video's thumbnail, which is an image. Both are often inherited from templates without a reason.
        how: >-
          Remove notranslate and noimageindex from global templates. Where a specific passage must not be translated, the standard HTML translate="no" attribute on that element is narrower than a page-wide rule. To keep specific images out of Search, use DEV-IMG-06.
        test: >-
          A crawl lists every robots, googlebot or google meta tag and X-Robots-Tag header containing notranslate or noimageindex, and each one has a documented reason.
        claims: [D2-C093, D2-C095, D2-C094, D2-C096, D2-C099, D2-C098, D2-C934, D2-C935]
        docs: [translated-results, robots-meta-tag-spec, notranslate-blog-2008, chromium-translate]
        status: documented
      - id: DEV-IDX-10
        level: MAY
        title: "Use the Search generative AI setting in Search Console only to take a property out of AI Overviews and AI Mode"
        why: >-
          This property-level setting (include, exclude or inherit from parent) controls AI Overviews, AI Mode and generative AI features in Discover without affecting web rankings. Excluding removes both links to the site and the use of its content for grounding, so the site gets no traffic or impressions from those features; include is the default and changes generally apply within one to two days.
        how: >-
          Leave most properties on include or inherit. If a business decision requires exclusion, set it on a child property such as a folder first and measure the effect. The setting lives in Search Console, not in code, so record it in the launch checklist. Use nosnippet only if you also want out of regular snippets.
        test: >-
          Search Console settings show the intended state for each property; the Generative AI performance report shows impressions for included properties.
        claims: [D1-C029, D1-C030, D1-C031, D1-C033, D2-C103, D1-C034]
        docs: [gsc-genai-control]
        status: documented
      - id: DEV-IDX-11
        level: MAY
        title: "Use the Google-Extended robots.txt token to control Gemini training and grounding"
        why: >-
          Google-Extended is a robots.txt control token, not a crawler: it decides whether crawled content may be used to train future Gemini models and to ground Gemini Apps and Vertex AI, and it does not affect inclusion or ranking in Google Search. The Search generative AI setting does not affect training, and user-triggered fetchers, which fetch a page because a user asked, generally ignore robots.txt.
        how: >-
          To opt out, add a User-agent: Google-Extended group with Disallow: / for the whole site, or Disallow lines for specific directories, to robots.txt; never block Googlebot for this purpose. Google's robots.txt talk confirmed that Google respects that policy for Gemini model training. Said at Search Central Live: rendering for Gemini training reuses the rendering done for Search. Author's view: so no separate rendering work is needed for Gemini.
        test: >-
          Google's open-source robots.txt parser (github.com/google/robotstxt), run with the Google-Extended token, returns disallowed for the intended paths, and run with the Googlebot token returns allowed for the same URLs; URL Inspection shows them as Crawl allowed.
        snippet: robots-txt
        claims: [D1-C086, D1-C032, D2-C121, D2-C122, D2-C118, D2-C119, D1-C485, D1-C522]
        docs: [common-crawlers, user-triggered-fetchers, gsc-genai-control]
        status: documented
      - id: DEV-IDX-12
        level: SHOULD
        title: "On sites with explicit content, keep it on its own subdomain or domain and label it with rating markup"
        why: >-
          Google's guidelines for sites with explicit content recommend grouping explicit pages on a separate domain or subdomain; otherwise Google's systems may judge the whole site explicit and filter all of it when SafeSearch is on. Explicit pages are marked with rating markup set to adult, as a meta tag or an HTTP response header. Author's view: SafeSearch signals are calculated at indexing from the whole page and its links, so a fix counts only after Google recrawls and reprocesses the pages.
        how: >-
          Only for sites that host explicit material: serve it from a dedicated subdomain or domain, add <meta name="rating" content="adult"> (or the same value as an HTTP response header) to every explicit page, and keep explicit images, links and teasers off general templates. After moving or relabelling pages, request recrawling of the most important URLs.
        test: >-
          A crawl finds every explicit URL on the dedicated host with the rating markup, and no general template links to or embeds explicit content.
        claims: [D2-C664, D2-C837, D2-C665, D2-C677]
        docs: [safesearch-guidelines]
        status: documented
      - id: DEV-IDX-13
        level: SHOULD
        title: "For an urgent removal, use the Removals tool in Search Console and also return 404 or noindex"
        why: >-
          Google's Removals tool help says a temporary removal usually takes up to a day and lasts only about six months. Said at Search Central Live: removals take about two hours on average because Google pushes them to its serving system about every two hours, while a 404 or noindex usually drops a page from the serving index within one to three weeks after Google processes it. Only the permanent signal keeps the page out once the temporary removal expires.
        how: >-
          For leaked, outdated or legally sensitive URLs, file a temporary removal in Search Console at once and, at the same time, return 404 or 410, add noindex, or put the content behind a login. Never rely on the Removals tool alone, and keep the URL crawlable so Google can see the 404 or noindex (DEV-IDX-01).
        test: >-
          The Removals report shows the request processed within a day; curl -I on the URL returns 404 or 410, or the page carries noindex; months later the URL is still absent from Search.
        claims: [D3-C651, D3-C673, D3-C639, D3-C652, D3-C653]
        docs: [removals-tool-help]
        status: documented

  - id: canonicals-duplicates
    title: Canonicals, redirects and duplicates
    intro: >-
      Google clusters duplicate pages, picks one representative URL (the canonical) and forwards signals to it. Redirects, rel=canonical, internal links and sitemaps tell it which URL you prefer: when they agree Google follows them, and when they conflict it decides on its own.
    requirements:
      - id: DEV-CAN-01
        level: MUST
        title: "Use permanent server-side redirects (301 or 308) for moved URLs, straight to the final URL"
        why: >-
          Google trusts redirects very much when it clusters duplicates, and whether a redirect is permanent or temporary decides which URL becomes canonical: with a temporary redirect Google keeps showing the source URL. Google's crawlers follow up to 10 redirect hops, and long chains hurt crawling. Google follows JavaScript redirects only after rendering and may never see one if rendering fails; said at Search Central Live, even Google's own site consolidation used JavaScript only because it was the only option available to the person doing it, a fallback rather than a pattern to copy.
        how: >-
          Answer every moved, merged or renamed URL with one 301 or 308 to the final URL, and collapse old chains in the redirect map into single hops. Update internal links, canonicals, hreflang and sitemaps to the new URL. Use 302 or 307 only for genuinely temporary moves, and avoid meta refresh and JavaScript redirects for permanent ones.
        test: >-
          curl -sIL on an old URL shows one 301 or 308 hop ending in 200; a crawler's redirect-chain report is empty; after recrawl, URL Inspection of the new URL shows it as the Google-selected canonical.
        snippet: redirects
        claims: [D2-C013, D2-C361, D2-C362, D2-C363, D2-C357, D2-C387, D1-C349, D1-C370, D1-C541, D1-C542]
        docs: [redirects-guide, http-network-errors, crawl-budget-guide]
        status: documented
      - id: DEV-CAN-02
        level: MUST
        title: "Serve one host over HTTPS with a valid certificate and redirect every other origin to it"
        why: >-
          The www and non-www versions of a page are exact duplicates that Google clusters, keeping one. Whether a page loads properly counts in canonical selection: a broken certificate, failing JavaScript or a page that cannot load counts against a URL, and Google's slide also listed meta refresh and security.
        how: >-
          Pick one origin (for example https://www.example.com), redirect every other combination of protocol and host name with a single 301, serve a valid TLS certificate on every host name that answers, including the redirecting ones, and use only the chosen origin in internal links, canonicals, hreflang and sitemaps. Enable HSTS once HTTPS works everywhere.
        test: >-
          curl -I on http://example.com, http://www.example.com and https://example.com each returns one 301 to the https://www. URL; a TLS check (openssl s_client or an online scanner) shows a valid certificate on every host name.
        snippet: redirects
        claims: [D2-C365, D2-C389, D2-C387, D2-C396]
        docs: [canonicalization, consolidate-duplicate-urls, redirects-guide]
        status: documented
      - id: DEV-CAN-03
        level: MUST
        title: "Put exactly one absolute rel=canonical in the server-rendered head of every indexable page"
        why: >-
          Google extracts rel=canonical from the head and uses it in deduplication and canonical selection, but the tag is very often wrong, so Google treats it as a strong hint rather than an order. With more than one canonical on a page, Google will likely ignore all of them.
        how: >-
          Give every indexable page a self-referencing canonical, and point duplicates (tracking parameters, print views, sort orders) at the preferred URL. Use absolute URLs on the chosen origin. Output the tag from one layer only, making sure the CMS, an SEO plug-in and the front-end framework do not each add one, and put it in the server-sent head, not only in JavaScript-rendered HTML, with no invalid element (such as an img or iframe) before it, because Google stops reading the head at the first invalid element. For PDFs use an HTTP Link header.
        test: >-
          A crawl finds no indexable page with zero or several canonicals, or with a relative or placeholder value; raw and rendered HTML carry the same canonical; URL Inspection shows the user-declared and Google-selected canonical as equal on key templates.
        snippet: canonical-link
        claims: [D2-C032, D2-C031, D2-C418, D2-C417, D2-C379, D2-C035, D2-C831, D2-C873]
        docs: [consolidate-duplicate-urls, rel-canonical-mistakes-blog, valid-page-metadata]
        status: documented
      - id: DEV-CAN-04
        level: MUST
        title: "Point every canonical directly at a final URL that returns 200, is indexable and is linked"
        why: >-
          Google can follow canonical chains but strongly recommends pointing every link at a single canonical page. Said at Search Central Live by a community speaker: a canonical loop leaves a group with no leader at all. The leader should carry no noindex, return no error, not be blocked in robots.txt and not redirect; a leader that visitors cannot reach through links asks Google to index a page humans cannot reach.
        how: >-
          Resolve each canonical target to its final URL when pages are generated, and update canonicals to the new final URLs after migrations or host changes. Never canonicalise to a URL that redirects, returns non-200, carries noindex or is disallowed. Make the canonical target the URL that internal links use, fixing whichever of the two is wrong.
        test: >-
          Canonical audit in a crawler: group URLs by the final URL their canonicals and redirects lead to, and flag groups with more than one hop, a loop, several canonicals on one page, or a leader that is noindexed, blocked, non-200, redirecting or without internal links.
        claims: [D2-C420, D2-C419, D2-C438, D2-C432, D2-C424, D2-C427, D2-C416, D2-C423]
        docs: [specify-canonical-blog, rel-canonical-mistakes-blog, consolidate-duplicate-urls]
        status: documented
      - id: DEV-CAN-05
        level: MUST
        title: "Make all canonical signals agree: redirects, rel=canonical, internal links, sitemaps and hreflang"
        why: >-
          When all signals point to the same URL Google follows the site owner, and when they point in different directions it cannot tell what the owner wants. Redirects and rel=canonical are strong signals, sitemap inclusion is a weak one, and combining them makes them more effective; links to duplicates are consolidated once the preferred URL becomes canonical.
        how: >-
          Generate canonical tags, sitemap entries, hreflang URLs and internal links from one URL-building function so they cannot drift apart, and check every signal against the preferred URL before a migration or template change.
        test: >-
          A crawl finds zero internal links to non-canonical URLs, zero sitemap URLs that are not self-canonical and zero hreflang targets that redirect or canonicalise elsewhere; sampled URLs in URL Inspection show matching user-declared and Google-selected canonicals.
        claims: [D2-C399, D2-C391, D2-C430, D2-C390, D2-C400, D2-C431]
        docs: [consolidate-duplicate-urls, canonicalization]
        status: documented
      - id: DEV-CAN-06
        level: AVOID
        title: "Do not canonicalise one language version to another; connect them with hreflang"
        why: >-
          A canonical from one language version to another asks Google to keep only one language in the index, so only that version would rank. Google's guide says that on pages using hreflang the canonical should be a page in the same language, or the best substitute language if none exists.
        how: >-
          Every language or country version keeps a self-referencing canonical and lists its alternates with hreflang (DEV-INT-03). Check that no template falls back to the default-language canonical on translated pages.
        test: >-
          Canonical audit: no canonical group contains documents in more than one language, and every localized page's canonical equals its own URL.
        claims: [D2-C433, D2-C434, D2-C435, D2-C436]
        docs: [consolidate-duplicate-urls, localized-versions]
        status: documented
      - id: DEV-CAN-07
        level: AVOID
        title: "Never leave staging, preview or mirror copies of the site publicly crawlable"
        why: >-
          Google watches for canonical hijacking, where several domains try to be canonical for the same content, including a site owner's own copies such as a staging site. A crawlable copy competes with production for canonical selection and can win.
        how: >-
          Protect staging, preview and QA environments with HTTP authentication or an IP allowlist, since a 401 or 403 cannot be indexed, and add a site-wide noindex header as a second layer. Never launch with staging's blanket noindex or Disallow: / still in place, and never point production canonicals or hreflang at a staging host.
        test: >-
          curl -I on the staging host returns 401 or 403 without credentials; the pre-launch check confirms production has no global noindex and no Disallow: /.
        claims: [D2-C388, D2-C387]
        docs: [canonicalization-troubleshooting, canonicalization]
        status: documented
      - id: DEV-CAN-08
        level: SHOULD
        title: "Make pages that share a URL pattern differ in their main content"
        why: >-
          Google clusters near matches and structurally similar pages, and fixing a wrong cluster comes down to making the pages sufficiently different; they can stay clustered for up to two weeks after a fix. Said at Search Central Live: when several URLs under one pattern, or city pages with similar stock, show the same content, Google may assume that every URL fitting the pattern shows that content without looking at the page.
        how: >-
          Give location, variant and category pages distinct main content (local stock, staff, prices, addresses, a unique introduction), not just a different title. Return 404 for empty or invalid combinations and for URLs that no longer exist, and avoid generating many similar-looking URLs that lead to the same content.
        test: >-
          The Page indexing report's "Duplicate, Google chose different canonical than user" reason, grouped by URL pattern, stays flat; URL Inspection shows sampled pattern URLs as their own canonical.
        claims: [D2-C373, D2-C371, D2-C368, D2-C370, D2-C369, D2-C372]
        docs: [canonicalization-troubleshooting, canonicalization]
        status: documented
      - id: DEV-CAN-09
        level: SHOULD
        title: "Keep migration redirects in place long term and judge a move in Search Console, not with site: queries"
        why: >-
          Google keeps the source of a redirect as an alternate name and may still show old URLs to people who search for the old domain or brand; its redirect guide calls this normal and says it fades over time. Removing redirects early breaks those visits and the consolidation of signals. Google's site move guide says to keep redirects generally at least one year so it can transfer all signals, and that small to medium sites take a few weeks for most pages to move. Said at Search Central Live: a site move takes one to three months on average and up to about a year, because Google's slowest signal is recalculated only about once a year (a partly uncertain passage of the recording). Asked how to plan a migration that does not leave many URLs unindexed, a Google panelist said sitemaps are not the main tool: decide first what matters from the business's perspective, for example whether to consolidate languages; listing the new URLs in a sitemap cannot hurt.
        how: >-
          Map every old URL to its final new URL in one hop (DEV-CAN-10), keep the redirects for at least a year and ideally indefinitely, use Search Console's Change of address tool for domain moves, submit the new sitemaps, update internal links to the new URLs so pages do not rely on redirects alone, and follow the new property's indexing and traffic against a pre-migration baseline.
        test: >-
          Old URLs still answer 301 to the right targets months after launch; in Search Console the new property's indexed pages rise as the old property's fall.
        claims: [D2-C357, D2-C354, D2-C355, D2-C358, D2-C351, D3-C643, D3-C644, D3-C671, D3-C672, D3-C645, D2-C884, D2-C912, D2-C888, D1-C540]
        docs: [redirects-guide, site-move-with-url-changes]
        status: documented
      - id: DEV-CAN-10
        level: MUST
        title: "Redirect an old URL only to a page with the same intent, and return 404 or 410 when there is none"
        why: >-
          Google's site move guide warns against redirecting many old URLs to one irrelevant destination such as the home page, which can confuse users and might be treated as a soft 404, and says to return 404 or 410 for content that is not moved. Community speakers who ran migrations at the event built them around one redirect map that gives every old URL an approved destination, redirected only where a new page served the same intent and never sent removed URLs to the home page, even those still bringing traffic. A 200 on every new URL proves only that the URLs work, not that the content users came for is still there.
        how: >-
          Before launch, freeze the inventory (CMS export, crawl, sitemaps, search data and logs) and approve a redirect map with one row per old URL: a same-intent target, or 404 or 410. Where two language or market versions duplicate each other, redirect both old URLs to one shared target. After launch, test the live site against the map.
        test: >-
          A script requests every old URL in the map and checks it returns one 301 to the mapped target, or the mapped 404 or 410; no old URL other than the old home page redirects to the new home page; the Page indexing report shows no rise in soft 404s on redirect targets.
        claims: [D2-C911, D2-C882, D2-C883, D2-C895, D2-C902, D2-C903, D1-C479]
        docs: [site-move-with-url-changes, http-network-errors]
        status: documented
      - id: DEV-CAN-11
        level: AVOID
        title: "Never route a crawlable URL's redirects through a URL that robots.txt blocks"
        why: >-
          Said at Search Central Live by Dave Smart: robots.txt is checked for every URL in a redirect chain and crawling stops at the first blocked one. His example was a shop that redirected every page through a disallowed /cart/ URL with JavaScript to set the local currency and back, so its pages were reported as blocked by robots.txt. It applies to every kind of redirect, for example through an external authorisation service whose own robots.txt blocks crawlers, through an old intermediate URL that was disallowed years after the content moved past it, or a redirect served only to Googlebot's user agent. Search Console shows the block on the first URL of the chain, which is not itself disallowed; Google's URL Inspection help confirms that the live test follows redirects without saying so or showing the final URL it tested.
        how: >-
          Set currency, language, consent or session state on the page itself or with a cookie, not with a redirect hop through cart, checkout, login or tracking URLs. Point every redirect straight at its final URL (DEV-CAN-01) and re-check the redirect map whenever robots.txt gains a Disallow rule, so a historical intermediate URL cannot block the target. Do not send crawlers through third-party hosts in a redirect chain, and never redirect Googlebot differently from users (DEV-SPM-03).
        test: >-
          When Search Console reports a URL as blocked by robots.txt that the file does not block, follow its redirect chain hop by hop, with a browser user agent and with Googlebot's, and test every hop against its own host's robots.txt with Google's open-source parser; run the same check on one URL per template after each release. JavaScript redirects only show in a rendered check, such as URL Inspection's live test.
        snippet: redirect-chain-robots
        claims: [D1-C534, D1-C535, D1-C536, D1-C537]
        docs: [url-inspection-help, robots-spec, redirects-guide]
        status: documented

  - id: errors-soft-404
    title: Error pages and soft 404s
    intro: >-
      A page that should be an error but returns 200 is a soft 404: Google keeps it out of the index but keeps crawling it, may cluster many such pages together, and recognises it from the main content rather than from keywords. Every response needs the status code that matches the state of the page.
    requirements:
      - id: DEV-ERR-01
        level: MUST
        title: "Return 404 or 410 for removed and non-existent URLs"
        why: >-
          4xx codes other than 429 do not slow crawling, URLs that return them are not indexed, and a 404 is a strong signal not to crawl the URL again. A soft 404 is kept out of the index but keeps being crawled, wasting crawl budget, and soft 404 pages can be clustered together as duplicates.
        how: >-
          Answer unknown paths, deleted items without a close replacement and invalid parameters with 404 or 410 and a helpful error page (search box, main categories). Redirect only when a genuinely equivalent replacement exists, and never send every missing URL to the homepage.
        test: >-
          curl -I https://www.example.com/this-does-not-exist-123 returns 404; the Page indexing report's "Soft 404" count stays near zero.
        claims: [D1-C072, D1-C073, D1-C109, D2-C334, D2-C367, D1-C351, D1-C385]
        docs: [http-network-errors, crawl-budget-guide, troubleshoot-crawling-errors]
        status: documented
      - id: DEV-ERR-02
        level: MUST
        title: "Return a real 404 for unknown routes in single-page apps, or use a documented client-side fallback"
        why: >-
          In single-page apps the server often returns the app with 200 for every URL and the front-end router shows a "not found" view, so no error is reported. When a server-side 404 is impractical, Google documents two fallbacks: a JavaScript redirect to a URL that returns 404, or a noindex robots meta tag added with JavaScript.
        how: >-
          Prefer the server: route known paths, look up dynamic ones such as product slugs, and send the app shell with 404 for everything else. Otherwise, in the client, redirect error views to a URL the server answers with 404, or inject <meta name="robots" content="noindex"> on error views.
        test: >-
          curl -I on a made-up deep URL returns 404, or the rendered HTML in URL Inspection shows the redirect or the noindex; the Page indexing report shows no soft 404s on app routes.
        snippet: spa-404
        claims: [D2-C190, D2-C291, D2-C264, D2-C192, D2-C294, D2-C191, D2-C295]
        docs: [javascript-seo-basics, fix-search-javascript]
        status: documented
      - id: DEV-ERR-03
        level: AVOID
        title: "Never serve error states, empty results or failed data loads with a 200 status"
        why: >-
          Google listed four common causes of soft 404s: pages that look like errors, thin or empty content, server or CMS misconfiguration, and JavaScript-dependent content that fails to load. Said at Search Central Live: detection uses a model that understands page layout, so an error message alone in the main content, such as a database connection error, makes a soft 404 even when header and navigation look normal.
        how: >-
          Database and backend failures return 503; missing content returns 404 or 410; empty search and filter results return 404 or carry noindex. Client-rendered pages whose data request fails show a retry option and never leave an empty main area on a 200 URL.
        test: >-
          In staging, simulate a backend outage: pages answer 503, not 200. Crawl for 200 pages with a very short main content or error wording, and review the Page indexing report's soft 404 list after each release.
        claims: [D2-C336, D2-C339, D2-C213, D2-C376, D2-C342, D2-C334, D1-C348, D1-C355, D1-C320, D1-C369]
        docs: [troubleshoot-crawling-errors, http-network-errors, crawling-december-cdns]
        status: documented
      - id: DEV-ERR-04
        level: SHOULD
        title: "Keep temporarily out-of-stock product pages live with 200 and their current availability"
        why: >-
          Google's guide to pausing a business recommends staying online with limited functionality, such as a disabled cart, and updating Product markup with current availability. Google's answer on out-of-stock pages was that it depends on how important the page is to users, who may wait months or pre-order; a temporary redirect keeps the source URL in results anyway.
        how: >-
          Keep the page at 200, show the availability (OutOfStock, PreOrder, BackOrder) on the page and in Product markup, offer pre-ordering or a back-in-stock alert, and link to alternatives. Redirect with 301 only when the product is gone for good and a true successor exists; otherwise return 404 or 410 for discontinued items.
        test: >-
          The Rich Results Test shows the current availability in Product markup; out-of-stock URLs answer 200 and stay indexed in URL Inspection.
        claims: [D2-C012, D2-C010, D2-C011, D2-C013, D2-C014]
        docs: [pause-online-business, redirects-guide, merchant-listing-sd]
        status: documented

  - id: international
    title: International and multilingual sites
    intro: >-
      Google reads a page's language from its content, stores one language per page and uses hreflang to show searchers the right version. Each version needs its own URL, crawlable links to its alternates, valid and reciprocal annotations and content that really differs.
    requirements:
      - id: DEV-INT-01
        level: MUST
        title: "Give every language and country version its own URL"
        why: >-
          Switching languages with cookies or by swapping content in place makes the versions very hard for Google to handle. Googlebot mostly crawls from US IP addresses without an Accept-Language header, so content that adapts to the visitor's location or language may never be crawled in its other versions.
        how: >-
          Give each version its own URL (example.de, de.example.com or example.com/de/), never a ?lang= parameter or a cookie. The URL alone decides the language and region served; a remembered choice may only preselect the language selector, never change the content of a URL.
        test: >-
          curl each version's URL from one location with no Accept-Language header and no cookies: each returns its own language and content.
        claims: [D2-C560, D2-C561, D2-C562, D2-C595]
        docs: [multi-regional-sites, locale-adaptive-pages, localized-versions]
        status: documented
      - id: DEV-INT-02
        level: AVOID
        title: "Do not redirect visitors automatically by IP address or browser language"
        why: >-
          Google advised against clever geo-redirecting because it very often goes wrong, and its documentation explains why: Googlebot mostly crawls from the US without Accept-Language, so automatic redirects can hide every other version from it.
        how: >-
          Serve the requested URL as it is and suggest another version with a dismissible banner or the language selector. Point x-default at a language selector or a generic page instead of redirecting from the root.
        test: >-
          curl -I on each country URL with IP addresses or Accept-Language headers of other countries: no 3xx to another version.
        claims: [D2-C383, D2-C561]
        docs: [multi-regional-sites, locale-adaptive-pages]
        status: documented
      - id: DEV-INT-03
        level: MUST
        title: "Make hreflang complete: a self-reference, return links and fully qualified URLs"
        why: >-
          Missing return links and missing self-references are common hreflang mistakes, and Google ignores annotations that point only one way, since otherwise any site could claim to be a version of someone else's. Alternate URLs must be fully qualified, including https://, and may be on other domains. A brand-only query reveals no language, so Google falls back on the user's location and browser settings and sometimes shows the wrong language version; complete hreflang is what lets it swap in the right one.
        how: >-
          Every page in a set lists itself and every alternate with an identical block, plus x-default for the fallback or selector page. Point only at canonical, indexable 200 URLs and generate the block for all versions from one data source. If keeping every pair is impractical, at least link new versions both ways with the original or dominant language.
        test: >-
          An hreflang audit in a crawler reports, per cluster, no missing return links, no missing self-references, no non-200 or non-canonical targets and no relative URLs.
        snippet: hreflang-html
        claims: [D2-C565, D2-C566, D2-C570, D2-C572, D2-C573, D2-C564, D2-C571, D2-C574, D3-C007, D3-C008, D3-C009, D3-C010]
        docs: [localized-versions, results-language-help]
        status: documented
      - id: DEV-INT-04
        level: MUST
        title: "Use valid hreflang codes: an ISO 639-1 language, an optional ISO 15924 script and an optional ISO 3166-1 Alpha-2 region"
        why: >-
          Common mistakes are country codes used as languages (se, dk and cz instead of sv, da and cs), wrong regions (UK instead of GB, SW instead of CH, GE instead of DE), regions that are not countries (EU, a city such as LA) and a region on its own (GB). Some mistakes are valid codes for something else (se is Northern Sami, GE is Georgia) and silently target the wrong audience.
        how: >-
          Store each version as a language plus an optional script and region (sv-SE, de-CH, en-GB, zh-Hant, zh-Hans-CN), validate every value against the ISO 639-1, ISO 15924 and ISO 3166-1 Alpha-2 lists in a build check or crawler rule, and use x-default for everyone else. hreflang targets countries, not groups such as the EU.
        test: >-
          An automated check confirms every value matches x-default or language[-Script][-REGION] (case-insensitive), with each part checked against ISO 639-1, ISO 15924 and ISO 3166-1 Alpha-2.
        snippet: hreflang-html
        claims: [D2-C575, D2-C576, D2-C578, D2-C579, D2-C580, D2-C581, D2-C582, D2-C583, D2-C830, D2-C962]
        docs: [localized-versions]
        status: documented
      - id: DEV-INT-05
        level: SHOULD
        title: "Supply hreflang through one method only: HTML head, HTTP Link header or sitemap"
        why: >-
          The three methods are equivalent; combining them brings no benefit in Search and is harder to manage, and Google often sees sites using two or three methods at once with conflicting annotations. The HTTP header suits non-HTML files such as PDFs, and the sitemap suits large sites.
        how: >-
          Choose one method per site (or per file type), remove leftovers from plug-ins and earlier implementations, and keep the annotations consistent with the canonicals.
        test: >-
          A crawl finds annotations in only one source per URL, and the hreflang sets from that source are complete.
        snippet: hreflang-sitemap
        claims: [D2-C568, D2-C569, D2-C567]
        docs: [localized-versions]
        status: documented
      - id: DEV-INT-06
        level: MUST
        title: "Build language and market selectors as <a href> links to each alternate URL"
        why: >-
          A selector built as a button works for users but leaves the whole cluster of alternate-language pages without crawlable links, so the cluster is orphaned for Google and depends on sitemaps to be found, which is slow.
        how: >-
          Render the selector as a list of <a href> links to the equivalent page in each version, not only to each version's homepage, and keep any visual dropdown on top of those real links.
        test: >-
          The rendered HTML of any page contains <a href> links to every version of that page, and a crawl starting from one version reaches all the others.
        claims: [D2-C187, D2-C189]
        docs: [links-crawlable, localized-versions]
        status: documented
      - id: DEV-INT-07
        level: SHOULD
        title: "Make each page's language unambiguous by translating the template with the main content"
        why: >-
          Google determines a page's language from its content, not from hreflang or the URL, and stores one language per page, so mixed-language pages make that hard. Pages that translate only the template around untranslated main content still count as duplicates. Detecting the query's language is Google's first step for almost any query, and language and country are the first signals it uses to order candidates already at retrieval, before ranking, so a page whose language is unclear can drop out before ranking starts.
        how: >-
          Translate the main content and the template (navigation, buttons, footer, legal notices, the text inside structured data) together, and avoid large blocks in a second language. Set the html lang attribute for browsers and assistive technology, knowing that Google relies on the visible content.
        test: >-
          Run language detection over the main text and template strings of sampled pages per version, and review pages with untranslated components.
        claims: [D2-C585, D2-C584, D2-C587, D2-C589, D2-C588, D2-C366, D2-C590, D3-C006, D3-C079, D3-C080, D3-C082, D3-C086]
        docs: [multi-regional-sites, localized-versions, results-language-help]
        status: documented
      - id: DEV-INT-08
        level: SHOULD
        title: "Differentiate same-language country versions beyond boilerplate and mark them with region codes"
        why: >-
          Same-language content for different countries, such as German for Germany, Austria and Switzerland, is tricky for deduplication; Google tries to use hreflang alternates and recommends hreflang even for small regional variations. Without real differences, Google may cluster the versions and show only one.
        how: >-
          Use hreflang with region codes (de-DE, de-AT, de-CH) and show country-specific prices and currency, shipping, legal details, addresses, phone numbers and regional vocabulary in the main content.
        test: >-
          Main content differs between each pair of country versions beyond the header and footer, and URL Inspection shows each version as its own canonical.
        claims: [D2-C381, D2-C382, D2-C628, D2-C385, D2-C632, D2-C384]
        docs: [localized-versions, consolidate-duplicate-urls, multi-regional-sites]
        status: documented
      - id: DEV-INT-09
        level: MAY
        title: "Choose ccTLDs, subdomains or subdirectories by business needs, and never URL parameters"
        why: >-
          A ccTLD is one of the strongest country signals, but subdomains and subdirectories are acceptable too, and Google marks URL parameters such as ?loc=de as not recommended. A separate ccTLD is not necessarily better, and sites should not move their domain for that reason; availability, cost, local regulations and commitment to the market decide.
        how: >-
          For new markets, subdirectories on the existing domain are usually the cheapest start; ccTLDs make sense where the business is committed and can operate locally. Whatever the choice, use one consistent pattern for every version.
        test: >-
          The URL structure decision is recorded before the build, and every version follows the same pattern.
        claims: [D2-C594, D2-C595, D2-C596, D2-C597, D2-C591, D2-C598]
        docs: [multi-regional-sites]
        status: documented
      - id: DEV-INT-10
        level: SHOULD
        title: "Publish machine-translated language versions only after human review and localisation"
        why: >-
          Google's spam policies count generating many pages mainly to manipulate rankings, with little or no value to users, as scaled content abuse however they are made, and list automated translating of scraped content among the examples. Said at Search Central Live: whether machine-translated content is acceptable depends on the case, after weighing translation quality, local conventions such as date formats and calendars, and cultural adaptation.
        how: >-
          Route translation plug-in and CMS auto-translate output through a review workflow before publishing: a native speaker checks the text, and dates, calendars, units, currencies and examples are adapted to the market. Keep unreviewed versions unpublished or noindexed, and do not generate a language version for every market by default.
        test: >-
          Every published language version has a reviewer and a review date recorded in the CMS, and no auto-translated page is indexable before review.
        claims: [D2-C611, D2-C608, D2-C612, D2-C692, D2-C610]
        docs: [spam-policies]
        status: documented
      - id: DEV-INT-11
        level: SHOULD
        title: "Write pages in the words, spellings and script the audience searches with, and never add synonym or variant lists"
        why: >-
          Google expands almost every query with synonyms, treats spellings with and without diacritics as the same behind the scenes, and recognises an English term and its local-language equivalent as one thing, so a page needs neither every synonym nor both spellings. Blocks of keyword variants read as keyword stuffing, which Google's spam policies prohibit. Said at Search Central Live: users expect text written the way they search, which differs by language and script; Hindi users, for example, search both in Devanagari and in Latin letters.
        how: >-
          Keep editors' wording as written in the CMS: do not strip diacritics from titles, headings or body text, and do not auto-append synonym, misspelling or transliteration blocks, hidden keyword fields or tag clouds. Where an audience searches in two scripts or spellings, choose the form per market from real query data instead of duplicating the page. Use another name for a term only where readers might not understand otherwise.
        test: >-
          Search Console's Performance report shows which spellings and scripts users type for key terms; searching each variant on Google shows whether Google treats them as the same thing; a template audit finds no generated synonym or variant lists.
        claims: [D3-C023, D3-C042, D3-C044, D3-C048, D3-C050, D3-C051, D3-C024, D3-C055, D2-C965, D2-C981]
        docs: [seo-starter-guide, accented-characters-blog, spam-policies]
        status: documented
      - id: DEV-INT-12
        level: SHOULD
        title: "Mark the text direction of right-to-left and mixed-script titles, product names and URLs"
        why: >-
          Said at Search Central Live by a community speaker: Persian and Arabic run right to left and English left to right, so a title, product name or URL that mixes the two can display in a confusing, unpredictable order even when its content is correct.
        how: >-
          Set lang and dir="rtl" on the html element of right-to-left pages, wrap embedded left-to-right fragments (brand names, model numbers) in bdi or an element with dir="ltr" or dir="auto", and generate titles so the main language comes first. Keep URL slugs in one script per language.
        test: >-
          Review the title, h1 and product names of key right-to-left templates in a browser and in search results: words, numbers and punctuation appear in the intended order.
        claims: [D2-C963, D2-C964]
        docs: []
        status: event-only

  - id: page-structure-html
    title: Page structure and HTML
    intro: >-
      Google parses each page into a DOM, tells header, navigation, main content and footer apart, and weighs words by where they appear. Templates decide whether the main content is easy to find and whether controls in the HTML work as intended.
    requirements:
      - id: DEV-HTM-01
        level: SHOULD
        title: "Wrap each page's primary content in one clearly delimited main area"
        why: >-
          Google extracts every element to tell header, navigation and main content apart, treats the main content as very important and clusters pages by it. A page that uses a different template can be reported as "Crawled - currently not indexed" because Google cannot tell where its content is, even when its quality matches indexed pages.
        how: >-
          Use semantic landmarks: header, nav, one main (with article where it fits), aside and footer. Main content is any part that directly helps the page achieve its purpose: text, images, video, a tool, user-generated content such as comments or reviews, content in tabs, every heading and the visible title; Gary Illyes said it is what Google considers when ranking a page, and that what a site puts in its navigation or header tells Google the site does not particularly care about that content. Keep the h1, the opening paragraph, key images and the facts the page is about inside main, near the top, and use the same structure across templates of one type.
        test: >-
          Template validation finds one main element per page, with the page's h1 inside it; the rendered HTML in URL Inspection shows the main text inside main; the DevTools accessibility tree shows the landmarks.
        snippet: semantic-page-template
        claims: [D2-C028, D2-C309, D2-C310, D2-C713, D2-C029, D2-C861, D2-C862, D2-C863, D2-C864, D2-C865, D2-C867, D2-C868, D2-C870, D2-C871]
        docs: [canonicalization, how-search-works, rater-guidelines]
        status: documented
      - id: DEV-HTM-02
        level: SHOULD
        title: "Place the words a page should rank for in its main content, not in footers or sidebars"
        why: >-
          Google weighs words by the part of the page they appear in, and where text sits already contributes quite a bit to ranking. Said at Search Central Live: words in the footer get a lower weight, so footer keyword blocks add little.
        how: >-
          Give editors template fields for the title, h1, introduction and subheadings inside the main area, and drop footer or sidebar keyword blocks and tag clouds used to add terms.
        test: >-
          Per template, the target terms appear in the title, the h1 and the first paragraph, and footers contain no keyword blocks.
        claims: [D2-C312, D2-C315, D2-C313, D2-C314, D2-C317]
        docs: [search-essentials, seo-starter-guide]
        status: documented
      - id: DEV-HTM-03
        level: MUST
        title: "Give every indexable page a unique, descriptive title element in the server HTML"
        why: >-
          Indexing analyses a page's text and key tags such as the title element, and snippets come mainly from the page content and sometimes from the meta description. A community speaker showed a site whose rendered meta description contained HTML tags, a sign of a broken process. Google generates title links and snippets from its understanding of the page even when the site provides nothing extra, and it notices a changed title only after recrawling and reprocessing the page, which its title link guide says takes a few days to a few weeks.
        how: >-
          Generate the title on the server from the page's own data, with no placeholders, no HTML and no duplicates across a template, and keep it descriptive and specific to the page. You should also generate a plain-text meta description per page in the same way: Google builds snippets mainly from the page content and uses the description only sometimes, but a broken one still reaches results.
        test: >-
          A crawl finds no missing, duplicate, empty or placeholder titles, and no meta description that contains < or > or a placeholder.
        claims: [D2-C445, D2-C725, D2-C142, D3-C316, D3-C657, D3-C675, D2-C858]
        docs: [how-search-works, snippets-guide, seo-starter-guide, title-links]
        status: documented
      - id: DEV-HTM-04
        level: SHOULD
        title: "Use semantic, accessible HTML: real buttons, labelled forms and a logical heading order"
        why: >-
          Google's guide for generative AI features says browser agents may read a site through screenshots, the DOM and the accessibility tree, and recommends semantic HTML; attendees were also told to check ARIA and accessibility, and a community speaker added that an unlabelled div tells an agent nothing about its purpose and that no ARIA is better than bad ARIA. Google has not called accessibility a ranking signal, and its SEO Starter Guide says headings out of order help screen readers less but do not matter to Google Search.
        how: >-
          Buttons are button elements and links are a elements with href; form fields have labels; headings follow a logical h1 to h3 order; images have alt text; ARIA roles are used only where no native element exists, and only when they are correct (a div acting as a toggle gets role=button, an aria-label and aria-pressed). Avoid layout shifts that move buttons after load. Do not block agents you want to allow (DEV-AIF-04).
        test: >-
          An axe or Lighthouse accessibility audit runs in CI on key templates, plus a keyboard-only and screen-reader check of navigation, forms and checkout.
        claims: [D1-C131, D1-C118, D2-C465, D1-C119, D1-C274, D1-C277, D1-C278, D1-C279, D1-C280, D1-C313]
        docs: [ai-optimization-guide, web-dev-aria-html, web-dev-content-structure, seo-starter-guide]
        status: documented
      - id: DEV-HTM-05
        level: SHOULD
        title: "Write valid HTML and close every element"
        why: >-
          Valid HTML is technically not a ranking factor, but it matters for controls such as data-nosnippet, where an unclosed element can extend the rule to the rest of the page. Parsing turns the HTML into a DOM tree, and broken markup changes what ends up where.
        how: >-
          Lint templates in CI with html-validate or the W3C Nu checker, and fix unclosed elements, invalid nesting and stray elements in the head: a parser ends the head at the first element that does not belong there, which pushes later meta tags into the body, and Google stops reading head elements after the first invalid one.
        test: >-
          The validator reports no errors on key templates, and the robots meta tag, canonical and hreflang appear inside head in the parsed DOM.
        claims: [D2-C080, D2-C078, D2-C027, D2-C831]
        docs: [robots-meta-tag-spec, seo-starter-guide, valid-page-metadata]
        status: documented
      - id: DEV-HTM-06
        level: AVOID
        title: "Never hide text from users, such as white-on-white or off-screen keyword blocks"
        why: >-
          Hidden text is against Google's spam policies, and sites that violate them may rank lower or not appear at all. Said at Search Central Live: Google records spam metadata such as white-on-white text with a page's tokens, so leftover hidden keyword blocks are a liability rather than neutral clutter.
        how: >-
          Remove hidden keyword blocks, text in the background colour and text positioned off-screen for search engines. Legitimately hidden interface content (tabs, accordions, screen-reader-only labels) is fine.
        test: >-
          A crawl with a style check finds no text whose colour matches its background and no off-screen or display:none blocks outside accessibility helpers and UI components.
        claims: [D2-C324, D2-C343, D2-C667]
        docs: [spam-policies]
        status: documented
      - id: DEV-HTM-07
        level: MAY
        title: "Use real heading, title and emphasis elements instead of styling alone"
        why: >-
          Said at Search Central Live: when Google tokenizes a page for its index it attaches metadata to each word, such as whether it appeared in the page header, the main content, a heading or in bold. Text that only looks like a heading or bold text through CSS does not carry that information.
        how: >-
          Put the page title in the title element, the visible title in an h1 and section titles in h2 to h6 elements, mark important terms with strong or b rather than CSS font-weight on spans, and keep emphasis sparing so it still means something.
        test: >-
          Template review or an HTML lint rule finds no headings or emphasis built from styled div or span elements.
        claims: [D2-C323, D2-C720]
        docs: []
        status: event-only

  - id: structured-data
    title: Structured data
    intro: >-
      Structured data makes pages eligible for rich results, gives Google precise facts such as prices, dates and identifiers more cheaply and accurately than model-based extraction, and the same processed data feeds classic results and AI features. It must describe what users can see.
    requirements:
      - id: DEV-SDA-01
        level: SHOULD
        title: "Write structured data as JSON-LD by default"
        why: >-
          Google accepts JSON-LD, microdata and RDFa and interprets them identically, but recommends JSON-LD because one contiguous block is easier to author and people make fewer mistakes with it. Said at Search Central Live: microdata can save payload where page weight is critical.
        how: >-
          Render JSON-LD on the server in a script type="application/ld+json" block generated from the same data as the visible page, one block per entity or a single @graph. Switch to microdata only for very weight-sensitive templates.
        test: >-
          The Rich Results Test on one URL per template detects the expected items without errors, and the JSON-LD is present in the raw HTML (curl).
        snippet: product-jsonld
        claims: [D2-C495, D2-C494, D2-C496, D2-C497]
        docs: [intro-structured-data]
        status: documented
      - id: DEV-SDA-02
        level: MUST
        title: "Mark up only content that is visible on the page and relevant to it"
        why: >-
          Google's guidelines say not to mark up content that readers cannot see, even if it is accurate. Irrelevant structured data can be treated as abusive: filters make it ineffective, and egregious cases lead to a manual action that removes rich result eligibility without affecting web ranking. Google said at Search Central Live that once it sees markup it does not trust from a site, it may stop using that site's structured data altogether.
        how: >-
          Generate markup from the same fields that render the visible content, use it for the machine-precise form of visible facts (an ISO date for a shown date, the homepage url for a named organisation), and remove markup for content a page no longer shows.
        test: >-
          For each template, the Rich Results Test output matches what the page visibly shows, and the Manual actions report in Search Console is empty.
        claims: [D2-C467, D2-C500, D2-C501, D2-C468, D3-C647]
        docs: [structured-data-guidelines, intro-structured-data]
        status: documented
      - id: DEV-SDA-03
        level: SHOULD
        title: "Choose the specific types Google documents for its features, and skip generic or irrelevant ones"
        why: >-
          Google uses schema.org but mostly consumes the subsets its documentation declares, and a very generic type says little and is hard to use. Pick the types relevant to the page instead of every type Google is interested in; extra relevant markup is never penalised, and Google also retires little-used features.
        how: >-
          Start from Google's Search gallery, map each template to its types and their required and recommended properties, describe each entity with the most specific type, and do not spend effort marking up every semantic detail. Revisit the list when Google adds or retires features.
        test: >-
          The Rich Results Test lists the intended features per template, and Search Console shows an enhancement report for each type in use.
        claims: [D2-C490, D2-C487, D2-C486, D2-C492, D2-C489, D2-C488, D2-C522]
        docs: [search-gallery, intro-structured-data, structured-data-guidelines, simplifying-serp-blog]
        status: documented
      - id: DEV-SDA-04
        level: SHOULD
        title: "Identify entities with unique identifiers: url, @id and stable IDs"
        why: >-
          A unique identifier, such as the homepage URL in an organisation's url property, lets Google tell which specific entity is meant instead of reading a bare name. Said at Search Central Live: markup can also carry stable identifiers that the visible text lacks, for example for user-generated content.
        how: >-
          Give the Organization a url (the homepage) and a logo and reference it by @id from other blocks; give products sku or gtin values; give each entity a stable @id URL with a fragment (https://www.example.com/#organization) and keep it constant across pages and releases.
        test: >-
          The Rich Results Test shows url and @id on the Organization and other entities, and the @id values are identical on every page.
        snippet: organization-jsonld
        claims: [D2-C502, D2-C463, D2-C468]
        docs: [organization-sd]
        status: documented
      - id: DEV-SDA-05
        level: SHOULD
        title: "Write dates in ISO 8601 and give every date-time a UTC offset"
        why: >-
          A full ISO 8601 value in markup disambiguates a visible date whose local time zone Google might not detect correctly, and date formats also differ between countries; this matters for event extraction and wherever the date must be exactly right, such as sale periods. Google accepts a date without a time where the time is not known: its Event guide asks for 2019-08-15 rather than an invented hour.
        how: >-
          Output values such as 2026-11-27T19:30:00+01:00 for startDate, uploadDate, validFrom, priceValidUntil and similar properties, generated from the same timestamp as the visible date and with the correct UTC offset. Where the time is unknown or irrelevant, write the date alone (2026-11-27).
        test: >-
          The Rich Results Test shows the parsed dates, and a unit test asserts that every DateTime value has an offset (+01:00 or Z) and that date-only values are YYYY-MM-DD, used only where the time is unknown or irrelevant.
        snippet: product-jsonld
        claims: [D2-C466, D2-C463, D2-C610, D2-C468, D2-C836]
        docs: [event-sd, merchant-listing-sd]
        status: documented
      - id: DEV-SDA-06
        level: SHOULD
        title: "Emit each structured data entity once per page, and audit CMS plug-ins for duplicates"
        why: >-
          Said at Search Central Live: several plug-ins emitting the same markup type is one of the most common structured data problems, and the duplicates can make an event detail page look like a list of events and change how Google interprets the page.
        how: >-
          Decide which layer owns each type (theme, SEO plug-in, events plug-in, tag manager), disable the others, and merge the output into one @graph per page.
        test: >-
          The Rich Results Test on one URL per template shows each item once, unless the page really lists several entities.
        claims: [D2-C503, D2-C504]
        docs: []
        status: event-only
      - id: DEV-SDA-07
        level: SHOULD
        title: "Describe only the page's main product in Product markup, not related-product carousels"
        why: >-
          Google's merchant listing guide says Product rich results only support pages that focus on a single product, or on several variants of the same product. Said at Search Central Live: structured data also points Google at the pertinent data and stops its systems pulling in extraneous information such as the prices of related products, while Google's own extraction sometimes fails to find a page's main content.
        how: >-
          Generate Product and Offer markup only for the product the page is about, and give recommendation, recently-viewed and bundle carousels no Product markup.
        test: >-
          The Rich Results Test on product pages lists exactly one product (or one product group with its variants).
        claims: [D2-C834, D2-C473, D2-C474, D2-C475]
        docs: [merchant-listing-sd]
        status: documented
      - id: DEV-SDA-08
        level: SHOULD
        title: "Mark up merchant listings completely, with validity dates for sale prices"
        why: >-
          Google's merchant listing guide has explained validity dates for sale prices in a Sale duration section since July 2026 (its updates log calls this a clarification). Said at Search Central Live: with the dates in place, merchants need not rush to remove a sale price for fear it shows wrongly in snippets. The template must still switch back to the regular price when the sale ends: Google warns that a listing may not display if priceValidUntil is in the past. Product markup should also show current availability. The product name is required, and unlike product snippets, merchant listing experiences require a price greater than zero; an empty name and a price of zero were among the problems the Rich Results Test flagged in a community demo at the event.
        how: >-
          Product with a non-empty name, image, description, sku or gtin and brand; Offer with a price above zero, priceCurrency, availability and itemCondition. For a sale, put the sale price in price, the regular price in a StrikethroughPrice UnitPriceSpecification, and bound it with validFrom and priceValidUntil (or validThrough) in ISO 8601. When the sale ends, render the regular price in price and drop the StrikethroughPrice. Keep values and dates identical to the Merchant Center feed.
        test: >-
          The Rich Results Test shows a valid merchant listing, the Merchant listings report has no errors, and a scheduled check confirms feed and markup prices match.
        snippet: product-jsonld
        claims: [D2-C507, D2-C506, D2-C508, D2-C012, D2-C835, D1-C507, D1-C502]
        docs: [merchant-listing-sd, search-docs-updates]
        status: documented
      - id: DEV-SDA-09
        level: SHOULD
        title: "Declare return, shipping and loyalty policies once at organisation level"
        why: >-
          Google's shopping markup supports loyalty programs, shipping policies and return policies defined at organisation level, with details at product level only where they differ.
        how: >-
          On the homepage or a policy page, add an Organization (or OnlineStore) block with hasMerchantReturnPolicy, hasShippingService (a ShippingService with shippingConditions) and hasMemberProgram (a MemberProgram with tiers). Override in the Offer (OfferShippingDetails, member prices with validForMemberTier) only for exceptions. From each Offer, reference the organisation-level policies by @id only, as Google's merchant listing guide shows: shippingDetails with an OfferShippingDetails whose hasShippingService is {"@id": ...}, and hasMerchantReturnPolicy {"@id": ...}.
        test: >-
          The Rich Results Test on the homepage detects the organisation details, and the Merchant listings report recognises shipping and returns.
        snippet: organization-jsonld
        claims: [D2-C505, D2-C502, D3-C383, D3-C384]
        docs: [shipping-policy-sd, loyalty-program-sd, organization-sd, merchant-listing-sd]
        status: documented
      - id: DEV-SDA-10
        level: SHOULD
        title: "Put the same structured data on duplicate URLs as on the canonical"
        why: >-
          Google's guidelines recommend the same structured data on all duplicates of a page, not only on the canonical. Said at Search Central Live: deduplication runs before feature extraction, so markup that exists only on a URL that loses canonical selection may never be extracted.
        how: >-
          Render markup from the page template rather than per URL, so parameter, print and mobile variants carry identical markup, and make sure the preferred canonical has the complete markup.
        test: >-
          The Rich Results Test returns the same items for the canonical and for a duplicate variant.
        claims: [D2-C451, D2-C444, D2-C450]
        docs: [structured-data-guidelines]
        status: documented
      - id: DEV-SDA-11
        level: MUST
        title: "Validate markup in the Rich Results Test before it reaches templates, and monitor it after release"
        why: >-
          Google recommends testing and previewing structured data in the Rich Results Test and testing manually before putting markup into templates. AI-generated markup can contain hallucinations, such as invented properties or broken nesting, and should be fact-checked and validated before publishing.
        how: >-
          Prototype each type on one page, validate it, then put it in the template. The Rich Results Test takes a public URL, which Google fetches itself, or pasted code: for staging and other private pages paste the rendered HTML, as a community demo's script did at the event, and keep the resources it loads reachable anonymously, because the test cannot load resources behind a firewall or a password. Fix every error (a critical issue makes the item invalid and stops the rich result); warnings are non-critical and only limit how the item can appear. Add a CI step that extracts JSON-LD from rendered templates and checks syntax and required properties, and review the Search Console enhancement reports after each release.
        test: >-
          The Rich Results Test passes for one URL per template; CI fails on JSON-LD parse errors or missing required properties.
        claims: [D2-C498, D2-C499, D2-C462, D2-C460, D1-C251, D1-C265, D1-C501, D1-C506]
        docs: [rich-results-test-help, intro-structured-data, gen-ai-content-guide, rich-result-report-help]
        status: documented
      - id: DEV-SDA-12
        level: MAY
        title: "Wire Google's SHACL validation rules into the build once they are published"
        why: >-
          Said at Search Central Live: Google plans to publish downloadable SHACL rules on each structured data feature guide, to run inside a site's content generation so markup is checked before it is published. They will catch problems such as a missing required field but will not replace Search Console reports, and they were not yet available at the time of the event.
        how: >-
          Plan a CI or CMS publishing step that runs a SHACL validator (for example pySHACL) against the generated JSON-LD, adopt the rules type by type as Google releases them, and keep the Rich Results Test and Search Console as the reference.
        test: >-
          Once rules exist, the build fails when a template drops a required property.
        claims: [D2-C514, D2-C515, D2-C516, D2-C517, D2-C519, D2-C520]
        docs: []
        status: event-only
      - id: DEV-SDA-13
        level: SHOULD
        title: "Add Article markup with headline, images, dates and authors to every article template"
        why: >-
          Article structured data is not required for Top Stories or other Google News features, but Google highly recommends it for all articles: it tells Google explicitly that the content is a news article, what its headline is, who wrote it and when, and it can indicate that content is behind a paywall.
        how: >-
          Render a NewsArticle, BlogPosting or Article block on the server from the article's own fields: headline, image as the visible lead image in 1x1, 4x3 and 16x9 versions, datePublished and dateModified with a UTC offset (DEV-SDA-05), and author as a list of Person or Organization objects with name and a url to the author page. For paywalled articles add isAccessibleForFree false and a hasPart WebPageElement whose cssSelector names the paywalled section.
        test: >-
          The Rich Results Test detects the article on one URL per article template with no errors; the dates match the visible dates; every author url opens a real author page.
        snippet: article-jsonld
        claims: [D3-C330, D3-C331, D3-C332, D3-C334, D3-C333]
        docs: [article-sd, paywalled-content-sd]
        status: documented
      - id: DEV-SDA-14
        level: AVOID
        title: "Do not mark up self-serving review ratings of your own business"
        why: >-
          Review snippets show an average star rating, and often the number of reviews, for products, local businesses, films, books and other things. Google's review snippet guide makes ratings of local businesses and organizations eligible only on sites that capture reviews about other businesses; reviews a business shows about itself are self-serving and not eligible.
        how: >-
          Generate Review and AggregateRating markup only from the reviews visible on the page (DEV-SDA-02), for example on product pages, and remove LocalBusiness or Organization ratings about your own business from the site's markup, including those added by review widgets.
        test: >-
          The Rich Results Test shows review snippets only on templates with visible reviews, and a crawl finds no rating on the site's own Organization or LocalBusiness entity.
        claims: [D3-C337, D3-C339, D3-C340]
        docs: [review-snippet-sd, structured-data-guidelines]
        status: documented
      - id: DEV-SDA-15
        level: SHOULD
        title: "State the preferred site name with WebSite markup on the home page"
        why: >-
          The site name shown with each text result is an attribution element, generated automatically from the home page and references to the site on the web; site owners can indicate their preferred name with WebSite structured data. Google supports one site name per domain or subdomain, not per subdirectory.
        how: >-
          Add a WebSite block with name, an optional alternateName and url (the canonical home page) to the home page of every domain and subdomain that should have its own name, and use the same name in the home page title and in Organization markup.
        test: >-
          curl the home page of each host and find exactly one WebSite block with the intended name and the canonical home page url.
        snippet: website-site-name
        claims: [D3-C335, D3-C336]
        docs: [site-names]
        status: documented

  - id: shopping
    title: Shopping data (Merchant Center, product markup and Storebot)
    intro: >-
      Product rich results come from structured data, the Shopping tab needs a Merchant Center feed, and Google Shopping's own crawler, Storebot-Google, checks both against the shop. AI shopping experiences ask for richer product data than classic results, delivered first through the feed.
    requirements:
      - id: DEV-SHP-01
        level: SHOULD
        title: "Use Product markup for rich results and a Merchant Center feed for the Shopping tab, with identical values"
        why: >-
          Product structured data alone makes pages eligible for product rich results and product annotations in Google Images; Merchant Center is not required for them, and Merchant Center does not require the markup. Google's product guide says providing both maximizes eligibility for shopping experiences and helps Google understand and verify the data, and Merchant Center's automatic item updates can use landing-page markup to fix price and availability mismatches, without replacing regular feed updates. Said at Search Central Live: the Shopping tab needs a Merchant Center feed.
        how: >-
          Generate the feed and the JSON-LD from the same product database so price, sale price, availability, condition, brand and GTIN never diverge (DEV-SDA-08), update the feed whenever prices or stock change, and turn on automatic item updates as a safety net.
        test: >-
          Merchant Center diagnostics show no price or availability mismatches, the Merchant listings and Product snippets reports in Search Console show no errors, and a scheduled job compares feed values with the JSON-LD of sampled product pages.
        snippet: product-jsonld
        claims: [D3-C343, D3-C344, D3-C345, D3-C346, D3-C349, D3-C350, D3-C354, D3-C402, D3-C351]
        docs: [product-sd-intro, mc-free-listings, mc-automatic-updates]
        status: documented
      - id: DEV-SHP-02
        level: SHOULD
        title: "Let Storebot-Google crawl product, cart and checkout pages, through robots.txt and bot protection"
        why: >-
          Google Shopping crawls with its own user agent, Storebot-Google, because it needs fresh prices, availability and shipping details. It visits product, cart and checkout pages, can fill in checkout forms and records price, shipping, availability, coupons and payment methods to verify the data merchants send. robots.txt rules addressed to Storebot-Google affect all Google Shopping surfaces, and a crawler without its own group follows the * group, so a shop that disallows /cart/ and /checkout/ for every crawler also blocks these checks.
        how: >-
          Give Storebot-Google its own robots.txt group that repeats the general rules but leaves cart and checkout paths open; verify it like Googlebot, as one of Google's common crawlers (DEV-SRV-01), and exempt it from rate limits, CAPTCHAs and bot challenges on product, cart and checkout flows. Block it only if the shop deliberately stays out of Google Shopping.
        test: >-
          Google's open-source robots.txt parser, run with the Storebot-Google token, returns allowed for a product URL, /cart/ and /checkout/; server logs show Storebot-Google requests answered with 200, not 403, 429 or challenge pages.
        snippet: robots-txt-storebot
        claims: [D3-C385, D3-C386, D3-C387, D3-C388, D3-C389, D3-C390]
        docs: [mc-storebot, common-crawlers]
        status: documented
      - id: DEV-SHP-03
        level: SHOULD
        title: "Send conversational product data in the Merchant Center feed: Q&A, product details, highlights and related products"
        why: >-
          In 2026 Google added Merchant Center attributes intended mainly for conversational experiences such as AI Mode (question_and_answer, document_link, related_product and popularity_rank) and more flexible variant data (item_group_title and variant_option), and it now stresses the existing product_highlight and product_detail attributes for AI. In Google's testing with one brand, the conversational attributes it submitted were used in 50% of relevant product recommendations in AI Mode.
        how: >-
          Extend the feed generator: up to 30 question_and_answer pairs per product (question and answer up to 1,000 characters each, 10,000 in total, with no prices, shipping, dates or company name), up to 100 product_detail specifications as section, attribute name and value, 2 to 100 product_highlight lines of up to 150 characters without promotional text, up to five document_link URLs of PDFs you hold the rights to, related_product for accessories and parts, and popularity_rank as a 0-100 rank against your own inventory. Source the answers from real customer questions, and keep the core attributes (price, availability, brand, GTIN) accurate first.
        test: >-
          Merchant Center reports no errors for the new attributes, and a sampled product's Q&A, details and highlights in the feed match its product page.
        snippet: merchant-feed-conversational
        claims: [D3-C365, D3-C367, D3-C368, D3-C369, D3-C371, D3-C372, D3-C373, D3-C375, D3-C392, D3-C393, D3-C394, D3-C395, D3-C408]
        docs: [mc-product-data-spec, mc-question-and-answer, mc-product-detail, mc-product-highlight, mc-document-link, mc-related-product, mc-popularity-rank, mc-item-group-title, mc-variant-option]
        status: documented
      - id: DEV-SHP-04
        level: MAY
        title: "Treat product Q&A and specification markup in schema.org as an extra on top of the feed"
        why: >-
          Said at Search Central Live: most of the new conversational feed attributes already exist in schema.org and Google can use them from product markup too, product Q&A can be marked up as Question items, each with an acceptedAnswer, linked to the Product through subjectOf, and a recent schema.org release added specification and valueGroup for product details. As of 3 October 2026 neither Search Central nor the Merchant Center attribute pages document such markup (only item_group_title maps, to ProductGroup.name), so the feed is the documented route, and the extra markup makes pages heavier.
        how: >-
          Keep the Merchant Center feed as the source (DEV-SHP-03). If you add markup, generate it from the same Q&A and specification data the page visibly shows (DEV-SDA-02), attach Question items with Answer objects to the Product through subjectOf, and watch the HTML size (DEV-PRF-04).
        test: >-
          The JSON-LD parses, the Rich Results Test still reports the product without errors, and every marked-up question and answer is visible on the page.
        claims: [D3-C391, D3-C380, D3-C399, D3-C406, D3-C381, D3-C400]
        docs: []
        status: event-only

  - id: images
    title: Images
    intro: >-
      Google finds images through img elements in the HTML and through image sitemaps, understands them through alt text and the surrounding text, and can show them in web search, Google Images, Discover and AI features.
    requirements:
      - id: DEV-IMG-01
        level: MUST
        title: "Put every image that should be found in an <img> element with a src attribute"
        why: >-
          Google finds images with an HTML parser that looks for img elements, and src is the most important attribute: without it Google does not know where the image is. The picture element is supported only through the img it contains, and CSS background images are not extracted.
        how: >-
          Product, article and other content images use img with src, inside picture where art direction or modern formats are needed. Keep CSS backgrounds for decoration. Lazy-loaded images keep a real src with loading="lazy", not only a data-src filled in by a script.
        test: >-
          In the rendered HTML (URL Inspection) key images are img elements with a src; a template search finds no background-image on content images.
        snippet: responsive-image
        claims: [D2-C527, D2-C528, D2-C526, D2-C532, D2-C524, D2-C538]
        docs: [image-seo]
        status: documented
      - id: DEV-IMG-02
        level: MUST
        title: "Describe every meaningful image in its alt attribute"
        why: >-
          Google calls alt text the most important attribute for image metadata and uses it, with computer vision and the page content, to understand the image. Alt text should describe the image for someone who cannot see it, and the image can rank for what it describes.
        how: >-
          Make alt text a required CMS field for content images, write specific descriptions rather than file names or keyword lists, and give decorative images an empty alt="". If alt text is generated with an LLM, as a community speaker showed through a crawler's custom JavaScript, first run it on a few chosen URLs and review the output, and give the model the page title as well as the image so the text carries the page's intent.
        test: >-
          A crawl finds no content image with a missing alt, an empty alt or an alt equal to the file name; the axe or Lighthouse image-alt check passes.
        claims: [D2-C534, D2-C535, D2-C536, D2-C949, D2-C950]
        docs: [image-seo]
        status: documented
      - id: DEV-IMG-03
        level: SHOULD
        title: "Place images next to text that explains them"
        why: >-
          The text around an image is critical: Google uses it as context to understand and rank the image, so alt text alone is not enough. An extracted image can then appear almost anywhere Google shows results.
        how: >-
          Put images in the main content near the paragraph they illustrate, add a figcaption or explanatory sentence to key images, and avoid image-only galleries without text.
        test: >-
          Template review: key images sit inside main with a caption or adjacent descriptive text.
        snippet: responsive-image
        claims: [D2-C537, D2-C525, D2-C539]
        docs: [image-seo]
        status: documented
      - id: DEV-IMG-04
        level: SHOULD
        title: "List important images in an image sitemap"
        why: >-
          Besides img elements, image sitemaps tell Google about the images on each page, which helps for images that JavaScript loads or that are otherwise hard to find.
        how: >-
          Add image:image entries with image:loc under each page's url in the sitemap, or in a separate image sitemap, up to 1,000 images per page, and list only images you want indexed.
        test: >-
          The Sitemaps report reads the file, and the image URLs in it return 200 and are not disallowed.
        snippet: image-sitemap
        claims: [D2-C540, D2-C527]
        docs: [image-sitemaps]
        status: documented
      - id: DEV-IMG-05
        level: SHOULD
        title: "Serve modern, compact image formats with a widely supported file in the img src"
        why: >-
          Google supports pretty much all popular image formats and recommends high-quality modern formats such as WebP with small files. Its documentation lists AVIF as supported, but Gary Illyes said at Search Central Live that AVIF currently has hiccups and Google may have problems ingesting it.
        how: >-
          Offer AVIF and WebP through source elements inside picture, keep a WebP or JPEG file in the img src, set width and height, compress the files and serve responsive sizes with srcset.
        test: >-
          Lighthouse format and sizing checks pass; the img src of key images is WebP or JPEG; key images appear in Google Images after launch.
        snippet: responsive-image
        claims: [D2-C544, D2-C541, D2-C543, D2-C542, D2-C545]
        docs: [image-seo, avif-blog]
        status: documented
      - id: DEV-IMG-06
        level: SHOULD
        title: "Keep images out of Search with robots.txt or X-Robots-Tag, not with CSS tricks"
        why: >-
          Google's documented ways to keep a site's images out of search results are a robots.txt disallow (for example for Googlebot-Image) or a noindex X-Robots-Tag header, with the Removals tool for emergencies. A CSS background image, suggested on stage, only avoids extraction from that page; the same image URL used in an img element elsewhere or listed in a sitemap can still be indexed.
        how: >-
          Disallow the image paths for Googlebot-Image, or send X-Robots-Tag: noindex for them, but not both for the same URLs, because the header is not seen on a disallowed URL.
        test: >-
          Google's open-source robots.txt parser (github.com/google/robotstxt), run with the Googlebot-Image token, returns disallowed for the image paths, or curl -I on an image shows the X-Robots-Tag header; after recrawl the images no longer appear in Google Images.
        snippet: x-robots-tag
        claims: [D2-C529, D2-C530, D2-C826, D2-C931, D2-C932]
        docs: [remove-images]
        status: documented
      - id: DEV-IMG-07
        level: SHOULD
        title: "Give every article a large, relevant lead image and declare it in og:image or markup"
        why: >-
          For Discover, Google recommends large images at least 1,200 px wide, with more than 300,000 pixels and a 16x9 aspect ratio, enabled by max-image-preview:large (DEV-IDX-04); a small thumbnail lowers click-through and a large one raises it. Avoid generic images such as the site logo, text-heavy images and misleading or exaggerated ones. The image named in schema.org markup or og:image can influence the thumbnail Discover chooses.
        how: >-
          Make a lead image at least 1,200 px wide a required field of article templates, output it in og:image and in the Article markup's image list (DEV-SDA-13), crop 16x9 versions that keep the important details, and fall back to no image rather than the logo.
        test: >-
          A crawl of article URLs finds on each an og:image at least 1,200 px wide that is not the logo; Search Console's Discover report shows impressions for article templates.
        snippet: discover-image-meta
        claims: [D3-C224, D3-C225, D3-C226, D3-C227, D3-C221, D3-C230]
        docs: [google-discover]
        status: documented
      - id: DEV-IMG-08
        level: MAY
        title: "Keep the IPTC and C2PA metadata that marks AI-generated images"
        why: >-
          Whether a site uses AI-generated images is up to its owner, Google said at the event, but they must work for users and be checked for errors such as garbled text, which image models typically render poorly. Google Images supports the IPTC Digital Source Type values for algorithmically created images, such as trainedAlgorithmicMedia, and can show C2PA details in "About this image".
        how: >-
          Keep the IPTC DigitalSourceType and any C2PA manifest from the generating tool when images are resized or compressed (many image pipelines strip metadata by default), and review AI images before publishing (DEV-SPM-05).
        test: >-
          exiftool -XMP-iptcExt:DigitalSourceType on a published AI-generated image shows the source type that the original file had.
        claims: [D2-C943, D2-C937, D2-C941, D2-C939]
        docs: [image-metadata, gen-ai-content-guide]
        status: documented

  - id: video
    title: Video
    intro: >-
      Google extracts videos from the page together with the data around them and passes them to its media indexing. A dedicated watch page, a video element that loads without interaction and VideoObject markup make a video eligible for video features such as key moments.
    requirements:
      - id: DEV-VID-01
        level: MUST
        title: "Embed each video in a video, iframe, embed or object element that loads without user action"
        why: >-
          Google finds videos referenced in these elements and extracts the video with the data around it. A video that loads only after a click, swipe or typing is not found.
        how: >-
          Output the player element in the HTML at load (a poster frame is fine), at its real size and position and not hidden behind other elements, and for lazy players keep the element and its src or embed URL in the DOM. The Video indexing report flags "Cannot determine video position and size" when the player is not on the page at load. Said at Search Central Live: without a video container in the HTML Google treats the page as having no video, and the video should be embedded prominently, above the fold.
        test: >-
          The rendered HTML in URL Inspection contains the video element or iframe with its URL, and the Video indexing report lists the page.
        snippet: video-object-jsonld
        claims: [D2-C448, D2-C551, D2-C918, D2-C942, D2-C924]
        docs: [video-seo, video-indexing-report]
        status: documented
      - id: DEV-VID-02
        level: SHOULD
        title: "Give each important video its own watch page"
        why: >-
          A video must be embedded on an indexed watch page to be eligible for video features, and Google recommends a dedicated watch page per video where it makes sense. A Google slide listed a dedicated watch page, compelling titles and descriptions, relevant thumbnails, markup, fast pages and sitemap inclusion as key factors.
        how: >-
          Give each important video one URL where it is the main content, with a title and description specific to that video, a transcript or summary, and links from related articles. Gary Illyes said a video without a dedicated watch page is not going to be indexed, and that descriptive text around the video helps Google rank and retrieve it.
        test: >-
          The Video indexing report shows the watch pages indexed with a detected video and no "video is not the main content" issue.
        claims: [D2-C554, D2-C553, D2-C552, D2-C557, D2-C916, D2-C927]
        docs: [video-seo, video-indexing-report]
        status: documented
      - id: DEV-VID-03
        level: SHOULD
        title: "Describe videos with VideoObject markup and mark key moments with Clip or SeekToAction"
        why: >-
          Google strongly suggests describing a video's metadata with JSON-LD in addition to the HTML element. Video features such as key moments and previews build on it: Clip markup gives exact segments, and SeekToAction tells Google how timestamps appear in your URLs.
        how: >-
          VideoObject with name, description, thumbnailUrl, uploadDate in ISO 8601, duration, and contentUrl or embedUrl; hasPart Clip items with name, startOffset, endOffset and a url pointing at the same watch page at that second. Keep thumbnails crawlable and make them show the video's real content: said at Search Central Live, Google's experiments show a very high drop-out at the start of videos whose thumbnail is wrong.
        test: >-
          The Rich Results Test detects the video and its clips, and the Video indexing report shows it as indexed.
        snippet: video-object-jsonld
        claims: [D2-C551, D2-C550, D2-C917]
        docs: [video-seo, intro-structured-data]
        status: documented
      - id: DEV-VID-04
        level: SHOULD
        title: "List videos in a video sitemap"
        why: >-
          Including videos in a sitemap helps Google discover all of a site's video content. Said at Search Central Live: video sitemaps are not critical but good to have, because Google ingests them much more often than it can process HTML pages, and they tell it which URLs to check for video instead of checking every page.
        how: >-
          Add video:video entries (thumbnail, title, description, and content or player location) for each watch page, in the page sitemap or a separate video sitemap.
        test: >-
          The Sitemaps report reads the video sitemap, and its video count matches the Video indexing report.
        claims: [D2-C556, D2-C925, D2-C926]
        docs: [video-sitemaps]
        status: documented
      - id: DEV-VID-05
        level: MAY
        title: "Allow video previews with max-video-preview:-1"
        why: >-
          max-video-preview sets the maximum number of seconds of a video preview in Search: 0 allows only a static image and -1 means no limit. Google said it does not expect -1 to produce an hour-long preview.
        how: >-
          Add max-video-preview:-1 to the robots meta tag of watch pages unless licensing requires a limit.
        test: >-
          curl the watch page and check the robots meta content.
        snippet: robots-meta-tags
        claims: [D2-C090, D2-C091]
        docs: [robots-meta-tag-spec, video-seo]
        status: documented
      - id: DEV-VID-06
        level: SHOULD
        title: "Serve videos fast in a common container with standard codecs, and never block the files"
        why: >-
          Google processes the most popular video file types, MP4 and WebM among them, and the server streaming the video needs enough resources to support crawling. Said at Search Central Live by Gary Illyes: what matters is that the video itself loads fast, a CDN that serves it faster than the site's own server is a win, MP4 is recommended for its compatibility, and unusual codecs leave some people unable to play it. If robots.txt disallows a video file, Google does not index the video, and unlike a blocked web page it does not show the bare URL.
        how: >-
          Encode in MP4 (H.264 video, AAC audio) or WebM, serve the files and thumbnails from a CDN with range requests, and keep the video, thumbnail and player URLs allowed in robots.txt for Googlebot and Googlebot-Video. Alternatively host on a video platform such as YouTube and embed it.
        test: >-
          ffprobe shows a standard container and codecs; the video starts quickly on a throttled mobile connection; Google's open-source robots.txt parser, run with the Googlebot-Video token, returns allowed for the video and thumbnail URLs.
        claims: [D2-C921, D2-C919, D2-C920, D2-C922, D2-C923, D2-C932, D2-C933, D2-C928]
        docs: [video-seo, common-crawlers]
        status: documented

  - id: performance
    title: Performance and server capacity
    intro: >-
      Speed matters to crawling as much as to users: Google adjusts how much it crawls a host to its connect time, time to first byte and error rate, and that capacity is shared by every Google crawler. Fast rendering keeps content from timing out.
    requirements:
      - id: DEV-PRF-01
        level: SHOULD
        title: "Keep connect time and time to first byte low and stable under crawler load"
        why: >-
          The crawl rate limit (hostload) is a host-wide limit shared by all Google crawlers, including Search, Ads, Shopping and Images; it applies per host, so a CDN host, an app host, subdomains and the www host may each have their own. When connect time, time to first byte or the share of 429 and 5xx responses rises, Google lowers it and crawls less, while better performance increases the crawl budget. Google's crawl budget guide does not express this limit in requests per second: it counts the parallel connections Google holds open to the server and how long they last.
        how: >-
          Cache rendered HTML at the edge, keep origin response times low for uncached pages, size servers for crawler bursts, give bots exactly what an anonymous first-time visitor gets (no personalisation, the default test variant), never content or URLs that no user can get, and do not route Googlebot to a slower backend.
        test: >-
          Search Console Crawl stats shows a stable average response time and healthy host status; server logs compare time to first byte for verified Googlebot with users. An abrupt step down in crawling, or fewer connections opened by Googlebot, points to a lowered capacity limit rather than lower demand.
        claims: [D1-C092, D1-C091, D1-C132, D1-C096, D1-C066, D2-C024, D1-C141, D1-C374, D1-C376, D1-C440, D1-C493, D1-C494, D1-C547]
        docs: [crawl-budget-guide, crawling-infrastructure, website-testing]
        status: documented
      - id: DEV-PRF-02
        level: SHOULD
        title: "Make JavaScript-generated content render quickly"
        why: >-
          Pages wait in a render queue and rendering does not go on forever. Said at Search Central Live: when a Gemini user asks about a specific page it is read at that moment, which takes extra time, and Google's answer is fast, efficient JavaScript rendering or server-side rendering.
        how: >-
          Ship less JavaScript on content templates, avoid sequential API waterfalls before the main content, stream or server-render above-the-fold content, and lazy-load only non-essential widgets.
        test: >-
          Lighthouse or PageSpeed Insights on key templates; a headless render under CPU throttling shows the main content quickly; the URL Inspection screenshot shows the full content.
        claims: [D2-C124, D2-C172, D2-C120, D2-C125, D2-C117]
        docs: [javascript-seo-basics]
        status: documented
      - id: DEV-PRF-03
        level: MAY
        title: "Load per-session-billed third-party tools only after a user interaction"
        why: >-
          Said at Search Central Live by a community speaker: third-party systems billed per session (chat, personalisation, testing, session replay) also run when bots render pages and can cost a high-traffic site thousands of euros a month.
        how: >-
          Initialise such tools on the first user interaction (click, keypress, scroll) when they add no content that needs indexing, and compare the sessions they bill with real user sessions.
        test: >-
          Vendor-billed session counts match analytics sessions, and a headless render of a page starts no vendor session before an interaction.
        claims: [D2-C163, D2-C165]
        docs: []
        status: event-only
      - id: DEV-PRF-04
        level: SHOULD
        title: "Keep each HTML response well under 2 MB and put the main content and JSON-LD early"
        why: >-
          Googlebot fetches only the first 2MB of an HTML URL, HTTP headers included: bytes past that cutoff are not fetched, rendered or indexed. Google warns that bloated inline base64 images, large blocks of inline CSS or JavaScript and megabytes of menus can push a page's text or structured data past the limit, a real risk for single-page apps that inline large hydration state. Scripts, stylesheets and API responses the page loads each have their own limit.
        how: >-
          Move base64 images, large inline scripts and styles and serialised application state (hydration JSON) to external files or endpoints, keep navigation markup compact, and place the meta tags, title, canonical, hreflang and essential JSON-LD high in the head, with the main content before long secondary blocks.
        test: >-
          For every template, curl -s <url> | wc -c stays under about 1.5 MB, and the main heading and the JSON-LD appear within the first 2 MB of the response (curl -s <url> | head -c 2000000 | grep -c 'application/ld+json').
        claims: [D1-C136, D1-C137]
        docs: [inside-googlebot-blog, crawlers-overview]
        status: documented

  - id: ai-features
    title: AI features (AI Overviews, AI Mode, Gemini)
    intro: >-
      AI Overviews and AI Mode use the same crawling and the same index as Search, and query fan-out sends generated queries to that index and gets documents back with their snippets. There is no separate AI index, markup or file to build for; the controls for AI features are covered in the indexing controls above.
    requirements:
      - id: DEV-AIF-01
        level: MUST
        title: "Keep pages indexable and snippet-eligible, the whole technical requirement for AI features"
        why: >-
          To appear as a supporting link in AI Overviews or AI Mode a page must be indexed and eligible to be shown with a snippet, with no additional technical requirements. AI features are built on Google's core ranking systems and its index, so what works for web results works for them.
        how: >-
          Apply the rest of this kit, do not block snippets (DEV-IDX-05), and keep the Search Console generative AI setting on include unless the site is excluded on purpose (DEV-IDX-10). When a page never shows up as a source, check indexing, snippet rules and that setting first.
        test: >-
          URL Inspection shows the page indexed, its robots rules contain no nosnippet, and the Generative AI performance report shows impressions.
        claims: [D2-C074, D1-C038, D1-C051, D2-C601, D2-C730]
        docs: [ai-features-guide, ai-optimization-guide]
        status: documented
      - id: DEV-AIF-02
        level: SHOULD
        title: "Spend no effort on llms.txt, AI text files or AI-specific markup for Google"
        why: >-
          Google's guide says new machine-readable files, AI text files or special markup are not needed to appear in Search, which ignores them, so they neither help nor harm. Structured data is not required for generative AI search either, though it remains worth using for rich results, and the same processed markup feeds classic results and AI answers. Google repeated it on serving day: AI Overviews and AI Mode are standard search features, not rich results, and need no structured data to function.
        how: >-
          Do not build llms.txt or AI-only endpoints for Google; invest instead in documented structured data types (DEV-SDA-03) and crawlable, server-rendered content. If llms.txt is published for other tools, make it answer 200 (Lighthouse's optional llms.txt audit flags a server error), and do not publish markdown copies of HTML pages for agents: a community speaker warned they are duplicates, possibly even a cloaking risk. The same speaker cited a study of almost 40,000 sites in which 97% of llms.txt files got no AI agent hits in a month; Ahrefs' published study (June 2026) reports the same 97%.
        test: >-
          The backlog has no tickets for llms.txt or AI-only markup aimed at Google.
        claims: [D1-C061, D1-C054, D2-C480, D2-C476, D2-C479, D3-C325, D3-C326, D3-C328, D1-C271, D1-C272, D1-C454, D1-C455, D1-C460, D1-C473, D1-C505]
        docs: [ai-optimization-guide, ai-features-guide, lighthouse-llms-txt]
        status: documented
      - id: DEV-AIF-03
        level: SHOULD
        title: "Structure content for readers instead of splitting it into small chunks for AI"
        why: >-
          Google's guidance says there is no need to chop content for AI systems. Chunking matters at the level of a model's context window, and Gemini's holds a whole smaller book; said at Search Central Live, once chunk size is thought of in millions of tokens, chunking has perhaps lost its meaning anyway. Separate pages for every query variation, made to manipulate rankings or AI answers, count as scaled content abuse. Fan-out queries differ from system to system and, said at Search Central Live, are not added to Search Console; Google advises knowing that fan-out happens without overfocusing on individual fan-out queries, so do not build pages for fan-out queries copied from LLM tools.
        how: >-
          Keep complete pages with clear headings and full explanations, model content in the CMS by topic rather than by fragment length, and do not auto-generate thin pages per question or query variation.
        test: >-
          Content-model review finds no template that splits articles into many thin URLs.
        claims: [D1-C054, D1-C129, D2-C332, D2-C825, D2-C333, D3-C063, D3-C065, D3-C066, D2-C869]
        docs: [ai-optimization-guide, gemini-long-context]
        status: documented
      - id: DEV-AIF-04
        level: SHOULD
        title: "Do not block the AI agents you want as visitors"
        why: >-
          Said at Search Central Live: Google's duplication talk closed with the advice not to block agents, and AI agents browsing for users run into the same bot walls that sites build against scrapers and may go elsewhere, for example to buy the product from another shop.
        how: >-
          Decide per agent which ones to allow, tune bot protection to challenge abusive patterns rather than every automated browser, and if a challenge is needed send it with 503 (DEV-SRV-02).
        test: >-
          WAF and bot-management logs show no blocks of agents the team decided to allow.
        claims: [D2-C397, D2-C377, D2-C378]
        docs: []
        status: event-only
      - id: DEV-AIF-05
        level: MAY
        title: "Set robots.txt policy per AI crawler by its own token, and know that user-triggered fetchers ignore it"
        why: >-
          Mainstream crawlers from Google, other search engines and AI companies try to follow robots.txt, and nearly all AI crawlers use their own user agents, so a site can allow search crawling and refuse AI training per company; Google's token for that is Google-Extended (DEV-IDX-11), and said at Search Central Live, other companies have similar "extended" tokens, such as Apple's Applebot-Extended, which lets a site allow Applebot for search while opting out of Apple's AI use. User-triggered fetchers, which fetch a page because a user asked, and AI agents acting for a user generally ignore robots.txt.
        how: >-
          Write one robots.txt group per AI crawler token you want to restrict, and keep Googlebot allowed. Avoid a default-deny file that blocks every crawler and allows only chosen ones: a Google panelist called it a bad pattern, because you do not know what you are blocking. When logs show an unknown crawler fetching a lot, look up its user agent to find the token that controls it. To restrict user-triggered fetchers or agents, use authentication or bot management, not robots.txt.
        test: >-
          Google's open-source robots.txt parser returns the intended result for Googlebot, Google-Extended and each listed AI token; logs show the restricted crawlers stop after robots.txt is refreshed.
        snippet: robots-txt
        claims: [D1-C428, D1-C482, D1-C485, D1-C487, D1-C488, D1-C434, D1-C435, D1-C273, D1-C424, D1-C425, D1-C524, D1-C523, D1-C489]
        docs: [robots-spec, robots-intro, common-crawlers, user-triggered-fetchers]
        status: documented
      - id: DEV-AIF-06
        level: MAY
        title: "Try WebMCP to declare the actions a site offers to AI agents"
        why: >-
          A community speaker presented WebMCP, a proposed web standard in Chrome, as a way to tell AI agents which actions a site offers, such as booking an appointment, so they do not have to scrape the interface. It has declarative tools, annotations on standard HTML forms, and imperative tools defined in JavaScript; at the event it was not supported by all browsers but could be enabled for testing. It plays no documented role in Google Search.
        how: >-
          Pilot it on one task flow: annotate an existing form for the declarative API or register a JavaScript tool for booking, filtering or adding to cart, through Chrome's origin trial (Chrome 149 and later) or the chrome://flags/#enable-webmcp-testing flag. Keep the normal HTML flow working for users and agents without WebMCP.
        test: >-
          With the flag enabled, Chrome's tooling lists the site's tools, and the flow still completes without WebMCP.
        claims: [D1-C281, D1-C282, D1-C283, D1-C316]
        docs: [webmcp]
        status: documented

  - id: spam-and-ai-content
    title: Spam policies and AI-generated content
    intro: >-
      Google's spam policies cover practices that deceive users or manipulate Search, including its generative AI responses, and several of them are built in code: history manipulation, cloaking, generated page sets and hacked pages. AI is a tool; how its output is used decides whether content is helpful or spam.
    requirements:
      - id: DEV-SPM-01
        level: AVOID
        title: "Never manipulate browser history so that Back does not return users to where they came from"
        why: >-
          Back button hijacking, interfering with browser navigation so users cannot use Back to return immediately to the page they came from, is an explicit violation of Google's malicious practices spam policy, enforced since 15 June 2026 with manual spam actions or automated demotions. Google added it after many complaints about landing on auto-generated pages or staying on the same site after pressing Back twice, and says the cause can be a site's included libraries or advertising platform.
        how: >-
          Call history.pushState only for real in-app navigation that the user triggered (DEV-URL-03), never on page load, on scroll or to insert interstitial, recommended or exit pages, and do not intercept popstate to keep users on the site. Audit scripts from ad, engagement and recommendation vendors, and remove or disable any code, import or configuration that adds history entries.
        test: >-
          An automated browser test opens each template from another page, waits and interacts, presses Back once and lands on the previous page; a code search of the built bundles finds no pushState or replaceState outside the router.
        snippet: back-button-test
        claims: [D3-C207, D3-C208, D3-C209, D3-C210, D3-C211]
        docs: [spam-policies, back-button-hijacking-blog]
        status: documented
      - id: DEV-SPM-02
        level: AVOID
        title: "Do not generate large sets of low-value pages from templates, feeds or LLM output"
        why: >-
          Scaled content abuse, many pages generated mainly to manipulate rankings rather than help users, is among the spam policies Google recently updated, whether the pages come from generative AI, scraped feeds, stitched sources or keyword text. Said at Search Central Live: churning out pages with LLMs repeats the script-generated spam of the early 2000s, Google counts AI slop as scaled content abuse, and this type, rather than link spam, is the one worth talking about today. Google's guidance says using generative AI to produce lots of text without manual oversight represents little to no effort.
        how: >-
          Put programmatic page types (location by service, product by keyword, one page per question or per fan-out query) behind a review: each page needs unique, useful main content, otherwise do not create it or keep it noindexed. Do not auto-publish LLM drafts or feed-derived pages in bulk; cap automated publishing and require an editor's approval per page.
        test: >-
          A crawl of each programmatic template finds no clusters of near-identical pages; publishing logs show an editor's approval for generated pages; Search Console's Manual actions report is empty.
        claims: [D3-C207, D3-C284, D3-C694, D3-C695, D3-C176, D3-C213, D3-C300]
        docs: [spam-policies, gen-ai-content-guide, helpful-content]
        status: documented
      - id: DEV-SPM-03
        level: AVOID
        title: "Never serve Googlebot different content from users, and do not build doorway pages"
        why: >-
          Cloaking, presenting different content to users and to search engines to manipulate rankings and mislead users, and doorways, sites or pages created to rank for specific, similar queries that lead users to intermediate pages less useful than the final destination, are spam types in Google's spam policies and on its Day 3 spam slide.
        how: >-
          Never branch on the Googlebot user agent or Google's IP ranges to change text, links or redirects. Do not generate near-identical city or keyword landing pages that funnel visitors to one destination; merge them into one useful page per real offering.
        test: >-
          The HTML served to a Googlebot user agent and to a browser have the same main content, links and redirects, and URL Inspection's rendered HTML matches what users see.
        claims: [D3-C277, D3-C278, D3-C279, D3-C301]
        docs: [spam-policies]
        status: documented
      - id: DEV-SPM-04
        level: MUST
        title: "Keep the CMS and plug-ins patched and watch for injected pages and links"
        why: >-
          Hacked content, placed on a site without permission through security vulnerabilities, is one of the spam types on Google's list; cleaning it up is hard and prevention is key. If it leads to a manual action, Google's help says most reconsideration reviews take several days or weeks; said at Search Central Live, removal takes one to two weeks on average, and for some sites the action stays because the owners never actually clean up.
        how: >-
          Automate CMS, theme and plug-in updates, remove unused plug-ins and accounts, require two-factor login for editors, and alert on new URLs, outbound links or sitemap entries that no editor created. After a clean-up, file the reconsideration request only once every injected page and link is gone.
        test: >-
          A weekly comparison of the sitemap and a crawl with the CMS's own page list finds no unknown URLs; Search Console's Security issues and Manual actions reports are empty.
        claims: [D3-C282, D3-C277, D3-C659, D3-C674, D3-C660]
        docs: [spam-policies, manual-actions-report]
        status: documented
      - id: DEV-SPM-05
        level: SHOULD
        title: "Publish AI-generated text, images and markup only after human review, and show only real authors"
        why: >-
          Any AI model can hallucinate. Google treats quality problems as quality issues, not as AI against human content: the tool is not the problem, but how it was used and what for. Its rater guidelines treat fake owner or creator profiles, such as made-up authors with AI-generated headshots, as deception that earns the lowest rating; raters cannot penalise a site, but their ratings become labels that improve Google's algorithms, so unchecked AI output can harm a site indirectly.
        how: >-
          Build the CMS workflow so AI drafts, AI images and AI-generated markup cannot publish without a named editor's fact check; link every byline to a real author page with a real photo and verifiable profiles, and never generate author personas or headshots.
        test: >-
          Publishing logs show an editor's approval for every AI-assisted item, and an audit of author pages finds no persona without a real person behind it.
        claims: [D3-C686, D3-C690, D3-C691, D3-C692, D3-C697, D3-C700, D3-C710, D3-C190, D3-C693, D2-C937, D2-C941]
        docs: [gen-ai-content-guide, rater-guidelines, spam-policies, helpful-content]
        status: documented

  - id: monitoring
    title: Testing and monitoring
    intro: >-
      Search Console shows what Google crawled, rendered, chose as canonical and indexed. Render one URL per template in a headless browser before every release, check it in URL Inspection right after, and watch the reports that reveal crawling, rendering and index selection problems.
    requirements:
      - id: DEV-MON-01
        level: MUST
        title: "Verify every production host in Search Console before launch"
        why: >-
          Debugging what Google can see on a site, with URL Inspection, the Page indexing report or Crawl stats, starts with verified access to the site in Search Console.
        how: >-
          Add a Domain property (DNS verification) that covers every subdomain and protocol, plus URL-prefix properties for sections or hosts that need separate access, and keep the verification record in infrastructure code so it survives DNS or CMS changes.
        test: >-
          Search Console lists the Domain property as verified, and every team that ships code has access.
        claims: [D2-C306]
        docs: [verify-site-ownership]
        status: documented
      - id: DEV-MON-02
        level: MUST
        title: "Render every template in a headless browser before release and check it in URL Inspection right after"
        why: >-
          The rendered HTML in Google's testing tools shows what Google can index, and the live test also shows page resources, JavaScript console messages and a screenshot. A valid live test only confirms that Google can access the page; indexing still depends on other conditions, and the live result can differ from the indexed version. URL Inspection tests only public URLs of a verified property, so it cannot test a staging host that answers 401 or 403 (DEV-CAN-07).
        how: >-
          Keep a list of one representative URL per template (home, category, product, article, landing pages, each language version). Before release, render each template on staging with headless Chrome (Puppeteer or Playwright): compare the raw and rendered DOM, find the main content, prices and internal links, collect console errors, and run the structured data through the Rich Results Test's code input. Right after release, run the URL Inspection live test on one production URL per template and check the rendered HTML, resources and console messages. Request indexing for key URLs after fixing signals calculated at indexing time, such as language or robots rules.
        test: >-
          The release checklist records a headless render result for each template before release and a URL Inspection live test result for each template after release.
        claims: [D2-C176, D2-C178, D2-C308, D2-C215, D2-C179, D2-C158, D2-C677]
        docs: [url-inspection-help, javascript-seo-basics, fix-search-javascript]
        status: documented
      - id: DEV-MON-03
        level: SHOULD
        title: "Watch the Page indexing report and treat its not-indexed reasons as a work list"
        why: >-
          The Page indexing report is where index selection problems show. "Discovered - currently not indexed" means Google knows the URL but has not crawled it yet, and "Crawled - currently not indexed" means Google processed the page but did not keep it, which was described at Search Central Live as most of the time a quality issue; such pages need no resubmission. Soft 404s are also looked up in this report, while other crawl issues are debugged in the Crawl stats report (DEV-MON-04).
        how: >-
          Export not-indexed URLs by reason and template regularly. For Discovered, first rule out slow responses and server errors; for Crawled, compare with indexed pages of the same type for thin, duplicate or soft-404-like content and for template differences. Do not resubmit the same URLs again and again.
        test: >-
          A trend of indexed and not-indexed URLs per sitemap and template is reviewed, and spikes after releases are investigated.
        claims: [D2-C717, D2-C718, D2-C707, D2-C712, D2-C711, D2-C706, D2-C714, D2-C708, D2-C716, D1-C508]
        docs: [page-indexing-help, crawl-budget-guide, crawl-stats-help]
        status: documented
      - id: DEV-MON-04
        level: SHOULD
        title: "Monitor Crawl stats and server logs for verified Googlebot traffic"
        why: >-
          Firewalls, DNS problems and robots.txt errors are blind spots, because Google only sees failing requests, and response times and 429 or 5xx rates drive how much Google crawls. Logs show what Googlebot actually fetches, which matters on sites with filter parameters or complicated URLs, where crawlers can easily wander off into URLs that make no sense for the site, and client-side analytics may not see Googlebot at all, because Google's renderer may skip reporting and error requests.
        how: >-
          Keep access logs with status code, response time and user agent (logs alone do not show where Google's crawl limit lies, so read them with Crawl stats: total crawling, average response time, the response and file-type breakdowns and the discovery versus refresh split), verify Googlebot against Google's published crawler IP ranges or by reverse DNS to crawl-*.googlebot.com when analysing them, and alert on spikes of 5xx or 429 responses, robots.txt fetch failures and DNS errors. Review the Crawl stats host status regularly.
        test: >-
          A dashboard shows verified Googlebot requests by status code and template, and the Crawl stats host status has no failures.
        snippet: verify-googlebot
        claims: [D1-C069, D1-C126, D1-C092, D1-C078, D1-C138, D2-C164, D1-C339, D1-C340, D1-C393, D1-C394, D1-C396, D1-C442, D1-C443]
        docs: [crawl-budget-guide, dns-network-errors, troubleshoot-crawling-errors, verify-google-requests, crawl-stats-help]
        status: documented
      - id: DEV-MON-05
        level: SHOULD
        title: "Run recurring rendering checks: raw versus rendered HTML, placeholders and console errors"
        why: >-
          Sites that create content by rendering need at least basic monitoring that their rendered pages come out right. Rendering failures such as timeouts, unresolved placeholders or pages that render blank because of server overload or bad scripts are intermittent, and invisible if only the raw HTML is checked.
        how: >-
          Schedule a JavaScript-rendering crawl of sample URLs per template, besides spot checks in Chrome DevTools, diff raw and rendered HTML for main content, links, prices and meta tags, flag unresolved placeholders, render the same URLs more than once, and archive the HTML and resources of failing pages for analysis.
        test: >-
          The monitoring job runs on schedule, alerts on differences, and reports zero placeholder hits.
        claims: [D2-C143, D2-C159, D2-C151, D2-C153, D2-C154, D2-C148, D2-C860]
        docs: [fix-search-javascript]
        status: documented
      - id: DEV-MON-06
        level: SHOULD
        title: "Audit canonical groups with a crawler on a schedule"
        why: >-
          Broken canonical tags can make the wrong pages show up in search results, and a broken canonical setup does not fail visibly: pages load normally while the choice of URL passes to the search engine. Checking canonicals pair by pair misses chains, loops and leaders that nobody links to.
        how: >-
          Crawl with a tool that groups URLs by canonical leader and flag chains, loops, multiple canonicals, leaders that are non-200, noindexed, blocked, redirecting or unlinked, and groups that mix languages. Compare user-declared and Google-selected canonicals in URL Inspection for samples.
        test: >-
          The scheduled crawl report shows zero canonical errors, and the "Duplicate, Google chose different canonical than user" reason in the Page indexing report trends down.
        claims: [D2-C401, D2-C404, D2-C398, D2-C416, D2-C408]
        docs: [canonicalization-troubleshooting, consolidate-duplicate-urls]
        status: documented
      - id: DEV-MON-07
        level: MAY
        title: "Track AI feature visibility in the Generative AI performance report"
        why: >-
          Google recommends the Generative AI performance report in Search Console for measuring how content performs in generative AI features on Search and Discover. It shows impressions, pages, countries, devices and dates, but no clicks or queries. The regular Performance report still counts traffic from AI Overviews and AI Mode within the Web search type, so analytics setups that split out LLM referrals do not isolate it. Since 24 September 2026 the Performance report also has a multimodal search type for searches with Google Lens, Circle to Search, uploaded images and Chrome's image search; it has no query dimension.
        how: >-
          Add the report to the regular dashboard and compare countries and languages with native-language spot checks in AI Overviews and AI Mode. Add the multimodal search type to the same review and judge it by page, country and device.
        test: >-
          The report is reviewed monthly alongside the Performance report.
        claims: [D1-C062, D1-C124, D2-C607, D3-C438, D3-C439, D3-C441, D3-C498, D3-C458, D3-C459, D3-C462, D3-C465]
        docs: [genai-perf-reports-blog, ai-optimization-guide, genai-perf-help, multimodal-sc-blog, perf-report-help]
        status: documented
      - id: DEV-MON-08
        level: SHOULD
        title: "Set up the Search Console bulk data export to BigQuery on large sites"
        why: >-
          The Search Console interface exports at most 1,000 rows, and the Search Analytics API and the Looker Studio connector return up to 50,000 rows per day per site per search type. The bulk data export to BigQuery is the most complete query dataset available. Anonymized queries are always left out of report tables and are left out whenever a filter is applied, so filtered rows do not add up to the chart totals; in the export they stay as rows with an empty query.
        how: >-
          Turn on the daily bulk data export in Search Console settings to a BigQuery project the team owns, set table expiration to fit the budget, and query the searchdata_site_impression and searchdata_url_impression tables. Keep anonymized rows in totals but exclude them (is_anonymized_query, or query = '') when ranking top queries, and tell any LLM or dashboard that analyses the data to do the same.
        test: >-
          New daily rows appear in the searchconsole dataset each day, and the summed clicks for a recent day are close to the Performance report's total for that day.
        snippet: bulk-export-top-queries
        claims: [D3-C471, D3-C474, D3-C475, D3-C480, D3-C481, D3-C476, D3-C502]
        docs: [sc-bulk-export-about, sc-bulk-export-tables, sc-performance-data-limits]
        status: documented
      - id: DEV-MON-09
        level: MAY
        title: "Add the brand's YouTube, Instagram, TikTok and X accounts to Search Console as platform properties"
        why: >-
          Platform properties show the traffic Google Search, Discover and Google News send to a verified Instagram, TikTok, X or YouTube account, with its top content, query groups and countries, but not how often content is seen on the platform itself. Verification runs inside Search Console through a permission pop-up from the platform, with no token, and accounts of a claimed Search profile are added automatically.
        how: >-
          Add one property per account or channel, record who owns each login, re-verify when the external login expires (access pauses until then), and compare formats by URL pattern in comparison mode, for example /watch against /shorts/ on YouTube.
        test: >-
          Every official account appears as a platform property with data, and the launch checklist names the owner of each login.
        claims: [D3-C443, D3-C446, D3-C466, D3-C467, D3-C468, D3-C451, D2-C960]
        docs: [platform-props-help, social-video-guide]
        status: documented
      - id: DEV-MON-10
        level: SHOULD
        title: "Plan releases and fixes around Google's processing times, and judge results only after them"
        why: >-
          Said at Search Central Live, as estimates from Google's internal logs meant to inform rather than guarantee: robots.txt changes apply in about 24 hours, JavaScript-added content reaches indexing within hours and at worst weeks, a 404 or noindex drops a page within one to three weeks, a canonical change shows in one to three weeks, structured data updates in hours to two weeks, titles and snippets in one or two days up to several weeks, and a site move takes one to three months on average. Each step waits for the one before, so nothing changes until the page is recrawled. Google's documentation gives compatible figures, such as up to two weeks to split a duplicate cluster and a few days to a few weeks for title link changes.
        how: >-
          Put the expected window into release plans and stakeholder updates, schedule robots.txt changes a day ahead, request indexing for the key changed URLs after a release, and review the effect only once the window for that kind of change has passed.
        test: >-
          Each SEO-relevant ticket records its expected processing window, and the post-release review is dated after it.
        claims: [D3-C613, D3-C627, D3-C639, D3-C640, D3-C646, D3-C657, D3-C643, D3-C665, D3-C669, D3-C675, D3-C598]
        docs: [submit-updated-robots-txt, javascript-seo-basics, canonicalization-troubleshooting, title-links, site-move-with-url-changes]
        status: documented
      - id: DEV-MON-11
        level: SHOULD
        title: "Measure the time from publishing a URL to Googlebot's first crawl of it"
        why: >-
          Said at Search Central Live by Gary Illyes: the reliable check that new content is crawled fast enough is the time between publishing a URL and Googlebot's first fetch of it; it should stay flat or fall, and only a rising trend calls for investigation, starting with URLs Google crawls and recrawls a lot without use. How much it rises matters: for fresh news stories he called something like two hours probably not great. The Crawl stats split by purpose (discovery versus refresh) gives a rougher view; John Mueller said that if about half of a site's crawling goes to discovery, crawling of new pages is not the problem. News sites rarely need to worry about crawl budget, because Google crawls them aggressively.
        how: >-
          Log each URL's publish time in the CMS, join it with the first verified Googlebot request in the access logs, and chart the median delay per section each week. When it rises, review the most-crawled URLs in the logs and block or remove useless ones (DEV-URL-08).
        test: >-
          The weekly chart exists per section and alerts when the median publish-to-first-crawl delay rises for several weeks in a row.
        claims: [D1-C467, D1-C468, D1-C492, D1-C466, D1-C396, D1-C543, D1-C544]
        docs: [crawl-stats-help, crawl-budget-guide]
        status: documented
