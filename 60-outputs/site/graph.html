* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--f); color: var(--body); background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr); }
a { color: var(--accent); }
a:hover { color: var(--accent-h); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nm-dd { display: none; }
html[data-style="deep-dive"] .nm-dd { display: inline; }
html[data-style="deep-dive"] .nm-deco { display: none; }

/* ---- header bar */
header { background: var(--bar); color: var(--cream); padding: 12px 20px; display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; border-bottom: 2px solid var(--gold); position: relative; z-index: 5; }
header :focus-visible { outline: 2px solid var(--gold-l); outline-offset: 2px; }
header a.home { color: var(--gold-l); text-decoration: none; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; padding: 6px 16px 6px 0; border-right: 1px solid var(--gold-d); }
header a.home:hover { color: var(--cream); text-decoration: underline; text-underline-offset: .25em; }
header h1 { font-weight: 400; font-size: 17px; letter-spacing: .18em; text-transform: uppercase; margin: 0; white-space: nowrap; }
header h1 .sub { color: var(--gold-l); }
.find { position: relative; flex: 1 1 260px; max-width: 420px; min-width: 0; }
.find input { width: 100%; background: var(--field); border: 1px solid var(--gold-d); color: var(--cream); padding: 8px 12px; font: inherit; font-size: 14px; }
.find input::placeholder { color: #9d927d; }
.find input:focus { border-color: var(--gold-l); }
#hits { position: absolute; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--panel); color: var(--body); border: 1px solid var(--gold);
  box-shadow: 0 10px 28px rgba(0,0,0,.25); max-height: min(70vh, 460px); overflow: auto; z-index: 10; }
#hits li { padding: 7px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; font-size: 14px; line-height: 1.35; }
#hits li[aria-selected="true"], #hits li:hover { background: var(--hover); }
#hits li .hk { flex: none; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); min-width: 6.5em; }
#hits li .ht { color: var(--ink); overflow-wrap: anywhere; }
#hits li.none { cursor: default; color: var(--muted); }
.find-note { position: absolute; left: 0; top: calc(100% + 4px); margin: 0; font-size: 12px; }
header nav.links { display: flex; gap: 6px 14px; flex-wrap: wrap; }
header nav.links a { color: var(--gold-l); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
header nav.links a:hover { color: var(--cream); text-decoration: underline; }
.tools button { font: inherit; cursor: pointer; }
.rm-bot { display: none; }

/* ---- the map side */
main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 30vw, 430px); min-height: 0; min-width: 0; }
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px 4px; font-size: 13px; }
.tools .kinds { flex-basis: 100%; }
.tools .grp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tools .gk { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.tools button, .chip span { background: var(--card); border: 1px solid var(--frame); color: var(--ink); padding: 5px 10px; font-size: 12.5px; line-height: 1.2; }
.chip span.has-ic::before { display: none; }
.chip .ici { display: inline-flex; font-style: normal; }
.chip .ic { width: 14px; height: 14px; flex: none; overflow: visible; }
.chip input:not(:checked) + span .ic { opacity: .4; filter: grayscale(1); }
.chip input:not(:checked) + span { border-style: dashed; }
.tools button[aria-pressed="true"] { background: var(--bar); border-color: var(--bar); color: var(--cream); }
.tools button:hover { border-color: var(--accent); }
.chip { position: relative; display: inline-flex; cursor: pointer; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.chip span::before { content: ''; width: 9px; height: 9px; border: 1.5px solid currentColor; flex: none; }
.chip input:checked + span { color: var(--ink); border-color: var(--accent); }
.chip input:checked + span::before { background: var(--accent); border-color: var(--accent); }
.chip input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.more { position: relative; }
.more summary { cursor: pointer; padding: 5px 10px; border: 1px solid var(--frame); background: var(--card); color: var(--ink); font-size: 12.5px; list-style: none; }
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: ' ▾'; color: var(--muted); }
.more[open] summary::after { content: ' ▴'; }
.more .box { position: absolute; z-index: 6; top: calc(100% + 6px); left: 0; width: min(560px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--frame); padding: 12px 14px; box-shadow: 0 12px 30px rgba(0,0,0,.18);
  display: grid; gap: 10px; }
.more .box .grp { gap: 6px; }
.more select { font: inherit; font-size: 13px; padding: 4px 6px; background: var(--card); color: var(--ink); border: 1px solid var(--frame); }
.more label.sel { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.status { margin: 0; padding: 2px 16px 6px; font-size: 13px; color: var(--muted); min-height: 1.5em; }
.status b { color: var(--ink); font-weight: 600; }
#map { flex: 1 1 auto; min-height: 0; min-width: 0; overflow: hidden; display: block; position: relative; }
#map > svg { display: block; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: grab; }
#map.panning > svg, #map.dragging > svg, #map.dragging .nd { cursor: grabbing; }
.legend .box { font-size: 12px; color: var(--muted); display: block; width: min(640px, calc(100vw - 32px)); }
.legend ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend li { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.legend li svg { flex: none; overflow: visible; }

<script>
(function () {

const MAPNAME = () => isDD() ? 'Reef map' : 'Graph';

// Where this page sits: next to the web edition's index.html, or in 50-maps/ beside the mindmap (links go to ../60-outputs/site/).
const inMaps = /\/50-maps\/[^/]*$/.test(location.pathname);
const inSite = !inMaps && (location.protocol !== 'file:' || /\/site\/[^/]*$/.test(location.pathname));
const SITE = inMaps ? '../60-outputs/site/' : '';

const home = inMaps ? ['../60-outputs/site/index.html', 'Web edition'] : inSite ? ['index.html', 'Home'] : null;
if (home) { const a = $('#home'); a.href = home[0]; a.textContent = '← ' + home[1]; a.title = 'Back to the web edition'; a.hidden = false; }

// The web edition's own fonts (assets/fonts/), only where they sit next to this page; elsewhere the system fonts. Never the network.
let fonts = false;
function loadFonts() {

  const R = { latin: 'U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD',

  const list = [400, 500, 600, 700, 800].flatMap(w => Object.keys(R).map(sub => ['Figtree', `figtree-${sub}-${w}-normal`, w, R[sub]]))
    .concat([400, 500, 600].flatMap(w => Object.keys(R).map(sub => ['Jost', `jost-${sub}-${w}-normal`, w, R[sub]])));
  for (const [fam, file, w, range] of list) {
    const f = new FontFace(fam, `url(assets/fonts/${file}.woff2) format('woff2')`, { weight: String(w), unicodeRange: range, display: 'swap' });
    document.fonts.add(f);
  }
}

const panelEl = $('#panel'), mapEl = $('#map'), statusEl = $('#status');
if (!G || !Array.isArray(G.nodes)) {
  panelEl.innerHTML = '<p class="warn">The map data did not load. Rebuild the web edition (rebuild.bat) and open this page again.</p>';
  return;
}

// ------------------------------------------------------------------ the data: nodes, and each node's links both ways
const N = G.nodes, T = G.types, IDX = new Map();
N.forEach((x, j) => IDX.set(x.i, j));
const ADJ = N.map(() => []);
for (const e of G.edges) {
  ADJ[e[0]].push({ o: e[1], t: T[e[2]], d: 0, w: e[3] || 0, cl: e[4] });
  ADJ[e[1]].push({ o: e[0], t: T[e[2]], d: 1, w: e[3] || 0, cl: e[4] });
}
const KITS = ['requirement', 'fact', 'myth', 'quote', 'angle', 'term'];
const KIND = {  // f: the filter it belongs to; cap: how many the map shows before the rest go into a "+N more" bubble
  entity: { f: 'entity', one: 'thing', many: 'things', cap: 10, label: 'Thing' }, topic: { f: 'topic', one: 'topic', many: 'topics', cap: 6, label: 'Topic' },
  requirement: { f: 'requirement', one: 'requirement', many: 'requirements', cap: 5, label: 'Requirement' }, fact: { f: 'factmyth', one: 'fact', many: 'facts', cap: 5, label: 'Fact' },
  myth: { f: 'factmyth', one: 'myth', many: 'myths', cap: 5, label: 'Myth' }, quote: { f: 'quoteangle', one: 'quote', many: 'quotes', cap: 5, label: 'Quote' },
  angle: { f: 'quoteangle', one: 'story angle', many: 'story angles', cap: 5, label: 'Story angle' }, term: { f: 'term', one: 'glossary term', many: 'glossary terms', cap: 4, label: 'Glossary term' },
  source: { f: 'source', one: 'document', many: 'documents', cap: 4, label: 'Document' }, claim: { f: 'claim', one: 'claim', many: 'claims', cap: 24, label: 'Claim' } };
const ORDER = ['entity', 'topic', 'requirement', 'fact', 'myth', 'quote', 'angle', 'term', 'source', 'claim'];
const KFILTERS = [['entity', 'Things', 1], ['topic', 'Topics', 1], ['requirement', 'Requirements', 1], ['factmyth', 'Facts and myths', 1], ['quoteangle', 'Quotes and angles', 0],
  ['term', 'Glossary', 1], ['source', 'Documents', 1], ['claim', 'Claims', 1]];
const EFILTERS = [['rel', 'Typed relations'], ['co', 'Named together'], ['men', 'Claims that name a thing'], ['top', 'Topic links'], ['kit', 'Kit items'], ['doc', 'Documentation'], ['cc', 'Claim to claim']];
const RELT = Object.keys(G.erel), CCT = Object.keys(G.rel);
function egroup(t, a, b) {  // the kind of link, for the line style and the link filter
  if (RELT.includes(t)) return 'rel';
  if (CCT.includes(t)) return 'cc';
  if (t === 'co-mentioned') return 'co';
  if (t === 'mentions') return 'men';
  if (t === 'features' || t === 'related') return 'top';
  if (t === 'about') return a === 'topic' || b === 'topic' ? 'top' : 'kit';
  if (t === 'cites') return a === 'source' || b === 'source' ? 'doc' : 'top';
  if (t === 'documented-in') return 'doc';
  return 'kit';  // defines, rests-on
}
const EPRI = ['rel', 'co', 'men', 'top', 'kit', 'doc', 'cc'];
const documented = x => x.l === 'docs' || x.v === 'confirmed' || x.v === 'consistent';
const nameKey = x => x.n.toLowerCase();

const S = { hop: 1, kinds: {}, edges: {}, day: 0, label: '', grade: '', open: new Map(),  // open: kind -> how many times its "+ more" bubble was pressed
  // what the user changed on the map (v2.12.0). moved: node key -> {x, y} where a drag or the living layout left it; ex: node -> {n} for a
  // neighbourhood grown in place; drop: where a dragged bubble was let go (the living layout keeps it near there). These end when the centre
  // changes; pins (kept on the map when the centre changes) and hidden (taken off the map) last until the page is closed.
  moved: new Map(), ex: new Map(), drop: new Map(), pins: new Set(), hidden: new Set(), live: false };
KFILTERS.forEach(([k, , on]) => { S.kinds[k] = !!on; });
EFILTERS.forEach(([k]) => { S.edges[k] = true; });
let cur = -1, missing = '', lastFocus = -1;

function neigh(c) {  // every neighbour once, with all its links to c
  const m = new Map();
  for (const e of ADJ[c]) {
    if (e.o === c) continue;
    let r = m.get(e.o);
    if (!r) m.set(e.o, r = { o: e.o, w: 0, gs: new Set(), es: [], rel: false });
    const g = egroup(e.t, N[c].k, N[e.o].k);
    r.gs.add(g); r.es.push(e); r.w = Math.max(r.w, e.w || 1);
    if (g === 'rel') r.rel = true;
  }
  return m;
}
function claimOk(x) {
  if (x.k !== 'claim') return true;
  if (S.day && x.d !== S.day) return false;
  if (S.label && x.l !== S.label) return false;
  if (S.grade === 'doc' && !documented(x)) return false;
  if (S.grade === 'und' && x.v !== 'undocumented') return false;
  return true;
}
const kindOn = x => S.kinds[KIND[x.k].f];
const visible = r => kindOn(N[r.o]) && claimOk(N[r.o]) && [...r.gs].some(g => S.edges[g]);
const bestGroup = r => EPRI.find(g => r.gs.has(g) && S.edges[g]) || EPRI.find(g => r.gs.has(g));
const rank = (a, b) => (b.rel - a.rel) || (b.w - a.w) || (N[a.o].k === 'claim' ? a.o - b.o : nameKey(N[a.o]).localeCompare(nameKey(N[b.o])) || a.o - b.o);

// ------------------------------------------------------------------ layout: the centre; ring 1 as two stacks of kinds, left and right (one stack on a phone),
// labels level and pointing outward; the claims as a shoal under the centre; ring 2 in a column outside ring 1's labels. No randomness, no measuring.
const ROW = 25, ROW2 = 20, HDR = 22, GGAP = 10, SHOAL = 15;
const tw = (s, fs) => String(s).length * fs * .56;  // an estimate of a label's width, so the layout never waits for a font
const fx = v => (Math.round(v * 10) / 10).toFixed(1);
function centreLines(x, narrow) {
  const max = narrow ? 16 : 24, words = (x.k === 'claim' ? x.i.slice(6) : x.k === 'term' || x.k === 'entity' || x.k === 'topic' || x.k === 'source' ? x.n : labelFor(x)).split(' ');
  const lines = []; let line = '';
  for (const w of words) { if (line && (line + ' ' + w).length > max) { lines.push(line); line = w; } else line = line ? line + ' ' + w : w; }
  if (line) lines.push(line);
  if (lines.length > 3) { lines.length = 3; lines[2] = cut(lines[2] + ' …', max); }
  return lines.map(s => cut(s, max + 2));
}
const STEP = 12;  // a "+ more" bubble adds this many of its kind at a time, so a big node (Search Console) stays readable; claims open at once, as small dots
function bundleText(s) {
  const k = KIND[s.bundle];
  return s.less ? 'Show fewer ' + k.many : s.all ? plural(s.n, k.one, k.many) + ' — show them' : s.next < s.n ? `+${s.next} more ${k.many} (of ${s.n})` : '+' + s.n + ' more ' + (s.n === 1 ? k.one : k.many);
}
function layout(c) {
  const nb = neigh(c), all = [...nb.values()], vis = all.filter(r => visible(r) && !S.hidden.has(r.o)), narrow = (mapEl.clientWidth || 1000) < 640;
  const groups = ORDER.map(k => ({ k, items: vis.filter(r => N[r.o].k === k).sort(rank) })).filter(g => g.items.length);
  for (const g of groups) {
    const cap = KIND[g.k].cap, steps = S.open.get(g.k) || 0, show = g.k === 'claim' ? (steps ? Infinity : 0) : cap + steps * STEP;
    let list = g.items, rest = [];
    if (list.length > cap && list.length > show) { rest = list.slice(show); list = list.slice(0, show); }
    g.slots = list.map(r => ({ r, o: r.o, k: g.k }));
    if (rest.length) g.slots.push({ bundle: g.k, n: rest.length, next: g.k === 'claim' ? rest.length : Math.min(STEP, rest.length), all: !list.length });
    if (steps && g.items.length > cap) g.slots.push({ bundle: g.k, n: 0, less: true });
  }
  const cx = N[c], r0 = sizeOf(cx, true), lines = centreLines(cx, narrow), lab1 = S.hop === 2 ? 17 : narrow ? 24 : 26, fs1 = 13.5, fs2 = 12;
  const slots = [], heads = [], sides = narrow ? [{ s: 1, gs: [], h: 0 }] : [{ s: 1, gs: [], h: 0 }, { s: -1, gs: [], h: 0 }];
  const labelOf = s => s.bundle ? bundleText(s) : cut(labelFor(N[s.o]), lab1);
  const cg = groups.find(g => g.k === 'claim');
  let shoal = null, spine = null;
  const shoalAt = (dots, cols, x0, y0, centred) => dots.forEach((s, i) => {  // a honeycomb of small dots, one per claim
    const row = Math.floor(i / cols), col = i % cols, inRow = Math.min(cols, dots.length - row * cols);
    s.x = x0 + (centred ? (col - (inRow - 1) / 2) * SHOAL + (row % 2 ? SHOAL / 4 : -SHOAL / 4) : col * SHOAL + (row % 2 ? SHOAL / 2 : 0));
    s.y = y0 + row * SHOAL * .9; s.shoal = true; s.rad = 5;
    slots.push(s);
  });
  if (narrow) {
    // a phone: the centre on top with its name beside it, one spine down the left, each kind a branch off it (the claims last)
    const X = 40;
    let y = r0 + 30;
    spine = { y0: r0 + 8, y1: y, twigs: [] };
    for (const g of groups) {
      heads.push({ g, side: 1, x: X - 10, y: y + HDR - 7, n: g.items.length });
      spine.twigs.push(y + HDR - 11);
      y += HDR;
      const dots = g.k === 'claim' ? g.slots.filter(s => !s.bundle) : [];
      if (dots.length) {
        const cols = Math.min(dots.length, 14);
        shoalAt(dots, cols, X - 4, y + 8, false);
        y += 8 + Math.ceil(dots.length / cols) * SHOAL * .9 + 6;
        shoal = { g, n: g.items.length, open: true, inline: true };
      }
      for (const s of g.slots) {
        if (s.shoal) continue;
        s.y = y + ROW / 2; s.x = X; s.side = 1; s.rad = s.bundle ? 10 : sizeOf(N[s.o]); s.lab = labelOf(s); s.fs = fs1;
        slots.push(s); y += ROW;
      }
      spine.y1 = y - ROW / 2;
      y += GGAP;
    }
  } else {
    for (const g of groups) {
      if (g.k === 'claim') continue;
      g.h = HDR + g.slots.length * ROW + GGAP;
      const sd = sides.reduce((a, b) => b.h < a.h ? b : a);
      sd.gs.push(g); sd.h += g.h;
    }
    for (const sd of sides) {
      const H = Math.max(0, sd.h - GGAP), Ry = Math.max(H / 2 + 40, 170), Rx = S.hop === 2 ? Math.min(200, Math.max(165, H * .36)) : Math.min(260, Math.max(200, H * .42)), xmin = S.hop === 2 ? 134 : 152;
      sd.X = y => sd.s * Math.max(xmin, Rx * Math.sqrt(Math.max(0, 1 - (y / Ry) ** 2)));
      let y = -H / 2;
      for (const g of sd.gs) {
        heads.push({ g, side: sd.s, x: sd.X(y + HDR + ROW / 2) - sd.s * 8, y: y + HDR - 7, n: g.items.length });
        y += HDR;
        for (const s of g.slots) {
          s.y = y + ROW / 2; s.x = sd.X(s.y); s.side = sd.s; s.rad = s.bundle ? 10 : sizeOf(N[s.o]); s.lab = labelOf(s); s.fs = fs1;
          slots.push(s); y += ROW;
        }
        y += GGAP;
      }
    }
    // the claims: a shoal of small dots under the centre's name (a bubble while they are folded away)
    if (cg) {
      let yb = r0 + 30 + (lines.length - 1) * 20 + 22;
      const dots = cg.slots.filter(s => !s.bundle), bun = cg.slots.find(s => s.bundle);
      shoal = { g: cg, n: cg.items.length, y: yb, open: dots.length > 0 };
      if (dots.length) {
        const cols = Math.min(dots.length, Math.max(8, Math.min(14, Math.ceil(Math.sqrt(dots.length * 2.6)))));
        shoalAt(dots, cols, 0, yb + 20, true);
        yb = yb + 20 + (Math.ceil(dots.length / cols) - 1) * SHOAL * .9 + 26;
      }
      if (bun) { bun.x = 0; bun.y = dots.length ? yb + 4 : yb - 6; bun.under = true; bun.rad = 11; bun.lab = bundleText(bun); slots.push(bun); }
    }

    const g = x.v === 'undocumented' ? '<span class="gr und">Not in docs</span>' : G.grades[x.v] ? `<span class="gr">${esc(G.grades[x.v])}</span>` : '';
    h += `<p><span class="tag ${esc(x.l)}">${esc(G.labels[x.l])}</span> ${g}</p><p class="note">${esc(G.sessions[x.ss] || '')}</p>`;
  } else if (x.s) h += `<p>${esc(x.s)}</p>`;
  if (x.lv || x.st) h += `<p class="note">${x.lv ? esc(G.levels[x.lv]) + ' · ' : ''}${esc(G.statuses[x.st] || '')}</p>`;
  if (x.k === 'entity') {
    const cs = [...nb.values()].filter(r => N[r.o].k === 'claim').map(r => N[r.o]), said = cs.filter(q => q.l === 'slide' || q.l === 'stage');
    h += `<p class="note">${plural(cs.length, 'claim')} name it: ${cs.filter(q => q.l === 'docs').length} in Google’s documentation, ${said.length} said at the event (${said.filter(q => q.v === 'undocumented').length} not in docs).</p>`;
  }
  const acts = [];
  const page = { entity: 'Open the card', topic: 'Open the topic page', claim: 'Open the claim', source: 'Open the document ↗', requirement: 'Open in the developer kit', term: 'Open in the glossary' }[x.k] || 'Open in the content kit';
  acts.push(`<a href="${esc(href(x.u))}"${x.k === 'source' ? ' rel="noopener external"' : ''}>${page}</a>`);
  if (x.k === 'topic') acts.push(`<a href="mindmap.html#topic:${esc(x.i.slice(6))}">Open in the topic map</a>`);
  h += `<div class="acts">${acts.join('')}</div>`;
  for (const g of gs) {
    const items = [...g.items.entries()].sort((a, b) => N[a[0]].k === 'claim' && N[b[0]].k === 'claim' ? a[0] - b[0] : (b[1] - a[1]) || nameKey(N[a[0]]).localeCompare(nameKey(N[b[0]])) || a[0] - b[0]);
    const showW = g.key === 'co' || g.key === 'topic' || g.key === 'ent' || g.key.startsWith('k-');
    const li = items.map(([j, w]) => itemHtml(N[j], w, showW));
    const top = li.length > 14 ? 10 : li.length;
    h += `<section data-g="${esc(g.key)}"><h3>${esc(g.h)}<span class="n">${li.length}</span></h3><ul class="nb">${li.slice(0, top).join('')}</ul>`
      + (li.length > top ? `<details class="rest"><summary>${li.length - top} more</summary><ul class="nb">${li.slice(top).join('')}</ul></details>` : '') + '</section>';
  }
  if (!gs.length) h += '<p class="note">Nothing links to it yet.</p>';
  h += `<section><p class="help">Click a bubble, or tab to it and press <kbd>Enter</kbd>, to put it in the centre; the browser’s back button returns. Arrow keys step around the ring. `
    + `Drag the background to pan, scroll or pinch to zoom, double-click it to fit; drag a bubble to move it. Its <b>+</b>, the <kbd>+</kbd> key or the menu grows its neighbours in place. `
    + `Right-click (long-press on a phone, <kbd>Shift</kbd>+<kbd>F10</kbd> on a focused bubble) for more: open its card, pin it, hide it. `
    + `The map shows the first few of each kind, and a + bubble adds ${STEP} more at a time; this list holds every neighbour and ignores the filters. Counts are claims.</p>`
    + `<p class="note">Knowledge base ${esc(G.version)}, data through ${esc(G.through)}. A link is a map, not a source: cite the claim IDs.</p></section>`;
  panelEl.innerHTML = h;
  panelEl.scrollTop = 0;
}

// ------------------------------------------------------------------ routing: the hash names the centre (#ent:googlebot)
function route() {
  let id = '';
  try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) { id = location.hash.slice(1); }
  let j = IDX.has(id) ? IDX.get(id) : -1;
  missing = id && j < 0 ? id : '';
  if (j < 0) j = IDX.has(G.start) ? IDX.get(G.start) : 0;
  const keep = lastFocus === 1 || (document.activeElement && (mapEl.contains(document.activeElement) || panelEl.contains(document.activeElement)));
  lastFocus = -1;
  const moved = j !== cur;
  let from = null;  // where the new centre is on the screen now, when it is on the map: the view dives in from there
  if (moved && SC && cur >= 0) {
    const n = SC.by.get('n' + j), b = n && n.el && n.el.isConnected && n.el.querySelector('.b');
    if (b) { const r = b.getBoundingClientRect(), m = mapEl.getBoundingClientRect(); if (r.width) from = [r.left + r.width / 2 - m.left, r.top + r.height / 2 - m.top]; }
  }
  if (moved) { cur = j; S.open.clear(); S.moved.clear(); S.ex.clear(); S.drop.clear(); animNext = true; }
  trailVisit(cur);  // before the map is drawn: the trail's row is part of the height the map is fitted to
  render({ keep: !moved, from });
  if (keep) { const g = mapEl.querySelector('.nd.centre'); if (g) g.focus({ preventScroll: true }); }
}
function render(opts) {
  draw(opts); panel();
  document.title = `${MAPNAME()}: ${N[cur].k === 'claim' ? N[cur].i.slice(6) : cut(N[cur].n, 60)} — Search Central Live Deep Dive Europe 2026`;
}

// ------------------------------------------------------------------ search: names, other names, IDs and claim text; aliases and typos as on the site
const SPELL = { 'ł': 'l', 'đ': 'd', 'ð': 'd', 'ø': 'o', 'ı': 'i', 'ß': 'ss', 'æ': 'ae', 'œ': 'oe', 'þ': 'th', 'ς': 'σ' };
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/\p{M}+/gu, '').replace(/[łđðøıßæœþς]/g, c => SPELL[c]);
const norm = s => ' ' + fold(s).replace(/[^\p{L}\p{N}]+/gu, ' ').trim() + ' ';
let REC = null, VOC = null;
const KPRI = { entity: 0, topic: 1, term: 2, requirement: 3, fact: 4, myth: 4, quote: 5, angle: 5, source: 6, claim: 7 };
function records() {
  if (REC) return REC;
  REC = N.map((x, j) => ({ j, name: norm(x.n), all: norm([x.n, (x.al || []).join(' '), x.i.split(':').slice(1).join(':'), x.id || ''].join(' ')) }));  // a claim: its text and ID
  const f = new Map();
  N.forEach((x, j) => { if (x.k !== 'claim') for (const w of REC[j].all.trim().split(' ')) if (w.length > 2) f.set(w, (f.get(w) || 0) + 1); });
  VOC = [...f.entries()].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).map(a => a[0]);
  return REC;
}
function dist(a, b, k) {  // Damerau-Levenshtein distance, stopping early above k
  if (Math.abs(a.length - b.length) > k) return k + 1;
  const d = [];
  for (let i = 0; i <= a.length; i++) { d[i] = [i]; }
  for (let j = 0; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    let best = k + 1;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      best = Math.min(best, d[i][j]);
    }
    if (best > k) return k + 1;
  }
  return d[a.length][b.length];
}
function find(q) {
  const R = records(), qn = norm(q).trim();
  if (!qn) return { hits: [], fixed: '' };
  const run = phrase => {
    const alts = [phrase].concat(G.aliases[phrase] || []), scored = [];
    for (const r of R) {
      const x = N[r.j], text = r.all;
      let best = -1;
      for (const alt of alts) {
        const ws = alt.split(' ');
        if (!ws.every(w => text.includes(' ' + w))) continue;
        let s = 10;
        if (r.name === ' ' + alt + ' ') s = 100; else if (r.all.includes(' ' + alt + ' ')) s = 70; else if (r.name.startsWith(' ' + alt)) s = 50; else if (ws.every(w => r.name.includes(' ' + w))) s = 30;
        if (alt !== phrase) s -= 1;
        best = Math.max(best, s);
      }
      if (best < 0 || (x.k === 'claim' && qn.length < 3)) continue;
      const n = x.k === 'entity' ? ADJ[r.j].filter(e => e.t === 'mentions').length : 0;
      scored.push({ j: r.j, s: best + Math.min(9, Math.log2(n + 1)) - KPRI[x.k] * 2 });
    }
    scored.sort((a, b) => b.s - a.s || KPRI[N[a.j].k] - KPRI[N[b.j].k] || nameKey(N[a.j]).localeCompare(nameKey(N[b.j])) || a.j - b.j);
    const out = [], claims = [];
    for (const h of scored) { if (N[h.j].k === 'claim') { if (claims.length < 3) claims.push(h); } else if (out.length < 9) out.push(h); }
    return out.concat(claims);
  };
  let hits = run(qn), fixed = '';
  if (!hits.length) {
    records();
    const ws = qn.split(' ').map(w => {
      if (w.length < 4 || VOC.some(v => v.startsWith(w))) return w;
      const k = w.length >= 8 ? 2 : 1, m = VOC.find(v => Math.abs(v.length - w.length) <= k && dist(w, v, k) <= k);
      return m || w;
    });
    const p = ws.join(' ');
    if (p !== qn) { hits = run(p); if (hits.length) fixed = p; }
  }
  return { hits, fixed };
}
const qEl = $('#q'), hitsEl = $('#hits');
let active = -1, shown = [];
function closeHits() { hitsEl.hidden = true; qEl.setAttribute('aria-expanded', 'false'); qEl.removeAttribute('aria-activedescendant'); active = -1; }
function showHits() {
  const q = qEl.value;
  if (!q.trim()) { closeHits(); return; }
  const { hits, fixed } = find(q);
  shown = hits.map(h => h.j);
  active = shown.length ? 0 : -1;
  const kk = x => x.k === 'entity' ? G.ekinds[x.ek] || 'Thing' : KIND[x.k].label;
  hitsEl.innerHTML = (fixed ? `<li class="none" role="presentation">Showing results for <b>${esc(fixed)}</b> (you typed ${esc(q.trim())})</li>` : '')
    + (shown.length ? shown.map((j, i) => `<li role="option" id="hit-${i}" data-j="${j}" aria-selected="${i === active}"><span class="hk">${esc(kk(N[j]))}</span><span class="ht">${esc(N[j].k === 'claim' ? N[j].i.slice(6) + ' · ' + cut(N[j].n, 90) : cut(labelFor(N[j]), 110))}</span></li>`).join('')
      : '<li class="none" role="presentation">Nothing in the map matches. Try another word.</li>');
  hitsEl.hidden = false; qEl.setAttribute('aria-expanded', 'true');
  if (active >= 0) qEl.setAttribute('aria-activedescendant', 'hit-0'); else qEl.removeAttribute('aria-activedescendant');
}
function moveHit(d) {
  if (!shown.length) return;
  active = (active + d + shown.length) % shown.length;
  hitsEl.querySelectorAll('[role=option]').forEach((li, i) => li.setAttribute('aria-selected', String(i === active)));
  qEl.setAttribute('aria-activedescendant', 'hit-' + active);
  const li = $('#hit-' + active); if (li) li.scrollIntoView({ block: 'nearest' });
}
function pickHit(i) { if (i < 0 || i >= shown.length) return; const j = shown[i]; closeHits(); qEl.value = ''; go(j, true); }
qEl.addEventListener('input', showHits);
qEl.addEventListener('keydown', ev => {
  if (ev.key === 'ArrowDown') { ev.preventDefault(); if (hitsEl.hidden) showHits(); else moveHit(1); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); moveHit(-1); }
  else if (ev.key === 'Enter') { ev.preventDefault(); if (hitsEl.hidden) showHits(); pickHit(active); }
  else if (ev.key === 'Escape') { if (!hitsEl.hidden) { ev.preventDefault(); closeHits(); } }
});
qEl.addEventListener('blur', () => setTimeout(closeHits, 150));
hitsEl.addEventListener('mousedown', ev => ev.preventDefault());
hitsEl.addEventListener('click', ev => { const li = ev.target.closest('[role=option]'); if (li) pickHit(shown.indexOf(+li.dataset.j)); });
document.addEventListener('keydown', ev => {
  if (ev.key === '/' && !/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '')) { ev.preventDefault(); qEl.focus(); }
});

// ------------------------------------------------------------------ controls: hops, kinds, links, claim filters, zoom
const kindsEl = $('#kinds'), egEl = $('#egroups');
for (const [k, label] of KFILTERS) kindsEl.insertAdjacentHTML('beforeend', `<label class="chip"><input type="checkbox" value="${k}"${S.kinds[k] ? ' checked' : ''}><span class="has-ic"><i class="ici"></i>${label}</span></label>`);
// each kind chip carries the shape the map draws for it, so the row of chips is also the legend of the shapes
const CHIPX = { entity: { k: 'entity', ek: 'product' }, topic: { k: 'topic' }, requirement: { k: 'requirement' }, factmyth: { k: 'fact' }, quoteangle: { k: 'quote' },
  term: { k: 'term' }, source: { k: 'source', pk: 'google' }, claim: { k: 'claim', l: 'stage' } };
function chipIcons() {
  for (const i of kindsEl.querySelectorAll('.ici')) {
    const k = i.closest('label').querySelector('input').value, s = el('svg', { class: 'ic', viewBox: '-8 -8 16 16', 'aria-hidden': 'true', focusable: 'false' }), g = el('g', { class: 'nd ' + kindClass(CHIPX[k]) });
    shape(g, CHIPX[k], k === 'claim' ? 4.6 : k === 'topic' ? 6.6 : 6.4); s.append(g); i.replaceChildren(s);
  }
}
for (const [k, label] of EFILTERS) egEl.insertAdjacentHTML('beforeend', `<label class="chip"><input type="checkbox" value="${k}" checked><span>${label}</span></label>`);
kindsEl.addEventListener('change', ev => { S.kinds[ev.target.value] = ev.target.checked; draw(); });
egEl.addEventListener('change', ev => { S.edges[ev.target.value] = ev.target.checked; draw(); });  // a filter redraws and fits; what was grown, pinned or moved stays
const days = [...new Set(N.filter(x => x.k === 'claim').map(x => x.d))].sort((a, b) => a - b);
$('#f-day').insertAdjacentHTML('beforeend', days.map(d => `<option value="${d}">Day ${d}</option>`).join(''));
$('#f-label').insertAdjacentHTML('beforeend', Object.keys(G.labels).map(l => `<option value="${l}">${esc(G.labels[l])}</option>`).join(''));
$('#f-day').addEventListener('change', ev => { S.day = +ev.target.value; draw(); });
$('#f-label').addEventListener('change', ev => { S.label = ev.target.value; draw(); });
$('#f-grade').addEventListener('change', ev => { S.grade = ev.target.value; draw(); });
$$('[data-hop]').forEach(b => b.addEventListener('click', () => {
  S.hop = +b.dataset.hop;
  $$('[data-hop]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  draw();
}));
$$('[data-z]').forEach(b => b.addEventListener('click', () => {  // the same view as the wheel and the pinch: in and out round the middle of the box
  const z = +b.dataset.z;
  if (!z) fit(); else zoomAt(mapEl.clientWidth / 2, mapEl.clientHeight / 2, z > 0 ? 1.25 : .8, true);
}));
$('#reset').addEventListener('click', resetLayout);
liveEl.addEventListener('click', () => setLive(!S.live));
{ const mq = matchMedia('(prefers-reduced-motion: reduce)'); if (mq.addEventListener) mq.addEventListener('change', motionPref); }
motionPref();

// ------------------------------------------------------------------ the legend: shapes, colours and lines, drawn with the same code as the map
function legend() {
  const sw = (x, r) => { const s = el('svg', { width: 22, height: 22, viewBox: '-11 -11 22 22', 'aria-hidden': 'true' }); const g = el('g', { class: 'nd ' + kindClass(x) }); shape(g, x, r); s.append(g); return s.outerHTML; };
  const line = g => `<svg width="34" height="10" viewBox="0 0 34 10" aria-hidden="true"><line class="ed e-${g}" x1="1" y1="5" x2="33" y2="5"/></svg>`;
  const li = (icon, t) => `<li>${icon}<span>${esc(t)}</span></li>`;
  let h = '<ul><li class="lk">Nodes</li>' + li(sw({ k: 'entity', ek: 'concept' }, 7), 'Thing (colour = kind)') + li(sw({ k: 'topic' }, 8), 'Topic')
    + li(sw({ k: 'requirement' }, 7), 'Requirement') + li(sw({ k: 'fact' }, 7), 'Fact, myth, quote, angle, glossary term') + li(sw({ k: 'source', pk: 'google' }, 8), 'Google document')
    + li(sw({ k: 'source', pk: 'press' }, 8), 'Press report') + li(sw({ k: 'claim', l: 'stage' }, 4.6), 'Claim (colour = label)')
    + `<li><svg width="22" height="22" viewBox="-11 -11 22 22" aria-hidden="true"><g class="nd bundle"><circle class="sh" r="9"/><text class="plus" y="4.5" text-anchor="middle">+</text></g></svg><span>More of a kind: press to show them</span></li>`;
  h += '<li class="lk">Kinds of thing</li>' + Object.keys(G.ekinds).map(k => li(sw({ k: 'entity', ek: k }, 6), G.ekinds[k])).join('');
  h += '<li class="lk">Claim labels</li>' + Object.keys(G.labels).map(l => li(sw({ k: 'claim', l }, 4.6), G.labels[l])).join('');
  h += '<li class="lk">Links</li>' + EFILTERS.map(([g, t]) => li(line(g), t)).join('') + '</ul>';
  $('#legend-body').innerHTML = h;
}

let raf = 0;
const boxSoon = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(boxChanged); };
if (typeof ResizeObserver === 'function') new ResizeObserver(boxSoon).observe(mapEl); else addEventListener('resize', boxSoon);
addEventListener('hashchange', route);
loadFonts();
chipIcons();
legend();
route();
})();
</script>
</body>
