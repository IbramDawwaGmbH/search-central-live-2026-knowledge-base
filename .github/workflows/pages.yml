# Publishes the web edition (60-outputs/site) to GitHub Pages whenever it changes on main.
# Repository settings: Pages -> Build and deployment -> Source: GitHub Actions.
name: Publish the web edition

on:
  push:
    branches: [main]
    paths: ['60-outputs/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 60-outputs/site
      - id: deployment
        uses: actions/deploy-pages@v4
