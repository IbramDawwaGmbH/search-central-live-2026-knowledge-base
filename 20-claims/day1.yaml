- {id: D1-C171, s: D1-S01, label: stage, who: Lino Cattaruzzi, ev: [T:d1r1a:31, T:a-vp:28], ver: n/a, topics: [ai-mode-usage],
   text: "Google's examples of brainstorming queries were a request for birthday gift ideas for a son turning 18 and, instead of asking for the nearest pizza, describing a party of fifteen guests that needs healthy, warm food delivered in under twenty minutes."}
