# ---------- D1-S02 What's new ----------
- {id: D1-C016, s: D1-S02, label: slide, ev: IMG_4633, ver: undocumented, topics: [ai-mode-usage],
   text: "AI Mode queries have doubled every quarter since launch."}
- {id: D1-C017, s: D1-S02, label: slide, ev: [IMG_4633, IMG_4629, T:a-vp:24], ver: undocumented, topics: [ai-mode-usage],
   text: "The average AI Mode query is about 3 times the length of a traditional search (the opening keynote's slide and its speaker said two to three times)."}
- {id: D1-C018, s: D1-S02, label: slide, ev: IMG_4633, ver: undocumented, topics: [ai-mode-usage, images],
   text: "One in six AI Mode searches is multimodal, using voice or images."}
- {id: D1-C019, s: D1-S02, label: slide, ev: IMG_4633, ver: undocumented, topics: [ai-mode-usage],
   text: "Follow-up queries in AI Mode have grown by more than 40% per month on average in the US since launch."}
- {id: D1-C020, s: D1-S02, label: slide, ev: ["IMG_4634, IMG_4630", T:d1r1b:7], ver: undocumented, topics: [ai-mode-usage],
   text: "Google describes four new ways people search in AI Mode: Explore (brainstorming queries, grown 30% faster than AI Mode queries overall in the US since launch), Learn (study guides, deep dives), Decide (searches beginning with 'which', up 40% faster than AI Mode queries overall in the past six months) and Do (planning queries, up 80% faster than AI Mode queries overall in the past six months)."}
- {id: D1-C021, s: D1-S02, label: slide, ev: IMG_4641, ver: undocumented, topics: [ai-mode-usage],
   text: "Queries of five or more words are growing in volume 1.5 times faster than shorter queries. The slide footnote cites Google internal data on global English-language queries, for a comparison period that starts in November 2022 (the remaining dates are only partly legible)."}
- {id: D1-C022, s: D1-S02, label: slide, ev: [IMG_4635, T:d1r1b:14], ver: undocumented, topics: [search-agents],
   text: "Search Agents in AI Mode let users set standing requests for updates, such as being told when a product goes on sale, a team wins or a price drops below a level."}
- {id: D1-C023, s: D1-S02, label: slide, ev: [IMG_4636, T:d1r1b:16], ver: undocumented, topics: [ai-links-to-web],
   text: "Google listed eight ways AI Search helps users find and visit websites: preferred sources expansion, fresh perspectives and prominent links, subscription content, in-line quotes in AI Mode and AI Overviews, rich linking and embedded web, context on content sources, 'Highly Cited' labels and Search profiles."}
- {id: D1-C024, s: D1-S02, label: slide, ev: [IMG_4637, T:d1r1b:17], ver: undocumented, topics: [linked-subscriptions],
   text: "Users can link their subscriptions so answers highlight paywalled content they already pay for; The Indian Express saw 34% more engagement among linked subscribers."}
- {id: D1-C025, s: D1-S02, label: slide, ev: IMG_4638, ver: confirmed, src: [search-profiles-blog, search-profile-help], topics: [search-profiles],
   text: "Publishers and creators can claim a dedicated Search profile with a name, profile photo, cover image, bio, connected social and website accounts, pinned posts and links, and users can follow it."}
- {id: D1-C026, s: D1-S02, label: docs, ev: "", ver: source, src: [search-profiles-blog], topics: [search-profiles],
   text: "Search profiles launched on 4 June 2026, in the US first, for creators and publishers with a sizable following on at least one major social or video platform. They appear in knowledge panels and Discover."}
- {id: D1-C125, s: D1-S02, label: docs, ev: "", ver: source, src: [search-profiles-update], topics: [search-profiles],
   rel: [{type: updates, to: D1-C026}],
   text: "Since 16 September 2026, US publishers and creators qualify for a Search profile with 10,000 followers across YouTube, Instagram, X or TikTok, and media organisations can claim and manage profiles for all their sub-brands from one login.",
   quote: "We've lowered the eligibility threshold to 10,000 followers across YouTube, Instagram, X, or TikTok."}
- {id: D1-C027, s: D1-S02, label: slide, ev: [IMG_4639, T:d1r1b:17], ver: undocumented, topics: [preferred-sources],
   text: "Sites that users mark as a preferred source are more visible in Top Stories and are labelled in AI Mode and AI Overviews."}
- {id: D1-C028, s: D1-S02, label: analysis, ev: "", ver: n/a, topics: [preferred-sources, linked-subscriptions, search-profiles],
   text: "Preferred sources, linked subscriptions and Search profiles all depend on users acting on a brand's behalf. They reward brands with a loyal audience and do little for anonymous lead-generation sites."}
- {id: D1-C029, s: D1-S02, label: slide, ev: [IMG_4640, T:d1r1b:18], ver: confirmed, src: [gsc-genai-control], topics: [genai-optout],
   text: "Search Console has a property setting called Search generative AI that gives direct control over AI Overviews and AI Mode without affecting web rankings. Its states are inherit from parent, include and exclude.",
   quote: "Direct control over AI Overviews and AI Mode without impacting web rankings.", quote_checked: true}
- {id: D1-C030, s: D1-S02, label: docs, ev: "", ver: source, src: [gsc-genai-control], topics: [genai-optout],
   text: "The Search generative AI control covers AI Overviews, AI Mode and generative AI features in Discover. Excluding removes both links to the site and use of its content to ground answers."}
- {id: D1-C031, s: D1-S02, label: docs, ev: "", ver: source, src: [gsc-genai-control], topics: [genai-optout],
   text: "Google says the control is not used as a ranking or inclusion signal for regular results.",
   quote: "this control isn't used as a ranking or inclusion signal"}
- {id: D1-C032, s: D1-S02, label: docs, ev: "", ver: source, src: [gsc-genai-control], topics: [genai-optout, google-extended],
   text: "The control does not affect AI training. Training of the models is limited with Google-Extended instead."}
- {id: D1-C033, s: D1-S02, label: docs, ev: "", ver: source, src: [gsc-genai-control], topics: [genai-optout],
   text: "Changes to the control generally apply within 1–2 days, though some content takes longer. It works at property level only, and a child property inherits from its closest parent that changed the setting."}
- {id: D1-C034, s: D1-S02, label: analysis, ev: "", ver: n/a, topics: [genai-optout],
   text: "Lead-generation, local-service and e-commerce sites should normally stay included, because AI answers cite and link sources. Sites selling paywalled or licensed content should test exclusion on a child property first. Use nosnippet only if you also want out of regular snippets."}
- {id: D1-C035, s: D1-S02, label: slide, who: Gary Illyes, ev: [IMG_4642, T:d1r1b:25], ver: consistent, src: [ai-optimization-guide], topics: [pipeline-overview, seo-vs-geo],
   text: "Knowing how Search works largely means knowing how the AI features work.",
   quote: "If you know how Search works, you largely also know how AI features work.", quote_checked: true}
- {id: D1-C049, s: D1-S02, label: stage, who: Gary Illyes, ev: [notes, T:d1r1b:25, T:d1r1b:58], ver: consistent, src: [ai-optimization-guide], topics: [seo-vs-geo],
   text: "Gary Illyes argued that GEO is a label invented to create a new field and is not needed. Understanding how SEO works is enough."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D1-C182, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:3, ver: n/a, topics: [search-evolution],
   rel: [{type: extends, to: D1-C001}],
   text: "Gary Illyes said that in about 30 years of web search, helping users complete their journeys has made them search more, not less, unlike a product whose problem is solved once and for all."}
- {id: D1-C183, s: D1-S02, label: stage, who: Gary Illyes, ev: [T:d1r1b:4, T:d1r1b:11], ver: undocumented, topics: [search-evolution],
   text: "Google said Gen Z users are a very large part of Google Search's user base and search differently from older users, for example with images."}
- {id: D1-C184, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:5, ver: consistent, src: [search-io-2026-blog], topics: [ai-mode-usage],
   rel: [{type: extends, to: D1-C016}, {type: extends, to: D1-C004}],
   text: "Google said AI Mode is growing almost exponentially and that people are searching more because of it, not less."}
- {id: D1-C185, s: D1-S02, label: stage, who: Gary Illyes, ev: [T:d1r1b:6, T:d1r1b:23], ver: consistent, src: [ai-features-guide], topics: [ai-mode-usage, ai-overviews-usage],
   rel: [{type: extends, to: D1-C021}],
   text: "Google said a multi-part query, such as a white three-row SUV for two teenagers and a car-sick dog, cannot be satisfied by a list of links because no single article covers every aspect, while AI Overviews and AI Mode can synthesise an answer that helps users decide where to go."}
- {id: D1-C186, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:8, ver: n/a, topics: [search-evolution, query-understanding],
   text: "Gary Illyes said that in the mid-1990s searchers had to speak machine, typing queries like 'weather Barcelona rain', whereas today machines understand how people naturally speak."}
- {id: D1-C187, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:11, ver: confirmed, src: [search-io-2026-blog], topics: [search-evolution],
   rel: [{type: extends, to: D1-C150}],
   text: "Google presented the intelligent search box as one of its recent Search launches; it accepts long queries and keeps expanding to make room for them."}
- {id: D1-C188, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:11, ver: undocumented, topics: [images],
   text: "Google said it noticed young users uploading pictures to reverse image search and expecting results that answer something about the picture, and that Google Lens was its answer to that behaviour."}
- {id: D1-C189, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:12, ver: confirmed, src: [search-io-2026-blog], topics: [ai-overviews-usage, ai-mode-usage],
   rel: [{type: extends, to: D1-C152}],
   text: "AI Overviews and AI Mode work together: a user can start with an AI Overview and continue the conversation in AI Mode."}
- {id: D1-C190, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:13, ver: confirmed, src: [ai-search-intelligence-blog], topics: [images],
   text: "Google said Google Lens is used by over 1.5 billion people (figure as said on stage on 30 September 2026; no period was given)."}
- {id: D1-C191, s: D1-S02, label: docs, ev: T:d1r1b:13, ver: source, src: [ai-search-intelligence-blog], topics: [images],
   text: "Google's May 2025 Search announcement says more than 1.5 billion people use Google Lens to search what they see every month.",
   quote: "Google Lens, which more than 1.5 billion people are using to search what they see every month"}
- {id: D1-C192, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:14, ver: undocumented, src: [ai-mode-info-monitoring-press], topics: [search-agents],
   rel: [{type: extends, to: D1-C022}],
   text: "Google said Search agents in AI Mode had launched globally a day or two before 30 September 2026."}
- {id: D1-C193, s: D1-S02, label: press, ev: T:d1r1b:14, ver: source, src: [ai-mode-info-monitoring-press, search-io-2026-blog], topics: [search-agents],
   text: "A search marketing agency reported on 29 September 2026 that Google's VP of Product for Search announced on X, on 28 September 2026, that AI Mode information monitoring was rolling out to everyone globally in the Google app; Google's I/O 2026 post had launched information agents first for AI Pro and Ultra subscribers in summer 2026."}
- {id: D1-C194, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:14, ver: consistent, src: [search-io-2026-blog], topics: [search-agents],
   rel: [{type: extends, to: D1-C022}],
   text: "A Search agent is set up by typing a natural-language request, which AI Mode interprets to create an alert; Google called this an information agent."}
- {id: D1-C195, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:15, ver: consistent, src: [search-io-2026-blog], topics: [search-agents],
   text: "Google said it would roll out agentic capabilities that allow bookings later in 2026, in the US only at first."}
- {id: D1-C196, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:19, ver: consistent, src: [genai-perf-reports-blog, gsc-genai-control], topics: [measurement, genai-optout],
   rel: [{type: repeats, to: D1-C124}],
   text: "Google said Search Console's generative AI reporting launched alongside the generative AI control, starting with impressions only, and may expand later."}
- {id: D1-C197, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:21, ver: n/a, topics: [seo-vs-geo],
   text: "Gary Illyes traced 'SEO is dead' predictions back to a post titled 'Search engine R.I.P.' on an online advertising forum on 10 November 1997, and said such posts still appear every month or even every week."}
- {id: D1-C198, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:21, ver: n/a, topics: [seo-vs-geo],
   rel: [{type: extends, to: D1-C050}],
   text: "Gary Illyes said SEO is not dead and that the new AI features only create more opportunities for site owners to take advantage of."}
- {id: D1-C199, s: D1-S02, label: stage, who: Gary Illyes, ev: T:d1r1b:24, ver: undocumented, topics: [ai-in-search-systems, images],
   rel: [{type: extends, to: D1-C161}],
   text: "Gary Illyes said searching by image or by video, as Search offers it today, was not possible before transformers were invented."}
- {id: D1-C200, s: D1-S02, label: analysis, ev: T:d1r1b:24, ver: n/a, src: [search-25-moments-blog, transformer-research-blog], topics: [ai-in-search-systems, images],
   text: "Visual search predates transformers in Google's own history: its Search timeline dates Google Images to 2001 and Google Lens to 2017, the year Google Research published the Transformer, so read the stage remark as being about today's multimodal AI search."}

# ---------- D1-S03 How Search works and where's AI ----------
- {id: D1-C036, s: D1-S03, label: slide, ev: ["IMG_4650, IMG_4655", T:d1r1b:30, T:d1r1b:64], ver: confirmed, src: [how-search-works], topics: [pipeline-overview],
   text: "Search runs as three stages, crawling, indexing and serving, and the event covered one stage per day."}
- {id: D1-C037, s: D1-S03, label: slide, ev: [IMG_4650, T:d1r1b:43], ver: consistent, src: [how-search-works, ranking-systems-guide], topics: [pipeline-overview, ai-in-search-systems],
   text: "For classic Search, crawling means Googlebot, scheduling and robots.txt, with AI used in parts such as scheduling. Indexing is one big but not limitless index that calculates signals and understands more than words, with AI such as BERT. Serving uses hundreds of signals tailored to the moment, with AI such as RankBrain."}
- {id: D1-C038, s: D1-S03, label: slide, ev: [IMG_4650, T:d1r1b:34, T:d1r1b:40, T:d1r1b:54], ver: consistent, src: [ai-optimization-guide], topics: [pipeline-overview, query-fanout, seo-vs-geo],
   text: "AI Mode and AI Overviews use the same crawling and the same index as Search. At serving they add grounding on the Search index and query fan-out."}
- {id: D1-C039, s: D1-S03, label: slide, ev: [IMG_4650, T:d1r1b:55], ver: consistent, src: [common-crawlers], topics: [pipeline-overview, gemini-and-search],
   text: "Gemini is not part of Search, but it uses crawlers for data, shares some technologies such as tokenization and deduping, and grounds on the Search index."}
- {id: D1-C040, s: D1-S03, label: slide, ev: [IMG_4643, T:d1r1b:32], ver: confirmed, src: [how-search-works], topics: [url-discovery],
   text: "URL discovery works through links: a homepage links to section pages, which link to further pages."}
- {id: D1-C041, s: D1-S03, label: slide, ev: [IMG_4644, T:d1r1b:41], ver: undocumented, topics: [ai-in-search-systems],
   text: "Statistical models have been used at Google for over 20 years, for catching spam and originally for the 'Did you mean' feature."}
- {id: D1-C042, s: D1-S03, label: slide, ev: [IMG_4644, T:d1r1b:41], ver: consistent, src: [ranking-systems-guide], topics: [ai-in-search-systems],
   text: "BERT is used in indexing to understand each word in the context of the whole sentence rather than one word at a time."}
- {id: D1-C133, s: D1-S03, label: docs, ev: "", ver: source, src: [ranking-systems-guide], topics: [ai-in-search-systems],
   text: "Google's ranking systems guide lists BERT among its ranking systems, as an AI system that helps Google understand how combinations of words express different meanings and intent.",
   quote: "an AI system Google uses that allows us to understand how combinations of words express different meanings and intent"}
- {id: D1-C043, s: D1-S03, label: slide, ev: IMG_4647, ver: consistent, src: [ranking-systems-guide], topics: [ai-in-search-systems],
   text: "RankBrain is used in serving to interpret the intent behind queries, especially new or unusual ones, and match them to relevant results."}
- {id: D1-C044, s: D1-S03, label: slide, ev: IMG_4647, ver: undocumented, topics: [ai-in-search-systems],
   text: "MUM (Multitask Unified Model) understands information across text, images, audio and video, and processes information in more than 75 languages."}
- {id: D1-C134, s: D1-S03, label: docs, ev: "", ver: source, src: [mum-blog], topics: [ai-in-search-systems],
   text: "Google's May 2021 announcement of MUM says it is trained across 75 languages and understands information across text and images, and that it could expand to other modalities such as video and audio in the future.",
   quote: "MUM is multimodal, so it understands information across text and images and, in the future, can expand to more modalities like video and audio."}
- {id: D1-C130, s: D1-S03, label: docs, ev: "", ver: source, src: [ranking-systems-guide], topics: [ai-in-search-systems],
   text: "Google's ranking systems guide says MUM is not currently used for general ranking in Search, only for specific applications such as COVID-19 vaccine searches and featured snippet callouts.",
   quote: "It's not currently used for general ranking in Search"}
- {id: D1-C045, s: D1-S03, label: slide, ev: [IMG_4646, T:d1r1b:48], ver: undocumented, topics: [ranking-signals-by-vertical, images],
   text: "Ranking signals differ by result type: web pages (text, links, passages), images (resolution, colour, associated text), news (freshness, originality, diversity), local (location, type, rating, reviews, hours) and videos (language, text from speech)."}
- {id: D1-C046, s: D1-S03, label: slide, ev: [IMG_4645, T:d1r1b:42], ver: n/a, topics: [ai-content-detection],
   text: "A Google slide headed 'Your Question' raised whether Google can distinguish between AI-written and human-written content, presented on stage as the question this topic usually prompts rather than one asked live."}
- {id: D1-C047, s: D1-S03, label: slide, ev: [IMG_4648, T:d1r1b:51], ver: undocumented, topics: [ai-content-detection, helpful-content],
   rel: [{type: answers, to: D1-C046}],
   text: "Google's answer was that ML-based ranking systems are trained on content written by humans for humans, so they understand and promote natural content better.",
   quote: "ML based ranking algorithms and signals are trained on content by humans for humans. They \"understand\" and promote natural content better.", quote_checked: true}
- {id: D1-C048, s: D1-S03, label: analysis, ev: "", ver: n/a, topics: [ai-content-detection],
   text: "The answer is not a claim that Google detects AI text. It says ranking favours text that reads as natural to people. The risk with AI content is scale without value, which falls under Google's scaled content abuse policy, not the tool itself."}
- {id: D1-C050, s: D1-S03, label: slide, ev: ["IMG_4651, IMG_4652", T:d1r1b:56, T:d1r1b:58], ver: confirmed, src: [ai-optimization-guide], topics: [seo-vs-geo],
   text: "Google's answer to 'SEO is dead, long live GEO' is not to worry about the name: good SEO is good GEO and AEO.",
   quote: "Don't worry about what to call it. Good SEO is good GEO, AEO.", quote_checked: true}
- {id: D1-C051, s: D1-S03, label: slide, ev: [IMG_4652, T:d1r1b:57], ver: confirmed, src: [ai-optimization-guide], topics: [seo-vs-geo, query-fanout],
   text: "Three reasons were given: generative AI features are built directly on the core ranking systems, query fan-out expands the original query to find related information, and generative AI features highlight content indexed by Google Search."}
- {id: D1-C052, s: D1-S03, label: docs, ev: "", ver: source, src: [ai-optimization-guide], topics: [seo-vs-geo],
   text: "Google's guide for generative AI features says optimising for generative AI search is optimising for the search experience, and is therefore still SEO.",
   quote: "optimizing for generative AI search is optimizing for the search experience, and thus still SEO"}
- {id: D1-C053, s: D1-S03, label: docs, ev: "", ver: source, src: [ai-optimization-guide], topics: [query-fanout],
   text: "Query fan-out means running several related searches at once to gather more results; a question about lawn weeds may also search herbicides and weed prevention."}
- {id: D1-C129, s: D1-S03, label: docs, ev: "", ver: source, src: [ai-optimization-guide], topics: [query-fanout, helpful-content],
   text: "Google's guide says creating separate content for every variation of how people might search, including fan-out queries, primarily to manipulate rankings or AI responses violates its scaled content abuse policy. It adds that its AI systems can understand a page's relevance even without an exact match to the query."}
- {id: D1-C054, s: D1-S03, label: slide, ev: [IMG_4653, T:d1r1b:59], ver: confirmed, src: [ai-optimization-guide], topics: [seo-vs-geo, llms-txt, helpful-content],
   text: "Myth: optimise for AI over readers. Google's answer: optimise for people, with no need to obsess over precise keywords or AI phrasing, no need to chop content, and no need for llms.txt.",
   quote: "LLMS.txt isn't necessary.", quote_checked: true}
- {id: D1-C055, s: D1-S03, label: slide, ev: [IMG_4653, T:d1r1b:60], ver: confirmed, src: [ai-optimization-guide], topics: [helpful-content],
   text: "Myth: build content for every possible consumer need. Google's answer: prioritise unique perspectives, expertise and in-depth experience that go beyond common knowledge."}
- {id: D1-C056, s: D1-S03, label: slide, ev: [IMG_4653, T:d1r1b:61], ver: consistent, src: [ai-optimization-guide], topics: [helpful-content, seo-vs-geo],
   text: "Myth: your website is no longer relevant. Google's answer: keep content crawlable, well structured, fast and easy to read, for readers and for AI tools."}
- {id: D1-C057, s: D1-S03, label: slide, ev: [IMG_4653, T:d1r1b:62], ver: n/a, topics: [measurement],
   text: "Myth: the old metrics don't work in the AI era. Google's answer: measure success through metrics that matter to your business."}
- {id: D1-C058, s: D1-S03, label: slide, ev: [IMG_4654, T:d1r1b:63], ver: consistent, src: [ai-optimization-guide], topics: [seo-vs-geo, helpful-content],
   text: "Optimising for people is optimising for generative AI Search.",
   quote: "Optimizing for people is optimizing for Generative AI Search", quote_checked: true}
- {id: D1-C061, s: D1-S03, label: docs, ev: "", ver: source, src: [ai-optimization-guide], topics: [llms-txt],
   text: "Google's guide says new machine-readable files, AI text files or special markup are not needed to appear in Search, and that such files neither harm nor help visibility because Google Search ignores them."}
- {id: D1-C062, s: D1-S03, label: docs, ev: "", ver: source, src: [ai-optimization-guide], topics: [measurement, genai-optout],
   text: "Google's guide for generative AI features recommends the Generative AI performance report in Search Console for measuring how content performs in generative AI features on Google Search and Discover."}
- {id: D1-C124, s: D1-S03, label: docs, ev: "", ver: source, src: [genai-perf-reports-blog], topics: [measurement, genai-optout],
   text: "Google's launch post for the Generative AI performance reports in Search Console (3 June 2026; rolled out to all sites worldwide by 31 August 2026) lists impressions, pages, countries, devices (Search only) and dates, and no click or query metrics."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D1-C201, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:31, ver: undocumented, topics: [url-discovery],
   text: "Google said there are trillions of URLs on the internet, or even more, that even Google cannot tell how many exist, and that some may never be discovered."}
- {id: D1-C202, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:32, ver: consistent, src: [how-search-works], topics: [url-discovery, crawl-demand],
   rel: [{type: extends, to: D1-C040}],
   text: "Google may visit hub pages, such as a homepage or category pages, more often than other pages, because they usually link out to new or updated pages."}
- {id: D1-C203, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:33, ver: confirmed, src: [how-search-works], topics: [crawl-pipeline],
   text: "A crawler is software that downloads pages, extracts their links and repeats the process on the links it extracted; Googlebot is the main crawler of Google Search."}
- {id: D1-C204, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:36, ver: consistent, src: [how-search-works], topics: [indexing-pipeline],
   text: "Indexing starts with parsing the fetched HTML, so that elements of the page such as the title can be extracted and accessed easily."}
- {id: D1-C205, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:37, ver: consistent, src: [how-search-works], topics: [indexing-signals, index-selection, ranking-systems],
   rel: [{type: extends, to: D1-C037}],
   text: "Signals calculated for a page during indexing are stored in the index and used both to decide whether the page gets indexed and, later, for ranking."}
- {id: D1-C206, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:38, ver: confirmed, src: [javascript-seo-basics, how-search-works], topics: [rendering],
   text: "Google renders JavaScript-heavy pages from their HTML, CSS and JavaScript as a browser would, using the latest version of Chromium."}
- {id: D1-C207, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:39, ver: confirmed, src: [how-search-works, canonicalization], topics: [duplicate-content, canonical-selection],
   rel: [{type: repeats, to: D1-C128}],
   text: "Google clusters duplicate pages and selects one page per cluster as its representative, the canonical URL, so that users are not shown duplicates."}
- {id: D1-C208, s: D1-S03, label: stage, who: Gary Illyes, ev: T:d1r1b:40, ver: consistent, src: [ai-optimization-guide, ai-features-guide], topics: [pipeline-overview],
   rel: [{type: extends, to: D1-C038}],
   text: "AI Overviews and AI Mode may have extra processes of their own, like any other search feature, but the bulk of their processing is the same as for normal Search."}
- {id: D1-C209, s: D1-S03, label: stage, who: Gary Illyes, ev: T:d1r1b:41, ver: confirmed, src: [search-25-moments-blog], topics: [ai-in-search-systems],
   rel: [{type: extends, to: D1-C041}],
   text: "Google launched the 'Did you mean' feature around 2001-2002 using a statistical model, which Gary Illyes counted as AI because it is a form of machine learning."}
- {id: D1-C210, s: D1-S03, label: stage, who: Gary Illyes, ev: T:d1r1b:42, ver: confirmed, src: [ai-content-blog-2023, gen-ai-content-guide], topics: [ai-content-detection],
   rel: [{type: answers, to: D1-C046}, {type: repeats, to: D1-C175}],
   text: "Google said it is not really trying to tell AI-written from human-written content, because it cares more about the quality of content than about how it was created.",
   quote: "We care more about the quality of the content than how it was created."}
- {id: D1-C211, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:43, ver: consistent, src: [how-search-works], topics: [index-selection],
   rel: [{type: extends, to: D1-C037}],
   text: "Index selection runs after signals are collected and duplicates are dropped, and decides what goes into Google's index, which is big but not limitless."}
- {id: D1-C212, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:43, ver: consistent, src: [how-search-works], topics: [index-selection, duplicate-content],
   text: "When a page is selected for Google's index, its whole duplicate cluster goes into the index with it."}
- {id: D1-C213, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:44, ver: undocumented, topics: [index-structure],
   text: "Google said its index, printed on paper, would reach the Moon and back twelve times."}
- {id: D1-C214, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:45, ver: consistent, src: [how-search-works], topics: [pipeline-overview],
   rel: [{type: extends, to: D1-C036}],
   text: "Crawling and indexing happen before anyone searches, while serving and ranking happen in real time when someone types a query."}
- {id: D1-C215, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:46, ver: consistent, src: [hsw-ranking-results], topics: [query-understanding],
   text: "Serving starts with interpreting the query, which includes cleaning it up, detecting its language and expanding it."}
- {id: D1-C216, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:48, ver: consistent, src: [how-search-works, hsw-ranking-results], topics: [ranking-systems, helpful-content],
   text: "Google said quality is one of the most important things in ranking."}
- {id: D1-C217, s: D1-S03, label: stage, who: Gary Illyes, ev: T:d1r1b:49, ver: consistent, src: [ai-powers-search-blog], topics: [ai-in-search-systems],
   rel: [{type: extends, to: D1-C043}],
   text: "Google began talking publicly about its use of AI in Search around 2015-2016, and RankBrain was the first such system it publicised widely."}
- {id: D1-C218, s: D1-S03, label: stage, who: Gary Illyes, ev: T:d1r1b:50, ver: consistent, src: [mum-blog], topics: [ai-in-search-systems, query-understanding],
   rel: [{type: extends, to: D1-C044}],
   text: "Google said MUM helps it understand the context of the words in a query: a search for hiking shoes that mentions Mount Everest rather than Kilimanjaro gets results suited to that climb."}
- {id: D1-C219, s: D1-S03, label: analysis, ev: T:d1r1b:50, ver: n/a, src: [ai-powers-search-blog, mum-blog], topics: [ai-in-search-systems],
   text: "On stage MUM was placed three years after RankBrain, but Google dates RankBrain to 2015 and announced MUM in May 2021, more than five years later; date these systems by Google's own posts, not by the talk."}
- {id: D1-C220, s: D1-S03, label: stage, who: Gary Illyes, ev: T:d1r1b:51, ver: undocumented, topics: [ai-content-detection],
   rel: [{type: extends, to: D1-C047}],
   text: "Google said the more important documents in its index naturally tend to be documents created by humans."}
- {id: D1-C221, s: D1-S03, label: stage, who: Gary Illyes, ev: T:d1r1b:51, ver: undocumented, topics: [ai-content-detection, helpful-content],
   rel: [{type: extends, to: D1-C047}],
   text: "Google said the natural content its ranking algorithms understand and promote better includes content created by humans or at least edited and reviewed by them.",
   quote: "content that was created by humans, or at least edited and reviewed"}
- {id: D1-C222, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:52, ver: consistent, src: [how-search-works], topics: [serp-anatomy],
   text: "After ordering the results, Google constructs the results page by deciding which search features fit the intent of the query."}
- {id: D1-C223, s: D1-S03, label: stage, who: Cherry Prommawin, ev: T:d1r1b:52, ver: undocumented, topics: [ai-in-search-systems, serp-anatomy],
   text: "Google said a majority of its search features now use AI."}
- {id: D1-C224, s: D1-S03, label: stage, who: Gary Illyes, ev: T:d1r1b:53, ver: undocumented, topics: [images, retrieval],
   text: "For visual search, Google breaks an image down into vectors, sends the vectors to the index and returns results based on them."}
- {id: D1-C225, s: D1-S03, label: stage, who: Gary Illyes, ev: T:d1r1b:58, ver: consistent, src: [ai-features-guide, ai-optimization-guide], topics: [query-fanout],
   rel: [{type: extends, to: D1-C051}],
   text: "Google said query fan-out is nothing new: it fires, for example, ten different searches in the background, each a normal search on the same systems.",
   quote: "it is just ten different searches that fire in the background"}
- {id: D1-C226, s: D1-S03, label: stage, who: Gary Illyes, ev: T:d1r1b:35, ver: n/a, topics: [gemini-and-search],
   rel: [{type: extends, to: D1-C039}],
   text: "Google said it does not own third-party AI chatbots such as ChatGPT and has no insight into how they work or are built."}

# ---------- D1-S04 Lightning session A: Automation and AI ----------
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D1-C227, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2a:3, T:a-lt:2], ver: n/a, topics: [seo-scope],
   text: "Google received close to 200 submissions for the community lightning talks of the Deep Dive, reviewed them over about a month, and gave each selected community speaker seven minutes on stage."}
- {id: D1-C228, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2a:2, T:a-lt:1], ver: n/a, topics: [seo-scope],
   text: "Google's hosts said the lightning talks exist because the SEO community holds a lot of knowledge, some of it untapped, and highlighting the people who have it serves the community best."}
- {id: D1-C229, s: D1-S04, label: stage, who: James Powley, ev: [T:d1r2a:8, T:d1r2a:19, T:a-lt:7, T:a-lt:17], ver: n/a, topics: [ai-in-seo-workflows],
   text: "A community speaker's approach to AI in agency SEO work is to use it where it meaningfully elevates and enriches existing work rather than replacing it, keeping full strategic oversight and control of the output.",
   quote: "Human judgment and strategy is the default, and AI simply pushes it at scale.", quote_checked: true}
- {id: D1-C230, s: D1-S04, label: stage, who: James Powley, ev: [T:d1r2a:9, T:a-lt:8], ver: n/a, topics: [ai-in-seo-workflows],
   text: "Asking AI to produce whole SEO deliverables from scratch, such as creating content or auditing a website, is where people get stuck; break a task into its elements and decide where AI can and should play a part, a community speaker advised."}
- {id: D1-C231, s: D1-S04, label: stage, who: James Powley, ev: [T:d1r2a:10, T:a-lt:9], ver: n/a, topics: [ai-in-seo-workflows],
   text: "A community speaker designs AI-assisted deliverables like a flowchart, keeping guardrails in place and keeping the prompts succinct and measured, so the team controls the process end to end."}
- {id: D1-C232, s: D1-S04, label: stage, who: James Powley, ev: [T:d1r2a:11, T:d1r2a:12, T:a-lt:10, T:a-lt:11], ver: n/a, topics: [ai-in-seo-workflows],
   text: "In an agency's competitor keyword analysis, a deliverable defined before AI, the team set the strategy buckets and the keyword scoring metrics itself and used AI only to pull in the data, never to make a judgment."}
- {id: D1-C233, s: D1-S04, label: stage, who: James Powley, ev: [T:d1r2a:11, T:d1r2a:12, T:a-lt:10, T:a-lt:11], ver: n/a, topics: [ai-in-seo-workflows],
   text: "With AI pulling in the data, a competitor keyword analysis covering 26 competitors and 79 data points per keyword went from three days of work to a few hours, a community speaker reported for his agency."}
- {id: D1-C234, s: D1-S04, label: stage, who: James Powley, ev: [T:d1r2a:13, T:d1r2a:14, T:a-lt:12, T:a-lt:13], ver: n/a, topics: [ai-in-seo-workflows, duplicate-content],
   text: "For a content audit of a client blog with over 3,000 posts, an agency defined the parameters, scoring and weightings manually and had AI apply them, producing posts grouped by category, possible cannibalisation flags, a priority list and a list of posts to check by hand."}
- {id: D1-C235, s: D1-S04, label: stage, who: James Powley, ev: [T:d1r2a:14, T:a-lt:13], ver: n/a, topics: [ai-in-seo-workflows],
   text: "The key lesson of a community talk on AI automation: AI should not decide what good looks like; people set the rules for what is good and AI applies them.",
   quote: "it didn't decide what good looked like. We did that.", quote_checked: true}
- {id: D1-C236, s: D1-S04, label: stage, who: James Powley, ev: [T:d1r2a:15, T:d1r2a:16, T:a-lt:14], ver: n/a, topics: [ai-in-seo-workflows, site-moves],
   text: "In a post-migration analysis of over 200,000 lines of search traffic data and more than 45,000 pages, where many URLs had been merged into one, an agency set the rules for what counted as the same page and used AI to match old and new addresses and roll the traffic up per page."}
- {id: D1-C237, s: D1-S04, label: stage, who: James Powley, ev: [T:d1r2a:17, T:a-lt:15], ver: n/a, topics: [ai-in-seo-workflows],
   text: "A community speaker builds SEO recommendations without AI and then uses AI to turn them into mock-ups and visuals, which help win buy-in from clients and internal teams."}
- {id: D1-C238, s: D1-S04, label: stage, who: James Powley, ev: [T:d1r2a:18, T:a-lt:16], ver: n/a, topics: [ai-in-seo-workflows, measuring-ai-visibility],
   text: "An agency built its own AI visibility tracking tool so it could control the methodology: the team wrote pages of flowchart-style prompts (if this happens, do that) and tested manually, and AI only generated the code."}
- {id: D1-C239, s: D1-S04, label: stage, who: Rafael Kovashikawa, ev: [T:d1r2a:22, T:a-lt:20], ver: confirmed, src: [sc-impressions-help], topics: [ai-in-seo-workflows, search-console-data],
   text: "A community speaker's example of an LLM error on Search Console data: a chatbot called an average position that went from 8 to 9 an improvement, although position 1 is the top, so the move from 8 to 9 is a decline."}
- {id: D1-C240, s: D1-S04, label: stage, who: Rafael Kovashikawa, ev: [T:d1r2a:23, T:a-lt:21], ver: n/a, topics: [ai-in-seo-workflows],
   text: "How often an LLM gives a wrong answer about data depends on the model, but how often the mistake is noticed depends on the person using it, a community speaker said.",
   quote: "how often can you notice the mistake? And that depends on you.", quote_checked: true}
- {id: D1-C241, s: D1-S04, label: stage, who: Rafael Kovashikawa, ev: [T:d1r2a:24, T:a-lt:22], ver: n/a, topics: [ai-in-seo-workflows, measurement],
   text: "In agency marketing-data pipelines, as in financial forecasting, one misplaced figure travels downstream and compounds into later analysis and decisions, which is why LLM errors on search data must be caught early, a community speaker warned."}
- {id: D1-C242, s: D1-S04, label: stage, who: Rafael Kovashikawa, ev: [T:d1r2a:25, T:a-lt:23], ver: n/a, topics: [ai-in-seo-workflows],
   text: "A community speaker reported that a code refactor of his company's AI analysis product left data fetching correct but made the analysis shallow while the answers still read well, with the same model, so polished output is no proof of correct analysis."}
- {id: D1-C243, s: D1-S04, label: stage, who: Rafael Kovashikawa, ev: [T:d1r2a:27, T:a-lt:25], ver: n/a, topics: [ai-in-seo-workflows],
   text: "The first rule for using LLMs on search data, according to a community speaker, is never to let the model check its own output.",
   quote: "not let the model grade its own homework", quote_checked: true}
- {id: D1-C244, s: D1-S04, label: stage, who: Rafael Kovashikawa, ev: [T:d1r2a:28, T:a-lt:26], ver: n/a, topics: [ai-in-seo-workflows],
   text: "A community speaker's first guardrail for LLM answers about data is a receipt: every figure the model gives must be traceable to the data request behind it, so the answer can be verified.",
   quote: "If there is no receipt, there is no reimbursement.", quote_checked: true}
- {id: D1-C245, s: D1-S04, label: stage, who: Rafael Kovashikawa, ev: [T:d1r2a:29, T:a-lt:27], ver: n/a, topics: [ai-in-seo-workflows],
   text: "In a community speaker's verification system, each claim in an LLM's data answer is marked verified, flagged (a hallucination), or skipped or not found."}
- {id: D1-C246, s: D1-S04, label: stage, who: Rafael Kovashikawa, ev: [T:d1r2a:29, T:d1r2a:31, T:a-lt:27, T:a-lt:29], ver: n/a, topics: [ai-in-seo-workflows],
   text: "Claims that cannot be verified go to a judge, models from other vendors that score them; a failing claim is struck through with the reason shown, and the system annotates and proposes corrections rather than rewriting the answer, a community speaker described."}
- {id: D1-C247, s: D1-S04, label: stage, who: Rafael Kovashikawa, ev: [T:d1r2a:30, T:a-lt:28], ver: n/a, topics: [ai-in-seo-workflows, search-console-data],
   text: "Give an LLM your metric definitions as fixed, protected context, for example that position 1 is the top, and leave nothing for the model to guess, a community speaker advised."}
- {id: D1-C248, s: D1-S04, label: stage, who: Rafael Kovashikawa, ev: [T:d1r2a:32, T:d1r2a:33, T:a-lt:30], ver: n/a, topics: [ai-in-seo-workflows],
   text: "Before using AI-generated numbers, for example in a client meeting, always ask the AI for the receipts and the reason behind every number, because AI hallucinates; LLMs present their reasoning as a forward chain, so the user has to check it backwards, a community speaker said."}
- {id: D1-C249, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2a:37, T:d1r2a:38, T:a-lt:32, T:a-lt:33], ver: n/a, topics: [ai-in-seo-workflows, structured-data-implementation],
   text: "A community demo showed a script that opens Chrome with a saved session, pastes a URL into Google's Rich Results Test, waits about 15 seconds, then screenshots and saves the result and retries on failure (the demo's recording is largely unintelligible; the tool name is a best reading)."}
- {id: D1-C250, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2a:39, T:a-lt:36], ver: n/a, topics: [ai-in-seo-workflows, structured-data-implementation],
   text: "In a community demo, a fix loop gave a large LLM (Claude Opus) the current markup, the errors Google's test reported and Google's documentation, had it write new JSON-LD and re-ran the test, with at most three attempts; the demo's page passed on the second."}
- {id: D1-C251, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2a:38, T:a-lt:33], ver: consistent, src: [rich-results-test-help, rich-result-report-help], topics: [structured-data-implementation, rich-results],
   text: "A community demo treated warnings in Google's structured-data test as not critical, in an example result of 22 items with two errors and two warnings."}
- {id: D1-C252, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2a:36, T:d1r2a:40, T:a-lt:37], ver: n/a, topics: [ai-in-seo-workflows],
   text: "A community demo matched model size to the task: a small, cheap model (Claude Haiku) chose keywords from a page's URL, title, H1, description and schema types, while a large, expensive model (Claude Opus) fixed code and wrote the summary."}
- {id: D1-C253, s: D1-S04, label: stage, who: Kira Breuer, ev: [T:d1r2a:43, T:a-lt:40], ver: n/a, topics: [ai-in-seo-workflows, measurement],
   text: "At a community speaker's agency, monthly client reports took each SEO manager one full workday every month, contained technical errors and were not read by anyone, which led the team to automate them."}
- {id: D1-C254, s: D1-S04, label: stage, who: Kira Breuer, ev: [T:d1r2a:44, T:a-lt:41], ver: n/a, topics: [ai-in-seo-workflows],
   text: "To automate SEO reporting with AI-assisted coding, a community speaker advised against aiming for an app or a perfect dashboard: pick one repetitive task, define the smallest useful output, ask the AI what is possible, then build and debug one step at a time."}
- {id: D1-C255, s: D1-S04, label: stage, who: Kira Breuer, ev: [T:d1r2a:45, T:a-lt:42], ver: n/a, topics: [ai-in-seo-workflows, search-console-data],
   text: "A community speaker who is not a developer automated monthly SEO reports with Python in Visual Studio Code, using Claude and ChatGPT as coding partners and Google Cloud for access to the Search Console API."}
- {id: D1-C256, s: D1-S04, label: stage, who: Kira Breuer, ev: [T:d1r2a:46, T:a-lt:43], ver: n/a, topics: [ai-in-seo-workflows, measurement],
   text: "An agency's automated monthly SEO report follows four simple steps: the data comes in, a script processes it, AI summarises it and the result goes onto a dashboard."}
- {id: D1-C257, s: D1-S04, label: stage, who: Kira Breuer, ev: [T:d1r2a:47, T:a-lt:44], ver: n/a, topics: [ai-in-seo-workflows, search-console-data],
   text: "Before writing code to pull Search Console data for one property, check which data you actually need, what the API can provide and what the API costs, a community speaker advised."}
- {id: D1-C258, s: D1-S04, label: stage, who: Kira Breuer, ev: [T:d1r2a:47, T:a-lt:44], ver: consistent, src: [sc-api-prereqs], topics: [search-console-data],
   text: "Pulling Search Console data through the API required setting up a Google Cloud account to get API access, a community speaker said."}
- {id: D1-C259, s: D1-S04, label: stage, who: Kira Breuer, ev: [T:d1r2a:48, T:a-lt:45], ver: n/a, topics: [ai-in-seo-workflows],
   text: "A community speaker gave the AI a detailed description of the tech stack and requirements and started tiny, with one script, one client and one output, before having the AI write the code."}
- {id: D1-C260, s: D1-S04, label: stage, who: Kira Breuer, ev: [T:d1r2a:49, T:a-lt:46], ver: n/a, topics: [ai-in-seo-workflows],
   text: "When debugging AI-written code with AI, always read the code and understand what went wrong, so you can fix it yourself next time, a community speaker advised.",
   quote: "Don't trust it blindly, and try to understand what is happening in your code", quote_checked: true}
- {id: D1-C261, s: D1-S04, label: stage, who: Kira Breuer, ev: [T:d1r2a:50, T:a-lt:47], ver: n/a, topics: [ai-in-seo-workflows, measurement],
   text: "A good AI summary in an automated SEO report needs cleaned, good-quality data, a clear definition of what is wanted and a detailed, explicit prompt, a community speaker said."}
- {id: D1-C262, s: D1-S04, label: stage, who: Kira Breuer, ev: [T:d1r2a:51, T:a-lt:48], ver: n/a, topics: [ai-in-seo-workflows, search-console-data],
   text: "The resulting monthly report showed Search Console data on one side and an AI-written summary of what happened that month on the other; an in-house AI specialist built the dashboard from the SEO manager's code."}
- {id: D1-C263, s: D1-S04, label: stage, who: Kira Breuer, ev: [T:d1r2a:52, T:a-lt:49], ver: n/a, topics: [ai-in-seo-workflows],
   text: "To start automating SEO work with AI, a community speaker said you need no expertise, only one painful task, a clear outcome and the patience to iterate.",
   quote: "you don't need to be an expert; you just need to try.", quote_checked: true}
- {id: D1-C264, s: D1-S04, label: docs, ev: "", ver: source, src: [sc-impressions-help], topics: [search-console-data],
   text: "Search Console Help defines position as the position of a link on Google, where 1 is the topmost position, and says the Performance report shows the topmost position a property's link occupied, averaged across all queries."}
- {id: D1-C265, s: D1-S04, label: docs, ev: "", ver: source, src: [rich-result-report-help, rich-results-test-help], topics: [structured-data-implementation, rich-results],
   text: "Search Console Help separates critical issues, which make a structured-data item invalid and stop it from appearing as a rich result, from non-critical issues, listed under 'Improve item appearance'; the Rich Results Test reports valid items that have warnings."}
- {id: D1-C266, s: D1-S04, label: docs, ev: "", ver: source, src: [sc-api-prereqs], topics: [search-console-data],
   text: "To use the Search Console API you need a Google Account with Search Console permission on the property, a project in the Google API Console and OAuth2 credentials (all Search Console APIs except the Testing Tools API need OAuth2)."}
- {id: D1-C267, s: D1-S04, label: docs, ev: "", ver: source, src: [sc-api-pricing], topics: [search-console-data],
   text: "Google states that all use of the Search Console API is free of charge but subject to usage limits."}
- {id: D1-C268, s: D1-S04, label: analysis, ev: "", ver: n/a, topics: [search-console-data, ai-in-seo-workflows],
   text: "Author's view: the Search Console API itself costs nothing, so the cost check advised on stage before automating reports is about the API's usage limits and the paid parts of the pipeline, such as storage and AI model calls."}
- {id: D1-C269, s: D1-S04, label: analysis, ev: "", ver: n/a, topics: [structured-data-implementation, ai-in-seo-workflows],
   text: "Author's view: an LLM fix loop that stops when Google's test passes proves only that the JSON-LD is valid, not that its values are true; Google's generative AI content guidance asks for AI-generated structured data to be fact-checked as well as validated."}
- {id: D1-C270, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:1, T:a-lt:50], ver: n/a, topics: [ai-crawlers-and-agents],
   text: "A community speaker framed the web as now visited by both humans and AI agents, so sites have to be prepared for both."}
- {id: D1-C271, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:2, T:a-lt:51], ver: consistent, src: [ai-optimization-guide], topics: [llms-txt],
   rel: [{type: repeats, to: D1-C054}, {type: extends, to: D1-C060}],
   text: "A community speaker said llms.txt files are not necessary, citing a third-party study from summer 2026 (heard as Ahrefs') that looked at almost 40,000 sites over one month: 97% had no AI agent hits on the file, and those that had any got about two hits a month."}
- {id: D1-C272, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:3, T:a-lt:52], ver: consistent, src: [ai-optimization-guide], topics: [llms-txt, ai-crawlers-and-agents, duplicate-content],
   text: "A community speaker advised against publishing markdown copies of HTML pages for AI agents: the copy is a duplicate (which the speaker also called a possible source of cloaking, an uncertain word in the recordings), and the models are trained to read HTML, CSS and JavaScript."}
- {id: D1-C273, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:4, T:a-lt:53], ver: confirmed, src: [user-triggered-fetchers], topics: [ai-crawlers-and-agents, robots-txt],
   text: "A community speaker pointed out that, according to Google's documentation, user-triggered fetchers, which fetch a page because a user asked for it, generally ignore robots.txt rules."}
- {id: D1-C274, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:5, T:a-lt:54], ver: confirmed, src: [ai-optimization-guide], topics: [ai-crawlers-and-agents, accessibility],
   rel: [{type: repeats, to: D1-C131}],
   text: "A community speaker said AI agents understand a page through a combination of three inputs: a screenshot, the DOM (the HTML plus the changes rendered by JavaScript) and the accessibility tree."}
- {id: D1-C275, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:6, T:a-lt:55], ver: consistent, src: [core-web-vitals], topics: [ai-crawlers-and-agents],
   text: "A community speaker said layout shifts, such as a button or image popping in after the first load, annoy users and may confuse AI agents, and recommended watching Cumulative Layout Shift (CLS), the Core Web Vitals metric for visual stability."}
- {id: D1-C276, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:7, T:a-lt:56], ver: undocumented, topics: [structured-data, ai-crawlers-and-agents],
   text: "A community speaker said schema markup helps AI agents interpret a page: on a product page, marking up which number is the price saves the agent from guessing."}
- {id: D1-C277, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:8, T:a-lt:57], ver: consistent, src: [web-dev-content-structure], topics: [accessibility, ai-crawlers-and-agents, main-content],
   text: "A community speaker advised keeping headings inside the main content in a logical hierarchy (title, section subtitles, subsections) so agents can follow its structure, avoiding several H1 elements and skipped levels such as an H3 followed directly by an H5."}
- {id: D1-C278, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:9, T:a-lt:58], ver: consistent, src: [ai-optimization-guide, web-dev-content-structure], topics: [accessibility, ai-crawlers-and-agents],
   rel: [{type: extends, to: D1-C131}],
   text: "A community speaker said a block of content without semantic HTML or landmarks is just a div whose purpose an agent cannot tell, and recommended landmark elements (header, nav, main, article for independent sections, footer) plus p and h1-h6 for text."}
- {id: D1-C279, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:10, T:a-lt:59], ver: confirmed, src: [web-dev-aria-html], topics: [accessibility, ai-crawlers-and-agents],
   rel: [{type: extends, to: D1-C118}],
   text: "A community speaker described ARIA (Accessible Rich Internet Applications) as a set of attributes, not a programming language, that adds accessibility information to HTML: a div used as an 'add to favourites' button can get role=button, an aria-label and aria-pressed set to true or false."}
- {id: D1-C280, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:11, T:a-lt:60], ver: consistent, src: [web-dev-aria-html], topics: [accessibility],
   text: "A community speaker warned that no ARIA is better than bad ARIA: wrong or confusing ARIA attributes do more harm than leaving them out."}
- {id: D1-C281, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:13, T:a-lt:62], ver: confirmed, src: [webmcp], topics: [ai-crawlers-and-agents, web-standards],
   text: "A community speaker presented WebMCP (Web Model Context Protocol) as a way for a site to declare the actions it offers to AI agents, for example booking an appointment in a calendar, so an agent does not have to scrape the interface; the speaker called it faster, easier and cheaper."}
- {id: D1-C282, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:12, T:a-lt:61], ver: confirmed, src: [webmcp], topics: [web-standards, ai-crawlers-and-agents],
   text: "A community speaker said that at the time of the event (30 September 2026) WebMCP was not supported by all browsers but could be enabled for testing through browser flags."}
- {id: D1-C283, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:14, T:a-lt:63], ver: confirmed, src: [webmcp], topics: [web-standards, ai-crawlers-and-agents],
   text: "A community speaker said WebMCP has two kinds of tools: declarative ones, mostly HTML annotations such as the fields of a contact form, and imperative ones for other actions such as booking, filtering a catalogue, adding products to a cart, getting product specs or reordering."}
- {id: D1-C284, s: D1-S04, label: stage, who: Carlos Ortega, ev: [T:d1r2b:15, T:a-lt:64], ver: n/a, topics: [ai-crawlers-and-agents, accessibility],
   text: "A community speaker summed up agent readiness in three layers: a good CLS improves how agents see content, schema, landmarks and ARIA how they understand it, and WebMCP how they interact with it."}
- {id: D1-C285, s: D1-S04, label: stage, who: Thiago Pojda, ev: [T:d1r2b:17, T:d1r2b:18, T:a-lt:66, T:a-lt:67], ver: n/a, topics: [helpful-content, seo-scope],
   text: "A community speaker contrasted real audience understanding (reading logs, tracking how the brand is mentioned and perceived, letting customer complaints change pricing pages and products) with keyword-tool research that turns People Also Ask questions into H2s and blog posts."}
- {id: D1-C286, s: D1-S04, label: stage, who: Thiago Pojda, ev: [T:d1r2b:19, T:a-lt:68], ver: n/a, topics: [measurement, seo-scope],
   text: "A community speaker said the SEO industry turned everything into a metric because budgets are approved on numbers, not ideas.",
   quote: "an idea doesn't get you budget approval; a number does.", quote_checked: true}
- {id: D1-C287, s: D1-S04, label: stage, who: Thiago Pojda, ev: [T:d1r2b:20, T:a-lt:69], ver: n/a, topics: [seo-scope, seo-vs-geo],
   text: "A community speaker said not all SEO work was wrong: a site still has to be crawlable and visible before it is even considered, and much of that work is plumbing, not gaming.",
   quote: "There's a lot of plumbing that's not gaming."}
- {id: D1-C288, s: D1-S04, label: stage, who: Thiago Pojda, ev: [T:d1r2b:21, T:a-lt:70], ver: n/a, topics: [measurement, seo-scope],
   text: "A community speaker said Google's AMP project, meant to get people building fast websites and addressed directly to engineers and marketers, was smart, but the industry reduced it to a metric and a checklist ('now I have an AMP website')."}
- {id: D1-C289, s: D1-S04, label: stage, who: Thiago Pojda, ev: [T:d1r2b:22, T:a-lt:71], ver: undocumented, topics: [structured-data, measuring-ai-visibility],
   text: "A community speaker said a third-party study from early 2026 found that websites with JSON-LD were shown much more often, and that the industry reacted by adding schema markup everywhere."}
- {id: D1-C290, s: D1-S04, label: stage, who: Thiago Pojda, ev: [T:d1r2b:23, T:a-lt:71], ver: undocumented, topics: [structured-data, measuring-ai-visibility],
   text: "A community speaker said a later controlled study, which added schema markup to pages that lacked it and kept everything else unchanged, found only a negative correlation: the markup had been a sign of teams doing everything else right, not a cause."}
- {id: D1-C291, s: D1-S04, label: stage, who: Thiago Pojda, ev: [T:d1r2b:24, T:a-lt:72], ver: n/a, topics: [measuring-ai-visibility],
   text: "A community speaker said listicles do earn more mentions in AI answers, not because they are trusted more but because LLMs mainly check that the thing being talked about exists, not whether the content is honest."}
- {id: D1-C292, s: D1-S04, label: stage, who: Thiago Pojda, ev: [T:d1r2b:24, T:a-lt:72], ver: n/a, topics: [measuring-ai-visibility, query-fanout, helpful-content],
   text: "A community speaker suggested that LLMs pick up some of Google's years of work on judging honesty and trust (E-E-A-T) by proxy, because they send many queries (probably fan-out queries) to search engines."}
- {id: D1-C293, s: D1-S04, label: stage, who: Thiago Pojda, ev: [T:d1r2b:24, T:a-lt:72], ver: n/a, topics: [measuring-ai-visibility, spam-policies],
   text: "A community speaker warned that the SEO industry is overusing listicles for AI visibility the way it once overused links."}
- {id: D1-C294, s: D1-S04, label: stage, who: Thiago Pojda, ev: [T:d1r2b:25, T:a-lt:73], ver: undocumented, topics: [query-fanout, localisation, measuring-ai-visibility],
   text: "A community speaker cited a third-party study (heard as Peec AI's) finding that 43% of prompts produced fan-out queries in a language other than the one the user searched in."}
- {id: D1-C295, s: D1-S04, label: stage, who: Thiago Pojda, ev: [T:d1r2b:25, T:a-lt:73], ver: undocumented, topics: [query-fanout, localisation],
   text: "A community speaker showed a Spanish-language AI prompt about places to eat in Barcelona whose fan-out queries were all in English, so the content used to answer may be written by and for a different audience than the one asking."}
- {id: D1-C296, s: D1-S04, label: stage, who: Thiago Pojda, ev: [T:d1r2b:26, T:a-lt:74], ver: n/a, topics: [seo-vs-geo],
   rel: [{type: contradicts, to: D1-C049}, {type: contradicts, to: D1-C050}],
   text: "A community speaker argued for adopting the GEO label as the industry's chance to leave behind the bad reputation SEO built, unlike Google's view earlier the same day that the new name is not needed."}
- {id: D1-C297, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:27, T:a-lt:76], ver: n/a, topics: [search-evolution, measuring-ai-visibility],
   text: "A community speaker compared traditional search to walking into a store and searching the shelves yourself, and AI search to asking a sales assistant who searches, selects, summarises and presents the answer for you."}
- {id: D1-C298, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:28, T:a-lt:77], ver: n/a, topics: [measuring-ai-visibility, measurement],
   text: "A community speaker said most AI-visibility tracking copies rank tracking and is worse than it, because it tracks invented prompts with no known search volume."}
- {id: D1-C299, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:29, T:d1r2b:39, T:a-lt:78, T:a-lt:86], ver: n/a, topics: [measuring-ai-visibility, measurement],
   text: "A community speaker proposed measuring AI search as a five-stage funnel (know, association, search, retrieval, selection) to learn whether the AI understands, trusts and finally chooses a brand, measuring the earlier stages rather than only the last."}
- {id: D1-C300, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:29, T:a-lt:78], ver: n/a, topics: [measuring-ai-visibility],
   text: "A community speaker said most AI-visibility measurement covers only the selection stage, whether a brand is mentioned or selected, without showing why or why not."}
- {id: D1-C301, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:30, T:a-lt:79], ver: n/a, topics: [measuring-ai-visibility, gemini-and-search],
   text: "A community speaker named two signals that in their view strongly influence whether an AI selects a brand: the bias already in the model's memory before it searches, and the brand's presence in the search results the model is grounded on."}
- {id: D1-C302, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:31, T:a-lt:80], ver: n/a, topics: [measuring-ai-visibility, ai-crawlers-and-agents],
   text: "A community speaker proposed an 'AI bot allow rate' for the know stage: the share of AI training bots a site allows (three of four is 75%), with 100% as the target."}
- {id: D1-C303, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:31, T:a-lt:80], ver: n/a, topics: [genai-optout, ai-crawlers-and-agents],
   text: "A community speaker advised not blocking AI training bots in most cases, because a model that may not crawl a site finds it harder to represent the brand accurately in its parametric memory."}
- {id: D1-C304, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:32, T:a-lt:81], ver: n/a, topics: [measuring-ai-visibility],
   text: "A community speaker described the association stage as whether an AI already connects a brand with the topics that matter to it before running any search, and said problems there are mostly brand problems."}
- {id: D1-C305, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:33, T:a-lt:82], ver: n/a, topics: [measuring-ai-visibility],
   text: "A community speaker's 'brand association rate' asks a model, with web browsing switched off so that only its memory answers, to name ten topics it associates with the brand, or the other way round, starting from a topic."}
- {id: D1-C306, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:34, T:a-lt:83], ver: n/a, topics: [measuring-ai-visibility],
   text: "A community speaker advised repeating brand-association prompts over time: association in every run is good, in about half the runs shows some association with work to do, and little or none shows a clear gap."}
- {id: D1-C307, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:35, T:a-lt:84], ver: n/a, topics: [measuring-ai-visibility, query-fanout],
   text: "A community speaker proposed a 'brand co-occurrence rate' for the search stage: the share of an AI's fan-out queries that contain the brand (one in three is 33%), which also hints at the associations the model already has; problems there are mostly relevance problems."}
- {id: D1-C308, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:36, T:a-lt:84], ver: undocumented, topics: [measuring-ai-visibility, query-fanout],
   text: "A community speaker said Microsoft is ahead of Google in giving site owners the grounding queries its AI uses."}
- {id: D1-C309, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:37, T:a-lt:85], ver: n/a, topics: [measuring-ai-visibility, crawl-errors, indexing-pipeline],
   text: "A community speaker described the retrieval stage as whether an AI requests a site's pages when grounding its answer; if it does not, the cause may be a crawling or an indexing issue."}
- {id: D1-C310, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:38, T:a-lt:86], ver: n/a, topics: [measuring-ai-visibility],
   text: "A community speaker described the selection stage as whether a brand is chosen in the answer, measured with mentions and similar metrics; failure there is mostly a trust or relevance issue."}
- {id: D1-C311, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:40, T:a-lt:87], ver: n/a, topics: [ai-in-seo-workflows],
   text: "Closing the lightning talks on automation and AI, one of the session's Google hosts called AI a tool that can be used well or badly: it can even be used for content generation, which none of the talks featured, and it is fantastic for coding and analysis but less so for other tasks."}
- {id: D1-C312, s: D1-S04, label: stage, who: unknown, ev: [T:d1r2b:40, T:a-lt:87], ver: n/a, topics: [ai-in-seo-workflows, helpful-content],
   text: "One of the Google hosts of the AI lightning talks advised always checking what AI tools do and focusing on what the business and its users need."}
- {id: D1-C313, s: D1-S04, label: docs, ev: [T:d1r2b:8, T:a-lt:57], ver: source, src: [seo-starter-guide], topics: [accessibility, main-content],
   text: "Google's SEO Starter Guide says headings in semantic order help screen readers but do not matter to Google Search if used out of order, and that there is no ideal number of headings for a page."}
- {id: D1-C314, s: D1-S04, label: analysis, ev: [T:d1r2b:8, T:a-lt:57], ver: n/a, topics: [accessibility, ai-crawlers-and-agents, main-content],
   rel: [{type: extends, to: D1-C277}],
   text: "A logical heading hierarchy is not a Google Search requirement, since Google says out-of-order headings do not matter to Search; the case for it is accessibility, where web.dev advises against skipping levels, and agents that read the accessibility tree."}
- {id: D1-C315, s: D1-S04, label: analysis, ev: [T:d1r2b:7, T:d1r2b:22, T:d1r2b:23, T:a-lt:56, T:a-lt:71], ver: n/a, topics: [structured-data, measuring-ai-visibility, ai-crawlers-and-agents],
   rel: [{type: extends, to: D1-C276}],
   text: "Google's AI optimisation guide says structured data is not required for generative AI search and needs no special schema.org markup, and on Day 2 Google said raw schema.org is generally not put into model context (D2-C477); use markup for rich-result eligibility and clear data, not as an AI-visibility lever."}
- {id: D1-C316, s: D1-S04, label: docs, ev: [T:d1r2b:12, T:a-lt:61], ver: source, src: [webmcp], topics: [web-standards, ai-crawlers-and-agents],
   rel: [{type: extends, to: D1-C282}],
   text: "Chrome's WebMCP documentation describes WebMCP as a proposed web standard that site owners can test through an origin trial starting in Chrome 149 or through a Chrome flag for local development."}
# ----- From the real audio recordings (added in v2.7.0) -----
- {id: D1-C500, s: D1-S04, label: stage, who: Rafael Kovashikawa, ev: T:a-lt:24, ver: n/a, topics: [ai-in-seo-workflows],
   rel: [{type: extends, to: D1-C242}],
   text: "A community speaker applied Pascal's line about makers of false windows built for symmetry, whose rule is to make pleasing figures rather than to speak accurately, to today's LLMs: sometimes they are not trying to produce the most accurate figures or the most accurate interpretations of them."}
- {id: D1-C501, s: D1-S04, label: stage, who: unknown, ev: T:a-lt:32, ver: consistent, src: [rich-results-test-help], topics: [structured-data-implementation, rich-results, ai-in-seo-workflows],
   rel: [{type: extends, to: D1-C249}],
   text: "A community demo's script used both input modes of Google's Rich Results Test: the URL mode for public pages, which Google fetches itself, and the code mode, into which the script pasted the page's HTML, for private pages and pages Google cannot fetch (best reading of a largely unintelligible recording; the second kind of page was heard as 'dead', possibly 'dev')."}
- {id: D1-C502, s: D1-S04, label: stage, who: unknown, ev: T:a-lt:34, ver: consistent, src: [rich-results-test-help, merchant-listing-sd], topics: [structured-data-implementation, rich-results],
   rel: [{type: extends, to: D1-C251}],
   text: "In a community demo, the structured-data problems Google's Rich Results Test reported on the test page included an empty name, a breadcrumb problem and a price of zero, with errors shown in pink and warnings in orange (best readings of a largely unintelligible recording; each item is heard in only one of the two recordings)."}
- {id: D1-C503, s: D1-S04, label: stage, who: unknown, ev: T:a-lt:37, ver: n/a, topics: [ai-in-seo-workflows],
   rel: [{type: extends, to: D1-C252}],
   text: "In a community demo, the small model choosing keywords (Claude Haiku) followed fixed rules, no brand terms, no navigation terms and at most two keywords per page; the Spanish example was 'zapatos de mujer' and 'comprar zapatos de mujer' (women's shoes, buy women's shoes)."}
- {id: D1-C504, s: D1-S04, label: analysis, ev: T:a-lt:73, ver: n/a, src: [peec-ai-chatgpt-english-fanouts, sej-peec-ai-english-fanouts], topics: [query-fanout, localisation, measuring-ai-visibility],
   rel: [{type: extends, to: D1-C294}],
   text: "The study cited on stage matches Peec AI's analysis (reported in February 2026) of over 10 million ChatGPT prompts and 20 million fan-outs: 43% of the fan-out searches for non-English prompts ran in English, and nearly 78% of non-English prompt runs had at least one English fan-out (from 66% for Spanish to 94% for Turkish), so the 43% is a share of fan-out searches, not of prompts."}
- {id: D1-C505, s: D1-S04, label: analysis, ev: T:a-lt:51, ver: n/a, src: [ahrefs-llmstxt-study], topics: [llms-txt],
   rel: [{type: extends, to: D1-C271}],
   text: "The llms.txt study cited on stage matches Ahrefs' June 2026 study of 137,210 domains: 28% (about 38,000, the 'almost 40,000' sites heard on stage) published an llms.txt file and 97% of those files received no requests at all in May 2026; the files that were fetched got about 22,000 requests across some 1,100 domains, around 20 each, not the 'two hits a month' heard on stage."}
- {id: D1-C506, s: D1-S04, label: docs, ev: "", ver: source, src: [rich-results-test-help], topics: [structured-data-implementation, rich-results],
   rel: [{type: extends, to: D1-C249}],
   text: "Google's Rich Results Test help says the tool tests either a page's full URL or a pasted code snippet (Code instead of URL); all page resources must be reachable by an anonymous user on the internet, so resources behind a firewall or a password are not available to the test unless exposed, for example through a tunnel."}
- {id: D1-C507, s: D1-S04, label: docs, ev: "", ver: source, src: [merchant-listing-sd], topics: [merchant-markup, structured-data-implementation],
   text: "Google's merchant listing documentation lists the product name as a required property and, unlike product snippets, requires a price greater than zero for merchant listing experiences."}

# ---------- D1-S05 How crawling works ----------
- {id: D1-C063, s: D1-S05, label: slide, who: Gary Illyes, ev: ["IMG_4659, IMG_4660, IMG_4662", T:d1r2c:15, T:d1r2c:21, T:a-cg:2, T:a-cg:8], ver: consistent, src: [how-search-works, crawl-budget-guide], topics: [crawl-pipeline],
   text: "The crawl pipeline runs from a crawl queue to a scheduler to the crawler, which fetches from the internet and passes the fetch reply to indexing."}
- {id: D1-C064, s: D1-S05, label: slide, who: Gary Illyes, ev: [IMG_4660, T:d1r2c:16, T:d1r2c:17, T:d1r2c:18, T:a-cg:3, T:a-cg:4, T:a-cg:5], ver: consistent, src: [how-search-works, crawlers-overview], topics: [crawl-pipeline, robots-txt],
   text: "The crawler has multiple tasks: fetch from the internet, ensure it doesn't break the internet, and enforce robots.txt policies. Fetched data is sent for indexing.",
   quote: "Ensure we don't break the internet", quote_checked: true}
- {id: D1-C065, s: D1-S05, label: slide, who: Gary Illyes, ev: [IMG_4662, T:d1r2c:19, T:d1r2c:22, T:a-cg:6, T:a-cg:9], ver: consistent, src: [crawling-infrastructure, crawl-budget-guide], topics: [crawl-pipeline],
   text: "The scheduler is shared infrastructure that decides what to fetch and when and sends URLs to the crawler. Each team decides the scheduling parameters for its own user agents."}
- {id: D1-C066, s: D1-S10, label: slide, ev: [IMG_4668, T:d1r3a:4], ver: consistent, src: [crawling-infrastructure, crawl-budget-guide], topics: [crawl-pipeline, crawl-rate-limit],
   rel: [{type: extends, to: D1-C326}],
   text: "Google Search, Ads, Shopping and Images all request through one centralised crawling infrastructure, whose primary mandate is to fetch from the internet while strictly preventing the overloading of external servers."}
- {id: D1-C067, s: D1-S05, label: analysis, ev: "", ver: n/a, topics: [url-discovery, crawl-demand],
   text: "A page with no internal links depends on sitemaps alone to be found, so it is discovered slowly and attracts little crawl demand."}
- {id: D1-C068, s: D1-S10, label: analysis, ev: "", ver: n/a, src: [crawl-budget-guide], topics: [crawl-rate-limit, crawl-pipeline],
   text: "Because every Google product shares the same host capacity, Ads or Shopping fetches that hit a slow server can reduce how much is crawled for Search."}
- {id: D1-C136, s: D1-S05, label: docs, ev: "", ver: source, src: [inside-googlebot-blog], topics: [crawl-pipeline],
   text: "Google's Inside Googlebot post (March 2026) says Googlebot currently fetches only the first 2MB of each URL, HTTP headers included (64MB for PDFs); bytes past that cutoff are not fetched, rendered or indexed, and each resource the page loads has its own separate limit."}
- {id: D1-C137, s: D1-S05, label: docs, ev: "", ver: source, src: [inside-googlebot-blog], topics: [crawl-pipeline, rendering],
   text: "Google's Inside Googlebot post warns that bloated inline base64 images, large blocks of inline CSS or JavaScript, or megabytes of menus can push a page's text or structured data past Googlebot's 2MB cutoff, and advises moving heavy CSS and JavaScript to external files and placing meta tags, the title, the canonical and essential structured data high in the HTML."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D1-C317, s: D1-S05, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:1, T:a-lt:88, T:a-lt:91], ver: n/a, topics: [crawl-pipeline, http-protocols],
   text: "Google's crawling talk opened with how the internet works (TCP/IP, internet service providers, IP addresses, URLs, DNS and HTTP), because crawling can only be understood with that wider scope."}
- {id: D1-C318, s: D1-S05, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:5, T:a-lt:92], ver: undocumented, topics: [http-protocols],
   text: "A URL states how a resource is requested (the protocol, HTTP or HTTPS), where (the host, meaning which computer on the network) and what (the path to the exact page or file)."}
- {id: D1-C319, s: D1-S05, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:6, T:a-lt:93], ver: consistent, src: [dns-network-errors], topics: [http-protocols, crawl-errors],
   text: "DNS works as the internet's address book: it is consulted for each request and tells the client at which IP address a host name can be reached."}
- {id: D1-C320, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:9, T:a-lt:96], ver: consistent, src: [http-network-errors], topics: [crawl-errors, soft-404],
   text: "An HTTP 200 OK status only means that the server believes it managed to do what the client asked for.",
   quote: "just means that the server believes that it managed to accomplish whatever the user was asking for", quote_checked: true}
- {id: D1-C321, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:10, T:a-lt:97], ver: consistent, src: [crawlers-overview], topics: [http-caching],
   text: "Gary Illyes pointed to the Last-Modified and ETag headers as the fields of an HTTP response that matter for caching."}
- {id: D1-C322, s: D1-S05, label: stage, who: Gary Illyes, ev: T:d1r2c:12, ver: consistent, src: [inside-googlebot-blog, how-search-works], topics: [crawl-pipeline],
   text: "Googlebot is an ordinary HTTP client with nothing special about it: like a browser, it fetches a URL it was given and returns the fetched bytes to Google's servers.",
   quote: "Googlebot is just a client. It is an HTTP client. There's nothing all that much special about it."}
- {id: D1-C323, s: D1-S05, label: stage, who: Gary Illyes, ev: T:d1r2c:12, ver: undocumented, topics: [ai-crawlers-and-agents],
   text: "AI agents are, technically, the same thing as crawlers: HTTP clients that accomplish something on behalf of a user or a service."}
- {id: D1-C324, s: D1-S05, label: stage, who: Gary Illyes, ev: T:d1r2c:13, ver: undocumented, topics: [crawl-pipeline, ai-crawlers-and-agents],
   text: "Google runs probably hundreds, if not thousands, of crawlers on its crawler infrastructure; some of them are named and some are not."}
- {id: D1-C325, s: D1-S05, label: stage, who: Gary Illyes, ev: T:d1r2c:13, ver: consistent, src: [common-crawlers, crawling-infrastructure], topics: [crawl-pipeline, ai-crawlers-and-agents],
   rel: [{type: extends, to: D1-C038}],
   text: "Googlebot is the crawler Google uses for web search, including Search's AI features."}
- {id: D1-C326, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:13, T:d1r2c:14, T:a-cg:1], ver: consistent, src: [crawling-infrastructure, inside-googlebot-blog], topics: [crawl-pipeline],
   text: "Google does not let each team build its own crawler: its many crawlers share one crawler infrastructure, because every crawler must accomplish a few specific tasks and obey Google's internal crawling policies."}
- {id: D1-C327, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:15, T:a-cg:2], ver: n/a, topics: [crawl-pipeline],
   text: "Google said it does not usually talk publicly about crawl components such as the scheduler and the crawl queue, because the details get confusing and taken out of context."}
- {id: D1-C328, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:18, T:a-cg:5], ver: consistent, src: [how-search-works], topics: [url-discovery, crawl-pipeline],
   text: "During indexing Google extracts the URLs found in fetched content and passes them back to the crawler and the scheduler to be crawled."}
- {id: D1-C329, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:17, T:a-cg:4], ver: consistent, src: [common-crawlers, special-case-crawlers], topics: [robots-txt],
   text: "Apart from contractual crawlers, all of Google's automated crawlers obey robots.txt, which Google treats as the way site owners opt out of its crawling."}
- {id: D1-C330, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:17, T:a-cg:4], ver: consistent, src: [special-case-crawlers, crawlers-overview], topics: [robots-txt, ai-crawlers-and-agents],
   text: "The only Google-owned crawlers that do not obey robots.txt are contractual crawlers, which crawl a site whose owner has agreed that Google may crawl it however it likes."}
- {id: D1-C331, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:19, T:a-cg:6], ver: consistent, src: [crawl-budget-guide], topics: [crawl-demand, spam-detection],
   text: "Google's crawl scheduler very likely deprioritises a URL when the URL or its site is known to be historically spammy."}
- {id: D1-C332, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:20, T:a-cg:7], ver: consistent, src: [crawl-budget-guide], topics: [crawl-demand],
   text: "The crawl scheduler logs how often each page changes and crawls frequently changing pages first: a news site's homepage, which changes very often, is prioritised over its terms of service page, which may change once a year."}
- {id: D1-C333, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:21, T:a-cg:8], ver: undocumented, topics: [crawl-pipeline],
   text: "The scheduler hands the crawler an ordered list of URLs from the crawl queue, and the crawler works through the list from top to bottom."}
- {id: D1-C334, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:22, T:a-cg:9], ver: consistent, src: [crawl-budget-guide], topics: [crawl-pipeline, crawl-demand],
   text: "Different Google teams prioritise crawling differently: web search cares a lot about the quality of a site and its content, while Ads wants to check every publisher page that wants to appear in Google Ads, so it schedules those URLs as they come in."}
- {id: D1-C335, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:23, T:a-cg:10], ver: undocumented, topics: [gemini-and-search, ai-crawlers-and-agents],
   rel: [{type: extends, to: D1-C039}],
   text: "Crawling for Gemini may be set to care less about quality and more about the amount of content, because for large language models the number of tokens matters more than quality.",
   quote: "the number of tokens is actually more important", quote_checked: true}
- {id: D1-C336, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:24, T:a-cg:11], ver: confirmed, src: [how-search-works, sitemaps-overview], topics: [url-discovery, sitemaps],
   rel: [{type: extends, to: D1-C040}],
   text: "Google finds what to crawl mainly by extracting URLs from previously crawled pages, and additionally from sitemaps."}
- {id: D1-C337, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:24, T:a-cg:11], ver: consistent, src: [sitemaps-overview, html-sitemap-blog], topics: [sitemaps],
   text: "An XML sitemap, a format from around 2005, gives Google, other search engines and potentially AI systems a list of the URLs a site wants crawled; Google called it nothing fancy but said it still uses sitemaps."}
- {id: D1-C338, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:25, T:a-cg:12], ver: undocumented, topics: [crawl-pipeline],
   text: "Google described its crawling as a large-scale distributed swarm of simple HTTP clients, roughly what one would get by deploying many wget or curl libraries on cloud compute instances.",
   quote: "a large-scale distributed swarm of simple HTTP clients", quote_checked: true}
- {id: D1-C339, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:26, T:a-cg:13], ver: confirmed, src: [crawl-stats-help], topics: [search-console-features, crawl-errors],
   text: "To debug crawl issues, Google points site owners to the Crawl Stats report in Search Console, found in the Settings page under Crawl stats."}
- {id: D1-C340, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:27, T:a-cg:14], ver: confirmed, src: [crawl-stats-help], topics: [search-console-features, crawl-errors],
   text: "Search Console's Crawl Stats report shows how much Google crawls from a site, the errors Google received, and the content types fetched by the different crawlers."}
- {id: D1-C341, s: D1-S05, label: stage, who: Gary Illyes, ev: [T:d1r2c:27, T:a-cg:14], ver: n/a, topics: [search-console-features, crawl-errors],
   text: "Gary Illyes called the Crawl Stats report the most valuable tool for debugging crawl errors, together with server logs, which he called the real thing for those who know how to read them."}
- {id: D1-C342, s: D1-S05, label: docs, ev: "", ver: source, src: [inside-googlebot-blog], topics: [crawl-pipeline, ai-crawlers-and-agents],
   text: "Google's Inside Googlebot post (March 2026) says Googlebot is today just one user of a centralized crawling platform, and that dozens of other clients, such as Google Shopping and AdSense, send their crawl requests through the same infrastructure under other crawler names, with only the larger ones documented.",
   quote: "Googlebot is just a user of something that resembles a centralized crawling platform"}
- {id: D1-C343, s: D1-S05, label: docs, ev: "", ver: source, src: [special-case-crawlers, crawlers-overview], topics: [robots-txt, ai-crawlers-and-agents],
   text: "Google's crawler documentation says special-case crawlers serve specific Google products where the crawled site and the product have an agreement about the crawl process, so they may ignore robots.txt rules; AdsBot, for example, ignores the global (*) user agent with the ad publisher's permission."}
- {id: D1-C344, s: D1-S05, label: analysis, ev: "", ver: n/a, topics: [crawl-pipeline, ai-crawlers-and-agents],
   text: "On stage Google spoke of probably hundreds, if not thousands, of crawlers, while its Inside Googlebot post speaks of dozens of other clients; both agree that only the larger crawlers are documented, so a Google user agent missing from the public lists is not proof of a fake request, and reverse DNS or Google's published IP ranges are the test."}

# ---------- D1-S06 Crawl errors ----------
- {id: D1-C069, s: D1-S06, label: stage, who: Gary Illyes, ev: [notes, T:d1r2c:44, T:d1r2c:45, T:d1r2c:47, T:a-cg:31, T:a-cg:32, T:a-cg:34], ver: consistent, src: [dns-network-errors, crawling-december-cdns], topics: [crawl-errors],
   text: "DNS issues and firewalls are blind spots: Google does not know a firewall is blocking it, it only sees that requests fail."}
- {id: D1-C126, s: D1-S06, label: docs, ev: "", ver: source, src: [dns-network-errors], topics: [crawl-errors, crawl-rate-limit],
   text: "Google treats network timeouts, connection resets and DNS errors like 5xx server errors: crawling slows down immediately, and already indexed URLs that stay unreachable are removed from Google's index within days.",
   quote: "Google treats network timeouts, connection reset, and DNS errors similarly to 5xx server errors."}
- {id: D1-C070, s: D1-S06, label: stage, who: Gary Illyes, ev: [notes, T:d1r2c:51, T:a-cg:38], ver: consistent, src: [http-network-errors, crawl-budget-guide, troubleshoot-crawling-errors], topics: [soft-404],
   text: "Soft 404s were named as a crawl problem alongside DNS and firewall issues, and described as one of the biggest problems on the internet right now for crawling and showing up in Search."}
- {id: D1-C071, s: D1-S06, label: docs, ev: "", ver: source, src: [http-network-errors], topics: [crawl-errors, crawl-rate-limit],
   text: "5xx and 429 responses prompt Google's crawlers to slow down temporarily. Already indexed URLs are preserved in the index for a while but eventually dropped.",
   quote: "already indexed URLs are preserved in the index, but eventually dropped"}
- {id: D1-C072, s: D1-S06, label: docs, ev: "", ver: source, src: [http-network-errors], topics: [crawl-errors],
   text: "4xx status codes other than 429 have no effect on crawl rate.",
   quote: "The 4xx status codes, except 429, have no effect on crawl rate."}
- {id: D1-C073, s: D1-S06, label: docs, ev: "", ver: source, src: [http-network-errors, crawl-budget-guide, troubleshoot-crawling-errors], topics: [soft-404],
   text: "A soft 404 is a page that returns a success code while its content looks like an error or an empty page. It is kept out of the index but continues to be crawled, wasting crawl budget."}
- {id: D1-C074, s: D1-S06, label: docs, ev: "", ver: source, src: [robots-spec], topics: [crawl-errors, robots-txt],
   text: "If robots.txt returns a 5xx error, Google stops crawling the site for the first 12 hours, then uses the cached copy for up to 30 days."}
- {id: D1-C078, s: D1-S06, label: analysis, ev: "", ver: n/a, topics: [crawl-errors, soft-404],
   text: "For temporary blocks return 503 or 429, never a 200 page with a captcha or error message, which becomes a soft 404 and can replace real content in the index. Verify Googlebot by reverse DNS, not by user agent."}
- {id: D1-C138, s: D1-S06, label: docs, ev: "", ver: source, src: [verify-google-requests], topics: [crawl-errors, ai-crawlers-and-agents],
   text: "Google's page on verifying its crawlers says Googlebot and Google's other common crawlers resolve to crawl-*.googlebot.com or geo-crawl-*.geo.googlebot.com host names, special-case crawlers to rate-limited-proxy-*.google.com and user-triggered fetchers to *.gae.googleusercontent.com or google-proxy-*.google.com, and it publishes each group's IP ranges as JSON files such as common-crawlers.json and special-crawlers.json."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D1-C345, s: D1-S06, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:29, T:d1r2c:30, T:a-cg:16, T:a-cg:17], ver: consistent, src: [http-network-errors], topics: [crawl-errors],
   text: "HTTP status codes fall into five classes, 1xx informational, 2xx success, 3xx redirection, 4xx client error and 5xx server error, and each class affects crawling differently."}
- {id: D1-C346, s: D1-S06, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:31, T:a-cg:18], ver: undocumented, topics: [crawl-errors],
   text: "1xx informational status codes, which only say that a request was received and more data is coming, have no meaning of their own for crawling."}
- {id: D1-C347, s: D1-S06, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:32, T:a-cg:19], ver: confirmed, src: [http-network-errors], topics: [crawl-errors],
   text: "When a crawler's request returns 200, the page, file or other resource that comes back is eligible for indexing."}
- {id: D1-C348, s: D1-S06, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:33, T:a-cg:20], ver: consistent, src: [http-network-errors], topics: [crawl-errors, soft-404],
   text: "A 204 No Content response is not eligible for indexing, because the server confirms the request but returns no content to index."}
- {id: D1-C349, s: D1-S06, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:34, T:a-cg:21], ver: confirmed, src: [http-network-errors], topics: [crawl-errors, site-moves],
   text: "Google follows 3xx redirects, permanent (301, 308) and temporary (302, 307), to the new location, and whether content gets indexed depends on what the redirect target returns."}
- {id: D1-C350, s: D1-S06, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:34, T:a-cg:21], ver: confirmed, src: [http-network-errors], topics: [http-caching],
   text: "A 304 Not Modified response tells Google's crawler that the content has not changed since its last visit."}
- {id: D1-C351, s: D1-S06, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:35, T:a-cg:22], ver: confirmed, src: [http-network-errors], topics: [crawl-errors],
   text: "404 Not Found and 410 Gone both tell Google there is nothing at the URL, so the URL is not indexable."}
- {id: D1-C352, s: D1-S06, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:36, T:a-cg:23], ver: consistent, src: [http-network-errors, page-indexing-help], topics: [crawl-errors],
   text: "A 403 response tells Google's crawler it has no permission to see the requested content, so there is nothing for Google to index."}
- {id: D1-C353, s: D1-S06, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:37, T:a-cg:24], ver: confirmed, src: [http-network-errors], topics: [crawl-errors, crawl-rate-limit],
   text: "429 Too Many Requests is the exception among 4xx codes: instead of meaning there is nothing at the URL, it tells Google's crawler to slow down, and Google slows its crawling."}
- {id: D1-C354, s: D1-S06, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:37, T:d1r2c:40, T:a-cg:24, T:a-cg:27], ver: confirmed, src: [http-network-errors, how-search-works], topics: [crawl-errors, crawl-rate-limit],
   text: "Google slows crawling when a site returns 5xx errors, because a 5xx usually means the server, and often the whole site, cannot serve requests, and Google does not want to break the site."}
- {id: D1-C355, s: D1-S06, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:38, T:a-cg:25], ver: confirmed, src: [page-indexing-help, http-network-errors], topics: [soft-404],
   text: "A soft 404 is a 404 in disguise: the page returns 200 but its content says something like 'page not found', information the site should have sent as the HTTP status."}
- {id: D1-C356, s: D1-S06, label: stage, who: Cherry Prommawin, ev: [T:d1r2c:39, T:a-cg:26], ver: consistent, src: [crawl-budget-guide, http-network-errors], topics: [soft-404, crawl-budget],
   text: "Soft 404 pages are still crawled like normal pages; their bigger consequences are for indexing, and they also affect crawling."}
- {id: D1-C357, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:d1r2c:41, T:a-cg:28], ver: n/a, topics: [crawl-errors],
   text: "Gary Illyes called DNS and network errors a very common issue on the internet nowadays, and DNS problems very pesky to debug."}
- {id: D1-C358, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:d1r2c:42, T:a-cg:29], ver: consistent, src: [dns-network-errors, crawl-stats-help], topics: [crawl-errors],
   text: "DNS errors get a site removed from Google Search very aggressively, and Search Console alerts site owners to them."}
- {id: D1-C359, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:d1r2c:43, T:d1r2c:44, T:a-cg:30, T:a-cg:31], ver: undocumented, topics: [crawl-errors],
   rel: [{type: extends, to: D1-C069}],
   text: "Most network errors happen somewhere between the site's origin server and Google's data centers, where they are invisible to both Google and the site owner; the way TCP networks work leaves no way to see what went wrong there."}
- {id: D1-C360, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:d1r2c:44, T:a-cg:31], ver: consistent, src: [dns-network-errors], topics: [crawl-errors],
   text: "When Search Console reports network errors, the first step Google recommends is to ask the hosting provider, or the CDN, whether they changed anything."}
- {id: D1-C361, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:d1r2c:45, T:a-cg:32], ver: consistent, src: [dns-network-errors, crawling-december-cdns], topics: [crawl-errors],
   text: "Network timeouts are usually caused close to the site, very often by a firewall, a CDN, the hosting provider or the DNS provider, and Google has no visibility into them."}
- {id: D1-C362, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:d1r2c:46, T:a-cg:33], ver: consistent, src: [dns-network-errors, crawling-december-cdns], topics: [crawl-errors],
   text: "Network errors and timeouts, like DNS errors, can get a site removed from Google Search and, with it, from every feature that depends on Search."}
- {id: D1-C363, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:d1r2c:47, T:a-cg:34], ver: consistent, src: [dns-network-errors, crawling-december-cdns], topics: [crawl-errors],
   text: "For DNS and network errors caused by a firewall or CDN, Google advises checking whether new firewall rules were set recently and otherwise asking in the CDN's forum, as Google itself cannot see or help with these errors."}
- {id: D1-C364, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:d1r2c:48, T:a-cg:35], ver: consistent, src: [crawling-december-cdns], topics: [crawl-errors, crawl-rate-limit],
   text: "A rise in HTTP errors in crawl reports can come from a CDN throttling crawlers by injecting 429 or 503 responses on the network path between Google's crawler and the site."}
- {id: D1-C365, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:d1r2c:49, T:a-cg:36], ver: consistent, src: [http-network-errors, page-indexing-help], topics: [crawl-errors, ai-crawlers-and-agents],
   text: "Google has recently seen more 403 responses to its crawlers (described on stage as 'authentication required'); it treats them as client errors, technically equivalent to 404 or 410, and drops those pages from Search and its AI features."}
- {id: D1-C366, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:d1r2c:50, T:a-cg:37], ver: consistent, src: [http-network-errors], topics: [crawl-errors, ai-crawlers-and-agents],
   text: "Google treats a 402 Payment Required response as a 404 Not Found, because Googlebot cannot pay for content.",
   quote: "402 will just mean 404 to us", quote_checked: true}
- {id: D1-C367, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:d1r2c:51, T:d1r2c:52, T:a-cg:38, T:a-cg:39], ver: consistent, src: [crawling-december-cdns, http-network-errors], topics: [soft-404, crawl-errors],
   text: "CDN captcha challenges often return HTTP 200; Googlebot does not solve them and sees only content with a 200 status, which indexing then classifies as a soft 404, reported as an error in Search Console."}
- {id: D1-C368, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:d1r2c:53, T:a-cg:40], ver: confirmed, src: [page-indexing-help], topics: [page-indexing-report, crawl-errors],
   text: "Search Console's page indexing report breaks down the reasons why pages do or do not show in Search, and its categories help find patterns in how a site's content is crawled and served to Google's crawlers."}
- {id: D1-C369, s: D1-S06, label: docs, ev: "", ver: source, src: [http-network-errors], topics: [crawl-errors, soft-404],
   text: "Google's status code page says that with a 204 No Content response Google receives no content and cannot process it, and that a 2xx page whose content is empty or an error message shows as a soft 404 in Search Console."}
- {id: D1-C370, s: D1-S06, label: docs, ev: "", ver: source, src: [http-network-errors], topics: [crawl-errors, site-moves],
   text: "Google's crawlers follow up to 10 redirect hops by default (some products' crawlers have other limits); content served by the redirecting URL is ignored and the final target's content is processed instead.",
   quote: "Any content Google receives from the redirecting URL is ignored, and the final target URL's content is processed instead."}
- {id: D1-C371, s: D1-S06, label: analysis, ev: "", ver: n/a, topics: [soft-404, crawl-errors],
   text: "Day 1 said a CDN captcha page served with HTTP 200 becomes a soft 404, while Day 2 (D2-C374, D2-C375) said such challenge pages are hard to recognise as errors and can be clustered as duplicates; Google's CDN post describes both outcomes, and in both the real pages drop out of Search."}
- {id: D1-C372, s: D1-S06, label: analysis, ev: "", ver: n/a, topics: [crawl-errors, crawl-rate-limit, ai-crawlers-and-agents],
   text: "Do not answer verified Googlebot with 401, 402 or 403, for example from a login wall, a paywall or a pay-per-crawl setup: Google treats them like 404 and drops the pages, and Google's status code page says not to use 401 or 403 to limit crawling; to slow crawling temporarily, return 429 or 503."}
# ----- From the real audio recordings (added in v2.7.0) -----
- {id: D1-C508, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:a-cg:40, T:d1r2c:53], ver: confirmed, src: [page-indexing-help, crawl-stats-help], topics: [page-indexing-report, soft-404],
   rel: [{type: extends, to: D1-C368}, {type: extends, to: D1-C367}],
   text: "Google said soft 404s, like some other problem categories, are looked up in Search Console's page indexing report, while other crawl issues are debugged in the Crawl Stats report."}
- {id: D1-C509, s: D1-S06, label: stage, who: Gary Illyes, ev: [T:a-cg:37, T:d1r2c:50], ver: undocumented, src: [http-network-errors], topics: [crawl-errors, ai-crawlers-and-agents],
   rel: [{type: extends, to: D1-C366}, {type: extends, to: D1-C365}],
   text: "Google has seen an uptick in 402 Payment Required responses to its crawlers, an even more recent trend than the rise in 403 responses."}

# ---------- D1-S07 robots.txt ----------
- {id: D1-C079, s: D1-S07, label: slide, ev: [IMG_4663, T:a-r2:11, T:a-r2:12, T:a-r2:13], ver: n/a, topics: [robots-txt],
   text: "The robots.txt session worked through an example file with three groups: a default group that disallows everything except the bare homepage, a shared bingbot and googlebot group that also allows /politics/ and /*/live/, and a google-extended group that disallows /subscriptions/."}
- {id: D1-C080, s: D1-S07, label: docs, ev: "", ver: source, src: [robots-spec], topics: [robots-txt, robots-group-parsing],
   text: "Rules can be grouped for several crawlers by repeating user-agent lines. A crawler follows only the most specific group that names it."}
- {id: D1-C081, s: D1-S07, label: docs, ev: "", ver: source, src: [robots-spec], topics: [robots-txt],
   text: "When matching rules to a URL, Google uses the most specific rule by path length. If rules conflict, it uses the least restrictive one.",
   quote: "In case of conflicting rules, including those with wildcards, Google uses the least restrictive rule."}
- {id: D1-C082, s: D1-S07, label: docs, ev: "", ver: source, src: [robots-spec], topics: [robots-txt],
   text: "In robots.txt, * matches zero or more of any character and $ marks the end of the URL."}
- {id: D1-C083, s: D1-S07, label: analysis, ev: "", ver: n/a, topics: [robots-txt],
   text: "Under the example file, Googlebot may crawl /, /politics/eu-vote and /sports/live/, and is blocked from /?utm_source=x, /index.html, /politics (no trailing slash), /live/ and /sports/live-score. An 'allow: /$' rule does not cover the homepage with tracking parameters."}
- {id: D1-C084, s: D1-S07, label: docs, ev: "", ver: source, src: [robots-spec], topics: [robots-txt, crawl-directives],
   text: "Google supports only the user-agent, allow, disallow and sitemap fields in robots.txt. Other fields such as crawl-delay are not supported."}
- {id: D1-C085, s: D1-S07, label: docs, ev: "", ver: source, src: [robots-spec], topics: [robots-txt],
   text: "Google generally caches robots.txt for up to 24 hours and reads only the first 500 KiB of the file."}
- {id: D1-C086, s: D1-S07, label: docs, ev: "", ver: source, src: [common-crawlers], topics: [google-extended],
   text: "Google-Extended is a control token, not a crawler with its own user agent string. It decides whether crawled content may be used to train future Gemini models and to ground Gemini apps and Vertex AI.",
   quote: "Google-Extended does not impact a site's inclusion in Google Search nor is it used as a ranking signal in Google Search."}
- {id: D1-C087, s: D1-S07, label: slide, ev: [IMG_4665, T:a-r2:15], ver: confirmed, src: [robots-spec], topics: [robots-group-parsing],
   text: "Googlebot ignores an unknown line, such as a Content-signal line, placed between two user-agent lines and joins both user agents into one group, so the rules that follow apply to both; in the slide's example both are blocked."}
- {id: D1-C123, s: D1-S07, label: slide, ev: [IMG_4665, T:a-r2:15], ver: undocumented, topics: [robots-group-parsing],
   text: "Bing closes the robots.txt group at an unknown line placed between two user-agent lines, so in the slide's example bingbot ends up not blocked while Googlebot is; the slide warned that different crawlers behave differently.",
   quote: "Unpredictability is never a good time.", quote_checked: true}
- {id: D1-C088, s: D1-S07, label: analysis, ev: "", ver: n/a, topics: [robots-group-parsing],
   text: "Content-Signal lines are now common because a large CDN provider adds them to its managed robots.txt files. Never place any non-standard directive between user-agent lines; put it after a group's rules and test the file with each search engine's tools, such as Bing's robots.txt tester and Google's open-source robots.txt parser."}
- {id: D1-C089, s: D1-S07, label: stage, ev: [notes, T:a-r2:9], ver: undocumented, topics: [robots-txt],
   text: "The robots.txt talk pointed to the robots.txt file of thebestfriedchickenever.com to show why comments in robots.txt are useful; the live file is mostly a large ASCII-art drawing written as # comment lines, followed by a single user-agent group (checked 2026-10-04)."}
- {id: D1-C140, s: D1-S07, label: docs, ev: "", ver: source, src: [robots-txt-report], topics: [robots-txt],
   text: "Search Console's robots.txt report shows the robots.txt files Google found for the top 20 hosts of a Domain property, with their fetch status, warnings and errors; to test whether a specific URL is blocked, Google's help page points to the URL Inspection tool and to Google's open-source robots.txt library."}
# ----- From the real audio recordings (added in v2.7.0) -----
- {id: D1-C510, s: D1-S07, label: stage, ev: [T:a-r2:1, T:a-r2:3], ver: confirmed, src: [rep-formalizing-blog], topics: [robots-txt, web-standards],
   text: "Google's robots.txt talk recalled that robots.txt began in 1994, when bots were crashing servers: Martijn Koster proposed a text file in the root of a site with rules for how automated clients may access it."}
- {id: D1-C511, s: D1-S07, label: stage, ev: T:a-r2:4, ver: consistent, src: [rep-formalizing-blog], topics: [robots-txt],
   text: "Google said it already supported robots.txt when it started crawling in 1996 as a Stanford PhD project, and has supported it ever since."}
- {id: D1-C512, s: D1-S07, label: stage, ev: T:a-r2:4, ver: confirmed, src: [robots-refresher-future-blog, robots-spec, rep-formalizing-blog], topics: [robots-txt, web-standards],
   rel: [{type: extends, to: D1-C329}],
   text: "Robots.txt is now an IETF standard, RFC 9309, supported by basically all major crawlers; Google said it follows it because it is the right thing to do: anyone who wants to opt out of crawling should be able to."}
- {id: D1-C513, s: D1-S07, label: stage, ev: T:a-r2:5, ver: consistent, src: [robots-intro, rep-formalizing-blog, common-crawlers], topics: [robots-txt, genai-optout],
   rel: [{type: extends, to: D1-C086}],
   text: "The standard's official name is the Robots Exclusion Protocol (REP). Google stressed that it was designed in 1994 only to control which automated clients may access what on a site, and has nothing to do with how the content is used."}
- {id: D1-C514, s: D1-S07, label: stage, ev: T:a-r2:6, ver: consistent, src: [robots-intro], topics: [robots-txt],
   text: "Robots.txt is not a security measure: the file sits at a predictable public address, so anyone can read the paths it disallows. Protect a secret folder with authentication, or do not put it on the internet."}
- {id: D1-C515, s: D1-S07, label: stage, ev: T:a-r2:7, ver: confirmed, src: [robots-spec], topics: [robots-txt],
   text: "The robots.txt file always sits in the root of the host; it cannot be placed anywhere else."}
- {id: D1-C516, s: D1-S07, label: stage, ev: [T:a-r2:7, T:a-r2:8], ver: consistent, src: [robots-spec, robots-refresher-future-blog], topics: [robots-txt, web-standards],
   rel: [{type: extends, to: D1-C084}],
   text: "Robots.txt was made extremely simple by design so that anyone could implement and understand it; it was extended as websites grew more complex, but it still has only three rules: user-agent (a named crawler, or * for every crawler), disallow and allow."}
- {id: D1-C517, s: D1-S07, label: stage, ev: T:a-r2:8, ver: confirmed, src: [robots-spec], topics: [robots-txt],
   text: "Everything on a site is implicitly allowed, so an allow rule is only needed to re-open a specific path inside a disallowed one."}
- {id: D1-C518, s: D1-S07, label: stage, ev: T:a-r2:9, ver: confirmed, src: [robots-spec], topics: [robots-txt, web-standards],
   text: "Comments in robots.txt start with #, and a line without the # that a parser cannot read is ignored anyway, because the standard requires parsers to skip lines they cannot parse, so it acts like a comment."}
- {id: D1-C519, s: D1-S07, label: stage, ev: [T:a-r2:10, T:a-r2:12], ver: consistent, src: [robots-spec], topics: [robots-txt, robots-group-parsing],
   rel: [{type: extends, to: D1-C080}],
   text: "A user-agent line with its allow and disallow rules forms a user-agent group, and one group can name several crawlers (the talk's example: Googlebot and Bingbot); give named crawlers their own group only when they need rules the * group should not grant to every crawler."}
- {id: D1-C520, s: D1-S07, label: stage, ev: [T:a-r2:11, IMG_4663], ver: consistent, src: [robots-spec], topics: [robots-txt],
   rel: [{type: extends, to: D1-C079}, {type: extends, to: D1-C081}],
   text: "In the talk's worked example, disallow /*/live/ blocks /science/live/ and /sports/live/, because * matches any number of characters, and an allow /science/live/ rule re-opens that one path."}
- {id: D1-C521, s: D1-S07, label: stage, ev: [T:a-r2:12, IMG_4663], ver: consistent, src: [robots-spec], topics: [robots-txt],
   rel: [{type: extends, to: D1-C079}, {type: extends, to: D1-C082}],
   text: "To let unnamed crawlers fetch only the homepage, use user-agent: *, disallow: / and allow: /$; the $ ends the match, so /$ means only the root path and /cats$ means exactly /cats."}
- {id: D1-C522, s: D1-S07, label: stage, ev: T:a-r2:13, ver: consistent, src: [common-crawlers], topics: [google-extended, genai-optout],
   rel: [{type: extends, to: D1-C086}, {type: repeats, to: D1-C485}],
   text: "Google said a site can keep a directory or the whole site out of Gemini model training by disallowing it for the Google-Extended token in robots.txt, and that Google respects that policy; the speaker believed Google was the first to offer such an opt-out from model training."}
- {id: D1-C523, s: D1-S07, label: analysis, ev: "", ver: n/a, src: [google-extended-announcement, register-gptbot-2023], topics: [google-extended, genai-optout, ai-crawlers-and-agents],
   rel: [{type: extends, to: D1-C086}],
   text: "The 'first' needs care: OpenAI documented how to block its GPTBot crawler in robots.txt in August 2023, before Google announced Google-Extended on 28 September 2023. What Google-Extended added was a token that controls AI-training use of pages fetched by Google's existing crawlers, separately from Search; Apple later introduced a similar token, Applebot-Extended."}
- {id: D1-C524, s: D1-S07, label: stage, ev: T:a-r2:13, ver: undocumented, topics: [genai-optout, ai-crawlers-and-agents],
   rel: [{type: repeats, to: D1-C487}],
   text: "Other companies have similar 'extended' robots.txt tokens; Google named Apple's Applebot-Extended."}
- {id: D1-C525, s: D1-S07, label: stage, ev: T:a-r2:14, ver: undocumented, topics: [robots-txt],
   text: "Google called robots.txt extremely forgiving: a typo in a path only blocks the wrong path, a typo in a rule name such as disallow makes Google ignore that line, and the rest of the file is still used."}
- {id: D1-C526, s: D1-S07, label: stage, ev: T:a-r2:15, ver: undocumented, topics: [robots-group-parsing, web-standards],
   rel: [{type: extends, to: D1-C087}, {type: extends, to: D1-C123}],
   text: "The real trouble is an unknown line placed between two user-agent lines: while writing RFC 9309, Google asked people whether the first crawler should then inherit the rules that follow, and opinions split roughly 50-50 (how the talk said the question was settled is unclear in the recording)."}
- {id: D1-C527, s: D1-S07, label: stage, ev: T:a-r2:15, ver: consistent, src: [robots-spec], topics: [robots-group-parsing],
   rel: [{type: extends, to: D1-C080}],
   text: "The talk's fix for giving one crawler both an extra rule and the rules of another group: simply add another group for that crawler. Google's spec combines all groups that name the same user agent into one."}
- {id: D1-C528, s: D1-S07, label: stage, ev: T:a-r2:16, ver: confirmed, src: [robots-txt-report], topics: [robots-txt, search-console-features],
   rel: [{type: extends, to: D1-C140}],
   text: "Search Console's robots.txt report shows the robots.txt file as Google last fetched it, with a version history and the errors and successes of each fetch."}
- {id: D1-C529, s: D1-S07, label: stage, ev: T:a-r2:16, ver: undocumented, topics: [robots-txt, search-console-features],
   text: "Google said the robots.txt report helps catch CDNs that update a site's robots.txt without the owner's knowledge, and hosts that cloak the robots.txt file, which happens more often than people think."}
- {id: D1-C530, s: D1-S07, label: stage, ev: T:a-r2:16, ver: undocumented, topics: [robots-txt, search-console-features],
   rel: [{type: extends, to: D1-C140}],
   text: "Google said the robots.txt report uses the parser Google open-sourced at github.com/google/robotstxt."}
- {id: D1-C531, s: D1-S07, label: stage, ev: T:a-r2:18, ver: consistent, src: [robots-spec], topics: [robots-txt, robots-group-parsing],
   rel: [{type: extends, to: D1-C080}],
   text: "In the talk's quiz, the answer for letting Googlebot crawl /staging/preview/ while keeping the rest of /staging/ closed to it was a user-agent: googlebot group with both rules, disallow /staging/ and allow /staging/preview/, rather than an allow in the * group or a Googlebot group with only the allow."}
- {id: D1-C532, s: D1-S07, label: analysis, ev: "", ver: n/a, src: [robotstxt-parser, robots-spec], topics: [robots-txt],
   rel: [{type: extends, to: D1-C525}],
   text: "A typo in a rule name is not always ignored by Google: its open-source robots.txt parser deliberately accepts common misspellings of disallow (such as dissallow, dissalow and disalow) and of user-agent (useragent, user agent), but not of allow. Google's spec page does not mention typos, and other crawlers may be stricter, so spell rule names correctly."}

# ---------- D1-S08 Lightning session B: Robots.txt ----------
# ----- From the real audio recordings (added in v2.7.0) -----
- {id: D1-C533, s: D1-S08, label: stage, who: Dave Smart, ev: T:a-r2:22, ver: confirmed, src: [robots-spec], topics: [robots-txt, robots-group-parsing],
   rel: [{type: extends, to: D1-C080}],
   text: "Dave Smart said robots.txt groups are not additive: if a group matches a crawler's user agent, only that group's rules apply, so a googlebot group that blocks /dogs/ leaves Googlebot free to crawl the /goats/ and /cows/ that the * group blocks."}
- {id: D1-C534, s: D1-S08, label: stage, who: Dave Smart, ev: T:a-r2:23, ver: undocumented, topics: [robots-txt, crawl-errors],
   text: "Dave Smart said robots.txt is checked for every URL in a redirect chain and crawling stops at the first blocked one; in his example a site redirected through /cart/ with JavaScript to set the local currency and back, and because /cart/ was disallowed the page was reported as blocked."}
- {id: D1-C535, s: D1-S08, label: stage, who: Dave Smart, ev: T:a-r2:23, ver: consistent, src: [url-inspection-help], topics: [robots-txt, page-indexing-report],
   text: "Dave Smart said Search Console reports such a block only on the first URL of the chain, which is confusing: the URL shown as blocked by robots.txt is not itself disallowed."}
- {id: D1-C536, s: D1-S08, label: stage, who: Dave Smart, ev: T:a-r2:24, ver: undocumented, topics: [robots-txt, crawl-errors],
   text: "Dave Smart said this applies to all redirects, not only JavaScript ones; his examples: a redirect through an external authorisation service that is blocked by its own robots.txt, content that moved through several URLs over the years with one of them later blocked, and unexpected redirects, such as one served only to Googlebot's user agent."}
- {id: D1-C537, s: D1-S08, label: stage, who: Dave Smart, ev: T:a-r2:25, ver: consistent, src: [url-inspection-help], topics: [robots-txt, page-indexing-report],
   text: "When Search Console says a URL is blocked by robots.txt but the file does not block it, check whether the URL redirects and test every URL in the chain."}

# ---------- D1-S10 Crawl budget ----------
- {id: D1-C090, s: D1-S10, label: slide, ev: ["IMG_4667, IMG_4669", T:d1r3a:2], ver: consistent, src: [crawl-budget-guide], topics: [crawl-budget],
   text: "Crawl budget is the combination of crawl rate limit and crawl demand.",
   quote: "Crawl Budget = Crawl Rate Limit & Crawl Demand", quote_checked: true}
- {id: D1-C091, s: D1-S10, label: slide, ev: [IMG_4667, T:d1r3a:3], ver: confirmed, src: [crawl-budget-guide], topics: [crawl-rate-limit],
   text: "Crawl rate limit, or hostload, is a host-wide metric shared across all Google crawlers."}
- {id: D1-C132, s: D1-S10, label: docs, ev: "", ver: source, src: [crawl-budget-guide], topics: [crawl-rate-limit, crawl-demand],
   text: "Google's crawl budget guide says each crawler has its own crawl demand, but the crawl capacity limit (hostload) is shared across all crawlers, so high demand from one crawler can reduce the capacity left for others.",
   quote: "high demand from one crawler can reduce the capacity available for others"}
- {id: D1-C092, s: D1-S10, label: slide, ev: [IMG_4667, T:d1r3a:3, T:d1r3a:15], ver: consistent, src: [crawl-budget-guide], topics: [crawl-rate-limit],
   text: "Hostload is driven by changes in connect time, changes in time to first byte, and HTTP 429 or 5xx status codes. If these increase, hostload is adjusted and crawling slows down."}
- {id: D1-C093, s: D1-S10, label: slide, ev: [IMG_4669, T:d1r3a:7], ver: consistent, src: [crawl-budget-guide], topics: [crawl-demand],
   text: "Crawl demand is driven by the quality of the site, the change frequency of its URLs and their popularity on the internet."}
- {id: D1-C094, s: D1-S10, label: slide, ev: [IMG_4669, T:d1r3a:7], ver: undocumented, topics: [crawl-demand-inheritance],
   text: "If the quality or popularity of a URL is unknown, the aggregate quality or popularity of its parent path is used, then that path's parent, and so on.",
   quote: "If quality or popularity is unknown, use parent root's aggregate quality or popularity is used, then, that path's parent's, and so on.", quote_checked: true}
- {id: D1-C095, s: D1-S10, label: analysis, ev: "", ver: n/a, topics: [crawl-demand-inheritance],
   text: "New content inherits its starting crawl demand from the folder it sits in. Put new high-value content under sections Google already rates well, not under weak ones."}
- {id: D1-C096, s: D1-S10, label: stage, ev: [notes, T:d1r3a:1], ver: consistent, src: [crawl-budget-guide], topics: [crawl-budget],
   text: "Crawl budget was described as the attention span Google gives a website, and better performance increases it."}
- {id: D1-C097, s: D1-S10, label: docs, ev: "", ver: source, src: [crawl-budget-guide], topics: [crawl-budget],
   text: "Google's crawl budget guide is written for sites with over 1 million unique pages that change weekly, over 10,000 pages that change daily, or many URLs reported as 'Discovered – currently not indexed'."}
- {id: D1-C098, s: D1-S10, label: analysis, ev: "", ver: n/a, topics: [crawl-budget, crawl-demand],
   text: "On smaller sites, slow indexing is almost always a demand problem, meaning quality, not a capacity problem."}
- {id: D1-C099, s: D1-S10, label: slide, ev: [IMG_4670, T:d1r3a:8, T:d1r3a:9], ver: consistent, src: [crawl-budget-guide], topics: [crawl-budget, soft-404, faceted-navigation],
   text: "Three things burn crawl budget: server errors unrelated to server load, useless pages and resources, and infinite URL spaces."}
- {id: D1-C100, s: D1-S10, label: slide, ev: IMG_4671, ver: consistent, src: [faceted-nav-guide], topics: [faceted-navigation],
   text: "Six faceted-URL problems were shown: the same facets in a different order, irrelevant or conflicting facet combinations, excessive facet selection, facets on paginated series, facets combined with search queries, and optional facets with default values."}
- {id: D1-C101, s: D1-S10, label: docs, ev: "", ver: source, src: [faceted-nav-guide], topics: [faceted-navigation],
   text: "Google's faceted navigation guide prefers prevention: disallow filter URLs in robots.txt and keep crawlable only item pages plus one unfiltered listing page, or use URL fragments, which Google generally does not crawl. rel=canonical and nofollow are weaker, slower options."}
- {id: D1-C102, s: D1-S10, label: docs, ev: "", ver: source, src: [faceted-nav-guide], topics: [faceted-navigation],
   text: "If faceted URLs must be crawled, use the standard & separator, keep filters in a consistent order, and return a 404 when a filter combination has no results."}
- {id: D1-C103, s: D1-S10, label: slide, ev: ["IMG_4672, IMG_4673", T:d1r3a:10], ver: consistent, src: [crawl-budget-guide], topics: [crawl-budget, http-caching, faceted-navigation],
   text: "Four ways to manage crawl budget: use HTTP cache control, have good site navigation, restrict crawlers' access to faceted navigation and action URLs, and improve or remove useless content."}
- {id: D1-C104, s: D1-S10, label: docs, ev: "", ver: source, src: [crawl-budget-guide, crawling-december-caching], topics: [http-caching],
   text: "HTTP caching for crawlers means supporting conditional requests (ETag with If-None-Match, or Last-Modified with If-Modified-Since) and answering 304 Not Modified when nothing changed. Google's crawling team has said it prefers ETag."}
- {id: D1-C105, s: D1-S10, label: slide, ev: [IMG_4674, T:d1r3a:20], ver: consistent, src: [crawl-budget-guide], topics: [crawl-directives, robots-txt],
   text: "URLs disallowed through robots.txt do not affect crawl budget, because they are not fetched."}
- {id: D1-C106, s: D1-S10, label: slide, ev: [IMG_4674, T:d1r3a:20], ver: confirmed, src: [crawl-budget-guide], topics: [crawl-directives],
   text: "The noindex rule consumes crawl budget, because Google must fetch the page to see it."}
- {id: D1-C107, s: D1-S10, label: slide, ev: [IMG_4674, T:d1r3a:21], ver: confirmed, src: [qualify-outbound-links, faceted-nav-guide, crawl-budget-blog], topics: [crawl-directives],
   text: "The nofollow rule can still consume crawl budget: Google does not crawl through the nofollow link itself, but it still crawls the linked page when it finds that page through other links."}
- {id: D1-C127, s: D1-S10, label: docs, ev: "", ver: source, src: [qualify-outbound-links, nofollow-hints-blog], topics: [crawl-directives],
   text: "Google treats nofollow as a hint for crawling, not a block: nofollow links will generally not be followed, but the linked pages may still be crawled if Google finds them through sitemaps or other links. To stop Google fetching URLs on your own site, use a robots.txt disallow rule."}
- {id: D1-C108, s: D1-S10, label: slide, ev: [IMG_4674, T:d1r3a:22], ver: confirmed, src: [robots-spec], topics: [crawl-directives],
   text: "The non-standard crawl-delay rule is not processed by Googlebot, so it does not save any crawl budget."}
- {id: D1-C109, s: D1-S10, label: docs, ev: "", ver: source, src: [crawl-budget-guide], topics: [crawl-directives],
   text: "Google advises against using noindex to save crawl budget and against using robots.txt to temporarily reallocate budget. Use robots.txt only for pages you never want crawled, and 404 or 410 for removed pages."}
- {id: D1-C110, s: D1-S10, label: analysis, ev: "", ver: n/a, topics: [crawl-directives],
   text: "A URL blocked in robots.txt can still be indexed without its content if other pages link to it, and Google cannot see a noindex on a page it is not allowed to fetch."}
- {id: D1-C141, s: D1-S10, label: docs, ev: "", ver: source, src: [website-testing], topics: [spam-detection],
   text: "Google's guide to A/B testing says never to show one set of URLs to Googlebot and a different set to humans: that is cloaking, which is against Google's spam policies whether or not a test is running."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D1-C373, s: D1-S10, label: stage, ev: T:d1r3a:1, ver: consistent, src: [crawl-budget-guide, crawl-budget-blog], topics: [crawl-budget],
   rel: [{type: extends, to: D1-C096}],
   text: "Crawl budget is the finite amount of resources Google allocates to crawling a specific website, and it determines how many of the site's pages are discovered and how often they are revisited."}
- {id: D1-C374, s: D1-S10, label: stage, ev: T:d1r3a:3, ver: consistent, src: [crawl-budget-guide], topics: [crawl-rate-limit],
   rel: [{type: extends, to: D1-C091}],
   text: "Crawl rate limit, or hostload, is a proxy for how many requests per second the connection to a site can handle before Google hits the limit."}
- {id: D1-C375, s: D1-S10, label: stage, ev: T:d1r3a:5, ver: confirmed, src: [inside-googlebot-blog, crawling-infrastructure], topics: [crawl-pipeline],
   rel: [{type: extends, to: D1-C066}],
   text: "Googlebot as a single standalone crawler is a historical idea: Google crawls through a centralised crawling infrastructure, so a request from a Google user agent in server logs is a request routed through that shared platform."}
- {id: D1-C376, s: D1-S10, label: stage, ev: T:d1r3a:6, ver: confirmed, src: [crawl-budget-guide], topics: [crawl-rate-limit],
   rel: [{type: extends, to: D1-C091}],
   text: "Hostload applies per host, not necessarily per site: depending on how a site is configured, its CDN, its app, its subdomains and its main www host may be different hosts."}
- {id: D1-C377, s: D1-S10, label: stage, ev: T:d1r3a:7, ver: undocumented, topics: [crawl-demand],
   rel: [{type: extends, to: D1-C093}],
   text: "The quality that drives crawl demand is the quality of the site as a whole, not the quality of an individual page."}
- {id: D1-C378, s: D1-S10, label: stage, ev: T:d1r3a:9, ver: consistent, src: [url-structure-guide, crawl-budget-blog], topics: [crawl-budget, faceted-navigation],
   rel: [{type: extends, to: D1-C099}],
   text: "Google treats URLs that differ as different URLs and crawls all of them even when they lead to the same content, so infinite URL spaces such as calendars or many versions of a page burn crawl budget."}
- {id: D1-C379, s: D1-S10, label: stage, ev: T:d1r3a:10, ver: confirmed, src: [crawl-budget-blog, crawl-budget-guide], topics: [crawl-budget, soft-404, duplicate-content],
   rel: [{type: extends, to: D1-C103}],
   text: "The useless content worth improving or removing to save crawl budget includes very bad or low-quality pages, spam content, duplicate pages and soft error pages."}
- {id: D1-C380, s: D1-S10, label: stage, who: audience, ev: T:d1r3a:11, ver: n/a, topics: [crawl-budget],
   text: "An audience member asked, in a question submitted before the event, whether crawl budget is still an SEO priority in 2026 or only relevant for very large sites."}
- {id: D1-C381, s: D1-S10, label: stage, ev: T:d1r3a:12, ver: confirmed, src: [crawl-budget-blog, crawl-budget-guide, crawl-stats-help], topics: [crawl-budget],
   rel: [{type: answers, to: D1-C380}],
   text: "Not every site needs to worry about crawl budget, and this has always been so: a site with fewer than a few thousand URLs likely has no crawl budget problem, and a larger site does not necessarily have one either."}
- {id: D1-C382, s: D1-S10, label: analysis, ev: T:d1r3a:12, ver: n/a, topics: [crawl-budget],
   text: "The stage rule of thumb (under a few thousand URLs crawl budget is unlikely to be a problem) and Google's crawl budget guide (D1-C097: sites with over a million pages that change about weekly, or over 10,000 pages that change daily) leave a middle range where a site should check Search Console's Crawl Stats report before blaming crawl budget for slow indexing."}
- {id: D1-C383, s: D1-S10, label: stage, ev: T:d1r3a:13, ver: consistent, src: [http-network-errors], topics: [crawl-budget, crawl-errors],
   text: "HTTP status codes do not all affect crawl budget in the same way, so knowing what each status code class does is one way to manage crawl budget."}
- {id: D1-C384, s: D1-S10, label: stage, ev: T:d1r3a:13, ver: consistent, src: [crawl-budget-blog], topics: [crawl-budget],
   text: "Every fetch that returns a 2xx success response consumes crawl budget."}
- {id: D1-C385, s: D1-S10, label: stage, ev: T:d1r3a:14, ver: consistent, src: [http-network-errors], topics: [crawl-budget, crawl-errors],
   rel: [{type: repeats, to: D1-C072}],
   text: "4xx responses do not affect a site's crawl budget, because Google expects pages, content and products to come and go as a natural part of the web."}
- {id: D1-C386, s: D1-S10, label: analysis, ev: T:d1r3a:14, ver: n/a, topics: [crawl-errors, crawl-rate-limit],
   text: "The stage point that 4xx responses do not affect crawl budget matches Google's documentation that 4xx codes have no effect on crawl rate (D1-C072), with one exception: 429 Too Many Requests counts as a server error and slows crawling like a 5xx (D1-C071, D1-C092)."}
- {id: D1-C387, s: D1-S10, label: stage, who: audience, ev: T:d1r3a:16, ver: n/a, topics: [ai-crawlers-and-agents, crawl-budget],
   text: "An audience member asked, in questions submitted before the event, how often Googlebot should be expected to visit a site now that AI Mode has rolled out, and whether AI means more crawling."}
- {id: D1-C388, s: D1-S10, label: stage, ev: T:d1r3a:17, ver: consistent, src: [ai-features-guide], topics: [ai-crawlers-and-agents, crawl-pipeline],
   rel: [{type: answers, to: D1-C387}, {type: extends, to: D1-C038}],
   text: "AI Mode is a feature that sits on top of Google's existing crawling infrastructure, so Google does not crawl a site more because of AI Mode."}
- {id: D1-C389, s: D1-S10, label: stage, ev: T:d1r3a:17, ver: n/a, topics: [ai-crawlers-and-agents],
   rel: [{type: answers, to: D1-C387}],
   text: "Google expects sites to see more crawling overall, because many other services, including AI services, now crawl the web besides Google."}
- {id: D1-C390, s: D1-S10, label: stage, who: audience, ev: T:d1r3a:18, ver: n/a, topics: [crawl-budget, ranking-systems],
   text: "An audience member asked, in a question submitted before the event, whether crawl frequency affects the ranking position of a URL."}
- {id: D1-C391, s: D1-S10, label: stage, ev: T:d1r3a:19, ver: confirmed, src: [crawl-budget-blog], topics: [crawl-budget, ranking-systems],
   rel: [{type: answers, to: D1-C390}],
   text: "A higher crawl rate does not make a URL rank better; it only means Google checks the site more often.",
   quote: "if your crawl rate is increased, that doesn't mean that you would rank better."}
- {id: D1-C392, s: D1-S10, label: stage, ev: T:d1r3a:19, ver: consistent, src: [crawl-budget-guide], topics: [crawl-demand],
   rel: [{type: answers, to: D1-C390}],
   text: "Frequent crawling is usually a consequence, not a cause: Google visiting a site more often tends to signal that people are interested in the site and that its content is of high quality."}
- {id: D1-C393, s: D1-S10, label: stage, ev: T:d1r3a:23, ver: confirmed, src: [crawl-stats-help], topics: [crawl-budget, search-console-data],
   text: "To check whether a site has a crawl budget problem, use Search Console's crawl report (Crawl Stats), which breaks crawl requests down by response and by file type and shows crawl problems Google finds."}
- {id: D1-C394, s: D1-S10, label: stage, ev: T:d1r3a:23, ver: consistent, src: [crawl-stats-help], topics: [search-console-data, crawl-budget],
   text: "The file-type breakdown of crawl requests in Search Console is useful for spotting anomalies, such as most crawling going to images on a site that has no images worth crawling."}
- {id: D1-C395, s: D1-S10, label: stage, ev: T:d1r3a:23, ver: n/a, topics: [crawl-budget],
   text: "Google advised checking crawl data in Search Console now and then without obsessing over crawl budget."}
- {id: D1-C396, s: D1-S10, label: stage, ev: T:d1r3a:24, ver: confirmed, src: [crawl-stats-help], topics: [search-console-data, url-discovery],
   text: "Search Console's crawl data separates discovery (fetches of URLs Google has not seen before) from refresh (fetches of known URLs), and lets you drill down to the problematic URLs."}
- {id: D1-C419, s: D1-S10, label: analysis, ev: T:d1r3a:14, ver: n/a, src: [crawl-budget-blog, http-network-errors], topics: [crawl-budget, crawl-errors],
   text: "A 404 fetch is still a fetch: Google's 2017 crawl budget post says generally any URL Googlebot crawls counts towards a site's crawl budget, so the stage point that 4xx responses do not affect crawl budget is best read as 'they do not slow crawling, and a 404 tells Google to crawl that URL less over time'."}
- {id: D1-C420, s: D1-S10, label: analysis, ev: T:d1r3a:7, ver: n/a, src: [crawl-budget-guide], topics: [crawl-demand, crawl-demand-inheritance],
   text: "The stage remark that crawl demand follows the quality of the site as a whole sits beside the same talk's slide (D1-C094), which falls back to the parent path's aggregate only when a URL's own quality is unknown, and Google's crawl budget guide lists page quality among the demand factors; read it as site quality setting the baseline while known URL-level signals still count."}

# ---------- D1-S11 Lightning session C: Crawling ----------
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D1-C397, s: D1-S11, label: stage, who: Tobias Schwarz, ev: T:d1r3a:25, ver: consistent, src: [canonicalization, url-structure-guide], topics: [url-normalization, duplicate-content],
   text: "A community speaker said similar URLs are an indicator of duplicate content, broken links, unnecessary redirects and other technical issues."}
- {id: D1-C398, s: D1-S11, label: stage, who: Tobias Schwarz, ev: T:d1r3a:26, ver: n/a, topics: [url-normalization],
   text: "In a community speaker's definition, similar URLs are technically different URLs that differ in only a small portion of their characters."}
- {id: D1-C399, s: D1-S11, label: stage, who: Tobias Schwarz, ev: [T:d1r3a:27, T:d1r3a:28, T:d1r3a:29, T:d1r3a:30], ver: consistent, src: [url-structure-guide, canonicalization], topics: [url-normalization, duplicate-content],
   text: "A community speaker showed five kinds of similar URLs on well-known brand sites: a different protocol or host (HTTP vs HTTPS, www vs non-www), different capitalisation, a different number of delimiters such as slashes, a space encoded as %20 in one URL and + in another, and parameters in a different order."}
- {id: D1-C400, s: D1-S11, label: stage, who: Tobias Schwarz, ev: T:d1r3a:31, ver: consistent, src: [url-structure-guide], topics: [url-normalization],
   text: "To find similar URLs in a URL list, a community speaker first applies basic normalisation that keeps the meaning: lowercase the scheme and host, remove default ports such as 80 for HTTP, resolve relative path segments and usually drop the fragment, which matters only to clients."}
- {id: D1-C401, s: D1-S11, label: stage, who: Tobias Schwarz, ev: [T:d1r3a:32, T:d1r3a:33], ver: n/a, topics: [url-normalization],
   text: "A community speaker then derives a uniform URL that deliberately changes the meaning (one scheme, everything lowercase, www and index files such as index.html removed, duplicate and trailing delimiters removed, parameters sorted alphabetically) and sorts the URL list by it, so that similar URLs group together."}
- {id: D1-C402, s: D1-S11, label: stage, who: Tobias Schwarz, ev: T:d1r3a:34, ver: undocumented, topics: [url-normalization],
   text: "Similar URLs usually come from programming errors or manually set links, but anyone can link to them from other sites, including malicious actors, so a site should be hardened against them."}
- {id: D1-C403, s: D1-S11, label: stage, who: Tobias Schwarz, ev: T:d1r3a:35, ver: consistent, src: [consolidate-duplicate-urls], topics: [url-normalization, canonical-selection],
   text: "A community speaker advised that a web application compute the expected URL for every request, for example with reverse routing from the page type and ID, and redirect or return an error page when the requested URL differs."}
- {id: D1-C404, s: D1-S11, label: stage, who: Tobias Schwarz, ev: T:d1r3a:36, ver: consistent, src: [faceted-nav-guide], topics: [url-normalization, faceted-navigation],
   rel: [{type: extends, to: D1-C102}],
   text: "For query parameters, a community speaker advised checking that every parameter in a request is actually used and in the expected order, and otherwise redirecting to the expected URL with only the used parameters in the correct order."}
- {id: D1-C405, s: D1-S11, label: stage, who: Tobias Schwarz, ev: T:d1r3a:37, ver: n/a, topics: [url-normalization],
   text: "A community speaker said most web applications wrongly accept a numeric ID in a URL written with leading zeros or as a decimal with trailing zeros, which creates further similar URLs, so such variants are worth testing."}
- {id: D1-C406, s: D1-S11, label: stage, who: Jovana Avramovic, ev: T:d1r3a:39, ver: undocumented, topics: [ai-crawlers-and-agents, search-evolution],
   text: "A community speaker said that more than half of internet traffic in the previous year (2025) was non-human; the source of the figure was not named."}
- {id: D1-C407, s: D1-S11, label: stage, who: Jovana Avramovic, ev: T:d1r3a:39, ver: undocumented, topics: [search-evolution],
   text: "A community speaker cited more than 900 million weekly active ChatGPT users and 2.5 billion monthly users of a Google AI feature (the recording is unclear which), adding that these are not comparable market-share figures."}
- {id: D1-C408, s: D1-S11, label: stage, who: Jovana Avramovic, ev: [T:d1r3a:39, T:d1r3a:40], ver: n/a, topics: [search-evolution, seo-scope],
   text: "A community speaker argued that search no longer happens in one place, so SEO is about how content is found, understood and trusted wherever search occurs."}
- {id: D1-C409, s: D1-S11, label: stage, who: Jovana Avramovic, ev: T:d1r3a:41, ver: n/a, topics: [ai-mode-usage],
   text: "A community speaker argued that the change in search behaviour is not only longer AI Mode queries but conversation: a follow-up such as 'compare these two' relies on the context of earlier turns."}
- {id: D1-C410, s: D1-S11, label: stage, who: Jovana Avramovic, ev: T:d1r3a:42, ver: n/a, topics: [search-evolution],
   text: "A community speaker described a cognitive offloading shift: people increasingly hand remembering, comparing, analysing and even decision-making over to search tools."}
- {id: D1-C411, s: D1-S11, label: stage, who: Jovana Avramovic, ev: T:d1r3a:43, ver: n/a, topics: [search-evolution, seo-vs-geo],
   text: "In a community speaker's view, AI search changes the workflow but not the foundation: where one query once returned ten blue links and left research and comparison to the user, one query can now lead to many different answers."}
- {id: D1-C412, s: D1-S11, label: stage, who: Jovana Avramovic, ev: T:d1r3a:44, ver: consistent, src: [ai-features-guide], topics: [query-fanout],
   rel: [{type: extends, to: D1-C053}],
   text: "A community speaker described AI search as turning one query into many related searches, including searches in other languages, before the information is retrieved."}
- {id: D1-C413, s: D1-S11, label: stage, who: Jovana Avramovic, ev: T:d1r3a:45, ver: n/a, topics: [seo-scope, structured-data],
   text: "A community speaker said technical SEO remains the foundation for AI search, with site architecture showing the structure and thematic connections of content and structured data adding clarity, but that a technically sound site is only the beginning."}
- {id: D1-C414, s: D1-S11, label: stage, who: Jovana Avramovic, ev: T:d1r3a:46, ver: undocumented, topics: [chunking],
   text: "A community speaker linked the serial-position effect in human memory (people best remember the first and last items of a list) to the 'lost in the middle' pattern that research has found in large language models."}
- {id: D1-C415, s: D1-S11, label: stage, who: Jovana Avramovic, ev: T:d1r3a:47, ver: n/a, topics: [chunking, measuring-ai-visibility],
   text: "A community speaker advised placing the most important information at the beginning or the end of a piece of content, because information in the middle is less likely to be cited by AI systems.",
   quote: "It's relevant to put your most important information at the beginning or at the end."}
- {id: D1-C416, s: D1-S11, label: stage, who: Jovana Avramovic, ev: T:d1r3a:47, ver: n/a, topics: [measuring-ai-visibility],
   text: "A community speaker reported that on client sites information towards the end of the content got cited, and invited others to check their own examples."}
- {id: D1-C417, s: D1-S11, label: analysis, ev: T:d1r3a:47, ver: n/a, topics: [chunking],
   text: "Placing key facts first or last is a community heuristic based on research into language models, not something Google has said its systems do; Google's own advice (D1-C054) is to write for people without chopping content, and a short summary at the top serves readers either way."}
- {id: D1-C418, s: D1-S11, label: stage, who: Jovana Avramovic, ev: T:d1r3a:48, ver: n/a, topics: [seo-vs-geo, seo-scope],
   text: "A community speaker summed up the shift as SEO's target expanding rather than moving: besides asking whether a page can rank, ask whether its information is useful as a source and easy to extract.",
   quote: "The target is not shifting; it is expanding."}
- {id: D1-C421, s: D1-S11, label: analysis, ev: T:d1r3a:35, ver: n/a, src: [consolidate-duplicate-urls], topics: [url-normalization, canonical-selection],
   text: "Of the two answers a community speaker offered for a request to a URL variant (redirect, or an error page), Google's canonicalization guide favours the redirect: a redirect is a strong signal that its target should become canonical, while an error page throws away any links pointing at the variant."}

# ---------- D1-S12 Q&A ----------
- {id: D1-C120, s: D1-S12, label: stage, who: unknown, ev: [notes, T:d1r3b:35, T:a-r7:2, T:a-r7:3], ver: n/a, topics: [feature-requests],
   text: "To get Google to build something, such as an addition to an API, report and request it publicly and in volume."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D1-C422, s: D1-S12, label: stage, who: audience, ev: T:d1r3b:1, ver: n/a, topics: [ai-crawlers-and-agents],
   text: "An audience member asked, in a question submitted at registration, what the biggest difference is between crawling for search and crawling for AI models."}
- {id: D1-C423, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:3, T:a-r3:2], ver: n/a, topics: [ai-crawlers-and-agents],
   rel: [{type: answers, to: D1-C422}],
   text: "A Google panelist said many AI crawlers are less sophisticated than search crawlers: in server logs, search crawlers tend to follow where a site changes and which pages are valuable, while AI crawlers may simply work through a site in order, which he put down to less crawling experience and different priorities.",
   quote: "my feeling is a lot of the AI crawlers are still a bit stupid", quote_checked: true}
- {id: D1-C424, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:4, T:a-r3:3], ver: consistent, src: [crawl-budget-guide], topics: [crawl-demand, ai-crawlers-and-agents],
   rel: [{type: answers, to: D1-C422}],
   text: "Google's search crawling works to keep content fresh and to understand which pages change frequently, whereas many AI systems crawl a site with no understanding of it and take everything."}
- {id: D1-C425, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:5, T:a-r3:4], ver: undocumented, topics: [ai-crawlers-and-agents],
   rel: [{type: answers, to: D1-C422}],
   text: "Crawling for AI model training differs from search crawling because training mainly needs a very large number of tokens, and it matters little which pages they come from."}
- {id: D1-C426, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:6, T:a-r3:5], ver: n/a, topics: [seo-vs-geo],
   text: "Asked whether optimising for AI search can hurt classic search or the reverse, a Google panelist said yes, pointing to questionable GEO advice published online that he declined to name."}
- {id: D1-C427, s: D1-S12, label: stage, who: audience, ev: [T:d1r3b:7, T:a-r3:6], ver: n/a, topics: [robots-txt, ai-crawlers-and-agents],
   text: "An audience question asked how to make sure bots behave well beyond robots.txt."}
- {id: D1-C428, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:8, T:a-r3:7], ver: confirmed, src: [robots-intro, crawlers-overview], topics: [robots-txt, ai-crawlers-and-agents],
   rel: [{type: answers, to: D1-C427}],
   text: "Mainstream crawlers from Google, other large search engines and AI companies try to follow robots.txt, so implementing robots.txt correctly is the way to stop them doing something specific on a site."}
- {id: D1-C429, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:9, T:a-r3:8], ver: n/a, topics: [robots-txt, ai-crawlers-and-agents],
   rel: [{type: answers, to: D1-C427}],
   text: "A Google panelist said crawlers that ignore robots.txt and cause a nuisance are better treated as a scraping problem than as a crawling problem."}
- {id: D1-C430, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:10, T:a-r3:9], ver: consistent, src: [crawl-budget-guide], topics: [robots-txt, crawl-budget],
   text: "Google follows robots.txt partly in its own interest: crawling an infinite URL space such as a calendar that robots.txt blocks would waste Google's crawling time as well as the site's resources."}
- {id: D1-C431, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:11, T:a-r3:10], ver: n/a, topics: [ai-crawlers-and-agents, robots-txt],
   text: "A Google panelist described research, malware-scanning and privacy crawlers as a separate category of crawler that is generally harmless and useful to the web."}
- {id: D1-C432, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:11, T:a-r3:10], ver: undocumented, topics: [web-standards, robots-txt],
   text: "A Google panelist said they were working on a set of crawler best practices and offering research, malware-scanning and privacy crawlers an exemption from following them, apparently because such crawlers sometimes need to ignore robots.txt or probe URLs that other crawlers would not touch (the reason is a best reading: the audio has 'don't need', which would not explain an exemption)."}
- {id: D1-C433, s: D1-S12, label: analysis, ev: "", ver: n/a, topics: [web-standards, robots-txt],
   rel: [{type: extends, to: D1-C432}],
   text: "The crawler best practices mentioned on stage match the public IETF Internet-Draft 'Crawler best practices' (draft-illyes-aipref-cbcp-00, July 2025), which says self-declared research crawlers, including privacy and malware discovery crawlers, may exempt themselves from any of its practices with a rationale; it is a draft, not Google documentation."}
- {id: D1-C434, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:12, T:a-r3:11], ver: confirmed, src: [user-triggered-fetchers], topics: [ai-crawlers-and-agents, robots-txt],
   rel: [{type: repeats, to: D1-C273}],
   text: "User-initiated fetchers, such as a translation service fetching a page a user asked to translate, are a different category from crawlers and generally do not check robots.txt, because a user asked for the fetch."}
- {id: D1-C435, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:12, T:a-r3:11], ver: consistent, src: [user-triggered-fetchers], topics: [ai-crawlers-and-agents, search-agents],
   text: "AI agents acting on a user's request fall into the same category as user-initiated fetchers: an agent told to look at a site reads the page without checking robots.txt."}
- {id: D1-C436, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:13, T:a-r3:12], ver: n/a, topics: [search-agents, ai-crawlers-and-agents],
   text: "A Google panelist argued that it makes business sense for agents not to follow robots.txt: an agent sent to buy something that obeyed a robots.txt block could not complete the purchase, a bad experience for the user and lost revenue for the shop."}
- {id: D1-C437, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:14, T:a-r3:13], ver: n/a, topics: [robots-txt, search-agents],
   text: "A Google panelist said much of robots.txt is written with search engines in mind: a search engine should never add items to a cart or check out, but an agent acting for a user probably should be able to."}
- {id: D1-C438, s: D1-S12, label: stage, who: audience, ev: [T:d1r3b:15, T:a-r3:14], ver: n/a, topics: [crawl-demand],
   text: "An audience member asked how Google prioritises crawling and indexing for very large real-time sites, such as sports sites, whose content changes constantly and is largely near-duplicate across seasons."}
- {id: D1-C439, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:16, T:a-r3:15], ver: consistent, src: [crawl-budget-guide, crawling-myths], topics: [crawl-demand, crawl-rate-limit],
   rel: [{type: answers, to: D1-C438}, {type: extends, to: D1-C093}],
   text: "Very large, constantly changing sites get no special handling: when URLs change frequently or are useful to users, Google raises crawl demand and tries to raise its crawl capacity for the site, the same logic it applies to small sites."}
- {id: D1-C440, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:16, T:a-r3:15], ver: confirmed, src: [crawl-budget-guide], topics: [crawl-rate-limit],
   rel: [{type: answers, to: D1-C438}],
   text: "If a site's server cannot cope with the extra crawling that higher crawl demand brings, Google reduces its crawling of that site again."}
- {id: D1-C441, s: D1-S12, label: stage, who: audience, ev: [T:d1r3b:17, T:a-r3:16], ver: n/a, topics: [crawl-budget],
   text: "An audience member asked how to tell, from log files or by other methods, whether Google is spending crawl budget inefficiently on a site."}
- {id: D1-C442, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:18, T:a-r3:17], ver: undocumented, topics: [crawl-budget],
   rel: [{type: answers, to: D1-C441}],
   text: "Log files alone cannot show crawl inefficiency because they do not reveal where Google's crawl limit for the site lies; many similar URLs being crawled may not matter if the site is nowhere near that limit."}
- {id: D1-C443, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:18, T:a-r3:17], ver: consistent, src: [crawl-stats-help], topics: [crawl-budget, search-console-features],
   rel: [{type: answers, to: D1-C441}],
   text: "To judge crawl efficiency, check Search Console's Crawl Stats report: whether total crawling has plateaued over time, and whether the average response time shows the server is fast enough or is limiting Googlebot."}
- {id: D1-C444, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:19, T:a-r3:18], ver: consistent, src: [faceted-nav-guide], topics: [faceted-navigation, crawl-budget],
   rel: [{type: answers, to: D1-C441}, {type: extends, to: D1-C397}],
   text: "Log files are worth checking on sites with filter parameters or complicated URLs, because crawlers can easily wander off into URLs that make no sense for the site."}
- {id: D1-C445, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:19, T:a-r3:18], ver: consistent, src: [consolidate-duplicate-urls], topics: [faceted-navigation, duplicate-content],
   rel: [{type: answers, to: D1-C441}, {type: repeats, to: D1-C403}],
   text: "One fix for parameter variants of a URL is to work out the normalised URL and redirect the variants to it: the redirects cost crawl budget at first, but leave the site with a clean slate."}
- {id: D1-C446, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:20, T:a-r3:19], ver: undocumented, topics: [crawl-budget, faceted-navigation],
   text: "Many crawling complaints that reach Google's crawling team turn out to be caused by a plugin, for example a WordPress calendar plugin that adds calendar parameters to the URLs of every post, page, category and tag page."}
- {id: D1-C447, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:20, T:d1r3b:21, T:a-r3:19, T:a-r3:20], ver: consistent, src: [faceted-nav-guide], topics: [crawl-demand, crawl-budget],
   text: "Google crawls new URLs, such as plugin-generated calendar pages, because it wants to see what they are; its automated systems learn that such URLs are useless only from large samples, which takes time."}
- {id: D1-C448, s: D1-S12, label: stage, who: audience, ev: [T:d1r3b:22, T:a-r3:21], ver: n/a, topics: [measurement, search-console-data],
   text: "An audience member asked what changes to expect in Search Console's reporting on Google's AI features."}
- {id: D1-C449, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:23, T:a-r3:22], ver: n/a, topics: [measurement, search-console-data],
   rel: [{type: answers, to: D1-C448}],
   text: "A Google panelist said he expected more AI reporting to launch in Search Console, without a timeline or a promise, because many people at Google care about giving site owners the information to understand and adapt to what happens in Search."}
- {id: D1-C450, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:24, T:a-r3:23], ver: n/a, topics: [measurement, search-console-data],
   rel: [{type: answers, to: D1-C448}],
   text: "Google said reporting on AI features should not simply mirror classic search results, because users get more information before they click and interact with pages differently, so it first has to work out which data would be useful and actionable."}
- {id: D1-C451, s: D1-S12, label: stage, who: audience, ev: [T:d1r3b:25, T:a-r3:24], ver: n/a, topics: [measuring-ai-visibility],
   text: "An audience member asked for data on AI features as a feedback channel for improving content, as an alternative to prompt-tracking tools."}
- {id: D1-C452, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:26, T:a-r3:25], ver: consistent, src: [genai-perf-help], topics: [search-console-data, measuring-ai-visibility],
   rel: [{type: answers, to: D1-C451}],
   text: "Query data for AI features is hard to provide because people ask AI very different kinds of questions that do not map back to keywords as in classic search, and the data would have to be grouped to protect privacy while staying useful."}
- {id: D1-C453, s: D1-S12, label: stage, who: audience, ev: [T:d1r3b:27, T:a-r3:26], ver: n/a, topics: [llms-txt],
   text: "An audience member asked whether llms.txt matters, given that Google had said it does not while PageSpeed Insights and Lighthouse advocate it and audit tools ask site owners to create the file."}
- {id: D1-C454, s: D1-S12, label: stage, who: Gary Illyes, ev: [T:d1r3b:28, T:a-r3:27], ver: confirmed, src: [ai-optimization-guide], topics: [llms-txt],
   rel: [{type: answers, to: D1-C453}],
   text: "Gary Illyes said llms.txt does not matter for Google Search right now and that he does not expect it to, while adding that he had been wrong before."}
- {id: D1-C455, s: D1-S12, label: stage, who: Gary Illyes, ev: [T:d1r3b:28, T:a-r3:27], ver: consistent, src: [lighthouse-llms-txt], topics: [llms-txt],
   rel: [{type: answers, to: D1-C453}],
   text: "Gary Illyes said llms.txt matters to some people, which is why tools such as Lighthouse add checks for it, so both sides of the debate are right in their own context."}
- {id: D1-C456, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:29, T:a-r3:28], ver: n/a, topics: [llms-txt],
   rel: [{type: answers, to: D1-C453}],
   text: "A Google panelist said he knew of no plan for Google to use llms.txt, though it could happen, and that a possible future change is no reason to implement it now.",
   quote: "Just because maybe something will change in the future doesn't mean you should take action now.", quote_checked: true}
- {id: D1-C457, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:30, T:a-r3:29], ver: n/a, topics: [llms-txt],
   rel: [{type: answers, to: D1-C453}],
   text: "A Google panelist said most llms.txt files he had seen are generated automatically by a setting in SEO plugins, so if Google Search ever made llms.txt matter, a site could add one by ticking a checkbox."}
- {id: D1-C458, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:31, T:a-r3:30], ver: n/a, topics: [llms-txt],
   rel: [{type: answers, to: D1-C453}],
   text: "A Google panelist objected that llms.txt is designed for supposedly intelligent systems that should be able to parse a website.",
   quote: "it's designed for allegedly intelligent systems", quote_checked: true}
- {id: D1-C459, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:32, T:a-r3:31], ver: n/a, topics: [llms-txt, search-agents],
   rel: [{type: answers, to: D1-C453}],
   text: "A Google panelist compared llms.txt to the old meta keywords debate: an AI agent should not blindly trust what a site says about its own authority, just as a site calling itself the best car insurance site is no reason to stop looking at others."}
- {id: D1-C460, s: D1-S12, label: docs, ev: "", ver: source, src: [lighthouse-llms-txt], topics: [llms-txt],
   text: "Chrome's Lighthouse documentation lists an llms.txt audit among its agentic browsing audits: it flags a server error when llms.txt is fetched and marks the audit not applicable when the file is missing, because providing the file is optional for now."}
- {id: D1-C461, s: D1-S12, label: stage, who: audience, ev: T:d1r3b:33, ver: n/a, topics: [search-console-data, feature-requests],
   text: "An audience member asked whether and when crawl stats will be added to the Search Console API."}
- {id: D1-C462, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:34, T:a-r7:1], ver: consistent, src: [sc-api-reference], topics: [search-console-data],
   rel: [{type: answers, to: D1-C461}],
   text: "Google said it knew of no plans to add crawl stats to the Search Console API, because that would be a completely new part of the API."}
- {id: D1-C463, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:34, T:a-r7:1], ver: consistent, src: [sc-api-reference], topics: [search-console-data],
   rel: [{type: answers, to: D1-C461}],
   text: "A Google panelist said adding a report that is a variation of the Performance report to the Search Console API would be easier than adding crawl stats, because the Performance report is already in the API."}
- {id: D1-C464, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:34, T:a-r7:1], ver: n/a, topics: [search-console-data, feature-requests],
   rel: [{type: answers, to: D1-C461}],
   text: "Google's Search Relations team talks with the Search Console team about the API more than before, partly because with so many vibe-coded systems around it is very easy to just say 'use the Search Console API to do something', and it is annoying when Search Console has no API for that."}
- {id: D1-C465, s: D1-S12, label: stage, who: audience, ev: [T:d1r3b:37, T:a-r7:4], ver: n/a, topics: [crawl-budget, crawl-demand],
   text: "An audience member asked how a large news site can tell whether crawl budget is limiting how fast new articles are discovered (within minutes), and which statistics in Search Console and the logs show this."}
- {id: D1-C466, s: D1-S12, label: stage, who: Gary Illyes, ev: [T:d1r3b:38, T:a-r7:5], ver: consistent, src: [crawling-myths], topics: [crawl-demand, crawl-budget],
   rel: [{type: answers, to: D1-C465}, {type: repeats, to: D1-C381}],
   text: "Gary Illyes said news sites rarely need to worry about crawl budget, because Google crawls them aggressively given their constant flow of new content and new URLs."}
- {id: D1-C467, s: D1-S12, label: stage, who: Gary Illyes, ev: [T:d1r3b:38, T:d1r3b:53, T:a-r7:5, T:a-r7:22], ver: undocumented, topics: [crawl-budget, processing-times],
   rel: [{type: answers, to: D1-C465}],
   text: "To check that new content is crawled fast enough, Gary Illyes advised measuring the time between publishing a URL and Googlebot's first crawl of it: ideally it stays flat or falls, and only a rising trend calls for investigation."}
- {id: D1-C468, s: D1-S12, label: stage, who: Gary Illyes, ev: [T:d1r3b:39, T:a-r7:6], ver: consistent, src: [crawl-budget-guide, crawl-stats-help], topics: [crawl-budget],
   rel: [{type: answers, to: D1-C465}],
   text: "When new URLs are picked up more slowly, Gary Illyes advised checking the log files for URLs that Google crawls and recrawls a lot and judging whether they are useful."}
- {id: D1-C469, s: D1-S12, label: stage, who: Gary Illyes, ev: [T:d1r3b:39, T:a-r7:6], ver: consistent, src: [crawl-budget-guide], topics: [crawl-budget, crawl-directives, robots-txt],
   rel: [{type: answers, to: D1-C465}],
   text: "Gary Illyes said disallowing a section that should not be crawled, such as /ads, in a Googlebot group in robots.txt shifts crawl budget to the rest of the site."}
- {id: D1-C470, s: D1-S12, label: analysis, ev: "", ver: n/a, src: [crawl-budget-guide], topics: [crawl-budget, crawl-directives],
   rel: [{type: extends, to: D1-C469}],
   text: "Google's crawl budget guide says crawl budget freed by robots.txt blocks is not shifted to other pages unless the site already hits its crawl capacity limit, and advises against robots.txt for temporary reallocation; so block only sections you never want crawled, and expect a shift only on capacity-limited sites."}
- {id: D1-C471, s: D1-S12, label: stage, who: audience, ev: [T:d1r3b:40, T:a-r7:7], ver: n/a, topics: [llms-txt],
   text: "An audience question noted that a cats.txt file received more crawler requests than llms.txt in the server logs and asked how important that is."}
- {id: D1-C472, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:41, T:a-r7:8], ver: n/a, topics: [llms-txt],
   rel: [{type: answers, to: D1-C471}],
   text: "cats.txt was created by an SEO as a satirical take on llms.txt, to show that crawlers fetch whatever files they are given, so requests for llms.txt in server logs do not mean the file is important."}
- {id: D1-C473, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:41, T:a-r7:8], ver: consistent, src: [ai-optimization-guide], topics: [llms-txt],
   rel: [{type: answers, to: D1-C471}],
   text: "Files such as cats.txt have no importance for Google Search: if a site links to one, Googlebot will find and crawl it, but it has no other effect."}
- {id: D1-C474, s: D1-S12, label: stage, who: audience, ev: [T:d1r3b:42, T:a-r7:9], ver: n/a, topics: [sitemaps],
   text: "An audience member asked where the sweet spot is for a sitemap that misses nothing but does not overflow Search Console."}
- {id: D1-C475, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:43, T:a-r7:10], ver: confirmed, src: [build-sitemap], topics: [sitemaps],
   rel: [{type: answers, to: D1-C474}],
   text: "There is no sweet spot to find for a sitemap: technically it should list every URL you want indexed, so that Google can find each of them."}
- {id: D1-C476, s: D1-S12, label: stage, who: audience, ev: [T:d1r3b:44, T:a-r7:11], ver: n/a, topics: [site-moves],
   text: "An audience member asked how to plan a site migration so that it does not leave large numbers of URLs not indexed."}
- {id: D1-C477, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:45, T:a-r7:12], ver: consistent, src: [search-central-rename-blog], topics: [site-moves],
   rel: [{type: answers, to: D1-C476}],
   text: "In a migration about four or five years before the event, Google consolidated 12 or 14 of its blogs in different languages, a Help Center and its old developers site into one site."}
- {id: D1-C478, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:45, T:a-r7:12], ver: undocumented, topics: [site-moves],
   rel: [{type: answers, to: D1-C476}],
   text: "The first priority in Google's own site consolidation was to identify the popular URLs people care about and make sure the migration did not damage them."}
- {id: D1-C479, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:45, T:a-r7:12], ver: consistent, src: [site-move-with-url-changes], topics: [site-moves, duplicate-content],
   rel: [{type: answers, to: D1-C476}],
   text: "Where content was duplicated across languages, Google's own site consolidation redirected two language versions into one, giving both old URLs one target path to redirect to."}
- {id: D1-C480, s: D1-S12, label: analysis, ev: "", ver: n/a, src: [search-central-rename-blog], topics: [site-moves],
   rel: [{type: extends, to: D1-C477}],
   text: "The consolidation described on stage matches Google's November 2020 move from Google Webmasters to Google Search Central, which moved its main blog, 13 localized blogs and the Search help content of the Search Console Help Center to its developer site: about six years before the event, not the four or five said on stage."}
- {id: D1-C481, s: D1-S12, label: stage, who: audience, ev: [T:d1r3b:46, T:a-r7:15], ver: n/a, topics: [ai-crawlers-and-agents, google-extended],
   text: "An audience member asked whether Google plans dedicated user agents for AI, as OpenAI has several, so that site owners can control AI access separately from Googlebot and analyse it in their logs."}
- {id: D1-C482, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:47, T:a-r7:16], ver: consistent, src: [robots-spec], topics: [ai-crawlers-and-agents, robots-txt],
   rel: [{type: answers, to: D1-C481}],
   text: "Nearly all mainstream AI crawlers and AI systems use their own user agents, so robots.txt can set a separate policy for each; at the event OpenAI was said to have three or four, Anthropic a few and Microsoft some."}
- {id: D1-C483, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:47, T:a-r7:16], ver: n/a, topics: [ai-crawlers-and-agents],
   rel: [{type: answers, to: D1-C481}],
   text: "A Google panelist doubted that setting different robots.txt policies per AI crawler makes practical sense yet, because nobody knows how these systems will develop."}
- {id: D1-C484, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:48, T:a-r7:17], ver: n/a, topics: [ai-crawlers-and-agents, genai-optout],
   rel: [{type: answers, to: D1-C481}],
   text: "A Google panelist called blocking all AI crawlers while allowing search crawlers such as Googlebot, Bingbot and Applebot a personal, philosophical decision that every site owner can make."}
- {id: D1-C485, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:48, T:a-r7:17], ver: confirmed, src: [common-crawlers], topics: [google-extended, genai-optout],
   rel: [{type: answers, to: D1-C481}],
   text: "To opt out of Google's AI training, a site can use the Google-Extended token in robots.txt."}
- {id: D1-C486, s: D1-S12, label: analysis, ev: "", ver: n/a, src: [common-crawlers], topics: [google-extended, genai-optout],
   text: "The panel spoke of blocking Google's 'AI crawling or training' with Google-Extended, but Google documents Google-Extended as a usage token, not a crawler: disallowing it does not stop Googlebot fetching pages and only controls use for Gemini training and grounding."}
- {id: D1-C487, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:48, T:a-r7:17], ver: undocumented, topics: [genai-optout, ai-crawlers-and-agents],
   rel: [{type: answers, to: D1-C481}],
   text: "A Google panelist said Apple offers a robots.txt control for Applebot similar to Google-Extended, so a site can allow Applebot for search while opting out of Apple's AI use."}
- {id: D1-C488, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:49, T:a-r7:18], ver: undocumented, topics: [ai-crawlers-and-agents, robots-txt],
   rel: [{type: answers, to: D1-C481}],
   text: "When logs show an unknown crawler fetching a lot, search for its user agent online to find the robots.txt token that controls it; the mainstream crawlers that send the most traffic can all be controlled this way."}
- {id: D1-C489, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:50, T:a-r7:19], ver: n/a, topics: [robots-txt, ai-crawlers-and-agents],
   rel: [{type: answers, to: D1-C481}],
   text: "A Google panelist called a default-deny robots.txt, which blocks every crawler and allows only chosen ones, a bad pattern because the site owner does not know what is being blocked.",
   quote: "Personally, I think that's a bad pattern, because you don't know what you're blocking.", quote_checked: true}
- {id: D1-C490, s: D1-S12, label: stage, who: audience, ev: [T:d1r3b:51, T:a-r7:20], ver: n/a, topics: [pagination],
   text: "An audience member asked what happens to thousands of crawled and indexed paginated category and tag pages if they are replaced by a single page with a JavaScript load-more button, and whether the old pages should then redirect to the canonical first page."}
- {id: D1-C491, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:52, T:a-r7:21], ver: confirmed, src: [pagination-guide], topics: [pagination, crawlable-links],
   rel: [{type: answers, to: D1-C490}],
   text: "If paginated pages are replaced by a load-more button or infinite scroll without crawlable links to them, Google will not see the further pages at all.",
   quote: "Googlebot is not running around clicking on buttons", quote_checked: true}
- {id: D1-C492, s: D1-S12, label: stage, who: John Mueller, ev: [T:d1r3b:54, T:a-r7:23], ver: consistent, src: [crawl-stats-help], topics: [crawl-budget, search-console-features],
   text: "John Mueller said the Crawl Stats report's split of crawling by purpose, discovery versus refresh, gives a rough view of whether discovery crawling is in a reasonable range, though measuring publish-to-first-crawl time is more accurate."}
# (from the real audio, v2.7.0: the question that the next two answers reply to; it was garbled in the second recording)
- {id: D1-C545, s: D1-S12, label: stage, who: audience, ev: T:a-r7:24, ver: n/a, topics: [crawl-budget, crawl-rate-limit, crawl-demand],
   text: "An audience member asked, for very large sites of about 100 million pages, what signs show that a site is limited by crawl budget, and how to tell a crawl capacity limit problem from a crawl demand problem."}
- {id: D1-C493, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:56, T:a-r7:25], ver: consistent, src: [crawl-stats-help, crawl-budget-guide], topics: [crawl-rate-limit, crawl-demand],
   rel: [{type: answers, to: D1-C545}],
   text: "There is no easy way to tell whether a drop in Google's crawling comes from lower crawl demand or a lower crawl capacity limit; most of the time a capacity-limit drop is an abrupt step down."}
- {id: D1-C494, s: D1-S12, label: stage, who: unknown, ev: [T:d1r3b:56, T:a-r7:25], ver: consistent, src: [crawl-budget-guide], topics: [crawl-rate-limit],
   rel: [{type: answers, to: D1-C545}],
   text: "To check whether Google lowered a site's crawl capacity limit, look at the number of connections Googlebot opens to the site: if it has dropped, the capacity limit changed."}
- {id: D1-C114, s: D1-S12, label: stage, who: unknown, ev: [notes, T:a-r7:21, T:d1r3b:52], ver: consistent, src: [pagination-guide], topics: [pagination],
   rel: [{type: answers, to: D1-C490}],
   text: "A Google panelist called pagination one of the trickiest things in web development and said switching to infinite scroll or a load-more button is risky, depending on what you want to achieve, because Googlebot does not click buttons.",
   quote: "the infinite scrolling or load more thing is kind of dangerous, depending on what you want to achieve", quote_checked: true}
# ----- From the real audio recordings (added in v2.7.0) -----
- {id: D1-C538, s: D1-S12, label: stage, who: unknown, ev: T:a-r3:15, ver: consistent, src: [crawl-budget-guide], topics: [crawl-demand, crawl-rate-limit],
   rel: [{type: extends, to: D1-C439}, {type: extends, to: D1-C334}],
   text: "A Google panelist said crawl demand is not only Search's: when enough of a site's URLs are wanted by Search, Google Ads or another Google product, Google raises the site's crawl demand and crawls up to that level of demand as far as the site's crawl capacity allows."}
- {id: D1-C539, s: D1-S12, label: stage, who: unknown, ev: T:a-r3:20, ver: consistent, src: [crawl-budget-guide, faceted-nav-guide], topics: [crawl-budget, faceted-navigation],
   rel: [{type: extends, to: D1-C447}, {type: extends, to: D1-C446}],
   text: "A Google panelist said useless plugin-generated parameter URLs can be handled at the web server, for example with a rule or a custom module in Apache, which saves crawl budget so that Google may pick up the URLs that matter instead (the exact mechanism is not clear in the recording)."}
- {id: D1-C540, s: D1-S12, label: stage, who: unknown, ev: [T:a-r7:12, T:a-r7:13], ver: consistent, src: [site-move-with-url-changes], topics: [site-moves, sitemaps],
   rel: [{type: answers, to: D1-C476}],
   text: "Asked how to plan a migration that does not leave many URLs unindexed, a Google panelist said the answer is probably not sitemaps: decide what matters from the business's perspective (for example whether to consolidate languages); listing the new URLs in a sitemap is probably a good idea and cannot hurt, but it is not the main tool."}
- {id: D1-C541, s: D1-S12, label: stage, who: unknown, ev: T:a-r7:13, ver: undocumented, topics: [site-moves, javascript-seo],
   rel: [{type: extends, to: D1-C479}],
   text: "A Google panelist said, as a fun fact, that JavaScript was used for the language-consolidation redirects in Google's own site migration, because it was the only option available to the person doing it (the recording does not make fully clear whether the JavaScript performed the redirects or built the mapping)."}
- {id: D1-C542, s: D1-S12, label: analysis, ev: "", ver: n/a, src: [redirects-guide, site-move-with-url-changes], topics: [site-moves, javascript-seo],
   rel: [{type: extends, to: D1-C541}],
   text: "Google's redirects guide says Google Search follows JavaScript location redirects only after rendering, may never see one if rendering fails, and should be used only when server-side or meta refresh redirects are impossible; its site move guide asks for server-side permanent redirects (301 or 308) where technically possible. The JavaScript in Google's own migration was a fallback ('my only option'), not a pattern to copy."}
- {id: D1-C543, s: D1-S12, label: stage, who: Gary Illyes, ev: T:a-r7:22, ver: undocumented, topics: [crawl-budget, processing-times],
   rel: [{type: extends, to: D1-C467}],
   text: "Gary Illyes said that if the time from publishing to Googlebot's first crawl starts rising, how much it rises matters: for the crawling of fresh stories, something like two hours is probably not great (a smaller example figure is unclear in the recording)."}
- {id: D1-C544, s: D1-S12, label: stage, who: John Mueller, ev: T:a-r7:23, ver: consistent, src: [crawl-stats-help], topics: [crawl-budget, search-console-features],
   rel: [{type: extends, to: D1-C492}],
   text: "John Mueller said that if the Crawl Stats report shows about half of a site's crawling going to discovering new pages, that is a lot of discovery crawling, which suggests that crawling of new pages is not the problem."}
- {id: D1-C546, s: D1-S12, label: stage, who: unknown, ev: T:a-r7:25, ver: consistent, src: [crawl-budget-guide], topics: [crawl-rate-limit],
   rel: [{type: answers, to: D1-C545}, {type: extends, to: D1-C374}],
   text: "A Google panelist illustrated a crawl capacity limit drop as a step down in the site's hostload, for example from 10 to 5, which the panelist said means Googlebot then makes up to five requests per second (the recording adds 'per connection', which is unclear)."}
- {id: D1-C547, s: D1-S12, label: analysis, ev: "", ver: n/a, src: [crawl-budget-guide], topics: [crawl-rate-limit],
   rel: [{type: extends, to: D1-C546}],
   text: "Google's crawl budget guide does not express the crawl capacity limit in requests per second: it limits the total time a server spends holding connections open for Google, counting both the number of parallel connections and their duration. That fits the panel's advice to watch how many connections Googlebot opens (D1-C494): fewer connections is the documented form of a lower capacity limit."}

# ---------- D1-S00 From the floor (session not recorded) ----------
- {id: D1-C111, s: D1-S00, label: stage, who: Gary Illyes, ev: notes, ver: consistent, src: [duplicate-content-penalty-blog, canonicalization], topics: [duplicate-content],
   text: "Gary Illyes said there is no such thing as a duplicate content penalty."}
- {id: D1-C112, s: D1-S00, label: press, ev: "", ver: source, src: [sej-duplicate-urls], topics: [duplicate-content],
   text: "As reported by Search Engine Journal, John Mueller said in April 2026 that there is no penalty or ranking demotion for having multiple URLs with the same content; Google picks one to keep.",
   quote: "There's no penalty or ranking demotion if you have multiple URLs going to the same content."}
- {id: D1-C128, s: D1-S00, label: docs, ev: "", ver: source, src: [canonicalization], topics: [duplicate-content, canonical-selection],
   text: "Google's canonicalization guide says some duplicate content on a site is normal and not a violation of its spam policies; Google clusters duplicate pages, picks the most representative one as canonical and crawls the duplicates less often.",
   quote: "Some duplicate content on a site is normal and it's not a violation of Google's spam policies."}
- {id: D1-C113, s: D1-S00, label: analysis, ev: "", ver: n/a, topics: [duplicate-content],
   text: "The real cost of duplicates is control and crawling: Google may choose a canonical you did not want, and every copy is still crawled. Copied or scraped content is a separate spam-policy issue."}
- {id: D1-C115, s: D1-S00, label: docs, ev: "", ver: source, src: [pagination-guide], topics: [pagination],
   text: "Google's crawlers do not click buttons. Each page in a series needs its own URL and an <a href> link to the next page, should not use page 1 as its canonical, and rel=next and rel=prev are no longer used."}
- {id: D1-C116, s: D1-S00, label: stage, ev: notes, ver: n/a, topics: [images],
   text: "Images were stressed as important."}
- {id: D1-C117, s: D1-S00, label: analysis, ev: "", ver: n/a, topics: [images],
   text: "With one in six AI Mode searches being multimodal, original images with descriptive file names, alt text and captions feed AI answers as well as image search."}
- {id: D1-C118, s: D1-S00, label: stage, ev: [notes, T:d1r2b:10, T:a-lt:59], ver: consistent, src: [ai-optimization-guide], topics: [accessibility],
   text: "Attendees were told to check ARIA and accessibility."}
- {id: D1-C131, s: D1-S00, label: docs, ev: "", ver: source, src: [ai-optimization-guide], topics: [accessibility],
   text: "Google's guide for generative AI features says browser agents may read a site through screenshots, the DOM structure and the accessibility tree, and recommends semantic HTML because it helps users such as screen reader users navigate a page."}
- {id: D1-C119, s: D1-S00, label: analysis, ev: "", ver: n/a, topics: [accessibility],
   text: "Google has not called ARIA a ranking signal. The case for it is that AI agents and assistive tools read pages through the same structure: real buttons, labelled forms and semantic headings."}
- {id: D1-C121, s: D1-S00, label: stage, ev: notes, ver: n/a, topics: [seo-scope],
   text: "SEO is not only content; it has many parts."}
- {id: D1-C122, s: D1-S00, label: stage, ev: notes, ver: undocumented, topics: [rich-results],
   text: "Check and focus on rich results for Google."}
- {id: D1-C060, s: D1-S00, label: stage, ev: [notes, T:d1r2b:2, T:d1r3b:28, T:d1r3b:31, T:d1r3b:41, T:a-lt:51, T:a-r3:27, T:a-r3:30, T:a-r7:8], ver: n/a, topics: [llms-txt],
   text: "Speakers at the event were openly dismissive of llms.txt."}
- {id: D1-C075, s: D1-S00, label: stage, ev: notes, ver: consistent, src: [crawlers-overview], topics: [http-protocols],
   text: "Googlebot does not support HTTP/3 today."}
- {id: D1-C076, s: D1-S00, label: docs, ev: "", ver: source, src: [crawlers-overview], topics: [http-protocols],
   text: "Google's crawlers support HTTP/1.1 and HTTP/2, use whichever gives the best crawling performance, and may switch between sessions. HTTP/2 can save server resources but gives no ranking benefit."}
- {id: D1-C077, s: D1-S00, label: analysis, ev: "", ver: n/a, topics: [http-protocols],
   text: "This does not mean avoiding HTTP/3, which benefits browsers. The rule is never to run a host that only answers over HTTP/3, and to check that CDN or firewall rules written for HTTP/3 traffic do not break HTTP/1.1 and HTTP/2."}
- {id: D1-C139, s: D1-S00, label: docs, ev: "", ver: source, src: [crawlers-overview], topics: [http-protocols],
   text: "Google's crawler overview says HTTP/1.1 is the default protocol of Google's crawlers and that a site can opt out of crawling over HTTP/2 by answering Google's HTTP/2 requests with a 421 status code."}
