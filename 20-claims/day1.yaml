# ---------- D1-S01 Opening keynote ----------
- {id: D1-C001, s: D1-S01, label: slide, ev: [IMG_4625, T:d1r1a:12, T:a-vp:9], ver: n/a, topics: [search-evolution],
   text: "The keynote showed a slide quoting Elizabeth Reid (VP, Search) saying Search is never a solved problem because the internet and the world keep changing.",
   quote: "Search is never a solved problem. Old challenges evolve and new challenges are constantly popping up — because the internet and the world are always changing.", quote_checked: true}
- {id: D1-C002, s: D1-S01, label: slide, ev: [IMG_4626, T:d1r1a:14, T:a-vp:11], ver: n/a, topics: [search-evolution],
   text: "Google named three forces driving the evolution of Search: new platforms (closed-garden apps taking information needs from the open web), new user preferences (personalised, authentic, visual, easy-to-parse content) and new technologies (AI and ML)."}
- {id: D1-C003, s: D1-S01, label: slide, ev: [IMG_4627, T:d1r1a:34, T:a-vp:31], ver: n/a, topics: [search-evolution],
   text: "The stated theme guiding the future of Search is making it effortless to find helpful information.",
   quote: "Making it effortless to find helpful information", quote_checked: true}
- {id: D1-C004, s: D1-S01, label: slide, ev: [IMG_4628, T:d1r1a:28, T:a-vp:25], ver: undocumented, topics: [ai-overviews-usage],
   text: "Google says users like AI Overviews and search more because of them, with early feedback overwhelmingly positive and satisfaction highest among 18–24 year olds."}
- {id: D1-C005, s: D1-S01, label: slide, ev: [IMG_4628, T:d1r1a:23, T:a-vp:20], ver: undocumented, topics: [ai-overviews-usage],
   text: "Google says AI Overviews help with new types of questions and lead users to visit a greater diversity of sites, with more total sites shown on the results page."}
- {id: D1-C006, s: D1-S01, label: slide, ev: [IMG_4629, T:d1r1a:24, T:a-vp:21], ver: confirmed, src: [ai-personalization-shopping-blog], topics: [ai-mode-usage],
   text: "Google reports more than 5 trillion searches per year."}
- {id: D1-C135, s: D1-S01, label: slide, ev: [IMG_4629, T:d1r1a:22, T:a-vp:19], ver: n/a, topics: [ai-mode-usage],
   text: "Google's opening slide described AI as driving an expansionary moment for Search."}
- {id: D1-C007, s: D1-S01, label: slide, ev: [IMG_4629, T:d1r1a:29, T:a-vp:26], ver: undocumented, topics: [ai-mode-usage],
   text: "Google says 94% of frequent LLM users are also frequent users of Google Search, as evidence that AI is growing search use rather than replacing it."}
- {id: D1-C008, s: D1-S01, label: slide, ev: [IMG_4630, T:d1r1a:30, T:a-vp:27], ver: undocumented, topics: [ai-mode-usage],
   text: "Google says 71% of shoppers coming to Google Search agree they are open to trying new brands or products (the slide footnote cites a Google-commissioned Ipsos global consumer survey), and that people use Search to figure out what they want, not only to find what they already know."}
- {id: D1-C009, s: D1-S01, label: slide, ev: [IMG_4631, T:d1r1a:34, T:a-vp:31], ver: n/a, topics: [search-evolution],
   text: "Google quoted Larry Page from 2000 on the ultimate search engine understanding exactly what you mean, adding that it has never been closer to making this a reality."}
- {id: D1-C010, s: D1-S01, label: slide, ev: [IMG_4632, T:d1r1a:35, T:d1r1a:20, T:a-vp:32, T:a-vp:17], ver: n/a, topics: [ecosystem-principles],
   text: "Ecosystem principle 1, consistent testing: features are tested and woven into core Search when ready."}
- {id: D1-C011, s: D1-S01, label: slide, ev: [IMG_4632, T:d1r1a:36, T:a-vp:33], ver: n/a, topics: [ecosystem-principles],
   text: "Ecosystem principle 2, the SERP will evolve: besides organic links and ads, it will hold other elements such as videos and cards."}
- {id: D1-C012, s: D1-S01, label: slide, ev: [IMG_4632, T:d1r1a:37, T:d1r1a:40, T:a-vp:34, T:a-vp:37], ver: n/a, topics: [ecosystem-principles],
   text: "Ecosystem principle 3, multiple user needs: some users want links, some quick answers, some depth; Google says it will keep prioritising traffic to the ecosystem."}
- {id: D1-C013, s: D1-S01, label: slide, ev: [IMG_4632, T:d1r1a:38, T:a-vp:35], ver: consistent, src: [helpful-content], topics: [ecosystem-principles, helpful-content],
   text: "Ecosystem principle 4, incentivise high-quality content: content made for Search will not be successful.",
   quote: "\"Made for Search\" content will not be successful, as we'll work to incentivise high-quality content.", quote_checked: true}
- {id: D1-C014, s: D1-S01, label: slide, ev: [IMG_4632, T:d1r1a:39, T:a-vp:36], ver: n/a, topics: [ecosystem-principles],
   text: "Ecosystem principle 5, traffic patterns may fluctuate: long-held traffic patterns are likely to change, which Google frames as new opportunities for all sites."}
- {id: D1-C015, s: D1-S01, label: analysis, ev: "", ver: n/a, topics: [ecosystem-principles, ai-mode-usage],
   text: "Principle 5 is the one to plan around. Growth is in brainstorming, 'which' and planning queries, which are comparison-style needs that a page answering a single keyword fits poorly."}
- {id: D1-C059, s: D1-S01, label: stage, who: Lino Cattaruzzi, ev: [notes, T:d1r1a:41, T:a-vp:38], ver: n/a, topics: [helpful-content],
   text: "The opening keynote closed with the advice to think about UEO, user engine optimisation, next to SEO and GEO: focus on the user and the rest will follow."}
