# ---------- D2-S02 Welcome to indexing day! ----------
# ----- Q1: HTML sitemaps for large sites (IMG_4693) -----
- {id: D2-C001, s: D2-S02, label: slide, who: audience, ev: IMG_4693, ver: n/a, topics: [sitemaps, url-discovery],
   text: "An audience member asked whether HTML sitemaps still matter for large sites, whether they improve Googlebot's crawl discovery and whether they pass link equity to deeper pages."}
- {id: D2-C002, s: D2-S02, label: slide, ev: IMG_4693, ver: undocumented, topics: [url-discovery, sitemaps],
   rel: [{type: answers, to: D2-C001}],
   text: "Google answered on a Q&A slide that good HTML sitemaps are hard to make for large sites.",
   quote: "It's hard to make good HTML sitemaps for large sites.", quote_checked: true}
- {id: D2-C820, s: D2-S02, label: slide, ev: [IMG_4693, T:d2r1a:3], ver: consistent, src: [how-search-works, ecommerce-site-structure], topics: [url-discovery, sitemaps],
   rel: [{type: answers, to: D2-C001}, {type: extends, to: D1-C040}, {type: extends, to: D1-C202}],
   text: "Google's Q&A slide advised large sites to rely on hub pages, such as category pages, that link out to their important pages, instead of on HTML sitemaps.",
   quote: "Better rely on hubs like category pages that link out to your important pages.", quote_checked: true}
- {id: D2-C003, s: D2-S02, label: slide, ev: IMG_4693, ver: n/a, topics: [url-discovery],
   rel: [{type: answers, to: D2-C001}],
   text: "Google's Q&A slide on HTML sitemaps added that category hub pages linking to a site's important pages have the extra benefit that they may also be useful to users."}
- {id: D2-C004, s: D2-S02, label: analysis, ev: "", ver: n/a, topics: [url-discovery, sitemaps],
   text: "Google's answer did not say whether HTML sitemaps pass link equity. On a large site, check that every important page is linked from a category or hub page in the normal navigation instead of relying on an HTML sitemap page to reach it."}
- {id: D2-C005, s: D2-S02, label: docs, ev: "", ver: source, src: [ecommerce-site-structure], topics: [url-discovery, sitemaps],
   text: "Google's ecommerce documentation recommends linking from menus to category pages, from category pages to sub-category pages and from sub-category pages to all product pages; where not every product can be linked, it recommends a sitemap or a Merchant Center feed."}
- {id: D2-C006, s: D2-S02, label: docs, ev: "", ver: source, src: [ecommerce-site-structure], topics: [url-discovery],
   text: "Google's ecommerce documentation says Google can infer a page's relative importance within a site from its internal links, such as how many links point to the page and how many links Google must follow to reach it."}
- {id: D2-C007, s: D2-S02, label: docs, ev: "", ver: source, src: [html-sitemap-blog], topics: [sitemaps, url-discovery],
   text: "A 2005 Search Central blog post, now marked as possibly outdated, said Google encouraged HTML sitemaps because they help users navigate a site and a clear hierarchy of text links helps Google index it."}
- {id: D2-C008, s: D2-S02, label: analysis, ev: "", ver: n/a, topics: [sitemaps, url-discovery],
   text: "Google's view of HTML sitemaps has moved: a 2005 blog post encouraged them, the current sitemap and ecommerce documentation does not mention them, and the 2026 Q&A slide pointed large sites to category hub pages instead."}
# ----- Q2: out-of-stock product pages (IMG_4694) -----
- {id: D2-C009, s: D2-S02, label: slide, who: audience, ev: [IMG_4694, T:d2r1a:6], ver: n/a, topics: [site-moves],
   text: "An audience member asked whether a product detail page that is out of stock for two to three months should keep returning 200 with links to similar products, or be 302-redirected to a similar product or to its parent product listing page."}
- {id: D2-C010, s: D2-S02, label: slide, ev: [IMG_4694, T:d2r1a:7], ver: undocumented, topics: [site-moves],
   rel: [{type: answers, to: D2-C009}],
   text: "Google answered on a Q&A slide that whether to keep a temporarily out-of-stock product page or redirect it depends on how important that product page is to users.",
   quote: "It depends on the importance of the PDPs to the users.", quote_checked: true}
- {id: D2-C011, s: D2-S02, label: slide, ev: [IMG_4694, T:d2r1a:7], ver: consistent, src: [pause-online-business], topics: [site-moves],
   rel: [{type: answers, to: D2-C009}],
   text: "Google's Q&A slide on out-of-stock product pages said users might wait months for some products, or even pre-order them if the site offers pre-ordering."}
- {id: D2-C012, s: D2-S02, label: docs, ev: "", ver: source, src: [pause-online-business], topics: [site-moves, merchant-markup],
   text: "Google's guide to temporarily pausing an online business recommends that a shop expecting to sell again within weeks or months stays online with limited functionality, such as a disabled cart, and updates its Product structured data to show current availability."}
- {id: D2-C013, s: D2-S02, label: docs, ev: "", ver: source, src: [redirects-guide], topics: [site-moves],
   text: "Google's redirect documentation says that with a temporary redirect, such as a 302, Google Search shows the source page in search results and does not use the redirect as a signal that the target should be canonical."}
- {id: D2-C014, s: D2-S02, label: analysis, ev: "", ver: n/a, topics: [site-moves],
   text: "Keep a product page that is out of stock for a few months live with a 200 status, show its availability on the page and in Product structured data, and offer pre-ordering where possible when users would wait for the product. Redirect it only when users would rather switch to a similar product than wait."}
# ----- Q3: sitemap line in robots.txt (IMG_4695) -----
- {id: D2-C015, s: D2-S02, label: slide, who: audience, ev: [IMG_4695, T:d2r1a:8], ver: n/a, topics: [sitemaps, robots-txt],
   text: "An audience member asked whether the sitemap link should be included in robots.txt, noting that many websites include it but that it was missing from an earlier robots.txt slide by a Google speaker, which the question called 'Gary's slide'."}
- {id: D2-C017, s: D2-S02, label: slide, ev: [IMG_4695, T:d2r1a:9], ver: confirmed, src: [robots-spec], topics: [sitemaps, robots-txt],
   rel: [{type: answers, to: D2-C015}, {type: extends, to: D1-C084}, {type: extends, to: D1-C079}],
   text: "Google answered on a Q&A slide that a sitemap listed in the robots.txt file can be picked up by any crawler, not only by Google's.",
   quote: "If it's included in the robots.txt file, any crawler can pick your sitemaps up", quote_checked: true}
- {id: D2-C018, s: D2-S02, label: slide, ev: [IMG_4695, T:d2r1a:9], ver: consistent, src: [build-sitemap], topics: [sitemaps],
   rel: [{type: answers, to: D2-C015}],
   text: "Google's Q&A slide said that a sitemap not listed in robots.txt has to be submitted instead, for example in Search Console."}
# ----- Q4: robots.txt block versus noindex (IMG_4696) -----
- {id: D2-C019, s: D2-S02, label: slide, who: audience, ev: [IMG_4696, T:d2r1a:10], ver: n/a, topics: [crawl-directives, robots-txt, robots-meta-tag],
   text: "An audience member noted that a robots.txt block does not mean noindex and that explaining this to developers is a constant struggle, and asked why Google does not treat a robots.txt block as a noindex."}
- {id: D2-C020, s: D2-S02, label: slide, ev: [IMG_4696, T:d2r1a:11], ver: undocumented, topics: [crawl-directives, robots-txt],
   rel: [{type: answers, to: D2-C019}, {type: extends, to: D1-C110}],
   text: "Google answered on a Q&A slide that it does not treat a robots.txt disallow as a noindex because some extremely important sites disallow their most important pages, by accident or out of ignorance.",
   quote: "Simply put, it's because of sites that are extremely important and like to disallow their most important pages, either accidentally or out of ignorance.", quote_checked: true}
- {id: D2-C021, s: D2-S02, label: slide, ev: [IMG_4696, T:d2r1a:11], ver: confirmed, src: [robots-intro, no-page-information-help], topics: [crawl-directives, robots-txt],
   rel: [{type: answers, to: D2-C019}, {type: extends, to: D1-C105}],
   text: "Google's Q&A slide said Google does not index the content of pages disallowed in robots.txt, but users will still find the URLs of those pages in Search."}
- {id: D2-C022, s: D2-S02, label: docs, ev: "", ver: source, src: [block-indexing-noindex], topics: [robots-meta-tag, crawl-directives, robots-txt],
   rel: [{type: extends, to: D1-C106}],
   text: "Google's noindex documentation says the noindex rule works only if the page is not blocked by robots.txt: a crawler that cannot fetch the page never sees the rule, and the page can still appear in search results, for example if other pages link to it."}
- {id: D2-C023, s: D2-S02, label: analysis, ev: "", ver: n/a, topics: [crawl-directives, robots-meta-tag, robots-txt],
   text: "Explain robots.txt and noindex to developers as two separate controls: robots.txt controls crawling, noindex controls indexing. To keep a page out of Search, let Google crawl it and serve noindex; a robots.txt disallow alone can leave the bare URL in results."}
- {id: D2-C833, s: D2-S02, label: docs, ev: "", ver: source, src: [build-sitemap], topics: [sitemaps],
   text: "Google's sitemap guide says Google uses lastmod only when it is consistently and verifiably accurate, and counts a change to the main content, the structured data or the links of a page as significant, but not a changed copyright date."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D2-C838, s: D2-S02, label: stage, who: unknown, ev: T:d2r1a:3, ver: consistent, src: [ecommerce-site-structure], topics: [sitemaps, url-discovery],
   rel: [{type: answers, to: D2-C001}, {type: extends, to: D2-C820}],
   text: "Answering whether HTML sitemaps still matter for large sites, Google said a site that wants one can make one, but that the effort is better spent on hub pages such as category pages.",
   quote: "if you want to make one, knock yourself out, but I will focus on some better things like hub pages, category pages"}
- {id: D2-C839, s: D2-S02, label: stage, who: audience, ev: T:d2r1a:4, ver: n/a, topics: [site-moves],
   text: "An audience member asked how several sloppy migrations on the same domain can affect Googlebot's crawling."}
- {id: D2-C840, s: D2-S02, label: stage, who: unknown, ev: T:d2r1a:5, ver: consistent, src: [site-move-with-url-changes], topics: [site-moves],
   rel: [{type: answers, to: D2-C839}],
   text: "Google answered that several sloppy migrations on one domain can cause many effects in the short term, and noted that migrations concern indexing as well as crawling, a subject a later Day 2 talk would cover."}
- {id: D2-C841, s: D2-S02, label: stage, who: unknown, ev: T:d2r1a:7, ver: undocumented, topics: [site-moves],
   rel: [{type: answers, to: D2-C009}, {type: extends, to: D2-C010}],
   text: "Google contrasted out-of-stock products a buyer will wait for, such as a rare watch battery that matters to them, with easily replaced products, such as a particular cheese, for which the buyer simply picks a similar product instead of waiting."}
- {id: D2-C842, s: D2-S02, label: stage, who: unknown, ev: T:d2r1a:9, ver: confirmed, src: [build-sitemap, robots-spec], topics: [sitemaps, robots-txt],
   rel: [{type: answers, to: D2-C015}, {type: extends, to: D1-C084}],
   text: "Google said listing the sitemap in robots.txt is fine, as many websites do.",
   quote: "you can include it in robots.txt. No problem whatsoever."}
- {id: D2-C843, s: D2-S02, label: stage, who: unknown, ev: T:d2r1a:9, ver: consistent, src: [create-robots-txt, robots-spec], topics: [sitemaps, robots-txt],
   rel: [{type: answers, to: D2-C015}, {type: extends, to: D2-C017}],
   text: "Google pointed out the trade-off of listing a sitemap in robots.txt: anyone can then see the sitemap, which a site may not want."}
- {id: D2-C844, s: D2-S02, label: stage, who: unknown, ev: T:d2r1a:11, ver: undocumented, src: [robots-intro], topics: [robots-txt, crawl-directives],
   rel: [{type: answers, to: D2-C019}, {type: extends, to: D2-C020}],
   text: "Google illustrated why it does not treat a robots.txt disallow as noindex with an extremely important site, such as a national tax authority, that blocks very important PDF files with robots.txt: Google cannot index the PDFs' content but can at least show their URLs in search results."}
- {id: D2-C845, s: D2-S02, label: stage, who: unknown, ev: T:d2r1a:11, ver: undocumented, topics: [robots-txt, index-selection],
   rel: [{type: answers, to: D2-C019}],
   text: "Google said very few URLs disallowed by robots.txt are in its index, compared with the index as a whole (no figure given)."}
- {id: D2-C846, s: D2-S02, label: stage, who: unknown, ev: T:d2r1a:11, ver: consistent, src: [robots-intro], topics: [robots-txt, crawl-directives, index-selection],
   rel: [{type: answers, to: D2-C019}, {type: extends, to: D2-C021}, {type: extends, to: D1-C110}],
   text: "Google said a URL disallowed by robots.txt might still be indexed if the URL is important, in which case the URL is indexed but not its content.",
   quote: "if a URL is important, then it might get indexed even if it's disallowed by robots.txt. So the URL gets indexed, not the content."}
- {id: D2-C847, s: D2-S02, label: stage, who: unknown, ev: T:d2r1a:12, ver: n/a, topics: [pipeline-overview, crawl-pipeline],
   rel: [{type: repeats, to: D1-C317}],
   text: "Opening Day 2, Google recapped that Day 1 began with how Search works and then covered crawling, including basics of how the internet works such as TCP/IP, so that attendees could understand how crawlers work."}
- {id: D2-C848, s: D2-S02, label: stage, who: unknown, ev: T:d2r1a:13, ver: consistent, src: [robots-intro, robots-spec], topics: [robots-txt, crawl-budget],
   rel: [{type: repeats, to: D1-C329}],
   text: "Google said it strongly believes site owners should be able to opt out of crawling and control how their site is crawled, which can matter for legal reasons or for crawl budget."}
- {id: D2-C849, s: D2-S02, label: analysis, ev: "", ver: n/a, topics: [robots-txt, crawl-directives, index-selection],
   rel: [{type: extends, to: D1-C110}],
   text: "Google's robots.txt introduction names links from elsewhere on the web as the reason a disallowed URL can still be indexed, while on stage Google spoke of the URL's importance; either way, well-linked important URLs are the disallowed ones most likely to appear in results, so keep such pages crawlable with noindex if they must stay out of Search."}

# ---------- D2-S03 How is HTML interpreted ----------
- {id: D2-C024, s: D2-S03, label: slide, ev: IMG_4697, ver: undocumented, topics: [indexing-pipeline, crawl-pipeline, crawl-rate-limit],
   rel: [{type: extends, to: D1-C063}, {type: extends, to: D1-C064}, {type: extends, to: D1-C092}],
   text: "A Google slide titled Data from Crawling showed an example of what the crawler passes on for processing: the fetch result, the connect time and the time to first byte in milliseconds, the robots policies that apply to the fetch, and the raw HTTP response with the page's HTML."}
- {id: D2-C025, s: D2-S03, label: slide, ev: IMG_4697, ver: consistent, src: [common-crawlers], topics: [google-extended, indexing-pipeline],
   rel: [{type: extends, to: D1-C086}, {type: extends, to: D1-C064}, {type: extends, to: D1-C522}],
   text: "In Google's example fetch record, the robots policies that apply to a fetch, shown as the value opt-out-google-extended, travel with the fetched page into processing."}
- {id: D2-C026, s: D2-S03, label: slide, ev: IMG_4698, ver: consistent, src: [how-search-works], topics: [indexing-pipeline, pipeline-overview],
   rel: [{type: extends, to: D1-C036}, {type: extends, to: D1-C063}],
   text: "A Google pipeline slide placed processing between the crawler and the index and listed six processing steps: HTML parsing, rendering, deduplication, feature extraction, signal extraction and index selection."}
- {id: D2-C027, s: D2-S03, label: slide, ev: IMG_4699, ver: undocumented, topics: [indexing-pipeline],
   text: "The HTML parsing step turns a fetched page's HTML into a Document Object Model (DOM) tree of elements, attributes and text nodes."}
- {id: D2-C028, s: D2-S03, label: slide, ev: [IMG_4700, IMG_4701, T:t01:1], ver: consistent, src: [canonicalization], topics: [main-content, indexing-pipeline],
   text: "Google extracts every element of a page so that it can tell the header, the navigation and the main content apart, and a slide labelled the main content as very important."}
- {id: D2-C029, s: D2-S03, label: analysis, ev: "", ver: n/a, topics: [main-content],
   text: "Make the main content of every template easy to separate from the header, navigation and footer, for example as one clearly delimited main area, because Google identifies the main content and treats it as the most important part of the page."}
- {id: D2-C030, s: D2-S03, label: stage, ev: T:t01:3, ver: consistent, src: [how-search-works, meta-tags-supported], topics: [indexing-pipeline],
   text: "Besides the visible content, Google extracts elements that site owners add to the HTML, because they are useful for indexing and, for some of them, for ranking."}
- {id: D2-C031, s: D2-S03, label: slide, ev: [IMG_4702, IMG_4703, T:t01:4], ver: confirmed, src: [canonicalization, consolidate-duplicate-urls], topics: [canonical-selection, duplicate-content, indexing-pipeline],
   rel: [{type: extends, to: D1-C128}],
   text: "Google extracts the rel=canonical link, through which site owners state their preferred canonical URL, and uses it in deduplication and in canonical selection."}
- {id: D2-C032, s: D2-S03, label: slide, ev: [IMG_4702, T:t01:4], ver: confirmed, src: [consolidate-duplicate-urls], topics: [canonical-selection],
   text: "The rel=canonical link element is placed in the head section of the HTML and tells Google that one page is the representative of another."}
- {id: D2-C033, s: D2-S03, label: slide, ev: [IMG_4703, T:t01:5], ver: confirmed, src: [localized-versions], topics: [hreflang, indexing-pipeline],
   text: "Google extracts hreflang annotations, through which site owners specify the language variants of their content, to know whether a page has an equivalent with similar content in another language."}
- {id: D2-C034, s: D2-S03, label: stage, ev: T:t01:5, ver: consistent, src: [localized-versions], topics: [hreflang],
   text: "The speaker said that knowing a page's other-language versions from hreflang is useful in ranking."}
- {id: D2-C035, s: D2-S03, label: analysis, ev: "", ver: n/a, topics: [canonical-selection, hreflang, indexing-pipeline],
   text: "Put rel=canonical and hreflang link elements in the head of the HTML the server sends, not only in JavaScript-rendered HTML, so Google can read them during HTML parsing without depending on rendering."}
- {id: D2-C036, s: D2-S03, label: slide, ev: [IMG_4703, IMG_4704, T:t01:6], ver: confirmed, src: [how-search-works, meta-tags-supported], topics: [crawlable-links, indexing-pipeline],
   text: "Links and anchors are among the things Google extracts from a page's HTML, and the slide card for them simply read 'We like links.'",
   quote: "We like links.", quote_checked: true}
- {id: D2-C037, s: D2-S03, label: stage, ev: T:t01:6, ver: n/a, topics: [url-discovery, crawlable-links],
   text: "The speaker said links are still an extremely important part of the internet and of most major search and AI systems."}
- {id: D2-C038, s: D2-S03, label: stage, ev: T:t01:6, ver: consistent, src: [links-crawlable, how-search-works], topics: [url-discovery, crawlable-links],
   rel: [{type: extends, to: D1-C040}],
   text: "Google uses the links it extracts for three purposes: discovering new pages, determining a site's structure, and ranking."}
- {id: D2-C039, s: D2-S03, label: slide, ev: [IMG_4705, T:t01:7], ver: confirmed, src: [links-crawlable], topics: [crawlable-links],
   text: "Google can extract links written as an a element with an href attribute that holds an absolute or a relative URL, which the speaker called the good old normal way."}
- {id: D2-C040, s: D2-S03, label: slide, ev: [IMG_4705, T:t01:7], ver: consistent, src: [links-crawlable, pagination-guide], topics: [crawlable-links, javascript-seo],
   rel: [{type: repeats, to: D1-C115}],
   text: "Google cannot extract a link from an a element that only has an onclick handler, because Googlebot does not click, so the JavaScript is never triggered."}
- {id: D2-C041, s: D2-S03, label: slide, ev: [IMG_4705, T:t01:7], ver: consistent, src: [links-crawlable], topics: [crawlable-links],
   text: "Google cannot extract a link from an href attribute placed on an element other than a, such as a span, because that is not a standard way to make a link."}
- {id: D2-C042, s: D2-S03, label: slide, ev: IMG_4705, ver: consistent, src: [links-crawlable], topics: [crawlable-links, javascript-seo],
   text: "A Google slide also listed as not extractable an a element with a routerLink attribute instead of an href, and javascript: URLs such as javascript:goTo('products') or javascript:window.location.href='/products'."}
- {id: D2-C043, s: D2-S03, label: docs, ev: "", ver: source, src: [links-crawlable], topics: [crawlable-links, javascript-seo],
   text: "Google's link best practices say Google can generally crawl a link only if it is an a element with an href attribute, and list routerLink without href, href on a span, onclick-only a elements and javascript: URLs as not recommended, while noting that Google may still attempt to parse them."}
- {id: D2-C044, s: D2-S03, label: analysis, ev: "", ver: n/a, topics: [crawlable-links, javascript-seo],
   text: "Google's link-extraction slide put routerLink, href on a span, onclick-only links and javascript: URLs under 'can not extract', which is stricter than Google's link documentation saying Google may still try to parse them; either way they are not dependable links for discovery."}
- {id: D2-C045, s: D2-S03, label: analysis, ev: "", ver: n/a, topics: [crawlable-links, javascript-seo],
   text: "Audit every template and JavaScript component that outputs links, such as navigation, pagination, filters and product tiles: each needs a real a element with an href, because onclick handlers, routerLink without href, href on a span and javascript: URLs leave the target pages without a link Google can reliably extract."}
- {id: D2-C046, s: D2-S03, label: stage, ev: T:t01:8, ver: undocumented, topics: [crawlable-links, url-discovery],
   text: "The speaker said Google sometimes also extracts URLs that are typed out as plain text on a page without being hyperlinked; the remarks around this point were unclear in the recording."}
- {id: D2-C047, s: D2-S03, label: analysis, ev: "", ver: n/a, topics: [crawlable-links, url-discovery],
   text: "Do not rely on plain-text URLs for discovery: even if Google sometimes picks them up, a proper a href link is what was described as feeding discovery, site structure and ranking."}
- {id: D2-C048, s: D2-S03, label: slide, ev: [IMG_4698, T:t01:9], ver: confirmed, src: [javascript-seo-basics, how-search-works], topics: [indexing-pipeline, crawl-pipeline, url-discovery],
   rel: [{type: extends, to: D1-C063}, {type: repeats, to: D1-C328}],
   text: "Links extracted during processing are sent back to the crawl queue, where scheduling starts again for the newly found URLs."}
- {id: D2-C049, s: D2-S03, label: stage, ev: T:t01:10, ver: consistent, src: [block-indexing-noindex, robots-meta-tag-spec], topics: [robots-meta-tag, indexing-pipeline],
   text: "The robots meta element is also extracted when Google processes a page's HTML, and the speaker called it probably one of the most important extracted elements, or one the audience is probably interested in."}
- {id: D2-C831, s: D2-S03, label: docs, ev: "", ver: source, src: [valid-page-metadata], topics: [indexing-pipeline, robots-meta-tag],
   text: "Google's page on valid page metadata says that once Google detects an invalid element in the head, it assumes the head has ended and stops reading further elements there; only title, meta, link, script, style, base, noscript and template elements belong in the head."}

# ---------- D2-S04 Controlling indexing ----------
- {id: D2-C050, s: D2-S04, label: stage, who: John Mueller, ev: T:t01:11, ver: confirmed, src: [robots-spec, robots-refresher-future-blog, rep-formalizing-blog], topics: [web-standards, robots-txt],
   rel: [{type: repeats, to: D1-C512}],
   text: "John Mueller noted that robots.txt is defined by an internet standard, RFC 9309, which Google's Gary Illyes co-authored."}
- {id: D2-C051, s: D2-S04, label: stage, who: John Mueller, ev: T:t01:11, ver: consistent, src: [robots-refresher-future-blog], topics: [robots-meta-tag, web-standards],
   text: "John Mueller said there is currently no RFC that standardises robots meta tags, unlike robots.txt."}
- {id: D2-C052, s: D2-S04, label: stage, who: John Mueller, ev: T:t01:13, ver: n/a, topics: [web-standards, robots-meta-tag],
   text: "John Mueller encouraged attendees to help write a specification for robots meta tags, saying internet standards groups are made up of ordinary people and need only passion and a willingness to join the discussions."}
- {id: D2-C053, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4707, T:t01:14, T:t01:26, T:t01:33, T:d2r2a:11], ver: consistent, src: [robots-meta-tag-spec, google-discover], topics: [snippet-controls, robots-meta-tag],
   text: "John Mueller opened with a true-or-false quiz slide asking whether robots meta tags can make a page more visible in Search results than having none, and later answered that the statement is true.",
   quote: "You can use robots meta tags to be more visible in Search results than without robots meta tags.", quote_checked: true}
- {id: D2-C054, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4708, T:t01:15], ver: confirmed, src: [robots-meta-tag-spec], topics: [robots-meta-tag],
   text: "The robots meta tag is a piece of HTML code in the head section of a page that gives search engine crawlers page-specific instructions."}
- {id: D2-C055, s: D2-S04, label: docs, ev: "", ver: source, src: [robots-meta-tag-spec], topics: [robots-meta-tag],
   text: "Google's robots meta tag specification tells site owners to place the tag in the head section but notes that Google Search does not enforce that placement and also respects robots meta tags in the body of an HTML document."}
- {id: D2-C056, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4708, T:t01:15], ver: confirmed, src: [robots-meta-tag-spec], topics: [robots-meta-tag],
   text: "The primary function of the robots meta tag is to control how a page is indexed and shown in search results."}
- {id: D2-C057, s: D2-S04, label: slide, who: John Mueller, ev: IMG_4708, ver: confirmed, src: [robots-meta-tag-spec, meta-tags-supported], topics: [robots-meta-tag],
   text: "The robots meta tag is written as <meta name=\"robots\" content=\"rule1,rule2\">, or with the name googlebot instead of robots, with several rules separated by commas."}
- {id: D2-C058, s: D2-S04, label: stage, who: John Mueller, ev: T:t01:15, ver: confirmed, src: [robots-intro, block-indexing-noindex], topics: [robots-meta-tag, crawl-directives],
   rel: [{type: extends, to: D1-C110}],
   text: "John Mueller said robots.txt does not control indexing, so robots meta tags are what site owners have to use to control it."}
- {id: D2-C059, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4709, T:t01:16, T:d2r2a:1], ver: confirmed, src: [robots-meta-tag-spec, meta-tags-supported], topics: [robots-meta-tag],
   text: "The robots meta rule all is the default value and does nothing: it places no restrictions on indexing the page or following its links, the same as having no robots meta tag, and it is not an instruction that search engines must index the page.",
   quote: "This is the default value - it does nothing", quote_checked: true}
- {id: D2-C061, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4710, T:t01:17, T:d2r2a:2], ver: confirmed, src: [robots-meta-tag-spec, block-indexing-noindex], topics: [robots-meta-tag],
   text: "The noindex robots rule tells Google not to show the page in search results."}
- {id: D2-C062, s: D2-S04, label: slide, who: John Mueller, ev: IMG_4710, ver: undocumented, topics: [robots-meta-tag],
   text: "A slide named internal admin pages, temporary landing pages and thin content as typical use cases for the noindex rule."}
- {id: D2-C063, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:18, T:d2r2a:3], ver: consistent, src: [robots-meta-tag-spec, nofollow-hints-blog], topics: [robots-meta-tag, crawl-directives],
   text: "The page-level nofollow robots rule tells search engines not to pass signals to any of the links on the page, which John Mueller called a weird and very broad rule that makes the page stand on its own."}
- {id: D2-C064, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:18, T:d2r2a:3], ver: consistent, src: [qualify-outbound-links, nofollow-hints-blog], topics: [crawl-directives, robots-meta-tag],
   text: "John Mueller recommends rel=nofollow on individual links instead of the page-level nofollow robots rule, so a site can choose which links are useful and which are not."}
- {id: D2-C821, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:18, T:d2r2a:3], ver: n/a, topics: [robots-meta-tag, crawl-directives],
   rel: [{type: extends, to: D2-C063}],
   text: "John Mueller suspected that if robots meta tags were reinvented today, the page-level nofollow rule would probably not be part of them.", private: false}
- {id: D2-C065, s: D2-S04, label: analysis, ev: "", ver: n/a, topics: [robots-meta-tag, crawl-directives],
   text: "Audit robots meta tags set by templates and plug-ins: an explicit all rule does nothing and can go, while a page-level nofollow strips link signals from every link on the page and is better replaced by qualifying only the specific links that need it."}
- {id: D2-C066, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:19, T:d2r2a:4], ver: undocumented, topics: [ai-crawlers-and-agents, crawl-directives],
   text: "John Mueller said AI crawlers do not really know what to do with nofollow links, because they look at the content rather than building a link graph; he did not say whether he meant Google's AI systems, other AI crawlers or both.",
   quote: "AI crawlers don't really know what to do with a nofollow link, because they're looking at the content"}
- {id: D2-C067, s: D2-S04, label: analysis, ev: "", ver: n/a, topics: [ai-crawlers-and-agents, crawl-directives, google-extended],
   rel: [{type: extends, to: D1-C127}, {type: extends, to: D1-C482}],
   text: "nofollow is a link-graph hint for search engines, not an access control: to keep AI crawlers away from content, use robots.txt rules for the specific crawlers; at Google, Google-Extended covers Gemini training and grounding, and the Search generative AI control covers AI Overviews and AI Mode."}
- {id: D2-C068, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:20, T:d2r2a:5], ver: confirmed, src: [robots-meta-tag-spec, block-indexing-noindex], topics: [robots-meta-tag],
   text: "The robots rule none is equivalent to noindex plus nofollow, so a page that carries it will not show up in Search, provided Google can see the tag."}
- {id: D2-C069, s: D2-S04, label: docs, ev: "", ver: source, src: [robots-meta-tag-spec, block-indexing-noindex], topics: [robots-meta-tag, robots-txt],
   rel: [{type: extends, to: D1-C106}],
   text: "Google's robots meta tag specification says robots meta tags and X-Robots-Tag headers are found only when a URL is crawled, so the rules on a URL disallowed in robots.txt are never seen and are ignored."}
- {id: D2-C070, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4711, T:t01:21, T:d2r2a:6], ver: confirmed, src: [robots-meta-tag-spec, snippets-guide], topics: [snippet-controls],
   text: "The nosnippet rule stops Google from showing a text snippet or video preview for a page in search results, while the page's title is still shown."}
- {id: D2-C071, s: D2-S04, label: docs, ev: "", ver: source, src: [robots-meta-tag-spec], topics: [snippet-controls, images],
   text: "Google's robots meta tag specification says that with nosnippet a static image thumbnail, if available, may still be shown when that results in a better user experience."}
- {id: D2-C072, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4711, T:t01:22], ver: confirmed, src: [robots-meta-tag-spec], topics: [snippet-controls, genai-optout],
   rel: [{type: extends, to: D1-C034}],
   text: "The nosnippet rule also prevents a page's content from being used as a direct input for AI Overviews and AI Mode in Search.",
   quote: "Also prevents the content from being used as a direct input for AI Overviews and AI Mode in Search results.", quote_checked: true}
- {id: D2-C073, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:22, T:d2r2a:7], ver: consistent, src: [robots-meta-tag-spec, ai-features-guide], topics: [snippet-controls, query-fanout, index-structure],
   rel: [{type: extends, to: D1-C038}],
   text: "John Mueller said Google uses the snippet as a way of building AI Overviews and AI Mode answers, so if a page forbids a snippet, Google cannot use that snippet for them.",
   quote: "we use the snippet as a way of building out the AI Overviews and the AI Mode answers"}
- {id: D2-C074, s: D2-S04, label: docs, ev: "", ver: source, src: [ai-features-guide], topics: [snippet-controls, ai-links-to-web],
   rel: [{type: extends, to: D1-C038}],
   text: "Google's AI features guide says a page must be indexed and eligible to be shown in Google Search with a snippet to appear as a supporting link in AI Overviews or AI Mode, with no additional technical requirements."}
- {id: D2-C075, s: D2-S04, label: analysis, ev: "", ver: n/a, topics: [snippet-controls, genai-optout],
   text: "Before adding nosnippet or a low max-snippet value, weigh the cost in AI features: both limit how much of the page AI Overviews and AI Mode can use, and John Mueller described those answers as built from snippets."}
- {id: D2-C076, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:23, T:d2r2a:8], ver: consistent, src: [robots-meta-tag-spec, snippets-guide], topics: [snippet-controls],
   text: "John Mueller said data-nosnippet is rarely needed but lets a site keep a specific piece of text, such as a business phone number, out of the snippet, so the page can still be found for it while searchers have to visit the page to see it."}
- {id: D2-C077, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:24, T:d2r2a:9], ver: confirmed, src: [robots-meta-tag-spec, meta-tags-supported], topics: [snippet-controls],
   text: "The data-nosnippet attribute can be used on only a handful of HTML elements."}
- {id: D2-C078, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:24, T:d2r2a:9], ver: confirmed, src: [robots-meta-tag-spec], topics: [snippet-controls],
   text: "Broken HTML can widen data-nosnippet: if a div marked data-nosnippet is not closed properly, the rest of the page can be blocked from the snippet as well."}
- {id: D2-C079, s: D2-S04, label: docs, ev: "", ver: source, src: [robots-meta-tag-spec], topics: [snippet-controls, javascript-seo],
   text: "Google's robots meta tag specification says data-nosnippet may be extracted both before and after rendering, so the attribute should not be added to or removed from existing elements with JavaScript."}
- {id: D2-C080, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:24, T:d2r2a:9], ver: consistent, src: [seo-starter-guide, robots-meta-tag-spec], topics: [snippet-controls],
   text: "John Mueller said valid HTML is technically not a ranking factor but does matter for controls such as data-nosnippet.",
   quote: "valid HTML is technically not an SEO ranking factor, but it does play a role"}
- {id: D2-C081, s: D2-S04, label: analysis, ev: "", ver: n/a, topics: [snippet-controls],
   text: "To hide one detail, such as a phone number, a price or a direct answer, instead of the whole snippet, wrap it in data-nosnippet on a span, div or section in the server HTML and validate the HTML so that an unclosed element cannot hide the rest of the page from snippets."}
- {id: D2-C082, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4712, T:t01:25, T:d2r2a:10], ver: confirmed, src: [robots-meta-tag-spec], topics: [snippet-controls],
   text: "The max-snippet:[number] rule limits a page's search result snippet to that number of characters (100 characters, for example), and max-snippet:0 shows no snippet, the same as nosnippet."}
- {id: D2-C083, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:25, T:d2r2a:10], ver: confirmed, src: [robots-meta-tag-spec], topics: [snippet-controls, genai-optout],
   text: "John Mueller said, hedging with 'I think', that the max-snippet limit also applies to AI Overviews and AI Mode."}
- {id: D2-C084, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:25, T:d2r2a:10], ver: undocumented, topics: [snippet-controls],
   text: "A max-snippet value too short for a useful snippet may lead Google to show no snippet at all, John Mueller said."}
- {id: D2-C085, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4712, T:t01:26, T:d2r2a:11], ver: undocumented, topics: [snippet-controls],
   text: "max-snippet:-1 removes the length limit and can produce a longer snippet than having no rule, because by default Google keeps snippets to a length it considers reasonable instead of quoting a page at length.",
   quote: "max-snippet:-1 = No limit. (can be more than without)", quote_checked: true}
- {id: D2-C086, s: D2-S04, label: docs, ev: "", ver: source, src: [robots-meta-tag-spec], topics: [snippet-controls],
   text: "Google's robots meta tag specification says Google chooses the snippet length when no max-snippet rule is set, and with max-snippet:-1 chooses the length it believes most effective; it does not say that -1 produces longer snippets."}
- {id: D2-C087, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4714, T:t01:27], ver: confirmed, src: [robots-meta-tag-spec], topics: [snippet-controls, images],
   text: "The max-image-preview rule sets the maximum size of a page's image previews: none shows no preview, standard a default-sized one and large the largest possible, for example in Discover."}
- {id: D2-C088, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:27, T:d2r2a:12], ver: undocumented, topics: [images, snippet-controls],
   text: "John Mueller said Google Search does not always show an image thumbnail for a result, and when it does, the thumbnail is usually limited to the size of the result entry."}
- {id: D2-C089, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:27, T:d2r2a:12], ver: consistent, src: [google-discover, robots-meta-tag-spec], topics: [snippet-controls, images],
   text: "max-image-preview:large matters mainly in Discover, where it allows a large image that draws people's attention, so the rule can make a page more visible than leaving it out, John Mueller said."}
- {id: D2-C090, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4715, T:t01:28, T:d2r2a:13], ver: confirmed, src: [robots-meta-tag-spec, video-seo], topics: [snippet-controls, video],
   text: "The max-video-preview rule sets the maximum number of seconds of a video preview in Search; 0 allows only a static image and -1 means no time limit."}
- {id: D2-C091, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:28, T:d2r2a:13], ver: consistent, src: [video-seo], topics: [snippet-controls, video],
   text: "John Mueller said he thinks setting max-video-preview to -1 will not make Google show an hour-long video preview in search results."}
- {id: D2-C092, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:28, T:d2r2a:13], ver: n/a, topics: [video, snippet-controls],
   text: "John Mueller speculated that the use of max-video-preview may change in future, for example in Discover, where letting people view a full video could make sense."}
- {id: D2-C093, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:29, T:d2r2a:14], ver: confirmed, src: [robots-meta-tag-spec, translated-results], topics: [snippet-controls, localisation],
   text: "The notranslate robots rule tells Google not to offer a translation of the page in search results."}
- {id: D2-C094, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:29, T:d2r2a:14], ver: consistent, src: [notranslate-blog-2008, chromium-translate], topics: [snippet-controls, accessibility, localisation],
   text: "John Mueller said notranslate can also be set in a meta tag named google, and that in that form it also turns off Chrome's automatic translation of the page."}
- {id: D2-C095, s: D2-S04, label: docs, ev: "", ver: source, src: [translated-results, robots-meta-tag-spec], topics: [localisation, snippet-controls],
   text: "Google's Search documentation gives notranslate as a rule for a robots or googlebot meta tag or an X-Robots-Tag header, and says the rule opts a page out of all translation features in Google Search."}
- {id: D2-C096, s: D2-S04, label: docs, ev: "", ver: source, src: [notranslate-blog-2008], topics: [localisation],
   text: "A 2008 Search Central blog post says a meta tag named google with the value notranslate stops Google Translate from translating any of a page's content."}
- {id: D2-C097, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:29, T:d2r2a:14], ver: n/a, topics: [accessibility, localisation],
   text: "John Mueller said he dislikes notranslate because automatic translation is a form of accessibility for visitors who cannot read the page's language."}
- {id: D2-C098, s: D2-S04, label: analysis, ev: "", ver: n/a, topics: [localisation, accessibility, snippet-controls],
   text: "International sites should remove notranslate from their templates unless translation must be prevented: the robots or googlebot form switches off Google Search's translation features, and John Mueller said the form named google also blocks Chrome's translation for visitors who do not read the language."}
- {id: D2-C099, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:30, T:d2r2a:15], ver: confirmed, src: [robots-meta-tag-spec], topics: [robots-meta-tag, images],
   text: "The noimageindex rule tells Google not to index any of the images on the page, and John Mueller said he could not see why a site would want that."}
- {id: D2-C100, s: D2-S04, label: stage, who: John Mueller, ev: [T:t01:31, T:d2r2a:15], ver: confirmed, src: [robots-meta-tag-spec], topics: [robots-meta-tag],
   text: "The unavailable_after rule lets a page drop out of search results after a set date and time, which suits time-bound pages, though John Mueller said most sites do not use it."}
- {id: D2-C101, s: D2-S04, label: docs, ev: "", ver: source, src: [robots-meta-tag-spec], topics: [robots-meta-tag, crawl-demand],
   text: "Google's robots meta tag specification says Googlebot considerably decreases the crawl rate of a URL after the date and time set in its unavailable_after rule."}
- {id: D2-C102, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4716, T:t01:32, T:d2r2a:16], ver: undocumented, topics: [genai-optout, robots-meta-tag],
   text: "John Mueller's slide said Search Console has very few indexing-like settings and listed the Search generative AI control as the one control in his talk that is not a meta tag.",
   quote: "Very few \"indexing-like\" settings are in Search Console", quote_checked: true}
- {id: D2-C103, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4716, T:t01:32, T:d2r2a:16], ver: confirmed, src: [gsc-genai-control], topics: [genai-optout],
   rel: [{type: repeats, to: D1-C030}, {type: extends, to: D1-C029}],
   text: "Setting the Search generative AI control in Search Console to exclude keeps a site's links and content out of Search generative AI features such as AI Overviews and AI Mode, so the site gets no traffic or impressions from them; include is the default."}
- {id: D2-C104, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4717, video:IMG_4718, T:t01:33, T:d2r2a:17], ver: consistent, src: [robots-meta-tag-spec, google-discover], topics: [snippet-controls, images],
   text: "To be as visible as possible in Google, John Mueller's closing slide recommended the robots rules max-image-preview:large and max-snippet:-1.",
   quote: "To be as visible as possible in Google, use: max-image-preview:large, max-snippet:-1", quote_checked: true}
- {id: D2-C105, s: D2-S04, label: analysis, ev: "", ver: n/a, topics: [snippet-controls, images],
   text: "Set max-snippet:-1 and max-image-preview:large on every indexable template unless licensing requires otherwise, and check that no CMS, plug-in or CDN setting adds lower snippet or image preview limits by default."}
- {id: D2-C106, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4719, T:d2r2a:19], ver: consistent, src: [javascript-seo-basics], topics: [robots-meta-tag, javascript-seo, rendering],
   text: "A slide said robots meta rules can be added to a page's HTML with JavaScript, but doing so takes more time."}
- {id: D2-C107, s: D2-S04, label: docs, ev: "", ver: source, src: [meta-tags-supported], topics: [robots-meta-tag, javascript-seo],
   text: "Google's meta tags documentation recommends avoiding JavaScript to inject or change meta tags whenever possible and testing the implementation thoroughly when it must be used."}
- {id: D2-C108, s: D2-S04, label: slide, who: John Mueller, ev: [IMG_4719, T:d2r2a:19], ver: consistent, src: [javascript-seo-basics], topics: [robots-meta-tag, javascript-seo, rendering],
   text: "Removing a robots restriction such as noindex with JavaScript does not work, a slide said.",
   quote: "But... it takes more time, and removing restrictions (like \"noindex\") doesn't work.", quote_checked: true}
- {id: D2-C109, s: D2-S04, label: analysis, ev: "", ver: n/a, topics: [robots-meta-tag, javascript-seo],
   text: "Ship robots rules in the HTML the server sends and never rely on JavaScript to lift a noindex: Google may skip rendering a page that arrives with noindex, so the page can stay out of the index even if a script removes the tag later."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D2-C850, s: D2-S04, label: stage, who: John Mueller, ev: T:d2r2a:18, ver: confirmed, src: [robots-meta-tag-spec, block-indexing-noindex], topics: [robots-meta-tag, robots-txt, crawl-directives],
   rel: [{type: repeats, to: D1-C110}],
   text: "John Mueller said robots meta rules only work if robots.txt allows Google to fetch the page."}
- {id: D2-C851, s: D2-S04, label: stage, who: John Mueller, ev: T:d2r2a:18, ver: confirmed, src: [robots-intro, block-indexing-noindex], topics: [robots-txt, crawl-directives],
   rel: [{type: repeats, to: D2-C021}, {type: repeats, to: D1-C110}],
   text: "When robots.txt blocks a page, the page's content is not indexable but Google can still index its URL, John Mueller said."}
- {id: D2-C852, s: D2-S04, label: stage, who: John Mueller, ev: T:d2r2a:19, ver: consistent, src: [javascript-seo-basics], topics: [robots-meta-tag, javascript-seo, rendering],
   rel: [{type: extends, to: D2-C108}],
   text: "When Google finds a noindex rule in a page's HTML, it drops the page without even processing its JavaScript, so a script cannot switch the page back to indexable, John Mueller said.",
   quote: "we will see the noindex and say, oh, we will get rid of this page; we won't even process the JavaScript"}
- {id: D2-C853, s: D2-S04, label: stage, who: John Mueller, ev: T:d2r2a:20, ver: confirmed, src: [meta-tags-supported, javascript-seo-basics], topics: [robots-meta-tag, javascript-seo],
   rel: [{type: extends, to: D2-C106}],
   text: "John Mueller recommended putting robots meta tags directly in a page's HTML exactly as intended, and adding them with JavaScript only where that is not possible, as in a JavaScript web app."}
- {id: D2-C854, s: D2-S04, label: docs, ev: "", ver: source, src: [javascript-seo-basics], topics: [robots-meta-tag, javascript-seo, rendering],
   text: "Google's JavaScript SEO basics guide says that when Google encounters a noindex rule it may skip rendering and JavaScript execution, so using JavaScript to change or remove a noindex robots meta tag may not work as expected.",
   quote: "it may skip rendering and JavaScript execution"}
- {id: D2-C855, s: D2-S04, label: analysis, ev: "", ver: n/a, topics: [robots-meta-tag, javascript-seo],
   rel: [{type: extends, to: D2-C109}],
   text: "On stage the rule was absolute (Google won't even process the JavaScript of a page served with noindex), while Google's guide says only that it may skip rendering; either way, a noindex in the served HTML must never be one that JavaScript is expected to lift."}

# ---------- D2-S05 Lightning session D: Rendering and JavaScript ----------
# ----- Part 1: Erin Sparling (Google), "Rendering Pages to Index What Users See" -----
- {id: D2-C110, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:2, T:t02:3, T:d2r2a:22], ver: n/a, topics: [rendering, search-evolution],
   text: "Google framed rendering historically: when Google started, most of the web was plain, semantic HTML it could extract directly, but the modern web is built with JavaScript and much content is generated by JavaScript, so Google had to adapt."}
- {id: D2-C111, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:4, T:d2r2a:23], ver: consistent, src: [how-search-works], topics: [rendering],
   text: "Without its ability to render JavaScript, Google says it would not be able to see most of what is on the web today."}
- {id: D2-C112, s: D2-S05, label: slide, who: Erin Sparling, ev: [IMG_4720, T:t02:5, T:d2r2a:24], ver: consistent, src: [how-search-works], topics: [rendering],
   text: "Google renders pages in order to index what users see: its commitment to reflecting the user experience means understanding what people see when a page loads in a browser and surfacing that in Search.",
   quote: "Rendering Pages to Index What Users See", quote_checked: true}
- {id: D2-C113, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:6, T:d2r2a:24], ver: undocumented, topics: [rendering, ai-crawlers-and-agents],
   text: "Compared with other search engines and AI crawlers, Google said its effort to mimic what the user sees is essential to keeping its knowledge of the web up to date and comprehensive; it did not say what the others do."}
- {id: D2-C114, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:6, T:d2r2a:24], ver: undocumented, topics: [rendering, ai-crawlers-and-agents],
   text: "Being able to render and read JavaScript matters whether the client fetching a page is a search crawler or an AI system, Google said."}
- {id: D2-C115, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:7, T:d2r2a:25], ver: undocumented, topics: [rendering],
   text: "Google described the mission of its rendering as simply executing JavaScript, while the implementation is complex, expensive and difficult.",
   quote: "our mission is very simple these days: execute JavaScript"}
- {id: D2-C116, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:8, T:d2r2a:26], ver: consistent, src: [ai-optimization-guide], topics: [seo-vs-geo, pipeline-overview],
   rel: [{type: repeats, to: D1-C038}],
   text: "AI Overviews and AI Mode are built on top of Search results: they are a different experience of the same content Google already has."}
- {id: D2-C117, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:8, T:d2r2a:26], ver: consistent, src: [ai-optimization-guide, common-crawlers], topics: [seo-vs-geo, ai-crawlers-and-agents],
   text: "AI Overviews and AI Mode typically do not ground their answers by reading pages live, unlike Gemini when a user asks about a specific page, Google said.", private: false}
- {id: D2-C118, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:9, T:d2r2a:27], ver: undocumented, topics: [gemini-and-search, rendering, google-extended],
   rel: [{type: extends, to: D1-C039}],
   text: "To train Gemini models, Google renders every page just as it does for Search, so a page that renders correctly for Search also works for Gemini training, provided the site allows its content to be used for training.",
   quote: "if it works for Search, it works for Gemini for training"}
- {id: D2-C119, s: D2-S05, label: analysis, ev: "", ver: n/a, topics: [gemini-and-search, google-extended],
   text: "If Gemini training reuses the rendering done for Search, a site needs no separate rendering work for Gemini; whether its rendered content is used for training is decided with the Google-Extended token in robots.txt, not by rendering choices."}
- {id: D2-C120, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:10, T:d2r2a:28], ver: undocumented, topics: [gemini-and-search, ai-crawlers-and-agents],
   rel: [{type: extends, to: D1-C039}],
   text: "When a Gemini user asks about a specific web page (for example, whether it says anything about the ruby HTML tag), the page is read at that moment rather than during crawling and may be used to ground the answer, which takes extra time."}
- {id: D2-C121, s: D2-S05, label: docs, ev: "", ver: source, src: [common-crawlers], topics: [gemini-and-search, google-extended],
   rel: [{type: extends, to: D1-C086}],
   text: "Google's crawler documentation defines grounding in Gemini Apps and in Grounding with Google Search on Vertex AI as providing content from the Google Search index to the model at prompt time, and sites manage whether their content is used for it with the Google-Extended robots.txt token."}
- {id: D2-C122, s: D2-S05, label: docs, ev: "", ver: source, src: [user-triggered-fetchers], topics: [ai-crawlers-and-agents, robots-txt],
   rel: [{type: repeats, to: D1-C273}, {type: extends, to: D1-C434}],
   text: "Google says user-triggered fetchers, which fetch a URL because a user asked for it in a Google product (for example Gemini Notebook fetching URLs users add as sources, or Google-Agent acting on a user's request), generally ignore robots.txt rules."}
- {id: D2-C123, s: D2-S05, label: analysis, ev: "", ver: n/a, topics: [gemini-and-search, google-extended, ai-crawlers-and-agents],
   text: "Google documents Gemini grounding only as content from the Search index at prompt time; the live read of a specific page at a user's request, described on stage, is not documented, so it is unclear whether it works like a user-triggered fetcher, which generally ignores robots.txt, or follows Google-Extended."}
- {id: D2-C124, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:11, T:t02:10, T:d2r2a:28], ver: consistent, src: [javascript-seo-basics, dynamic-rendering], topics: [javascript-seo, gemini-and-search],
   rel: [{type: extends, to: D1-C056}],
   text: "Google's simple solution for the extra time of live page reads is to make JavaScript-generated content render quickly and efficiently, or to use server-side rendering."}
- {id: D2-C125, s: D2-S05, label: analysis, ev: "", ver: n/a, topics: [javascript-seo, ai-crawlers-and-agents],
   text: "For pages people are likely to ask an AI assistant about (product, pricing, documentation and policy pages), server-render the main content so a live, user-triggered read does not depend on client-side JavaScript finishing quickly."}
- {id: D2-C126, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:12, T:d2r2a:29], ver: confirmed, src: [javascript-seo-basics], topics: [rendering],
   rel: [{type: repeats, to: D1-C206}],
   text: "Google renders pages with Chromium, the browser technology that also underlies Chrome, Edge and other Chromium-based browsers."}
- {id: D2-C127, s: D2-S05, label: slide, who: Erin Sparling, ev: [IMG_4721, T:t02:13], ver: consistent, src: [javascript-seo-basics, crawling-december-resources, inside-googlebot-blog], topics: [rendering, indexing-pipeline, crawl-pipeline],
   rel: [{type: extends, to: D1-C063}],
   text: "A Google pipeline diagram ran from the crawl queue to the crawler, then through HTML parsing to processing, which passes pages to rendering and gets them back, and then to the index; rendering fetches its JavaScript and CSS through the crawler."}
- {id: D2-C128, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:13, T:d2r2a:30], ver: consistent, src: [javascript-seo-basics, crawling-december-resources], topics: [rendering],
   rel: [{type: extends, to: D2-C026}],
   text: "Although Google's pipeline diagram shows rendering as part of indexing, Google's rendering is a detached system, kept separate because rendering is time-consuming and computationally expensive.",
   quote: "it shows rendering as part of indexing, but it's actually a detached system"}
- {id: D2-C129, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:13, T:d2r2a:30], ver: undocumented, topics: [rendering],
   text: "After the crawler has fetched a page, Google's rendering system executes it, checks that it loads properly and works out what it looks like at different sizes."}
- {id: D2-C130, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:14, T:d2r2a:31], ver: undocumented, topics: [rendering, javascript-seo],
   text: "Google said its pipeline needs to ensure that content indexable without JavaScript can pass through without rendering, while content that appears only through JavaScript and CSS takes a longer rendering pass."}
- {id: D2-C131, s: D2-S05, label: docs, ev: "", ver: source, src: [javascript-seo-basics], topics: [rendering, javascript-seo, indexing-pipeline],
   text: "Google's JavaScript SEO guide says Googlebot sends every page with a 200 HTTP status code to the rendering queue, whether or not it contains JavaScript, unless a robots meta tag or header tells Google not to index it, and Google uses the rendered HTML to index the page."}
- {id: D2-C132, s: D2-S05, label: analysis, ev: "", ver: n/a, topics: [rendering, javascript-seo],
   text: "The stage remark that content indexable without JavaScript can pass through without rendering does not mean such pages skip rendering, because Google's guide queues every 200 page for rendering; read it as: content already in the raw HTML does not depend on the slower rendering pass."}
- {id: D2-C133, s: D2-S05, label: analysis, ev: "", ver: n/a, topics: [javascript-seo, rendering],
   text: "Put everything indexing depends on (title, meta description, canonical, robots meta tag, main text and links) in the raw HTML so it is available without rendering, let JavaScript add enhancements only, and check the rendered HTML in URL Inspection for the rest."}
- {id: D2-C134, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:14, T:t02:15, T:d2r2a:31], ver: consistent, src: [ai-optimization-guide, javascript-seo-basics], topics: [javascript-seo, gemini-and-search],
   rel: [{type: extends, to: D1-C056}],
   text: "Google urged sites to make sure their JavaScript content can be crawled, rendered and indexed, calling this important today and also tomorrow, as AI systems increasingly ground answers to user requests."}
- {id: D2-C135, s: D2-S05, label: stage, who: Erin Sparling, ev: [T:t02:16, T:d2r2a:32], ver: n/a, topics: [javascript-seo, rendering-debugging, web-fragments],
   text: "After Google's opener, Lightning session D had three community talks: rendering and JavaScript execution blind spots (Sören Bendig), debugging JavaScript rendering for Search (Rebecca Yu) and virtualizing the browser (Natalia Venditto)."}
# ----- Part 2: Sören Bendig (community speaker), rendering and JavaScript blind spots -----
- {id: D2-C136, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:18, T:d2r2a:34], ver: n/a, topics: [seo-scope, javascript-seo],
   rel: [{type: extends, to: D1-C121}],
   text: "Many SEOs still treat everything beyond the raw HTML as the developers' business, but developers often do not handle rendering problems, a community speaker warned."}
- {id: D2-C137, s: D2-S05, label: slide, who: Sören Bendig, ev: [IMG_4722, T:t02:19, T:d2r2a:35], ver: n/a, topics: [javascript-seo, rendering-debugging],
   text: "The first rendering blind spot a community speaker showed was content changes: text, images and recommendations that differ between the raw HTML and the rendered page, illustrated by a shop page whose rendered version had a whole extra section."}
- {id: D2-C138, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:19, T:d2r2a:35], ver: undocumented, topics: [rendering-debugging],
   text: "Switching JavaScript off and on in the browser gives a quick first impression of which content on a page depends on rendering."}
- {id: D2-C139, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:20, T:d2r2a:35], ver: consistent, src: [javascript-seo-basics, dynamic-rendering], topics: [javascript-seo, ai-crawlers-and-agents],
   rel: [{type: extends, to: D1-C056}],
   text: "A community speaker strongly advised putting everything you want cited into the raw, server-side rendered HTML, especially for AI systems that cannot render JavaScript yet.",
   quote: "everything you want cited, include it in the raw HTML, server-side rendered"}
- {id: D2-C140, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:21, T:d2r2a:36], ver: consistent, src: [javascript-seo-basics, links-crawlable], topics: [crawlable-links, javascript-seo],
   text: "In a navigation example, the main navigation was in the raw HTML and would survive a rendering failure, but the whole sub-navigation was built by JavaScript, so all of its links would be inaccessible to bots if rendering broke."}
- {id: D2-C141, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:21, T:d2r2a:36], ver: consistent, src: [lazy-loading-guide, pagination-guide], topics: [crawlable-links, lazy-loading],
   text: "When checking which links bots can see, keep in mind that the rendered HTML can change with user actions, a community speaker cautioned."}
- {id: D2-C142, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:22, T:d2r2a:37], ver: n/a, topics: [javascript-seo],
   text: "One site that builds its whole content by rendering also rendered its meta description with HTML tags inside it, which makes no sense and points to a flawed process."}
- {id: D2-C143, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:22, T:d2r2a:37], ver: consistent, src: [fix-search-javascript], topics: [rendering-debugging, javascript-seo],
   text: "Sites that create their content by rendering should have at least basic monitoring to check that the rendered pages come out right, a community speaker advised."}
- {id: D2-C144, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:23, T:t02:29, T:d2r2a:38, T:d2r2a:44], ver: consistent, src: [fix-search-javascript, url-inspection-help], topics: [rendering-debugging],
   text: "Browser console messages reveal further problems on a page, Content Security Policy violations among them; few teams analyse console messages at scale, but they should, a community speaker said."}
- {id: D2-C145, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:24, T:d2r2a:39], ver: n/a, topics: [javascript-seo],
   text: "On a travel site, the number of offers differed between the raw HTML and the rendered page, possibly because the two versions drew on different internal databases or applied extra filters."}
- {id: D2-C146, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:25, T:d2r2a:40], ver: n/a, topics: [javascript-seo],
   text: "On a retail brand's page, the rendered version promised a bigger discount for a newsletter sign-up than the non-rendered version that was served, a mismatch that can hurt customer satisfaction; the two recordings disagree on the figure the rendered page promised."}
- {id: D2-C147, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:24, T:t02:25, T:d2r2a:39, T:d2r2a:40], ver: undocumented, topics: [javascript-seo, rendering-debugging],
   text: "Offer counts, discounts and other data should always be the same in the raw HTML and the rendered page, a community speaker advised."}
- {id: D2-C148, s: D2-S05, label: analysis, ev: "", ver: n/a, topics: [rendering-debugging, javascript-seo],
   text: "Diff the raw and the rendered HTML of each key template for prices, offer counts, links and meta tags, and treat any difference in commercial data as a bug, because bots and users may get different versions."}
- {id: D2-C149, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:26, T:d2r2a:41], ver: undocumented, topics: [javascript-seo, rendering],
   text: "A search engine's renderer does not wait forever before taking its snapshot, so content from slow internal systems or APIs can be missing and unresolved placeholders can end up in the final snapshot, a community speaker said."}
- {id: D2-C150, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:26, T:d2r2a:41], ver: n/a, topics: [javascript-seo],
   text: "In one shop's example, brand names and product descriptions were rendered from a database; the brand name was missing from the meta description, and the shop sometimes appeared with unresolved placeholders and sometimes as intended."}
- {id: D2-C151, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:27, T:d2r2a:42], ver: undocumented, topics: [javascript-seo, rendering-debugging],
   text: "Unresolved placeholders caused by rendering timeouts are hard to catch because the problem moves around: it is not always the same page that is broken."}
- {id: D2-C152, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:27, T:d2r2a:42], ver: n/a, topics: [javascript-seo],
   text: "Broken titles and snippets caused by unresolved placeholders may hurt business, especially for e-commerce shops and affiliate-heavy sites, a community speaker warned."}
- {id: D2-C153, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:28, T:d2r2a:43], ver: undocumented, topics: [rendering-debugging],
   text: "To catch intermittent rendering problems, archive the full HTML and the resources of each page during a site audit and analyse them yourself, a community speaker advised."}
- {id: D2-C154, s: D2-S05, label: analysis, ev: "", ver: n/a, topics: [rendering-debugging, javascript-seo],
   text: "Add a check for unresolved template placeholders (such as {{brand}}, undefined or null) in rendered titles, meta descriptions and visible text to recurring crawls, and render the same URLs more than once, because such failures are intermittent."}
- {id: D2-C155, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:29, T:d2r2a:44], ver: undocumented, topics: [javascript-seo],
   text: "Content Security Policy lowers the risk of cross-site scripting and clickjacking by defining trusted hosts; a resource from a host that is not trusted is not used."}
- {id: D2-C156, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:29, T:d2r2a:44], ver: n/a, topics: [javascript-seo, rendering-debugging],
   text: "Content Security Policy is often misunderstood: on a page of a large German banking group, a video that should have been shown was blocked by a CSP violation, which also appeared in the browser console."}
- {id: D2-C157, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:31, T:d2r2a:45], ver: confirmed, src: [robots-intro, crawling-december-resources, javascript-seo-basics], topics: [robots-txt, javascript-seo],
   text: "Never block a resource that a page needs for rendering with robots.txt, a community speaker said, calling this common sense."}
- {id: D2-C158, s: D2-S05, label: analysis, ev: "", ver: n/a, topics: [rendering-debugging, robots-txt],
   text: "When something is missing from a rendered page, check both robots.txt and the Content Security Policy: the URL Inspection live test shows the page resources, the JavaScript console output and a screenshot of the rendered page."}
- {id: D2-C159, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:32, T:d2r2a:46], ver: undocumented, topics: [javascript-seo, rendering-debugging],
   text: "A page can render completely blank while its raw HTML looks fine, so a team checking only the raw HTML thinks all is well; causes include server misconfiguration, overload and bad scripts."}
- {id: D2-C160, s: D2-S05, label: slide, who: Sören Bendig, ev: IMG_4723, ver: n/a, topics: [javascript-seo, rendering-debugging],
   text: "A community speaker summarised five rendering blind spots to check: content and markup changes, invisible links, rendering timeouts, Content Security Policy and blocked resources."}
- {id: D2-C161, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:33, T:d2r2a:47], ver: n/a, topics: [javascript-seo, seo-scope],
   text: "Because even established brands have these rendering problems and every modern website uses a lot of JavaScript, a community speaker argued that most sites probably have them too and that ignoring rendering is reckless."}
- {id: D2-C162, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:33, T:d2r2a:47], ver: undocumented, topics: [rendering-debugging],
   text: "A community speaker strongly advised SEOs to use Chrome DevTools more often to understand what happens when their pages render."}
- {id: D2-C163, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:t02:34, T:d2r2a:48], ver: undocumented, topics: [rendering-debugging, javascript-seo],
   text: "Third-party systems billed per session that also run when bots render a page can cost a high-traffic site thousands of euros per month, a community speaker said, adding that he sees this regularly."}
- {id: D2-C164, s: D2-S05, label: docs, ev: "", ver: source, src: [fix-search-javascript], topics: [rendering, rendering-debugging],
   text: "Google says Googlebot and its Web Rendering Service identify resources that do not contribute to essential page content, such as reporting and error requests, and may not fetch them, so client-side analytics may not give a full or accurate picture of their activity."}
- {id: D2-C165, s: D2-S05, label: analysis, ev: "", ver: n/a, topics: [rendering-debugging, javascript-seo],
   text: "Compare the session counts that per-session-billed tools (chat, personalisation, testing, session replay) charge for with real user sessions, and load such tools only after a user interaction where they add no content that needs to be indexed."}
# ----- Part 3: a community speaker, debugging JavaScript rendering for Search -----
- {id: D2-C166, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:1, T:t03:5, T:t03:11, T:t03:20, T:d2r2a:51], ver: n/a, topics: [rendering-debugging, javascript-seo],
   text: "The second community lightning talk of the rendering block covered debugging JavaScript rendering for Search: how Google renders pages, a step-by-step check, four common mistakes and a worked product page example."}
- {id: D2-C167, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4724, T:t03:1, T:d2r2a:51], ver: confirmed, src: [javascript-seo-basics], topics: [rendering, indexing-pipeline],
   rel: [{type: extends, to: D1-C063}],
   text: "The diagram from Google's JavaScript SEO basics page shows a URL going from the crawl queue to the crawler, the crawled HTML going to processing, then the render queue and the renderer, whose rendered HTML returns to processing before the page reaches the index."}
- {id: D2-C168, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4724, T:t03:1], ver: confirmed, src: [javascript-seo-basics], topics: [indexing-pipeline, url-discovery, crawlable-links],
   rel: [{type: extends, to: D1-C040}, {type: extends, to: D2-C048}],
   text: "In Google's processing step, links are extracted from the HTML Google already has, before rendering, and the URLs found go back to the crawl queue."}
- {id: D2-C169, s: D2-S05, label: docs, ev: "", ver: source, src: [javascript-seo-basics], topics: [crawlable-links, indexing-pipeline, rendering],
   rel: [{type: extends, to: D1-C040}],
   text: "Google's JavaScript SEO basics guide says Googlebot extracts links twice, from the HTML response before rendering and again from the rendered HTML, so links injected with JavaScript can be found if they use crawlable <a href> markup."}
- {id: D2-C170, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4724, T:t03:2, T:d2r2a:52], ver: confirmed, src: [javascript-seo-basics], topics: [rendering],
   text: "After processing, an indexable page is placed in Google's render queue to wait for rendering."}
- {id: D2-C171, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4724], ver: undocumented, topics: [rendering],
   text: "A community speaker's slide put the usual wait in Google's render queue at seconds to a couple of minutes per page.",
   quote: "Usually from seconds to a couple minutes.", quote_checked: true}
- {id: D2-C172, s: D2-S05, label: docs, ev: "", ver: source, src: [javascript-seo-basics], topics: [rendering],
   text: "Google's JavaScript SEO basics guide says a page may wait in the render queue for a few seconds but that it can take longer, and it gives no upper limit.",
   quote: "The page may stay on this queue for a few seconds, but it can take longer than that."}
- {id: D2-C173, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:2, IMG_4724, T:d2r2a:52], ver: confirmed, src: [javascript-seo-basics, how-search-works], topics: [rendering],
   rel: [{type: extends, to: D1-C206}],
   text: "Google's renderer is a headless Chromium that runs the page's JavaScript."}
- {id: D2-C174, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4724, T:t03:3, T:d2r2a:52], ver: consistent, src: [javascript-seo-basics], topics: [rendering, indexing-pipeline],
   text: "Whatever is in the DOM at the moment Google's rendering finishes is what likely gets indexed.",
   quote: "Whatever is in the DOM at that moment is what likely gets indexed.", quote_checked: true}
- {id: D2-C175, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:4, T:d2r2a:52], ver: undocumented, topics: [rendering, javascript-seo],
   text: "If a page keeps loading content indefinitely, not all of that content will be indexed, because Google's rendering does not go on forever (this passage of the recording is partly unclear)."}
- {id: D2-C176, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:5, T:t03:6, T:d2r2a:53], ver: confirmed, src: [javascript-seo-basics, lazy-loading-guide], topics: [rendering-debugging],
   text: "To check whether JavaScript content is affected, open the URL Inspection tool in Search Console or the Rich Results Test and look for that content in the rendered HTML tab."}
- {id: D2-C177, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:7, T:d2r2a:53], ver: n/a, topics: [rendering-debugging, rendering],
   text: "A community speaker treats the rendered HTML shown in Google's testing tools as the final source of truth, because what Google sees there is what gets indexed.",
   quote: "I always treat this page as the final source of truth"}
- {id: D2-C178, s: D2-S05, label: docs, ev: "", ver: source, src: [url-inspection-help], topics: [rendering-debugging],
   text: "Google's URL Inspection help says the tool's live test examines a URL in real time, so its results can differ from Google's indexed version of the page."}
- {id: D2-C179, s: D2-S05, label: analysis, ev: [T:t03:6, T:t03:7], ver: n/a, topics: [rendering-debugging, javascript-seo],
   text: "Check rendering per template rather than per URL: inspect one URL of each page type (product, category, article) in URL Inspection and confirm that the main content, prices and internal links appear in the rendered HTML."}
- {id: D2-C180, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:8, T:d2r2a:54], ver: undocumented, topics: [rendering-debugging],
   text: "If content is missing from the rendered HTML, find the script responsible in Chrome DevTools: open the Network tab, filter by Fetch/XHR and reload the page."}
- {id: D2-C181, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:9, T:d2r2a:54], ver: consistent, src: [javascript-seo-basics, fix-search-javascript], topics: [rendering-debugging, robots-txt],
   text: "For each suspect script or API request in Chrome DevTools, check whether it runs, whether something blocks it and whether robots.txt disallows it."}
- {id: D2-C182, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:10, T:d2r2a:54], ver: undocumented, topics: [rendering-debugging],
   text: "If the cause of missing JavaScript content is still unclear after checking the network requests, search the source code for a string related to the missing content."}
- {id: D2-C183, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:11, T:t03:12, T:t03:14, T:t03:16, T:t03:18, "IMG_4725, IMG_4726, IMG_4727", T:d2r2a:55, T:d2r2a:56, T:d2r2a:57, T:d2r2a:58], ver: n/a, topics: [javascript-seo],
   text: "A community speaker listed four common but often overlooked JavaScript rendering mistakes: non-crawlable link markup, error pages that return HTTP 200 in single-page apps, content behind user interaction, and JavaScript or API resources blocked in robots.txt."}
- {id: D2-C184, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4725, T:t03:12, T:d2r2a:55], ver: confirmed, src: [links-crawlable, javascript-seo-basics], topics: [crawlable-links, javascript-seo],
   rel: [{type: extends, to: D1-C115}, {type: extends, to: D2-C040}],
   text: "Google follows links in <a href> elements; a link that only runs an onclick handler, or a hash pseudo-link such as href=#/products, may be invisible to Google."}
- {id: D2-C185, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4725], ver: confirmed, src: [javascript-seo-basics, fix-search-javascript], topics: [crawlable-links, javascript-seo],
   text: "The crawlable pattern for single-page app navigation is a real URL in the href, such as <a href=/products>, combined with History API routing (window.history.pushState) instead of hash routes."}
- {id: D2-C186, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:13, T:d2r2a:55], ver: consistent, src: [javascript-seo-basics, fix-search-javascript], topics: [crawlable-links, faceted-navigation],
   text: "Non-crawlable link markup, such as onclick links and hash pseudo-links, is common in single-page web apps, and sites that use faceted navigation should check their links for it."}
- {id: D2-C187, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4725], ver: consistent, src: [links-crawlable], topics: [crawlable-links, page-language],
   rel: [{type: extends, to: D1-C115}],
   text: "A market or language selector built as a button works for users but leaves the whole cluster of alternate-language pages without crawlable links, so the cluster is orphaned for Google.",
   quote: "The nav works perfectly for users, and the entire alternate-language cluster is orphaned.", quote_checked: true}
- {id: D2-C188, s: D2-S05, label: analysis, ev: [IMG_4725, T:t03:12, T:t03:13], ver: n/a, topics: [crawlable-links, faceted-navigation],
   rel: [{type: extends, to: D1-C101}],
   text: "Hash-fragment links are a problem only where Google should follow them: product, category and language links need a real URL in an <a href>, while fragments can deliberately keep filter combinations out of the crawl, as Google's faceted navigation guide allows."}
- {id: D2-C189, s: D2-S05, label: analysis, ev: [IMG_4725], ver: n/a, topics: [crawlable-links, page-language],
   rel: [{type: extends, to: D1-C067}],
   text: "Build market and language selectors as plain <a href> links to each alternate URL, not buttons or script handlers; otherwise the language versions have no internal links and depend on sitemaps to be found, which is slow."}
- {id: D2-C190, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:14, T:t03:15, T:d2r2a:56], ver: confirmed, src: [fix-search-javascript, javascript-seo-basics], topics: [soft-404, javascript-seo],
   rel: [{type: extends, to: D1-C073}],
   text: "In single-page apps, a missing page often shows a custom 404 page while the server returns HTTP 200, because the front-end router, not the server, handles the 404."}
- {id: D2-C191, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:15, T:d2r2a:56], ver: consistent, src: [javascript-seo-basics], topics: [soft-404, javascript-seo],
   text: "The fix for a client-side soft 404 is to make a missing page end with a real HTTP 404 status code instead of 200."}
- {id: D2-C192, s: D2-S05, label: docs, ev: "", ver: source, src: [javascript-seo-basics, fix-search-javascript], topics: [soft-404, javascript-seo],
   text: "Google's JavaScript guides say that when client-side routing makes a real 404 status impractical, a single-page app can avoid soft 404s by redirecting with JavaScript to a URL whose server returns 404, or by adding a robots noindex meta tag with JavaScript."}
- {id: D2-C193, s: D2-S05, label: analysis, ev: [T:t03:14, T:t03:15], ver: n/a, topics: [soft-404, javascript-seo],
   text: "In a single-page app, let the server return 404 for unknown routes where possible; otherwise use one of the two client-side fixes Google documents for error views: a JavaScript redirect to a URL that returns 404, or a robots noindex added with JavaScript."}
- {id: D2-C194, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:16, T:d2r2a:57], ver: n/a, topics: [lazy-loading],
   text: "A community speaker called not hiding content behind user interaction the most important of the four JavaScript rendering mistakes."}
- {id: D2-C195, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4726, T:t03:16, T:d2r2a:57], ver: confirmed, src: [mobile-first-indexing, lazy-loading-guide], topics: [lazy-loading, rendering],
   rel: [{type: extends, to: D1-C115}],
   text: "Content that loads only after a user action such as a click or a scroll is not in the DOM while Google renders the page, so Google cannot index it."}
- {id: D2-C196, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4726], ver: consistent, src: [javascript-seo-basics, mobile-first-indexing], topics: [lazy-loading, rendering],
   text: "For rendering, what matters is whether content is present in the DOM, not whether it is visible on screen: hidden content can be indexed, absent content cannot.",
   quote: "Not visible versus hidden. Present versus absent in the DOM.", quote_checked: true}
- {id: D2-C197, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4726, T:t03:16], ver: consistent, src: [lazy-loading-guide, seo-office-hours-2023-03], topics: [lazy-loading],
   rel: [{type: extends, to: D1-C114}],
   text: "Lazy loading triggered by a scroll event listener, such as window.addEventListener('scroll', loadMoreProducts), never runs for Googlebot because Googlebot does not scroll.",
   quote: "Googlebot doesn't scroll. Never runs.", quote_checked: true}
- {id: D2-C198, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4726, T:t03:16], ver: confirmed, src: [lazy-loading-guide], topics: [lazy-loading, javascript-seo],
   text: "Lazy loading should be triggered by an Intersection Observer that watches a sentinel element instead of by a scroll event listener."}
- {id: D2-C199, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4726], ver: consistent, src: [lazy-loading-guide, seo-office-hours-2023-03], topics: [lazy-loading, rendering],
   text: "An Intersection Observer fires when the observed element enters the viewport, and the viewport Google renders with is tall, so content lazy-loaded this way can load during rendering.",
   quote: "Fires on viewport entry. Viewport is tall.", quote_checked: true}
- {id: D2-C200, s: D2-S05, label: docs, ev: "", ver: source, src: [seo-office-hours-2023-03], topics: [lazy-loading, rendering, pagination],
   text: "In Google's March 2023 SEO office hours, John Mueller said Google handles infinite scroll with viewport expansion, rendering a page like a very long phone, which is not very efficient and can miss content, so pagination links are strongly recommended.",
   quote: "this is done through a technique called \"viewport expansion\", where we render a page like a very long phone."}
- {id: D2-C201, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4726], ver: confirmed, src: [mobile-first-indexing, pagination-guide], topics: [lazy-loading, javascript-seo],
   rel: [{type: extends, to: D1-C115}],
   text: "Tab or accordion content fetched from an API only when a user clicks the tab, as in tab.onclick = () => fetch('/api/specs'), does not exist for Google until someone clicks.",
   quote: "Doesn't exist until someone clicks", quote_checked: true}
- {id: D2-C202, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4726, T:t03:17, T:d2r2a:57], ver: consistent, src: [mobile-first-indexing], topics: [lazy-loading],
   text: "Tab and accordion content should be in the DOM from the start and only hidden with CSS or the hidden attribute; Google indexes such hidden content.",
   quote: "CSS-hidden is fine. Google indexes it.", quote_checked: true}
- {id: D2-C203, s: D2-S05, label: analysis, ev: [IMG_4726, T:t03:16, T:t03:17], ver: n/a, topics: [lazy-loading, pagination, javascript-seo],
   text: "Audit tabs, accordions and 'load more' lists for content fetched on click or scroll: put tab content in the initial DOM and hide it with CSS, trigger lazy loading with an Intersection Observer, and give long lists paginated URLs linked with <a href>."}
- {id: D2-C204, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4727, T:t03:18, T:d2r2a:58], ver: confirmed, src: [javascript-seo-basics, crawling-december-resources, robots-intro], topics: [javascript-seo, robots-txt, rendering],
   rel: [{type: extends, to: D1-C064}],
   text: "Blocking JavaScript or API resources in robots.txt is a classic rendering mistake: if Google's renderer cannot fetch a resource, it cannot run it.",
   quote: "If the renderer can't fetch it, the renderer can't run it.", quote_checked: true}
- {id: D2-C205, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4727, T:t03:18, T:d2r2a:58], ver: consistent, src: [robots-intro, inside-googlebot-blog, crawling-december-resources], topics: [javascript-seo, robots-txt],
   text: "Disallowing a script folder such as /static/js/ or a generic /api/ folder in robots.txt can block the endpoints that supply a page's content, leaving blank modules and missing content after rendering."}
- {id: D2-C206, s: D2-S05, label: docs, ev: "", ver: source, src: [crawling-december-resources, inside-googlebot-blog], topics: [rendering, javascript-seo],
   text: "Google says its Web Rendering Service fetches the resources a page references through Googlebot, including JavaScript, CSS and XHR requests to APIs, but not images or videos."}
- {id: D2-C207, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4727, T:t03:19, T:d2r2a:58], ver: consistent, src: [robots-spec, robots-intro], topics: [robots-txt, javascript-seo],
   text: "If an API folder must stay blocked in robots.txt, allow the endpoints that rendering needs, for example Disallow: /api/ together with Allow: /api/products/.",
   quote: "Carve out only what rendering needs.", quote_checked: true}
- {id: D2-C208, s: D2-S05, label: analysis, ev: [IMG_4727, T:t03:19], ver: n/a, topics: [robots-txt, javascript-seo, rendering-debugging],
   rel: [{type: extends, to: D1-C081}],
   text: "A robots.txt carve-out works because Google applies the most specific matching rule, so Allow: /api/products/ beats Disallow: /api/ for product endpoints only; re-test a rendered page after every robots.txt change to script or API paths."}
- {id: D2-C209, s: D2-S05, label: slide, who: Rebecca Yu, ev: [IMG_4727], ver: confirmed, src: [robots-spec], topics: [robots-txt, javascript-seo],
   text: "robots.txt rules apply per host, so the rules in example.com/robots.txt do not apply at all to an API served from api.example.com."}
- {id: D2-C210, s: D2-S05, label: analysis, ev: [IMG_4727], ver: n/a, topics: [robots-txt, javascript-seo],
   rel: [{type: extends, to: D1-C074}],
   text: "An API or CDN on its own host needs its own robots.txt check: a blanket Disallow there, or a robots.txt that returns 5xx errors, can stop Google fetching the data a page renders from."}
- {id: D2-C211, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:20, T:d2r2a:59], ver: consistent, src: [javascript-seo-basics], topics: [javascript-seo, rendering],
   text: "On a product page whose data is fetched client-side, the rendering mistakes described can leave Google seeing no content at all while users still see the price and images."}
- {id: D2-C212, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:21, T:d2r2a:59], ver: n/a, topics: [javascript-seo, crawlable-links, lazy-loading],
   text: "In the speaker's product page example, three of the mistakes combine: product links behind onclick handlers keep the product detail pages hidden, the product API is blocked in robots.txt, and some content waits for a user interaction."}
- {id: D2-C213, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:22, T:d2r2a:59], ver: confirmed, src: [http-network-errors], topics: [soft-404, javascript-seo],
   rel: [{type: extends, to: D1-C073}],
   text: "A page that renders empty for Google, such as a client-side product page hit by these mistakes, is seen as thin content and ends up treated as a soft 404 even though users see a full page."}
- {id: D2-C214, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:23, T:d2r2a:60], ver: n/a, topics: [javascript-seo, rendering],
   text: "A community speaker summed up JavaScript rendering issues as cases where search engines cannot execute, access or trigger the code needed to display a page's core content.",
   quote: "JavaScript rendering issues happen when search engines cannot execute, access or trigger the code required to display your core content."}
- {id: D2-C215, s: D2-S05, label: stage, who: Rebecca Yu, ev: [T:t03:24, T:d2r2a:60], ver: consistent, src: [javascript-seo-basics, fix-search-javascript], topics: [rendering-debugging],
   text: "To find rendering issues, compare a page's raw source code with its rendered versions, including the rendered HTML that Google's testing tools show; the differences point to the problems."}
# ----- Part 4: Natalia Venditto (community speaker), Web Fragments and JavaScript standards -----
- {id: D2-C216, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:1, T:d2r2a:62], ver: n/a, topics: [web-fragments, web-standards],
   text: "Natalia Venditto, a Principal Software Engineer at Adobe, gave a seven-minute community lightning talk on JavaScript and web standards, built around the Web Fragments library."}
- {id: D2-C217, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:1, T:d2r2a:62], ver: n/a, topics: [web-standards],
   rel: [{type: repeats, to: D2-C052}],
   text: "Natalia Venditto opened by saying that Gary had said earlier at the event that everyone can write a standard, and that this is what the Web Fragments work is trying to do."}
- {id: D2-C218, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:2, T:t04:6, T:d2r2a:63, T:d2r2a:65], ver: n/a, topics: [web-fragments],
   text: "Natalia Venditto said teams are increasingly asked to integrate AI-generated content and applications into existing web applications and want to do so without breaking the host application, a situation she called a typical micro-frontend scenario."}
- {id: D2-C219, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:3, T:t04:16, T:d2r2a:64], ver: undocumented, topics: [web-fragments],
   text: "Natalia Venditto named three typical failure modes by which an embedded app can break the application hosting it: collisions in the global JavaScript scope and module registry, CSS bleed, and fate sharing."}
- {id: D2-C220, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:4, T:d2r2a:64], ver: undocumented, topics: [web-fragments],
   text: "CSS bleed, as Natalia Venditto described it, means styles leak between an embedded app and its host, so that suddenly everything looks like the embedded app or the embedded app takes on the look of the host."}
- {id: D2-C221, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:5, T:d2r2a:64], ver: undocumented, topics: [web-fragments],
   text: "Fate sharing means a failure in an embedded app spreads to its host, for example an unhandled exception in the embedded app that ends up breaking the host application."}
- {id: D2-C222, s: D2-S05, label: analysis, ev: [T:t04:5], ver: n/a, src: [fix-search-javascript], topics: [javascript-seo, rendering-debugging, web-fragments],
   text: "Pages that embed third-party or AI-generated apps can share their fate, since an unhandled exception in the embedded code can break the host page; check the rendered HTML and JavaScript console output of such pages in Google's testing tools to make sure the host's own content still renders."}
- {id: D2-C223, s: D2-S05, label: slide, who: Natalia Venditto, ev: [IMG_4728, T:t04:7], ver: n/a, topics: [web-fragments],
   text: "A slide titled Orchestration approaches compared four ways to combine micro-frontends in one page (iframe, Shadow DOM, rewriting everything, and reframing with Web Fragments) on three criteria (JavaScript isolated, styles isolated, part of the page) and named the catch of each."}
- {id: D2-C224, s: D2-S05, label: slide, who: Natalia Venditto, ev: [IMG_4728, T:t04:7, T:d2r2a:65], ver: undocumented, topics: [web-fragments, accessibility],
   text: "An iframe, the long-established way to embed an app, isolates both JavaScript and styles but is not part of the page: it is walled off from the host's DOM, navigation and layout, which Natalia Venditto said brings many problems with accessibility, layout and navigation.",
   quote: "Walled off from DOM, navigation, layout", quote_checked: true}
- {id: D2-C226, s: D2-S05, label: analysis, ev: [T:t04:7, IMG_4728], ver: n/a, topics: [accessibility, web-fragments],
   text: "Before embedding an app or widget in an iframe, test it with a keyboard and a screen reader as well as for layout and navigation, because the isolation an iframe gives comes at those costs."}
- {id: D2-C227, s: D2-S05, label: docs, ev: "", ver: source, src: [seo-office-hours-2023-12, indexifembedded-blog], topics: [web-fragments],
   text: "Google says its systems generally try to index the content of a page embedded with an iframe as part of the page that embeds it, but this is not guaranteed because both pages are also normal HTML pages on their own."}
- {id: D2-C228, s: D2-S05, label: slide, who: Natalia Venditto, ev: [IMG_4728, T:t04:8, T:d2r2a:65], ver: undocumented, topics: [web-fragments],
   text: "Shadow DOM isolates styles and keeps the embedded content part of the page, but it does not isolate JavaScript: the embedded code still shares the host's JavaScript globals.",
   quote: "Still shares JS globals", quote_checked: true}
- {id: D2-C229, s: D2-S05, label: slide, who: Natalia Venditto, ev: [IMG_4728, T:t04:9], ver: undocumented, topics: [web-fragments],
   text: "Rewriting everything into one application keeps the result part of the page, but JavaScript and style isolation then have to be done by hand."}
- {id: D2-C230, s: D2-S05, label: slide, who: Natalia Venditto, ev: [IMG_4728, T:t04:9, T:d2r2a:65], ver: n/a, topics: [web-fragments],
   text: "The catch the comparison slide gave for rewriting everything was that you cannot rewrite code you did not write; Natalia Venditto explained that AI cannot rewrite code already in place because it does not know its requirements, design system or other constraints.",
   quote: "Can't rewrite code you didn't write", quote_checked: true}
- {id: D2-C231, s: D2-S05, label: slide, who: Natalia Venditto, ev: [IMG_4728, T:t04:10, T:t04:20], ver: undocumented, topics: [web-fragments],
   text: "Reframing with Web Fragments was the only approach on the comparison slide ticked for all three criteria (JavaScript isolated, styles isolated, part of the page); its stated catch is that it relies on browser patches today.",
   quote: "Needs patches today", quote_checked: true}
- {id: D2-C232, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:10, T:t04:11, T:d2r2a:66], ver: undocumented, topics: [web-fragments],
   text: "Web Fragments is a lightweight library that puts a hidden iframe in the host page and uses it as an isolated sandbox to run the embedded app's JavaScript, not to render the app."}
- {id: D2-C233, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:11, T:d2r2a:66], ver: undocumented, topics: [web-fragments],
   text: "Web Fragments fetches the embedded app's assets from a remote endpoint through middleware that acts as a gateway."}
- {id: D2-C234, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:11, T:d2r2a:66], ver: undocumented, topics: [web-fragments],
   text: "Web Fragments reframes the embedded app's DOM by placing it inside a shadow DOM in the host page, while the app's JavaScript runs in the hidden iframe."}
- {id: D2-C235, s: D2-S05, label: docs, ev: "", ver: source, src: [javascript-seo-basics, fix-search-javascript], topics: [web-fragments, rendering],
   text: "Google's documentation says Google supports web components and flattens shadow DOM and light DOM content when it renders a page, and that content not visible in the rendered HTML cannot be indexed."}
- {id: D2-C236, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:12, T:d2r2a:66], ver: undocumented, topics: [web-fragments],
   text: "With Web Fragments the page ends up as a single document in which the host application does not know the embedded app runs inside it and the embedded app does not know it lives in another document."}
- {id: D2-C237, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:13, T:d2r2a:67], ver: undocumented, topics: [web-fragments],
   text: "Web Fragments monkey-patches browser APIs to containerize the browser, recreating inside it an architecture similar to Docker containers on the back end.",
   quote: "we monkey patch the browser to containerize it"}
- {id: D2-C238, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:14, T:d2r2a:67], ver: undocumented, topics: [web-fragments],
   text: "The browser APIs Web Fragments patches include document, history and location; Natalia Venditto said they are virtualized rather than hijacked, so controls work exactly as in a normal application."}
- {id: D2-C239, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:14, T:d2r2a:67], ver: undocumented, topics: [web-fragments],
   text: "Web Fragments retargets dispatchEvent calls to the fragment's shadow root and resolves DOM calls such as appendChild and element lookups against the main document."}
- {id: D2-C240, s: D2-S05, label: analysis, ev: [T:t04:13, T:t04:14], ver: n/a, src: [fix-search-javascript], topics: [rendering-debugging, web-fragments],
   text: "Because Web Fragments monkey-patches core browser APIs such as document, history and location, test pages that use it in Google's rendering (the rendered HTML in Search Console's URL Inspection tool or the Rich Results Test), not only in a normal desktop browser."}
- {id: D2-C241, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:16, T:d2r2a:68], ver: undocumented, topics: [web-fragments],
   text: "Natalia Venditto said Web Fragments suits AI-generated apps because a web fragment used as a custom element sandboxes the app's rendering, avoiding collisions and CSS bleed between the app and its host in either direction."}
- {id: D2-C242, s: D2-S05, label: slide, who: Natalia Venditto, ev: [IMG_4729, T:t04:17], ver: undocumented, topics: [web-fragments],
   text: "A slide set out Web Fragments in five steps: an LLM writes the app and adds a custom element such as <web-fragment fragment-id=\"some-id\"> to the HTML, a standalone HTTP endpoint is set up, the library is imported and initialized with initializeWebFragments(), the fragment is registered in the gateway, and step 5 is a celebration emoji."}
- {id: D2-C243, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:17, T:d2r2a:69], ver: undocumented, topics: [web-fragments],
   text: "Natalia Venditto said the five Web Fragments steps are all that is needed to run a containerized application fully on the client side."}
- {id: D2-C244, s: D2-S05, label: slide, who: Natalia Venditto, ev: [IMG_4729, T:t04:18, T:d2r2a:70], ver: undocumented, topics: [web-fragments],
   text: "A web fragment is served from its own standalone HTTP endpoint, so the embedded app can be deployed anywhere, separately from the host page."}
- {id: D2-C245, s: D2-S05, label: analysis, ev: [T:t04:11, T:t04:18, IMG_4729], ver: n/a, src: [robots-spec, javascript-seo-basics], topics: [javascript-seo, robots-txt, web-fragments],
   text: "Make sure robots.txt does not block the URLs from which the browser loads a fragment's assets (the gateway paths on the host page's origin, or the endpoint's own host if assets load from there), because Google does not render JavaScript from blocked files and robots.txt rules apply per host."}
- {id: D2-C246, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:18, T:d2r2a:70], ver: undocumented, topics: [web-fragments],
   text: "Natalia Venditto said Web Fragments is framework-agnostic and vendor-agnostic and works the same whatever JavaScript framework the embedded app uses."}
- {id: D2-C247, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:19, T:d2r2a:70], ver: consistent, src: [javascript-seo-basics], topics: [web-fragments, javascript-seo],
   text: "Natalia Venditto recommended that web fragments be server-rendered.", private: false}
- {id: D2-C248, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:19, T:d2r2a:70], ver: undocumented, topics: [web-fragments, javascript-seo],
   text: "Natalia Venditto reported an enormous performance increase (no figure given) when an application is reframed inside a fully client-side host, because the reframed app is rendered and interactive immediately.", private: false}
- {id: D2-C249, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:19, T:d2r2a:70], ver: undocumented, topics: [web-fragments, rendering],
   text: "Natalia Venditto said a server-rendered app reframed into the host page is fully indexable.", private: false}
- {id: D2-C250, s: D2-S05, label: analysis, ev: [T:t04:11], ver: n/a, src: [javascript-seo-basics], topics: [rendering-debugging, web-fragments, rendering],
   text: "Because Google flattens shadow DOM when it renders, content that Web Fragments places in a shadow root can in principle be indexed with the host page, but only if it appears in the rendered HTML; check that in URL Inspection rather than relying on a library's promise of indexability."}
- {id: D2-C251, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:20, IMG_4728, T:d2r2a:71], ver: n/a, topics: [web-standards, web-fragments],
   text: "Natalia Venditto said the goal of the Web Fragments team is not to maintain monkey patches but to standardize the approach."}
- {id: D2-C252, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:20, T:d2r2a:71], ver: n/a, topics: [web-standards, web-fragments],
   text: "Natalia Venditto said the case for standardizing Web Fragments is that it already relies on many existing browser APIs, built that way so as not to rewrite much or reinvent the wheel."}
- {id: D2-C253, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:21, T:d2r2a:71], ver: undocumented, topics: [web-standards, web-fragments],
   text: "Natalia Venditto said ShadowRealm, a JavaScript standard proposal, was at stage 2.7 at the time of the talk, which she glossed as meaning that only implementation is missing.",
   quote: "the only thing missing is implementation"}
- {id: D2-C254, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:21, T:d2r2a:71], ver: undocumented, topics: [web-standards, web-fragments],
   text: "Natalia Venditto said the ShadowRealm proposal would do much of what Web Fragments does today with patches: containerizing and isolating execution."}
- {id: D2-C255, s: D2-S05, label: stage, who: Natalia Venditto, ev: [T:t04:21, T:d2r2a:71], ver: n/a, topics: [web-standards, web-fragments],
   text: "Natalia Venditto said the Web Fragments team supports the ShadowRealm standard proposal."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D2-C856, s: D2-S05, label: stage, who: Sören Bendig, ev: T:d2r2a:33, ver: n/a, topics: [javascript-seo, rendering-debugging],
   text: "Websites that rely heavily on JavaScript and rendering have common blind spots, because these features often break in subtle ways, a community speaker said."}
- {id: D2-C857, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:d2r2a:34, T:t02:18], ver: n/a, topics: [rendering-debugging, seo-scope],
   text: "None of the rendering problems a community speaker showed from established brands' sites had been fixed promptly: some were fixed by the time of the talk and some were still live."}
- {id: D2-C858, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:d2r2a:37, T:t02:22], ver: undocumented, topics: [javascript-seo, snippet-controls],
   rel: [{type: extends, to: D2-C142}],
   text: "Search engines such as Google and Bing would ignore HTML tags written inside a meta description, a community speaker said."}
- {id: D2-C859, s: D2-S05, label: stage, who: Sören Bendig, ev: [T:d2r2a:45, T:t02:30], ver: n/a, topics: [javascript-seo, rendering-debugging],
   rel: [{type: extends, to: D2-C156}],
   text: "A rendering failure such as a Content Security Policy blocking a video on a landing page that explains how to open a business account could have a drastic impact for a purely online business, a community speaker warned."}
- {id: D2-C860, s: D2-S05, label: stage, who: Sören Bendig, ev: T:d2r2a:47, ver: undocumented, topics: [rendering-debugging],
   rel: [{type: extends, to: D2-C162}],
   text: "Besides using Chrome DevTools more often, a community speaker advised checking rendering at scale with a modern crawler."}

# ---------- D2-S06 What is Google friendly JavaScript ----------
- {id: D2-C256, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:1, T:d2r2b:1], ver: confirmed, src: [javascript-seo-basics, how-search-works], topics: [rendering],
   text: "Google renders nearly all of the web by replicating what a browser does, using a real browser's rendering engine.",
   quote: "Google renders nearly all of the internet by replicating browser actions"}
- {id: D2-C257, s: D2-S06, label: docs, ev: "", ver: source, src: [javascript-seo-basics], topics: [rendering],
   text: "Google's JavaScript SEO basics says every page with a 200 status code is queued for rendering, whether or not it uses JavaScript, unless a robots meta tag or header says not to index it; for non-200 pages such as 404 error pages, rendering might be skipped."}
- {id: D2-C258, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:2, T:d2r2b:2], ver: consistent, src: [javascript-seo-basics], topics: [rendering, javascript-seo],
   text: "If JavaScript rendering fails, what Google indexes for a page differs from what the page shows once it is rendered."}
- {id: D2-C259, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:2, T:d2r2b:2], ver: consistent, src: [javascript-seo-basics, fix-search-javascript], topics: [javascript-seo],
   rel: [{type: extends, to: D2-C149}],
   text: "Erin Sparling named server-side or hybrid rendering, fallbacks and not leaving placeholders in the DOM, among other measures, as ways to guard against failed JavaScript rendering."}
- {id: D2-C260, s: D2-S06, label: slide, who: Erin Sparling, ev: [IMG_4730, T:t05:3, T:d2r2b:3], ver: consistent, src: [javascript-seo-basics, fix-search-javascript], topics: [javascript-seo],
   text: "Google listed four common JavaScript problems for indexing: content not present in the rendered HTML, using # in URLs for content changes, soft 404s and blocked resources."}
- {id: D2-C261, s: D2-S06, label: slide, who: Erin Sparling, ev: [IMG_4730, T:t05:4], ver: undocumented, topics: [javascript-seo, rendering],
   text: "Google's slide called content missing from the rendered HTML the most common JavaScript issue for indexing.",
   quote: "The most common issue.", quote_checked: true}
- {id: D2-C262, s: D2-S06, label: slide, who: Erin Sparling, ev: [IMG_4730, T:t05:4], ver: confirmed, src: [javascript-seo-basics], topics: [javascript-seo, rendering],
   rel: [{type: repeats, to: D2-C174}],
   text: "Content that is not in the final DOM after rendering cannot be seen by Google, so it cannot be indexed.",
   quote: "If it's not in the final DOM, Google can't see it.", quote_checked: true}
- {id: D2-C263, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:4, T:d2r2b:3], ver: undocumented, topics: [javascript-seo, rendering],
   rel: [{type: extends, to: D2-C149}],
   text: "Content is missing from the rendered HTML either because the server does not serve it or because the content has still not appeared after some period of time."}
- {id: D2-C264, s: D2-S06, label: slide, who: Erin Sparling, ev: [IMG_4730, T:t05:6], ver: confirmed, src: [http-network-errors, fix-search-javascript], topics: [soft-404, javascript-seo],
   rel: [{type: repeats, to: D1-C073}],
   text: "Google's slide defined a soft 404 in a JavaScript application as a page that serves a 'Not Found' message but returns a 200 HTTP status code.",
   quote: "Your application serves a \"Not Found\" message but returns a 200 HTTP status code.", quote_checked: true}
- {id: D2-C265, s: D2-S06, label: slide, who: Erin Sparling, ev: [IMG_4730, T:t05:7, T:d2r2b:23], ver: consistent, src: [javascript-seo-basics, robots-intro], topics: [javascript-seo, robots-txt],
   rel: [{type: repeats, to: D2-C204}],
   text: "Blocked resources, one of Google's four common JavaScript indexing problems, means robots.txt disallowing the crawling of critical JavaScript files or API endpoints.",
   quote: "robots.txt disallowing crawling of critical .js or API endpoints.", quote_checked: true}
- {id: D2-C266, s: D2-S06, label: slide, who: Erin Sparling, ev: [IMG_4731, video:IMG_4732, T:t05:8, T:d2r2b:6, T:d2r2b:7], ver: consistent, src: [javascript-seo-basics, lazy-loading-guide, fix-search-javascript], topics: [javascript-seo, rendering],
   text: "Google named three causes of content missing from the rendered HTML: JavaScript inaccessible to Googlebot, JavaScript DOM event triggers and disabled browser APIs."}
- {id: D2-C267, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:9, T:d2r2b:6], ver: consistent, src: [javascript-seo-basics], topics: [javascript-seo, rendering],
   text: "When the JavaScript is not accessible to Googlebot, Google cannot render the client-side DOM that the page builds asynchronously, so parts of the page may be present while the main content is absent."}
- {id: D2-C268, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:10, T:d2r2b:7], ver: confirmed, src: [lazy-loading-guide, pagination-guide], topics: [lazy-loading, rendering],
   rel: [{type: extends, to: D1-C115}, {type: repeats, to: D2-C195}],
   text: "Content that loads only when a user clicks an element is not supported in the way Google renders pages for indexing."}
- {id: D2-C269, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:11, T:t05:16, T:d2r2b:8, T:d2r2b:12], ver: confirmed, src: [fix-search-javascript], topics: [rendering, javascript-seo],
   text: "Browser APIs that need user permission, such as payments and location, are not supported when Google renders a page."}
- {id: D2-C270, s: D2-S06, label: slide, who: Erin Sparling, ev: [IMG_4731, T:t05:12, T:d2r2b:9], ver: n/a, topics: [javascript-seo],
   text: "Google said there is no single fix for content missing from the rendered HTML: the solution varies by case, and the advice is to follow best practices.",
   quote: "Solution: varies by case, but follow best practices.", quote_checked: true}
- {id: D2-C271, s: D2-S06, label: stage, who: Erin Sparling, ev: [IMG_4733, T:t05:13, T:d2r2b:10, T:d2r2b:11], ver: confirmed, src: [lazy-loading-guide], topics: [lazy-loading, rendering],
   rel: [{type: extends, to: D1-C114}, {type: repeats, to: D2-C197}, {type: extends, to: D1-C491}],
   text: "Google does not scroll a page when it renders it for indexing, so content that infinite scroll loads on scroll-depth triggers works for users but is never loaded for Google."}
- {id: D2-C272, s: D2-S06, label: stage, who: Erin Sparling, ev: [IMG_4733, T:t05:14, T:d2r2b:11], ver: undocumented, topics: [rendering, lazy-loading],
   rel: [{type: extends, to: D2-C199}],
   text: "Instead of scrolling, Google renders a page in a very tall viewport, around 10,000 pixels high.",
   quote: "it renders it in a very tall viewport. Specifically, around 10,000 pixels is what the viewport gets rendered as."}
- {id: D2-C273, s: D2-S06, label: docs, ev: "", ver: source, src: [seo-office-hours-2023-03], topics: [lazy-loading, rendering],
   text: "Google's March 2023 SEO office hours say Google sees infinite-scroll content through viewport expansion, rendering a page like a very long phone, which is not particularly efficient and can miss infinite content.",
   quote: "a technique called \"viewport expansion\", where we render a page like a very long phone"}
- {id: D2-C274, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:14, T:d2r2b:11], ver: confirmed, src: [lazy-loading-guide], topics: [lazy-loading, javascript-seo],
   rel: [{type: repeats, to: D2-C199}],
   text: "Content loaded as elements enter the viewport, for example with an Intersection Observer, does load when Google renders a page, because Google's rendering viewport is very tall."}
- {id: D2-C275, s: D2-S06, label: analysis, ev: "", ver: n/a, topics: [lazy-loading, javascript-seo],
   text: "Treat the 10,000-pixel viewport as a safety margin, not a target: load lazy content when it enters the viewport (Intersection Observer or native lazy loading, never scroll listeners), and give infinite-scroll content paginated URLs linked with <a href> so anything below the first rendered screen stays reachable."}
- {id: D2-C276, s: D2-S06, label: docs, ev: "", ver: source, src: [lazy-loading-guide], topics: [lazy-loading, crawlable-links],
   rel: [{type: extends, to: D1-C115}],
   text: "To make infinite scroll indexable, Google's lazy-loading guide says to support paginated loading: give each chunk its own persistent, unique URL, link sequentially to those URLs, and update the displayed URL with the History API when a new chunk becomes the main visible element."}
- {id: D2-C277, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:15, T:d2r2b:12], ver: confirmed, src: [fix-search-javascript], topics: [rendering],
   text: "WebGL does not work well in Google's rendering: a WebGL shader that makes a page look like it is underwater will not be applied when Google renders the page."}
- {id: D2-C278, s: D2-S06, label: docs, ev: "", ver: source, src: [fix-search-javascript], topics: [javascript-seo, rendering],
   text: "For effects that need WebGL, which Googlebot does not support, Google's guide to fixing JavaScript problems suggests skipping the effect or prerendering it with server-side rendering so that the content is accessible to Googlebot."}
- {id: D2-C279, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:17, T:d2r2b:13], ver: confirmed, src: [javascript-seo-basics, fix-search-javascript], topics: [javascript-seo],
   text: "Erin Sparling recommended differential serving and polyfills to keep a site compatible with Google's rendering engine where it lacks a browser feature."}
- {id: D2-C280, s: D2-S06, label: docs, ev: "", ver: source, src: [javascript-seo-basics], topics: [javascript-seo],
   text: "Google's JavaScript SEO basics recommends differential serving and polyfills when feature detection finds a missing browser API, and warns that some browser features cannot be polyfilled.",
   quote: "We recommend using differential serving and polyfills if you feature-detect a missing browser API that you need."}
- {id: D2-C281, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:18, T:d2r2b:13], ver: undocumented, topics: [javascript-seo, web-standards, web-fragments],
   rel: [{type: extends, to: D2-C254}],
   text: "Polyfills work in two directions: they patch backwards where a browser lacks support, or patch forward to build now for a feature expected in the future, as Web Fragments does."}
- {id: D2-C282, s: D2-S06, label: analysis, ev: "", ver: n/a, topics: [javascript-seo, rendering],
   text: "Wrap permission-based features (location, payments, camera) and WebGL effects in feature detection with a fallback, so the main content renders when the API is missing or the permission is declined; never make indexable content wait for a permission prompt."}
- {id: D2-C283, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:19, T:d2r2b:14], ver: undocumented, topics: [crawlable-links, javascript-seo],
   text: "Erin Sparling called URL fragments (the part of a URL after #) the next most common JavaScript issue seen, after rendering problems and blocked rendering."}
- {id: D2-C284, s: D2-S06, label: slide, who: Erin Sparling, ev: [IMG_4730, T:t05:19, T:d2r2b:14], ver: confirmed, src: [fix-search-javascript, javascript-seo-basics], topics: [crawlable-links, javascript-seo],
   rel: [{type: repeats, to: D1-C101}],
   text: "URL fragments (#) are often ignored by crawlers: a fragment exists only in the browser, so Google cannot request it.",
   quote: "Fragment identifiers (#) are often ignored by crawlers.", quote_checked: true}
- {id: D2-C285, s: D2-S06, label: slide, who: Erin Sparling, ev: [IMG_4730, T:t05:20, T:d2r2b:15], ver: confirmed, src: [javascript-seo-basics, fix-search-javascript], topics: [crawlable-links, javascript-seo],
   rel: [{type: repeats, to: D2-C185}],
   text: "Google recommends the History API to give single-page apps clean URLs instead of fragment-based routes.",
   quote: "Use the History API for clean URLs in SPAs.", quote_checked: true}
- {id: D2-C286, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:21, T:t05:22, T:d2r2b:16], ver: consistent, src: [javascript-seo-basics], topics: [javascript-seo, crawlable-links],
   text: "Moving a single-page app from fragment-based routes to real paths with the History API keeps the same client-side behaviour and was described as not free but relatively straightforward."}
- {id: D2-C287, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:23, T:d2r2b:17], ver: confirmed, src: [links-crawlable, javascript-seo-basics], topics: [crawlable-links],
   rel: [{type: extends, to: D1-C040}, {type: extends, to: D2-C040}],
   text: "A link that is an <a> element but does not point to a real URL gives Google something to look at, but Google will not know where the link goes."}
- {id: D2-C288, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:24, T:t05:25, T:t05:26, T:d2r2b:18, T:d2r2b:19], ver: confirmed, src: [javascript-seo-basics], topics: [crawlable-links, javascript-seo],
   rel: [{type: extends, to: D2-C185}],
   text: "With the History API, a single-page app can use real links and attach event listeners that intercept the click, rewrite the URL with pushState and load the new content, so Google can follow the links while users avoid full page reloads."}
- {id: D2-C289, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:27, T:t05:28, T:d2r2b:20], ver: undocumented, topics: [crawlable-links, javascript-seo],
   text: "Real URLs also work as deep links: Android, iOS and desktop operating systems accept full URLs as keys to specific content in an app, so clean URLs simplify the cross-platform user experience, not only indexing."}
- {id: D2-C290, s: D2-S06, label: analysis, ev: "", ver: n/a, topics: [crawlable-links, javascript-seo],
   text: "Audit a single-page app by searching both the templates and the rendered HTML for href=\"#...\" routes, <a> elements without href and onclick navigation; every view that should rank needs an <a href> link to a real path."}
- {id: D2-C291, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:29, T:t05:30, T:d2r2b:21], ver: confirmed, src: [fix-search-javascript, javascript-seo-basics], topics: [soft-404, javascript-seo],
   rel: [{type: extends, to: D1-C073}, {type: repeats, to: D2-C190}],
   text: "In JavaScript single-page apps, soft 404s typically arise because the server returns the app with a 200 status for every URL, so when the app shows a 'not found' message for a URL that does not exist, no error is reported."}
- {id: D2-C292, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:31, T:d2r2b:22], ver: consistent, src: [javascript-seo-basics], topics: [soft-404, javascript-seo],
   rel: [{type: extends, to: D2-C191}],
   text: "The fix for a client-side soft 404 is to serve a real 404 error page where appropriate; how to detect URLs that do not exist depends on how the app works and where it is hosted."}
- {id: D2-C293, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:32, T:d2r2b:22], ver: confirmed, src: [javascript-seo-basics, fix-search-javascript], topics: [soft-404, javascript-seo],
   text: "In an app routed with the History API, when a user reaches a page that does not exist, Erin Sparling suggested asking how they got there and redirecting to a real 404 page."}
- {id: D2-C294, s: D2-S06, label: docs, ev: "", ver: source, src: [javascript-seo-basics, fix-search-javascript], topics: [soft-404, javascript-seo],
   text: "For client-side rendered single-page apps, where meaningful status codes can be impossible or impractical, Google's documentation gives two ways to avoid soft 404s: a JavaScript redirect to a URL that returns a 404 status, or a noindex robots meta tag added with JavaScript."}
- {id: D2-C295, s: D2-S06, label: analysis, ev: "", ver: n/a, topics: [javascript-seo, soft-404],
   text: "After moving to real paths, set the server or hosting rewrite rules so a direct request to every valid path returns 200 with the content (ideally server-rendered) and an unknown path returns a 404 status, which removes client-side soft 404s at the source."}
- {id: D2-C296, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:33, T:d2r2b:23], ver: confirmed, src: [javascript-seo-basics], topics: [javascript-seo, robots-txt],
   rel: [{type: extends, to: D1-C064}, {type: repeats, to: D2-C204}],
   text: "If robots.txt blocks JavaScript that client-side code needs to render, Google cannot render the content that the JavaScript would produce."}
- {id: D2-C297, s: D2-S06, label: docs, ev: "", ver: source, src: [robots-intro], topics: [robots-txt, javascript-seo],
   text: "Google's introduction to robots.txt says unimportant image, script or style files may be blocked, but resources whose absence makes a page harder for Google to understand should not be blocked."}
- {id: D2-C298, s: D2-S06, label: analysis, ev: "", ver: n/a, topics: [robots-txt, javascript-seo, rendering-debugging],
   text: "Check robots.txt for Disallow rules covering JavaScript bundles, build folders or API endpoints the page calls while rendering, including on separate API or CDN hostnames with their own robots.txt, then confirm in URL Inspection's live test that the rendered HTML contains the main content."}
- {id: D2-C299, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:36, T:t05:37, T:d2r2b:26], ver: undocumented, topics: [javascript-seo],
   text: "A headless content management system serves its content as an API; even WordPress, often seen as one monolithic application, can be used headless, with only its editor or only its renderer."}
- {id: D2-C300, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:38, T:t05:39, T:t05:40, T:t05:41, T:d2r2b:28, T:d2r2b:29], ver: n/a, topics: [javascript-seo],
   text: "Erin Sparling's practice with a headless CMS is to give an AI agent the content's JSON Schema and have it build a throwaway prototype front end, to see the content before deciding how to render it; the prototype is not meant for launch."}
- {id: D2-C301, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:41, T:d2r2b:29], ver: consistent, src: [javascript-seo-basics, dynamic-rendering], topics: [javascript-seo, rendering],
   text: "For headless CMS content, Erin Sparling presented rendering on the server, not only in the browser, as a way to avoid indexing issues."}
- {id: D2-C302, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:42, T:t05:43, T:d2r2b:30], ver: n/a, topics: [rendering-debugging, javascript-seo],
   text: "When one content schema feeds several front ends (the example was a news UI, then a recipe UI), Erin Sparling had an AI agent add automated browser UI tests and agent controls so the interfaces could be managed and tested."}
- {id: D2-C303, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:44, T:d2r2b:31], ver: undocumented, topics: [ai-crawlers-and-agents, web-standards, rendering-debugging],
   rel: [{type: extends, to: D1-C281}],
   text: "Combining schema-based interfaces with web standards such as WebMCP lets a site expose tools to AI agents, which can then operate the interfaces, for example to test them."}
- {id: D2-C304, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:45, T:d2r2b:31], ver: n/a, topics: [rendering-debugging, ai-crawlers-and-agents],
   text: "When Search Console reports that content is not rendering, Erin Sparling suggested putting AI agents on the problem, but only after doing your own due diligence."}
- {id: D2-C305, s: D2-S06, label: analysis, ev: "", ver: n/a, topics: [javascript-seo, rendering-debugging],
   text: "With a headless CMS, choose the rendering per template before launch (server-rendered or pre-rendered for pages that must rank), and make any agent-built test suite assert that the main content and <a href> links are present in the rendered HTML."}
- {id: D2-C306, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:46, T:t05:47, T:d2r2b:32], ver: consistent, src: [verify-site-ownership, url-inspection-help], topics: [rendering-debugging, page-indexing-report],
   text: "To use Search Console to debug what Google can see on a site and why, Erin Sparling said the first step is to get access to the site by verifying ownership (the speaker's words were authorized domains)."}
- {id: D2-C307, s: D2-S06, label: stage, who: Erin Sparling, ev: [T:t05:48, T:d2r2b:33], ver: undocumented, topics: [page-indexing-report, rendering-debugging],
   text: "Erin Sparling showed a Search Console result saying a URL would be indexed only under certain conditions, one of which had not been met, and contrasted it with the result for an available URL whose content loads."}
- {id: D2-C308, s: D2-S06, label: docs, ev: "", ver: source, src: [url-inspection-help], topics: [page-indexing-report, rendering-debugging],
   text: "Google's URL Inspection help says a valid live test only confirms that Google can access a page for indexing; the page must still meet other conditions to be indexed, such as having no manual action, not being a duplicate and being of high enough quality."}
- {id: D2-C828, s: D2-S06, label: docs, ev: "", ver: source, src: [fix-search-javascript], topics: [rendering, javascript-seo],
   text: "Google's guide to fixing Search-related JavaScript problems says its Web Rendering Service keeps no state across page loads: local storage, session storage and HTTP cookies are cleared."}
- {id: D2-C829, s: D2-S06, label: docs, ev: "", ver: source, src: [fix-search-javascript], topics: [rendering, http-caching],
   text: "Google's guide to fixing Search-related JavaScript problems says the Web Rendering Service may ignore caching headers and so use outdated JavaScript or CSS, and recommends content fingerprinting, which puts a hash of the content in the file name, as in main.2bb85551.js."}

# ---------- D2-S07 Understanding what's on a page ----------
- {id: D2-C309, s: D2-S07, label: slide, who: Gary Illyes, ev: [video:IMG_4734, T:d2r2b:35, T:d2r2b:36], ver: consistent, src: [canonicalization], topics: [main-content, indexing-pipeline],
   rel: [{type: repeats, to: D2-C028}],
   text: "A Google slide labelled the parts of an example blog page, marking the header and the navigation as not so important and the main content as very important."}
- {id: D2-C310, s: D2-S07, label: docs, ev: "", ver: source, src: [canonicalization], topics: [main-content, duplicate-content],
   text: "Google's canonicalization guide says that when Google indexes a page it determines the page's primary content, which it also calls the centerpiece, and clusters pages whose primary content is the same or very similar.",
   quote: "When Google indexes a page, it determines the primary content (or centerpiece) of each page."}
- {id: D2-C311, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:1, T:d2r2b:41], ver: consistent, src: [helpful-content, rater-guidelines], topics: [main-content],
   text: "Gary Illyes pointed to Google's Search Quality Rater Guidelines as the detailed source on how Google thinks about the main content of a page."}
- {id: D2-C312, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:2, T:d2r2b:42], ver: consistent, src: [search-essentials], topics: [main-content, tokenization],
   text: "When Google processes a page for indexing, it gives words different weights depending on the part of the page where they appear."}
- {id: D2-C313, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:2, T:d2r2b:42], ver: undocumented, topics: [main-content],
   text: "Words in the footer of a page get a lower weight, so text placed in the footer is unlikely to contribute much to ranking the page.",
   quote: "if you put something in a footer, it's more likely that it's not going to contribute much to ranking"}
- {id: D2-C314, s: D2-S07, label: slide, who: Gary Illyes, ev: [IMG_4735, T:t06:3, T:d2r2b:43], ver: consistent, src: [rater-guidelines, helpful-content], topics: [main-content],
   text: "On Google's example blog page, the post title and opening sentence counted as important because they sit in the main content, in front of the user, while the site tagline, the 'Categories' sidebar and category links such as 'Hugo (7)' counted as less important supplementary text."}
- {id: D2-C315, s: D2-S07, label: stage, who: Gary Illyes, ev: [IMG_4735, T:t06:5, T:d2r2b:44, T:d2r2b:45], ver: consistent, src: [search-essentials], topics: [main-content],
   text: "To make a word count for ranking a page, Gary Illyes said the simplest step is to move it into the main content, because where text sits on a page already contributes quite a bit to ranking.",
   quote: "where you position text on a page will already contribute quite a bit to ranking that page"}
- {id: D2-C316, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:6, T:d2r2b:46], ver: undocumented, topics: [main-content],
   text: "Gary Illyes said not everything on a page can or should be important: if everything were placed in the main content, nothing would stand out as main content, which he called working as intended."}
- {id: D2-C317, s: D2-S07, label: analysis, ev: "", ver: n/a, topics: [main-content, helpful-content],
   text: "Put the terms a page should rank for in its main content (title, headings, opening paragraphs) rather than only in sidebars, tag lists or footers; footer keyword blocks are unlikely to add ranking value."}
- {id: D2-C318, s: D2-S07, label: stage, who: Gary Illyes, ev: [IMG_4736, T:t06:7, T:t06:8, T:d2r2b:47, T:d2r2b:48], ver: undocumented, topics: [tokenization, index-structure],
   text: "Google does not store the complete sentences or the full HTML of a page in the Search index, because large pieces of text would be unsearchable; it tokenizes the text into the smallest segments that still allow search."}
- {id: D2-C319, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:9, T:d2r2b:49], ver: undocumented, topics: [tokenization],
   text: "For languages written with spaces between words, such as English and German, Search tokenization splits a sentence into its individual words."}
- {id: D2-C320, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:10, T:t06:11, T:t06:12, T:d2r2b:50, T:d2r2b:51], ver: undocumented, topics: [tokenization, non-latin-scripts],
   text: "Text in languages written without spaces, such as Thai and Chinese, would end up in the index as long strings that might never be searched for, so Google segments it into words with statistical models built from other web content in that language."}
- {id: D2-C321, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:13, T:d2r2b:53], ver: undocumented, topics: [tokenization, non-latin-scripts],
   text: "For languages written without spaces, such as Thai and Chinese, Google uses exactly the same word segmentation when indexing a page as when interpreting the user's query, because otherwise the query could not be matched against the index."}
- {id: D2-C322, s: D2-S07, label: stage, who: Gary Illyes, ev: T:t06:13, ver: n/a, topics: [tokenization],
   text: "Gary Illyes said a colleague, John, would cover how Google interprets the words of a query on the morning of Day 3."}
- {id: D2-C323, s: D2-S07, label: stage, who: Gary Illyes, ev: [IMG_4736, T:t06:14, T:t06:15, T:d2r2b:54, T:d2r2b:55], ver: undocumented, topics: [tokenization, main-content, index-structure],
   text: "When tokenizing for Search, Google attaches metadata to each token for use in ranking, such as whether the word appeared in the header or in the main content (tagged 'centerpiece' on the slide), in bold or in a heading; Gary Illyes said he was not showing all of the metadata."}
- {id: D2-C324, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:16, T:d2r2b:56], ver: undocumented, topics: [tokenization, spam-detection],
   text: "Google also stores spam metadata with the tokens of a page, for example that text was white on a white background, so ranking can use that information."}
- {id: D2-C325, s: D2-S07, label: stage, who: Gary Illyes, ev: [IMG_4737, T:t06:17, T:d2r2b:57], ver: undocumented, topics: [tokenization, gemini-and-search],
   rel: [{type: contradicts, to: D1-C039}],
   text: "Tokenization for AI models such as Gemini, in training and in inference, differs from tokenization for Search, although Gary Illyes qualified this with 'or mostly'."}
- {id: D2-C326, s: D2-S07, label: slide, who: Gary Illyes, ev: [IMG_4737, T:t06:18, T:d2r2b:58], ver: consistent, src: [gemini-tokens], topics: [tokenization, gemini-and-search],
   text: "In tokenization for AI models, common English words stay whole and each maps to a numeric token ID, so the model works with IDs rather than with the words; on Google's slide the word 'can' had the same ID, 740, both times it appeared."}
- {id: D2-C327, s: D2-S07, label: stage, who: Gary Illyes, ev: [IMG_4737, T:t06:19, T:d2r2b:59], ver: consistent, src: [gemini-tokens], topics: [tokenization, gemini-and-search],
   text: "Tokenizers for AI models split long words into sub-word pieces that may make no sense on their own, because a token for every possible word would make the vocabulary too big, and a generative model only cares about closeness in vector space."}
- {id: D2-C328, s: D2-S07, label: slide, who: Gary Illyes, ev: "IMG_4736, IMG_4737", ver: undocumented, topics: [tokenization, gemini-and-search],
   text: "Google's two tokenization slides showed the difference on the same sentence: the Search tokenizer kept 'robots.txt' and 'tl;dr' as single tokens, while the AI-model tokenizer split them into pieces such as 'tl' and 'dr' or 'robots' and 'txt', with the punctuation as separate tokens."}
- {id: D2-C329, s: D2-S07, label: analysis, ev: "", ver: n/a, topics: [tokenization, gemini-and-search],
   text: "Day 1's slide said Gemini shares technologies such as tokenization with Search, while on Day 2 Gary Illyes showed that the two tokenizers split the same text differently ('or mostly'); read this as a shared processing step with different outputs, so Search's word tokens and Gemini's sub-word tokens are not the same units."}
- {id: D2-C330, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:21, T:t06:22, T:d2r2b:61], ver: consistent, src: [ai-optimization-guide], topics: [chunking, seo-vs-geo],
   rel: [{type: extends, to: D1-C054}],
   text: "Gary Illyes said the common SEO advice to chunk content for AI systems is misunderstood: chunking is real, but it matters at the level of an AI model's context window."}
- {id: D2-C331, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:22, T:d2r2b:62], ver: consistent, src: [gemini-long-context], topics: [chunking, gemini-and-search],
   text: "Gary Illyes said Gemini's context window, where chunking actually matters, holds millions of tokens."}
- {id: D2-C332, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:23, T:d2r2b:63], ver: consistent, src: [ai-optimization-guide, gemini-long-context], topics: [chunking, gemini-and-search],
   rel: [{type: extends, to: D1-C054}],
   text: "Gemini does not need content cut into small chunks of 100 or 200 words, Gary Illyes said, since a smaller book fits in its context window."}
- {id: D2-C825, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:23, T:d2r2b:63], ver: undocumented, topics: [chunking],
   rel: [{type: extends, to: D2-C332}],
   text: "Gary Illyes added that, once chunk size is thought of in millions of tokens as Gemini's context window allows, chunking has perhaps lost its meaning anyway."}
- {id: D2-C333, s: D2-S07, label: analysis, ev: "", ver: n/a, topics: [chunking, helpful-content],
   text: "Do not rewrite pages into short, self-contained chunks for AI systems; Google says Gemini reads context windows of millions of tokens, so structure content for readers, with clear headings and complete explanations."}
- {id: D2-C334, s: D2-S07, label: stage, who: Gary Illyes, ev: [IMG_4738, IMG_4739, T:t06:25, T:d2r2b:65], ver: confirmed, src: [troubleshoot-crawling-errors], topics: [soft-404, index-selection],
   rel: [{type: repeats, to: D1-C073}, {type: extends, to: D1-C070}, {type: repeats, to: D1-C355}],
   text: "A soft 404 is a page that should return an error status code but returns HTTP 200; from a crawling point of view it looks indexable, but because it has no real content Google throws it out of the index."}
- {id: D2-C335, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:26, T:t06:28, T:d2r2b:66, T:d2r2b:68], ver: undocumented, topics: [soft-404],
   text: "Because error pages are worded in endless variations, of which 'page not found' is only the classic one, Google cannot detect soft 404s with simple error, word or keyword matching."}
- {id: D2-C336, s: D2-S07, label: slide, who: Gary Illyes, ev: [IMG_4739, T:t06:27, T:d2r2b:67], ver: confirmed, src: [troubleshoot-crawling-errors], topics: [soft-404, javascript-seo],
   rel: [{type: extends, to: D1-C073}, {type: extends, to: D2-C213}],
   text: "Google listed four common causes of soft 404s: pages that look like errors but are not, thin or empty content, server or CMS misconfigurations, and JavaScript-dependent content that fails to load."}
- {id: D2-C337, s: D2-S07, label: slide, who: Gary Illyes, ev: [IMG_4739, T:t06:27, T:d2r2b:67], ver: undocumented, topics: [soft-404, feature-requests],
   text: "Mistakes in Google's own systems are a further cause of soft 404s, and Gary Illyes asked site owners to report such mistakes in Google's forums.",
   quote: "BONUS: Mistakes in Google's systems (that you should notify us about)", quote_checked: true}
- {id: D2-C338, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:29, T:d2r2b:69], ver: undocumented, topics: [soft-404, ai-in-search-systems, main-content],
   rel: [{type: extends, to: D1-C042}],
   text: "Google detects soft 404s with a language model, described as something like BERT, that is trained to understand the structure and layout of a page as well as its language, instead of reading the page as one flat wall of text.",
   quote: "This is basically an LLM thing, something like BERT, that is specifically trained to understand page structure"}
- {id: D2-C339, s: D2-S07, label: stage, who: Gary Illyes, ev: [IMG_4738, T:t06:30, T:t06:31, T:d2r2b:70, T:d2r2b:71], ver: undocumented, topics: [soft-404, main-content],
   rel: [{type: extends, to: D1-C078}],
   text: "For soft 404 detection, the position of error text decides: an error in a less important part such as the navigation need not make a page a soft 404, but an error message alone in the main content, like 'Error establishing a database connection', does, much as a human would judge it."}
- {id: D2-C340, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:32, T:d2r2b:72], ver: undocumented, topics: [soft-404, main-content],
   text: "Google's soft 404 detection tells the page chrome, such as navigation and footer, apart from the main content by analysing the page's visual hierarchy alongside its text."}
- {id: D2-C341, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:t06:32, T:d2r2b:73], ver: consistent, src: [troubleshoot-crawling-errors], topics: [soft-404],
   text: "Gary Illyes said soft 404 detection keeps searchers from clicking into dead ends and avoids wasting site owners' resources on visitors sent to error pages."}
- {id: D2-C342, s: D2-S07, label: analysis, ev: "", ver: n/a, topics: [soft-404, javascript-seo],
   text: "Return real error status codes for error states, 404 or 410 for missing content and 503 for outages such as a failed database connection, also in single-page apps; a 200 page whose main content is only an error message is treated as a soft 404 even when header and navigation look normal."}
- {id: D2-C343, s: D2-S07, label: analysis, ev: "", ver: n/a, topics: [spam-detection, tokenization],
   text: "Hidden text is recorded at token level: Google stores spam metadata such as white-on-white text with the tokens, so leftover hidden keyword blocks are a liability, not neutral clutter, and should be removed."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D2-C861, s: D2-S07, label: stage, who: Gary Illyes, ev: T:d2r2b:36, ver: consistent, src: [rater-guidelines], topics: [main-content],
   rel: [{type: extends, to: D2-C309}],
   text: "Gary Illyes said that whatever a site puts in its navigation or header tells Google the site does not particularly care about that content: it may help users do something on the side, but it is not what the page wants them to do, read or take away."}
- {id: D2-C862, s: D2-S07, label: stage, who: Gary Illyes, ev: T:d2r2b:37, ver: confirmed, src: [rater-guidelines], topics: [main-content, search-quality-evaluation],
   text: "Gary Illyes defined a page's main content as any part of the page that directly helps the page achieve its purpose, what it was built for.",
   quote: "Main content is any part of the page that directly helps the page achieve its purpose"}
- {id: D2-C863, s: D2-S07, label: stage, who: Gary Illyes, ev: T:d2r2b:37, ver: confirmed, src: [rater-guidelines], topics: [main-content],
   text: "Main content is not only text: images, videos, a tool or anything else that helps a page achieve its purpose can be main content."}
- {id: D2-C864, s: D2-S07, label: stage, who: Gary Illyes, ev: T:d2r2b:38, ver: confirmed, src: [rater-guidelines], topics: [main-content],
   text: "Content created by other users can be main content: on a user-generated content site, the user-generated content can be the page's main content."}
- {id: D2-C865, s: D2-S07, label: stage, who: Gary Illyes, ev: T:d2r2b:38, ver: consistent, src: [rater-guidelines], topics: [main-content],
   text: "A comment section below a blog post can still be part of the page's main content and can contribute to Google's understanding of the page."}
- {id: D2-C866, s: D2-S07, label: stage, who: Gary Illyes, ev: T:d2r2b:39, ver: confirmed, src: [rater-guidelines], topics: [main-content],
   rel: [{type: extends, to: D2-C202}],
   text: "Content inside tabs, for example separate tabs for a product description and a manufacturer description, might be part of a page's main content."}
- {id: D2-C867, s: D2-S07, label: stage, who: Gary Illyes, ev: T:d2r2b:40, ver: consistent, src: [rater-guidelines, search-essentials], topics: [main-content],
   text: "A page's main content includes all of its headings and its visible title."}
- {id: D2-C868, s: D2-S07, label: stage, who: Gary Illyes, ev: T:d2r2b:40, ver: consistent, src: [search-essentials, canonicalization], topics: [main-content, ranking-systems],
   rel: [{type: extends, to: D2-C028}],
   text: "Gary Illyes said the main content is what Google considers when ranking a page.",
   quote: "It's the main content that we consider for ranking."}
- {id: D2-C869, s: D2-S07, label: stage, who: Gary Illyes, ev: [T:d2r2b:62, T:t06:22], ver: consistent, src: [gemini-long-context], topics: [chunking, gemini-and-search],
   rel: [{type: extends, to: D2-C331}],
   text: "Right after saying Gemini's context window holds millions of tokens, Gary Illyes put its size at perhaps 900,000 or even closer to a million, without a unit that the recordings capture.",
   quote: "the context window is perhaps 900,000 or even closer to a million big"}
- {id: D2-C870, s: D2-S07, label: docs, ev: "", ver: source, src: [rater-guidelines], topics: [main-content, search-quality-evaluation],
   text: "Google's Search Quality Rater Guidelines define main content as any part of the page that directly helps it achieve its purpose, including text, images, videos, page features such as calculators and content created by users, and they count the title at the top of the page as part of it.",
   quote: "Main Content is any part of the page that directly helps the page achieve its purpose."}
- {id: D2-C871, s: D2-S07, label: docs, ev: "", ver: source, src: [rater-guidelines], topics: [main-content, search-quality-evaluation],
   text: "Google's Search Quality Rater Guidelines say navigation links are a common type of supplementary content, and that content behind tabs and user reviews or comments may count as main content on some pages and as supplementary content on others, depending on the page's purpose."}
- {id: D2-C872, s: D2-S07, label: analysis, ev: "", ver: n/a, topics: [chunking, gemini-and-search],
   text: "The talk gave Gemini's context window both as millions of tokens and as roughly 900,000 to a million; Google's long-context docs say Gemini models have context windows of 1 million or more tokens (about eight average novels per million), so plan with about one million tokens as the documented floor rather than several million."}

# ---------- D2-S08 Handling web duplication ----------
- {id: D2-C344, s: D2-S08, label: stage, ev: [T:t06:33, T:d2r2c:1], ver: consistent, src: [how-search-works], topics: [duplicate-content, index-selection],
   rel: [{type: extends, to: D1-C037}],
   text: "Google deduplicates pages because many sites have very many pages and Google's index does not have room for everything."}
- {id: D2-C345, s: D2-S08, label: slide, ev: [IMG_4740, T:t06:34, T:t06:35, T:t06:36, T:d2r2c:2, T:d2r2c:3, T:d2r2c:4], ver: confirmed, src: [how-search-works, consolidate-duplicate-urls], topics: [duplicate-content, canonical-selection],
   rel: [{type: extends, to: D1-C128}, {type: extends, to: D1-C207}],
   text: "Google's deduplication has three steps: identify and cluster duplicate web pages, pick representative URLs and index the unique pages, and forward signals to the representative URLs."}
- {id: D2-C346, s: D2-S08, label: stage, ev: [T:t06:34, T:d2r2c:2], ver: consistent, src: [how-search-works], topics: [duplicate-content],
   rel: [{type: extends, to: D1-C207}],
   text: "For deduplication, a cluster is a set of pages Google considers essentially equivalent: Google stores one of them in the index and keeps track of the other related URLs."}
- {id: D2-C347, s: D2-S08, label: stage, ev: [T:t06:35, T:d2r2c:3], ver: confirmed, src: [canonicalization], topics: [canonical-selection, duplicate-content],
   text: "Google's speaker said what SEOs call the canonical is, for Google, the representative of a cluster of duplicate pages: the URL Google would ideally show."}
- {id: D2-C348, s: D2-S08, label: slide, ev: [IMG_4740, T:t06:36, T:d2r2c:4], ver: confirmed, src: [consolidate-duplicate-urls], topics: [duplicate-content, canonical-selection],
   rel: [{type: extends, to: D1-C111}],
   text: "Google forwards the signals attached to every URL in a duplicate cluster, such as links, to the representative URL, so that nothing is lost by showing only one URL."}
- {id: D2-C349, s: D2-S08, label: stage, ev: [T:t06:37, T:d2r2c:5], ver: confirmed, src: [canonicalization, ranking-systems-guide], topics: [duplicate-content],
   text: "The first reason Google deduplicates is that users do not want to see the same page repeated in the search results, even if site owners would like it to rank ten times on page one."}
- {id: D2-C350, s: D2-S08, label: stage, ev: [T:t06:38, T:d2r2c:6], ver: undocumented, topics: [duplicate-content, index-selection],
   text: "Storage is a second reason for deduplication: Google's storage has many competing uses and storage prices have risen sharply, so the space for any one use is limited and Google has to draw a line somewhere."}
- {id: D2-C351, s: D2-S08, label: stage, ev: [T:t06:39, T:d2r2c:7], ver: consistent, src: [redirects-guide], topics: [site-moves, duplicate-content],
   text: "Google treats a site migration as deduplication across sites, in which the site owner says the old and the new domain are the same and that Google should pick the new domain, so deduplication also helps Google handle migrations."}
- {id: D2-C352, s: D2-S08, label: slide, ev: [IMG_4741, T:t06:40, T:d2r2c:8], ver: confirmed, src: [redirects-guide, how-search-works], topics: [site-moves, duplicate-content],
   text: "Google keeps the other URLs of a duplicate cluster as 'alternate names': equivalent URLs with the same content that Google still tracks as alternate versions of the representative URL."}
- {id: D2-C353, s: D2-S08, label: slide, ev: IMG_4741, ver: confirmed, src: [canonicalization], topics: [hreflang, duplicate-content, geotargeting],
   text: "Alternate names also serve localization: if Google knows that country versions such as you.de and you.at are equivalent, it can pick the right version to show using hreflang."}
- {id: D2-C354, s: D2-S08, label: slide, ev: [IMG_4741, T:t06:41, T:d2r2c:9], ver: consistent, src: [redirects-guide], topics: [site-moves, duplicate-content],
   text: "Alternate names are why a site: query for an old domain still shows the old domain's URLs after a site migration, which site owners often misread as a migration that is not working.",
   quote: "FYI \"alternate names\" is why you see old domains in site:-queries", quote_checked: true}
- {id: D2-C355, s: D2-S08, label: stage, ev: [T:t06:42, T:d2r2c:9], ver: confirmed, src: [redirects-guide], topics: [site-moves],
   text: "When someone searches for an old domain after a migration, Google shows the old URL as an alternate version because that is what was searched for, and relies on the redirect to take the user to the new site."}
- {id: D2-C356, s: D2-S08, label: slide, ev: [IMG_4741, T:t06:43, T:d2r2c:10], ver: consistent, src: [redirects-guide], topics: [site-moves],
   text: "After a rebrand that changes the domain (the slide's example was johns-bikes to slow-bikes), Google can still show the old domain to people who search for the old brand by name, in navigational and branded queries."}
- {id: D2-C357, s: D2-S08, label: docs, ev: "", ver: source, src: [redirects-guide], topics: [site-moves, duplicate-content],
   text: "Google's redirects guide says Google keeps track of both the source and the target of a redirect: one becomes the canonical, depending on signals such as whether the redirect is permanent or temporary, and the other becomes an alternate name that may appear in results when a query suggests the user trusts the old URL more. After a move to a new domain, old URLs may still show occasionally; the guide calls this normal.",
   quote: "This is normal and as users get used to the new domain name, the alternate names will fade away without you doing anything."}
- {id: D2-C358, s: D2-S08, label: analysis, ev: "", ver: n/a, topics: [site-moves, measurement],
   text: "After a migration, judge success by the new domain's indexing and traffic in Search Console rather than by a site: query on the old domain, and keep the old domain's redirects in place long term so searches for the old brand still reach the new site."}
- {id: D2-C359, s: D2-S08, label: stage, ev: [T:t06:44, T:d2r2c:11], ver: consistent, src: [url-inspection-help], topics: [duplicate-content, canonical-selection, page-indexing-report],
   text: "Google's duplication talk described three related parts of deduplication: building clusters, localization, and selecting the representative URL, which is the canonicalization site owners see in Search Console."}
- {id: D2-C360, s: D2-S08, label: stage, ev: [T:t06:45, T:d2r2c:12], ver: consistent, src: [canonicalization], topics: [duplicate-content],
   text: "Google builds duplicate clusters from four kinds of input: redirects, content, rel=canonical, and a 'magic bucket' of other things."}
- {id: D2-C361, s: D2-S08, label: stage, ev: [T:t06:46, T:d2r2c:13], ver: consistent, src: [redirects-guide, consolidate-duplicate-urls], topics: [duplicate-content, site-moves],
   text: "Google trusts redirects very much for clustering, because a redirect is a clear sign that there is one version of the content; Google keeps track of both URLs but stores only one copy of the content."}
- {id: D2-C362, s: D2-S08, label: stage, ev: [T:t06:47, T:d2r2c:14], ver: consistent, src: [redirects-guide], topics: [site-moves, canonical-selection, duplicate-content],
   text: "Whether a redirect is permanent or temporary matters only for choosing the canonical, not for clustering the URLs together.",
   quote: "the permanent redirect really only matters for canonicalization, not for clustering."}
- {id: D2-C363, s: D2-S08, label: analysis, ev: "", ver: n/a, topics: [site-moves, canonical-selection],
   text: "Use permanent redirects (301 or 308) for moves you want reflected in Search: a temporary redirect still groups the URLs, but it changes which URL Google is likely to pick as the canonical."}
- {id: D2-C364, s: D2-S08, label: stage, ev: [T:t06:48, T:t06:49, T:t06:50, T:t06:51, T:d2r2c:15, T:d2r2c:16, T:d2r2c:17, T:d2r2c:18], ver: undocumented, topics: [duplicate-content],
   text: "Google clusters duplicate pages by content in four ways: exact matches, near matches, structurally similar content, and soft 404s."}
- {id: D2-C365, s: D2-S08, label: stage, ev: [T:t06:49, T:d2r2c:16], ver: consistent, src: [canonicalization], topics: [duplicate-content],
   text: "Exact-match duplicates, such as the www and non-www versions of the same page, are clustered and Google keeps only one of them."}
- {id: D2-C366, s: D2-S08, label: slide, ev: [IMG_4744, T:t06:50, T:d2r2c:17], ver: confirmed, src: [canonicalization, localized-versions], topics: [duplicate-content, localisation, main-content],
   text: "Pages whose boilerplate, such as menu and footer, is translated while the main content is not are near matches: the main reason to visit is the same, so Google clusters them as duplicates.",
   quote: "When main content is the same, pages may be clustered.", quote_checked: true}
- {id: D2-C367, s: D2-S08, label: stage, ev: [T:t06:51, T:d2r2c:18], ver: consistent, src: [canonicalization-troubleshooting, crawling-december-cdns], topics: [soft-404, duplicate-content],
   rel: [{type: extends, to: D1-C073}],
   text: "Soft 404 pages are another reason Google clusters pages together, an outcome site owners usually do not want."}
- {id: D2-C368, s: D2-S08, label: slide, ev: [IMG_4742, T:t06:52, T:t06:53, T:d2r2c:19], ver: undocumented, topics: [duplicate-content, canonical-selection],
   text: "Google sometimes picks a canonical that looks unrelated because it recognised a URL pattern: if /buy/fax, /buy/typewriter and /office-equipment show the same content, its systems may assume any /buy/ URL, even /buy/seo-service, shows that same office-equipment content without looking at the page."}
- {id: D2-C369, s: D2-S08, label: slide, ev: IMG_4742, ver: undocumented, topics: [duplicate-content, crawl-budget],
   rel: [{type: extends, to: D1-C128}, {type: extends, to: D1-C094}],
   text: "Google's slide on structurally similar content asked whether a new URL that fits a known duplicate pattern, such as /buy/seo-service, even needs to be crawled.",
   quote: "Do we even need to crawl /buy/seo-service ?", quote_checked: true}
- {id: D2-C370, s: D2-S08, label: slide, ev: [IMG_4742, T:t06:55, T:d2r2c:21], ver: undocumented, topics: [duplicate-content, canonical-selection],
   text: "City pages can trigger the same pattern-based deduplication: for a car dealer brand with branches in several cities and similar stock, Google's systems may decide the city name does not matter and canonicalise to one city's page; the slide asked whether a further city page such as /zurich/services would be treated the same way."}
- {id: D2-C371, s: D2-S08, label: slide, ev: [IMG_4742, T:t06:54, T:d2r2c:20], ver: consistent, src: [canonicalization-troubleshooting, troubleshoot-crawling-errors], topics: [duplicate-content, canonical-selection],
   text: "To avoid pattern-based deduplication, Google's speaker recommended not having many unrelated, similar-looking URLs that lead to the same content, and returning error pages for URLs that no longer exist so they are clearly unrelated.",
   quote: "Misleading site structure (use clear signals!)", quote_checked: true}
- {id: D2-C372, s: D2-S08, label: analysis, ev: "", ver: n/a, topics: [duplicate-content, canonical-selection],
   text: "Make location and variant pages differ in their main content (local stock, staff, prices, addresses) and return 404 for empty or invalid combinations; otherwise every URL that fits the pattern can be folded into one canonical."}
- {id: D2-C373, s: D2-S08, label: docs, ev: "", ver: source, src: [canonicalization-troubleshooting], topics: [canonical-selection, duplicate-content],
   text: "Google's canonicalization troubleshooting guide says fixing a wrong duplicate cluster comes down to making the clustered pages sufficiently different; pages split out faster when the difference is clear and significant, and Google may keep pages in a duplicate cluster for up to two weeks after a fix."}
- {id: D2-C374, s: D2-S08, label: stage, ev: [T:t06:56, T:d2r2c:22], ver: consistent, src: [crawling-december-cdns, canonicalization-troubleshooting], topics: [duplicate-content, crawl-errors],
   rel: [{type: extends, to: D1-C069}, {type: extends, to: D1-C078}, {type: extends, to: D1-C367}],
   text: "A growing cause of wrong clustering is bot protection: when a CDN or another protection system shows Googlebot the same 'you look like a bot, solve this puzzle' page on many unrelated URLs or domains, Google can cluster those pages as duplicates."}
- {id: D2-C375, s: D2-S08, label: stage, ev: [T:t06:57, T:d2r2c:23], ver: consistent, src: [crawling-december-cdns], topics: [crawl-errors, duplicate-content],
   rel: [{type: extends, to: D1-C367}],
   text: "Google's systems find it very hard to recognise a bot-challenge page as an error page, and Googlebot cannot solve the puzzles, such as selecting all the cats, that those pages ask for."}
- {id: D2-C376, s: D2-S08, label: docs, ev: "", ver: source, src: [crawling-december-cdns], topics: [crawl-errors, duplicate-content],
   rel: [{type: extends, to: D1-C078}],
   text: "Google's Search Central post on CDNs says that if Google cannot recognise an error message served with a 200 status as an error, all pages showing the same message may be dropped from the index as duplicates, and recovery can be slow because Google has little incentive to recrawl duplicates. For bot-verification interstitials it recommends sending crawlers a 503 status."}
- {id: D2-C377, s: D2-S08, label: stage, ev: [T:t06:58, T:d2r2c:24], ver: undocumented, topics: [ai-crawlers-and-agents, crawl-errors],
   rel: [{type: extends, to: D1-C436}],
   text: "AI agents that browse the web for users run into the same bot walls that sites put up against scrapers, and may give up and go to another site, for example to buy the product elsewhere."}
- {id: D2-C378, s: D2-S08, label: analysis, ev: "", ver: n/a, src: [crawling-december-cdns], topics: [crawl-errors, ai-crawlers-and-agents],
   text: "Check what your CDN or bot protection serves to verified Googlebot and to the AI agents you want to allow; if crawlers must get a challenge page, return it with a 503 status as Google recommends, never as a 200 page across many URLs, which Google may cluster as duplicates."}
- {id: D2-C379, s: D2-S08, label: stage, ev: [T:t06:59, T:d2r2c:25], ver: consistent, src: [canonicalization-troubleshooting, rel-canonical-mistakes-blog], topics: [canonical-selection],
   rel: [{type: extends, to: D2-C031}],
   text: "rel=canonical is probably the most common way site owners signal duplicates, but it is very often wrong, for example a tag whose value reads 'canonical target' instead of a real URL (the example is partly unclear in the recording), so Google can only sometimes trust it."}
- {id: D2-C380, s: D2-S08, label: stage, ev: [T:t06:60, T:d2r2c:25], ver: confirmed, src: [canonicalization], topics: [canonical-selection],
   rel: [{type: extends, to: D1-C113}],
   text: "Many SEOs assume Google must follow their rel=canonical, but because people sometimes get it wrong, Google has to make its own judgment about the canonical."}
- {id: D2-C381, s: D2-S08, label: slide, ev: [IMG_4744, T:t06:61, T:d2r2c:26], ver: consistent, src: [canonicalization, multi-regional-sites], topics: [hreflang, duplicate-content, geotargeting],
   text: "Same-language content for different countries is tricky for Google's deduplication, notably German pages for Germany, Austria and Switzerland, and possibly Spanish-language variants."}
- {id: D2-C382, s: D2-S08, label: slide, ev: [IMG_4744, T:t06:61, T:d2r2c:26], ver: confirmed, src: [canonicalization, consolidate-duplicate-urls], topics: [hreflang, duplicate-content],
   rel: [{type: extends, to: D2-C033}],
   text: "When localized pages are clustered, Google tries to use hreflang alternates; the speaker's short version of the advice was to use hreflang, which he called really helpful for same-language, different-country content.",
   quote: "We try to use hreflang alternates.", quote_checked: true}
- {id: D2-C383, s: D2-S08, label: slide, ev: [IMG_4744, T:t06:61, T:d2r2c:26], ver: confirmed, src: [multi-regional-sites], topics: [geotargeting, duplicate-content],
   text: "Google's speaker advised against 'clever' geo-redirecting, because it very often goes wrong.",
   quote: "\"clever\" geo-redirecting (is often not so clever)", quote_checked: true}
- {id: D2-C384, s: D2-S08, label: analysis, ev: "", ver: n/a, topics: [hreflang, localisation, duplicate-content],
   text: "For German-language sites serving Germany, Austria and Switzerland, add hreflang with region codes (de-DE, de-AT, de-CH) and make the country pages differ in more than boilerplate (prices, shipping, legal details), or expect Google to cluster them and show one."}
- {id: D2-C385, s: D2-S08, label: docs, ev: "", ver: source, src: [consolidate-duplicate-urls], topics: [hreflang, canonical-selection],
   text: "Google's canonical guide says that for canonicalization Google prefers URLs that are part of hreflang clusters: if German pages for Germany and Switzerland point to each other with hreflang but not to the Austrian page, the German and Swiss pages are preferred as canonicals."}
- {id: D2-C386, s: D2-S08, label: stage, ev: [T:t06:62, T:d2r2c:27], ver: undocumented, topics: [canonical-selection, ai-in-search-systems],
   text: "Google picks the canonical from a variety of criteria and uses some kind of machine learning to decide how much weight each criterion gets; the weighting changes from time to time.",
   quote: "we use some kind of machine learning to understand how strong these criteria should be. And this changes from time to time."}
- {id: D2-C387, s: D2-S08, label: slide, ev: [IMG_4745, T:t06:63, T:t06:64, T:t06:65, T:d2r2c:28, T:d2r2c:29, T:d2r2c:30], ver: consistent, src: [canonicalization, consolidate-duplicate-urls, canonicalization-troubleshooting], topics: [canonical-selection],
   text: "Google named three considerations when picking a representative URL: hijacking across pages or sites, user experience (the page can load, meta refresh, security) and site-owner signals (redirects, rel=canonical, sitemaps)."}
- {id: D2-C388, s: D2-S08, label: slide, ev: [IMG_4745, T:t06:63, T:d2r2c:28], ver: consistent, src: [canonicalization-troubleshooting, canonicalization], topics: [canonical-selection, duplicate-content],
   text: "Google watches for canonical hijacking, where several domains try to be canonical for the same content, whether accidentally across a site owner's own domains (such as a staging copy) or through third-party domains, maliciously or not, and asks site owners to report cases it gets wrong."}
- {id: D2-C389, s: D2-S08, label: slide, ev: [IMG_4745, T:t06:64, T:d2r2c:29], ver: consistent, src: [consolidate-duplicate-urls], topics: [canonical-selection, javascript-seo],
   text: "Whether a page can load is really important for canonical selection: a broken certificate, failing JavaScript or a page that cannot be loaded counts against a URL, and the slide also listed meta refresh and security."}
- {id: D2-C390, s: D2-S08, label: slide, ev: [IMG_4745, T:t06:65, T:d2r2c:30], ver: consistent, src: [consolidate-duplicate-urls, canonicalization], topics: [canonical-selection, sitemaps, site-moves],
   text: "Clear site-owner signals about which URL should be canonical make a big difference to Google's choice; the speaker named redirects, listing only the preferred URL in sitemaps, and rel=canonical, which the speaker said also helps a bit."}
- {id: D2-C391, s: D2-S08, label: docs, ev: "", ver: source, src: [consolidate-duplicate-urls], topics: [canonical-selection, sitemaps],
   text: "Google's canonical guide ranks the ways to signal a preferred canonical by strength: redirects and rel=canonical annotations are strong signals, sitemap inclusion is a weak signal, and combining methods makes them more effective."}
- {id: D2-C392, s: D2-S08, label: analysis, ev: "", ver: n/a, src: [consolidate-duplicate-urls], topics: [canonical-selection, sitemaps],
   text: "Google's duplication talk described rel=canonical as something that 'also helps a bit', while Google's canonical guide calls it a strong signal alongside redirects and calls sitemap inclusion weak; treat redirects and rel=canonical as the main levers and sitemaps as support."}
- {id: D2-C393, s: D2-S08, label: stage, ev: [T:t06:66, T:d2r2c:31], ver: undocumented, topics: [pagination, canonical-selection],
   rel: [{type: contradicts, to: D1-C115}],
   text: "Google's speaker said that pointing rel=canonical from the pages of a paginated set to the first page can sometimes make sense depending on the goal, for example to make a category page more visible, but that it affects canonicalization and deduplication."}
- {id: D2-C394, s: D2-S08, label: analysis, ev: "", ver: n/a, src: [pagination-guide], topics: [pagination, canonical-selection],
   text: "Google's pagination guide still says not to use page 1 as the canonical of a paginated series, so keep self-referencing canonicals on paginated pages unless you deliberately want later pages folded into page 1 and the items they list are linked from elsewhere."}
- {id: D2-C395, s: D2-S08, label: docs, ev: "", ver: source, src: [rel-canonical-mistakes-blog], topics: [pagination, canonical-selection],
   rel: [{type: extends, to: D1-C115}],
   text: "Google's 2013 post on rel=canonical mistakes says pointing rel=canonical from page 2 or later of a paginated series to page 1 is incorrect because the pages are not duplicates, and that it would result in the content on later pages not being indexed at all."}
- {id: D2-C396, s: D2-S08, label: slide, ev: [IMG_4746, T:t06:67, T:d2r2c:32], ver: consistent, src: [consolidate-duplicate-urls, site-move-with-url-changes, localized-versions, troubleshoot-crawling-errors], topics: [canonical-selection, duplicate-content, site-moves],
   text: "Google's closing suggestions on duplication: use redirects for site migrations, use HTTP result codes, don't block agents, check your rel=canonical links, use hreflang links to help Google localize, report weird canonicals in the forums, make secure pages that work, and keep canonical signals clear."}
- {id: D2-C397, s: D2-S08, label: slide, ev: [IMG_4746, T:t06:67, T:d2r2c:32], ver: undocumented, topics: [ai-crawlers-and-agents],
   rel: [{type: extends, to: D1-C131}],
   text: "Google's duplication talk closed with the advice not to block agents, which the speaker said are sometimes really cool.",
   quote: "Don't block agents.", quote_checked: true}
- {id: D2-C398, s: D2-S08, label: stage, ev: [T:t06:67, T:d2r2c:32], ver: undocumented, topics: [canonical-selection, canonical-graphs],
   text: "Google's speaker suggested checking rel=canonical links with a crawler such as Screaming Frog to make sure they are reasonable."}
- {id: D2-C399, s: D2-S08, label: stage, ev: [T:t06:68, T:d2r2c:33], ver: consistent, src: [consolidate-duplicate-urls], topics: [canonical-selection],
   text: "When all canonical signals point to the same URL, Google follows what the site owner says; when they point in different directions, Google cannot tell what the owner wants.",
   quote: "if there are multiple things in different directions, we don't know what to do."}
- {id: D2-C400, s: D2-S08, label: analysis, ev: "", ver: n/a, topics: [canonical-selection, site-moves],
   text: "Before a migration or template change, align every canonical signal for the preferred URL (redirects, rel=canonical, internal links, sitemap entries, hreflang and working HTTPS); Google says it follows the site owner only when the signals agree."}
- {id: D2-C832, s: D2-S08, label: docs, ev: "", ver: source, src: [pagination-guide], topics: [pagination],
   text: "Google's pagination guide says the pages of a paginated sequence may share the same title and description, and suggests linking every page of the sequence back to the first page."}

# ---------- D2-S09 Lightning session E: Managing Duplicates and Site Moves ----------
- {id: D2-C401, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:1, T:d2r2c:35], ver: confirmed, src: [canonicalization-troubleshooting], topics: [canonical-graphs, canonical-selection],
   rel: [{type: extends, to: D1-C113}],
   text: "Broken canonical tags can make the wrong pages of a site show up in search results."}
- {id: D2-C402, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:1, T:d2r2c:35], ver: consistent, src: [specify-canonical-blog, canonicalization], topics: [canonical-graphs, canonical-selection],
   rel: [{type: repeats, to: D2-C380}],
   text: "According to the canonical link specification cited by a community speaker, when a canonical tag is declared improperly, the application that processes it may apply its own heuristic and decide what to do instead."}
- {id: D2-C403, s: D2-S09, label: docs, ev: "", ver: source, src: [consolidate-duplicate-urls], topics: [canonical-graphs, canonical-selection],
   text: "Google's guide to specifying canonical URLs says Google supports explicit rel=canonical link annotations as described in RFC 6596, the canonical link relation specification."}
- {id: D2-C404, s: D2-S09, label: analysis, ev: "", ver: n/a, src: [rel-canonical-mistakes-blog, canonicalization-troubleshooting], topics: [canonical-graphs, canonical-selection],
   text: "A broken canonical setup does not fail visibly: pages still load normally while the choice of URL passes to the search engine's own heuristics, so canonical tags need a regular audit with a crawler and the URL Inspection tool."}
- {id: D2-C406, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:3, T:t07:18, T:d2r2c:37, T:d2r2c:50], ver: n/a, topics: [canonical-graphs],
   text: "Checking canonicals pairwise (page A has a canonical to page B, page B a self-referencing canonical) is common but, in a community speaker's experience, misses the bigger picture, such as other links pointing to A or B."}
- {id: D2-C407, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:4, T:d2r2c:38], ver: n/a, topics: [canonical-graphs, duplicate-content],
   text: "In a community speaker's terms, a canonical group is the set of all URLs connected through canonical links, and its canonical leader is the page that all the group's canonical links ultimately point to."}
- {id: D2-C408, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:4, T:t07:18, T:d2r2c:38, T:d2r2c:50], ver: n/a, topics: [canonical-graphs, duplicate-content],
   rel: [{type: extends, to: D1-C128}, {type: extends, to: D2-C398}],
   text: "A community speaker advised auditing canonicals as whole canonical groups rather than pair by pair, paying special attention to each group's canonical leader."}
- {id: D2-C409, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:5, T:d2r2c:39], ver: n/a, topics: [canonical-graphs],
   text: "A community speaker said it helps to view small canonical groups as a graph that shows any redirects between members, together with the indexability of each member page."}
- {id: D2-C410, s: D2-S09, label: slide, who: Tobias Schwarz, ev: [IMG_4747, T:t07:5], ver: n/a, topics: [canonical-graphs],
   text: "A crawler report shown on screen drew one canonical group of five URLs as a link graph with the leader marked by a crown, and listed each member's HTTP status, indexability, document language, leader flag, incoming and outgoing links, and hints."}
- {id: D2-C411, s: D2-S09, label: slide, who: Tobias Schwarz, ev: IMG_4747, ver: n/a, topics: [canonical-graphs],
   text: "The crawler report shown on screen ran group-level checks on each canonical group: an overall group status, whether the leader has self links, whether languages are consistent across members, and whether the group contains a chain."}
- {id: D2-C412, s: D2-S09, label: slide, who: Tobias Schwarz, ev: IMG_4747, ver: n/a, topics: [canonical-graphs, site-moves],
   text: "In the real-world canonical group shown on screen (a German-language travel magazine section, site not named), a feed URL's canonical pointed to a URL on another subdomain that 301-redirected to the leader, a canonical chain through a server-side redirect."}
- {id: D2-C413, s: D2-S09, label: slide, who: Tobias Schwarz, ev: IMG_4747, ver: n/a, topics: [canonical-graphs, site-moves],
   text: "The crawler report shown on screen rated a canonical group member that issues a redirect instead of displaying content as an error, and flagged canonical links whose target returns a non-200 status or is itself a redirect."}
- {id: D2-C414, s: D2-S09, label: docs, ev: "", ver: source, src: [specify-canonical-blog], topics: [canonical-graphs, site-moves],
   text: "Google's 2009 Search Central blog post introducing rel=canonical says a canonical URL may be a URL that redirects: Google then processes the redirect as usual."}
- {id: D2-C415, s: D2-S09, label: slide, who: Tobias Schwarz, ev: IMG_4747, ver: consistent, src: [consolidate-duplicate-urls], topics: [canonical-graphs, url-discovery],
   text: "The crawler report shown on screen flagged a URL discovered only through a canonical tag, with no internal a href links leading to it, as a phantom document outside the visible site structure.",
   quote: "a phantom document not part of the visible site structure", quote_checked: true}
- {id: D2-C416, s: D2-S09, label: analysis, ev: "", ver: n/a, topics: [canonical-graphs],
   text: "To audit canonicals at scale, resolve every crawled URL to the final URL its canonical links and redirects lead to, group URLs by that leader, and flag groups with more than one hop, a loop, several canonicals on one page, or a leader that is noindexed, blocked, non-200 or redirecting."}
- {id: D2-C417, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:6, T:d2r2c:40], ver: consistent, src: [rel-canonical-mistakes-blog, consolidate-duplicate-urls], topics: [canonical-graphs, canonical-selection],
   text: "Multiple canonical declarations on one page conflict and are invalid, so the search engine applies its own heuristic and picks the canonical for the site owner; a page should declare only one canonical."}
- {id: D2-C418, s: D2-S09, label: docs, ev: "", ver: source, src: [rel-canonical-mistakes-blog], topics: [canonical-graphs, canonical-selection],
   text: "Google's 2013 Search Central blog post on rel=canonical mistakes says to specify no more than one rel=canonical per page: when a page has more than one, Google will likely ignore all of them, and any benefit of a legitimate canonical is lost."}
- {id: D2-C419, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:7, T:d2r2c:41], ver: consistent, src: [specify-canonical-blog, consolidate-duplicate-urls], topics: [canonical-graphs],
   text: "Canonical chains, where a page's canonical target leads on to yet another URL, are named as improper use in the canonical link specification, according to a community speaker."}
- {id: D2-C420, s: D2-S09, label: docs, ev: "", ver: source, src: [specify-canonical-blog], topics: [canonical-graphs],
   text: "Google's 2009 Search Central blog post introducing rel=canonical says Google's algorithm is lenient and can follow canonical chains, but strongly recommends updating links to point to a single canonical page for optimal canonicalization."}
- {id: D2-C421, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:7, T:d2r2c:41], ver: undocumented, topics: [canonical-graphs, site-moves],
   text: "Canonical chains can run through canonical links alone, through a server-side redirect between members, or through a client-side redirect between members."}
- {id: D2-C422, s: D2-S09, label: slide, who: Tobias Schwarz, ev: IMG_4747, ver: consistent, src: [specify-canonical-blog], topics: [canonical-graphs],
   text: "The crawler report shown on screen flagged a canonical chain as a problem: canonical links that form a chain instead of all pointing directly to the group's canonical leader.",
   quote: "Canonical links form a chain rather than all pointing directly to the leader.", quote_checked: true}
- {id: D2-C423, s: D2-S09, label: analysis, ev: "", ver: n/a, src: [site-move-with-url-changes], topics: [site-moves, canonical-graphs],
   text: "After a migration or a subdomain change, update rel=canonical tags to the new final URLs: canonicals still pointing at old, redirecting URLs create chains through server-side redirects like the one in the real-world example shown."}
- {id: D2-C424, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:9, T:d2r2c:42], ver: undocumented, topics: [canonical-graphs, canonical-selection],
   text: "Canonical loops, such as two HTML pages whose canonical tags point to each other, are a structural conflict: the group has no canonical leader, so its canonical information cannot be used."}
- {id: D2-C425, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:10, T:d2r2c:43], ver: undocumented, topics: [canonical-graphs, site-moves],
   text: "Canonical loops can also run through server-side or client-side redirects, not only through canonical tags."}
- {id: D2-C426, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:10, T:d2r2c:43], ver: undocumented, topics: [canonical-graphs, canonical-selection],
   text: "A community speaker said that at best a search engine's heuristic would treat a canonical loop through redirects as self-referencing canonicals, and doubted that this is often done when the loop runs through a client-side redirect.",
   quote: "But regarding the client-side redirect, I highly doubt that this is often done."}
- {id: D2-C427, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:11, T:d2r2c:44], ver: consistent, src: [consolidate-duplicate-urls], topics: [canonical-graphs, url-discovery],
   rel: [{type: extends, to: D1-C067}],
   text: "When internal links point only to page A and the canonical leader is reached only through A's canonical link, the leader is reachable by machines but not by human visitors, a signal conflict that asks the search engine to index a page users cannot reach.",
   quote: "you're telling the search engine to index something that a human can't reach"}
- {id: D2-C428, s: D2-S09, label: stage, who: Tobias Schwarz, ev: T:t07:12, ver: consistent, src: [consolidate-duplicate-urls, rel-canonical-mistakes-blog], topics: [canonical-graphs, canonical-selection],
   text: "For a canonical leader that users cannot reach through links, a community speaker suggested revisiting the canonical graph and probably making the internally linked page the leader instead."}
- {id: D2-C429, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:13, T:t07:14, T:d2r2c:46], ver: undocumented, topics: [canonical-graphs, canonical-selection],
   rel: [{type: contradicts, to: D2-C348}],
   text: "A community speaker said pages carry different link equity, and a canonical leader that is not the strongest page in its group is technically valid but most likely suboptimal for ranking, so the strongest page should be the leader."}
- {id: D2-C430, s: D2-S09, label: docs, ev: "", ver: source, src: [consolidate-duplicate-urls], topics: [canonical-selection, canonical-graphs, duplicate-content],
   text: "Google's guide to specifying canonical URLs says a canonical helps consolidate signals for duplicate pages: links to a duplicate URL are consolidated with links to the preferred URL once the preferred URL becomes canonical."}
- {id: D2-C431, s: D2-S09, label: analysis, ev: "", ver: n/a, src: [consolidate-duplicate-urls], topics: [canonical-graphs, url-discovery],
   text: "A leader reachable only through a canonical and a leader with weak link equity share one fix: point internal links, sitemap entries and redirects at the URL chosen as canonical, so the leader is both reachable for users and the strongest page in its group."}
- {id: D2-C432, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:15, T:d2r2c:47], ver: consistent, src: [rel-canonical-mistakes-blog, consolidate-duplicate-urls], topics: [canonical-graphs, robots-meta-tag, robots-txt],
   text: "The canonical leader of a group should be indexable: it should carry no noindex robots directive, return no error status code and not be blocked in robots.txt."}
- {id: D2-C433, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:16, T:d2r2c:48], ver: consistent, src: [canonicalization, localized-versions, consolidate-duplicate-urls], topics: [canonical-graphs, hreflang, page-language],
   text: "Canonical links between different language versions of a page are a misuse: if a search engine accepted such a canonical group, only one language version would rank."}
- {id: D2-C434, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:16, T:d2r2c:48], ver: confirmed, src: [consolidate-duplicate-urls, localized-versions], topics: [hreflang, canonical-graphs],
   text: "Language versions of a page should be connected with hreflang annotations instead of canonical links."}
- {id: D2-C435, s: D2-S09, label: docs, ev: "", ver: source, src: [consolidate-duplicate-urls], topics: [hreflang, canonical-graphs],
   text: "Google's guide to specifying canonical URLs says that on pages using hreflang, the canonical should be a page in the same language, or the best possible substitute language if no canonical page exists in the same language."}
- {id: D2-C436, s: D2-S09, label: analysis, ev: "", ver: n/a, src: [consolidate-duplicate-urls], topics: [hreflang, canonical-graphs],
   text: "Check that every canonical group contains a single document language: a group spanning languages means canonicals are joining versions that hreflang should connect, and each language version should keep its own self-referencing canonical."}
- {id: D2-C437, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:17, T:d2r2c:49], ver: n/a, topics: [canonical-graphs],
   text: "In a community speaker's experience, real-world canonical graphs are far more complex than the isolated examples in the talk and commonly mix several canonical problems at once."}
- {id: D2-C438, s: D2-S09, label: stage, who: Tobias Schwarz, ev: [T:t07:8, T:d2r2c:41], ver: confirmed, src: [specify-canonical-blog], topics: [canonical-graphs],
   text: "A community speaker advised fixing canonical chains by cleaning up the canonical graph so that every canonical link points directly to the canonical leader."}
- {id: D2-C439, s: D2-S09, label: analysis, ev: "", ver: n/a, src: [specify-canonical-blog], topics: [canonical-graphs, site-moves],
   text: "The crawler report shown at the talk rated a redirecting canonical target as an error, while Google's 2009 guidance accepts a canonical URL that redirects and says Google can follow canonical chains; the gap is one of severity, since both recommend pointing every canonical link straight at the final URL."}
- {id: D2-C440, s: D2-S09, label: analysis, ev: "", ver: n/a, src: [consolidate-duplicate-urls, canonicalization], topics: [canonical-graphs, canonical-selection],
   text: "Google says canonicalization consolidates link signals from duplicates into the chosen canonical, so a leader with few links of its own is not necessarily weaker once Google accepts it; the practical risk of a weakly linked leader is that Google, treating rel=canonical as a hint, picks a different page as canonical."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D2-C873, s: D2-S09, label: stage, who: Tobias Schwarz, ev: T:d2r2c:35, ver: confirmed, src: [rel-canonical-mistakes-blog], topics: [canonical-graphs, canonical-selection],
   rel: [{type: extends, to: D2-C402}],
   text: "A community speaker said that, under the canonical link specification, an improperly declared canonical tag can also be ignored completely by the application that processes it, not only replaced by that application's own heuristic."}
- {id: D2-C874, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:51, ver: n/a, topics: [site-moves, duplicate-content],
   text: "In a community case study, two of the first loan-comparison websites in Poland did exactly the same thing, so they competed with each other for the same users, the same keywords and the same space in search results."}
- {id: D2-C875, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:53, ver: n/a, topics: [site-moves],
   text: "A community speaker said running two competing sites in one market meant keeping up twice with changes in how people search and in what Google values, instead of putting all resources behind one site."}
- {id: D2-C876, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:54, ver: n/a, topics: [site-moves],
   text: "In a community case study, an acquisition by a group of loan-comparison brands (operating in eleven markets) prompted the merger of two competing portals into one brand, which the speaker framed as creating order rather than only a technical migration."}
- {id: D2-C877, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:55, ver: n/a, topics: [site-moves, content-pruning],
   text: "A community speaker set three goals before any technical work on a two-site consolidation: lower costs (infrastructure, maintenance and content paid for only once), one strong brand focused on one specialization, and a simple structure instead of hundreds of similar URLs competing with each other."}
- {id: D2-C878, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:56, ver: n/a, topics: [site-moves],
   text: "Before choosing which of two domains to keep in a consolidation, a community speaker's team checked both domains for past penalties and compared their traffic, conversion and revenue."}
- {id: D2-C879, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:57, ver: n/a, topics: [site-moves, content-pruning],
   text: "In a community case study, every URL of both domains was exported, compared on traffic, conversion, backlinks, revenue and rankings, and given one of three decisions: keep, merge or remove."}
- {id: D2-C880, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:57, ver: n/a, topics: [content-pruning, helpful-content],
   text: "A community speaker's test for keeping a page during a consolidation was whether it had real potential to make money and really fitted what the business does; pages that failed were removed."}
- {id: D2-C881, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: [T:d2r2c:58, T:d2r2c:59], ver: n/a, topics: [content-pruning, duplicate-content],
   text: "In a community case study, the kept pages that shared the same search intent were merged into one strong article each, taking the merged site from over 2,000 URLs to about 100, a cut of about 95% of URLs."}
- {id: D2-C882, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:59, ver: consistent, src: [site-move-with-url-changes, http-network-errors], topics: [site-moves, content-pruning],
   rel: [{type: extends, to: D2-C396}],
   text: "In a community case study, an old URL got a 301 redirect only when a new page served the same intent; URLs with no same-intent match were removed with an error status instead of being redirected (the exact code is unclear in the recording)."}
- {id: D2-C883, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:59, ver: consistent, src: [site-move-with-url-changes], topics: [site-moves, soft-404],
   text: "A community speaker's team never redirected removed URLs to the homepage, even those that still brought traffic, because the aim was a clear signal about what the site is rather than keeping every visitor."}
- {id: D2-C884, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:60, ver: confirmed, src: [site-move-with-url-changes], topics: [site-moves, sitemaps, crawlable-links, search-console-features],
   rel: [{type: extends, to: D1-C540}],
   text: "The technical steps of a community speaker's domain consolidation included submitting new sitemaps, filing a change of address in Search Console and updating internal links so the new pages did not rely on redirects alone."}
- {id: D2-C885, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:60, ver: n/a, topics: [site-moves, measurement],
   text: "During a domain consolidation, a community speaker's team merged the analytics of both sites so that no historical data was lost."}
- {id: D2-C886, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:61, ver: consistent, src: [crawl-budget-guide], topics: [crawl-budget, site-moves],
   rel: [{type: extends, to: D1-C103}],
   text: "A community speaker listed the technical SEO goals of a two-site consolidation as lighter pages, faster loading and no crawl budget spent on content that no longer mattered."}
- {id: D2-C887, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:62, ver: n/a, topics: [helpful-content],
   text: "As part of a consolidation, a community speaker's team introduced the real people behind the site, financial experts visibly responsible for what it publishes, which the speaker counted as important as the technical work."}
- {id: D2-C888, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:63, ver: consistent, src: [site-move-with-url-changes], topics: [site-moves, measurement, search-console-data],
   text: "After a domain consolidation went live, a community speaker's team checked Search Console every day, ran full site crawls and compared the numbers with the pre-migration baseline for months."}
- {id: D2-C889, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:64, ver: n/a, topics: [site-moves],
   text: "A community speaker reported that after consolidating two loan-comparison sites into one domain, traffic grew from the first day, with no drop or waiting period."}
- {id: D2-C890, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:64, ver: n/a, topics: [site-moves, content-pruning],
   text: "A community speaker reported that revenue grew 100% month over month after the consolidation (the speaker's figure, period not stated), although the site had been cut from over 2,000 URLs to about 100."}
- {id: D2-C891, s: D2-S09, label: stage, who: Martyna Ağanoğlu, ev: T:d2r2c:65, ver: n/a, topics: [content-pruning, helpful-content],
   text: "A community speaker credited a consolidation's success to doing everything at once: one clear topic, visible expertise instead of an anonymous content factory, and crawling spent only on pages that matter, growing through quality rather than more content."}
- {id: D2-C892, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:66, ver: n/a, topics: [site-moves],
   text: "A community talk on a still unfinished migration, after a client bought a company whose site had to fit into one product line, presented the decisions behind the migration rather than its results."}
- {id: D2-C893, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:68, ver: n/a, topics: [site-moves],
   text: "A community speaker argued that migrations are hard because of people rather than technology: two companies, two teams, a dozen stakeholders and a board that set a deadline before anyone opened the CMS.",
   quote: "I think there are no complex migrations. There are complex people."}
- {id: D2-C894, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:69, ver: n/a, topics: [site-moves],
   text: "A community speaker named four kinds of post-acquisition site migration: absorb (one site integrates into the other), keep apart, merge (two or three sites into a new one), and plug in (a full site becomes a section of the other site)."}
- {id: D2-C895, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: [T:d2r2c:70, T:d2r2c:71], ver: consistent, src: [site-move-with-url-changes], topics: [site-moves],
   text: "A community speaker said a migration should be run around one document, the redirect map, which gives every old URL an approved destination."}
- {id: D2-C896, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:70, ver: n/a, topics: [site-moves, content-pruning],
   text: "A community speaker's four tips before mapping a migration: agree what to keep and retire with an owner for every decision, review what to retire with data, prioritise by business value and not only traffic, and set expectations with an owner to escalate to."}
- {id: D2-C897, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:70, ver: consistent, src: [site-move-with-url-changes], topics: [site-moves, crawlable-links],
   text: "A community speaker advised asking support and sales which pages make buyers buy, and preparing the destination with relevant content and internal links before a migration launches."}
- {id: D2-C898, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:71, ver: n/a, topics: [site-moves],
   text: "A community speaker said most migration failures look technical but trace back to a decision nobody made; in the migration presented, more than 7,000 URLs still had no approved destination at the time of the talk."}
- {id: D2-C899, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:72, ver: n/a, topics: [site-moves],
   text: "A community speaker recorded each migration decision per URL: old URL, new URL, what must survive (for example a product answer and a demo request), who approves, and the test that proves it works."}
- {id: D2-C900, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:72, ver: n/a, topics: [site-moves],
   text: "A community speaker advised asking other teams during a migration about everything a crawler cannot reveal, such as sales workflows or legal requirements."}
- {id: D2-C901, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:73, ver: n/a, topics: [site-moves],
   text: "For migrations with many URLs, a community speaker suggested letting a similarity score propose redirect destinations and having people review the critical pages."}
- {id: D2-C902, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:74, ver: consistent, src: [site-move-with-url-changes], topics: [site-moves, measurement],
   text: "Before a migration launches, a community speaker advised freezing the inventory (CMS export, crawl, sitemap, search data and logs), saving all content and approving the redirect map."}
- {id: D2-C903, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:75, ver: consistent, src: [http-network-errors], topics: [site-moves, soft-404],
   rel: [{type: extends, to: D2-C334}],
   text: "A community speaker warned that HTTP 200 responses across a new domain show only that the URLs work, not that the content users came for is still there, so after launch the redirect map becomes the test."}
- {id: D2-C904, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:75, ver: n/a, topics: [site-moves, measurement],
   text: "A community speaker's three post-migration checks per URL: the route (the old URL reaches its destination), the answer (the approved content is still there) and the lead (a demo request still reaches the CRM); automate them, but have people check critical journeys."}
- {id: D2-C905, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:76, ver: n/a, topics: [site-moves, measurement],
   text: "A community speaker advised giving moved content its own baseline, because site-wide totals can hide lost pages and lost search queries."}
- {id: D2-C906, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:77, ver: n/a, topics: [site-moves],
   text: "A community speaker cited a recent study (not named) that reported a median recovery time of 304 days after a site migration."}
- {id: D2-C907, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:77, ver: n/a, topics: [site-moves],
   text: "A community speaker said a long expected recovery after a migration is no reason to wait: broken redirect routes and blocked pages need action immediately."}
- {id: D2-C908, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:78, ver: n/a, topics: [site-moves],
   text: "A community speaker advised telling users of a migrated brand that they are in the right place, through emails, a press release and a blog post, to keep the trust built with the old brand."}
- {id: D2-C909, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:79, ver: n/a, topics: [site-moves],
   text: "A community speaker said reputation travels with a migrated product: a good product takes its reviews and links along, and a product nobody likes takes its complaints along."}
- {id: D2-C910, s: D2-S09, label: stage, who: David Carrasco Pamies, ev: T:d2r2c:80, ver: n/a, topics: [site-moves],
   text: "A community speaker summed up migration planning in three questions: what survives, who approves, and what test shows the migration actually works."}
- {id: D2-C911, s: D2-S09, label: docs, ev: "", ver: source, src: [site-move-with-url-changes], topics: [site-moves, soft-404],
   text: "Google's site move guide says not to redirect many old URLs to one irrelevant destination such as the new site's home page, which can confuse users and might be treated as a soft 404, and to return a 404 or 410 for deleted or merged content that is not moved to the new site."}
- {id: D2-C912, s: D2-S09, label: docs, ev: "", ver: source, src: [site-move-with-url-changes], topics: [site-moves, sitemaps, search-console-features],
   text: "Google's site move guide says to submit a Change of Address in Search Console when moving from one domain or subdomain to another, to submit the new sitemap, and to change internal links on the new site from the old URLs to the new ones."}
- {id: D2-C913, s: D2-S09, label: analysis, ev: "", ver: n/a, src: [http-network-errors, site-move-with-url-changes], topics: [site-moves, content-pruning],
   text: "For URLs removed in a consolidation, return 404 or 410: Google's site move guide names those two codes, and Google's crawlers treat every 4xx code except 429 the same way, as content that does not exist, so the choice between them matters less than not redirecting to an unrelated page."}
- {id: D2-C914, s: D2-S09, label: analysis, ev: "", ver: n/a, src: [crawl-budget-guide], topics: [crawl-budget, content-pruning],
   text: "Google's crawl budget guide is written for sites with over a million pages changing weekly or over 10,000 pages changing daily, so for a consolidation of about 2,000 URLs the crawl-budget gain is likely minor; the benefit of pruning such a site more plausibly comes from one strong URL per intent and consolidated signals."}
- {id: D2-C915, s: D2-S09, label: analysis, ev: "", ver: n/a, src: [site-move-with-url-changes], topics: [site-moves, measurement],
   text: "The 304-day median recovery a community speaker cited from an unnamed study and Google's site move guide (a few weeks or more for a medium-sized site until Google shows the new URLs, longer for larger sites) measure different things: indexing can switch within weeks while traffic recovery can take far longer, so plan and report on both."}

# ---------- D2-S11 Finding the gold nuggets: structured data, media, and more! ----------
- {id: D2-C441, s: D2-S11, label: slide, who: Gary Illyes, ev: [IMG_4750, T:t08:2], ver: undocumented, topics: [indexing-pipeline, pipeline-overview],
   rel: [{type: extends, to: D1-C063}, {type: repeats, to: D2-C026}],
   text: "Google's indexing pipeline slide put a Processing stage between the crawler and the index and listed HTML parsing, rendering, deduplication and feature extraction above it, with feature extraction highlighted as the step of this talk."}
- {id: D2-C442, s: D2-S11, label: slide, who: Gary Illyes, ev: IMG_4750, ver: undocumented, topics: [indexing-pipeline, crawl-pipeline],
   rel: [{type: repeats, to: D2-C048}],
   text: "Google's indexing pipeline slide drew a feedback line from the Processing stage back to the crawl queue."}
- {id: D2-C443, s: D2-S11, label: stage, who: Gary Illyes, ev: [T:t08:1, T:d2r3a:1], ver: undocumented, topics: [indexing-pipeline],
   text: "Google's indexing includes a dedicated system, whose internal name Gary Illyes would not disclose, that extracts the parts of a page that are traditionally expensive to extract."}
- {id: D2-C444, s: D2-S11, label: stage, who: Gary Illyes, ev: [T:t08:2, IMG_4750, T:d2r3a:2], ver: undocumented, topics: [indexing-pipeline, duplicate-content],
   rel: [{type: extends, to: D2-C026}],
   text: "Google runs deduplication before feature extraction, so that the expensive extraction work is spent only on a trimmed-down, manageable set of documents."}
- {id: D2-C445, s: D2-S11, label: docs, ev: "", ver: source, src: [how-search-works], topics: [indexing-pipeline, pipeline-overview],
   text: "Google's guide to how Search works says rendering happens during the crawl, and describes indexing as analysing a page's text, key tags and attributes such as title elements and alt attributes, images and videos, and deciding whether the page is a duplicate or the canonical."}
- {id: D2-C446, s: D2-S11, label: stage, who: Gary Illyes, ev: [T:t08:3, T:d2r3a:3], ver: consistent, src: [how-search-works, intro-structured-data], topics: [indexing-pipeline, structured-data, images],
   text: "The 'gold nuggets' that Google's feature extraction step pulls out of a page's HTML are structured data (such as JSON-LD), images and videos."}
- {id: D2-C447, s: D2-S11, label: stage, who: Gary Illyes, ev: [T:t08:4, T:d2r3a:4], ver: consistent, src: [image-seo], topics: [images, indexing-pipeline],
   text: "For images, Google's feature extraction takes the img element with its src and other attributes, including inline images, and passes them on to Google's image indexing service."}
- {id: D2-C448, s: D2-S11, label: stage, who: Gary Illyes, ev: [T:t08:5, T:d2r3a:5], ver: consistent, src: [video-seo], topics: [video, indexing-pipeline],
   text: "For videos, Google's feature extraction takes the video itself and the data around it, to get a better sense of what happens in the video, and passes them to Google's media indexing engine."}
- {id: D2-C449, s: D2-S11, label: stage, who: Gary Illyes, ev: [T:t08:6, T:d2r3a:6], ver: undocumented, topics: [indexing-pipeline],
   text: "Gary Illyes said feature extraction, which extracts page structures into a form Google's systems can consume internally, is still expensive, though not the most expensive operation."}
- {id: D2-C450, s: D2-S11, label: analysis, ev: "", ver: n/a, topics: [indexing-pipeline, duplicate-content, structured-data-implementation],
   text: "Because Google extracts structured data, images and videos only after deduplication, put markup and media on the URL you want as canonical and keep them identical on its duplicates; markup that exists only on a duplicate that loses canonical selection may never be extracted."}
- {id: D2-C451, s: D2-S11, label: docs, ev: "", ver: source, src: [structured-data-guidelines], topics: [structured-data-implementation, duplicate-content],
   text: "Google's general structured data guidelines recommend placing the same structured data on all duplicate pages of the same content, not just on the canonical page.",
   quote: "we recommend placing the same structured data on all page duplicates, not just on the canonical page"}

# ---------- D2-S12 What is Structured Data and why we need it on the internet. ----------
- {id: D2-C452, s: D2-S12, label: stage, ev: [T:t08:9, T:d2r3a:9], ver: n/a, topics: [search-evolution, ecosystem-principles],
   rel: [{type: extends, to: D1-C011}, {type: extends, to: D1-C158}],
   text: "Search results have moved from ten blue links to feature-rich, media-rich results because users wanted more."}
- {id: D2-C453, s: D2-S12, label: stage, ev: [T:t08:9, T:d2r3a:9], ver: undocumented, topics: [search-evolution, structured-data, ecosystem-principles],
   rel: [{type: extends, to: D1-C011}],
   text: "AI Overviews and AI Mode launched as fairly text-heavy answers with little image content and few tables, and they have become more structured over time because that is what users want."}
- {id: D2-C454, s: D2-S12, label: stage, ev: [T:t08:11, T:d2r3a:11], ver: confirmed, src: [intro-structured-data, review-snippet-sd], topics: [structured-data, rich-results],
   text: "Structured data turns the loosely structured web into structured information that powers visual search features such as review stars and recipe filters (for example by preparation time)."}
- {id: D2-C455, s: D2-S12, label: stage, ev: [T:t08:12, T:d2r3a:12], ver: confirmed, src: [intro-structured-data], topics: [structured-data],
   text: "Describing a page's content in a structured way lets Google understand and interpret that content more accurately."}
- {id: D2-C456, s: D2-S12, label: stage, ev: [T:t08:12, T:d2r3a:12], ver: consistent, src: [intro-structured-data], topics: [structured-data, rich-results],
   text: "Structured data can bring more qualified traffic, because the site can be shown in new, more interesting ways to more people, who are then more likely to click."}
- {id: D2-C457, s: D2-S12, label: stage, ev: [T:t08:13, T:d2r3a:13], ver: n/a, topics: [structured-data, ai-crawlers-and-agents],
   text: "Inside Google, views on structured data split into two camps: one says it is useless because models can generate it or read the page directly, the other says it is the future of machines talking to each other through MCP servers and new standards; the speaker said the truth is in the middle."}
- {id: D2-C458, s: D2-S12, label: slide, ev: [IMG_4752, T:t08:14], ver: undocumented, topics: [structured-data],
   text: "Google gave four reasons why structured data is still valuable even though models can extract information from pages: precision, extra content, efficiency and focus."}
- {id: D2-C459, s: D2-S12, label: slide, ev: [IMG_4752, T:t08:15], ver: undocumented, topics: [structured-data, ai-in-search-systems],
   text: "Structured data gives the high precision that complex schemas such as sale pricing need, with higher accuracy than large-scale extraction by large language models (LLMs).",
   quote: "Structured data provides the high precision needed for complex schema (sale pricing), achieving higher accuracy than large-scale LLM extraction.", quote_checked: true}
- {id: D2-C460, s: D2-S12, label: stage, ev: T:t08:15, ver: undocumented, topics: [structured-data, schema-org],
   text: "In the speaker's own tests, even the latest LLMs asked to generate schema.org markup for a page often invent properties that do not exist, get deeply nested schemas such as complex pricing models wrong, and duplicate content across several fields."}
- {id: D2-C461, s: D2-S12, label: stage, ev: [T:t08:15, T:d2r3a:15], ver: undocumented, topics: [structured-data, ai-in-search-systems],
   text: "Automatic LLM extraction of structured information makes a great demo but is not yet good enough for extraction that aims at something like 99.9% accuracy, the speaker said."}
- {id: D2-C462, s: D2-S12, label: docs, ev: "", ver: source, src: [gen-ai-content-guide], topics: [structured-data-implementation, ai-in-search-systems],
   rel: [{type: extends, to: D1-C250}],
   text: "Google's guidance on generative AI content warns that AI output can contain hallucinations and says AI-generated metadata, including structured data and image alt text, should be fact-checked before publishing and the markup validated."}
- {id: D2-C463, s: D2-S12, label: slide, ev: [IMG_4753, T:t08:16, T:t08:17], ver: undocumented, topics: [structured-data],
   text: "Structured data often carries non-visible metadata that the page text lacks, such as full ISO dates or stable identifiers for user-generated content.",
   quote: "It often contains non-visible metadata, such as full ISO dates or stable identifiers for UGC, that is not present in the page text.", quote_checked: true}
- {id: D2-C464, s: D2-S12, label: stage, ev: [T:t08:16, T:d2r3a:16], ver: undocumented, topics: [structured-data, main-content],
   text: "Google's own extraction systems focus heavily on what is visible on a page, which improves precision but means they can miss content or interpret it incorrectly."}
- {id: D2-C465, s: D2-S12, label: stage, ev: [T:t08:16, T:d2r3a:16], ver: consistent, src: [ai-optimization-guide], topics: [ai-crawlers-and-agents, gemini-and-search],
   rel: [{type: extends, to: D1-C131}],
   text: "Gemini in Chrome relies heavily on the screenshot it takes of a page."}
- {id: D2-C466, s: D2-S12, label: stage, ev: [T:t08:17, T:d2r3a:17], ver: consistent, src: [event-sd], topics: [structured-data, structured-data-implementation],
   text: "Markup can state a date as a full ISO 8601 value, which disambiguates a visible date whose local time zone Google might not detect correctly; this matters for event extraction and wherever the date must be exactly right."}
- {id: D2-C467, s: D2-S12, label: docs, ev: "", ver: source, src: [intro-structured-data, structured-data-guidelines], topics: [structured-data-implementation, structured-data],
   text: "Google's structured data documentation says not to mark up content that is not visible to readers of the page, and not to add structured data about information that users cannot see even if it is accurate.",
   quote: "don't add structured data about information that is not visible to the user, even if the information is accurate"}
- {id: D2-C468, s: D2-S12, label: analysis, ev: "", ver: n/a, src: [structured-data-guidelines, intro-structured-data], topics: [structured-data-implementation, structured-data],
   text: "The 'non-visible metadata' argument is not a licence to mark up hidden content, since Google's structured data guidelines still require markup to describe what users can see; use markup for the machine-precise form of facts the page shows, such as a full ISO date with time zone for a visible event date or a homepage url for a named organisation."}
- {id: D2-C469, s: D2-S12, label: slide, ev: [IMG_4754, T:t08:18, T:d2r3a:18], ver: undocumented, topics: [structured-data],
   text: "Parsing structured data is significantly cheaper and more efficient than relying on LLMs for every complex extraction task."}
- {id: D2-C470, s: D2-S12, label: stage, ev: [T:t08:18, T:d2r3a:18], ver: undocumented, topics: [ai-in-search-systems, structured-data],
   text: "Even Google cannot afford to run complex AI models on every page in its index, and distilling them into cheaper models makes them less precise."}
- {id: D2-C471, s: D2-S12, label: stage, ev: [T:t08:18, T:d2r3a:18], ver: undocumented, topics: [structured-data],
   text: "Rule-based parsing of markup is nearly free by comparison with AI models, so Google will always prefer extracting information from structured data over model-based extraction.",
   quote: "So we're always going to prefer that particular approach."}
- {id: D2-C472, s: D2-S12, label: analysis, ev: "", ver: n/a, topics: [structured-data, structured-data-implementation],
   text: "Do not drop markup on the assumption that AI reads the page anyway: by Google's own account LLM extraction is not precise enough for prices and nested offers and too costly to run on every page, so explicit markup remains the dependable route for those facts."}
- {id: D2-C473, s: D2-S12, label: slide, ev: [IMG_4755, T:t08:19], ver: undocumented, topics: [structured-data, main-content],
   text: "Structured data explicitly points to the pertinent data on a page, which reduces noise and stops Google's systems from pulling in extraneous information such as prices of related products."}
- {id: D2-C474, s: D2-S12, label: stage, ev: [T:t08:19, T:d2r3a:19], ver: undocumented, topics: [main-content, structured-data],
   rel: [{type: extends, to: D2-C028}],
   text: "Google's systems sometimes fail to determine a page's main content correctly, and structured data helps because site owners tend to mark up what is actually important rather than boilerplate or ads."}
- {id: D2-C475, s: D2-S12, label: analysis, ev: "", ver: n/a, topics: [merchant-markup, main-content],
   text: "On product pages with related-product or recently-viewed carousels, make sure the Product markup describes only the main item and its price; Google's own example of what markup prevents was pulling a price from related products."}
- {id: D2-C476, s: D2-S12, label: stage, ev: [T:t08:20, T:d2r3a:20], ver: consistent, src: [ai-features-guide, ai-optimization-guide], topics: [structured-data, seo-vs-geo],
   rel: [{type: extends, to: D1-C038}],
   text: "The structured data Google processes is not fed very differently to AI Overviews and AI Mode: after cleaning and quality work, the same data goes to both the classic results page and the AI features."}
- {id: D2-C477, s: D2-S12, label: stage, ev: [T:t08:21, T:d2r3a:21], ver: undocumented, topics: [structured-data, seo-vs-geo],
   rel: [{type: extends, to: D1-C061}],
   text: "As far as the speaker knows, in most of Google's main AI uses a page's schema.org markup is not turned into text and put directly into the model's context; the data is first sorted out, checked for quality and indexed before it is passed on as grounding context."}
- {id: D2-C478, s: D2-S12, label: stage, ev: [T:t08:21, T:d2r3a:21], ver: undocumented, topics: [structured-data, seo-vs-geo],
   text: "The speaker said there are concerns that feeding raw schema.org markup straight into an AI model's context would be a big abuse vector, one reason Google does not do so."}
- {id: D2-C479, s: D2-S12, label: analysis, ev: "", ver: n/a, topics: [seo-vs-geo, structured-data-implementation],
   text: "There is no separate markup for AI features: by Google's account the same processed markup feeds classic results and AI answers, and raw schema.org is generally not passed into model context, so invest in the types Google documents for its features rather than in extra markup written for AI."}
- {id: D2-C480, s: D2-S12, label: docs, ev: "", ver: source, src: [ai-optimization-guide, ai-features-guide], topics: [structured-data, seo-vs-geo],
   rel: [{type: extends, to: D1-C061}],
   text: "Google's guide to optimizing for generative AI features lists 'overfocusing on structured data' among the things site owners don't need to do: structured data is not required for generative AI search and no special schema.org markup is needed, though it remains worth using because it helps pages become eligible for rich results."}
- {id: D2-C481, s: D2-S12, label: stage, ev: [T:t08:22, T:d2r3a:22], ver: confirmed, src: [intro-structured-data], topics: [structured-data, rich-results],
   text: "Google's developer site has a number of case studies that show traffic and session-duration gains from structured data."}
- {id: D2-C482, s: D2-S12, label: slide, ev: [IMG_4756, T:t08:22], ver: confirmed, src: [rakuten-case-study], topics: [structured-data, rich-results],
   text: "A Google case study shown on stage (published May 2018) reported that Rakuten Recipes got 2.7 times more traffic from search engines and a 1.5 times increase in session duration after implementing recipe structured data."}
- {id: D2-C483, s: D2-S12, label: stage, ev: [T:t08:22, T:d2r3a:22], ver: n/a, topics: [structured-data],
   text: "The speaker called the Rakuten study old and said the world has changed a lot, but expects the link between structured data and more interactive, visually appealing results to hold for the foreseeable future."}
- {id: D2-C484, s: D2-S12, label: stage, ev: [T:t08:23, T:d2r3a:23], ver: confirmed, src: [schema-org-launch-blog], topics: [schema-org],
   text: "Schema.org is a common vocabulary that several major search engines started together so that site owners can mark up pages and every consumer interprets the markup the same way; the speaker put its start 15 to 20 years ago (Google, Bing and Yahoo! announced it in June 2011)."}
- {id: D2-C485, s: D2-S12, label: stage, ev: [T:t08:23, T:d2r3a:23], ver: n/a, topics: [schema-org, web-standards],
   text: "Schema.org is an open public collaboration, and the speaker invited people who enjoy ontologies and data to join it."}
- {id: D2-C486, s: D2-S12, label: stage, ev: [T:t08:24, T:d2r3a:24], ver: consistent, src: [structured-data-guidelines], topics: [schema-org, structured-data-implementation],
   text: "Marking something up with only a very generic schema.org type says little about it and is very hard for Google to use."}
- {id: D2-C487, s: D2-S12, label: stage, ev: [T:t08:24, T:d2r3a:24], ver: consistent, src: [intro-structured-data], topics: [schema-org, structured-data-implementation],
   text: "Google uses schema.org as its markup vocabulary but mostly consumes only the subsets that its developer documentation declares, for the features it builds."}
- {id: D2-C488, s: D2-S12, label: stage, ev: [T:t08:25, T:d2r3a:25], ver: consistent, src: [intro-structured-data], topics: [structured-data-implementation],
   text: "Google will never penalise a site just for having more structured data on its pages than Google uses; extra markup does not hurt.",
   quote: "we will never penalize you for having more structured data on your pages"}
- {id: D2-C489, s: D2-S12, label: stage, ev: [T:t08:25, T:d2r3a:25], ver: consistent, src: [intro-structured-data], topics: [structured-data-implementation],
   text: "Describing every semantic detail of a page in markup is probably not worth the effort; focus on the structured data that Google or other consumers actually use."}
- {id: D2-C490, s: D2-S12, label: slide, ev: [IMG_4757, T:t08:26, T:d2r3a:26], ver: confirmed, src: [search-gallery, intro-structured-data], topics: [rich-results, structured-data-implementation],
   text: "Google recommends using the Search gallery in its developer documentation to find the structured data features that suit a site; the gallery shows each feature and how Google uses the markup."}
- {id: D2-C491, s: D2-S12, label: stage, ev: [T:t08:26, T:d2r3a:26], ver: consistent, src: [search-gallery], topics: [structured-data-implementation, rich-results],
   text: "Google's structured data types fall roughly into two groups: broad page-level types such as breadcrumbs and article, and vertical-specific types such as recipes, events and products."}
- {id: D2-C492, s: D2-S12, label: stage, ev: [T:t08:27, T:d2r3a:27], ver: consistent, src: [structured-data-guidelines], topics: [structured-data-implementation],
   text: "Pick only the structured data types that are relevant to a page instead of adding every type Google is interested in."}
- {id: D2-C493, s: D2-S12, label: stage, ev: [T:t08:28, T:t08:29, T:d2r3a:28], ver: consistent, src: [intro-structured-data], topics: [structured-data-implementation],
   text: "Most sites now run on content management systems whose plug-ins generate the markup, so check that the plug-ins in your stack produce good markup, for example a calendar plug-in that outputs event markup."}
- {id: D2-C494, s: D2-S12, label: stage, ev: [T:t08:30, T:d2r3a:29], ver: consistent, src: [intro-structured-data, structured-data-guidelines], topics: [structured-data-implementation],
   text: "Google accepts three structured data syntaxes, JSON-LD, microdata and RDFa, which are all valid and are extracted at the very start into the same pipelines, so they are interpreted identically downstream."}
- {id: D2-C495, s: D2-S12, label: stage, ev: [T:t08:30, T:d2r3a:29], ver: confirmed, src: [intro-structured-data], topics: [structured-data-implementation],
   text: "Google recommends JSON-LD because it is one contiguous block that is easier to author, so people make fewer mistakes with it."}
- {id: D2-C496, s: D2-S12, label: stage, ev: [T:t08:30, T:d2r3a:29], ver: undocumented, topics: [structured-data-implementation],
   text: "Microdata has an advantage when payload size matters: embedded in the existing HTML, it avoids duplicating the page content in a separate JSON-LD block."}
- {id: D2-C497, s: D2-S12, label: analysis, ev: "", ver: n/a, topics: [structured-data-implementation],
   text: "Default to JSON-LD and switch to microdata only where page weight is critical, since Google interprets all three syntaxes identically and JSON-LD is the one people get wrong least often."}
- {id: D2-C498, s: D2-S12, label: slide, ev: [IMG_4758, T:t08:31, T:d2r3a:30], ver: confirmed, src: [rich-results-test-help, intro-structured-data], topics: [structured-data-implementation, rich-results],
   text: "Google recommends testing and previewing structured data in the Rich Results Test, which shows the rich result features it detected and whether the markup is valid."}
- {id: D2-C499, s: D2-S12, label: stage, ev: [T:t08:31, T:d2r3a:30], ver: consistent, src: [intro-structured-data], topics: [structured-data-implementation],
   text: "Test structured data manually first and only then put it into the site's templates."}
- {id: D2-C500, s: D2-S12, label: stage, ev: [T:t08:32, T:d2r3a:31], ver: confirmed, src: [structured-data-guidelines], topics: [structured-data-implementation],
   text: "Structured data that is not relevant to the page's content can be treated as abusive: Google's filters make it ineffective, and egregious cases can lead to a manual action."}
- {id: D2-C501, s: D2-S12, label: docs, ev: "", ver: source, src: [structured-data-guidelines], topics: [structured-data-implementation, rich-results],
   text: "Google's general structured data guidelines say a structured data manual action removes a page's eligibility for rich results but does not affect how the page ranks in web search."}
- {id: D2-C502, s: D2-S12, label: stage, ev: [T:t08:33, T:d2r3a:32], ver: confirmed, src: [organization-sd], topics: [structured-data-implementation],
   text: "Use unique identifiers in structured data, for example the homepage URL in an organisation's url property, so Google can tell which specific entity is meant rather than reading just a name string."}
- {id: D2-C503, s: D2-S12, label: stage, ev: [T:t08:34, T:d2r3a:33], ver: undocumented, topics: [structured-data-implementation],
   text: "Several plug-ins emitting the same markup type is one of the most common structured data problems: the duplicates can make an event details page look like a list of events and change how Google interprets the page."}
- {id: D2-C504, s: D2-S12, label: analysis, ev: "", ver: n/a, topics: [structured-data-implementation],
   text: "Audit CMS templates for duplicate markup by running one page per template through the Rich Results Test and checking whether an SEO plug-in and a theme or events plug-in emit the same type twice; 'more markup never hurts' covers relevant, non-duplicated markup only."}
- {id: D2-C505, s: D2-S12, label: stage, ev: [T:t08:35, T:d2r3a:34], ver: confirmed, src: [loyalty-program-sd, shipping-policy-sd, search-docs-updates], topics: [merchant-markup],
   text: "Google's shopping structured data launches of the previous year (2025) added support for merchant loyalty programs and shipping policies, letting merchants define a policy at organisation level and specify details at product level."}
- {id: D2-C506, s: D2-S12, label: stage, ev: [T:t08:36, T:d2r3a:35], ver: consistent, src: [merchant-listing-sd, search-docs-updates], topics: [merchant-markup],
   text: "Google's structured data speaker said that in the months before the event Google added support for validity dates on sale prices in product structured data, so merchants no longer need to rush to remove a sale price when the sale ends for fear it shows wrongly in snippets."}
- {id: D2-C507, s: D2-S12, label: docs, ev: "", ver: source, src: [search-docs-updates, merchant-listing-sd], topics: [merchant-markup],
   text: "Google's documentation updates log calls the July 2026 sale price change a clarification: a new Sale duration section of the merchant listing guide explains validFrom with validThrough or priceValidUntil, aligned with Merchant Center's sale_price_effective_date attribute."}
- {id: D2-C508, s: D2-S12, label: analysis, ev: "", ver: n/a, src: [merchant-listing-sd, search-docs-updates], topics: [merchant-markup],
   text: "For time-limited sales, give the sale price its validity dates in the product markup (Google's merchant listing documentation describes validFrom, validThrough and priceValidUntil) instead of editing markup by hand when the sale ends, and keep the dates aligned with the Merchant Center feed."}
- {id: D2-C509, s: D2-S12, label: stage, ev: [T:t08:37, T:d2r3a:35], ver: n/a, topics: [merchant-markup],
   text: "More shopping structured data news was left for a Day 3 talk by a Google colleague, Alex."}
- {id: D2-C510, s: D2-S12, label: stage, ev: [T:t08:38, T:d2r3a:36], ver: undocumented, topics: [schema-org],
   text: "Schema.org, in which Google is a major participant, began publishing usage statistics for all its types and properties in 2026, showing in buckets how many domains use each one; the data is also in schema.org's GitHub repository."}
- {id: D2-C511, s: D2-S12, label: stage, ev: [T:t08:39, T:d2r3a:37], ver: undocumented, topics: [schema-org, feature-requests],
   rel: [{type: extends, to: D1-C120}],
   text: "Google often needs to see a markup type adopted on websites before it invests in a feature that uses it, a chicken-and-egg problem that the schema.org usage statistics are meant to help break."}
- {id: D2-C512, s: D2-S12, label: stage, ev: [T:t08:40, T:d2r3a:38], ver: undocumented, topics: [schema-org],
   text: "Schema.org added support for RDF lists and sets, which give a way to express ordered values, because RDF triples are not ordered by nature."}
- {id: D2-C513, s: D2-S12, label: analysis, ev: "", ver: n/a, topics: [schema-org, feature-requests],
   text: "Markup for schema.org types that Google does not use yet is a bet on future features; check a type's usage bucket on schema.org before investing, since adoption is what Google says it watches before building a feature."}
- {id: D2-C514, s: D2-S12, label: slide, ev: [IMG_4759, T:t08:41, T:d2r3a:39], ver: undocumented, topics: [structured-data-implementation],
   text: "Google announced server-side structured data validation as coming soon: it will publish downloadable validation rules in SHACL on each structured data feature guide, with other kinds of checks to follow."}
- {id: D2-C515, s: D2-S12, label: slide, ev: IMG_4759, ver: undocumented, topics: [structured-data-implementation],
   text: "Google's planned validation workflow has five steps: download the rules from the feature guide, generate the JSON or embedded microdata or RDFa, run the rules against the generated server-side markup as a first check, deploy and test in the Rich Results Test, and monitor ongoing performance in Search Console."}
- {id: D2-C516, s: D2-S12, label: stage, ev: [T:t08:41, T:t08:42, T:d2r3a:40], ver: undocumented, topics: [structured-data-implementation],
   text: "The SHACL rules are meant to run inside a site's content generation, so markup is sanity-checked before it is published and does not silently regress later, a breakage site owners might otherwise discover only through a Search Console report."}
- {id: D2-C517, s: D2-S12, label: stage, ev: [T:t08:42, T:d2r3a:40], ver: undocumented, topics: [structured-data-implementation],
   text: "The SHACL rules will not replace Search Console as the canonical place for structured data reports, because some checks use Google's internal libraries and cannot be expressed in SHACL, but they will catch problems such as a missing required field."}
- {id: D2-C518, s: D2-S12, label: slide, ev: [IMG_4760, T:t08:43, T:d2r3a:41], ver: consistent, src: [event-sd], topics: [structured-data-implementation],
   text: "Google's example SHACL shape for Event requires a name, treats a missing description only as a warning, and accepts the image either as an ImageObject or as a URL."}
- {id: D2-C519, s: D2-S12, label: stage, ev: [T:t08:43, T:d2r3a:41], ver: undocumented, topics: [structured-data-implementation],
   text: "Google plans a SHACL rule set for each of its structured data feature types and will release the rule sets gradually once they have been checked."}
- {id: D2-C520, s: D2-S12, label: analysis, ev: "", ver: n/a, topics: [structured-data-implementation],
   text: "When the SHACL rules appear, wire them into the build or CMS publishing step as an automated test, so a template change that drops a required property fails before deployment instead of surfacing weeks later in Search Console."}
- {id: D2-C521, s: D2-S12, label: stage, ev: [T:t08:44, T:d2r3a:42], ver: consistent, src: [intro-structured-data, structured-data-guidelines], topics: [rich-results, structured-data],
   rel: [{type: extends, to: D1-C122}],
   text: "Structured data makes pages eligible to appear as rich results, Google's structured data talk said in its recap."}
- {id: D2-C522, s: D2-S12, label: stage, ev: [T:t08:44, T:d2r3a:42], ver: confirmed, src: [simplifying-serp-blog], topics: [rich-results, structured-data-implementation],
   text: "Google keeps adding structured data features and recommendations but also removes them: in the previous year (2025) it removed several features that brought little benefit and were little used."}
- {id: D2-C834, s: D2-S12, label: docs, ev: "", ver: source, src: [merchant-listing-sd], topics: [merchant-markup],
   text: "Google's merchant listing guide says Product rich results only support pages that focus on a single product, or on several variants of the same product."}
- {id: D2-C835, s: D2-S12, label: docs, ev: "", ver: source, src: [merchant-listing-sd], topics: [merchant-markup],
   text: "Google's merchant listing guide warns that a listing may not display if its priceValidUntil property indicates a past date."}
- {id: D2-C836, s: D2-S12, label: docs, ev: "", ver: source, src: [event-sd], topics: [structured-data-implementation],
   text: "Google's Event structured data guide says to give a date without a time, such as 2019-08-15, when the start hour is not known, and to include the UTC or GMT offset whenever a time is given."}

# ---------- D2-S13 Using images to your advantage and Engaging Search users with videos ----------
- {id: D2-C523, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:46, T:d2r3a:44], ver: n/a, topics: [images, video],
   rel: [{type: extends, to: D1-C116}],
   text: "Gary Illyes said images and videos drive a large amount of traffic to publishers."}
- {id: D2-C524, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:46, T:t08:48, T:d2r3a:44, T:d2r3a:46], ver: consistent, src: [image-seo], topics: [images, indexing-pipeline],
   rel: [{type: repeats, to: D2-C447}],
   text: "Google extracts images and videos from the page's document object model (DOM), and finds images with a fairly standard HTML parser that looks for img elements."}
- {id: D2-C525, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:47, T:d2r3a:45], ver: consistent, src: [image-seo], topics: [images],
   rel: [{type: extends, to: D1-C116}, {type: extends, to: D1-C117}],
   text: "An image Google has extracted can appear almost anywhere Google shows results, including Discover, image search, web search and AI features, so its potential reach is immense."}
- {id: D2-C526, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:49, T:d2r3a:47], ver: consistent, src: [image-seo], topics: [images],
   text: "Google supports the picture element only because a picture element must contain an img element, and that img element is what Google extracts and passes to its media indexer."}
- {id: D2-C527, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:50, T:t08:55, T:d2r3a:48], ver: consistent, src: [image-seo], topics: [images],
   text: "One of the most reliable ways to make sure Google finds an image is to include it in an img element in the HTML; Gary Illyes named image sitemaps as the other method."}
- {id: D2-C528, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:50, T:d2r3a:48], ver: confirmed, src: [image-seo], topics: [images],
   text: "Google does not extract CSS background images.",
   quote: "we don't support CSS background extraction"}
- {id: D2-C826, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:50, T:d2r3a:48], ver: undocumented, topics: [images, crawl-directives],
   text: "Gary Illyes suggested a div with a CSS background image as a way to keep an image from being picked up by Google."}
- {id: D2-C529, s: D2-S13, label: docs, ev: "", ver: source, src: [remove-images], topics: [images, crawl-directives],
   text: "Google's documented ways to keep a site's images out of search results are a robots.txt disallow rule (for example for Googlebot-Image) or a noindex X-Robots-Tag HTTP header, with the Removals tool for emergencies."}
- {id: D2-C530, s: D2-S13, label: analysis, ev: "", ver: n/a, src: [remove-images, image-seo], topics: [images, crawl-directives],
   text: "Hiding an image as a CSS background is a fragile way to keep it out of Google: it only stops extraction from that page, so the same image URL used in an img element elsewhere or listed in a sitemap can still be indexed; the documented robots.txt or noindex X-Robots-Tag methods are the reliable route."}
- {id: D2-C531, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:51, T:d2r3a:49], ver: undocumented, topics: [images],
   text: "Of the attributes the HTML standard defines for the img element, Google uses three and ignores the rest; Gary Illyes named src and alt but not the third."}
- {id: D2-C532, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:51, T:d2r3a:49], ver: consistent, src: [image-seo], topics: [images],
   text: "The src attribute is the most important img attribute, because without it Google does not know where the image bytes are and cannot index the image."}
- {id: D2-C533, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:52, T:d2r3a:50], ver: undocumented, topics: [images],
   text: "Gary Illyes ranked the alt attribute below src in importance, while saying alt attributes are still important."}
- {id: D2-C534, s: D2-S13, label: docs, ev: "", ver: source, src: [image-seo], topics: [images, accessibility],
   text: "Google's image SEO guide calls alt text the most important attribute for providing more metadata about an image, and says Google uses it together with computer vision and the page content to understand the image.",
   quote: "The most important attribute when it comes to providing more metadata for an image is the alt text"}
- {id: D2-C535, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:53, T:d2r3a:51], ver: confirmed, src: [image-seo], topics: [images, accessibility],
   text: "Alt text should describe the image in words for someone who cannot see it."}
- {id: D2-C536, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:53, T:d2r3a:51], ver: consistent, src: [image-seo], topics: [images],
   text: "Google uses the words in an alt attribute to understand the image, may attach them to the image at serving time, and the image can rank for concepts the alt text describes."}
- {id: D2-C537, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:54, T:d2r3a:52], ver: consistent, src: [image-seo], topics: [images, ranking-signals-by-vertical],
   rel: [{type: repeats, to: D1-C045}],
   text: "The text around an image is critical: Google uses it as context to understand the image and to rank it, so an alt attribute alone is not enough."}
- {id: D2-C538, s: D2-S13, label: analysis, ev: "", ver: n/a, topics: [images],
   text: "Images that should rank need an img element with a real src; hero or product images set as CSS backgrounds are invisible to Google Images and image features, so keep CSS backgrounds for decorative images you do not need indexed."}
- {id: D2-C539, s: D2-S13, label: analysis, ev: "", ver: n/a, topics: [images, accessibility],
   text: "Give important images a caption or explanatory sentence next to them rather than relying on alt text alone, since Gary Illyes ranked src above alt and called the surrounding text critical for ranking the image."}
- {id: D2-C540, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:55, T:d2r3a:53], ver: confirmed, src: [image-sitemaps], topics: [sitemaps, images],
   text: "Besides img elements, image sitemaps tell Google about images: they are XML sitemaps that list, under a page's loc entry, the locations of the images on that page."}
- {id: D2-C541, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:56, T:d2r3a:54], ver: confirmed, src: [image-seo], topics: [images],
   text: "Google supports pretty much all of the most popular image formats on the web."}
- {id: D2-C542, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:56, T:d2r3a:54], ver: undocumented, topics: [images],
   text: "Gary Illyes said the AVIF image format currently has hiccups and Google may have problems ingesting it, although it should technically be supported."}
- {id: D2-C543, s: D2-S13, label: docs, ev: "", ver: source, src: [image-seo, avif-blog], topics: [images],
   text: "Google's image SEO guide lists AVIF among the supported image formats (with BMP, GIF, JPEG, PNG, WebP and SVG), and Google announced in August 2024 that AVIF files need nothing special to be indexed."}
- {id: D2-C544, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:56, T:d2r3a:54], ver: consistent, src: [image-seo], topics: [images],
   text: "Use high-quality modern image formats such as WebP for a good balance of quality and compression, and keep image files small so people can enjoy them."}
- {id: D2-C545, s: D2-S13, label: analysis, ev: "", ver: n/a, src: [image-seo, avif-blog], topics: [images],
   text: "While the AVIF ingestion hiccup Gary Illyes mentioned lasts, serve AVIF only through source elements inside picture and keep a WebP or JPEG file in the img src, which is the URL Google extracts, even though Google's documentation lists AVIF as supported; then check in Google Images that key images appear."}
- {id: D2-C546, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:57, T:d2r3a:55], ver: undocumented, topics: [video],
   text: "Gary Illyes cited a figure that more than 40% of Southeast Asian shoppers rely on videos to make purchase decisions."}
- {id: D2-C547, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:57, T:d2r3a:55], ver: undocumented, topics: [video],
   text: "Gary Illyes said over 219 million people in Southeast Asia consume content on or through YouTube daily (the daily scope was heard in two independent recordings but is not verified)."}
- {id: D2-C548, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:57, T:d2r3a:55], ver: undocumented, topics: [video],
   text: "Gary Illyes said there are over 150 streaming apps in Southeast Asia."}
- {id: D2-C549, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:58, T:d2r3a:56], ver: consistent, src: [video-seo], topics: [video],
   text: "Videos can appear in the main search results, in video-specific result tabs and in Discover (the tab names are unclear in the recording)."}
- {id: D2-C550, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:58, T:d2r3a:56], ver: confirmed, src: [video-seo], topics: [video],
   text: "Google has video-specific features, such as key moments and previews, that help users interact with videos more easily."}
- {id: D2-C551, s: D2-S13, label: stage, who: Gary Illyes, ev: [T:t08:59, T:d2r3a:57], ver: consistent, src: [video-seo, intro-structured-data], topics: [video, structured-data-implementation],
   text: "Google strongly suggests describing a video's metadata with JSON-LD structured data, on top of placing the video in an HTML element on the page."}
- {id: D2-C552, s: D2-S13, label: slide, who: Gary Illyes, ev: [IMG_4761, T:t08:60, T:d2r3a:58], ver: consistent, src: [video-seo], topics: [video],
   text: "Google's slide listed seven key factors for video SEO success: high-quality video content, a dedicated watch page, compelling titles and descriptions, relevant thumbnails, video markup, fast-loading pages and sitemap inclusion."}
- {id: D2-C553, s: D2-S13, label: slide, who: Gary Illyes, ev: [IMG_4761, T:d2r3a:59], ver: consistent, src: [video-seo], topics: [video],
   text: "Google's video SEO slide said each video must be on its own dedicated HTML watch page."}
- {id: D2-C554, s: D2-S13, label: docs, ev: "", ver: source, src: [video-seo], topics: [video],
   text: "Google's video SEO guide says a video must be embedded on an indexed watch page to be eligible for video features and recommends a dedicated watch page per video where it makes sense for the business; a non-watch page with the video can still appear as a text result or a Google Images result with a video badge."}
- {id: D2-C555, s: D2-S13, label: slide, who: Gary Illyes, ev: IMG_4761, ver: consistent, src: [gen-ai-content-guide], topics: [video, helpful-content],
   text: "Google's video SEO slide warned that spending money on a generative AI subscription does not mean AI-generated videos will do well, because engaging, informative, well-produced content is foundational.",
   quote: "just because you spent money on a genAI subscription, that does not mean you are going to do well with AI generated videos", quote_checked: true}
- {id: D2-C556, s: D2-S13, label: slide, who: Gary Illyes, ev: [IMG_4761, T:d2r3a:66], ver: confirmed, src: [video-sitemaps, video-seo], topics: [sitemaps, video],
   text: "Including videos in a sitemap helps Google discover all of a site's video content."}
- {id: D2-C557, s: D2-S13, label: analysis, ev: "", ver: n/a, topics: [video, structured-data-implementation, sitemaps],
   text: "Give each important video its own watch page where the video is the main content, add VideoObject markup and list the video in a video sitemap; a video buried in a long article lacks the dedicated watch page that Google listed as a key factor."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D2-C916, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:59, ver: confirmed, src: [video-indexing-report, video-seo], topics: [video],
   text: "Gary Illyes said a video without a dedicated watch page is not going to be indexed."}
- {id: D2-C917, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:61, ver: undocumented, topics: [video],
   text: "Google knows from experiments that when a video's thumbnail is wrong, the share of viewers who drop out at the start of the video is extremely high."}
- {id: D2-C918, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:62, ver: consistent, src: [video-seo, video-indexing-report], topics: [video],
   text: "Gary Illyes called a video container in the page's HTML critical: without one, Google treats the page as having no video."}
- {id: D2-C919, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:63, ver: undocumented, topics: [video],
   text: "Gary Illyes called the 'fast-loading pages' factor for video SEO a misnomer: what matters is that the video itself loads fast, because people no longer have the patience to wait for videos to load."}
- {id: D2-C920, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:63, ver: undocumented, topics: [video],
   text: "Serving videos from a content delivery network (CDN) that loads them faster than the site's own server is a win for video SEO, Gary Illyes said."}
- {id: D2-C921, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:64, ver: confirmed, src: [video-seo], topics: [video],
   text: "Google supports the most popular video file formats on the web."}
- {id: D2-C922, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:64, ver: undocumented, topics: [video],
   text: "Google recommends the MP4 container for videos because of its browser and device compatibility."}
- {id: D2-C923, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:64, ver: undocumented, topics: [video],
   text: "Encode videos with standard codecs, because some people will not be able to play videos that use unusual ones."}
- {id: D2-C924, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:65, ver: undocumented, topics: [video],
   text: "For a video to be discovered it must be embedded prominently, above the fold; Gary Illyes said a video placed below the fold is not going to be indexed.",
   quote: "If it's not above the fold, then you basically lost the game."}
- {id: D2-C925, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:66, ver: undocumented, topics: [sitemaps, video],
   text: "Video sitemaps are not critical but good to have, because Google ingests video sitemaps much more often than it can process HTML pages."}
- {id: D2-C926, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:66, ver: consistent, src: [video-sitemaps], topics: [sitemaps, video, url-discovery],
   text: "A video sitemap or video feed tells Google which URLs carry videos so it can visit those URLs to double-check; without one, Google has to check every page individually."}
- {id: D2-C927, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:67, ver: undocumented, topics: [video, retrieval],
   text: "Descriptive text around a video helps Google rank and retrieve the video."}
- {id: D2-C928, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:67, ver: consistent, src: [video-seo], topics: [video],
   text: "Gary Illyes suggested considering video hosting platforms such as YouTube or Vimeo, because they solved video search years ago."}
- {id: D2-C929, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:68, ver: undocumented, topics: [video],
   text: "The more people talk about a site's videos, the more likely Google is to surface them in search results, so videos should be promoted."}
- {id: D2-C930, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:69, ver: undocumented, topics: [indexing-pipeline, images, video],
   rel: [{type: extends, to: D2-C448}],
   text: "Google's media indexer processes the images and videos that feature extraction passes to it and attaches them to the URL of the page that hosts them."}
- {id: D2-C931, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:70, ver: confirmed, src: [common-crawlers], topics: [robots-txt, images, video],
   text: "Googlebot-Image and Googlebot-Video are the Google crawlers that fetch images and videos, and robots.txt rules addressed to their user agent tokens control how Google indexes a site's images and videos."}
- {id: D2-C932, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:70, ver: confirmed, src: [remove-images, video-seo], topics: [robots-txt, crawl-directives, images, video],
   text: "If robots.txt disallows the location of an image or video file, Google does not index that image or video."}
- {id: D2-C933, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:70, ver: undocumented, topics: [robots-txt, crawl-directives, video],
   rel: [{type: extends, to: D2-C021}],
   text: "Unlike a disallowed web page, whose bare URL can still appear in web results, a video blocked by robots.txt is not shown by its URL, because Google sees no good reason to show a video URL alone."}
- {id: D2-C934, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:71, ver: confirmed, src: [robots-meta-tag-spec], topics: [robots-meta-tag, images],
   rel: [{type: repeats, to: D2-C099}],
   text: "The noimageindex robots meta tag tells Google not to index the images on the page."}
- {id: D2-C935, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:71, ver: undocumented, topics: [robots-meta-tag, video, images],
   text: "Gary Illyes said noimageindex also affects videos on the page, because Google has to index a video's thumbnail, which is an image."}
- {id: D2-C936, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:72, ver: consistent, src: [google-discover, robots-meta-tag-spec], topics: [snippet-controls, discover, images],
   rel: [{type: repeats, to: D2-C089}],
   text: "Setting the max-image-preview robots meta tag to large can make content perform surprisingly well in Discover, Gary Illyes said."}
- {id: D2-C937, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:73, ver: consistent, src: [gen-ai-content-guide], topics: [ai-content-detection, images],
   text: "To the frequent question about AI-generated images on a site, Google's answer is that it is up to the site owner."}
- {id: D2-C938, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:73, ver: undocumented, topics: [ai-content-detection, images, video],
   text: "Google serves AI-generated images and videos in search results when users are specifically looking for them.",
   quote: "We will serve users AI-generated images and videos in search results if they are looking for them specifically."}
- {id: D2-C939, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:74, ver: undocumented, topics: [ai-in-search-systems, images],
   text: "The diffusion models that generate images were built to generate images, not text, so they are typically poor at rendering text inside an image."}
- {id: D2-C940, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:74, ver: n/a, topics: [ai-content-detection, images],
   text: "Gary Illyes showed a timeline image that Google made with an image generation model in 2025 and deliberately left unfixed as a counterexample: its text was garbled and its years jumped from 1994 to 1995 and back to 1994."}
- {id: D2-C941, s: D2-S13, label: stage, who: Gary Illyes, ev: T:d2r3a:75, ver: consistent, src: [gen-ai-content-guide], topics: [ai-content-detection, images, helpful-content],
   text: "Sites that use AI-generated images or videos should make sure they work for users, check them for hallucinations and regenerate them where needed."}
- {id: D2-C942, s: D2-S13, label: docs, ev: "", ver: source, src: [video-indexing-report], topics: [video],
   text: "Google's Video indexing report help says only videos on a watch page are eligible for indexing, and flags 'Cannot determine video position and size' when the player is not on the page at load, for example behind a click-to-play image, asking for the player to load at its real size and position without user interaction."}
- {id: D2-C943, s: D2-S13, label: docs, ev: "", ver: source, src: [image-metadata], topics: [images, ai-content-detection],
   text: "Google's image metadata guide says Google Images supports the IPTC Digital Source Type values for algorithmically created images, such as trainedAlgorithmicMedia, and can show C2PA details in 'About this image', such as whether an image was created or edited with AI tools."}
- {id: D2-C944, s: D2-S13, label: analysis, ev: "", ver: n/a, src: [video-seo, video-indexing-report], topics: [video],
   text: "Gary Illyes said a video below the fold is not indexed, but Google's video documentation only requires the player to be present at load, at a position and size Google can determine and not hidden behind other elements; to be safe, put the main video of a watch page in the first viewport and load the player without a click-to-play placeholder."}
- {id: D2-C945, s: D2-S13, label: analysis, ev: "", ver: n/a, src: [robots-meta-tag-spec, video-indexing-report], topics: [robots-meta-tag, video],
   text: "Do not set noimageindex on video watch pages: Gary Illyes said it also stops the video, through its thumbnail, and although the robots meta tag specification mentions only images, the Video indexing report treats a missing or blocked thumbnail as a reason a video is not indexed."}

# ---------- D2-S14 Lightning session F: Media ----------
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D2-C946, s: D2-S14, label: stage, who: unknown, ev: T:d2r3b:1, ver: undocumented, topics: [images, accessibility],
   text: "Version 20 of the Screaming Frog SEO Spider, released in May 2024, was the first that could connect the crawler to ChatGPT through custom JavaScript, which let SEOs rewrite image alt text at scale."}
- {id: D2-C947, s: D2-S14, label: stage, who: unknown, ev: T:d2r3b:2, ver: n/a, topics: [images, accessibility],
   rel: [{type: extends, to: D2-C462}],
   text: "In a community speaker's case, an LLM asked to write alt text for a product image of a veterinary anxiety medicine for cats described only what it could see, a cat and a veterinarian, and dropped the stress, anxiety and medical-treatment intent of the page."}
- {id: D2-C948, s: D2-S14, label: stage, who: unknown, ev: T:d2r3b:3, ver: n/a, topics: [images, measurement],
   text: "After shipping LLM-rewritten image alt text on a client's site, a community speaker saw the site's image performance in Google Search Console drop (no figures were given)."}
- {id: D2-C949, s: D2-S14, label: stage, who: unknown, ev: T:d2r3b:4, ver: undocumented, topics: [images, accessibility],
   text: "To test LLM-generated alt text before a rollout, a community speaker recommended running the crawler's custom JavaScript in Screaming Frog's List mode on a few chosen URLs and reviewing the generated alt text, instead of crawling the whole site in Spider mode."}
- {id: D2-C950, s: D2-S14, label: stage, who: unknown, ev: [T:d2r3b:5, T:d2r3b:6, T:d2r3b:7], ver: consistent, src: [image-seo], topics: [images, accessibility],
   rel: [{type: extends, to: D2-C537}],
   text: "Because not every generated alt text can be checked by hand, a community speaker's safer script adds the page title to the LLM's image description, so the alt text carries the page's intent and not only what the image shows."}
- {id: D2-C951, s: D2-S14, label: stage, who: unknown, ev: T:d2r3b:7, ver: n/a, topics: [images],
   text: "A community speaker named the limits of the title-based alt-text script: it rewrites only the hero image, assumes the page title states the user's intent, had been tested in only one language or market, and runs on the free Gemini model."}
- {id: D2-C952, s: D2-S14, label: stage, who: unknown, ev: T:d2r3b:8, ver: n/a, topics: [images, helpful-content],
   rel: [{type: extends, to: D2-C462}],
   text: "A community speaker warned that articles still recommend rewriting alt text with AI, called AI a tool, and said that adopting such new AI implementations without applying existing SEO knowledge can damage ranking performance."}
- {id: D2-C953, s: D2-S14, label: stage, who: Patrick Domanico, ev: T:d2r3b:9, ver: n/a, topics: [ai-in-seo-workflows, video],
   text: "A community talk described 'prompt journalism' as journalistic and content work, such as interviews and podcasts, done with a prompt-assisted workflow whose aim is to optimize material already recorded, which holds expertise, quotes and context, rather than to create more content."}
- {id: D2-C954, s: D2-S14, label: stage, who: Patrick Domanico, ev: [T:d2r3b:10, T:d2r3b:11], ver: n/a, topics: [ai-in-seo-workflows],
   text: "The first step of a community speaker's prompt-assisted workflow is cleaning the interview transcript of fillers, a step that needs editorial and SEO judgment because a published page is read by many systems whose way of consuming it is unknown."}
- {id: D2-C955, s: D2-S14, label: stage, who: Patrick Domanico, ev: T:d2r3b:10, ver: undocumented, topics: [ai-in-seo-workflows, accessibility],
   text: "A community speaker cited W3C guidance that, when cleaning a transcript, it is usually not appropriate to correct the speaker's grammar or other mistakes."}
- {id: D2-C956, s: D2-S14, label: stage, who: Patrick Domanico, ev: [T:d2r3b:12, T:d2r3b:13], ver: n/a, topics: [ai-in-seo-workflows, video],
   text: "In the mapping step of a prompt-assisted workflow, an AI system splits an interview transcript into chapters with timestamps, headings and entities; in a community speaker's example it correctly extracted the subsea cables 2Africa and Equiano from a passage on Internet infrastructure in Africa."}
- {id: D2-C957, s: D2-S14, label: stage, who: Patrick Domanico, ev: T:d2r3b:13, ver: n/a, topics: [structured-data, ai-in-seo-workflows],
   text: "A community speaker said the chapters and entities extracted from an interview transcript can then be used to generate metadata and structured data for the published content."}
- {id: D2-C958, s: D2-S14, label: stage, who: Patrick Domanico, ev: T:d2r3b:14, ver: n/a, topics: [ai-in-seo-workflows],
   text: "The second step of the prompt-assisted workflow applies the newsroom's inverted pyramid (the five Ws and H first, then attribution and quotes, context and secondary text); because it is a fixed structure, it can be written as a prompt that generates the article."}
- {id: D2-C959, s: D2-S14, label: stage, who: Patrick Domanico, ev: T:d2r3b:15, ver: n/a, topics: [ai-in-seo-workflows],
   text: "From one unified interview transcript, a community speaker's workflow produces a full article for the website and shorter angles for LinkedIn, Substack, X and YouTube."}
- {id: D2-C960, s: D2-S14, label: stage, who: Patrick Domanico, ev: T:d2r3b:15, ver: confirmed, src: [social-video-guide], topics: [search-console-features, measurement],
   text: "A community speaker said publishers can also verify their social accounts in Search Console, which makes it easier to track the performance of content repurposed for social platforms."}

# ---------- D2-S15 Focusing on Internationalisation and Localisation ----------
# ----- Talk structure -----
# ----- Multilingual sites: language versions and hreflang -----
- {id: D2-C559, s: D2-S15, label: stage, ev: [T:t09ab:3, T:d2r3b:17], ver: confirmed, src: [localized-versions], topics: [page-language, hreflang],
   text: "Google may find a site's different language versions on its own, without the site owner doing anything, but owners can take steps to make this easier for Google."}
- {id: D2-C560, s: D2-S15, label: stage, ev: [T:t09ab:4, T:d2r3b:18], ver: confirmed, src: [multi-regional-sites, locale-adaptive-pages], topics: [page-language, hreflang],
   text: "Each language version should have its own URL; switching languages with cookies or by updating the content in place makes the versions very difficult for Google to handle."}
- {id: D2-C561, s: D2-S15, label: docs, ev: "", ver: source, src: [locale-adaptive-pages, multi-regional-sites], topics: [page-language, geotargeting],
   text: "Google's documentation says Googlebot mostly crawls from US IP addresses and sends no Accept-Language header, so pages that change content or redirect by the visitor's perceived country or language may not have every version crawled, indexed or ranked; it recommends separate URLs annotated with hreflang."}
- {id: D2-C562, s: D2-S15, label: slide, ev: [IMG_4762, T:t09ab:5, T:d2r3b:19], ver: confirmed, src: [localized-versions], topics: [hreflang, page-language],
   text: "Language versions can also be language-plus-region variants: Google's example site had a generic English page (en), a UK English page (en-gb) and a Spanish page (es), each on its own URL."}
- {id: D2-C563, s: D2-S15, label: docs, ev: "", ver: source, src: [localized-versions], topics: [hreflang, geotargeting],
   text: "Google's hreflang guide says language-specific subdomains such as en, en-gb or de in a URL are not used to determine a page's target audience; site owners must map the audience explicitly, for example with hreflang."}
- {id: D2-C564, s: D2-S15, label: slide, ev: [IMG_4762, T:t09ab:6, T:d2r3b:20], ver: confirmed, src: [localized-versions], topics: [hreflang],
   text: "Google's hreflang example lists every language version in the page's HTML head as a link element with rel=alternate, the version's full URL and its hreflang code (en, en-gb, es), including the page's own URL."}
- {id: D2-C565, s: D2-S15, label: slide, ev: [IMG_4764, T:t09ab:6, T:t09ab:8, T:d2r3b:20, T:d2r3b:22], ver: confirmed, src: [localized-versions], topics: [hreflang],
   text: "Missing return links are a common hreflang mistake: if page X names page Y as a language version, page Y must link back to page X.",
   quote: "If page X links to page Y, page Y must link back to page X.", quote_checked: true}
- {id: D2-C566, s: D2-S15, label: stage, ev: [T:t09ab:6, T:d2r3b:20], ver: consistent, src: [localized-versions], topics: [hreflang],
   text: "Each page in an hreflang set must also list its own URL, and a missing self-reference is a common mistake Google sees."}
- {id: D2-C567, s: D2-S15, label: stage, ev: [T:t09ab:7, T:d2r3b:21], ver: confirmed, src: [localized-versions], topics: [hreflang, sitemaps],
   text: "When the HTML head is not suitable for a page, hreflang can be given by other methods instead, such as listing the language versions in a sitemap."}
- {id: D2-C568, s: D2-S15, label: stage, ev: [T:t09ab:7, T:d2r3b:21], ver: consistent, src: [localized-versions], topics: [hreflang],
   text: "Any one hreflang method is fine, but a site should use only one: Google often sees sites using two or three methods at the same time, with annotations that conflict."}
- {id: D2-C569, s: D2-S15, label: docs, ev: "", ver: source, src: [localized-versions], topics: [hreflang, sitemaps],
   text: "Google's hreflang guide says its three methods (link elements in the HTML head, an HTTP Link header, which suits non-HTML files such as PDFs, and an XML sitemap) are equivalent; using several at once is allowed but brings no benefit in Search and is harder to manage."}
- {id: D2-C570, s: D2-S15, label: stage, ev: [T:t09ab:8, T:d2r3b:22], ver: confirmed, src: [localized-versions], topics: [hreflang],
   text: "Google ignores hreflang annotations that point only one way, where page A names page B as a language version but page B does not name page A back."}
- {id: D2-C571, s: D2-S15, label: docs, ev: "", ver: source, src: [localized-versions], topics: [hreflang],
   text: "Google's hreflang guide says a site that finds it hard to keep every language pair bidirectional may omit some languages on some pages, because Google still processes the pairs that point to each other; new language versions should at least link both ways with the original or dominant language."}
- {id: D2-C572, s: D2-S15, label: stage, ev: [T:t09ab:8, T:d2r3b:22], ver: confirmed, src: [localized-versions], topics: [hreflang],
   text: "Google requires hreflang return links because an alternate URL is a full URL that can be on any domain, so without them any site could declare itself a language version of someone else's website."}
- {id: D2-C573, s: D2-S15, label: docs, ev: "", ver: source, src: [localized-versions], topics: [hreflang],
   text: "Google's hreflang guide says alternate URLs must be fully qualified, including the protocol (https://example.com/foo, not //example.com/foo or /foo), and need not be on the same domain."}
- {id: D2-C574, s: D2-S15, label: analysis, ev: "", ver: n/a, topics: [hreflang],
   text: "Audit hreflang per cluster rather than per page: check that every page lists itself and all its alternates, that every alternate links back, and that only one method (HTML head, HTTP header or sitemap) supplies the annotations."}
# ----- Language and region codes -----
- {id: D2-C575, s: D2-S15, label: slide, ev: [IMG_4764, T:t09ab:9, T:t09ab:10, T:d2r3b:23], ver: consistent, src: [localized-versions], topics: [hreflang],
   text: "hreflang language codes must be ISO 639-1 codes: Google's list of common mistakes marked se, dk and cz (the country codes of Sweden, Denmark and Czechia) as wrong and sv, da and cs (Swedish, Danish, Czech) as right."}
- {id: D2-C576, s: D2-S15, label: stage, ev: [T:t09ab:9, IMG_4764, T:d2r3b:23], ver: consistent, src: [localized-versions], topics: [hreflang],
   text: "Swedish content for Sweden is marked sv-SE, not se-SE: the language part must be the Swedish language code sv, even though Sweden's country code is SE."}
- {id: D2-C577, s: D2-S15, label: stage, ev: [T:t09ab:9, T:d2r3b:23], ver: consistent, src: [localized-versions], topics: [hreflang],
   text: "Site owners do not need to memorise hreflang language and region codes, but should double-check every code when implementing hreflang."}
- {id: D2-C578, s: D2-S15, label: stage, ev: [T:t09ab:10, IMG_4764, T:d2r3b:24], ver: consistent, src: [localized-versions], topics: [hreflang],
   text: "Czech is a frequent hreflang error: CZ is the country code and ccTLD of Czechia, but the language code for Czech is cs."}
- {id: D2-C579, s: D2-S15, label: slide, ev: [IMG_4764, T:t09ab:11, T:d2r3b:24], ver: consistent, src: [localized-versions], topics: [hreflang, geotargeting],
   text: "hreflang region codes must be ISO 3166-1 Alpha-2 country codes; frequent mistakes are UK instead of GB for the United Kingdom, SW instead of CH for Switzerland and GE instead of DE for Germany."}
- {id: D2-C580, s: D2-S15, label: slide, ev: [IMG_4764, T:t09ab:11, T:d2r3b:24], ver: confirmed, src: [localized-versions], topics: [hreflang, geotargeting],
   text: "EU is not a valid hreflang region code: sites use it hoping to target the European Union, but hreflang targeting works only by country."}
- {id: D2-C581, s: D2-S15, label: slide, ev: [IMG_4764, T:t09ab:11, T:d2r3b:24], ver: consistent, src: [localized-versions], topics: [hreflang, geotargeting],
   text: "Google also flagged LA used as a region code for Los Angeles (a city, not a country) and SA used for South Africa as wrong hreflang region codes."}
- {id: D2-C582, s: D2-S15, label: slide, ev: [IMG_4764, T:t09ab:12, T:d2r3b:25], ver: confirmed, src: [localized-versions], topics: [hreflang],
   text: "A region code cannot be used on its own in hreflang: en and en-GB are valid values, but GB alone is not, because the value must name a language."}
- {id: D2-C583, s: D2-S15, label: analysis, ev: "", ver: n/a, src: [localized-versions], topics: [hreflang],
   text: "Validate hreflang values against the ISO 639-1 and ISO 3166-1 Alpha-2 lists in a crawler rule or build check rather than by eye: reserved codes such as UK and EU are simply ignored, but some plausible mistakes are valid codes for something else (se is Northern Sami, GE Georgia, LA Laos, SA Saudi Arabia) and silently point the annotation at the wrong audience."}
# ----- How Google determines page language -----
- {id: D2-C584, s: D2-S15, label: stage, ev: [T:t09ab:13, T:d2r3b:26], ver: confirmed, src: [localized-versions], topics: [page-language, hreflang],
   text: "Google does not use hreflang to determine a page's language when indexing the page."}
- {id: D2-C585, s: D2-S15, label: stage, ev: [T:t09ab:14, T:d2r3b:26], ver: confirmed, src: [multi-regional-sites, localized-versions], topics: [page-language],
   text: "Google determines a page's language for indexing from the page content, not from a language code in the URL."}
- {id: D2-C586, s: D2-S15, label: stage, ev: [T:t09ab:15, T:d2r3b:27], ver: undocumented, topics: [page-language, indexing-signals],
   text: "Google annotates each page with only one language in the index."}
- {id: D2-C587, s: D2-S15, label: stage, ev: [T:t09ab:15, T:d2r3b:27], ver: confirmed, src: [multi-regional-sites, results-language-help], topics: [page-language],
   text: "Pages that mix several languages make it very hard for Google to decide which language a page is in, so each page should make its target language obvious and avoid mixing languages."}
- {id: D2-C588, s: D2-S15, label: stage, ev: [T:t09ab:15, T:d2r3b:27], ver: consistent, src: [multi-regional-sites], topics: [page-language],
   text: "Scattered boilerplate in a second language is sometimes fine but still not recommended, partly because mixed languages on one page are odd for users."}
- {id: D2-C589, s: D2-S15, label: docs, ev: "", ver: source, src: [localized-versions], topics: [hreflang, page-language, main-content],
   text: "Google's hreflang guide says pages that translate only the template (navigation, footer) around main content in one language still count as duplicates, because localized versions are duplicates only if the main content stays untranslated; it recommends hreflang for such pages."}
- {id: D2-C590, s: D2-S15, label: analysis, ev: "", ver: n/a, topics: [page-language, main-content],
   text: "Because Google reads a page's language from its content and stores one language per page, translate templates (navigation, footer, buttons, legal notices) together with the main text; large untranslated blocks risk the page being annotated with the wrong language."}
# ----- Targeting countries -----
- {id: D2-C591, s: D2-S15, label: stage, ev: [T:t09ab:16, T:t09ab:18, T:d2r3b:30], ver: consistent, src: [multi-regional-sites], topics: [geotargeting],
   text: "The ccTLD (country-code top-level domain) is one of the most important and strongest signals Google uses to decide which country a site targets; Google also considers other signals, which matter less."}
- {id: D2-C592, s: D2-S15, label: stage, ev: [T:t09ab:16, T:d2r3b:28], ver: undocumented, topics: [geotargeting],
   text: "Server location is not really a reliable country-targeting signal nowadays, so Google does not use it much; the recording is unclear on the word 'server'."}
- {id: D2-C982, s: D2-S15, label: analysis, ev: [T:t09ab:16, T:d2r3b:28], ver: n/a, src: [multi-regional-sites], topics: [geotargeting],
   rel: [{type: extends, to: D2-C591}],
   text: "At the point where one recording names the ccTLD as the most important country-targeting signal, a second attendee recording heard 'IP address' instead; Google's multi-regional sites documentation names the ccTLD as a strong signal of a site's target country and server location only as a possible, not definitive one, so the ccTLD is the better-supported reading."}
- {id: D2-C593, s: D2-S15, label: docs, ev: "", ver: source, src: [multi-regional-sites], topics: [geotargeting],
   text: "Google's documentation calls a ccTLD a strong signal that a site is meant for a certain country and still lists server location as a possible signal of a site's audience, though not a definitive one because sites use CDNs or are hosted abroad; it does not rank the signals."}
- {id: D2-C594, s: D2-S15, label: stage, ev: [T:t09ab:17, T:d2r3b:29], ver: consistent, src: [multi-regional-sites], topics: [geotargeting],
   text: "For country versions of a site, a ccTLD, subdomains or subdirectories are all acceptable choices; the right one depends on the site's needs, goals and resources."}
- {id: D2-C595, s: D2-S15, label: docs, ev: "", ver: source, src: [multi-regional-sites], topics: [geotargeting],
   text: "Google's table of URL structures for country targeting gives pros and cons for a country-specific domain (example.de), a subdomain (de.example.com) and a subdirectory (example.com/de/) on a generic domain, and marks URL parameters (site.com?loc=de) as not recommended."}
- {id: D2-C822, s: D2-S15, label: stage, ev: [T:t09ab:17, T:d2r3b:29], ver: consistent, src: [multi-regional-sites], topics: [geotargeting],
   rel: [{type: extends, to: D2-C594}],
   text: "Of the URL structures for country versions in a table on Google's slide (not photographed), the speaker called only one a wrong choice: the last option, which the speaker did not name but said they really do not recommend."}
- {id: D2-C596, s: D2-S15, label: stage, ev: [T:t09ab:18, T:d2r3b:30], ver: consistent, src: [multi-regional-sites], topics: [geotargeting, site-moves],
   text: "A separate ccTLD for each country version is not necessarily better, even though the ccTLD is one of the strongest country signals, and sites should not move their domain for that reason.",
   quote: "Don't try to move your domain now."}
- {id: D2-C597, s: D2-S15, label: stage, ev: [T:t09ab:18, T:d2r3b:30], ver: consistent, src: [multi-regional-sites], topics: [geotargeting],
   text: "Whether to use ccTLDs depends on whether the domain can be obtained, what it costs, local laws or regulations, and how committed the business is to expanding in that country."}
- {id: D2-C598, s: D2-S15, label: analysis, ev: "", ver: n/a, topics: [geotargeting],
   text: "For a business testing new countries, subdirectories on the existing domain are usually the cheapest start; a ccTLD's stronger country signal pays off only where domain availability, cost, local rules and long-term commitment justify it, and an established domain should not be moved just for the signal."}
# ----- Common questions -----
- {id: D2-C599, s: D2-S15, label: stage, ev: [T:t09ab:19, T:d2r3b:31], ver: undocumented, topics: [non-latin-scripts],
   text: "Google usually understands non-English words typed 'in English' (probably meaning romanised, Latin-letter spellings, which the speaker did not spell out); the speaker said this belongs to query interpretation, a Day 3 (serving) subject."}
- {id: D2-C600, s: D2-S15, label: stage, ev: [T:t09ab:19, T:d2r3b:31], ver: consistent, src: [accented-characters-blog], topics: [non-latin-scripts],
   text: "Google usually understands a query word whether it is written with or without diacritics (accents)."}
- {id: D2-C601, s: D2-S15, label: stage, ev: [T:t09ab:20, T:d2r3b:32], ver: confirmed, src: [ai-features-guide, ai-optimization-guide], topics: [seo-vs-geo],
   rel: [{type: repeats, to: D1-C050}, {type: repeats, to: D1-C051}, {type: extends, to: D2-C116}],
   text: "Sites need no extra work to appear in AI Overviews and AI Mode: both work on top of the existing web results, so what works for web results also works for the AI features."}
# ----- The language gap in AI answers -----
- {id: D2-C602, s: D2-S15, label: stage, ev: [T:t09ab:21, T:t09ab:22, T:d2r3b:33, T:d2r3b:34], ver: n/a, topics: [localisation, seo-vs-geo],
   text: "In classic results users can usually tell when content in their language is missing, poorly translated or from another country, but AI answers synthesize many sources and hide this; the speaker called it an invisible gap.",
   quote: "an invisible gap"}
- {id: D2-C603, s: D2-S15, label: stage, ev: [T:t09ab:22, T:d2r3b:34], ver: consistent, src: [ai-optimization-guide, results-language-help], topics: [localisation, seo-vs-geo],
   rel: [{type: extends, to: D1-C038}],
   text: "Users often assume AI is all-knowing and borderless, but AI is still language-dependent: if an AI answer is synthesized from the top results, a query in another language draws on a totally different set of data.",
   quote: "AI is still language-dependent"}
- {id: D2-C604, s: D2-S15, label: docs, ev: "", ver: source, src: [results-language-help], topics: [page-language, localisation],
   text: "Google's Search Help says the language a query is typed in is an important factor in choosing the language of results, alongside interface and device language, location and site owners' annotations, and that Google may also show results in other languages when they are helpful or when there is not enough information in the query's language."}
- {id: D2-C605, s: D2-S15, label: stage, ev: [T:t09ab:22, T:t09ab:23, T:d2r3b:34, T:d2r3b:35], ver: n/a, topics: [localisation],
   text: "In the speaker's own experience, the differences between languages are larger in AI answers than in classic search results."}
- {id: D2-C606, s: D2-S15, label: stage, ev: [T:t09ab:23, T:d2r3b:35], ver: consistent, src: [genai-perf-reports-blog], topics: [localisation, seo-vs-geo],
   text: "Site owners may want to research whether they show up in AI answers in each language and market they serve, to find blind spots."}
- {id: D2-C607, s: D2-S15, label: analysis, ev: "", ver: n/a, src: [genai-perf-reports-blog], topics: [localisation, seo-vs-geo, measurement],
   rel: [{type: extends, to: D1-C124}],
   text: "Check AI Overviews and AI Mode with native-language queries in each target market, not with translated English keywords, and compare with the country breakdown of Search Console's generative AI performance report; topics where competitors are cited and you are not point to missing or weak local content."}
# ----- Machine translation and localisation -----
- {id: D2-C608, s: D2-S15, label: stage, ev: [T:t09ab:24, T:t09ab:27, T:t09ab:28, T:t09ab:31, T:d2r3b:36, T:d2r3b:41], ver: undocumented, topics: [localisation],
   text: "Whether machine-translated content is acceptable depends on the case and is the site owner's decision, after weighing three things machine translation can miss: translation quality, local conventions and cultural adaptation."}
- {id: D2-C609, s: D2-S15, label: stage, ev: [T:t09ab:25, T:t09ab:26, T:d2r3b:37], ver: n/a, topics: [localisation],
   text: "To show uneven machine-translation quality, the speaker showed Google Translate output of attendee questions from a visit to China with a Google colleague, Gary, some clear and some unintelligible, and a restaurant menu whose English listed an item called 'aggressive element'."}
- {id: D2-C610, s: D2-S15, label: stage, ev: [T:t09ab:27, T:d2r3b:38], ver: undocumented, topics: [localisation],
   text: "Localisation should account for local conventions such as date formats, which differ between Europe, the UK, the US and other countries, and calendars (in Thailand the current year is 2569), or a date can point users to the wrong day."}
- {id: D2-C611, s: D2-S15, label: docs, ev: "", ver: source, src: [spam-policies], topics: [spam-detection, localisation],
   text: "Google's spam policies define scaled content abuse as generating many pages mainly to manipulate rankings, with little or no value to users, no matter how they are created, and list automated translating of scraped content among the examples."}
- {id: D2-C612, s: D2-S15, label: analysis, ev: "", ver: n/a, topics: [localisation, spam-detection],
   rel: [{type: extends, to: D1-C048}],
   text: "Treat machine translation as a first draft: have a native speaker review it and adapt dates, calendars and units before publishing, because unreviewed bulk translation that adds little value can also fall under Google's scaled content abuse policy."}
- {id: D2-C613, s: D2-S15, label: stage, ev: [T:t09ab:28, T:d2r3b:39], ver: undocumented, topics: [localisation],
   text: "According to the speaker, shoppers in Europe and the US pay a lot of attention to promotions and discounts when deciding to buy (no source for this was captured), one of the cultural factors localisation should take into account."}
- {id: D2-C614, s: D2-S15, label: stage, ev: [T:t09ab:29, T:t09ab:30, T:d2r3b:40], ver: undocumented, topics: [localisation],
   text: "According to consumer data shown on a slide in the talk (source not captured), US consumers judge product quality more by user feedback and reviews, while European shoppers seem to look more at brand reputation."}
- {id: D2-C615, s: D2-S15, label: stage, ev: [T:t09ab:30, T:d2r3b:40], ver: undocumented, topics: [localisation],
   text: "According to consumer data shown on a slide in the talk (source not captured), German shoppers also rely heavily on expert recommendations and certifications when judging product quality."}
- {id: D2-C616, s: D2-S15, label: stage, ev: [T:t09ab:30, T:d2r3b:40], ver: undocumented, topics: [localisation],
   text: "According to consumer data shown on a slide in the talk (source not captured), French shoppers particularly want to know where a product comes from."}
- {id: D2-C617, s: D2-S15, label: analysis, ev: "", ver: n/a, topics: [localisation],
   text: "Localise the trust signals on product pages, not only the words: if the findings shown hold for your category, lead with reviews in the US, brand reputation elsewhere in Europe, expert certifications in Germany and origin information in France, and test the order per market."}
- {id: D2-C830, s: D2-S15, label: docs, ev: "", ver: source, src: [localized-versions], topics: [hreflang],
   text: "Google's hreflang guide says the ISO 639-1 language code can be followed by a script in ISO 15924 format, such as zh-Hant or zh-Hans, and by an optional ISO 3166-1 Alpha-2 region code, as in zh-Hans-US."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D2-C961, s: D2-S15, label: stage, ev: T:d2r3b:16, ver: n/a, topics: [page-language, geotargeting, localisation],
   text: "Google said that working out a site's localized pages and which countries it targets is one of the difficult, complex tasks for it in indexing."}
- {id: D2-C962, s: D2-S15, label: stage, ev: T:d2r3b:23, ver: consistent, src: [localized-versions], topics: [hreflang],
   rel: [{type: extends, to: D2-C575}],
   text: "Google said incorrect hreflang language or region codes are a mistake it finds very often, with the same wrong codes coming up again and again, especially in Europe, because site owners assume the codes are easy."}

# ---------- D2-S16 Lightning session G: Internationalisation ----------
# ----- Talk 1: Alizée Baudez, language, region and authority -----
- {id: D2-C618, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:2, T:t09c:3, T:d2r3b:43, T:d2r3b:44], ver: n/a, topics: [localisation, hreflang],
   text: "In a community speaker's audit case, a premium multifunctional-furniture maker about to be acquired had multilingual sites with clean translations by native speakers and hreflang tags that were in fairly good shape."}
- {id: D2-C619, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:4, T:d2r3b:45], ver: n/a, topics: [localisation],
   text: "In the same furniture-maker audit, the Dutch site had only a fraction of the conversions of the brand's other language sites, although it showed the same catalogue, the same hero products and the same photography."}
- {id: D2-C620, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:5, T:d2r3b:46], ver: n/a, topics: [localisation],
   text: "Checking a competitor during the furniture-maker audit, a community speaker found that a large furniture retailer's French and Dutch sites differ a little in the products they show and especially in their photography, with items apparently shown in much smaller rooms on the Dutch site."}
- {id: D2-C621, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:6, T:t09c:7, T:d2r3b:47, T:d2r3b:48], ver: n/a, topics: [localisation],
   text: "A community speaker said her first guess, that Dutch homes are smaller than French ones, was wrong: Dutch and French homes have about the same floor area per person, and what differs is the type of house."}
- {id: D2-C622, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:7, T:d2r3b:48], ver: n/a, topics: [localisation],
   text: "A community speaker said about 19% of homes in Europe are terraced houses on several floors, against 58% in the Netherlands; the matching Eurostat figures are 2019 shares of the EU and Dutch population living in semi-detached or terraced houses, not shares of homes."}
- {id: D2-C623, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:8, T:d2r3b:49], ver: n/a, topics: [localisation],
   text: "In a community speaker's comparison, a typical Dutch home is narrow and spread over several levels, often with very steep, narrow staircases that make furniture harder to install upstairs, while a typical French home has a wide ground floor and usually wide stairs."}
- {id: D2-C624, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:9, T:d2r3b:50], ver: n/a, topics: [localisation],
   text: "The lesson of the furniture-maker case was that the translation was correct but the target region had never been checked.",
   quote: "the translation was right, but the region was never checked"}
- {id: D2-C625, s: D2-S16, label: analysis, ev: "", ver: n/a, topics: [localisation],
   text: "When translations and hreflang are clean but one country version converts far worse, compare that market's product range, photography and delivery or installation constraints with local competitors before changing anything technical."}
- {id: D2-C626, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:10, T:t09c:11, T:t09c:12, T:d2r3b:51, T:d2r3b:52, T:d2r3b:53], ver: n/a, topics: [localisation, hreflang, geotargeting],
   text: "A community speaker framed international SEO around three signals to settle before working on hreflang: language (what people can read), region (who the content is for) and authority (why local people should trust the site)."}
- {id: D2-C627, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:10, T:d2r3b:51], ver: n/a, topics: [localisation, page-language],
   rel: [{type: extends, to: D2-C562}],
   text: "A community speaker said language versions need adjusting for regional variants of one language: 90 is 'quatre-vingt-dix' in France but 'nonante' in Belgium, and Swiss German differs from German, for example in whether the letter ß (Eszett) is used."}
- {id: D2-C628, s: D2-S16, label: docs, ev: "", ver: source, src: [localized-versions], topics: [hreflang, localisation],
   text: "Google's documentation recommends hreflang annotations even when a site's versions differ only by small regional variations within one language, for example English-language content targeted to the US, GB and Ireland."}
- {id: D2-C629, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:11, T:d2r3b:52], ver: n/a, topics: [localisation, geotargeting],
   text: "Settling the region means deciding who the content is actually for, which shapes how the catalogue is organised, how prices look and which payment options each market gets."}
- {id: D2-C630, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:12, T:t09c:13, T:d2r3b:53, T:d2r3b:54], ver: n/a, topics: [localisation, geotargeting],
   text: "Of language, region and authority, a community speaker called language easy to settle and region solvable with a little research, while authority (why local people should trust a brand) has to be earned and built over time."}
- {id: D2-C631, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:13, T:d2r3b:54], ver: consistent, src: [localized-versions, multi-regional-sites], topics: [hreflang, geotargeting, localisation],
   text: "A community speaker stressed that an hreflang annotation for a country (her example was German for Austria, de-AT) does not by itself make a site established or trusted in that country; local authority has to be worked for."}
- {id: D2-C632, s: D2-S16, label: docs, ev: "", ver: source, src: [multi-regional-sites], topics: [geotargeting, hreflang, localisation],
   text: "Google's documentation lists the signals it uses to decide which locale a page targets: ccTLDs, hreflang statements, server location, and other signals such as local addresses and phone numbers, local language and currency, links from other local sites and Business Profile signals."}
- {id: D2-C633, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:14, T:d2r3b:55], ver: undocumented, src: [sej-semrush-hreflang-mistakes], topics: [hreflang],
   text: "A community speaker cited a Semrush study that found at least one hreflang error on 75% of multilingual websites; the study, reported in February 2017, audited 20,000 sites with several language versions (the speaker recalled it as about five years old)."}
- {id: D2-C634, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:14, T:d2r3b:55], ver: n/a, topics: [localisation, hreflang],
   text: "A community speaker said the SEO industry has treated hreflang as the hard part of international SEO; hreflang is complicated, but the real hard part is the homework of understanding consumers in each market.",
   quote: "the hard part is actually doing the homework to understand your consumers"}
- {id: D2-C635, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:14, T:t09c:15, T:d2r3b:55, T:d2r3b:56], ver: n/a, topics: [localisation, trends-for-seo],
   text: "A community speaker said the answers about what consumers in each market want expire, because regional differences change over time."}
- {id: D2-C636, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:15, T:d2r3b:56], ver: n/a, topics: [localisation, trends-for-seo],
   text: "A community speaker showed a chart of search interest over time for ceiling fans in northern versus southern Europe, saying southern Europeans commonly have them at home while northern Europeans paid them no attention until the previous summer's heat waves (the talk was on 1 October 2026)."}
- {id: D2-C637, s: D2-S16, label: analysis, ev: "", ver: n/a, topics: [localisation, trends-for-seo],
   text: "Re-check regional demand for core product categories at least once a year, for example by comparing regions and seasons in Google Trends, because climate, housing or habits can shift what a market wants."}
- {id: D2-C638, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:16, T:d2r3b:57], ver: n/a, topics: [localisation, page-language, hreflang],
   text: "The first of three questions to ask before the technical work of international SEO is which languages, and which language variants, the site actually serves, keeping languages and variants apart."}
- {id: D2-C639, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:17, T:d2r3b:58], ver: n/a, topics: [localisation],
   text: "The second question before international SEO work is what genuinely differs between the regions of each language, such as photography, content, vocabulary, the way products are presented, pricing, catalogues and payment options."}
- {id: D2-C640, s: D2-S16, label: stage, who: Alizée Baudez, ev: [T:t09c:18, T:d2r3b:59], ver: n/a, topics: [localisation, geotargeting],
   text: "The third question is whether you can name three local sources that already treat the brand as present in a country; if you cannot, a community speaker advised not to expand there but to fix the markets you already serve.",
   quote: "don't bother expanding to another country; just fix the ones you already have"}
- {id: D2-C641, s: D2-S16, label: analysis, ev: "", ver: n/a, topics: [hreflang, geotargeting, localisation],
   text: "Treat hreflang as a way to show the right language version, not as a market-entry signal: before launching a country version, make sure local publications, partners or directories already mention the brand, and localise pricing and payment options."}
- {id: D2-C642, s: D2-S16, label: analysis, ev: "", ver: n/a, topics: [localisation, hreflang, page-language],
   text: "List language variants such as fr-FR and fr-BE or de-DE and de-CH separately in a site's language inventory, and give each its own vocabulary and spelling review instead of reusing one translation for every country."}
# ----- Talk 2: a community talk (presented by a colleague of its author), non-Latin scripts -----
- {id: D2-C643, s: D2-S16, label: stage, who: a second community speaker, ev: [T:t09c:21, T:d2r3b:61, T:d2r3b:62], ver: n/a, topics: [non-latin-scripts, localisation],
   text: "A community talk, presented on its author's behalf by a colleague, was about multilingual SEO for languages written in non-Latin scripts, such as Persian and Arabic."}
- {id: D2-C644, s: D2-S16, label: stage, who: a second community speaker, ev: [T:t09c:22, T:d2r3b:63], ver: undocumented, topics: [non-latin-scripts],
   text: "Arabic and Persian contain letters that look identical to users but are different characters to software, with different Unicode code points; the example given was the letter ye, which has an Arabic and a Persian form."}
- {id: D2-C645, s: D2-S16, label: stage, who: a second community speaker, ev: [T:t09c:23, T:d2r3b:64], ver: undocumented, topics: [non-latin-scripts, localisation],
   text: "Because Arabic and Persian lookalike letters have different code points, a searcher may type one variant of a word while a website's text uses the other."}
- {id: D2-C646, s: D2-S16, label: stage, who: a second community speaker, ev: [T:t09c:23, T:d2r3b:64], ver: undocumented, topics: [non-latin-scripts, localisation],
   text: "Lookalike Arabic and Persian character variants cause problems for data analysis and keyword research: data for one term can be split across the variants, which makes keyword research less accurate."}
- {id: D2-C647, s: D2-S16, label: analysis, ev: "", ver: n/a, topics: [non-latin-scripts, localisation],
   text: "For Persian and Arabic keyword research, look up each lookalike-character spelling of a term separately and add up the volumes, and check which variant the site's own content uses."}
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D2-C963, s: D2-S16, label: stage, who: a second community speaker, ev: T:d2r3b:65, ver: undocumented, topics: [non-latin-scripts],
   text: "Persian and Arabic are written right to left and English left to right, so a title that mixes the two scripts can display in a confusing, unpredictable order even when its content is correct."}
- {id: D2-C964, s: D2-S16, label: stage, who: a second community speaker, ev: T:d2r3b:65, ver: undocumented, topics: [non-latin-scripts, localisation],
   text: "The display problem of mixing right-to-left and left-to-right text also affects product titles and URLs, the presenter of the non-Latin-script talk said, showing an example from a large Iranian e-commerce site."}
- {id: D2-C965, s: D2-S16, label: stage, who: a second community speaker, ev: T:d2r3b:66, ver: consistent, src: [multilingual-searches-blog], topics: [non-latin-scripts, query-understanding],
   rel: [{type: extends, to: D2-C599}],
   text: "Users of non-Latin-script languages do not always search in their own script: the same Persian query may be typed in Persian script or in Latin letters, with the same intent and the same expected results."}
- {id: D2-C966, s: D2-S16, label: stage, who: a second community speaker, ev: T:d2r3b:67, ver: n/a, topics: [non-latin-scripts, localisation],
   text: "Keyword research for non-Latin-script languages should ask how people actually type and spell in local search, not only what the right keyword is, because switching keyboards is inconvenient, especially when typing on mobile."}
- {id: D2-C967, s: D2-S16, label: stage, who: a second community speaker, ev: [T:d2r3b:68, T:d2r3b:70], ver: undocumented, topics: [spam-policies, non-latin-scripts],
   text: "The presenter of the non-Latin-script talk said that in competitive Persian, Turkish and Arabic searches, bought backlinks and paid editorial content still visibly influence rankings and are widespread (an observation; no data was shown); the presenter stressed this described the situation and was not a recommendation."}
- {id: D2-C968, s: D2-S16, label: stage, who: a second community speaker, ev: T:d2r3b:69, ver: confirmed, src: [october-2023-spam-update-blog], topics: [spam-detection, non-latin-scripts],
   text: "The presenter of the non-Latin-script talk said Google announced in October 2023 that it had improved its spam-detection coverage for languages: the spam policy was global, but the coverage improvement was language-specific."}
- {id: D2-C969, s: D2-S16, label: stage, who: a second community speaker, ev: T:d2r3b:70, ver: n/a, topics: [non-latin-scripts, localisation],
   text: "The presenter of the non-Latin-script talk said Persian offers far fewer natural link opportunities than English, with fewer publications, niche blogs and websites."}
- {id: D2-C970, s: D2-S16, label: stage, who: a second community speaker, ev: T:d2r3b:70, ver: n/a, topics: [non-latin-scripts, localisation],
   text: "For SEO in languages such as Persian, the presenter of the non-Latin-script talk advised accepting different competitive dynamics and basing strategy on the actual maturity of that language's market, not only on the global policy."}
- {id: D2-C971, s: D2-S16, label: stage, who: a second community speaker, ev: T:d2r3b:71, ver: confirmed, src: [site-names-global-rollout-blog], topics: [non-latin-scripts, measurement, search-updates],
   text: "Google search features often launch in some languages or countries first and expand later (the presenter's example was site names, launched in several languages and then extended to all languages in 2023), so comparisons of performance across languages and countries should not assume a feature is live everywhere at once."}
- {id: D2-C972, s: D2-S16, label: stage, who: a second community speaker, ev: T:d2r3b:72, ver: consistent, src: [translated-results, multilingual-searches-blog], topics: [non-latin-scripts, seo-vs-geo, localisation],
   rel: [{type: extends, to: D2-C603}],
   text: "In the presenter's observation, AI answers to Persian queries are written in Persian but cite some English sources; the presenter explained that Persian content on a topic is often thinner, of lower quality or less relevant, so the systems retrieve from languages with better content, which the presenter called cross-lingual retrieval."}
- {id: D2-C973, s: D2-S16, label: stage, who: a second community speaker, ev: T:d2r3b:73, ver: n/a, topics: [non-latin-scripts, localisation],
   text: "The non-Latin-script talk concluded that multilingual SEO is not just translation: script, language behaviour and market maturity also matter, and basic SEO tactics, though the same everywhere, must be fitted to each market."}
- {id: D2-C977, s: D2-S16, label: stage, who: a second community speaker, ev: T:d2r3b:68, ver: confirmed, src: [spam-policies], topics: [spam-policies],
   text: "The presenter of the non-Latin-script talk recalled that Google officially treats buying links for ranking as spam (the year of the announcement was not clear in the recording)."}
- {id: D2-C978, s: D2-S16, label: docs, ev: "", ver: source, src: [october-2023-spam-update-blog], topics: [spam-detection, search-updates],
   text: "Google's October 2023 spam update post (4 October 2023) says the update improved coverage in many languages and spam types, cleaning up spam reported in Turkish, Vietnamese, Indonesian, Hindi, Chinese and other languages, particularly cloaking, hacked, auto-generated and scraped spam."}
- {id: D2-C979, s: D2-S16, label: analysis, ev: "", ver: n/a, src: [october-2023-spam-update-blog, spam-policies], topics: [spam-detection, non-latin-scripts],
   text: "The October 2023 spam update cited in the non-Latin-script talk names neither Persian nor Arabic (only 'other languages') and lists cloaking, hacked, auto-generated and scraped spam, not link spam, so it does not show that the bought links the presenter saw working in Persian or Arabic search were addressed."}
- {id: D2-C980, s: D2-S16, label: docs, ev: "", ver: source, src: [site-names-global-rollout-blog], topics: [serp-anatomy, search-updates],
   text: "Google's site names were introduced on mobile results for select languages in October 2022, expanded to desktop in March 2023, and on 7 September 2023 became available in all languages where Google Search is available, on mobile and desktop."}
- {id: D2-C981, s: D2-S16, label: docs, ev: "", ver: source, src: [multilingual-searches-blog], topics: [non-latin-scripts, query-understanding],
   text: "Google's post on multilingual searches (8 September 2023) says that, because of typing difficulty on some keyboards, a person in India might search in Hindi using Latin rather than Devanagari characters and want and receive Hindi results written either way."}

# ---------- D2-S17 Poster session H: Indexing ----------
# ----- From the second recording (an attendee recording, added in v2.5.0) -----
- {id: D2-C974, s: D2-S17, label: stage, ev: T:d2r3b:74, ver: n/a, topics: [seo-scope],
   text: "Google added a poster session to the Deep Dive because some topics need a longer, more one-to-one discussion than a seven-minute lightning talk allows."}
- {id: D2-C975, s: D2-S17, label: stage, ev: T:d2r3b:75, ver: n/a, topics: [seo-scope, site-moves, search-console-features],
   text: "The Day 2 poster topics included technical SEO testing in CI/CD pipelines, internal links that move rankings, Search Console's URL Inspection tool and API, getting everyone on board during complex site migrations, a CMS migration from WordPress to Contentful, the 'global Spanish' problem and going beyond prompts."}
- {id: D2-C976, s: D2-S17, label: stage, ev: T:d2r3b:75, ver: n/a, topics: [seo-scope],
   text: "One Day 2 poster was presented by a Googler, about bringing Google's tools into WordPress sites."}

# ---------- D2-S19 Calculating (some) signals ----------
- {id: D2-C648, s: D2-S19, label: stage, ev: [T:t10:1, T:t10:2, T:t10:6, T:t10:8, T:t10:12], ver: consistent, src: [how-search-works], topics: [indexing-signals],
   rel: [{type: extends, to: D1-C037}],
   text: "Among the many signals Google calculates during indexing, the ones singled out as having large effects on search results were country, language, freshness, SafeSearch and spam."}
- {id: D2-C649, s: D2-S19, label: stage, ev: T:t10:2, ver: consistent, src: [how-search-works], topics: [page-language, geotargeting, indexing-signals],
   text: "Country and language are among Google's most important signals and have been used since Google's early days.",
   quote: "Both of them are extremely, extremely important"}
- {id: D2-C650, s: D2-S19, label: stage, ev: T:t10:2, ver: undocumented, topics: [page-language, index-selection],
   text: "Smaller languages have fewer documents on the web and so worse coverage, from an indexing perspective, than large ones, for example Basque compared with Spanish or Portuguese, Hungarian compared with German, and Sicilian compared with Italian."}
- {id: D2-C651, s: D2-S19, label: stage, ev: T:t10:3, ver: undocumented, topics: [page-language, index-selection, indexing-signals],
   rel: [{type: extends, to: D2-C585}],
   text: "Google detects the language of each document and weights language in index selection so that the index is not dominated by one or two languages."}
- {id: D2-C652, s: D2-S19, label: stage, ev: T:t10:3, ver: undocumented, topics: [index-selection, page-language],
   text: "Without language or country input to index selection, Google's index would become an English index, because so many documents on the web are in English.",
   quote: "if you just let the index decide what to rank without language or country input, then you would have an English index"}
- {id: D2-C653, s: D2-S19, label: stage, ev: T:t10:4, ver: undocumented, topics: [geotargeting, index-selection],
   text: "Google also takes country into account in index selection, so that countries producing less content in a shared language, such as the UK for English or Switzerland for German, are not disadvantaged against the US or Germany, which produce most of it."}
- {id: D2-C654, s: D2-S19, label: stage, ev: T:t10:5, ver: confirmed, src: [how-search-works, multi-regional-sites], topics: [geotargeting, page-language, indexing-signals],
   text: "In ranking, country and language signals help Google serve users the right content for their country and language."}
- {id: D2-C655, s: D2-S19, label: analysis, ev: "", ver: n/a, src: [multi-regional-sites], topics: [geotargeting, index-selection],
   text: "A site serving a smaller country in a big language, such as British English or Swiss German, should make that country unmistakable (country-code domain or region-specific hreflang, local address, prices and currency) so its pages can benefit from index selection's country balancing instead of competing with the much larger US or German content pool."}
- {id: D2-C656, s: D2-S19, label: stage, ev: T:t10:6, ver: confirmed, src: [ranking-systems-guide], topics: [indexing-signals, ranking-signals-by-vertical],
   rel: [{type: extends, to: D1-C045}],
   text: "Freshness is a signal for queries that deserve fresh results ('query deserves freshness'): when a breaking event hits a city, such as possible closure of Barcelona's airport, users want really fresh results, not results from two weeks ago."}
- {id: D2-C657, s: D2-S19, label: stage, ev: T:t10:7, ver: consistent, src: [how-search-works, ranking-systems-guide], topics: [indexing-signals],
   text: "Google calculates some freshness signals during indexing but uses them in ranking."}
- {id: D2-C658, s: D2-S19, label: stage, ev: T:t10:7, ver: undocumented, topics: [indexing-signals, index-selection],
   text: "Freshness plays no big role in index selection: whether a page was published 30 years ago or today makes no difference to its chance of being indexed.",
   quote: "It doesn't play a big role in index selection."}
- {id: D2-C659, s: D2-S19, label: analysis, ev: "", ver: n/a, topics: [indexing-signals, index-selection],
   text: "Changing a page's date or making cosmetic edits will not help an old page get indexed, because freshness plays no big role in index selection; freshness pays off only when ranking for queries that deserve fresh results."}
- {id: D2-C660, s: D2-S19, label: stage, ev: T:t10:8, ver: confirmed, src: [safesearch-guidelines], topics: [indexing-signals],
   text: "Google uses multiple systems to protect users from unexpected explicit results: its algorithms detect whether a user is looking for explicit content and rank results accordingly, so the aim is not to never show explicit results but to avoid showing them to users who are not looking for them."}
- {id: D2-C661, s: D2-S19, label: stage, ev: T:t10:9, ver: undocumented, topics: [indexing-signals, index-selection],
   text: "Whether a page's content is explicit does not matter for indexing: judged on content type alone, an explicit page has the same chance of being indexed as a major news site's homepage."}
- {id: D2-C662, s: D2-S19, label: stage, ev: T:t10:10, ver: undocumented, topics: [indexing-signals],
   text: "Google calculates SafeSearch signals during indexing rather than in ranking, because ranking happens online with no time for such calculations, while indexing has the processing power.",
   quote: "In ranking, everything has to happen online, and there's just not enough time to calculate those things."}
- {id: D2-C663, s: D2-S19, label: stage, ev: T:t10:10, ver: consistent, src: [safesearch-guidelines], topics: [indexing-signals],
   text: "Calculating SafeSearch signals for a page needs its whole parsed HTML plus knowledge of which pages link to it and which pages it links to."}
- {id: D2-C664, s: D2-S19, label: docs, ev: "", ver: source, src: [safesearch-guidelines], topics: [indexing-signals],
   text: "Google's guidelines for sites with explicit content recommend grouping explicit pages on a separate domain or subdomain; otherwise Google's systems may judge the whole site explicit and filter all of it when SafeSearch is on."}
- {id: D2-C665, s: D2-S19, label: analysis, ev: "", ver: n/a, src: [safesearch-guidelines], topics: [indexing-signals],
   text: "Because explicit content on its own does not lower a page's chance of being indexed, the practical risk for a site that mixes explicit and general content is SafeSearch classification, which looks at the whole page and its links; keep explicit pages on a separate domain or subdomain, as Google advises."}
- {id: D2-C666, s: D2-S19, label: stage, ev: T:t10:12, ver: consistent, src: [webspam-report-2022], topics: [spam-detection, index-selection],
   text: "Spam stops a document at indexing: when Google detects that a document is spam, it does not let it into the index.",
   quote: "If we detect that something is spam, then we're not letting it into the index."}
- {id: D2-C667, s: D2-S19, label: docs, ev: "", ver: source, src: [spam-policies], topics: [spam-detection],
   text: "Google's spam policies say that sites violating them may rank lower in results or not appear in results at all."}
- {id: D2-C668, s: D2-S19, label: stage, ev: T:t10:13, ver: consistent, src: [spam-updates, webspam-report-2021], topics: [spam-detection, ai-in-search-systems],
   rel: [{type: extends, to: D1-C041}],
   text: "Google uses more and more AI to detect spam, and Google's testing shows that this AI-based detection is highly accurate."}
- {id: D2-C669, s: D2-S19, label: stage, ev: T:t10:13, ver: undocumented, topics: [spam-detection, ai-in-search-systems, gemini-and-search],
   rel: [{type: extends, to: D1-C041}, {type: extends, to: D1-C039}],
   text: "SpamBrain, Google's AI-based spam detection system, is nowadays built on Gemini and fine-tuned specifically for finding spam.",
   quote: "built on top of, well, nowadays, Gemini, and fine-tuned to that specific purpose of finding spam"}
- {id: D2-C670, s: D2-S19, label: stage, ev: T:t10:13, ver: confirmed, src: [webspam-report-2022, webspam-report-2021], topics: [spam-detection],
   text: "SpamBrain is central to Google's spam-fighting efforts and has been improved many times since its launch."}
- {id: D2-C671, s: D2-S19, label: docs, ev: "", ver: source, src: [webspam-report-2021], topics: [spam-detection],
   text: "Google's 2021 webspam report says SpamBrain, its AI-based spam-prevention system, was launched in 2018 and has been continuously improved since."}
- {id: D2-C672, s: D2-S19, label: analysis, ev: "", ver: n/a, topics: [spam-detection],
   text: "The SpamBrain launch year mentioned on stage, with hesitation, was 2022, which does not match Google's documented 2018; 2022 is the year of the improvements described in Google's 2022 webspam report, so cite 2018 as the launch year."}
- {id: D2-C673, s: D2-S19, label: stage, ev: T:t10:13, ver: undocumented, topics: [spam-detection],
   text: "SpamBrain was said to detect 5 times more spam sites than the spam algorithms Google had launched before it."}
- {id: D2-C674, s: D2-S19, label: docs, ev: "", ver: source, src: [webspam-report-2022], topics: [spam-detection],
   text: "Google's 2022 webspam report says SpamBrain detected 5 times more spam sites in 2022 than in 2021, and 200 times more than when it first launched."}
- {id: D2-C675, s: D2-S19, label: analysis, ev: "", ver: n/a, topics: [spam-detection],
   text: "The '5 times more spam sites' figure said on stage matches Google's 2022 webspam report, but the report compares 2022 with 2021 (and gives 200 times since launch), not SpamBrain with earlier algorithms; quote the documented comparison."}
- {id: D2-C676, s: D2-S19, label: stage, ev: T:t10:13, ver: confirmed, src: [webspam-report-2022], topics: [spam-detection],
   text: "Google's testing shows that, thanks to SpamBrain, more than 99% of visits from Search are now spam-free."}
- {id: D2-C677, s: D2-S19, label: analysis, ev: "", ver: n/a, topics: [indexing-signals, indexing-pipeline],
   text: "Language, country, SafeSearch and spam signals, and some freshness signals, are calculated when a page is indexed, so a fix such as correcting a page's language or removing content that triggers SafeSearch only counts once Google recrawls and reprocesses the page; request recrawling of the most important URLs after the fix."}
- {id: D2-C678, s: D2-S19, label: stage, ev: T:t10:15, ver: consistent, src: [how-search-works, ranking-systems-guide], topics: [indexing-signals],
   text: "Many of Google's signals are described in its developer documentation, though not always under the name 'signals'."}
- {id: D2-C679, s: D2-S19, label: stage, ev: T:t10:16, ver: n/a, topics: [helpful-content, indexing-signals],
   rel: [{type: repeats, to: D1-C059}],
   text: "Combing Google's documentation for signals is not the best use of an SEO's time; creating content that users will like is a better one.",
   quote: "If you are just focusing on actually creating the content that users will like, then that's probably a better use of your life."}
- {id: D2-C837, s: D2-S19, label: docs, ev: "", ver: source, src: [safesearch-guidelines], topics: [indexing-signals],
   text: "Google's guidelines for sites with explicit content say to mark each explicit page with rating markup set to adult, either as a meta tag named rating or as an HTTP response header."}

# ---------- D2-S20 Deciding what goes in the index? ----------
- {id: D2-C680, s: D2-S20, label: stage, ev: T:t10:17, ver: consistent, src: [crawl-budget-guide, how-search-works], topics: [index-selection],
   rel: [{type: repeats, to: D1-C037}, {type: repeats, to: D2-C344}],
   text: "Google's index is immense but finite, so Google cannot index every URL it finds on a web with a practically infinite number of URLs.",
   quote: "our index is immense. Like, immense. But it is a finite resource."}
- {id: D2-C681, s: D2-S20, label: stage, ev: T:t10:18, ver: undocumented, topics: [index-selection],
   text: "Google gives two reasons for not indexing every URL it knows: most of them would not be useful to users, and including URLs in the index that users would never see would be an immense investment."}
- {id: D2-C682, s: D2-S20, label: stage, ev: T:t10:19, ver: consistent, src: [crawl-budget-guide, how-search-works], topics: [index-selection],
   rel: [{type: extends, to: D1-C211}],
   text: "Google's index selection system calculates thresholds and decides which documents are kept and which are thrown out; a URL that does not meet the thresholds is not indexed."}
- {id: D2-C683, s: D2-S20, label: stage, ev: T:t10:19, ver: undocumented, topics: [index-selection, helpful-content],
   text: "Index selection aims to index only documents that are useful to users now or potentially in the future."}
- {id: D2-C684, s: D2-S20, label: stage, ev: T:t10:20, ver: undocumented, topics: [index-selection, ai-in-search-systems],
   rel: [{type: extends, to: D1-C037}],
   text: "Index selection is a predictive AI system that relies heavily on machine learning."}
- {id: D2-C685, s: D2-S20, label: stage, ev: T:t10:20, ver: undocumented, topics: [index-selection, crawl-demand-inheritance],
   rel: [{type: extends, to: D1-C094}],
   text: "Index selection uses what Google already knows about a site: if the site, or even a section of it, satisfies users' needs well, new URLs from it are treated more forgivingly.",
   quote: "the index selection system is going to be more forgiving when it sees a new URL from your site"}
- {id: D2-C686, s: D2-S20, label: analysis, ev: "", ver: n/a, topics: [index-selection, crawl-demand-inheritance],
   rel: [{type: extends, to: D1-C095}],
   text: "Launch new pages under sections that Google already indexes well, and improve or remove weak sections, because index selection judges new URLs partly by what it knows about the site and the section they sit in."}
- {id: D2-C687, s: D2-S20, label: stage, ev: T:t10:21, ver: undocumented, topics: [index-selection, indexing-signals],
   rel: [{type: extends, to: D1-C205}],
   text: "Index selection uses the signals calculated earlier in indexing for each document it has to select or discard."}
- {id: D2-C688, s: D2-S20, label: stage, ev: T:t10:21, ver: undocumented, topics: [index-selection, indexing-pipeline],
   rel: [{type: extends, to: D2-C026}, {type: extends, to: D1-C211}],
   text: "Index selection is the last step before documents enter Google's index."}
- {id: D2-C689, s: D2-S20, label: stage, ev: T:t10:22, ver: undocumented, topics: [index-selection, geotargeting],
   text: "When Google's coverage of a country is limited, index selection becomes more likely to select documents relevant to that country, even if other signals would suggest otherwise."}
- {id: D2-C690, s: D2-S20, label: stage, ev: T:t10:22, ver: undocumented, topics: [index-selection, page-language],
   text: "When Google lacks content in a language, such as Basque, index selection becomes more likely to select lower-quality documents in that language."}
- {id: D2-C691, s: D2-S20, label: stage, ev: T:t10:23, ver: undocumented, topics: [index-selection, page-language, localisation],
   text: "Under-served languages were presented as an opportunity: where Google's index holds a lot of spam in a language such as Basque, a site that starts publishing in that language can very likely replace that spam with its own content and rank for those keywords (one clause of the reasoning was inaudible)."}
- {id: D2-C692, s: D2-S20, label: analysis, ev: "", ver: n/a, src: [spam-policies], topics: [index-selection, localisation, spam-detection],
   text: "The lower selection bar in under-served languages is an opening for content written for that market, not for machine translation at scale: index selection also applies spam signals, and Google's spam policies count generating many pages from scraped content through automated transformations such as translating, with little value for users, as scaled content abuse."}
- {id: D2-C693, s: D2-S20, label: stage, ev: T:t10:24, ver: undocumented, topics: [index-selection],
   text: "The overall importance of a document or site plays a significant role in index selection."}
- {id: D2-C694, s: D2-S20, label: stage, ev: T:t10:24, ver: undocumented, topics: [index-selection],
   text: "News sites were given as the example of importance at work in index selection: they are generally very important on the web and their pages usually get indexed very fast ('indexed' is a likely but not certain reading of the recording)."}
- {id: D2-C695, s: D2-S20, label: stage, ev: T:t10:25, ver: consistent, src: [how-search-works], topics: [index-selection, helpful-content],
   rel: [{type: extends, to: D1-C093}],
   text: "Page quality is ultimately what decides whether a document is indexed, so focusing on quality is the most reliable way to get pages into Google's index.",
   quote: "focusing on the quality is the most reliable way to get stuff in the index"}
- {id: D2-C696, s: D2-S20, label: stage, ev: [T:t10:26, T:t10:27, T:t10:28, T:t10:29, T:t10:30, T:t10:31], ver: consistent, src: [page-indexing-help, robots-meta-tag-spec, webspam-report-2022], topics: [index-selection],
   text: "Index selection applies the negative signals that immediately block indexing: noindex (the likely reading of one unclear word), expired unavailable_after dates, soft 404s, non-canonical duplicates, spam signals and other policies."}
- {id: D2-C697, s: D2-S20, label: stage, ev: [T:t10:26, T:t10:39], ver: consistent, src: [page-indexing-help, robots-meta-tag-spec], topics: [robots-meta-tag, index-selection],
   rel: [{type: extends, to: D1-C106}],
   text: "Index selection drops a document carrying a noindex rule if it was not already dropped earlier in processing (noindex is a likely but not certain reading of the transcript, supported by the later mention of noindex among the Page indexing report reasons)."}
- {id: D2-C698, s: D2-S20, label: stage, ev: T:t10:27, ver: consistent, src: [robots-meta-tag-spec], topics: [robots-meta-tag, index-selection],
   rel: [{type: extends, to: D2-C100}],
   text: "Index selection checks for the robots unavailable_after rule and its date, and drops a page from the index once that date is reached."}
- {id: D2-C699, s: D2-S20, label: analysis, ev: "", ver: n/a, src: [robots-meta-tag-spec], topics: [robots-meta-tag, index-selection],
   text: "Use the unavailable_after robots rule on pages with a known end date, such as event pages, time-limited offers or job ads, so that index selection drops them automatically when the date passes instead of leaving expired pages in search results."}
- {id: D2-C700, s: D2-S20, label: stage, ev: T:t10:28, ver: consistent, src: [troubleshoot-crawling-errors], topics: [soft-404, index-selection],
   rel: [{type: extends, to: D1-C073}, {type: extends, to: D2-C334}],
   text: "Index selection drops soft 404 pages that were not dropped earlier, for example when a document is reprocessed."}
- {id: D2-C701, s: D2-S20, label: stage, ev: T:t10:29, ver: consistent, src: [canonicalization, page-indexing-help], topics: [duplicate-content, index-selection, canonical-selection],
   rel: [{type: extends, to: D1-C128}, {type: extends, to: D2-C345}],
   text: "When Google already has duplicate information for a document, for example when reprocessing it, index selection uses it to drop non-canonical duplicates from further processing, so that, as the speaker put it, only canonicals end up in search results (a simplification; see D2-C703)."}
- {id: D2-C702, s: D2-S20, label: docs, ev: "", ver: source, src: [canonicalization, how-search-works], topics: [duplicate-content, canonical-selection],
   text: "Google's documentation says a search result usually points to the canonical page, but the other pages in a duplicate cluster are alternate versions that may be served in different contexts, for example a mobile page for a user on a mobile device."}
- {id: D2-C703, s: D2-S20, label: analysis, ev: "", ver: n/a, topics: [duplicate-content, canonical-selection],
   text: "'Only canonicals end up in search results' as said on stage is a simplification: non-canonical duplicates are dropped from the index, but Google's documentation says an alternate from the same cluster can still be shown in some contexts, such as a mobile version to a mobile user."}
- {id: D2-C704, s: D2-S20, label: stage, ev: T:t10:30, ver: consistent, src: [webspam-report-2022], topics: [spam-detection, index-selection],
   text: "Index selection loads most of Google's spam signals and acts as a gatekeeper so that no spam enters search results.",
   quote: "index selection acts as a gatekeeper, ensuring that no spam enters our search results"}
- {id: D2-C705, s: D2-S20, label: stage, ev: T:t10:31, ver: consistent, src: [search-content-policies], topics: [index-selection],
   text: "Index selection also applies other policies, covering egregious violations and, in a less certain reading of the transcript, content Google is legally not allowed to index."}
- {id: D2-C706, s: D2-S20, label: stage, ev: [T:t10:32, T:t10:33], ver: undocumented, topics: [page-indexing-report, crawl-budget],
   rel: [{type: extends, to: D1-C097}, {type: extends, to: D1-C065}],
   text: "'Discovered – currently not indexed' in Search Console is a crawl-scheduling state: Google knows the URL exists but does not want to crawl it yet. Of the two not-indexed statuses discussed, it was called the 'kind of nastier' one.",
   quote: "The first one is kind of nastier."}
- {id: D2-C707, s: D2-S20, label: docs, ev: "", ver: source, src: [page-indexing-help], topics: [page-indexing-report, crawl-budget],
   text: "Google's Page indexing report help says a 'Discovered – currently not indexed' page was found but not crawled yet, typically because Google wanted to crawl it but expected the crawl to overload the site, so it rescheduled the crawl."}
- {id: D2-C708, s: D2-S20, label: analysis, ev: "", ver: n/a, src: [crawl-budget-guide], topics: [page-indexing-report, crawl-budget, crawl-demand],
   rel: [{type: extends, to: D1-C098}],
   text: "The help page explains 'Discovered – currently not indexed' by expected server overload (capacity), while on stage it was explained as Google not wanting the URL yet (demand); the crawl budget guide covers both, so first rule out slow responses and server errors, then treat the status as a quality and demand problem."}
- {id: D2-C709, s: D2-S20, label: stage, ev: T:t10:33, ver: consistent, src: [crawl-budget-guide], topics: [page-indexing-report, crawl-demand],
   rel: [{type: extends, to: D1-C093}],
   text: "Site owners can influence 'Discovered – currently not indexed' by getting other URLs of the site indexed and showing Google's systems that the site's content is good and useful to users."}
- {id: D2-C710, s: D2-S20, label: analysis, ev: "", ver: n/a, topics: [page-indexing-report, crawl-demand],
   text: "Repeatedly submitting 'Discovered – currently not indexed' URLs does not change why they wait, because the status reflects a crawl-scheduling decision; raise the site's demonstrated quality instead, for example by improving or removing weak pages that are already indexed."}
- {id: D2-C711, s: D2-S20, label: stage, ev: T:t10:34, ver: consistent, src: [page-indexing-help], topics: [page-indexing-report, index-selection],
   text: "'Crawled – currently not indexed' in Search Console is an index selection decision: Google crawled and processed the page but decided not to keep it in the index."}
- {id: D2-C712, s: D2-S20, label: docs, ev: "", ver: source, src: [page-indexing-help], topics: [page-indexing-report],
   text: "Google's Page indexing report help says a 'Crawled – currently not indexed' page was crawled but not indexed, may or may not be indexed in the future, and does not need to be resubmitted for crawling."}
- {id: D2-C713, s: D2-S20, label: stage, ev: T:t10:35, ver: consistent, src: [how-search-works], topics: [page-indexing-report, main-content],
   text: "If content quality is even across a site, a page reported as 'Crawled – currently not indexed' may be using a different template that keeps Google from understanding where its content is."}
- {id: D2-C714, s: D2-S20, label: stage, ev: T:t10:36, ver: undocumented, topics: [page-indexing-report, index-selection, helpful-content],
   rel: [{type: extends, to: D1-C098}],
   text: "'Crawled – currently not indexed' is most of the time a quality issue rather than a technical one: the pages are usually low quality or useless for the index, for example duplicates or soft 404s.",
   quote: "most of the time it is actually a quality issue"}
- {id: D2-C715, s: D2-S20, label: stage, ev: T:t10:37, ver: undocumented, topics: [page-indexing-report, helpful-content],
   text: "The first thing to check for pages reported as 'Crawled – currently not indexed' is whether their quality is on par with the parts of the site that Google does index."}
- {id: D2-C716, s: D2-S20, label: analysis, ev: "", ver: n/a, topics: [page-indexing-report, index-selection, helpful-content],
   rel: [{type: extends, to: D1-C098}],
   text: "Treat 'Crawled – currently not indexed' as a quality audit list: compare those URLs with indexed pages of the same type for thin, duplicate or soft-404-like content and for template differences before looking for technical faults."}
- {id: D2-C717, s: D2-S20, label: stage, ev: T:t10:38, ver: consistent, src: [page-indexing-help], topics: [page-indexing-report, index-selection],
   rel: [{type: extends, to: D1-C368}],
   text: "Search Console's Page indexing report is the place to check for index selection issues, and its not-indexed reasons are useful when testing changes on a site."}
- {id: D2-C718, s: D2-S20, label: stage, ev: T:t10:39, ver: confirmed, src: [page-indexing-help], topics: [page-indexing-report],
   text: "Not-indexed reasons in the Page indexing report include pages excluded by a noindex rule and 'Alternate page with proper canonical tag'."}

# ---------- D2-S23 How does the index look like? ----------
- {id: D2-C719, s: D2-S23, label: stage, ev: T:t11:1, ver: confirmed, src: [how-search-works], topics: [pipeline-overview, index-structure],
   rel: [{type: repeats, to: D1-C036}],
   text: "The speaker recapped Google's pipeline up to the index: Google crawls pages, processes the fetched documents and then stores them in its index."}
- {id: D2-C720, s: D2-S23, label: stage, ev: T:t11:2, ver: undocumented, topics: [index-structure, tokenization],
   rel: [{type: repeats, to: D2-C323}],
   text: "Google's Search index stores the tokens produced by tokenizing each page, as they are, together with the metadata attached to the tokens during tokenization."}
- {id: D2-C721, s: D2-S23, label: stage, ev: T:t11:3, ver: undocumented, topics: [index-structure, tokenization],
   rel: [{type: repeats, to: D2-C318}],
   text: "Google's Search index does not hold the full content of pages; Google said storing full pages and pulling them out at serving time would be a very inefficient way of doing search.",
   quote: "we don't have the full content of the page in our index"}
- {id: D2-C722, s: D2-S23, label: stage, ev: T:t11:4, ver: consistent, src: [how-search-works], topics: [index-structure, indexing-signals],
   rel: [{type: extends, to: D1-C037}],
   text: "Each document in Google's index has pretty much all the signals calculated for it attached, for example quality signals plus the page's country and language, according to an illustration the speaker called an approximation of the real structure."}
- {id: D2-C724, s: D2-S23, label: stage, ev: T:t11:5, ver: undocumented, topics: [index-structure, snippet-controls, tokenization],
   text: "The snippet shown for a web result is reconstructed from the tokens stored in Google's index: Google knows the position of each token in the document and rebuilds the snippet from those positions.",
   quote: "the snippet that you see was reconstructed from these tokens"}
- {id: D2-C725, s: D2-S23, label: docs, ev: "", ver: source, src: [snippets-guide], topics: [snippet-controls, index-structure],
   text: "Google's snippet documentation says snippets are created automatically, primarily from the page content, to preview the part that best relates to the user's specific search, so one page can get different snippets for different searches; sometimes the meta description is used instead."}
- {id: D2-C726, s: D2-S23, label: stage, ev: T:t11:6, ver: consistent, src: [ai-optimization-guide, ai-features-guide, robots-meta-tag-spec], topics: [index-structure, query-fanout, seo-vs-geo],
   rel: [{type: extends, to: D1-C038}],
   text: "AI Overviews and AI Mode use the same index structures and token-based snippets as classic web results, a point Google called important but not obvious."}
- {id: D2-C727, s: D2-S23, label: stage, ev: T:t11:6, ver: consistent, src: [ai-optimization-guide, ai-features-guide, robots-meta-tag-spec], topics: [query-fanout, index-structure, seo-vs-geo],
   rel: [{type: extends, to: D1-C053}, {type: extends, to: D1-C051}, {type: extends, to: D2-C073}, {type: extends, to: D1-C172}],
   text: "Google said that when AI Overviews or AI Mode run a query fan-out, the generated queries are sent to Google's Search index and documents come back with their snippets, which then feed the AI-generated answer (part of this passage is unclear in the recording)."}
- {id: D2-C728, s: D2-S23, label: docs, ev: "", ver: source, src: [robots-meta-tag-spec], topics: [snippet-controls, query-fanout],
   text: "Google's robots meta tag specification says the nosnippet rule also prevents a page's content from being used as a direct input for AI Overviews and AI Mode, and max-snippet also limits how much of it may be used that way."}
- {id: D2-C729, s: D2-S23, label: docs, ev: "", ver: source, src: [ai-features-guide, ai-mode-launch-blog], topics: [query-fanout],
   rel: [{type: extends, to: D1-C053}],
   text: "Google says query fan-out in AI Overviews and AI Mode issues related searches across subtopics and several data sources, which for AI Mode include the Knowledge Graph and shopping data as well as web content (AI Mode launch post, March 2025)."}
- {id: D2-C730, s: D2-S23, label: analysis, ev: "", ver: n/a, src: [ai-features-guide, ai-optimization-guide], topics: [seo-vs-geo, index-structure, query-fanout],
   text: "There is no separate AI index to optimise for: when a page never shows up as a source in AI Overviews or AI Mode, first check that it is indexed, that no nosnippet rule blocks its snippet and that the site is not excluded in Search Console's generative AI setting, the eligibility conditions Google lists."}
- {id: D2-C731, s: D2-S23, label: analysis, ev: "", ver: n/a, src: [ai-features-guide, robots-meta-tag-spec], topics: [snippet-controls, query-fanout],
   text: "Treat nosnippet, data-nosnippet and max-snippet as AI visibility settings too: Google lists them as the controls for content in AI features, and if AI answers are built from index snippets, as Google said on stage, a blocked or shortened snippet leaves AI Overviews and AI Mode less to use."}
- {id: D2-C732, s: D2-S23, label: stage, ev: T:t11:7, ver: consistent, src: [hsw-organizing-information], topics: [index-structure],
   text: "To find relevant pages, Google's serving system relies on posting lists, a long-established information retrieval structure taught in computer science courses, because simply asking for every page that contains a word would not work."}
- {id: D2-C824, s: D2-S23, label: stage, ev: T:t11:7, ver: undocumented, topics: [index-structure],
   rel: [{type: extends, to: D2-C732}],
   text: "Google said posting lists, which Google's serving system uses to find the pages that contain a query's words, are not new: they are at least 60 years old (as of 2026)."}
- {id: D2-C733, s: D2-S23, label: stage, ev: T:t11:8, ver: undocumented, topics: [index-structure, tokenization],
   text: "For most of the tokens Google finds on the web, though not every single one, the index keeps a posting list of the URLs that contain that token."}
- {id: D2-C734, s: D2-S23, label: docs, ev: "", ver: source, src: [hsw-organizing-information], topics: [index-structure],
   text: "Google's How Search Works site describes the Search index as like the index at the back of a book, with an entry for every word seen on every webpage Google indexes.",
   quote: "It’s like the index in the back of a book - with an entry for every word seen on every webpage we index."}
- {id: D2-C735, s: D2-S23, label: analysis, ev: "", ver: n/a, topics: [index-structure],
   text: "The speaker's 'most of the tokens' is more precise than the public explainer's 'an entry for every word': the explainer simplifies, and the speaker's self-correction suggests some tokens get no posting list, though the speaker did not say which."}
- {id: D2-C736, s: D2-S23, label: stage, ev: T:t11:8, ver: undocumented, topics: [index-structure],
   text: "In posting-list retrieval, the posting lists of the query's words are intersected, which yields an unranked list of candidate URLs."}
- {id: D2-C737, s: D2-S23, label: stage, ev: T:t11:9, ver: undocumented, topics: [tokenization, index-structure],
   rel: [{type: repeats, to: D2-C321}],
   text: "A search query is broken into words with the same segmenter or tokenizer that Google used to build the index."}
- {id: D2-C738, s: D2-S23, label: stage, ev: T:t11:9, ver: undocumented, topics: [index-structure, tokenization],
   text: "At retrieval, Google looks up the posting lists of the query words that are actually important rather than of every word in the query."}
- {id: D2-C740, s: D2-S23, label: stage, ev: T:t11:11, ver: consistent, src: [ai-powers-search-blog, ranking-systems-guide], topics: [index-structure, ai-in-search-systems],
   text: "Besides posting lists, Google can retrieve documents through vector embeddings: parts of documents are associated with embeddings, which form a vector space used for retrieval.",
   quote: "just like you build a posting list, you can also build a vector space"}
- {id: D2-C741, s: D2-S23, label: stage, ev: T:t11:12, ver: consistent, src: [ai-powers-search-blog, ranking-systems-guide], topics: [index-structure, ai-in-search-systems],
   rel: [{type: extends, to: D1-C129}],
   text: "In embedding-based retrieval, the distance between the embeddings of documents and the embedding of the user's query decides which documents are returned."}
- {id: D2-C742, s: D2-S23, label: analysis, ev: "", ver: n/a, src: [seo-starter-guide, ai-optimization-guide], topics: [index-structure, seo-vs-geo, helpful-content],
   text: "Write for both retrieval routes without keyword stuffing: name the page's subject in the plain words people search with, because posting lists match the words on the page, and explain the topic fully, because embedding retrieval matches meaning, so every keyword variation is unnecessary."}
- {id: D2-C744, s: D2-S23, label: stage, ev: T:t11:13, ver: undocumented, topics: [index-structure, ai-in-search-systems],
   text: "Google said a vector space also holds embeddings for associations the web makes with a page, such as what is known about its author; most of them sit far from typical queries, and a query that names the association may move closer to them."}
- {id: D2-C745, s: D2-S23, label: stage, ev: T:t11:14, ver: consistent, src: [hsw-organizing-information, ai-powers-search-blog], topics: [index-structure, seo-vs-geo, helpful-content],
   text: "Both retrieval methods Google described, the long-established posting lists and the newer vector embeddings, work from the content of the page."}
- {id: D2-C746, s: D2-S23, label: stage, ev: T:t11:14, ver: n/a, topics: [helpful-content, seo-vs-geo],
   text: "Google said, hedging with 'I think', that because retrieval is still based on content, the content mantra Google started about 25 years ago (as of 2026) still stands.",
   quote: "this mantra that we started 25 years ago or whatever still stands, whether we like it or not"}

# ---------- D2-S24 Google Trends ----------
- {id: D2-C747, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:2, ver: confirmed, src: [trends-get-started-sc, trends-faq, gni-basics-trends], topics: [trends-data, trends-features],
   text: "Google Trends is a free Google tool that gives access to a sample of aggregated, anonymized and categorized searches."}
- {id: D2-C748, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:2, ver: confirmed, src: [trends-search-terms-topics, trends-get-started-sc], topics: [trends-data],
   text: "Google Trends data covers searches on Google Search, including web, image, shopping and news search, plus searches on YouTube."}
- {id: D2-C749, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:3, ver: consistent, src: [google-discover, trends-search-terms-topics], topics: [trends-data],
   text: "Google Discover is not included in Google Trends, because Discover is a content feed with no search box, while Trends counts only the queries people type into Google Search or YouTube."}
- {id: D2-C750, s: D2-S24, label: docs, ev: "", ver: source, src: [trends-faq], topics: [trends-data, ai-mode-usage],
   text: "Google's Trends FAQ says Google Trends filters out searches made by Google products and services, including the internal searches made by AI Mode and AI Overviews.",
   quote: "This includes internal searches made by AI Mode and AI Overviews."}
- {id: D2-C751, s: D2-S24, label: analysis, ev: "", ver: n/a, topics: [trends-data, measurement],
   text: "Google Trends cannot show demand that reaches people through the Discover feed, so Discover visibility has to be judged from Search Console's Discover performance report rather than from Trends."}
- {id: D2-C752, s: D2-S24, label: stage, who: Omri Weisman, ev: [T:t12:4, T:t12:20], ver: confirmed, src: [ai-personalization-shopping-blog], topics: [trends-data, ai-mode-usage],
   rel: [{type: repeats, to: D1-C006}],
   text: "Google handles more than five trillion searches a year, a figure Google announced publicly at the beginning of 2025."}
- {id: D2-C753, s: D2-S24, label: analysis, ev: "", ver: n/a, topics: [trends-data],
   text: "By the author's arithmetic, more than five trillion Google searches a year means on average more than 13.7 billion searches a day, or roughly 160,000 a second."}
- {id: D2-C755, s: D2-S24, label: stage, who: Omri Weisman, ev: [T:t12:5, T:t12:10], ver: confirmed, src: [trends-get-started-sc, trends-faq], topics: [trends-features, trends-data],
   text: "Google Trends data can be viewed for the whole world, for a single country or for a region within a country, for example Spain or Catalonia."}
- {id: D2-C756, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:6, ver: consistent, src: [trends-faq], topics: [trends-data],
   text: "Google said Google Trends data is almost real time, reaching up to a few minutes before the moment of viewing.",
   quote: "we have data that goes all the way back from 2004 and up until three minutes ago"}
- {id: D2-C758, s: D2-S24, label: stage, who: Omri Weisman, ev: [T:t12:6, T:t12:7], ver: confirmed, src: [gni-advanced-trends], topics: [trends-features, trends-data, search-evolution],
   text: "Google Trends offers time ranges from the past hour or the past day back to 2004, so search patterns can be compared across two decades."}
- {id: D2-C759, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:8, ver: n/a, topics: [trends-data],
   text: "Google argued that people search authentically, for health conditions, career troubles or home repairs, so aggregated searches reflect what a country or the world cares about better than the curated picture on social media."}
- {id: D2-C760, s: D2-S24, label: stage, who: Omri Weisman, ev: [T:t12:9, T:t12:10], ver: confirmed, src: [trends-get-started-sc], topics: [trends-features],
   text: "Google Trends has two flagship experiences: the Explore page and Trending now."}
- {id: D2-C761, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:9, ver: consistent, src: [trends-get-started-sc], topics: [trends-features, trends-data],
   text: "The Google Trends Explore page, which Google called the heart of Trends, shows search interest in a query or topic and how it changes over time."}
- {id: D2-C762, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:9, ver: confirmed, src: [trends-explore-gemini-blog], topics: [trends-features],
   text: "Google launched a brand-new Google Trends Explore page at the beginning of 2026."}
- {id: D2-C763, s: D2-S24, label: stage, who: Omri Weisman, ev: [T:t12:9, T:t12:32], ver: undocumented, topics: [trends-features],
   text: "The legacy Google Trends Explore page is still available but will be retired: Google is adding its features to the new Explore page until everyone can move to the new one (no date was given).",
   quote: "the legacy Explore page, which is still available, but not for a long time"}
- {id: D2-C764, s: D2-S24, label: docs, ev: "", ver: source, src: [trends-compare-terms], topics: [trends-features],
   text: "Google's Trends Help says Google Trends compares up to 8 groups of terms at once, with up to 50 terms in each group, while Classic explore (the legacy page) supports 5 groups of up to 25 terms."}
- {id: D2-C765, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:10, ver: confirmed, src: [trends-trending-now-help, trends-get-started-sc], topics: [trends-features],
   text: "Trending now, a tab at the top of Google Trends, shows the topics people are searching for on Google right now."}
- {id: D2-C766, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:10, ver: consistent, src: [trending-now-blog-2024, trends-trending-now-help], topics: [trends-features],
   text: "Google said Trends' Trending now covered 125 countries at the time of the talk (October 2026), plus regions within many of those countries."}
- {id: D2-C767, s: D2-S24, label: docs, ev: "", ver: source, src: [trending-now-blog-2024, trends-trending-now-help], topics: [trends-features],
   text: "Google's August 2024 blog post said Trending now was available in 125 countries, with regional trends in 40 of them; the current Trends Help page says 100+ countries and regions."}
- {id: D2-C768, s: D2-S24, label: docs, ev: "", ver: source, src: [trends-trending-now-help, trends-get-started-sc], topics: [trends-data, trends-features],
   text: "Google's documentation says the Trending now page shows an approximate, bucketed search volume for each trend, with its growth against a predicted baseline."}
- {id: D2-C769, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:11, ver: undocumented, topics: [trends-data],
   text: "A Google Trends Explore chart presented on stage put worldwide search interest in Gemini above ChatGPT for the first time ever in September 2025, during a sharp surge for Gemini."}
- {id: D2-C770, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:12, ver: undocumented, topics: [trends-data],
   rel: [{type: extends, to: D1-C162}],
   text: "Google attributed the September 2025 surge in worldwide search interest for Gemini to the viral launch of Nano Banana (the image editing model in the Gemini app), as people searched for both Gemini and Nano Banana."}
- {id: D2-C771, s: D2-S24, label: docs, ev: "", ver: source, src: [nano-banana-blog], topics: [trends-data],
   text: "Google announced Nano Banana, a new image editing model from Google DeepMind in the Gemini app, on 26 August 2025."}
- {id: D2-C772, s: D2-S24, label: analysis, ev: "", ver: n/a, topics: [trends-data],
   text: "On stage the Nano Banana launch was placed in September 2025, but Google announced it on 26 August 2025, so the September 2025 surge in Gemini search interest described in the talk came in the weeks after the launch."}
- {id: D2-C773, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:12, ver: undocumented, topics: [trends-data, trends-for-seo],
   text: "After the Nano Banana surge faded, worldwide baseline search interest in Gemini stayed much higher than before, which Google read as a sustained gain in brand recognition."}
- {id: D2-C774, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:13, ver: consistent, src: [trends-faq], topics: [trends-data],
   text: "Real-world events such as product launches show up directly in Google Trends search interest graphs."}
- {id: D2-C775, s: D2-S24, label: analysis, ev: "", ver: n/a, topics: [trends-for-seo],
   text: "To judge a launch or campaign in Google Trends, compare the brand's baseline search interest before and after the spike, not only the height of the spike, because a lasting baseline lift is the durable gain."}
- {id: D2-C776, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:14, ver: undocumented, topics: [trends-data, search-evolution],
   text: "A Google Trends chart of worldwide search interest in AI from 2004 to mid-2025 showed a huge rise in the two to three years before mid-2025."}
- {id: D2-C827, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:14, ver: undocumented, topics: [trends-data, search-evolution],
   text: "Google said worldwide search interest in AI has climbed far higher since mid-2025, beyond the range of the 2004 to mid-2025 chart shown in the talk."}
- {id: D2-C777, s: D2-S24, label: stage, who: Omri Weisman, ev: [T:t12:15, T:t12:16], ver: undocumented, topics: [trends-data],
   text: "An early-2012 worldwide spike in Google Trends search interest for 'ai' was caused by the global hit song 'Ai Se Eu Te Pego', whose title contains the Portuguese word 'ai', not by interest in artificial intelligence."}
- {id: D2-C778, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:15, ver: undocumented, topics: [trends-features, trends-for-seo],
   text: "A Google Trends engineer found the cause of the 2012 'ai' spike by zooming in on that time range on the Explore page and reading the related queries."}
- {id: D2-C779, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:17, ver: consistent, src: [trends-faq], topics: [trends-for-seo, trends-data],
   text: "Google advised being curious and digging deeper when explaining a pattern in Google Trends, because context matters and the obvious explanation is sometimes wrong."}
- {id: D2-C780, s: D2-S24, label: docs, ev: "", ver: source, src: [trends-faq], topics: [trends-data],
   text: "Google's Trends FAQ says Google Trends adds statistical noise to protect privacy, so one-off spikes on queries with low or no search interest may be noise rather than real search activity."}
- {id: D2-C781, s: D2-S24, label: analysis, ev: "", ver: n/a, topics: [trends-for-seo, trends-data],
   text: "Before treating a spike in an ambiguous keyword as demand for your topic, zoom in on the period in Google Trends and check the commonly searched queries, since another meaning of the word (as with 'ai' in 2012) may be driving it."}
- {id: D2-C782, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:18, ver: undocumented, topics: [trends-data],
   text: "Worldwide Google Trends search interest for ski since 2004 shows strong seasonality, peaking every winter."}
- {id: D2-C783, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:18, ver: undocumented, topics: [trends-data],
   text: "Worldwide Google Trends search interest for ski also shows a mostly steady decline since 2004, which can be misread as falling search volume."}
- {id: D2-C784, s: D2-S24, label: stage, who: Omri Weisman, ev: [T:t12:19, T:t12:21], ver: confirmed, src: [trends-faq, gni-basics-trends], topics: [trends-data],
   text: "Google Trends shows search interest, not search volume: each point on its 0 to 100 scale represents the share of searches for the term out of all searches.",
   quote: "Search interest is not search volume."}
- {id: D2-C785, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:20, ver: consistent, src: [trends-faq, gni-basics-trends], topics: [trends-data],
   text: "Because total Google searches were far fewer in 2004 than today, a falling search interest share in Google Trends can hide a rising number of searches."}
- {id: D2-C786, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:20, ver: undocumented, topics: [trends-data],
   text: "Google said its internal numbers show the actual volume of ski-related searches is going up, even though ski's share of all searches in Google Trends has declined since 2004.",
   quote: "we can tell you from our own internal numbers that we're seeing on Google Trends: the actual volume is, in fact, going up."}
- {id: D2-C787, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:21, ver: consistent, src: [trends-faq], topics: [trends-data],
   text: "Google stressed that the difference between search interest and search volume matters most when reading very long time ranges in Google Trends."}
- {id: D2-C788, s: D2-S24, label: analysis, ev: "", ver: n/a, topics: [trends-data, trends-for-seo],
   text: "A Google Trends line that falls over many years is not proof that a market is shrinking; compare terms against each other in the same chart, and take absolute numbers from keyword tools or Search Console impressions."}
- {id: D2-C789, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:22, ver: consistent, src: [trends-get-started-sc], topics: [trends-for-seo],
   text: "Google presented three uses of Google Trends for content creation, marketing and SEO: keyword selection, scheduling and ideation."}
- {id: D2-C790, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:23, ver: confirmed, src: [trends-get-started-sc], topics: [trends-for-seo, trends-features],
   text: "For keyword selection, Google recommended entering candidate keywords on the Google Trends Explore page, setting the relevant country, region and time frame, and seeing which terms have the higher search interest."}
- {id: D2-C791, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:23, ver: consistent, src: [trends-get-started-sc], topics: [trends-for-seo],
   text: "Google recommended using the keywords with higher search interest in Google Trends in page titles and marketing campaigns."}
- {id: D2-C792, s: D2-S24, label: docs, ev: "", ver: source, src: [trends-get-started-sc], topics: [trends-for-seo, helpful-content],
   text: "Google's Search Central guide to Google Trends says to use Trends to inform a content strategy only where a topic fits the business and its users, and to focus on terms where the site has expertise and experience.",
   quote: "you shouldn't write about something just because it's trending"}
- {id: D2-C793, s: D2-S24, label: analysis, ev: "", ver: n/a, topics: [trends-for-seo, localisation],
   text: "Compare candidate keywords in Google Trends for the exact country or region where the page should rank, because the higher-interest wording can differ between markets that share a language."}
- {id: D2-C794, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:24, ver: consistent, src: [trends-explore-gemini-help, trends-related-searches], topics: [trends-features, trends-for-seo],
   text: "The 'Commonly searched queries' section of the new Google Trends Explore page, called related queries in the legacy Explore page, lists queries that people typed in the same search sessions as the entered term."}
- {id: D2-C795, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:24, ver: confirmed, src: [trends-related-searches, gni-basics-trends], topics: [trends-features, trends-data],
   text: "Google Trends' commonly searched queries come as top queries, with the highest search interest or volume, and rising queries, with the largest increase from the previous time frame to the current one."}
- {id: D2-C796, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:24, ver: confirmed, src: [trends-get-started-sc], topics: [trends-for-seo],
   text: "Google recommended checking both the top and the rising commonly searched queries in Google Trends when selecting keywords."}
- {id: D2-C797, s: D2-S24, label: analysis, ev: "", ver: n/a, topics: [trends-for-seo],
   text: "In Google Trends' commonly searched queries, rising queries point to emerging sub-topics worth a new page or section, while top queries show the established wording to reuse in titles and headings."}
- {id: D2-C798, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:25, ver: confirmed, src: [trends-get-started-sc], topics: [trends-for-seo, trends-data],
   text: "For scheduling, Google recommended checking on the Google Trends Explore page whether the topics relevant to your domain show seasonality; many topics do, though not all."}
- {id: D2-C799, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:25, ver: confirmed, src: [trends-get-started-sc], topics: [trends-for-seo],
   text: "Where a topic is seasonal in Google Trends, Google said the pattern predicts the next wave of search interest, which is the time to run a marketing campaign or have content ready."}
- {id: D2-C800, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:26, ver: undocumented, topics: [trends-data, trends-for-seo],
   text: "A Google Trends chart of US search interest over five years showed umbrella and sunscreen correlated, both peaking in June, against the common assumption that umbrella searches peak in winter."}
- {id: D2-C802, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:26, ver: confirmed, src: [trends-get-started-sc], topics: [trends-for-seo],
   text: "Google warned that assumptions about when search interest peaks are sometimes wrong, and advised checking the pattern in Google Trends for your own target market."}
- {id: D2-C803, s: D2-S24, label: analysis, ev: "", ver: n/a, topics: [trends-for-seo],
   text: "Publish or refresh seasonal content a few weeks before the seasonal rise that Google Trends shows for each target country, so the pages are crawled and indexed before demand peaks."}
- {id: D2-C804, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:27, ver: consistent, src: [trends-trending-now-help, trending-now-blog-2024], topics: [trends-for-seo, trends-features],
   text: "For ideation, Google recommended Google Trends' Trending now, where a real-world event shows up within about ten minutes as people hear the news and search for it."}
- {id: D2-C805, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:27, ver: undocumented, topics: [trends-for-seo],
   text: "Google said journalists use Google Trends' Trending now every morning to find content gaps: topics people are searching for that their publication may need to cover."}
- {id: D2-C806, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:29, ver: confirmed, src: [trends-explore-gemini-help], topics: [trends-features],
   text: "The new Google Trends Explore page has a 'Suggest search terms' button that opens an optional Gemini-based side panel."}
- {id: D2-C807, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:29, ver: confirmed, src: [trends-explore-gemini-help, trends-explore-gemini-blog], topics: [trends-features, trends-for-seo],
   text: "Google Trends' Suggest search terms picks the search terms or topics to compare from a plain-language request, which helps in a field you know little about, for example the most popular jazz singers in Japan."}
- {id: D2-C808, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:29, ver: consistent, src: [trends-explore-gemini-help], topics: [trends-features],
   text: "Google Trends' Suggest search terms combines Gemini's knowledge of the world with Google Trends data."}
- {id: D2-C809, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:29, ver: confirmed, src: [trends-explore-gemini-help, trends-explore-gemini-blog], topics: [trends-features],
   text: "Google Trends' Suggest search terms compares up to eight search terms at once."}
- {id: D2-C810, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:29, ver: undocumented, topics: [trends-features],
   text: "Google said the search terms returned by Google Trends' Suggest search terms are ranked by search interest."}
- {id: D2-C811, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:30, ver: consistent, src: [trends-quick-comparisons], topics: [trends-features],
   text: "Quick comparisons, a recent Google Trends Explore page feature, show year-over-year, month-over-month and week-over-week comparisons as chips when a single search term or topic is entered."}
- {id: D2-C812, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:30, ver: confirmed, src: [trends-quick-comparisons], topics: [trends-features],
   text: "Clicking a Google Trends quick comparison chip overlays the search interest of the two time periods being compared."}
- {id: D2-C813, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:31, ver: undocumented, src: [ser-trends-explore-maps], topics: [trends-features],
   text: "Google said colour maps of the geographic breakdown of search interest (regions within a country, or countries worldwide) had launched in the new Google Trends Explore page about a month before the October 2026 talk."}
- {id: D2-C814, s: D2-S24, label: press, ev: "", ver: source, src: [ser-trends-explore-maps], topics: [trends-features],
   text: "Search Engine Roundtable reported on 19 August 2026 that Google Trends had added explore maps and a regional breakdown that morning, as announced by Google on LinkedIn."}
- {id: D2-C815, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:32, ver: undocumented, src: [ser-trends-category-filter], topics: [trends-features],
   text: "The category filter of the legacy Google Trends Explore page has been reintroduced in the new Explore page."}
- {id: D2-C816, s: D2-S24, label: press, ev: "", ver: source, src: [ser-trends-category-filter], topics: [trends-features],
   text: "Search Engine Roundtable reported on 2 September 2026 that Google had announced category filters for the new Google Trends Explore page, usable with or without a query."}
- {id: D2-C817, s: D2-S24, label: analysis, ev: "", ver: n/a, topics: [trends-for-seo, localisation],
   text: "The regional search interest maps in Google Trends give a quick first check of demand by country or region before localising content for a new market."}
- {id: D2-C818, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:33, ver: consistent, src: [trends-home], topics: [trends-features],
   text: "Trends TV, at trends.google.com/tv, is a little-known Google Trends dashboard of what is trending on Google right now, meant for an office screen or as a screensaver."}
- {id: D2-C819, s: D2-S24, label: stage, who: Omri Weisman, ev: T:t12:34, ver: consistent, src: [trends-tutorials-blog, trends-get-started-sc], topics: [trends-features, trends-for-seo],
   text: "Google has published a YouTube series of about eight episodes on using Google Trends for research, journalism, marketing and SEO."}
