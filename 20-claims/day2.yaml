# Day 2 claims. One record = one statement. Schema v2 (see _system/schema/claim.md).
# label: slide | stage | docs | press | analysis      ver: confirmed | consistent | undocumented | source | n/a
# ev: slide photo stem, video:<stem>, or T:<transcript>:<paragraph> (cleaned transcripts in 10-sources/day2/clean, private). src: keys in sources.yaml.
