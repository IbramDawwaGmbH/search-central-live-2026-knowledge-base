# ---------- D3-S02 Welcome to serving and ranking day! ----------
- {id: D3-C001, s: D3-S02, label: slide, ev: IMG_4795, ver: consistent, src: [how-search-works], topics: [pipeline-overview, query-understanding, retrieval],
   text: "Google's opening slide for serving day showed serving as the third stage after crawling and indexing, and drew Google's serving infrastructure as query understanding and retrieval leading into the index, then ranking and search features leading back to the user, for the example query 'Where to eat jamon'."}

# ---------- D3-S03 Making sense of users' queries ----------
- {id: D3-C002, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:1, ver: n/a, topics: [query-understanding],
   text: "Google's query understanding talk set out to show how the changes Google makes to users' queries relate to what a website can provide."}
- {id: D3-C003, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:2, ver: consistent, src: [hsw-ranking-results], topics: [query-understanding],
   text: "A Google speaker said that a messy query, made of a hotel location copied from a website plus a question about Italian food, was figured out by Google's systems, which came up with answers for it."}
- {id: D3-C004, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:3, ver: consistent, src: [how-search-works], topics: [query-understanding, pipeline-overview],
   text: "Google placed query understanding in the traditional part of Search, the part where answers are looked up in an index and then presented and ranked."}
- {id: D3-C005, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:4, ver: n/a, topics: [search-evolution],
   text: "Google said it has no name for traditional, non-AI Search, only for its Search generative AI features, and that the two play together but are easier to understand separately."}
- {id: D3-C006, s: D3-S03, label: stage, who: John Mueller, ev: [T:t01:5, T:t01:6], ver: consistent, src: [results-language-help, hsw-ranking-results], topics: [query-understanding, page-language],
   rel: [{type: extends, to: D2-C654}],
   text: "Google's first step in understanding almost any query is to detect its language, which tells Google roughly what content the user wants: a query in German suggests German content, a query in English English content."}
- {id: D3-C007, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:7, ver: consistent, src: [results-language-help], topics: [query-understanding, page-language],
   rel: [{type: extends, to: D1-C215}],
   text: "Query language detection works poorly when someone searches only for a brand name, such as Facebook or Google, because the query does not show which language the user wants results in."}
- {id: D3-C008, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:7, ver: consistent, src: [results-language-help, localized-versions], topics: [query-understanding, page-language],
   text: "For brand-only queries Google falls back on other information, such as the user's location and browser settings, to work out the language of the results."}
- {id: D3-C009, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:7, ver: consistent, src: [results-language-help, multi-regional-sites], topics: [page-language, hreflang],
   text: "Because a brand-only query does not reveal the user's language, Google sometimes struggles to show the right language version of a page for brand searches."}
- {id: D3-C010, s: D3-S03, label: analysis, ev: "", ver: n/a, topics: [hreflang, page-language],
   text: "Sites with several language versions should not leave brand searches to chance: annotate the versions with hreflang and offer a visible language switcher, because Google may have only the user's location and browser settings to choose a version."}
- {id: D3-C011, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:8, ver: undocumented, topics: [non-latin-scripts, query-understanding],
   rel: [{type: extends, to: D2-C320}],
   text: "Google named Thai as a language that makes query understanding more complex because it does not separate words with spaces; the speaker added, hedging with 'apparently', that Thai uses spaces to separate sentences."}
- {id: D3-C012, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:9, ver: undocumented, topics: [query-understanding],
   text: "After detecting the query language and separating the words, Google removes words it thinks matter little to the query, such as 'a' and 'of', known as stop words."}
- {id: D3-C013, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:10, ver: undocumented, topics: [query-understanding, tokenization],
   rel: [{type: extends, to: D2-C321}, {type: extends, to: D2-C737}],
   text: "Google's query processing deliberately mirrors indexing: a query is transformed into something that can be matched against the index, and stop word removal is part of that transformation."}
- {id: D3-C014, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:11, ver: undocumented, topics: [query-understanding],
   text: "For some searches the stop words are important, and Google then tries to recognise the whole phrase, stop words included, as an entity; in indexing, such words are indexed together."}
- {id: D3-C015, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:12, ver: consistent, src: [trends-compare-terms], topics: [query-understanding, trends-features],
   rel: [{type: extends, to: D2-C761}],
   text: "Google said the difference between words and entities can be seen in Google Trends, where a term can be searched as words or as an entity (Trends calls these a search term and a topic)."}
- {id: D3-C016, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:12, ver: undocumented, topics: [query-understanding],
   text: "When a query names an entity, Google treats it as a request for that entity rather than as a collection of separate words."}
- {id: D3-C017, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:13, ver: undocumented, topics: [query-understanding],
   text: "In ranking, Google can match a query's words or its entity, and, the speaker said with a 'probably', mixes both to some degree."}
- {id: D3-C018, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:14, ver: consistent, src: [hsw-ranking-results], topics: [query-understanding, query-fanout],
   text: "Google expands queries with synonyms in traditional Search; the speaker compared this to query fan-out but said it is part of traditional Search, not of the AI features."}
- {id: D3-C019, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:15, ver: undocumented, topics: [query-understanding],
   text: "In Google's example, the query word 'photograph' could be expanded to 'image', 'picture' or 'photo', but one German candidate had to be dropped because the similar German word means 'photographer', so expansions are language-specific."}
- {id: D3-C020, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:16, ver: consistent, src: [hsw-ranking-results], topics: [query-understanding],
   text: "According to Google's ranking teams, the synonym system is one of the most important parts of how Google handles a query.",
   quote: "they say that the synonym system is one of the most important parts"}
- {id: D3-C021, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:16, ver: confirmed, src: [hsw-ranking-results], topics: [query-understanding],
   text: "Synonyms matter because users often phrase a query differently from the way content is indexed; synonym expansion makes the words Google looks up findable in its index."}
- {id: D3-C022, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:16, ver: undocumented, topics: [query-understanding],
   text: "For technical terms, Google's synonym swapping can return either a technical page or a simplified page for the same query."}
- {id: D3-C023, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:17, ver: confirmed, src: [seo-starter-guide], topics: [query-understanding, helpful-content],
   text: "Site owners do not need to list all synonyms of a term on a page, because Google already knows the synonyms and looks for them on pages too.",
   quote: "you don't have to do that SEO meme of, like, list all the synonyms on your page"}
- {id: D3-C024, s: D3-S03, label: analysis, ev: "", ver: n/a, topics: [query-understanding, helpful-content],
   text: "Write each page in the words its audience uses and drop synonym lists added for search engines: Google adds synonyms at query time, and blocks of keyword variants read as keyword stuffing, which Google's spam policies prohibit."}
- {id: D3-C025, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:18, ver: consistent, src: [hsw-ranking-results], topics: [query-understanding],
   text: "Google adds alternative words to a query automatically, which the speaker compared to a user joining words with the OR search operator."}
- {id: D3-C026, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:18, ver: undocumented, topics: [query-understanding],
   text: "Google suggested a test: a search that lists a term's synonyms joined with OR will probably return results very similar to the plain query, because Google adds the synonyms itself (part of the sentence is unclear in the recording)."}
- {id: D3-C027, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:19, ver: consistent, src: [search-refine-help], topics: [query-understanding],
   text: "Googlers write queries in brackets, for example [spicy cheese store near me], so when reporting a search problem to a Googler, putting the query in brackets shows that it is a query someone searched."}
- {id: D3-C028, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:20, ver: consistent, src: [hsw-ranking-results], topics: [query-understanding],
   text: "Google rewrites pretty much every query, through synonym expansion and in other ways, to understand better what the query means.",
   quote: "pretty much all queries are rewritten"}
- {id: D3-C029, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:20, ver: undocumented, topics: [query-understanding],
   text: "Internally, a short query can turn into a much longer rewritten query, because Google adds entities, synonyms and other information before looking it up."}
- {id: D3-C030, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:21, ver: undocumented, topics: [query-understanding],
   text: "In Google's rewrite example, [fried chicken place in Barcelona] keeps 'fried' and 'chicken' as two words, may add an entity for fried chicken, and replaces 'place' with alternatives such as 'area', 'location' or 'restaurant'."}
- {id: D3-C031, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:21, ver: undocumented, topics: [query-understanding],
   text: "Some alternatives in a rewritten query make no sense, such as 'fried chicken area in Barcelona', which is harmless because few indexed pages match them."}
- {id: D3-C032, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:22, ver: undocumented, topics: [query-understanding],
   text: "In a rewritten query, a place name such as Barcelona can stay a word or be swapped for an entity, possibly a more specific location."}
- {id: D3-C033, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:22, ver: consistent, src: [hsw-ranking-results], topics: [query-understanding],
   text: "For a query containing 'near me', Google understands that the user wants results near their location, not pages containing the words 'near me', and rewrites the query accordingly."}
- {id: D3-C034, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:23, ver: undocumented, topics: [query-understanding],
   text: "Some synonyms are contextual and depend on the rest of the query: 'GM' probably means General Motors in [GM car], general manager in [GM restaurants] and genetically modified in [GM barley]."}
- {id: D3-C035, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:24, ver: consistent, src: [hsw-ranking-results], topics: [query-understanding],
   text: "Google builds its synonyms as automatically as possible, behind the scenes, rather than having linguists catalogue every language and all possible synonyms."}
- {id: D3-C036, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:24, ver: undocumented, topics: [query-understanding],
   text: "Google's synonyms need not be synonyms linguistically: words people use interchangeably are treated as synonyms, because the aim is to find the right content in the index.",
   quote: "we don't need to be technically accurate"}
- {id: D3-C037, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:25, ver: undocumented, topics: [query-understanding],
   text: "When Google highlights a word in its results that looks like the wrong synonym, the reason is probably that many people use the two words interchangeably."}
- {id: D3-C038, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:26, ver: undocumented, topics: [query-understanding],
   text: "Besides synonyms, Google detects 'siblings', words in the same category that are related but not interchangeable, such as Canon and Nikon."}
- {id: D3-C039, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:27, ver: undocumented, topics: [query-understanding],
   text: "Because Canon and Nikon are siblings rather than synonyms, a search for [Canon camera] should not show Nikon cameras."}
- {id: D3-C040, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:27, ver: undocumented, topics: [query-understanding],
   text: "Google learns synonyms and siblings from search behaviour: words people search with in the same way become synonyms, while frequent comparison queries mark words as not interchangeable (the end of the sentence is unclear in the recording)."}
- {id: D3-C041, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:28, ver: consistent, src: [hsw-ranking-results, results-language-help], topics: [query-understanding, localisation],
   text: "Google does not prefer English words on pages in other languages; the idea that Google, as an American company, wants to see everything in English is wrong."}
- {id: D3-C042, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:28, ver: consistent, src: [seo-starter-guide], topics: [query-understanding, localisation],
   text: "Where Google recognises an English term and its local-language equivalent as synonyms, a page does not need to contain both."}
- {id: D3-C043, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:29, ver: undocumented, topics: [query-understanding],
   text: "To check whether Google treats two terms as the same, search for each: [Iberico ham] and [jamón ibérico] both brought up the same entity, so Google understands them as the same thing."}
- {id: D3-C044, s: D3-S03, label: stage, who: John Mueller, ev: [T:t01:29, T:t01:30], ver: consistent, src: [seo-starter-guide, spam-policies], topics: [query-understanding, helpful-content],
   text: "When Google already matches a term's variants, there is no need to add them to pages artificially; mention another name only where visitors might not understand otherwise.",
   quote: "I wouldn't artificially just stuff those variations in there."}
- {id: D3-C045, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:31, ver: undocumented, topics: [query-understanding],
   text: "At the time of the talk, a search for [Spanish cured ham] brought up mainly a Wikipedia page, showing that Google does not automatically equate that phrase with Iberico ham."}
- {id: D3-C046, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:31, ver: consistent, src: [seo-starter-guide], topics: [query-understanding, helpful-content],
   text: "When Google does not treat a phrase as a synonym, such as 'Spanish cured ham' for Iberico ham, a page that wants to cover that phrase should use it in its text."}
- {id: D3-C047, s: D3-S03, label: analysis, ev: "", ver: n/a, topics: [query-understanding, helpful-content],
   text: "Before writing, search for each variant of a key term: if the variants bring up the same entity or near-identical results, use the term your audience uses; if one variant returns unrelated results, write that variant on the page."}
- {id: D3-C048, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:32, ver: confirmed, src: [accented-characters-blog], topics: [non-latin-scripts, query-understanding],
   rel: [{type: extends, to: D2-C600}],
   text: "Google generally treats spellings with and without diacritics as synonyms behind the scenes, for example a German 'ü' written as 'ü', as 'ue' or left out."}
- {id: D3-C049, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:33, ver: undocumented, topics: [non-latin-scripts, query-understanding],
   text: "Google sometimes gets diacritic variants wrong, so it is worth searching to see whether Google understands a variant; if it does, pick one spelling and use it."}
- {id: D3-C050, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:34, ver: consistent, src: [seo-starter-guide], topics: [non-latin-scripts, helpful-content],
   text: "Google's recommendation for diacritics, non-English words, product names and spelling variants is to focus first on what users actually search for."}
- {id: D3-C051, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:34, ver: undocumented, topics: [non-latin-scripts],
   rel: [{type: extends, to: D2-C599}],
   text: "Users expect content written the way they search: in some languages they search in Latin characters, in others in the local script, and Hindi users, for example, search both in Hindi and in Latin letters."}
- {id: D3-C052, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:34, ver: n/a, topics: [helpful-content, non-latin-scripts],
   text: "Google said focusing on what users actually do makes more sense than trying to match what the search engine does."}
- {id: D3-C053, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:35, ver: consistent, src: [seo-starter-guide], topics: [non-latin-scripts, query-understanding],
   text: "Spelling variants need no artificial focus: users are often fine finding one version of a word on one page and another version elsewhere."}
- {id: D3-C054, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:35, ver: n/a, topics: [query-understanding],
   text: "Google advised double-checking any word you are unsure about by searching for it on Google and looking at what comes up."}
- {id: D3-C055, s: D3-S03, label: analysis, ev: "", ver: n/a, topics: [non-latin-scripts, query-understanding],
   text: "For audiences that type the same words in two scripts or spellings (Hindi in Devanagari and in Latin letters, German with and without umlauts), check which forms appear in Search Console's queries and use those forms in headings and key text."}
- {id: D3-C056, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:36, ver: consistent, src: [ai-optimization-guide], topics: [seo-vs-geo, query-understanding],
   rel: [{type: repeats, to: D1-C051}],
   text: "Google's generative AI features in Search build on the traditional ways of searching, so query understanding also flows into AI Overviews and AI Mode."}
- {id: D3-C057, s: D3-S03, label: slide, who: John Mueller, ev: [IMG_4796, T:t01:37], ver: consistent, src: [ai-optimization-guide], topics: [query-fanout, pipeline-overview],
   rel: [{type: extends, to: D1-C038}],
   text: "Google's slide on how LLM features with grounding generally work showed a query going to both the search engine and an LLM, the search engine's results going to the LLM, the LLM generating fan-out queries that go back to the search engine, and the LLM returning answers with links.",
   quote: "How LLM features with grounding generally work", quote_checked: true}
- {id: D3-C058, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:37, ver: confirmed, src: [ai-optimization-guide], topics: [query-fanout],
   rel: [{type: repeats, to: D1-C053}],
   text: "In Google's AI features, the query and the search results are additionally sent to an LLM, which returns new queries for Google to run."}
- {id: D3-C059, s: D3-S03, label: stage, who: John Mueller, ev: [T:t01:37, T:t01:38], ver: consistent, src: [ai-optimization-guide], topics: [query-fanout, query-understanding],
   rel: [{type: extends, to: D2-C727}, {type: extends, to: D1-C172}],
   text: "Google treats fan-out queries generated by the LLM the same way as queries typed by users, so understanding how normal queries work explains fan-out queries too."}
- {id: D3-C060, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:38, ver: undocumented, topics: [query-fanout],
   text: "Google said a short video showing how one query is expanded into several fan-out queries has been in its documentation for a while."}
- {id: D3-C061, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:39, ver: consistent, src: [ai-features-guide], topics: [query-fanout],
   rel: [{type: extends, to: D2-C729}, {type: extends, to: D1-C225}],
   text: "Google tries to make fan-out queries distinct from each other for better coverage, avoiding asking the same question several times, which would return the same answers."}
- {id: D3-C062, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:40, ver: consistent, src: [ai-optimization-guide], topics: [query-fanout, query-understanding],
   text: "Every fan-out query goes through Google's query understanding, including synonym expansion."}
- {id: D3-C063, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:40, ver: undocumented, topics: [query-fanout, measurement],
   rel: [{type: extends, to: D1-C124}],
   text: "Google said fan-out queries are not added to Search Console, because Google considers them part of its infrastructure.",
   quote: "Fan-out queries are not added in Search Console, because they're basically a part of our infrastructure."}
- {id: D3-C064, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:41, ver: consistent, src: [gemini-grounding-search], topics: [query-fanout],
   text: "Individual fan-out queries can be seen in some other places, such as Gemini, some search APIs and other LLM systems."}
- {id: D3-C065, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:42, ver: consistent, src: [ai-optimization-guide], topics: [query-fanout, seo-vs-geo],
   rel: [{type: extends, to: D1-C129}],
   text: "Because every system runs fan-out differently, Google advised understanding that fan-out happens but not overfocusing on individual fan-out queries or on how to rank for them.",
   quote: "I would not overfocus on which individual fan-out queries happen and how can I rank for those"}
- {id: D3-C066, s: D3-S03, label: analysis, ev: "", ver: n/a, topics: [query-fanout, seo-vs-geo],
   text: "Do not build pages for fan-out queries copied from Gemini or other LLM tools: they differ from system to system and Search Console does not report them. Cover a topic's real subquestions on solid pages instead."}
- {id: D3-C067, s: D3-S03, label: slide, who: John Mueller, ev: [IMG_4797, T:t01:43], ver: consistent, src: [hsw-ranking-results], topics: [query-understanding],
   text: "Google's summary slide on query understanding told site owners not to worry about typos and plurals, which Google rewrites automatically.",
   quote: "Don't worry about typos & plurals!", quote_checked: true}
- {id: D3-C068, s: D3-S03, label: slide, who: John Mueller, ev: [IMG_4797, T:t01:43], ver: confirmed, src: [hsw-ranking-results], topics: [query-understanding],
   text: "Google's summary slide on query understanding said that synonyms are expanded automatically."}
- {id: D3-C069, s: D3-S03, label: slide, who: John Mueller, ev: [IMG_4797, T:t01:43], ver: undocumented, topics: [query-understanding],
   text: "Google's summary slide on query understanding said Google's synonyms are not always language-based; on stage this was explained as words people use interchangeably counting as synonyms even when they are not synonyms linguistically.",
   quote: "Google's synonyms aren't always language-based", quote_checked: true}
- {id: D3-C070, s: D3-S03, label: slide, who: John Mueller, ev: [IMG_4797, T:t01:43], ver: undocumented, topics: [non-latin-scripts],
   rel: [{type: repeats, to: D2-C320}],
   text: "Google's summary slide on query understanding noted that some languages do not use spaces between words, which complicates query understanding."}
- {id: D3-C071, s: D3-S03, label: slide, who: John Mueller, ev: [IMG_4797, T:t01:43], ver: consistent, src: [ai-features-guide, ai-optimization-guide], topics: [query-fanout],
   text: "Google's summary slide on query understanding said query fan-out does even more expansion than synonym expansion."}
- {id: D3-C072, s: D3-S03, label: slide, who: John Mueller, ev: [IMG_4797, T:t01:43], ver: n/a, topics: [query-understanding],
   text: "Google's summary slide on query understanding concluded that all this query expansion gives site owners many opportunities for their content to be found and shown.",
   quote: "There are many opportunities to find and show your content.", quote_checked: true}
- {id: D3-C073, s: D3-S03, label: stage, who: John Mueller, ev: T:t01:44, ver: consistent, src: [how-search-works], topics: [pipeline-overview, retrieval],
   text: "After query understanding and expansion, Google sends the queries to the index to look up pages, the retrieval step."}
- {id: D3-C074, s: D3-S03, label: stage, who: Gary Illyes, ev: T:t01:45, ver: consistent, src: [hsw-organizing-information], topics: [index-structure, retrieval],
   rel: [{type: repeats, to: D2-C733}],
   text: "Google's index uses posting lists: for each word, a list of the URLs associated with that word."}
- {id: D3-C075, s: D3-S03, label: stage, who: Gary Illyes, ev: T:t01:46, ver: undocumented, topics: [retrieval, query-understanding],
   rel: [{type: extends, to: D2-C736}, {type: extends, to: D2-C738}],
   text: "At retrieval, Google splits the query into words, applies query understanding and expansion, and matches the words and their expansions against the posting lists."}
- {id: D3-C076, s: D3-S03, label: stage, who: Gary Illyes, ev: T:t01:47, ver: consistent, src: [how-search-works], topics: [retrieval, indexing-signals],
   rel: [{type: repeats, to: D2-C722}],
   text: "For retrieval, Google uses signals attached individually to each document in the index."}
- {id: D3-C077, s: D3-S03, label: stage, who: Gary Illyes, ev: T:t01:47, ver: consistent, src: [hsw-ranking-results], topics: [retrieval, index-structure],
   rel: [{type: extends, to: D2-C740}],
   text: "The first condition for retrieving a document is that the query's words, or its concepts in the case of vectors or embeddings, are in the document or related to it."}
- {id: D3-C078, s: D3-S03, label: stage, who: Gary Illyes, ev: T:t01:48, ver: undocumented, topics: [retrieval],
   text: "Because a query like [best fried chicken ever] can match millions of pages, Google already orders the candidates during retrieval, before ranking starts."}
- {id: D3-C079, s: D3-S03, label: stage, who: Gary Illyes, ev: T:t01:49, ver: consistent, src: [how-search-works], topics: [retrieval, indexing-signals],
   rel: [{type: extends, to: D2-C722}, {type: extends, to: D2-C649}],
   text: "To order candidates at retrieval, Google uses signals collected during indexing, and the first two are language and country."}
- {id: D3-C080, s: D3-S03, label: stage, who: Gary Illyes, ev: T:t01:50, ver: confirmed, src: [multi-regional-sites], topics: [retrieval, page-language],
   rel: [{type: extends, to: D2-C654}],
   text: "At retrieval, Google tries to match results to the user's language wherever possible: someone searching in Spanish does not necessarily want results in Italian."}
- {id: D3-C081, s: D3-S03, label: stage, who: Gary Illyes, ev: T:t01:50, ver: n/a, topics: [page-language, localisation],
   text: "Where Google cannot find results in the user's language, the speaker called the gap an opportunity for whoever targets those words."}
- {id: D3-C082, s: D3-S03, label: stage, who: Gary Illyes, ev: T:t01:51, ver: consistent, src: [multi-regional-sites, how-search-works], topics: [retrieval, geotargeting],
   rel: [{type: extends, to: D2-C649}],
   text: "Country is the second retrieval signal: a user searching from Switzerland wants cheese from Switzerland, not from Germany, and a user in Spain is poorly served by results targeting a South American country."}
- {id: D3-C083, s: D3-S03, label: stage, who: Gary Illyes, ev: T:t01:52, ver: undocumented, topics: [retrieval, ranking-systems],
   rel: [{type: extends, to: D2-C722}],
   text: "Google called quality the most important of the signals used to order candidates at retrieval: a URL of high quality is more likely to be retrieved from the index for specific queries.",
   quote: "if the quality of a URL is high, then it's more likely to be retrieved from the index for specific queries."}
- {id: D3-C084, s: D3-S03, label: stage, who: Gary Illyes, ev: T:t01:52, ver: consistent, src: [how-search-works, hsw-ranking-results], topics: [ranking-systems, retrieval],
   text: "The same quality signal that Google uses at retrieval is also used in ranking when results are served."}
- {id: D3-C085, s: D3-S03, label: analysis, ev: "", ver: n/a, topics: [ranking-systems, retrieval],
   text: "Quality acts twice: a page Google judges low in quality is less likely to be retrieved as a candidate at all, so it may never reach ranking, which makes content quality a precondition rather than a final tweak."}
- {id: D3-C086, s: D3-S03, label: analysis, ev: "", ver: n/a, topics: [page-language, geotargeting, hreflang],
   text: "Make each page's language and target country unambiguous (one main language per page, hreflang between versions, local prices, addresses and shipping details), because Google applies language and country already at retrieval, before ranking."}
- {id: D3-C087, s: D3-S03, label: docs, ev: "", ver: source, src: [hsw-ranking-results], topics: [query-understanding],
   text: "Google's How Search Works page says understanding a query ranges from recognising and correcting spelling mistakes to a synonym system that finds relevant documents without the exact words searched, such as 'adjust laptop brightness' for 'change laptop brightness'."}
- {id: D3-C088, s: D3-S03, label: docs, ev: "", ver: source, src: [hsw-ranking-results], topics: [query-understanding],
   text: "Google's How Search Works page says the language models it builds to match a query's few words to the most useful content took over five years to develop and significantly improve results in over 30% of searches across languages."}
- {id: D3-C089, s: D3-S03, label: docs, ev: "", ver: source, src: [seo-starter-guide], topics: [query-understanding, helpful-content],
   text: "Google's SEO Starter Guide advises anticipating the different words readers search with (some search for 'charcuterie', others for 'cheese board') but not worrying about every variation, because Google's language matching systems relate pages to queries without the exact terms."}
- {id: D3-C090, s: D3-S03, label: docs, ev: "", ver: source, src: [results-language-help], topics: [query-understanding, page-language],
   text: "Google's Search Help says the language of search results is chosen from the language of the query, the user's Google language setting, the device's languages and the user's location, which helps when a word such as 'taxi' is the same in several languages."}
- {id: D3-C091, s: D3-S03, label: docs, ev: "", ver: source, src: [accented-characters-blog], topics: [non-latin-scripts, query-understanding],
   text: "A 2006 Search Central blog post says Google considers pages with and without accents for a query word (México and Mexico), and that which accented characters count as equivalent depends on the searcher's interface language."}
- {id: D3-C092, s: D3-S03, label: docs, ev: "", ver: source, src: [multi-regional-sites], topics: [page-language, geotargeting],
   text: "Google's guide to multi-regional and multilingual sites says Google Search tries to find pages that match the language of the searcher, and that geotargeting a site to one country can improve its rankings there at the expense of other locales."}
- {id: D3-C093, s: D3-S03, label: docs, ev: "", ver: source, src: [sc-impressions-help], topics: [query-fanout, measurement],
   text: "Google's Search Console help says AI Mode groups the user's question into subtopics and searches for each one simultaneously, and that a follow-up question in AI Mode is essentially a new query."}
- {id: D3-C094, s: D3-S03, label: docs, ev: "", ver: source, src: [gemini-grounding-search], topics: [query-fanout],
   text: "Google's Gemini API documentation on grounding with Google Search says the model automatically generates and runs one or more search queries when needed, and the response lists the search queries it executed."}
- {id: D3-C095, s: D3-S03, label: analysis, ev: "", ver: n/a, src: [sc-impressions-help, genai-perf-reports-blog, ai-features-guide], topics: [query-fanout, measurement],
   text: "No Google documentation states that fan-out queries stay out of Search Console, but the docs fit the stage statement: the Performance report counts AI Overviews and AI Mode under the user's own queries, and the Generative AI reports have no query dimension."}
- {id: D3-C096, s: D3-S03, label: analysis, ev: "", ver: n/a, src: [how-search-works, hsw-ranking-results], topics: [ranking-systems, retrieval],
   text: "The retrieval talk went further than Google's documentation, which says Search returns the highest-quality and most relevant results and lists quality among key ranking signals, but never describes quality as deciding which pages are retrieved from the index at all."}

# ---------- D3-S04 Lightning session K: Facets of quality ----------
- {id: D3-C097, s: D3-S04, label: stage, ev: [T:t02:9, T:t02:14], ver: n/a, topics: [helpful-content, seo-scope],
   text: "In Lightning session K (Facets of quality), a community speaker argued that SEO is for humans: write for people and the problems they have, rather than to please Googlebot.",
   quote: "SEO is for humans"}
- {id: D3-C098, s: D3-S04, label: stage, ev: [T:t02:1, T:t02:2], ver: undocumented, topics: [helpful-content, spam-detection],
   text: "A community speaker recalled that around 2009 writers bent titles and phrases to include a keyword because their CMS counted keyword density, and said that hitting the ratio really worked at the time."}
- {id: D3-C099, s: D3-S04, label: analysis, ev: "", ver: n/a, src: [spam-policies, helpful-content], topics: [helpful-content, spam-detection],
   text: "Do not treat keyword-density or word-count scores from CMS plugins as editorial targets: Google's spam policies treat filling a page with keywords to manipulate rankings as keyword stuffing, and Google says it has no preferred word count."}
- {id: D3-C100, s: D3-S04, label: docs, ev: "", ver: source, src: [spam-policies], topics: [spam-detection, helpful-content],
   text: "Google's spam policies define keyword stuffing as filling a web page with keywords or numbers to manipulate rankings in Google Search, for example repeating the same words or phrases so often that it sounds unnatural.",
   quote: "filling a web page with keywords or numbers in an attempt to manipulate rankings in Google Search results"}
- {id: D3-C101, s: D3-S04, label: docs, ev: "", ver: source, src: [helpful-content], topics: [helpful-content],
   text: "Google's guide to people-first content lists writing to a particular word count, in the belief that Google prefers one, as a warning sign of search engine-first content, and says Google has no preferred word count.",
   quote: "Google has a preferred word count? (No, we don't.)"}
- {id: D3-C102, s: D3-S04, label: stage, ev: [T:t02:3, T:t02:4], ver: n/a, topics: [helpful-content],
   text: "Entering the Polish market late, against strong competition and with a small team, a community speaker's team could not be a 'department store' that covers everything, so it went really deep instead of going broad."}
- {id: D3-C103, s: D3-S04, label: docs, ev: "", ver: source, src: [helpful-content], topics: [helpful-content],
   text: "Google's guide to people-first content lists producing lots of content on many different topics, in the hope that some of it performs well in search results, as a warning sign of search engine-first content."}
- {id: D3-C104, s: D3-S04, label: stage, ev: T:t02:4, ver: n/a, topics: [trends-for-seo, helpful-content],
   rel: [{type: extends, to: D2-C789}],
   text: "To choose what to cover in depth, a community speaker's team used Google Trends to find what people in their market were interested in and then gave them that content."}
- {id: D3-C105, s: D3-S04, label: stage, ev: T:t02:4, ver: n/a, topics: [helpful-content],
   text: "A community speaker reported that going deep instead of broad took the Polish edition of a large Spanish software-download website into the top three technology websites in Poland (period not stated)."}
- {id: D3-C106, s: D3-S04, label: stage, ev: T:t02:4, ver: n/a, topics: [helpful-content],
   text: "With a much smaller team, the Polish edition of a large Spanish software-download website reached double the organic traffic of the site's English edition, a community speaker reported (period and measure not stated)."}
- {id: D3-C107, s: D3-S04, label: stage, ev: T:t02:5, ver: n/a, topics: [helpful-content, seo-scope],
   text: "Because Googlebot is not a human, the speaker's team at the time thought more about Googlebot than about human readers, a community speaker said."}
- {id: D3-C108, s: D3-S04, label: stage, ev: T:t02:6, ver: undocumented, topics: [tokenization, helpful-content],
   text: "A community speaker compared Googlebot to an inspector who cannot enter the shop and only looks through the window, seeing the page as ones and zeros, which the speaker linked to tokenization."}
- {id: D3-C109, s: D3-S04, label: analysis, ev: "", ver: n/a, src: [how-search-works], topics: [tokenization],
   rel: [{type: extends, to: D2-C318}],
   text: "The inspector metaphor blends two steps: Googlebot fetches pages during crawling, while tokenization happens later when the page is processed for the index, as Google explained on Day 2."}
- {id: D3-C110, s: D3-S04, label: stage, ev: T:t02:7, ver: n/a, topics: [helpful-content],
   text: "Because a bot that counts things was easy to work around, SEOs made the facade of their sites nice and fancy instead of focusing on what was inside, sometimes with no real shop behind the facade, a community speaker said."}
- {id: D3-C111, s: D3-S04, label: stage, ev: T:t02:8, ver: consistent, src: [ranking-systems-guide], topics: [search-updates, search-evolution, helpful-content],
   text: "Google updates such as Panda and Penguin made Google steadily better at seeing past the facade of a site, a community speaker said."}
- {id: D3-C112, s: D3-S04, label: docs, ev: "", ver: source, src: [ranking-systems-guide], topics: [search-updates, search-evolution, helpful-content],
   text: "Google's ranking systems guide lists Panda as a retired system: announced in 2011 to better ensure that high-quality and original content appears in search results, it became part of the core ranking systems in 2015."}
- {id: D3-C113, s: D3-S04, label: docs, ev: "", ver: source, src: [ranking-systems-guide], topics: [search-updates, search-evolution, spam-detection],
   text: "Google's ranking systems guide lists Penguin as a retired system: announced in 2012 to combat link spam, it was integrated into the core ranking systems in 2016."}
- {id: D3-C114, s: D3-S04, label: analysis, ev: "", ver: n/a, src: [ranking-systems-guide], topics: [search-updates, search-evolution],
   text: "Of the two updates named on stage as letting Google see past a site's facade, only Panda targeted content quality; Penguin targeted link spam, and both have been part of Google's core ranking systems since 2015 and 2016, so neither runs as a separate system today."}
- {id: D3-C115, s: D3-S04, label: stage, ev: T:t02:8, ver: consistent, src: [ranking-systems-guide], topics: [ai-in-search-systems, helpful-content],
   text: "With AI, Google can finally look inside the shop and check how a page's content matches its storefront, a community speaker said."}
- {id: D3-C116, s: D3-S04, label: stage, ev: T:t02:9, ver: consistent, src: [helpful-content, ranking-systems-guide], topics: [helpful-content],
   rel: [{type: repeats, to: D1-C047}],
   text: "Google's long-standing advice to write for people and give them what they want has become true in practice because Googlebot has become more and more human, a community speaker argued."}
- {id: D3-C117, s: D3-S04, label: docs, ev: "", ver: source, src: [helpful-content], topics: [helpful-content],
   text: "Google's guide to people-first content says its automated ranking systems are designed to prioritise helpful, reliable information created to benefit people, not content created to manipulate search engine rankings."}
- {id: D3-C118, s: D3-S04, label: docs, ev: "", ver: source, src: [ranking-systems-guide], topics: [helpful-content, search-updates],
   text: "Google's ranking systems guide says the helpful content system, announced in 2022 as the Helpful Content Update to show original, helpful content written by people, for people, became part of the core ranking systems in March 2024."}
- {id: D3-C119, s: D3-S04, label: stage, ev: T:t02:10, ver: n/a, topics: [helpful-content, measurement],
   text: "In a community speaker's case study from the speaker's current company, a well-written, complex and complete article got 1,600,000 impressions, while an article written for a very specific audience got 46,000 impressions over the same period (data source and period length not stated)."}
- {id: D3-C120, s: D3-S04, label: stage, ev: T:t02:11, ver: n/a, topics: [helpful-content],
   text: "The niche article in a community speaker's case study was written for a very specific audience: a group of friends who wanted to play a game, had problems with a public server and looked for alternatives."}
- {id: D3-C121, s: D3-S04, label: stage, ev: T:t02:11, ver: n/a, topics: [measurement, helpful-content],
   text: "Despite far fewer impressions (46,000 against 1,600,000), the niche article in a community speaker's case study got 28 times more clicks than the comprehensive article over the same period."}
- {id: D3-C122, s: D3-S04, label: stage, ev: T:t02:11, ver: n/a, topics: [measurement],
   text: "In the same case study, visitors who landed on the niche article converted 10 times more than visitors of the comprehensive article, a community speaker reported."}
- {id: D3-C123, s: D3-S04, label: stage, ev: T:t02:12, ver: n/a, topics: [measurement],
   text: "Conversions from content are real money that can be reported to stakeholders and shareholders, not an abstract KPI, a community speaker said.",
   quote: "This is not some abstract KPI. This is real money that you can report to your stakeholders"}
- {id: D3-C124, s: D3-S04, label: stage, ev: T:t02:12, ver: n/a, topics: [helpful-content],
   text: "The niche article in a community speaker's case study worked because the team stopped to analyse how people use the company's products and what the products bring them, then wrote about it."}
- {id: D3-C125, s: D3-S04, label: analysis, ev: "", ver: n/a, topics: [measurement, helpful-content],
   text: "Impressions and business value can diverge sharply, so judge each article by its clicks and conversions, not by its impressions alone, before deciding which content to expand or retire."}
- {id: D3-C126, s: D3-S04, label: analysis, ev: "", ver: n/a, topics: [measurement],
   text: "The case-study figures were said on stage without a photographed slide, a data source or absolute click numbers, and together they imply a click-through rate nearly 1,000 times higher on the niche article, so use them as an illustration, not a benchmark."}
- {id: D3-C127, s: D3-S04, label: analysis, ev: "", ver: n/a, src: [helpful-content], topics: [helpful-content],
   text: "For content planning, start briefs from a concrete problem a real group of users has with or around your product, such as a failing setup they need an alternative for, rather than from a broad keyword the page should rank for."}
- {id: D3-C128, s: D3-S04, label: stage, ev: T:t02:13, ver: n/a, topics: [helpful-content],
   text: "A community speaker's exercise: step out of your shop, look at your site from across the street the way users do, and check what problems its pages solve.",
   quote: "walk out of your shop. Stand on the other side of the street, look at the shop the way your users are looking at it"}
- {id: D3-C129, s: D3-S04, label: stage, ev: T:t02:13, ver: n/a, topics: [helpful-content],
   rel: [{type: repeats, to: D1-C013}],
   text: "If you cannot say what problems your pages solve for users, or the answer is 'it depends', you are optimising for the search engine rather than for people, and that will not work for long, a community speaker warned."}

# ---------- D3-S05 How Google thinks about Quality ----------
- {id: D3-C130, s: D3-S05, label: stage, ev: T:t03:1, ver: undocumented, topics: [helpful-content, ranking-systems],
   text: "Google's quality talk described quality as a ranking signal in its own right: a number calculated from many different parts (the word 'quality' is a repaired speech-to-text reading)."}
- {id: D3-C131, s: D3-S05, label: stage, ev: T:t03:1, ver: consistent, src: [hsw-ranking-results, ranking-systems-guide], topics: [helpful-content, ranking-systems],
   rel: [{type: extends, to: D3-C084}],
   text: "Google's quality talk said quality is one of the most important ranking signals, although Google uses hundreds of ranking signals (the word 'quality' is a repaired speech-to-text reading)."}
- {id: D3-C132, s: D3-S05, label: stage, ev: T:t03:2, ver: confirmed, src: [rater-guidelines, helpful-content], topics: [helpful-content, search-quality-evaluation],
   text: "Google's quality talk defined content quality as the extent to which a human being put effort, originality, talent, skill and accuracy into creating the content.",
   quote: "Quality is basically the extent to which a human being put effort, originality, talent, skill, and accuracy into creating content."}
- {id: D3-C133, s: D3-S05, label: slide, ev: [IMG_4800, T:t03:3], ver: confirmed, src: [ranking-systems-guide], topics: [ranking-systems, ai-in-search-systems],
   text: "Google's slide said there is not one single ranking system and named spam detection systems, the reviews system, BERT, MUM, RankBrain, freshness systems, deduplication systems, crisis information systems and link analysis systems (PageRank).",
   quote: "There’s not one single ranking system...", quote_checked: true}
- {id: D3-C134, s: D3-S05, label: stage, ev: T:t03:3, ver: consistent, src: [ranking-systems-guide, hsw-ranking-results], topics: [ranking-systems, helpful-content],
   text: "Google's quality talk said quality is part of the core systems and signals that go into Google's algorithm, which Google calls ranking systems."}
- {id: D3-C135, s: D3-S05, label: analysis, ev: IMG_4800, ver: n/a, src: [ranking-systems-guide], topics: [ranking-systems, ai-in-search-systems],
   rel: [{type: extends, to: D1-C130}],
   text: "The quality talk's slide listed MUM among Google's ranking systems, while Google's ranking systems guide says MUM is not currently used for general ranking in Search; read the slide as a list of systems Google runs, not as proof that each one ranks every query."}
- {id: D3-C136, s: D3-S05, label: stage, ev: T:t03:4, ver: undocumented, src: [ranking-systems-guide], topics: [ranking-systems],
   text: "Google's quality talk called PageRank the speaker's favourite ranking system, elegant in its time, but said Google does not really use it so much anymore.",
   quote: "My favorite is probably PageRank, even though we don't really use them so much anymore."}
- {id: D3-C137, s: D3-S05, label: analysis, ev: T:t03:4, ver: n/a, src: [ranking-systems-guide], topics: [ranking-systems],
   text: "The remark that PageRank is not used so much anymore differs from Google's ranking systems guide, which says PageRank has evolved a lot and continues to be part of the core ranking systems; read it as PageRank weighing less among many signals, not as PageRank being switched off, so links still matter."}
- {id: D3-C138, s: D3-S05, label: docs, ev: "", ver: source, src: [ranking-systems-guide], topics: [ranking-systems],
   text: "Google's ranking systems guide says PageRank, one of its core ranking systems when Google first launched, has evolved a lot since then and continues to be part of its core ranking systems."}
- {id: D3-C139, s: D3-S05, label: stage, ev: [IMG_4800, T:t03:5], ver: consistent, src: [ranking-systems-guide], topics: [ranking-systems, spam-detection],
   text: "Google's quality talk named the spam systems among Google's ranking systems and said site owners probably interact a lot with the freshness systems, the reviews system and other ranking systems."}
- {id: D3-C140, s: D3-S05, label: stage, ev: T:t03:5, ver: confirmed, src: [ranking-systems-guide], topics: [ranking-systems],
   text: "Google's quality talk pointed site owners to Google's published guide to its Search ranking systems to learn what each system does."}
- {id: D3-C141, s: D3-S05, label: stage, ev: T:t03:6, ver: confirmed, src: [ranking-systems-guide], topics: [ranking-systems],
   text: "Google's quality talk said Google's ranking systems change over time."}
- {id: D3-C142, s: D3-S05, label: stage, ev: T:t03:6, ver: consistent, src: [hsw-ranking-results, ranking-systems-guide], topics: [ranking-signals-by-vertical],
   rel: [{type: repeats, to: D1-C045}],
   text: "Google's quality talk said ranking signals differ by result type: for web pages they include the text on the page, links and passages, while for news, probably, freshness, diversity and originality become more important."}
- {id: D3-C143, s: D3-S05, label: stage, ev: T:t03:7, ver: consistent, src: [ranking-systems-guide, helpful-content], topics: [ranking-systems],
   text: "Google's quality talk warned that trying to maximise one ranking signal does not work, because Google uses hundreds of ranking signals.",
   quote: "Big takeaway: always remember, there's hundreds of ranking signals."}
- {id: D3-C144, s: D3-S05, label: analysis, ev: T:t03:7, ver: n/a, topics: [ranking-systems, helpful-content],
   text: "For content and development teams: plan improvements across content quality, internal links, page experience and freshness together; a project that pushes a single metric, such as keyword density or one link score, matches what Google said does not work."}
- {id: D3-C145, s: D3-S05, label: stage, ev: T:t03:8, ver: consistent, src: [hsw-our-approach], topics: [search-evolution],
   text: "Google's quality talk said users expect a richer set of results than ever, so Google brings different result types, such as web pages and videos, for different queries and intents."}
- {id: D3-C146, s: D3-S05, label: stage, ev: T:t03:8, ver: consistent, src: [hsw-our-approach], topics: [search-evolution],
   text: "Google's quality talk said Google sometimes gives direct answers, and that for a query such as directions to the airport it should also show Maps features."}
- {id: D3-C147, s: D3-S05, label: stage, ev: T:t03:9, ver: consistent, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   rel: [{type: extends, to: D1-C158}],
   text: "Google's quality talk said that at any moment thousands of Search experiments are probably running."}
- {id: D3-C148, s: D3-S05, label: stage, ev: T:t03:9, ver: confirmed, src: [helpful-content, hsw-ranking-results], topics: [ranking-systems, helpful-content],
   text: "Google's quality talk said Google designs its ranking systems to identify the information people are most likely to find useful and reliable."}
- {id: D3-C149, s: D3-S05, label: slide, ev: "IMG_4801, IMG_4802", ver: confirmed, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google's slide said that in 2023 Google ran 719,326 search quality tests, 124,942 side-by-side experiments and 16,871 live traffic experiments, and made 4,781 launches to Search."}
- {id: D3-C150, s: D3-S05, label: analysis, ev: [IMG_4801, IMG_4811], ver: n/a, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Two Day 3 slides headed 'In 2023' gave Google's testing figures in two versions: exact in the quality talk (719,326 search quality tests, 4,781 launches) and rounded in the updates talk (800,000+ tests, 4,700+ launches). Google's How Search Works page states the exact 719,326 and 4,781, so cite those with the year 2023; 800,000+ matches no figure on that page, although the page's three test counts (719,326 quality tests, 124,942 side-by-side and 16,871 live traffic experiments) add up to 861,139."}
- {id: D3-C151, s: D3-S05, label: stage, ev: T:t03:10, ver: confirmed, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google's quality talk said side-by-side experiments compare a proposed change with what is already in production; its hypothetical example was rewriting a page's title with AI and checking whether the result is better than the current one."}
- {id: D3-C152, s: D3-S05, label: stage, ev: T:t03:11, ver: consistent, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google's quality talk said experiments are judged on hundreds of metrics, and a change that does well enough is then run on very small slices of live traffic."}
- {id: D3-C153, s: D3-S05, label: stage, ev: T:t03:11, ver: consistent, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google's quality talk said only changes whose live traffic experiments look even better, or exceed expectations on the metrics, become launches."}
- {id: D3-C154, s: D3-S05, label: stage, ev: T:t03:12, ver: confirmed, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google's quality talk said a change to Search cannot simply be launched: it must first be shown to move the metrics in a way that benefits users."}
- {id: D3-C155, s: D3-S05, label: docs, ev: "", ver: source, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google's How Search Works page says a live traffic experiment first enables a feature for a small percentage of people, usually starting at 0.1%, and compares them with a control group on a very long list of metrics, such as clicks, number of queries, abandoned queries and time to click."}
- {id: D3-C156, s: D3-S05, label: docs, ev: "", ver: source, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google's How Search Works page says that in a side-by-side experiment search quality raters see two sets of results, one with the proposed change and one without, and are asked which they prefer and why."}
- {id: D3-C157, s: D3-S05, label: analysis, ev: [IMG_4801, T:t03:9], ver: n/a, src: [hsw-rigorous-testing, search-status-ranking], topics: [search-quality-evaluation],
   text: "Google made 4,781 launches to Search in 2023 while its status dashboard lists nine named ranking updates that year, so almost every change to Search goes unannounced; monitor rankings and traffic continuously, not only around announced core or spam updates."}
- {id: D3-C158, s: D3-S05, label: slide, ev: [IMG_4804, T:t03:13], ver: confirmed, src: [rater-guidelines, hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google's slide pointed to the Search Quality Rater Guidelines at goo.gle/raters-guidelines, with a QR code to the guidelines PDF, and the speaker said this is the exact document Google's raters use."}
- {id: D3-C159, s: D3-S05, label: slide, ev: [IMG_4804, T:t03:14], ver: confirmed, src: [helpful-content, hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google's slide said search quality raters are independent reviewers who help Google decide whether a change it is about to launch is good for users."}
- {id: D3-C160, s: D3-S05, label: slide, ev: IMG_4804, ver: confirmed, src: [helpful-content, rater-guidelines], topics: [search-quality-evaluation],
   text: "Google's slide said search quality raters cannot affect the rankings of individual sites.",
   quote: "They can not affect individual site's rankings.", quote_checked: true}
- {id: D3-C161, s: D3-S05, label: slide, ev: IMG_4804, ver: confirmed, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google's slide said Google gives its search quality raters guidelines that describe how Google thinks about quality."}
- {id: D3-C162, s: D3-S05, label: slide, ev: IMG_4804, ver: confirmed, src: [rater-guidelines], topics: [search-quality-evaluation],
   text: "The rater guidelines' table of contents shown on Google's slide covers page quality rating, YMYL topics, main and supplementary content, website and creator reputation, E-E-A-T and lowest quality pages."}
- {id: D3-C163, s: D3-S05, label: stage, ev: T:t03:14, ver: confirmed, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google's quality talk said search quality raters are external to Google, not Google employees."}
- {id: D3-C164, s: D3-S05, label: stage, ev: T:t03:14, ver: undocumented, topics: [search-quality-evaluation],
   text: "Google's quality talk said search quality raters can be employed by other search engines too, not just by Google."}
- {id: D3-C165, s: D3-S05, label: stage, ev: [T:t03:14, T:t03:15], ver: consistent, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google's quality talk said raters rate results and their ranking for a change, decide whether the change is good or bad, and explain why they chose their rating."}
- {id: D3-C166, s: D3-S05, label: stage, ev: T:t03:16, ver: consistent, src: [helpful-content], topics: [helpful-content],
   text: "Google's quality talk showed five self-assessment questions (slide not photographed) that site owners can use to evaluate their own content, such as whether it is people-first or made mainly for search engines, and whether the author is an expert on the topic."}
- {id: D3-C167, s: D3-S05, label: stage, ev: T:t03:17, ver: confirmed, src: [rater-guidelines], topics: [search-quality-evaluation],
   text: "Google's quality talk said rater ratings are used to measure how effectively search engines deliver helpful content to people around the world."}
- {id: D3-C168, s: D3-S05, label: stage, ev: [T:t03:18, IMG_4804], ver: consistent, src: [gen-ai-content-guide, helpful-content], topics: [search-quality-evaluation],
   text: "Google's quality talk stressed that nothing in the Search Quality Rater Guidelines is itself a ranking factor; the guidelines explain how Google thinks about quality."}
- {id: D3-C169, s: D3-S05, label: analysis, ev: T:t03:18, ver: n/a, src: [helpful-content], topics: [search-quality-evaluation, helpful-content],
   text: "Use the rater guidelines as a description of what Google's ranking systems aim to reward, not as a checklist of ranking factors: rater scores evaluate Google's changes and are not used to rank any particular site."}
- {id: D3-C170, s: D3-S05, label: stage, ev: T:t03:19, ver: confirmed, src: [rater-guidelines], topics: [search-quality-evaluation, helpful-content],
   rel: [{type: extends, to: D2-C311}],
   text: "Google's quality talk pointed to page 21 of the Search Quality Rater Guidelines for its definition of content quality by effort, originality, talent or skill and accuracy, noting that the document is updated from time to time."}
- {id: D3-C171, s: D3-S05, label: stage, ev: T:t03:19, ver: confirmed, src: [rater-guidelines], topics: [search-quality-evaluation, helpful-content],
   text: "Google's quality talk said effort, in the rater guidelines, is the extent to which a human being actively worked to create satisfying content, and that effort can be direct or indirect."}
- {id: D3-C172, s: D3-S05, label: stage, ev: T:t03:20, ver: consistent, src: [rater-guidelines, helpful-content], topics: [search-quality-evaluation, helpful-content],
   text: "Google's quality talk said originality means offering content that is not available on any other website or, where similar content exists elsewhere, adding more value to it."}
- {id: D3-C173, s: D3-S05, label: analysis, ev: T:t03:20, ver: n/a, src: [rater-guidelines, helpful-content], topics: [search-quality-evaluation, helpful-content],
   text: "The talk's originality test ('are you adding more value') matches Google's helpful-content question on content that draws on other sources, while the rater guidelines ask raters, where other websites have similar content, to consider whether the page is the original source; aim to be the original source, and add substantial value where you build on others."}
- {id: D3-C174, s: D3-S05, label: stage, ev: T:t03:20, ver: confirmed, src: [rater-guidelines, helpful-content], topics: [search-quality-evaluation, helpful-content],
   text: "Google's quality talk said talent or skill means content created with enough talent and skill to give users a satisfying experience."}
- {id: D3-C175, s: D3-S05, label: stage, ev: T:t03:20, ver: confirmed, src: [rater-guidelines, helpful-content], topics: [search-quality-evaluation, helpful-content],
   text: "Google's quality talk said content has to be accurate, and that accuracy matters most for YMYL topics and health topics."}
- {id: D3-C176, s: D3-S05, label: docs, ev: "", ver: source, src: [helpful-content], topics: [helpful-content, search-quality-evaluation],
   text: "Google's helpful-content guidance lists effort, originality, talent or skill and accuracy as the main-content attributes search quality raters are trained to evaluate, and says using generative AI to produce large amounts of text without manual oversight or curation represents little to no effort."}
- {id: D3-C177, s: D3-S05, label: stage, ev: T:t03:21, ver: n/a, topics: [helpful-content],
   text: "Google's quality talk contrasted a commodity article, 'Top 10 things to consider when buying running shoes', with a non-commodity one, a wear pattern analysis of why certain running shoes collapse after 400 miles (slide not photographed)."}
- {id: D3-C178, s: D3-S05, label: stage, ev: T:t03:22, ver: confirmed, src: [ai-optimization-guide], topics: [helpful-content],
   text: "Google's quality talk said commodity content is based on very common knowledge, could have been written by anyone and usually offers very little insight or additional value."}
- {id: D3-C179, s: D3-S05, label: stage, ev: T:t03:22, ver: confirmed, src: [ai-optimization-guide], topics: [helpful-content],
   rel: [{type: extends, to: D1-C055}],
   text: "Google's quality talk said non-commodity content offers a unique, experienced take, and advised writing content that readers will find very helpful and reliable."}
- {id: D3-C180, s: D3-S05, label: docs, ev: "", ver: source, src: [ai-optimization-guide], topics: [helpful-content, seo-vs-geo],
   text: "Google's guide to optimizing for generative AI features contrasts commodity content, such as '7 Tips for First-Time Homebuyers', with non-commodity content that gives unique expert or experienced takes beyond common knowledge, such as a first-hand account of waiving a home inspection."}
- {id: D3-C181, s: D3-S05, label: stage, ev: T:t03:23, ver: n/a, topics: [helpful-content],
   text: "Google's quality talk said its article examples were illustrations, not a recipe: writing exactly that article is no guarantee that it will work."}
- {id: D3-C182, s: D3-S05, label: stage, ev: T:t03:24, ver: n/a, topics: [helpful-content, ai-content-detection],
   text: "Google's quality talk said that in 2026 it is easy for anyone to create a large amount of commodity content, and encouraged attendees to try it once to see what the result looks like."}
- {id: D3-C183, s: D3-S05, label: stage, ev: T:t03:25, ver: n/a, topics: [search-evolution],
   text: "Google's quality talk said AI is now everywhere and available to everyone, and that opinions differ on how the broad use of AI has affected search results."}
- {id: D3-C184, s: D3-S05, label: stage, ev: T:t03:26, ver: n/a, topics: [ai-content-detection],
   text: "Google's quality talk presented its AI-content examples as the speaker's personal opinion, not as the position of Google's search quality systems."}
- {id: D3-C185, s: D3-S05, label: stage, ev: T:t03:27, ver: n/a, topics: [ai-content-detection, helpful-content],
   text: "Google's quality talk called AI just a tool and asked how users would know whom to trust if AI lets anyone appear to be the absolute expert in a field."}
- {id: D3-C186, s: D3-S05, label: stage, ev: T:t03:27, ver: n/a, topics: [helpful-content, seo-vs-geo],
   text: "Google's quality talk asked why users would read AI-generated content when they could ask an LLM the same questions directly."}
- {id: D3-C187, s: D3-S05, label: stage, ev: T:t03:28, ver: n/a, topics: [ai-content-detection, helpful-content],
   text: "Google's quality talk showed a surface-level example article (not photographed) that the speaker said Gemini could have generated, while stressing that humans have written such content for a long time too."}
- {id: D3-C188, s: D3-S05, label: stage, ev: T:t03:29, ver: n/a, topics: [ai-content-detection, spam-detection],
   text: "Google's quality talk asked what would happen to the web ecosystem if everyone used AI to flood the web with surface-level content like the example it had just shown."}
- {id: D3-C189, s: D3-S05, label: stage, ev: T:t03:30, ver: n/a, topics: [helpful-content, ai-content-detection],
   text: "Google's quality talk said that with LLMs anyone can write a top-10 shoe review without using the products, and questioned whether such reviews provide any real value."}
- {id: D3-C190, s: D3-S05, label: stage, ev: T:t03:31, ver: confirmed, src: [ai-content-blog-2023, spam-policies], topics: [ai-content-detection, helpful-content],
   rel: [{type: repeats, to: D1-C210}],
   text: "Google's quality talk said quality problems should be treated as quality issues, not as AI versus human content, because a lot of good AI-assisted or AI-written content exists.",
   quote: "it's very important to think about these quality issues as quality issues and not AI versus human content."}
- {id: D3-C191, s: D3-S05, label: analysis, ev: T:t03:31, ver: n/a, src: [helpful-content], topics: [ai-content-detection, helpful-content],
   text: "For editorial teams, the test for an AI-assisted article is the same as for any article: whether it adds effort, originality, skill and accuracy beyond what an LLM would answer directly; disclosure of AI use alone neither saves nor sinks a page."}
- {id: D3-C192, s: D3-S05, label: stage, ev: T:t03:32, ver: n/a, topics: [helpful-content],
   text: "Google's quality talk said good content can be created for literally any vertical, answering site owners who say they do not know how to become experts or make their content stand out."}
- {id: D3-C193, s: D3-S05, label: stage, ev: [T:t03:32, T:t03:33], ver: n/a, topics: [helpful-content],
   text: "Google's quality talk showed, as an example of strong content, a running-shoe review site that cut the shoes apart, examined the upper and the foam density under a microscope, took high-quality images, built a test rig and created its own metrics to compare shoes (site not named, slide not photographed)."}
- {id: D3-C194, s: D3-S05, label: stage, ev: T:t03:34, ver: n/a, topics: [helpful-content],
   text: "Google's quality talk said the speaker believes content in any vertical can go very far when its creators invest in their own knowledge, effort and expertise."}
- {id: D3-C195, s: D3-S05, label: docs, ev: "", ver: source, src: [helpful-content], topics: [helpful-content],
   text: "Google's helpful-content guidance says product reviews build trust when readers understand how many products were tested, what the test results were and how the tests were conducted, with evidence of the work such as photographs."}
- {id: D3-C196, s: D3-S05, label: analysis, ev: [T:t03:33, T:t03:34], ver: n/a, src: [helpful-content], topics: [helpful-content],
   text: "For content teams: turn reviews into non-commodity content by testing the products yourselves, publishing your own photos and measurements, explaining the test method and defining comparable metrics across products; a list of common buying tips is the commodity version."}
- {id: D3-C197, s: D3-S05, label: stage, ev: T:t03:35, ver: confirmed, src: [hsw-detecting-spam], topics: [spam-detection],
   text: "Google's quality talk said Google discovers tens of billions of spam pages every day."}
- {id: D3-C198, s: D3-S05, label: stage, ev: T:t03:35, ver: undocumented, topics: [spam-detection],
   text: "Google's quality talk said a big portion of the new pages Google discovers every day is spam, adding that the speaker did not know of Google ever publishing the percentage."}
- {id: D3-C199, s: D3-S05, label: stage, ev: T:t03:35, ver: confirmed, src: [hsw-detecting-spam, ranking-systems-guide], topics: [spam-detection],
   text: "Google's quality talk said spam systems are one of the ways Google protects search quality, removing a very large amount of spam before results are served."}
- {id: D3-C200, s: D3-S05, label: analysis, ev: [T:t03:35, IMG_4811], ver: n/a, src: [hsw-detecting-spam], topics: [spam-detection],
   text: "The spoken 'tens of billions of spam pages' a day matches Google's How Search Works page, which says its systems find 40 billion spammy pages every day, and the later Day 3 slide '40B spammy pages detected every day' (under 'In 2023'); cite 40 billion a day."}
- {id: D3-C201, s: D3-S05, label: stage, ev: T:t03:36, ver: confirmed, src: [search-status-ranking, september-2026-spam-update], topics: [spam-detection, spam-policies],
   text: "Google's quality talk said Google had released four spam updates in 2026 by the time of the talk on 2 October, with one still rolling out."}
- {id: D3-C202, s: D3-S05, label: docs, ev: "", ver: source, src: [search-status-ranking, september-2026-spam-update], topics: [spam-detection, spam-policies],
   text: "Google's Search Status Dashboard says the September 2026 spam update began on 24 September 2026, applies globally to all languages and may take up to two weeks to roll out."}
- {id: D3-C203, s: D3-S05, label: stage, ev: T:t03:36, ver: consistent, src: [spam-updates], topics: [spam-detection, spam-policies],
   text: "Google's quality talk said its spam updates mostly target spam pages, so most site owners in the audience were probably not affected."}
- {id: D3-C204, s: D3-S05, label: stage, ev: T:t03:36, ver: n/a, topics: [spam-detection],
   text: "Google's quality talk said evaluating the quality of the web at scale is messy and hard, and that Google's work on it is never done."}
- {id: D3-C205, s: D3-S05, label: stage, ev: T:t03:37, ver: consistent, src: [hsw-detecting-spam, spam-updates], topics: [spam-detection, ai-in-search-systems],
   rel: [{type: extends, to: D2-C668}],
   text: "Google's quality talk said AI has fundamentally changed how Google builds spam updates, letting it evaluate many more candidates and drastically increasing its velocity, so it launches faster with more impact."}
- {id: D3-C206, s: D3-S05, label: stage, ev: T:t03:37, ver: confirmed, src: [spam-updates], topics: [spam-detection, ai-in-search-systems],
   rel: [{type: extends, to: D2-C668}],
   text: "Google's quality talk said AI lets Google catch new types of spam and catch more of it."}
- {id: D3-C207, s: D3-S05, label: stage, ev: [T:t03:38, T:t03:39, T:t03:40], ver: confirmed, src: [search-docs-updates, spam-policies], topics: [spam-policies],
   text: "Google's quality talk listed recent updates to Google's spam policies: back button hijacking, scaled content abuse and manipulating AI responses."}
- {id: D3-C208, s: D3-S05, label: stage, ev: T:t03:39, ver: consistent, src: [back-button-hijacking-blog, spam-policies], topics: [spam-policies],
   text: "Google's quality talk said back button hijacking was added after many user complaints about pressing the back button and landing on an auto-generated page, or staying on the same site after pressing it twice."}
- {id: D3-C209, s: D3-S05, label: docs, ev: "", ver: source, src: [back-button-hijacking-blog, spam-policies], topics: [spam-policies],
   text: "Google announced on 13 April 2026 that back button hijacking is an explicit violation of its malicious practices spam policy, with enforcement from 15 June 2026; pages that do it may get manual spam actions or automated demotions."}
- {id: D3-C210, s: D3-S05, label: docs, ev: "", ver: source, src: [back-button-hijacking-blog], topics: [spam-policies],
   text: "Google's back button hijacking announcement says some instances may come from a site's included libraries or advertising platform, and asks site owners to remove or disable any code, imports or configurations responsible."}
- {id: D3-C211, s: D3-S05, label: analysis, ev: T:t03:39, ver: n/a, src: [back-button-hijacking-blog], topics: [spam-policies],
   text: "For development teams: test that the browser back button returns users from your pages to where they came from, including search results; audit scripts that call the History API, insert interstitial or 'recommended' pages, or come from ad and engagement vendors."}
- {id: D3-C212, s: D3-S05, label: stage, ev: T:t03:40, ver: confirmed, src: [spam-policies, search-docs-updates], topics: [spam-policies, seo-vs-geo],
   rel: [{type: extends, to: D1-C129}],
   text: "Google's quality talk said Google clarified that traditional spam techniques aimed at manipulating AI responses also violate its spam policies, and that Google can take action against them."}
- {id: D3-C213, s: D3-S05, label: analysis, ev: T:t03:40, ver: n/a, src: [spam-policies], topics: [spam-policies, seo-vs-geo],
   text: "Tactics sold as AI visibility or GEO, such as hidden text aimed at AI answers, mass-produced pages for fan-out queries or keyword-stuffed passages, are judged under the same spam policies as classic ranking manipulation."}
- {id: D3-C214, s: D3-S05, label: stage, ev: T:t03:41, ver: consistent, src: [report-spam, spam-policies], topics: [spam-detection, spam-policies],
   text: "Google's quality talk said Google reads spam reports and uses them to decide what kinds of spam to tackle next."}
- {id: D3-C215, s: D3-S05, label: docs, ev: "", ver: source, src: [report-spam, search-docs-updates], topics: [spam-detection, spam-policies],
   text: "Since April 2026 Google's spam report page says Google may use a report to take manual action, and that the submission text is sent to the site owner, so reports containing personally identifying information are not processed."}
- {id: D3-C216, s: D3-S05, label: stage, ev: T:t03:41, ver: n/a, topics: [feature-requests, spam-policies],
   text: "Google's quality talk said Google receives a lot of feedback at conferences and online, and invited attendees to share the quality issues they run into or want Google to work on next."}
- {id: D3-C217, s: D3-S05, label: analysis, ev: "", ver: n/a, src: [search-docs-updates, gen-ai-content-guide, helpful-content], topics: [helpful-content, search-quality-evaluation],
   text: "On 1 October 2026, during the event, Google updated its generative AI content guide with rater-guideline material to keep its documentation in sync with its developer-event presentations, and the helpful-content page, updated the same day, carries the effort, originality, talent or skill and accuracy definitions from the quality talk; cite those pages rather than the talk."}

# ---------- D3-S06 Uncovering Trustworthy Experiences on Discover ----------
- {id: D3-C218, s: D3-S06, label: slide, ev: IMG_4806, ver: consistent, src: [google-discover, discover-policies], topics: [discover],
   text: "Google's Discover slide showed an eligibility gate: content with a policy violation goes to a policy compliance check and low-quality content to an E-E-A-T quality check, and both can end with the content filtered out, while safe and trusted content becomes eligible for Discover."}
- {id: D3-C219, s: D3-S06, label: docs, ev: "", ver: source, src: [google-discover], topics: [discover],
   text: "Google's Discover documentation says content is automatically eligible for Discover if it is indexed and meets Discover's content policies, needs no special tags or structured data, and is not guaranteed to appear."}
- {id: D3-C220, s: D3-S06, label: docs, ev: "", ver: source, src: [google-discover], topics: [discover, helpful-content],
   text: "Google's Discover documentation says Discover uses many of the same signals and systems as Search to determine what is helpful, people-first content."}
- {id: D3-C221, s: D3-S06, label: slide, ev: IMG_4806, ver: consistent, src: [google-discover], topics: [discover, images],
   text: "Google's Discover slide said that for eligible content image quality decides click-through: a small thumbnail lowers the click-through rate and a large, high-resolution image raises it."}
- {id: D3-C222, s: D3-S06, label: slide, ev: IMG_4808, ver: confirmed, src: [rater-guidelines, helpful-content], topics: [discover, helpful-content],
   text: "Google's Discover slide defined E-E-A-T: experience means first-hand, personal experience with the topic, expertise the necessary knowledge or skill, and authoritativeness the extent to which the creator or website is known as a go-to source for the topic."}
- {id: D3-C223, s: D3-S06, label: slide, ev: IMG_4808, ver: confirmed, src: [rater-guidelines, helpful-content], topics: [discover, helpful-content],
   text: "Google's Discover slide said trust comes first: untrustworthy pages have low E-E-A-T however experienced, expert or authoritative they seem.",
   quote: "untrustworthy pages will have low E-E-A-T no matter how Experienced, Expert or Authoritative they may seem", quote_checked: true}
- {id: D3-C224, s: D3-S06, label: slide, ev: IMG_4809, ver: confirmed, src: [google-discover], topics: [discover, images],
   rel: [{type: extends, to: D2-C089}, {type: repeats, to: D2-C936}],
   text: "Google's Discover slide recommended large images at least 1,200 px wide, with more than 300,000 total pixels and a 16x9 aspect ratio, enabled by the max-image-preview:large setting."}
- {id: D3-C225, s: D3-S06, label: slide, ev: IMG_4809, ver: confirmed, src: [google-discover], topics: [discover, images],
   text: "Google's Discover slide said to avoid generic images, such as a site logo, and text-heavy images."}
- {id: D3-C226, s: D3-S06, label: slide, ev: IMG_4809, ver: consistent, src: [google-discover, discover-policies], topics: [discover, images],
   text: "Google's Discover slide said images are subject to the same policy requirements as the content and that misleading, exaggerated or outrageous images should be avoided."}
- {id: D3-C227, s: D3-S06, label: docs, ev: "", ver: source, src: [google-discover], topics: [discover, images],
   text: "Google's Discover documentation says to specify the large image with schema.org markup or the og:image meta tag, which can influence the thumbnail Discover chooses, and that a vertical image cropped to 16x9 must keep its important details."}
- {id: D3-C228, s: D3-S06, label: slide, ev: IMG_4810, ver: n/a, topics: [discover],
   text: "Google's closing Discover slide pointed to the Discover content policies in Google Search Help and to the Search Central documentation."}
- {id: D3-C229, s: D3-S06, label: docs, ev: "", ver: source, src: [discover-policies], topics: [discover],
   text: "Google's Discover content policies ask news sources for clear dates and bylines, information about the authors, publication and publisher, and contact information, and say repeated or egregious violations can make a site ineligible for Discover."}
- {id: D3-C230, s: D3-S06, label: analysis, ev: "", ver: n/a, src: [google-discover, robots-meta-tag-spec], topics: [discover, images],
   text: "For Discover, set max-image-preview:large on article templates, give every article a relevant image at least 1,200 px wide in og:image or schema.org markup that is neither the site logo nor text-heavy, and show clear bylines and dates."}

# ---------- D3-S07 What are quality updates ----------
- {id: D3-C231, s: D3-S07, label: stage, ev: T:t04:1, ver: consistent, src: [google-our-story, ranking-systems-guide], topics: [search-evolution],
   text: "Google began as a Stanford research project in 1995: Larry Page and Sergey Brin built a search engine on an algorithm they invented, PageRank, and called the engine BackRub."}
- {id: D3-C232, s: D3-S07, label: stage, ev: T:t04:1, ver: consistent, src: [google-our-story], topics: [search-evolution],
   text: "BackRub was renamed Google when it launched officially, which the speaker dated to 1997-98."}
- {id: D3-C233, s: D3-S07, label: docs, ev: "", ver: source, src: [google-our-story], topics: [search-evolution],
   text: "Google's company history page says the Google story began in 1995 at Stanford, where Larry Page and Sergey Brin built a search engine that used links to judge the importance of pages, called it Backrub and soon renamed it Google; Google Inc. was founded in August 1998."}
- {id: D3-C234, s: D3-S07, label: stage, ev: T:t04:2, ver: undocumented, topics: [search-evolution],
   text: "The speaker opened the talk on why Search changes by noting that Google's logo has changed only a handful of times in about 30 years."}
- {id: D3-C235, s: D3-S07, label: stage, ev: [IMG_4811, T:t04:3], ver: consistent, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google says it constantly evaluates how Search is doing, including whether users like the results and whether they can accomplish what they want on Search."}
- {id: D3-C236, s: D3-S07, label: slide, ev: [IMG_4811, T:t04:3], ver: undocumented, topics: [search-quality-evaluation],
   text: "Google's slide said that in 2023 Google ran more than 800,000 search quality tests; the speaker added that a more recent figure might exist."}
- {id: D3-C237, s: D3-S07, label: slide, ev: [IMG_4811, T:t04:3], ver: confirmed, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   rel: [{type: repeats, to: D3-C149}],
   text: "Google's slide said Google made more than 4,700 launches to Search in 2023; the speaker rounded this to close to 5,000."}
- {id: D3-C238, s: D3-S07, label: docs, ev: "", ver: source, src: [hsw-rigorous-testing], topics: [search-quality-evaluation],
   text: "Google's page on how it tests Search says that in 2023 it ran 719,326 search quality tests, 124,942 side-by-side experiments and 16,871 live traffic experiments, and made 4,781 launches."}
- {id: D3-C239, s: D3-S07, label: slide, ev: IMG_4811, ver: consistent, src: [webspam-report-2020, hsw-detecting-spam], topics: [spam-detection],
   rel: [{type: extends, to: D3-C197}],
   text: "Google's slide, headed 'In 2023, there were...', said 40 billion spammy pages are detected every day."}
- {id: D3-C240, s: D3-S07, label: docs, ev: "", ver: source, src: [webspam-report-2020], topics: [spam-detection],
   text: "Google's webspam report for 2020, published in April 2021, says Google discovers 40 billion spammy pages every day."}
- {id: D3-C241, s: D3-S07, label: analysis, ev: "", ver: n/a, src: [webspam-report-2020, webspam-report-2021, webspam-report-2022, hsw-detecting-spam], topics: [spam-detection],
   text: "Cite 40 billion spammy pages a day as Google's published figure, from its webspam report for 2020 and its How Search Works page: the slide's 'In 2023' heading does not make it a 2023 measurement, because the 2021 and 2022 reports give no daily count."}
- {id: D3-C242, s: D3-S07, label: slide, ev: [IMG_4812, T:t04:4], ver: undocumented, topics: [search-evolution, search-updates],
   text: "Google's slide gave three reasons why Search changes: new content formats, the growing breadth of content on the web, and content issues such as spam."}
- {id: D3-C243, s: D3-S07, label: slide, ev: [IMG_4812, T:t04:4], ver: undocumented, topics: [search-evolution],
   text: "Google's slide said that as content formats and types become more widespread, search users might start looking for them, and if enough people become interested Google might launch one or more Search features for those formats."}
- {id: D3-C244, s: D3-S07, label: slide, ev: [IMG_4812, T:t04:7], ver: consistent, src: [core-updates], topics: [search-updates],
   text: "Google's slide said the more people post on the internet, the more saturated topics become and the harder it gets to find the highest quality content, so Google might launch core updates to improve the quality and relevance of search results."}
- {id: D3-C245, s: D3-S07, label: slide, ev: [IMG_4812, T:t04:17], ver: consistent, src: [spam-updates], topics: [search-updates],
   text: "Google's slide said Google is not perfect and spammers find loopholes to make low-effort content rank high in Search, so Google might launch targeted algorithms for a more level playing field in its search results."}
- {id: D3-C246, s: D3-S07, label: stage, ev: [T:t04:5, T:t04:9], ver: undocumented, topics: [search-evolution, rich-results],
   text: "Compared with the simple early-2000s Google results page, which showed a few expected sites, today's results page for the same query adds exploration features such as People Also Ask."}
- {id: D3-C247, s: D3-S07, label: stage, ev: T:t04:5, ver: undocumented, topics: [search-evolution],
   text: "Google added exploration features to its results pages because users' behaviour evolved: people wanted to explore more of the topic they were searching for."}
- {id: D3-C248, s: D3-S07, label: stage, ev: T:t04:6, ver: n/a, topics: [search-evolution],
   text: "The speaker called launches of new Search features 'feature updates', a personal label coined the year before, not an official Google term.",
   quote: "I like to call that feature updates. It's not an official name."}
- {id: D3-C249, s: D3-S07, label: stage, ev: T:t04:6, ver: undocumented, topics: [search-evolution],
   text: "The speaker said that without new Search features, search results would become obsolete and users would no longer find them useful."}
- {id: D3-C250, s: D3-S07, label: stage, ev: [IMG_4812, T:t04:6, T:t04:12], ver: consistent, src: [core-updates, spam-policies], topics: [search-evolution, search-updates],
   text: "Every kind of Search update, whether a feature launch, a core update or a spam update, has the same goal: satisfying users' information needs with better results."}
- {id: D3-C251, s: D3-S07, label: stage, ev: T:t04:7, ver: undocumented, topics: [search-evolution],
   text: "In the mid-1990s the web was small enough to list in one manually edited directory; by the time BackRub was being built, directories could no longer find information on the growing web, which is why Google was created."}
- {id: D3-C252, s: D3-S07, label: stage, ev: T:t04:7, ver: undocumented, topics: [search-evolution, ai-content-detection],
   text: "The speaker said the web keeps growing exponentially and named AI slop, low-quality AI-generated content, as one of the reasons."}
- {id: D3-C253, s: D3-S07, label: stage, ev: T:t04:8, ver: consistent, src: [web-was-big-blog], topics: [search-evolution, index-structure],
   text: "When Google launched in 1997-98 its index held 25 million pages, at that time the biggest index of any search engine."}
- {id: D3-C254, s: D3-S07, label: docs, ev: "", ver: source, src: [web-was-big-blog], topics: [search-evolution, index-structure],
   text: "A 2008 Official Google Blog post says the first Google index, in 1998, already had 26 million pages, and that the index reached one billion pages by 2000."}
- {id: D3-C255, s: D3-S07, label: analysis, ev: "", ver: n/a, src: [web-was-big-blog], topics: [search-evolution, index-structure],
   text: "Quote the size of Google's first index as 26 million pages (1998), the figure in Google's own 2008 blog post; the 25 million said on stage is a rounded version of it."}
- {id: D3-C256, s: D3-S07, label: stage, ev: [T:t04:8, T:t04:9], ver: consistent, src: [how-search-works, web-was-big-blog], topics: [index-selection],
   rel: [{type: repeats, to: D2-C680}],
   text: "Google does not index every URL on the web; because it cannot index everything, it has to rank results better and better to satisfy users' information needs."}
- {id: D3-C257, s: D3-S07, label: stage, ev: T:t04:9, ver: undocumented, topics: [search-evolution],
   text: "To show how much the web has grown, Google's deck compared result counts for the query 'durian': for every result in 2000 there were about 20,000 results in 2025."}
- {id: D3-C258, s: D3-S07, label: stage, ev: T:t04:10, ver: consistent, src: [core-updates-2019-blog], topics: [search-updates],
   text: "Google stressed that core updates are not punitive: they are not meant to punish any site but to improve how results are surfaced.",
   quote: "Core updates are not punitive."}
- {id: D3-C259, s: D3-S07, label: stage, ev: T:t04:10, ver: confirmed, src: [core-updates], topics: [search-updates],
   text: "Several times a year Google makes significant, broad changes to its search algorithms and systems, which it calls core updates."}
- {id: D3-C260, s: D3-S07, label: stage, ev: T:t04:10, ver: confirmed, src: [core-updates, search-status-ranking], topics: [search-updates],
   text: "Google announces core updates when they happen by posting them on the Google Search Status Dashboard."}
- {id: D3-C261, s: D3-S07, label: docs, ev: "", ver: source, src: [search-status-ranking], topics: [search-updates],
   text: "As of 3 October 2026, the Ranking history of Google's Search Status Dashboard lists two core updates in 2026 (March and May) and four spam updates (March, June, August and September)."}
- {id: D3-C262, s: D3-S07, label: stage, ev: T:t04:11, ver: confirmed, src: [core-updates, core-updates-2019-blog], topics: [search-updates],
   text: "Core updates do not target specific sites; they change how Google assesses certain properties of content."}
- {id: D3-C263, s: D3-S07, label: stage, ev: T:t04:11, ver: confirmed, src: [core-updates-2019-blog, core-updates], topics: [search-updates],
   text: "A core update may reward pages that were previously under-rewarded, so when some pages go down after a core update, other pages must go up."}
- {id: D3-C264, s: D3-S07, label: stage, ev: T:t04:11, ver: consistent, src: [core-updates-2019-blog], topics: [search-updates, spam-policies],
   text: "Pages that perform worse after a core update usually do not violate Google's spam policies; Google has changed, perhaps slightly, how it thinks about quality."}
- {id: D3-C265, s: D3-S07, label: stage, ev: T:t04:12, ver: undocumented, topics: [search-updates, search-quality-evaluation],
   rel: [{type: extends, to: D3-C170}],
   text: "Google sometimes couples a core update with an update to its Search Quality Rater Guidelines."}
- {id: D3-C266, s: D3-S07, label: docs, ev: "", ver: source, src: [core-updates-2019-blog], topics: [search-updates, search-quality-evaluation],
   text: "Google's 2019 post on core updates says Google tests any broad core update before it goes live, including feedback from its search quality raters, whose data is not used directly in ranking."}
- {id: D3-C267, s: D3-S07, label: stage, ev: [IMG_4812, T:t04:12, T:t04:18], ver: consistent, src: [core-updates, core-updates-2019-blog], topics: [search-updates],
   text: "The purpose of core updates is to improve the quality and relevance of search results for users."}
- {id: D3-C268, s: D3-S07, label: stage, ev: T:t04:13, ver: confirmed, src: [core-updates], topics: [search-updates, helpful-content],
   text: "Answering the common question whether to fix individual pages or the whole site after a core update, Google advised taking a close look at the site as a whole and trying to be objective."}
- {id: D3-C269, s: D3-S07, label: stage, ev: T:t04:13, ver: confirmed, src: [core-updates, helpful-content], topics: [search-updates],
   text: "Because owners struggle to judge their own site objectively, the speaker suggested asking someone else to review the site after a core update drop."}
- {id: D3-C270, s: D3-S07, label: stage, ev: T:t04:14, ver: undocumented, topics: [search-updates, measurement],
   text: "To improve a site after a core update, check whether users can complete their information journey on the site and ask users directly, for example with customer satisfaction (CSAT) surveys, then improve based on the answers."}
- {id: D3-C271, s: D3-S07, label: stage, ev: T:t04:14, ver: confirmed, src: [core-updates], topics: [helpful-content, search-updates],
   text: "Site owners should check whether the site overall, not just individual pages, delivers helpful, reliable, people-first content.",
   quote: "you should check if your site overall, not just individual pages, is delivering content that's helpful, reliable, and people-first"}
- {id: D3-C272, s: D3-S07, label: docs, ev: "", ver: source, src: [core-updates], topics: [search-updates, measurement],
   text: "Google's core updates page recommends waiting at least a full week after a core update has finished rolling out before analysing Search Console data, then comparing that week with a week before the update started."}
- {id: D3-C273, s: D3-S07, label: docs, ev: "", ver: source, src: [core-updates], topics: [search-updates],
   text: "Google's core updates page says a small drop in position after a core update (for example from 2 to 4) needs no drastic action, while a large drop (for example from 4 to 29) calls for a deeper assessment."}
- {id: D3-C274, s: D3-S07, label: stage, ev: T:t04:15, ver: confirmed, src: [spam-policies], topics: [spam-policies],
   text: "Google defines spam as web content designed to deceive users or to manipulate search results."}
- {id: D3-C275, s: D3-S07, label: stage, ev: T:t04:15, ver: consistent, src: [webspam-report-2020, webspam-report-2021, webspam-report-2022], topics: [spam-detection],
   rel: [{type: repeats, to: D2-C676}],
   text: "Google aims to keep more than 99% of search results free from spam and said it already achieves this, thanks to advances in AI."}
- {id: D3-C276, s: D3-S07, label: analysis, ev: "", ver: n/a, src: [webspam-report-2020, webspam-report-2021, webspam-report-2022], topics: [spam-detection],
   text: "Google's webspam reports measure the 99% figure as visits from Search (2020 and 2022 reports) or searches (2021 report) that are spam-free, not as search results; cite it as more than 99% of visits from Search being spam-free."}
- {id: D3-C277, s: D3-S07, label: slide, ev: [IMG_4813, T:t04:16], ver: confirmed, src: [spam-policies], topics: [spam-policies],
   text: "Google's slide 'Spam, spam and spam!' listed five spam types, cloaking, doorways, scraped content, link spam and hacked content, and pointed to goo.gle/spam-policy for more."}
- {id: D3-C278, s: D3-S07, label: slide, ev: IMG_4813, ver: confirmed, src: [spam-policies], topics: [spam-policies],
   text: "Google's slide defined cloaking as presenting different content to users and to search engines with the intent to manipulate search rankings and mislead users."}
- {id: D3-C279, s: D3-S07, label: slide, ev: IMG_4813, ver: confirmed, src: [spam-policies], topics: [spam-policies],
   text: "Google's slide defined doorways as sites or pages created to rank for specific, similar search queries that lead users to intermediate pages less useful than the final destination."}
- {id: D3-C280, s: D3-S07, label: slide, ev: IMG_4813, ver: consistent, src: [spam-policies], topics: [spam-policies, duplicate-content],
   text: "Google's slide said sites with mostly scraped content, taken from other sites without additional useful services or content, may not provide added value to users."}
- {id: D3-C281, s: D3-S07, label: slide, ev: IMG_4813, ver: consistent, src: [spam-policies, ranking-systems-guide], topics: [spam-policies],
   text: "Google's slide said Google uses links as an important factor in determining the relevancy of web pages, and any links intended to manipulate rankings in Google Search results may be considered link spam."}
- {id: D3-C282, s: D3-S07, label: slide, ev: IMG_4813, ver: consistent, src: [spam-policies, webspam-report-2020], topics: [spam-policies],
   text: "Google's slide defined hacked content as content placed on a site without permission through security vulnerabilities, said cleaning it up is hard and prevention is key, and linked to goo.gle/hack-tips."}
- {id: D3-C283, s: D3-S07, label: stage, ev: [IMG_4813, T:t04:16], ver: undocumented, topics: [spam-policies],
   text: "In the speaker's view, some of the egregious spam methods on the slide (cloaking, doorways, scraped content, link spam and hacked content) are not that common anymore or no longer matter much to Google.",
   quote: "Some of these, I would say, are not that common anymore, or we don't care all that much about them."}
- {id: D3-C284, s: D3-S07, label: stage, ev: [IMG_4813, T:t04:16], ver: undocumented, topics: [spam-policies, ai-content-detection],
   rel: [{type: extends, to: D3-C207}],
   text: "Reviewing the spam slide, the speaker said link spam would probably be replaced with scaled content abuse as the spam type worth talking about today."}
- {id: D3-C285, s: D3-S07, label: stage, ev: T:t04:16, ver: consistent, src: [spam-policies], topics: [spam-policies],
   text: "The number of ways to spam the web is close to infinite, and Google's spam policies describe some of the practices that deceive users."}
- {id: D3-C286, s: D3-S07, label: stage, ev: [IMG_4812, T:t04:17], ver: consistent, src: [spam-updates], topics: [search-updates],
   text: "When spammers find loopholes that Google's systems miss, Google releases spam updates that change its systems to catch them."}
- {id: D3-C287, s: D3-S07, label: docs, ev: "", ver: source, src: [spam-updates], topics: [search-updates, spam-detection],
   rel: [{type: extends, to: D2-C670}],
   text: "Google's spam updates page says its automated spam detection systems run constantly, and a notable improvement to them, such as to the AI-based SpamBrain system, is called a spam update and listed with Google's ranking updates."}
- {id: D3-C288, s: D3-S07, label: stage, ev: T:t04:17, ver: consistent, src: [spam-updates, spam-policies], topics: [search-updates],
   text: "Spam updates target only spam: they go after sites that churn out millions of low-quality pages to make money, very likely not the site owners and SEOs in the audience."}
- {id: D3-C289, s: D3-S07, label: slide, ev: [IMG_4814, T:t04:19], ver: consistent, src: [spam-updates], topics: [search-updates],
   text: "Google's 'Recoveries' slide said that to recover from a spam update a site should remove the kind of spam Google described in its blog announcements of the update."}
- {id: D3-C290, s: D3-S07, label: stage, ev: T:t04:19, ver: n/a, topics: [search-updates],
   text: "The speaker declined to give a timeline for recovering from a spam update, saying the update had targeted spam."}
- {id: D3-C291, s: D3-S07, label: docs, ev: "", ver: source, src: [spam-updates], topics: [search-updates],
   text: "Google's spam updates page says that after a spam update, changes may help a site improve if Google's automated systems learn over a period of months that the site complies with its spam policies."}
- {id: D3-C292, s: D3-S07, label: docs, ev: "", ver: source, src: [spam-updates], topics: [search-updates],
   text: "Google's spam updates page says that after a link spam update, fixing the site might not bring an improvement, because any ranking benefit the spammy links had generated is lost and cannot be regained."}
- {id: D3-C293, s: D3-S07, label: stage, ev: [IMG_4814, T:t04:20], ver: consistent, src: [core-updates-2019-blog], topics: [search-updates],
   text: "A ranking drop after a core update is not a penalty, so technically there is no recovery from a core update in the way there is after a spam update.",
   quote: "technically, and from a purely technical perspective, there's no recovery, because you were not penalized"}
- {id: D3-C294, s: D3-S07, label: stage, ev: T:t04:20, ver: consistent, src: [core-updates], topics: [search-updates],
   text: "After a core update a site can win back some of its rankings by improving the site as a whole."}
- {id: D3-C295, s: D3-S07, label: docs, ev: "", ver: source, src: [core-updates], topics: [search-updates],
   text: "Google's core updates page says improvements can take effect in a few days but may take several months for its systems to confirm that the site as a whole produces helpful content, sometimes only at the next core update."}
- {id: D3-C296, s: D3-S07, label: docs, ev: "", ver: source, src: [core-updates], topics: [search-updates],
   text: "Google's core updates page says Google also makes smaller core updates that are not announced, and these can also lift a site that has improved."}
- {id: D3-C297, s: D3-S07, label: stage, ev: T:t04:20, ver: consistent, src: [core-updates], topics: [search-updates],
   text: "A drop after a core update can simply mean that a competitor now does better because Google rethought how it assesses quality as a whole."}
- {id: D3-C298, s: D3-S07, label: slide, ev: IMG_4814, ver: consistent, src: [core-updates, core-updates-2019-blog], topics: [search-updates],
   text: "Google's 'Recoveries' slide advised sites affected by a core update to keep doing a great job, look at what competitors are doing better and learn from sites that are doing better."}
- {id: D3-C299, s: D3-S07, label: analysis, ev: "", ver: n/a, src: [core-updates], topics: [search-updates, helpful-content],
   text: "After a core update drop, plan a site-wide quality review instead of page-by-page fixes or a technical 'recovery': have someone outside the team assess the site, compare it with the pages that gained, and test whether users can finish their task, for example with short satisfaction surveys."}
- {id: D3-C300, s: D3-S07, label: analysis, ev: "", ver: n/a, topics: [spam-policies, ai-content-detection],
   text: "Weight spam audits toward scaled content abuse: a Googler said that type would replace link spam on the slide, so review mass-produced pages, including AI-generated ones, before older link-building patterns."}
- {id: D3-C301, s: D3-S07, label: analysis, ev: "", ver: n/a, topics: [spam-policies],
   text: "For developers, Google's five listed spam types map to concrete checks: serve Googlebot the same content as users (cloaking), avoid near-identical location or keyword pages (doorways), add value to reused content (scraped content), and patch and monitor the CMS against injected pages and links (hacked content)."}

# ---------- D3-S10 How Search results are born ----------
- {id: D3-C302, s: D3-S10, label: stage, ev: T:t05:1, ver: undocumented, topics: [serp-anatomy],
   text: "Google described its search results page as an auction system in which the individual results, of different types, all bid for a place on the page; the auction is a metaphor for result types competing for space, not a reference to ads."}
- {id: D3-C303, s: D3-S10, label: stage, ev: [T:t05:2, T:t05:9], ver: undocumented, topics: [serp-anatomy],
   text: "Text results are the most common and most prominent result type on Google's results page, whether they are generated by an LLM or not, or enhanced in some other way, Google's speaker said."}
- {id: D3-C304, s: D3-S10, label: stage, ev: T:t05:3, ver: consistent, src: [how-search-works], topics: [query-understanding, serp-anatomy],
   rel: [{type: extends, to: D3-C004}],
   text: "Which kinds of results Google shows for a query is decided by query understanding, which tries to predict the intent behind the query."}
- {id: D3-C305, s: D3-S10, label: stage, ev: [T:t05:3, T:t05:4, T:t05:5], ver: consistent, src: [visual-elements-gallery, how-search-works], topics: [query-understanding, serp-anatomy],
   text: "When the query itself names the wanted result type, as 'pictures' does in 'orange pictures' (or a query asking for videos or news), Google can read the intent directly from that word."}
- {id: D3-C306, s: D3-S10, label: stage, ev: T:t05:4, ver: undocumented, topics: [search-evolution, images, serp-anatomy],
   text: "Google said it shows images on the web results page, not only in image search, because from 2005-2006 it saw people appending words such as 'pictures' or 'images' to their queries, which led to the launch of universal search."}
- {id: D3-C307, s: D3-S10, label: docs, ev: "", ver: source, src: [universal-search-blog-2007], topics: [search-evolution],
   text: "Google launched universal search on 16 May 2007, blending results from Images, Maps, Books, Video and News into its web results."}
- {id: D3-C308, s: D3-S10, label: analysis, ev: "", ver: n/a, src: [universal-search-blog-2007], topics: [search-evolution],
   text: "Google's 2007 launch post explained universal search by the growing number of separate search tools and traced it to a 2001 results-page mockup; the 2005-2006 image-seeking queries named on stage are a further motivation the post does not mention, and they predate the May 2007 launch."}
- {id: D3-C309, s: D3-S10, label: stage, ev: T:t05:6, ver: consistent, src: [hsw-ranking-results], topics: [query-understanding, serp-anatomy],
   text: "For an ambiguous query such as 'orange', Google uses historical data: it looks at how users reacted to different kinds of results for previous and similar queries and shows the result types users prefer."}
- {id: D3-C310, s: D3-S10, label: docs, ev: "", ver: source, src: [hsw-ranking-results], topics: [query-understanding],
   text: "Google's How Search Works pages say Google uses aggregated and anonymized interaction data to assess whether search results are relevant to queries, turning that data into signals for its machine-learned systems."}
- {id: D3-C311, s: D3-S10, label: stage, ev: T:t05:7, ver: undocumented, topics: [query-understanding, images],
   rel: [{type: extends, to: D2-C740}, {type: repeats, to: D1-C224}],
   text: "Google handles an image used as a search query much like a text query interpreted as an embedding: the image is broken down into vectors (embeddings) that are then searched for in the index."}
- {id: D3-C312, s: D3-S10, label: stage, ev: T:t05:7, ver: undocumented, topics: [query-understanding, images],
   text: "Google can still detect intent for image queries, even though they are searched as embeddings, the speaker said."}
- {id: D3-C313, s: D3-S10, label: stage, ev: T:t05:8, ver: consistent, src: [visual-elements-gallery], topics: [serp-anatomy],
   text: "Google uses an abstract drawing of the search results page in its documentation so that the illustration does not go out of date as fast as a screenshot."}
- {id: D3-C314, s: D3-S10, label: stage, ev: T:t05:9, ver: confirmed, src: [visual-elements-gallery], topics: [serp-anatomy, snippet-controls],
   text: "A text result on Google's results page is made of parts such as the attribution, the title link, the snippet and the site name."}
- {id: D3-C315, s: D3-S10, label: docs, ev: "", ver: source, src: [visual-elements-gallery], topics: [serp-anatomy, rich-results],
   text: "Google's Visual Elements gallery describes a text result as based on the page's textual content, with attribution, title link and snippet; attribution can include the site name, favicon and visible URL, and a rich result typically relies on structured data."}
- {id: D3-C316, s: D3-S10, label: stage, ev: T:t05:9, ver: confirmed, src: [title-links, snippets-guide], topics: [serp-anatomy, snippet-controls],
   rel: [{type: extends, to: D2-C724}],
   text: "Google generates the parts of a text result, such as title link and snippet, from its understanding of the underlying web page, even when the site owner provides nothing extra."}
- {id: D3-C317, s: D3-S10, label: stage, ev: T:t05:10, ver: consistent, src: [preferred-sources-guide], topics: [serp-anatomy, preferred-sources],
   rel: [{type: extends, to: D1-C027}],
   text: "Google can add elements to a text result, such as a 'highly cited' badge or a preferred-source badge."}
- {id: D3-C318, s: D3-S10, label: stage, ev: T:t05:10, ver: undocumented, topics: [serp-anatomy, linked-subscriptions],
   text: "Some search features work the other way round: a feature container holds text results inside it; the speaker could not recall that feature's name and suggested, unsure, linked subscriptions."}
- {id: D3-C319, s: D3-S10, label: stage, ev: T:t05:11, ver: undocumented, topics: [images, serp-anatomy],
   rel: [{type: extends, to: D2-C525}],
   text: "Image results shown among web results come from Google's image index and are roughly the same images that Google Images shows for the same query."}
- {id: D3-C320, s: D3-S10, label: stage, ev: T:t05:12, ver: confirmed, src: [video-seo], topics: [video, serp-anatomy],
   text: "Video results in web search have thumbnails and attribution that come from the page or from its markup."}
- {id: D3-C321, s: D3-S10, label: slide, ev: IMG_4816, ver: consistent, src: [how-search-works], topics: [pipeline-overview, serp-anatomy],
   rel: [{type: repeats, to: D3-C001}],
   text: "Google's serving diagram shows the query passing through query understanding and retrieval to the index, then back through ranking and search features to the user, with the Search Features step highlighted (example query 'Where to eat orange')."}
- {id: D3-C322, s: D3-S10, label: stage, ev: [T:t05:13, IMG_4816], ver: consistent, src: [how-search-works], topics: [serp-anatomy, rich-results],
   text: "Google generates search features as the last serving step: it sends the query to the index, gets results back, ranks them and then builds the search features."}
- {id: D3-C323, s: D3-S10, label: stage, ev: T:t05:13, ver: consistent, src: [visual-elements-gallery], topics: [serp-anatomy, rich-results],
   rel: [{type: extends, to: D2-C446}],
   text: "Most of Google's search features need nothing extra from the site owner; Google generates them from what it extracted from the page during indexing."}
- {id: D3-C324, s: D3-S10, label: stage, ev: T:t05:14, ver: confirmed, src: [visual-elements-gallery, intro-structured-data], topics: [rich-results, structured-data, serp-anatomy],
   rel: [{type: extends, to: D2-C521}],
   text: "Rich results differ from other search features because Google builds them from extra data that site owners provide, usually structured data and usually in JSON-LD format.",
   quote: "The magic behind rich results is usually structured data. Emphasis on \"usually\"."}
- {id: D3-C325, s: D3-S10, label: stage, ev: T:t05:15, ver: confirmed, src: [ai-features-guide], topics: [rich-results, structured-data, ai-links-to-web],
   rel: [{type: extends, to: D2-C726}],
   text: "AI Mode and AI Overviews are not rich results but standard search features: they need no structured data to function and work with the normal text results from Google's index.",
   quote: "AI Mode and AI Overviews are not rich results."}
- {id: D3-C326, s: D3-S10, label: docs, ev: "", ver: source, src: [ai-features-guide], topics: [ai-links-to-web, structured-data],
   text: "Google's AI features guide says there are no additional requirements, and no special schema.org structured data, needed to appear in AI Overviews or AI Mode; a page must be indexed and eligible to be shown with a snippet."}
- {id: D3-C327, s: D3-S10, label: stage, ev: T:t05:15, ver: consistent, src: [ai-features-guide], topics: [structured-data, ai-links-to-web],
   text: "Google said that if AI Mode one day showcases images, recipes or similar elements, those parts would need structured data, but in their current form AI Mode and AI Overviews require pretty much nothing extra."}
- {id: D3-C328, s: D3-S10, label: analysis, ev: "", ver: n/a, topics: [structured-data, ai-links-to-web],
   text: "Day 2 said the structured data Google processes also feeds AI Overviews and AI Mode (D2-C476), while Day 3 said these features do not need structured data to function: markup is not a condition for appearing in AI features, but data taken from it can still reach them."}
- {id: D3-C329, s: D3-S10, label: stage, ev: T:t05:16, ver: confirmed, src: [search-gallery], topics: [rich-results, structured-data-implementation],
   rel: [{type: repeats, to: D2-C490}],
   text: "Google's structured data feature guide lists the kinds of structured data Google supports with a search feature and what each can do to a site's search results."}
- {id: D3-C330, s: D3-S10, label: stage, ev: T:t05:18, ver: consistent, src: [article-sd], topics: [rich-results, structured-data-implementation],
   text: "Article structured data is a broad type with many properties and nested types, which Google uses to learn more about published content, such as its headline, author and publication date."}
- {id: D3-C331, s: D3-S10, label: slide, ev: [IMG_4817, T:t05:18], ver: consistent, src: [article-sd], topics: [rich-results, structured-data-implementation],
   text: "Google's rich results slide said Article structured data is not required to appear in Top Stories but is highly recommended for all articles.",
   quote: "Not required for \"Top Stories,\" but highly recommended for all articles.", quote_checked: true}
- {id: D3-C332, s: D3-S10, label: docs, ev: "", ver: source, src: [article-sd], topics: [rich-results, structured-data-implementation],
   text: "Google's Article documentation says there is no markup requirement to be eligible for Google News features like Top stories, and that Article markup can tell Google more explicitly that content is a news article, who the author is and what the title is."}
- {id: D3-C333, s: D3-S10, label: slide, ev: IMG_4817, ver: confirmed, src: [article-sd, paywalled-content-sd], topics: [rich-results, structured-data-implementation],
   text: "Google's Article rich results slide said structured data can be used to indicate that content is behind a paywall."}
- {id: D3-C334, s: D3-S10, label: slide, ev: IMG_4817, ver: confirmed, src: [article-sd], topics: [structured-data-implementation],
   text: "Google's Article slide showed the NewsArticle JSON-LD example from Google's Article documentation: a block in the page head with headline, three image URLs (1x1, 4x3 and 16x9), datePublished and dateModified with time zone offsets, and an author list of Person objects with name and url."}
- {id: D3-C335, s: D3-S10, label: stage, ev: T:t05:19, ver: confirmed, src: [visual-elements-gallery, site-names], topics: [serp-anatomy, rich-results],
   text: "Google described the site name as an attribution feature rather than a rich result, and said site owners can influence which site name Google shows for their site in search results."}
- {id: D3-C336, s: D3-S10, label: docs, ev: "", ver: source, src: [site-names], topics: [serp-anatomy, structured-data-implementation],
   text: "Google's site name documentation says site names are generated automatically from a site's home page and references to it on the web, and that a site can indicate its preferred name with WebSite structured data on its home page."}
- {id: D3-C337, s: D3-S10, label: stage, ev: T:t05:20, ver: confirmed, src: [review-snippet-sd], topics: [rich-results],
   rel: [{type: extends, to: D2-C454}],
   text: "Review structured data lets a site specify how its users rated something; the review snippet shows an average star rating and often the number of reviews of a product, service or piece of content."}
- {id: D3-C338, s: D3-S10, label: stage, ev: T:t05:20, ver: undocumented, topics: [rich-results],
   text: "Google said users rely quite a bit on review stars, calling them a powerful signal of quality and trust for users and a way for sites to use social proof to increase clicks.",
   quote: "Those little yellow stars are a powerful signal of quality and trust for our users."}
- {id: D3-C339, s: D3-S10, label: stage, ev: T:t05:20, ver: confirmed, src: [review-snippet-sd], topics: [rich-results],
   text: "Review snippets can be used for many kinds of things, from products to local businesses, movies and books."}
- {id: D3-C340, s: D3-S10, label: docs, ev: "", ver: source, src: [review-snippet-sd], topics: [rich-results, structured-data-implementation],
   text: "Google's review snippet documentation supports ratings for local businesses and organizations only on sites that capture reviews about other businesses; self-serving reviews of a site's own business are not eligible."}
- {id: D3-C341, s: D3-S10, label: stage, ev: T:t05:20, ver: undocumented, topics: [rich-results, localisation],
   rel: [{type: extends, to: D2-C614}],
   text: "Some countries rely a lot on social proof such as reviews, Google's speaker said, recalling a point from Google's Day 2 internationalisation talk."}
- {id: D3-C342, s: D3-S10, label: stage, ev: T:t05:21, ver: consistent, src: [product-sd-intro], topics: [rich-results, merchant-markup],
   text: "Google called product rich results essential for any e-commerce business; they can show the product's rating, the number of reviews and other details."}
- {id: D3-C343, s: D3-S10, label: stage, ev: [T:t05:21, T:t05:22], ver: confirmed, src: [product-sd-intro], topics: [merchant-markup, shopping-data],
   text: "Google Search displays product rich results from product structured data; it may also use the product data a merchant provides in Google Merchant Center, but Merchant Center is not required for them."}
- {id: D3-C344, s: D3-S10, label: docs, ev: "", ver: source, src: [product-sd-intro], topics: [merchant-markup, shopping-data],
   text: "Google's Product structured data introduction says that providing both on-page structured data and a Merchant Center feed maximizes eligibility for shopping experiences and helps Google understand and verify the data; product snippets may take pricing from the feed when the markup lacks it."}
- {id: D3-C345, s: D3-S10, label: stage, ev: T:t05:22, ver: consistent, src: [product-sd-intro], topics: [merchant-markup, images],
   text: "Product annotations on Google Images results also come from product structured data and do not need Google Merchant Center."}
- {id: D3-C346, s: D3-S10, label: stage, ev: T:t05:23, ver: consistent, src: [product-sd-intro, mc-free-listings], topics: [shopping-data, merchant-markup],
   text: "To appear in the Shopping tab of Google Search, a product must be submitted in Google Merchant Center; product structured data alone is not enough."}
- {id: D3-C347, s: D3-S10, label: docs, ev: "", ver: source, src: [mc-free-listings], topics: [shopping-data, merchant-markup],
   text: "Google's Merchant Center help says products and details crawled from an online store can show up on Google even when they are not marked up with schema.org or added in Merchant Center, and lists the Shopping tab among the places Merchant Center free listings appear."}
- {id: D3-C348, s: D3-S10, label: analysis, ev: "", ver: n/a, src: [mc-free-listings, product-sd-intro], topics: [shopping-data, merchant-markup],
   text: "Google's free listings help says crawled store products can appear on Google without markup or Merchant Center but does not say whether that includes the Shopping tab; for a shop that wants Shopping tab visibility, the stage rule that Merchant Center is required is the safe working assumption."}
- {id: D3-C349, s: D3-S10, label: stage, ev: T:t05:23, ver: confirmed, src: [product-sd-intro, mc-automatic-updates], topics: [shopping-data, merchant-markup],
   text: "Product structured data can help Merchant Center in some cases, for example during data validation, but Merchant Center does not require it."}
- {id: D3-C350, s: D3-S10, label: docs, ev: "", ver: source, src: [mc-automatic-updates], topics: [shopping-data, merchant-markup],
   text: "Merchant Center's automatic item updates use structured data and other product data found on landing pages to fix price, sale price, availability and condition mismatches in a merchant's product data; Google says they do not replace regular feed updates."}
- {id: D3-C351, s: D3-S10, label: analysis, ev: "", ver: n/a, topics: [merchant-markup, shopping-data],
   text: "For an online shop, Product structured data is enough for product rich results and Google Images product annotations, but the Shopping tab needs a Merchant Center feed too; keep feed and markup values identical, since Google can use the markup to validate the feed."}

# ---------- D3-S11 Shopping on Search: Beyond the blue links ----------
- {id: D3-C352, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:24, ver: undocumented, topics: [shopping-data],
   text: "Google's Merchant Center feed specification is how millions of merchants send Google billions of product offers, which are used in Shopping ads, Search ads and organic search results."}
- {id: D3-C353, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:24, ver: undocumented, topics: [schema-org, merchant-markup],
   text: "Schema.org product markup on websites is another source of billions of product offers for Google Shopping, next to merchant feeds."}
- {id: D3-C354, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:25, ver: confirmed, src: [product-sd-intro], topics: [merchant-markup, shopping-data],
   text: "Product snippets in Google Search are powered by both shopping feeds and schema.org structured data."}
- {id: D3-C355, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:26, ver: consistent, src: [product-sd-intro], topics: [shopping-data, merchant-markup],
   text: "Traditional shopping results use a small set of well-defined attributes because they take little screen space: title, image, price, perhaps star ratings, shipping cost and time, and return information; in the past that was sufficient."}
- {id: D3-C356, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:26, ver: consistent, src: [mc-product-data-spec], topics: [shopping-data, query-understanding],
   text: "Behind the visible attributes, small pieces of product data such as brand and UPC or other barcodes are very important for Google Shopping's query understanding, retrieval and ranking."}
- {id: D3-C357, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:27, ver: consistent, src: [ai-features-guide], topics: [ai-mode-usage, shopping-data],
   text: "In AI Mode, shoppers keep asking deeper, more nuanced follow-up questions about brands and products, so AI Mode must return much more detailed product information than classic shopping results needed."}
- {id: D3-C358, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:28, ver: undocumented, topics: [ai-crawlers-and-agents, shopping-data],
   text: "Product data quality matters more than ever for AI ('garbage in, garbage out'), and even more for agents acting on behalf of consumers, because an agent with bad data cannot do the right thing.",
   quote: "If the agent has bad data, it cannot do the right things."}
- {id: D3-C359, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:29, ver: consistent, src: [gml-2026-shopping-blog, mc-question-and-answer], topics: [shopping-data],
   text: "In 2026, a few months before the October event, Google added new Merchant Center feed attributes to help AI systems understand product nuances, prompted by feedback since 2025 from merchants worried whether AI experiences represented them correctly."}
- {id: D3-C360, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:29, ver: confirmed, src: [gml-2026-shopping-blog], topics: [shopping-data],
   text: "Google announced the new conversational feed attributes at Google Marketing Live (GML) 2026; the recording also appears to name Google I/O."}
- {id: D3-C361, s: D3-S11, label: docs, ev: "", ver: source, src: [ucp-launch-blog], topics: [shopping-data],
   text: "On 11 January 2026 Google announced 'dozens of new data attributes' in Merchant Center for conversational commerce on AI Mode, Gemini and Business Agent, to roll out first with a small group of retailers."}
- {id: D3-C362, s: D3-S11, label: docs, ev: "", ver: source, src: [gml-2026-shopping-blog], topics: [shopping-data],
   text: "At Google Marketing Live on 20 May 2026 Google said retailers globally can now use conversational attributes in Merchant Center to reflect the more conversational way people search."}
- {id: D3-C363, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:30, ver: undocumented, topics: [shopping-data],
   text: "Google decided against adding hundreds of thousands of highly specific feed attributes, such as heel height for shoes or lens details for cameras, and instead added a few flexible ones that leave merchants in control."}
- {id: D3-C364, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:30, ver: undocumented, topics: [shopping-data, structured-data],
   text: "Google Shopping said highly prescriptive product data is a lot of hard work for merchants and is no longer needed for LLMs."}
- {id: D3-C365, s: D3-S11, label: stage, who: Alex Jansen, ev: [T:t05:31, T:t05:32], ver: confirmed, src: [mc-product-data-spec], topics: [shopping-data],
   rel: [{type: extends, to: D2-C509}],
   text: "Google added six Merchant Center feed attributes for AI shopping experiences: question and answer, documents, related products, item group title and variant option for variants, and popularity rank."}
- {id: D3-C366, s: D3-S11, label: analysis, ev: "", ver: n/a, src: [ucp-launch-blog, mc-product-data-spec], topics: [shopping-data],
   text: "Google's January 2026 announcement spoke of 'dozens' of new Merchant Center attributes, while the Day 3 talk counted six; all six named on stage (question_and_answer, document_link, related_product, item_group_title, variant_option, popularity_rank) are in the Merchant Center product data specification as of 3 October 2026."}
- {id: D3-C367, s: D3-S11, label: docs, ev: "", ver: source, src: [mc-question-and-answer, mc-document-link, mc-related-product, mc-popularity-rank], topics: [shopping-data, ai-mode-usage],
   text: "Google's Merchant Center help marks the question_and_answer, document_link, related_product and popularity_rank attributes as primarily intended for conversational experiences such as AI Mode in Google Search."}
- {id: D3-C368, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:31, ver: confirmed, src: [mc-question-and-answer], topics: [shopping-data],
   text: "The question and answer feed attribute lets a merchant or brand upload questions and answers relevant to a product, whether they come from the manufacturer or from consumers."}
- {id: D3-C369, s: D3-S11, label: docs, ev: "", ver: source, src: [mc-product-data-spec, mc-question-and-answer], topics: [shopping-data],
   text: "Merchant Center's question_and_answer attribute takes up to 30 question-and-answer pairs per product, each question and answer up to 1,000 characters and 10,000 characters in total, and must not contain prices, shipping, dates or the company name."}
- {id: D3-C370, s: D3-S11, label: stage, who: Alex Jansen, ev: [T:t05:31, T:t05:43], ver: confirmed, src: [mc-document-link], topics: [shopping-data],
   text: "Merchants can now provide a document describing a product, such as a PDF manual, a spec sheet or the package contents, so that AI can work out what the product is about."}
- {id: D3-C371, s: D3-S11, label: docs, ev: "", ver: source, src: [mc-document-link, mc-product-data-spec], topics: [shopping-data],
   text: "Merchant Center's document_link attribute takes up to five URLs of PDF documents about a product, such as manuals, user guides or assembly instructions, and the merchant must own the content licensing rights."}
- {id: D3-C372, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:31, ver: confirmed, src: [mc-related-product], topics: [shopping-data],
   text: "The related products feed attribute describes accessories, parts and replacement products, answering frequent questions such as what else to buy with a printer."}
- {id: D3-C373, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:32, ver: consistent, src: [mc-item-group-title, mc-variant-option], topics: [shopping-data],
   text: "Variant data in Google's feed specification used to be limited to basics such as colour and size; the new item group title and variant option attributes make it much more flexible."}
- {id: D3-C374, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:32, ver: consistent, src: [mc-popularity-rank], topics: [shopping-data],
   text: "Google added a popularity rank feed attribute because consumers want to know how well a product sells on a marketplace."}
- {id: D3-C375, s: D3-S11, label: docs, ev: "", ver: source, src: [mc-popularity-rank, mc-product-data-spec], topics: [shopping-data],
   text: "Merchant Center's popularity_rank is a 0-100 value the merchant assigns to rank a product's popularity, based on its recent sales, against the rest of its own inventory; it does not reflect user ratings."}
- {id: D3-C376, s: D3-S11, label: analysis, ev: "", ver: n/a, src: [mc-popularity-rank], topics: [shopping-data],
   text: "On stage the popularity rank was framed as how well a product sells on a marketplace, but Google's documentation defines it as the merchant's own 0-100 ranking against the rest of its inventory: a self-reported, relative value, not a sales figure across shops."}
- {id: D3-C377, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:33, ver: consistent, src: [mc-question-and-answer], topics: [shopping-data],
   text: "Product Q&A data lets AI answer very detailed questions, such as a kettle's temperature settings, capacity or keep-warm safety, that separate feed attributes could never represent; Google's example came from a real merchant's product."}
- {id: D3-C378, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:34, ver: undocumented, topics: [structured-data, shopping-data],
   rel: [{type: extends, to: D2-C489}],
   text: "Google Shopping called rich data with light structure the AI sweet spot: a little structure that helps the AI system understand the data, not deep, highly nested, complex structures."}
- {id: D3-C379, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:34, ver: undocumented, topics: [structured-data],
   text: "Some structure is much better than none for AI systems, because without structure the model does not really know what is going on, Google Shopping said."}
- {id: D3-C380, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:35, ver: undocumented, topics: [schema-org, merchant-markup, shopping-data],
   text: "Most of the new conversational feed attributes were already available in schema.org, so Google ties them back to structured data and can use them from product markup as well as from feeds."}
- {id: D3-C381, s: D3-S11, label: analysis, ev: "", ver: n/a, src: [mc-question-and-answer, mc-document-link, mc-related-product, mc-popularity-rank, mc-variant-option, mc-product-detail, mc-item-group-title, merchant-listing-sd], topics: [schema-org, merchant-markup, shopping-data],
   text: "As of 3 October 2026 Google's Merchant Center help lists no schema.org property for question_and_answer, document_link, related_product, popularity_rank, variant_option or product_detail (only item_group_title maps, to ProductGroup.name), and Search Central does not document such markup: reading these attributes from schema.org is a stage statement, the feed is the documented route."}
- {id: D3-C382, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:36, ver: confirmed, src: [merchant-listing-sd], topics: [merchant-markup, structured-data-implementation],
   text: "Basic product markup has two parts: product data that is the same for every merchant (name, description, brand, images) and offer data specific to one merchant's offer (URL, condition, availability, price)."}
- {id: D3-C383, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:36, ver: confirmed, src: [merchant-listing-sd], topics: [merchant-markup, structured-data-implementation],
   rel: [{type: extends, to: D2-C505}],
   text: "In product markup, an offer's shipping and return information can point through a JSON-LD identifier (@id) to shipping and return data defined elsewhere."}
- {id: D3-C384, s: D3-S11, label: docs, ev: "", ver: source, src: [merchant-listing-sd], topics: [merchant-markup, structured-data-implementation],
   text: "Google's merchant listing documentation recommends defining shipping and return policies once under Organization markup and referencing them from an Offer, even on another page, using only the @id keyword (through hasShippingService for shipping, hasMerchantReturnPolicy for returns)."}
- {id: D3-C385, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:37, ver: consistent, src: [mc-storebot, common-crawlers], topics: [crawl-pipeline, shopping-data],
   rel: [{type: extends, to: D1-C065}],
   text: "Google Shopping uses its own crawler, Storebot (Storebot-Google), instead of Googlebot because it needs fresh product information, prices, availability and shipping details and therefore crawls much more often."}
- {id: D3-C386, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:37, ver: confirmed, src: [mc-storebot], topics: [crawl-pipeline, shopping-data],
   text: "Storebot-Google is used to validate merchant feeds: when a feed gives a price, Google double-checks it on the merchant's site."}
- {id: D3-C387, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:38, ver: confirmed, src: [mc-storebot], topics: [crawl-pipeline, shopping-data],
   text: "Storebot-Google also does deep crawls, for example of checkout pages, which do not belong in the search index; this is another reason it is kept separate from Googlebot."}
- {id: D3-C388, s: D3-S11, label: docs, ev: "", ver: source, src: [mc-storebot], topics: [crawl-pipeline, shopping-data],
   text: "Google's Merchant Center help says the StoreBot crawler goes through product detail, cart and checkout pages, can fill in checkout forms, and records price, shipping, availability, coupons and payment methods to verify the data merchants share in Merchant Center."}
- {id: D3-C389, s: D3-S11, label: docs, ev: "", ver: source, src: [common-crawlers], topics: [crawl-pipeline, robots-txt, shopping-data],
   text: "Google's crawler list says robots.txt rules addressed to the Storebot-Google user agent affect all surfaces of Google Shopping, such as the Shopping tab in Google Search."}
- {id: D3-C390, s: D3-S11, label: analysis, ev: "", ver: n/a, topics: [robots-txt, crawl-pipeline, shopping-data],
   text: "Treat Storebot-Google separately from Googlebot in robots.txt and bot protection: a shop that blocks it on product, cart or checkout paths can undermine Shopping price and availability checks, even when Googlebot is allowed."}
- {id: D3-C391, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:39, ver: undocumented, topics: [schema-org, structured-data-implementation],
   text: "Product Q&A can be marked up in schema.org by linking Question items, each with an acceptedAnswer of type Answer, to the product through the subjectOf property, because the product is the subject of the Q&A."}
- {id: D3-C392, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:40, ver: confirmed, src: [mc-product-highlight, mc-product-detail], topics: [shopping-data],
   text: "Google now emphasises two existing Merchant Center attributes for AI, product highlights (a short bulleted list) and product detail (detailed specifications), and updated its Help Center guidance to say they help AI systems."}
- {id: D3-C393, s: D3-S11, label: docs, ev: "", ver: source, src: [mc-product-highlight, mc-product-data-spec], topics: [shopping-data],
   text: "Merchant Center's product_highlight attribute takes 2 to 100 highlights of up to 150 characters each that describe only the product itself, without promotional text, keywords or search terms."}
- {id: D3-C394, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:41, ver: confirmed, src: [mc-product-detail], topics: [shopping-data],
   text: "Instead of adding feed attributes for individual specifications such as connectivity, memory, camera settings or box contents, Google asks merchants to send them as key-value pairs in product detail, because merchants know best what matters."}
- {id: D3-C395, s: D3-S11, label: docs, ev: "", ver: source, src: [mc-product-detail, mc-product-data-spec], topics: [shopping-data],
   text: "Merchant Center's product_detail attribute takes up to 100 specifications, each a section name, attribute name and attribute value, and Google's help says clean key-value specifications improve product details on Google Shopping and AI-driven surfaces."}
- {id: D3-C396, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:42, ver: consistent, src: [search-docs-updates], topics: [schema-org, shopping-data],
   rel: [{type: extends, to: D2-C506}],
   text: "Google works to make sure that what merchants can express in its shopping feeds can also be expressed in schema.org, adding vocabulary where schema.org lacks it, for example for product details."}
- {id: D3-C397, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:42, ver: consistent, src: [ucp-launch-blog], topics: [schema-org, shopping-data],
   text: "Google named the Universal Commerce Protocol (UCP), next to the Merchant Center feed, as an industry standard whose capabilities it also wants schema.org to cover."}
- {id: D3-C398, s: D3-S11, label: docs, ev: "", ver: source, src: [ucp-launch-blog], topics: [shopping-data, ai-crawlers-and-agents],
   text: "Google launched the Universal Commerce Protocol (UCP) on 11 January 2026 as an open standard for agentic commerce across discovery, buying and post-purchase support, co-developed with retailers and platforms and compatible with A2A, AP2 and MCP."}
- {id: D3-C399, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:43, ver: undocumented, topics: [schema-org, merchant-markup],
   text: "A recent schema.org release added two properties, specification and valueGroup, so that the Merchant Center product detail attribute can be expressed in schema.org, with product specs nested under specification."}
- {id: D3-C400, s: D3-S11, label: analysis, ev: "", ver: n/a, topics: [schema-org, merchant-markup],
   text: "Schema.org's release notes show version 30.1 (16 September 2026) added specification, isOftenBoughtWith and consumerNotice for Product, valueGroup for PropertyValue and itemPopularity for Offer as vocabulary for retail feed data; Google's Search Central docs did not yet document these properties on 3 October 2026."}
- {id: D3-C401, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:44, ver: undocumented, topics: [structured-data, merchant-markup],
   text: "Rich, lightly structured information is critical to AI systems: product data with many levels of nesting is not needed, but some structure is very important.",
   quote: "rich, lightly structured information is critical to AI systems."}
- {id: D3-C402, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:44, ver: consistent, src: [product-sd-intro], topics: [merchant-markup, shopping-data],
   text: "Basic, well-specified product attributes such as price, brand and availability remain as important as ever for Google Shopping."}
- {id: D3-C403, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:44, ver: undocumented, topics: [shopping-data, merchant-markup],
   text: "Rich, less structured product data that is not prescribed by Google, schema.org or any feed or data model is increasingly important, because the merchant or brand knows best what to provide."}
- {id: D3-C404, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:45, ver: undocumented, topics: [shopping-data, ai-crawlers-and-agents],
   text: "The bar for product data quality is higher than ever because agents and users need correct information: with wrong data an agent might buy the wrong product for a user."}
- {id: D3-C405, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:45, ver: consistent, src: [intro-structured-data], topics: [structured-data, merchant-markup],
   rel: [{type: repeats, to: D2-C469}],
   text: "Web markup is an efficient and unambiguous way for sites to share product data with Google, Google Shopping said, repeating the Day 2 structured data talk."}
- {id: D3-C406, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:46, ver: undocumented, topics: [structured-data-implementation, merchant-markup],
   text: "Google Shopping named the downside of adding Q&As and documentation to product markup: the page's markup becomes somewhat bigger."}
- {id: D3-C407, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:47, ver: confirmed, src: [holiday-agentic-commerce-blog], topics: [shopping-data],
   text: "Google Shopping pointed to a Google holiday shopping blog post with early results from real merchants using the conversational attributes, and to the Merchant Center Help Center and schema.org for the attributes and properties."}
- {id: D3-C408, s: D3-S11, label: docs, ev: "", ver: source, src: [holiday-agentic-commerce-blog], topics: [shopping-data, ai-mode-usage],
   text: "Google's 16 September 2026 holiday shopping post says that in testing with lululemon, conversational attributes submitted by the brand were used 50% of the time in relevant product recommendations in AI Mode."}
- {id: D3-C409, s: D3-S11, label: stage, who: Alex Jansen, ev: T:t05:48, ver: n/a, topics: [shopping-data],
   text: "Google Shopping described product data for AI as early days in a fast-moving area, with many more changes to come."}
- {id: D3-C410, s: D3-S11, label: analysis, ev: "", ver: n/a, topics: [shopping-data, merchant-markup, structured-data-implementation],
   text: "Shop developers should first keep core feed and markup values (price, availability, brand, GTIN) accurate, then add Q&As, product highlights, specs as key-value product details and related products in the Merchant Center feed, and mirror them in schema.org Product markup only as Google documents support for it."}
- {id: D3-C411, s: D3-S11, label: analysis, ev: "", ver: n/a, topics: [shopping-data, helpful-content],
   text: "Content teams can feed the new Q&A attribute from real customer questions (support tickets, reviews, sales chats), answered factually per product; this is the detailed, merchant-owned data Google said AI shopping answers need."}

# ---------- D3-S12 Inside Search Console: What’s New & How to Use It ----------
- {id: D3-C412, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: [IMG_4819, T:t06:1, T:t06:2, T:t06:17], ver: n/a, topics: [search-console-features],
   text: "Google's Search Console talk at the Deep Dive covered five Search Console launches of the past year: query groups, AI-powered configuration of the Performance report, generative AI control and reporting, platform properties for social accounts, and multimodal search reporting."}
- {id: D3-C413, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: [T:t06:3, T:t06:5], ver: confirmed, src: [query-groups-blog], topics: [search-console-features],
   text: "Search Console's query groups put together queries that express a very similar user intent but are written differently, for example with more or fewer words or with spelling errors, so site owners can see the intent behind their traffic instead of every query string."}
- {id: D3-C414, s: D3-S12, label: slide, who: Ariel Kroszynski, ev: [IMG_4820, T:t06:4], ver: confirmed, src: [britney-archive], topics: [search-console-features],
   text: "To show how diverse queries for one intent are, Google's Search Console talk showed a slide titled 'How to spell Britney Spears?' with a long list of spelling variants, citing archive.google/jobs/britney.html.",
   quote: "How to spell Britney Spears?", quote_checked: true}
- {id: D3-C415, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:4, ver: consistent, src: [britney-archive], topics: [search-console-features],
   text: "Google's Search Console talk said Google's logs show hundreds of different ways in which people write the query for Britney Spears."}
- {id: D3-C416, s: D3-S12, label: analysis, ev: "", ver: n/a, topics: [search-console-features],
   text: "The Google archive page cited on the Britney Spears slide lists 593 spellings (the correct one plus 592 misspellings), each typed by at least two different users within a three-month period and corrected by Google's spelling system; it is an old jobs page (footer 2011), so the figures are historical."}
- {id: D3-C417, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:6, ver: consistent, src: [query-groups-blog], topics: [search-console-features],
   text: "Google said query groups are not built by matching query text alone: deciding which queries belong in which group goes beyond simple text filtering."}
- {id: D3-C418, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:6, ver: undocumented, topics: [search-console-features],
   text: "Google named granularity as a design challenge of query groups: putting many queries into one large group versus splitting them into smaller, more specific groups."}
- {id: D3-C419, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:7, ver: consistent, src: [query-groups-blog], topics: [search-console-features],
   text: "Query groups can change when the meaning of a query changes over time: a 2023 search for 'Gemini' may have meant the astrological sign, but after Google launched Gemini it means something else, so Search Console may now group it differently."}
- {id: D3-C420, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:8, ver: undocumented, topics: [search-console-features],
   text: "Google acknowledged that query grouping is not perfect: some queries are not understood, and some are not grouped in a logical way."}
- {id: D3-C421, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:9, ver: consistent, src: [query-groups-blog], topics: [search-console-features],
   text: "Query groups appear in the Search Console Insights report as a table of the top groups, showing the total clicks of all the queries inside each group, with an option to view a larger table."}
- {id: D3-C422, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:9, ver: consistent, src: [query-groups-blog], topics: [search-console-features],
   text: "Each query group in Search Console is titled with the most prominent query in the group."}
- {id: D3-C423, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:10, ver: consistent, src: [query-groups-blog, perf-filtering-help], topics: [search-console-features],
   text: "Drilling into a query group opens the Search Console Performance report with a regex filter that contains all the queries of the group, so each individual query can be analysed."}
- {id: D3-C424, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:10, ver: n/a, topics: [search-console-features],
   text: "Google's Search Console team said query groups have been found very useful and that people are using them."}
- {id: D3-C425, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: [T:t06:11, T:t06:39], ver: confirmed, src: [query-groups-blog], topics: [search-console-features, feature-requests],
   text: "Google's Search Console team asks for feedback on every new feature, through the thumbs up and thumbs down buttons or any other feedback feature in Search Console, and said it takes that feedback very seriously."}
- {id: D3-C426, s: D3-S12, label: analysis, ev: "", ver: n/a, topics: [search-console-features],
   text: "The speaker placed the query groups launch, hedging, in December, but Google's announcement is dated 27 October 2025 with a gradual rollout over the following weeks, so many sites may first have seen the card around December 2025."}
- {id: D3-C427, s: D3-S12, label: analysis, ev: "", ver: n/a, topics: [search-console-features, helpful-content],
   text: "For content planning, read query groups (and their trending up and trending down views) as intent themes: write for the intent the group stands for, not for each spelling or phrasing variant in it."}
- {id: D3-C428, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:12, ver: consistent, src: [ai-config-blog], topics: [search-console-features],
   text: "Users often told Google that the Search Console Performance report is complex to configure, because it can be filtered and customised in many ways, such as by query, page, country and search type."}
- {id: D3-C429, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:13, ver: confirmed, src: [ai-config-blog, perf-filtering-help], topics: [search-console-features],
   text: "Search Console's AI-powered configuration is a chat box in which users describe the analysis they want in natural language, and the request is transformed into the Performance report's configuration."}
- {id: D3-C430, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:13, ver: undocumented, topics: [search-console-features],
   text: "Google said requests to Search Console's AI-powered configuration can be written in any language, not only English."}
- {id: D3-C431, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:13, ver: confirmed, src: [perf-filtering-help], topics: [search-console-features],
   text: "Search Console's AI-powered configuration lists the changes it will make to the Performance report and applies them only after the user approves."}
- {id: D3-C432, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:14, ver: consistent, src: [perf-filtering-help], topics: [search-console-features],
   text: "Search Console's AI-powered configuration is conversational rather than one-shot: a follow-up request adds changes on top of the configuration already applied.",
   quote: "So it's not one-shot, but you can also interact with it."}
- {id: D3-C433, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:15, ver: confirmed, src: [ai-config-blog], topics: [search-console-features],
   text: "An example request for Search Console's AI-powered configuration was to show queries on phone searches containing the word sports in the last six months.",
   quote: "Show me queries on phone searches that contain the word sports in the last 6 months."}
- {id: D3-C434, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:16, ver: consistent, src: [perf-filtering-help], topics: [search-console-features],
   text: "In a test by Google's Search Console team, the vague request 'wine-related queries that lead to my site' made Search Console's AI-powered configuration build a regex filter of wine names, such as Merlot, joined by pipe characters, without the user typing the regex."}
- {id: D3-C435, s: D3-S12, label: analysis, ev: "", ver: n/a, topics: [search-console-features],
   rel: [{type: repeats, to: D1-C243}],
   text: "Review the filters and regexes that Search Console's AI-powered configuration proposes before trusting the numbers: Google's launch post calls the feature experimental, warns that AI can misinterpret requests, and limits it to the Search results Performance report (not Discover or News) and to configuration, not sorting or exporting."}
- {id: D3-C436, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:18, ver: confirmed, src: [gsc-genai-control], topics: [genai-optout, search-console-features],
   rel: [{type: repeats, to: D1-C029}],
   text: "Search Console has a tool with which every property owner can tell Google whether the site's content may be used in AI search results, because Google wants content owners to control their content."}
- {id: D3-C437, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:19, ver: consistent, src: [genai-perf-reports-blog, genai-perf-help], topics: [measurement, search-console-features],
   rel: [{type: repeats, to: D1-C124}],
   text: "Search Console added reporting of the impressions a site's content gets in the AI surfaces of Google Search, found in the left navigation nested under Search results."}
- {id: D3-C438, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:20, ver: confirmed, src: [genai-perf-reports-blog], topics: [measurement, search-console-features],
   text: "The regular Search Console Performance report still shows all traffic including AI features, while the generative AI view shows only impressions from AI surfaces."}
- {id: D3-C439, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:20, ver: confirmed, src: [genai-perf-help, genai-perf-reports-blog], topics: [measurement, search-console-features],
   rel: [{type: repeats, to: D1-C124}],
   text: "Search Console's generative AI report shows impressions broken down by pages, countries and devices."}
- {id: D3-C440, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:21, ver: consistent, src: [genai-perf-reports-blog, genai-perf-help], topics: [measurement, search-console-features],
   rel: [{type: repeats, to: D1-C196}, {type: extends, to: D1-C449}],
   text: "Google called AI reporting in Search Console an evolving space and expects the generative AI report to get richer, with more information in the future."}
- {id: D3-C441, s: D3-S12, label: analysis, ev: "", ver: n/a, topics: [measurement, search-console-features],
   text: "Search Console's generative AI performance reports count impressions only, with no clicks and no query dimension (Google documents the Search report for AI Overviews and AI Mode, plus a separate Discover report), so measure visits that follow AI answers with your own analytics."}
- {id: D3-C442, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:22, ver: confirmed, src: [platform-props-blog, platform-props-guide-blog], topics: [search-console-features],
   rel: [{type: extends, to: D2-C960}],
   text: "Search Console launched platform properties, which bring social platforms into Search Console, about three or four months before the October 2026 event."}
- {id: D3-C443, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:23, ver: confirmed, src: [platform-props-help, platform-props-blog], topics: [search-console-features],
   text: "Platform properties let a user verify ownership of an Instagram, TikTok, X or YouTube account in Search Console and see the traffic Google sends to that account."}
- {id: D3-C444, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:23, ver: undocumented, topics: [search-console-features],
   text: "Google said it is working on adding more platforms to Search Console's platform properties beyond Instagram, TikTok, X and YouTube."}
- {id: D3-C445, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:24, ver: consistent, src: [verify-site-ownership], topics: [search-console-features],
   text: "Google acknowledged that verifying a website in Search Console, by placing a Google token on the homepage or in the DNS setup, is a relatively high bar for some people."}
- {id: D3-C446, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:25, ver: consistent, src: [platform-props-blog, platform-props-help], topics: [search-console-features],
   text: "A platform property is verified entirely from within Search Console: a pop-up from the platform, for example Instagram, asks the user to grant Google permission to identify the account and its handle, and completing it proves ownership without a token."}
- {id: D3-C447, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:26, ver: consistent, src: [platform-props-blog, social-video-guide], topics: [search-console-features],
   text: "Platform properties have a newly designed landing page, similar to the Insights report, that shows overall clicks and the search types that lead to the account."}
- {id: D3-C448, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:26, ver: consistent, src: [platform-props-blog, social-channels-blog], topics: [search-console-features],
   text: "The platform property landing page lists the account's top-performing content items, for example a channel's top YouTube videos, and the items trending up and trending down."}
- {id: D3-C449, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:27, ver: confirmed, src: [platform-props-guide-blog, social-video-guide], topics: [search-console-features],
   text: "Platform properties also show the query groups that lead to the account's content and the countries that send it traffic."}
- {id: D3-C450, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: [T:t06:28, T:t06:32], ver: confirmed, src: [platform-props-guide-blog, social-video-guide], topics: [search-console-features],
   text: "Because platform properties bring many new users to Search Console, Google published documentation and strategy guidance on them, covering how to identify the Search audience, use the 24-hour real-time view, export data and compare platforms such as Instagram and YouTube."}
- {id: D3-C451, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: [T:t06:29, T:t06:30], ver: confirmed, src: [social-video-guide], topics: [search-console-features],
   text: "In a YouTube platform property, long-form and short-form videos can be compared in the Performance report's comparison mode by URL pattern, /watch versus /shorts/; Instagram posts (/p/) and reels can be compared the same way."}
- {id: D3-C452, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:31, ver: undocumented, topics: [search-console-features],
   text: "In the example YouTube report shown in Google's Search Console talk, long-form videos still got more traffic and more impressions from Google than Shorts; this was one example channel, not a general finding."}
- {id: D3-C453, s: D3-S12, label: analysis, ev: "", ver: n/a, topics: [search-console-features, search-profiles],
   text: "Media teams that publish on YouTube, Instagram, TikTok or X should add each account as a Search Console platform property and compare formats by URL pattern; Google's July 2026 post says an account already used for a Search profile should already give access to its data."}
- {id: D3-C454, s: D3-S12, label: slide, who: Ariel Kroszynski, ev: [IMG_4822, T:t06:33], ver: confirmed, src: [multimodal-sc-blog], topics: [search-console-features, images],
   text: "Google's Search Console talk presented multimodal search reporting as its fifth and newest launch, under a 'Hot from the oven' badge.",
   quote: "5. Multimodal search reporting", quote_checked: true}
- {id: D3-C455, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:35, ver: consistent, src: [multimodal-sc-blog], topics: [search-console-features, images],
   text: "Multimodal search reporting in Search Console launched about a week and a half before the 2 October 2026 talk."}
- {id: D3-C456, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:35, ver: consistent, src: [multimodal-sc-blog], topics: [images],
   text: "Google said searching with images is convenient for users and drives traffic to websites."}
- {id: D3-C457, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:36, ver: consistent, src: [multimodal-sc-blog, perf-report-help], topics: [search-console-features],
   text: "Until the multimodal launch, the Search Console Performance report essentially showed only text-based searches."}
- {id: D3-C458, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:37, ver: confirmed, src: [multimodal-sc-blog, perf-report-help], topics: [images, search-console-features],
   text: "Multimodal searches reported in Search Console include searches with Google Lens, Circle to Search on Android, images uploaded to Google Search and Chrome's right-click search on an image."}
- {id: D3-C459, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:37, ver: consistent, src: [multimodal-sc-blog, perf-report-help], topics: [search-console-features, images],
   text: "To see multimodal traffic in the Search Console Performance report, select the multimodal search type instead of the default text-based one."}
- {id: D3-C460, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:34, ver: consistent, src: [chrome-lens-help, image-search-help], topics: [images],
   text: "In a live demo, Google Lens on an Android phone identified a photographed object and listed websites selling it, with deep links that allow buying it online."}
- {id: D3-C461, s: D3-S12, label: stage, who: Ariel Kroszynski, ev: T:t06:38, ver: consistent, src: [chrome-lens-help, multimodal-sc-blog], topics: [images, search-console-features],
   text: "In a demo, asking Chrome about an image on a web page opened a side panel of visual matches, one of which was on Google's developers site and led on to more information about Search Console; Google described this as the full flow of the multimodal traffic now reported."}
- {id: D3-C462, s: D3-S12, label: analysis, ev: "", ver: n/a, topics: [images, search-console-features],
   text: "Google's Performance report help says the queries dimension is not available for the multimodal search type, because these searches mostly use images, so judge image-led traffic by page, country and device, and make product and article images distinctive enough for Lens to match."}
- {id: D3-C463, s: D3-S12, label: docs, ev: "", ver: source, src: [query-groups-blog], topics: [search-console-features],
   text: "Google's query groups announcement (27 October 2025) says the groups are computed with AI, may change over time and do not affect ranking, and that query groups are available only to properties with a large volume of queries."}
- {id: D3-C464, s: D3-S12, label: docs, ev: "", ver: source, src: [perf-filtering-help], topics: [search-console-features],
   text: "Google's Search Console help says the experimental AI-powered configuration is visible only to a small percentage of users, allows each user 20 requests per day, keeps existing report filters when it adds new ones, and applies its suggested settings only after the user confirms them."}
- {id: D3-C465, s: D3-S12, label: docs, ev: "", ver: source, src: [multimodal-sc-blog], topics: [search-console-features, images],
   text: "Google's announcement of 24 September 2026 says multimodal search data appears both in the Performance report for Search results and in the generative AI performance report, can be exported, and began rolling out globally that day."}
- {id: D3-C466, s: D3-S12, label: docs, ev: "", ver: source, src: [platform-props-help], topics: [search-console-features],
   text: "Google's help page on platform properties says ownership is checked periodically and, if the external login expires, access pauses until the account is re-verified; each account or channel needs its own property, and data takes a few days to appear."}
- {id: D3-C467, s: D3-S12, label: docs, ev: "", ver: source, src: [platform-props-help], topics: [search-console-features],
   text: "Google's help page says platform properties show only how content performs on Google Search, Discover and Google News, not how often it is seen on the social or video platform itself."}
- {id: D3-C468, s: D3-S12, label: docs, ev: "", ver: source, src: [social-video-guide], topics: [search-console-features, search-profiles],
   rel: [{type: extends, to: D1-C025}, {type: extends, to: D2-C960}],
   text: "Google's social and video performance guide says that if you already claimed your Search profile, all of its verified accounts are added automatically as platform properties in Search Console."}

# ---------- D3-S13 Lightning session L: Understanding SERPs and your users ----------
- {id: D3-C469, s: D3-S13, label: stage, who: Nik Vujic, ev: [T:t07:1, T:t07:3], ver: n/a, topics: [search-console-data, measurement],
   rel: [{type: extends, to: D1-C255}],
   text: "In a community lightning talk, agency founder Nik Vujic presented how his agency feeds Search Console and GA4 data to an LLM agent to support decisions for its clients."}
- {id: D3-C470, s: D3-S13, label: stage, who: Nik Vujic, ev: T:t07:2, ver: n/a, topics: [search-console-data, measurement],
   text: "Nik Vujic called Google Search Console his favourite SEO tool, used alongside GA4, and said third-party SEO tools give only estimates, although they have some use cases."}
- {id: D3-C471, s: D3-S13, label: stage, who: Nik Vujic, ev: [T:t07:3, T:t07:5], ver: consistent, src: [sc-bulk-export-about], topics: [search-console-data],
   text: "Nik Vujic said it is super important to export all of a site's Search Console data, and his agency's workflow starts from Search Console's export to BigQuery."}
- {id: D3-C472, s: D3-S13, label: slide, who: Nik Vujic, ev: [IMG_4823, T:t07:7], ver: confirmed, src: [sc-branded-filter-blog], topics: [search-console-data, measurement],
   text: "A community slide (Workflow 1) said the first step is to apply the filters you need, even natively in Search Console, for example branded versus non-branded queries, with clicks and impressions.",
   quote: "Apply the filters you need, even natively in GSC. For example branded vs non-branded, with clicks and impressions.", quote_checked: true}
- {id: D3-C473, s: D3-S13, label: docs, ev: "", ver: source, src: [sc-branded-filter-blog], topics: [search-console-data, measurement],
   rel: [{type: extends, to: D3-C417}],
   text: "Google's launch post for Search Console's branded queries filter (20 November 2025) says the branded versus non-branded split is made by an internal AI-assisted system, not by a regular expression, and that some queries may occasionally be misidentified."}
- {id: D3-C474, s: D3-S13, label: slide, who: Nik Vujic, ev: IMG_4823, ver: confirmed, src: [sc-performance-data-limits], topics: [search-console-data],
   text: "A community slide said the Search Console interface export is limited to 1,000 rows.",
   quote: "The UI export is limited to 1,000 rows.", quote_checked: true}
- {id: D3-C475, s: D3-S13, label: slide, who: Nik Vujic, ev: IMG_4823, ver: confirmed, src: [sc-bulk-export-about, sc-bulk-export-blog], topics: [search-console-data],
   text: "A community slide said the Search Console bulk data export to BigQuery gives the most complete query dataset available, with anonymized queries excluded.",
   quote: "The bulk export to BigQuery gives the most complete query dataset available - anonymized queries excluded.", quote_checked: true}
- {id: D3-C476, s: D3-S13, label: analysis, ev: "", ver: n/a, src: [sc-bulk-export-about, sc-bulk-export-tables, sc-bulk-export-queries], topics: [search-console-data],
   text: "In the bulk export, 'anonymized queries excluded' means the query text, not the traffic: Google's table reference and query guidelines show those rows kept with an empty query field, often as the single most common 'query'. Tell an LLM to skip empty queries when ranking top queries, but keep them in totals."}
- {id: D3-C477, s: D3-S13, label: slide, who: Nik Vujic, ev: [IMG_4823, T:t07:7], ver: n/a, topics: [search-console-data, ai-in-search-systems],
   rel: [{type: extends, to: D1-C256}],
   text: "The community workflow's third step feeds the exported Search Console dataset into the agency's LLM agent, which queries the dataset and returns the evidence rather than a sample."}
- {id: D3-C478, s: D3-S13, label: slide, who: Nik Vujic, ev: [IMG_4823, T:t07:5, T:t07:7], ver: n/a, topics: [search-console-data],
   rel: [{type: extends, to: D1-C256}],
   text: "Nik Vujic's slide said no agent is needed to start: pull the Search Console data, import it into any LLM and query it in conversation; his agency built its agent to have everything in one place.",
   quote: "No agent needed to start: pull the data and import it into the LLM of your choice, and talk with it.", quote_checked: true}
- {id: D3-C479, s: D3-S13, label: stage, who: Nik Vujic, ev: T:t07:6, ver: consistent, src: [sc-performance-data-limits], topics: [search-console-data],
   text: "Nik Vujic recommended Looker Studio as a second way to get past Search Console's data limits."}
- {id: D3-C480, s: D3-S13, label: docs, ev: "", ver: source, src: [sc-performance-data-limits], topics: [search-console-data],
   text: "A Search Central blog post on Search Console data limits (October 2022) says the interface exports at most 1,000 rows, while the Search Analytics API and the Looker Studio connector return up to 50,000 rows per day per site per search type."}
- {id: D3-C481, s: D3-S13, label: docs, ev: "", ver: source, src: [sc-performance-data-limits], topics: [search-console-data, measurement],
   text: "Google's blog post on Search Console data limits says anonymized queries are always left out of the report tables but counted in chart totals unless you filter by query, and are left out whenever a filter is applied, so filtered rows do not add up to the chart totals."}
- {id: D3-C482, s: D3-S13, label: stage, who: Nik Vujic, ev: T:t07:8, ver: n/a, topics: [search-console-data],
   text: "Nik Vujic said his agency uses the Search Console data fed to an LLM in five use cases, the first being cross-comparing and following up different articles."}
- {id: D3-C483, s: D3-S13, label: stage, who: Nik Vujic, ev: T:t07:9, ver: undocumented, topics: [search-console-data, measurement],
   text: "Nik Vujic said that after a page is published, the queries it appears for are the first thing to show up in Search Console, while clicks and impressions come much later."}
- {id: D3-C484, s: D3-S13, label: analysis, ev: "", ver: n/a, topics: [search-console-data, measurement],
   text: "A query reaches Search Console's Performance report only through an impression, so queries cannot come before impressions; what rises first after a publish or refresh is the number of queries with a few impressions each, before total impressions and clicks grow noticeably."}
- {id: D3-C485, s: D3-S13, label: stage, who: Nik Vujic, ev: T:t07:9, ver: n/a, topics: [search-console-data, measurement],
   text: "To report content refreshes on large sites, Nik Vujic's agency compares date ranges and has an LLM give the exact number of queries the content improved on, then reports that number to the client."}
- {id: D3-C486, s: D3-S13, label: stage, who: Nik Vujic, ev: T:t07:9, ver: undocumented, topics: [ranking-signals-by-vertical, helpful-content],
   text: "Nik Vujic said Google loves fresh, quality content, as a reason for large sites to refresh their content."}
- {id: D3-C487, s: D3-S13, label: analysis, ev: "", ver: n/a, src: [ranking-systems-guide], topics: [ranking-signals-by-vertical, helpful-content],
   rel: [{type: extends, to: D2-C656}],
   text: "Google's ranking systems guide describes 'query deserves freshness' systems that show fresher content where it would be expected, which is narrower than a general preference for fresh content; refresh pages whose queries expect current information, and judge other refreshes by quality."}
- {id: D3-C488, s: D3-S13, label: stage, who: Nik Vujic, ev: T:t07:10, ver: n/a, topics: [page-indexing-report, search-console-data],
   text: "Nik Vujic said analysing Search Console query data with an LLM also helped his agency spot developer mistakes, such as unwanted pages that got indexed, which can also be found in Search Console itself."}
- {id: D3-C489, s: D3-S13, label: stage, who: Nik Vujic, ev: T:t07:11, ver: n/a, topics: [duplicate-content, search-console-data],
   text: "Nik Vujic said some keyword cannibalization is fine because it is logical, but for bad cannibalization his agency groups all of an article's Search Console queries and then decides whether to redirect the pages or rewrite and split the content."}
- {id: D3-C490, s: D3-S13, label: stage, who: Nik Vujic, ev: T:t07:12, ver: n/a, topics: [search-console-data],
   text: "Nik Vujic advised starting every SEO experiment with a hypothesis, for example a bulk change to one page element across a group of pages, and using an LLM to report the group's Search Console data, for example click-through rate, for the test."}
- {id: D3-C491, s: D3-S13, label: stage, who: Nik Vujic, ev: [T:t07:13, T:t07:14], ver: n/a, topics: [measurement],
   text: "Nik Vujic called the GA4 API combined with Looker Studio the only LLM traffic tracker that actually works."}
- {id: D3-C492, s: D3-S13, label: stage, who: Nik Vujic, ev: T:t07:14, ver: consistent, src: [ai-features-guide], topics: [measurement, ai-overviews-usage, ai-mode-usage],
   rel: [{type: extends, to: D3-C438}],
   text: "Nik Vujic said GA4 setups that separate out traffic from LLMs do not capture visits from AI Overviews and AI Mode."}
- {id: D3-C493, s: D3-S13, label: stage, who: Nik Vujic, ev: T:t07:14, ver: undocumented, topics: [measurement],
   text: "Nik Vujic said Google Tag Manager events can be used to follow real traffic arriving from different LLMs."}
- {id: D3-C494, s: D3-S13, label: stage, who: Nik Vujic, ev: T:t07:15, ver: n/a, topics: [measurement, seo-vs-geo, search-console-data],
   text: "Nik Vujic's agency puts Search Console data, LLM referral traffic from GA4 and the data from Search Console's generative AI report into one LLM prompt to compare a client's performance in classic search and in AI features."}
- {id: D3-C495, s: D3-S13, label: stage, who: Nik Vujic, ev: T:t07:15, ver: n/a, topics: [measurement, feature-requests],
   rel: [{type: extends, to: D1-C124}, {type: extends, to: D3-C440}],
   text: "Nik Vujic said he hopes Search Console's generative AI report will get query data."}
- {id: D3-C496, s: D3-S13, label: stage, who: Nik Vujic, ev: [T:t07:15, T:t07:16], ver: n/a, topics: [seo-vs-geo],
   text: "Nik Vujic said his agency uses the combined data to test whether good SEO is good GEO, and that the answer is 'it depends': for one client it found pages that performed better in generative AI features and LLMs than in standard search."}
- {id: D3-C497, s: D3-S13, label: analysis, ev: "", ver: n/a, src: [ai-optimization-guide], topics: [seo-vs-geo, measurement],
   rel: [{type: extends, to: D1-C058}],
   text: "Pages that do better in AI answers than in classic results do not refute Google's line that optimising for people is optimising for generative AI Search, since the comparison mixed Google's AI features with third-party LLMs; measure each surface separately, per page, before deciding what to change."}
- {id: D3-C498, s: D3-S13, label: docs, ev: "", ver: source, src: [ai-features-guide], topics: [measurement, ai-overviews-usage, ai-mode-usage],
   rel: [{type: extends, to: D3-C438}],
   text: "Google's AI features guide says traffic from sites appearing in AI features such as AI Overviews and AI Mode is included in the overall search traffic in Search Console and reported in the Performance report within the Web search type."}
- {id: D3-C499, s: D3-S13, label: docs, ev: "", ver: source, src: [sc-branded-filter-blog], topics: [search-console-data],
   text: "Search Console's branded queries filter works only for top-level properties, not URL-path or subdomain properties, and only for sites with enough queries and impressions; Google made it available to all eligible sites on 11 March 2026."}
- {id: D3-C500, s: D3-S13, label: analysis, ev: "", ver: n/a, src: [sc-performance-data-limits], topics: [search-console-data, measurement],
   text: "Because Google says anonymized queries are left out whenever a filter is applied, branded plus non-branded exports should not be expected to add up to the unfiltered chart totals; tell an LLM that sums filtered exports that the gap is expected, not missing data."}
- {id: D3-C501, s: D3-S13, label: analysis, ev: "", ver: n/a, src: [sc-branded-filter-blog], topics: [search-console-data, measurement],
   rel: [{type: extends, to: D3-C435}],
   text: "Before feeding a branded versus non-branded split to an LLM, spot-check a sample of queries in each group, since Google's AI-assisted classification can misidentify queries; on URL-path or subdomain properties, where the filter is unavailable, a regex query filter is the fallback."}
- {id: D3-C502, s: D3-S13, label: analysis, ev: "", ver: n/a, src: [sc-performance-data-limits, sc-bulk-export-blog], topics: [search-console-data],
   text: "Looker Studio lifts Search Console's 1,000-row interface limit but keeps the connector's cap of 50,000 rows per day per site per search type; only the bulk export to BigQuery is free of the daily row limit, so large sites that need every non-anonymized query should use it."}
- {id: D3-C503, s: D3-S13, label: stage, who: unknown, ev: T:t08:1, ver: n/a, topics: [measurement, measuring-ai-visibility],
   text: "A community speaker described a business whose visibility and average rankings for many important, high-value commercial keywords improved over a year while its clicks and impressions did not rise with them."}
- {id: D3-C504, s: D3-S13, label: stage, who: unknown, ev: T:t08:2, ver: n/a, topics: [measurement],
   text: "A community speaker argued that SEOs who panic when rankings rise but clicks do not are relying on a metric, rankings and visibility, that no longer stands up to scrutiny.",
   quote: "we rely on a metric that no longer stands up to scrutiny"}
- {id: D3-C505, s: D3-S13, label: stage, who: unknown, ev: T:t08:3, ver: undocumented, topics: [ai-overviews-usage, measurement],
   text: "A community speaker said most people in the room had probably seen clicks decline over the past couple of years because AI now takes part of the demand by summarising information from websites, a shift that hit informational queries first."}
- {id: D3-C506, s: D3-S13, label: docs, ev: "", ver: source, src: [ai-search-quality-clicks-blog], topics: [ai-overviews-usage, measurement, measuring-ai-visibility],
   text: "In an August 2025 post, Google's Head of Search wrote that total organic click volume from Google Search to websites had been relatively stable year-over-year and that Google was sending slightly more quality clicks (clicks where users do not quickly click back) than a year earlier; the post gave no figures."}
- {id: D3-C507, s: D3-S13, label: docs, ev: "", ver: source, src: [ai-search-quality-clicks-blog], topics: [ai-overviews-usage],
   text: "Google's August 2025 post on AI in Search said traffic is shifting between sites, decreasing for some and increasing for others, and that for some questions where people want a quick answer they may be satisfied with the response and not click further."}
- {id: D3-C508, s: D3-S13, label: analysis, ev: "", ver: n/a, src: [ai-search-quality-clicks-blog], topics: [ai-overviews-usage, measurement],
   text: "The click decline described on stage is what many individual sites report, while Google's published position (August 2025) is that total organic clicks are relatively stable but shifting between sites, with fewer clicks for quick-answer questions; neither side gave figures, so measure the trend per site and per query type rather than assuming a market-wide fall."}
- {id: D3-C509, s: D3-S13, label: stage, who: unknown, ev: T:t08:3, ver: n/a, topics: [ai-overviews-usage],
   text: "A community speaker said the loss of clicks on informational queries to AI summaries probably happened for a good reason, with benefits for the user journey (the word 'benefits' is an uncertain reading of the recording)."}
- {id: D3-C510, s: D3-S13, label: stage, who: unknown, ev: T:t08:4, ver: undocumented, topics: [ai-overviews-usage, measurement],
   text: "In data a community speaker tracks for particular brands, local search terms have started to lose clicks too as AI features appear on more results pages."}
- {id: D3-C511, s: D3-S13, label: stage, who: unknown, ev: T:t08:4, ver: undocumented, topics: [ai-overviews-usage],
   text: "A community speaker reported, calling it worrying, that AI features have started to appear more often on results pages for commercial search terms too, in data the speaker tracks for particular brands."}
- {id: D3-C512, s: D3-S13, label: stage, who: unknown, ev: T:t08:5, ver: n/a, topics: [measurement, seo-scope],
   text: "A community speaker said the problem SEOs face is not ranking but positioning SEO differently and measuring and showing its value to stakeholders while AI features take away clicks, some of which were probably not relevant anyway."}
- {id: D3-C513, s: D3-S13, label: stage, who: unknown, ev: T:t08:6, ver: n/a, topics: [measurement],
   text: "Key stakeholders such as heads of department just want to see metrics and numbers, a community speaker said, which makes the way SEO reports its value the question to solve."}
- {id: D3-C514, s: D3-S13, label: stage, who: unknown, ev: T:t08:7, ver: n/a, topics: [measurement],
   text: "A community speaker said digital marketing has been spoiled by about 20 years of plentiful attribution and that SEOs should relearn the mindset of marketers who worked with very little of it, while still using the performance data that remains."}
- {id: D3-C515, s: D3-S13, label: stage, who: unknown, ev: T:t08:8, ver: n/a, topics: [measurement],
   text: "A community speaker advised SEOs to focus, as marketers did before detailed attribution, on downstream impact: the effect their work has on other channels."}
- {id: D3-C516, s: D3-S13, label: stage, who: unknown, ev: T:t08:8, ver: undocumented, src: [sej-similarweb-ai-visits], topics: [measurement, measuring-ai-visibility],
   text: "A community speaker cited a recent Similarweb study as showing that being recommended in AI-driven services multiplies a brand's chance of getting traffic downstream; a Similarweb study reported in June 2026, probably the one meant, found brands recommended by ChatGPT 2.5 times more likely to get a site visit within 7 days (US desktop data, finance, travel and beauty)."}
- {id: D3-C517, s: D3-S13, label: stage, who: unknown, ev: T:t08:8, ver: n/a, topics: [measurement, measuring-ai-visibility],
   text: "Traffic that follows an AI recommendation need not arrive through organic search but may come direct, through paid search or through another channel, a community speaker said, predicting the effect will show in data in the coming months and years."}
- {id: D3-C518, s: D3-S13, label: stage, who: unknown, ev: T:t08:9, ver: n/a, topics: [measurement],
   rel: [{type: extends, to: D1-C057}],
   text: "A community speaker concluded that rankings and clicks no longer equal real business outcomes.",
   quote: "rankings and clicks don't really equal real outcomes anymore"}
- {id: D3-C519, s: D3-S13, label: stage, who: unknown, ev: T:t08:10, ver: n/a, topics: [measurement, measuring-ai-visibility],
   text: "A community speaker ran a controlled test with a brand that had seen organic clicks drop: for a set period the only activity was work to raise the brand's AI visibility, with no external campaigns and no budget changes."}
- {id: D3-C520, s: D3-S13, label: stage, who: unknown, ev: T:t08:11, ver: n/a, topics: [measurement, measuring-ai-visibility],
   text: "A community speaker reported that a higher rate of recommendation in AI answers brought one brand a really significant uplift in inquiries during a controlled test, without giving a figure."}
- {id: D3-C521, s: D3-S13, label: stage, who: unknown, ev: T:t08:12, ver: n/a, topics: [measurement],
   text: "A community speaker said the brand in the controlled test had a record month, the kind of real business value that business owners care about more than a dip in traffic."}
- {id: D3-C522, s: D3-S13, label: stage, who: unknown, ev: T:t08:13, ver: n/a, topics: [measurement, measuring-ai-visibility],
   text: "During a community speaker's controlled test, the brand's paid search click-through rate rose by 36% while the only activity was work to raise its AI visibility."}
- {id: D3-C523, s: D3-S13, label: stage, who: unknown, ev: T:t08:13, ver: n/a, topics: [measuring-ai-visibility, measurement],
   text: "In a community speaker's controlled test the brand's AI visibility was tracked across the main AI engines and was described as really strong early in the experiment (whether as a starting level or a gain was not said)."}
- {id: D3-C524, s: D3-S13, label: stage, who: unknown, ev: T:t08:13, ver: n/a, topics: [measurement],
   text: "In the same controlled test the brand's top-of-page share in paid search dropped, so a slight dip in paid click-through rate would have been expected rather than the 36% rise, a community speaker said."}
- {id: D3-C525, s: D3-S13, label: stage, who: unknown, ev: T:t08:14, ver: n/a, topics: [measurement],
   text: "A community speaker advised SEOs to work with paid search teams to understand changes such as a rise in paid click-through rate and what impact SEO work may have had, since those teams may not credit SEO for it."}
- {id: D3-C526, s: D3-S13, label: stage, who: unknown, ev: T:t08:15, ver: undocumented, src: [econsultancy-familiar-brand], topics: [measuring-ai-visibility],
   text: "A community speaker cited a study from about 10 years ago, repeated since, as finding that 82% of people clicked on a brand they already knew regardless of its position; the matching source is Red C's eye-tracking study of shopping-type searches, reported by Econsultancy in October 2018 (about eight years before the event)."}
- {id: D3-C527, s: D3-S13, label: stage, who: unknown, ev: T:t08:15, ver: n/a, topics: [measuring-ai-visibility],
   text: "A community speaker suggested that people who meet a brand at several touchpoints, including in AI services, become familiar with it and are then more likely to choose it in a generic search, which can lift other metrics."}
- {id: D3-C528, s: D3-S13, label: stage, who: unknown, ev: T:t08:16, ver: n/a, topics: [measuring-ai-visibility],
   text: "A community speaker said brand familiarity should be built through AI-driven services and earned media as a whole, by improving content and visibility across services ('earned media' is an uncertain reading of the recording)."}
- {id: D3-C529, s: D3-S13, label: stage, who: unknown, ev: T:t08:16, ver: n/a, topics: [measurement],
   text: "A community speaker said the customer journey that starts in AI services still exists and only the direct attribution is missing, so SEOs should look at wider metrics they have not tracked before."}
- {id: D3-C530, s: D3-S13, label: stage, who: unknown, ev: T:t08:17, ver: n/a, topics: [measuring-ai-visibility, measurement],
   text: "A community speaker's simplified journey: an AI recommendation makes a visit more likely; the person may check the brand on social media or see it while scrolling, search the brand name, and later click it in a generic search because they know it."}
- {id: D3-C531, s: D3-S13, label: stage, who: unknown, ev: T:t08:17, ver: n/a, topics: [measurement],
   text: "When a brand bids on its own name, people who search the brand after an AI recommendation may arrive through paid search rather than organic, so organic reporting loses that visit, a community speaker noted."}
- {id: D3-C532, s: D3-S13, label: stage, who: unknown, ev: T:t08:18, ver: n/a, topics: [measurement],
   text: "Clicks are down for a lot of businesses but rarely tell the whole story, a community speaker summarised, advising SEOs to ask the paid search team for Google Ads click-through rate reports."}
- {id: D3-C533, s: D3-S13, label: stage, who: unknown, ev: T:t08:18, ver: consistent, src: [ai-features-guide, succeeding-in-ai-search-blog], topics: [measurement],
   text: "A community speaker advised SEOs to report conversion rates and traffic by channel, not only organic clicks."}
- {id: D3-C534, s: D3-S13, label: docs, ev: "", ver: source, src: [ai-features-guide], topics: [ai-overviews-usage, measurement],
   text: "Google's AI features guide says clicks from search results pages with AI Overviews are higher quality, meaning users are more likely to spend more time on the site."}
- {id: D3-C535, s: D3-S13, label: docs, ev: "", ver: source, src: [ai-features-guide], topics: [measurement, measuring-ai-visibility],
   rel: [{type: extends, to: D1-C062}],
   text: "Beyond Search Console, Google's AI features guide suggests tracking conversions and time spent on the site in tools such as Google Analytics to understand the value of traffic from AI features."}
- {id: D3-C536, s: D3-S13, label: docs, ev: "", ver: source, src: [succeeding-in-ai-search-blog], topics: [measurement, measuring-ai-visibility],
   rel: [{type: extends, to: D1-C057}],
   text: "A May 2025 Search Central blog post advised site owners to look at the overall value of visits from Search rather than focusing too much on clicks, using indicators of conversion such as sales, sign-ups, a more engaged audience or information lookups about the business."}
- {id: D3-C537, s: D3-S13, label: stage, who: unknown, ev: T:t08:19, ver: n/a, topics: [measurement],
   text: "For the brand in a community speaker's controlled test, organic sessions in GA4 roughly halved while direct sessions stayed fairly stable (an uncertain reading; a change of about 2% was mentioned, direction unclear in the recording)."}
- {id: D3-C538, s: D3-S13, label: stage, who: unknown, ev: T:t08:19, ver: n/a, topics: [measurement],
   text: "A community speaker advised comparing the relative performance of channels and choosing new metrics to report, rather than judging SEO on organic sessions alone."}
- {id: D3-C539, s: D3-S13, label: stage, who: unknown, ev: T:t08:20, ver: n/a, topics: [measurement],
   text: "A fully controlled test of AI visibility was possible for one brand only because it ran no other marketing activity, and is not viable for most brands, a community speaker said."}
- {id: D3-C540, s: D3-S13, label: stage, who: unknown, ev: T:t08:20, ver: n/a, topics: [measurement, measuring-ai-visibility],
   text: "A community speaker recommended picking areas of a business where testing is possible and measuring how AI visibility affects conversion rates and revenue there."}
- {id: D3-C541, s: D3-S13, label: analysis, ev: "", ver: n/a, topics: [measurement, measuring-ai-visibility],
   text: "The community speaker's figures (paid search click-through rate up 36%, organic sessions halved, a record month) come from one unpublished test of one unnamed brand with no stated period or baseline; use them as an illustration, not as a benchmark."}
- {id: D3-C542, s: D3-S13, label: analysis, ev: "", ver: n/a, topics: [measurement],
   rel: [{type: extends, to: D1-C057}, {type: extends, to: D1-C124}],
   text: "Google's own line on Day 1 was to measure success by metrics that matter to the business, and its Generative AI performance report shows impressions but no clicks; together with the community talk this argues for a report that puts organic next to direct, branded paid search, conversions and revenue."}
- {id: D3-C543, s: D3-S13, label: analysis, ev: "", ver: n/a, topics: [measuring-ai-visibility, measurement],
   text: "For a site's own test of AI visibility, write down the period, the baseline and every other marketing change before starting, and compare a test area with a similar control area; paid click-through rate and direct and branded traffic are the signals the community speaker watched."}
- {id: D3-C544, s: D3-S13, label: analysis, ev: "", ver: n/a, src: [sej-similarweb-ai-visits, econsultancy-familiar-brand], topics: [measuring-ai-visibility],
   text: "The two studies cited on stage are third-party and narrow (Similarweb, 2026: ChatGPT only, US desktop, three industries; Red C, 2018: eye-tracking on shopping-type searches), so quote them with that scope; Similarweb found that 55.9% of the resulting site traffic came from branded searches, the step after an AI recommendation in the speaker's customer journey."}

# ---------- D3-S16 Mastering the messy middle ----------
- {id: D3-C545, s: D3-S16, label: slide, ev: [IMG_4827, T:t09:3], ver: n/a, topics: [consumer-decisions],
   text: "Google's talk 'Mastering the messy middle', given by a Google marketing research and insights manager, presented Google's research on how AI is changing the way consumers make purchase decisions."}
- {id: D3-C546, s: D3-S16, label: stage, ev: T:t09:1, ver: consistent, src: [messy-middle-report], topics: [consumer-decisions],
   text: "Google has used the 'messy middle' decision-making model since 2019; the messy middle is what happens between the trigger that starts a purchase journey and the purchase itself."}
- {id: D3-C547, s: D3-S16, label: stage, ev: T:t09:1, ver: confirmed, src: [messy-middle-report], topics: [consumer-decisions],
   text: "In the messy middle people are in one of two mindsets: exploring, which looks across the category, its price points, its brands and what is available, or evaluating, which works toward a position where a decision can be made."}
- {id: D3-C548, s: D3-S16, label: stage, ev: T:t09:1, ver: consistent, src: [messy-middle-report], topics: [consumer-decisions],
   text: "Shoppers loop back and forth between exploring and evaluating until they feel confident enough to commit to a purchase."}
- {id: D3-C549, s: D3-S16, label: docs, ev: "", ver: source, src: [messy-middle-report], topics: [consumer-decisions],
   text: "Google's Think with Google report 'Marketing in the messy middle' places the messy middle between trigger and purchase and models it as two looping mindsets: exploration, an expansive mindset that adds brands, products and category information, and evaluation, a reductive mindset that narrows the options down to a decision."}
- {id: D3-C550, s: D3-S16, label: docs, ev: "", ver: source, src: [messy-middle-report], topics: [consumer-decisions],
   text: "Google's messy-middle report cites its original Decoding Decisions study, run with The Behavioural Architects in the UK in 2019 with 31,000 in-market online shoppers and published in 2020; the report says the findings were validated in more than 20 countries."}
- {id: D3-C551, s: D3-S16, label: stage, ev: T:t09:2, ver: consistent, src: [messy-middle-report], topics: [consumer-decisions],
   text: "Google's researcher explained the looping in the messy middle as a tension between people's urge to collect more information and the mental effort of processing it, a subject studied by behavioural science."}
- {id: D3-C552, s: D3-S16, label: stage, ev: T:t09:3, ver: n/a, topics: [consumer-decisions],
   text: "How AI is changing decision making is the number one question Google's consumer insights team receives, according to the speaker in October 2026."}
- {id: D3-C553, s: D3-S16, label: stage, ev: T:t09:3, ver: undocumented, topics: [consumer-decisions],
   text: "Google's research on how AI changes consumer purchase decisions, presented in October 2026, was based on 23,000 conversations with consumers (the talk did not say in which countries)."}
- {id: D3-C554, s: D3-S16, label: stage, ev: T:t09:4, ver: undocumented, topics: [consumer-decisions],
   text: "Because people do not always do what they say they will do, Google's research on AI and purchase decisions also analysed panels with 40,000 participants, together with research partners, besides the consumer conversations (the talk did not make clear whether 40,000 is one panel or the total)."}
- {id: D3-C555, s: D3-S16, label: press, ev: "", ver: source, src: [dmexco-beyond-messy-middle], topics: [consumer-decisions],
   text: "The DMEXCO 2026 programme described a Google session, 'Beyond the Messy Middle: Mastering the consumer journey with AI' (24 September 2026), as based on tens of thousands of AI-moderated interviews and observed journeys across Europe, finding that consumers are being 'boosted' by AI."}
- {id: D3-C556, s: D3-S16, label: analysis, ev: "", ver: n/a, topics: [consumer-decisions],
   text: "Keep the research numbers apart when quoting them: the 23,000 consumer conversations and 40,000-participant panels behind the 2026 AI findings are a newer research wave than the 2019 messy-middle study of 31,000 UK online shoppers."}
- {id: D3-C557, s: D3-S16, label: stage, ev: T:t09:5, ver: undocumented, topics: [consumer-decisions, ai-mode-usage, ai-overviews-usage],
   text: "Google's headline finding was that people who use AI features such as AI Mode or AI Overviews feel much more confident about their purchase decisions."}
- {id: D3-C558, s: D3-S16, label: stage, ev: T:t09:6, ver: consistent, src: [messy-middle-report], topics: [consumer-decisions],
   text: "Behavioural science distinguishes a fast, emotional way of deciding, used for frequent low-stakes decisions, from a slow, effortful way used for high-stakes decisions, which is tiring."}
- {id: D3-C559, s: D3-S16, label: stage, ev: T:t09:7, ver: undocumented, topics: [consumer-decisions],
   text: "Google's research found that consumers delegate the mental effort of a purchase decision to AI without surrendering the choice itself, which Google calls being 'boosted'.",
   quote: "that doesn't mean they are surrendering their choices. What's happening is that consumers are feeling boosted."}
- {id: D3-C560, s: D3-S16, label: stage, ev: [T:t09:7, T:t09:17], ver: undocumented, topics: [consumer-decisions],
   text: "According to Google's research, AI turns consumers who were confused and overwhelmed by information and options into consumers who feel empowered, like category experts, and able to make the best purchase for their needs."}
- {id: D3-C561, s: D3-S16, label: stage, ev: T:t09:8, ver: undocumented, topics: [consumer-decisions],
   text: "The first benefit consumers get from AI, according to Google's research, is ease: AI synthesises information quickly into an easy-to-digest form and makes choice overload manageable, so consumers can offload cognitive effort."}
- {id: D3-C562, s: D3-S16, label: stage, ev: T:t09:9, ver: undocumented, topics: [consumer-decisions, ai-mode-usage],
   rel: [{type: extends, to: D1-C018}],
   text: "Google's research also counted easy access as part of AI's ease benefit: multimodal input, such as taking pictures, and low friction lower the barrier to entry."}
- {id: D3-C563, s: D3-S16, label: stage, ev: T:t09:10, ver: undocumented, topics: [consumer-decisions],
   text: "The second benefit, assistance, is that AI reduces a complex category, such as smartphones or trip planning, to the few features that really matter (for a phone, the battery and the picture quality), so consumers feel like experts."}
- {id: D3-C564, s: D3-S16, label: stage, ev: T:t09:10, ver: undocumented, topics: [consumer-decisions],
   text: "Assistance also includes showing consumers what people in similar situations chose, because people are social and want that reassurance (the wording of this passage is partly uncertain in the recording)."}
- {id: D3-C565, s: D3-S16, label: docs, ev: "", ver: source, src: [messy-middle-report], topics: [consumer-decisions],
   text: "Google's messy-middle report names six behavioural principles at work in the messy middle: category heuristics, power of now, social proof, scarcity bias, authority bias and power of free; category heuristics are rules of thumb for a quick, satisfactory decision within a category, and social proof is the tendency to follow others' opinions and behaviour."}
- {id: D3-C566, s: D3-S16, label: stage, ev: T:t09:11, ver: undocumented, topics: [consumer-decisions],
   text: "Google's research found that consumers who do not use AI pinball between exploration and evaluation, while AI users start a purchase journey mostly exploring and then move on to evaluating, a path that looks more like a funnel."}
- {id: D3-C567, s: D3-S16, label: stage, ev: T:t09:11, ver: n/a, topics: [consumer-decisions],
   text: "The speaker called the marketing funnel a useful common language for strategy but not the reality of how consumers decide."}
- {id: D3-C568, s: D3-S16, label: stage, ev: T:t09:12, ver: undocumented, topics: [consumer-decisions],
   text: "The third benefit, suggestion, is that AI often proposes ideas, brands and products a consumer had not thought of, which lowers the cost of curiosity."}
- {id: D3-C569, s: D3-S16, label: stage, ev: T:t09:13, ver: consistent, src: [ai-mode-launch-blog], topics: [consumer-decisions, ai-overviews-usage, ai-mode-usage],
   rel: [{type: extends, to: D1-C004}],
   text: "Google's research found that people who use AI run more searches than people who do not."}
- {id: D3-C570, s: D3-S16, label: docs, ev: "", ver: source, src: [ai-mode-launch-blog], topics: [ai-mode-usage, ai-overviews-usage],
   text: "Google's AI Mode launch post (March 2025) said that with Google's new AI features people are using Google Search more than ever, as they get help with new and more complex questions."}
- {id: D3-C571, s: D3-S16, label: stage, ev: T:t09:13, ver: undocumented, topics: [consumer-decisions, ai-overviews-usage],
   rel: [{type: extends, to: D1-C005}],
   text: "Google's research found that people who use AI also visit more brand websites, because it is simply easier.",
   quote: "the people that are using AI, they search more, and they also visit more websites of brands."}
- {id: D3-C572, s: D3-S16, label: docs, ev: "", ver: source, src: [ai-features-guide], topics: [ai-overviews-usage],
   text: "Google's AI features guide says that with AI Overviews people have been visiting a greater diversity of websites for help."}
- {id: D3-C573, s: D3-S16, label: stage, ev: T:t09:13, ver: undocumented, topics: [consumer-decisions],
   text: "AI users sometimes take even longer purchase journeys, but they perceive their journeys as shorter, a perception the data does not always support (part of this passage is uncertain in the recording)."}
- {id: D3-C574, s: D3-S16, label: stage, ev: T:t09:14, ver: undocumented, topics: [consumer-decisions],
   text: "For high-risk or high-involvement purchases, ease, assistance and suggestion are often not enough, and consumers add a reassurance step to reduce the risk of the decision."}
- {id: D3-C575, s: D3-S16, label: stage, ev: T:t09:14, ver: undocumented, topics: [consumer-decisions],
   text: "After exploring with AI, people often go back to Google Search and to the websites of the product or service providers to double-check before buying, for example trust in the company and cancellation policies."}
- {id: D3-C576, s: D3-S16, label: docs, ev: "", ver: source, src: [helpful-content], topics: [helpful-content, consumer-decisions],
   text: "Google's helpful-content guidance asks whether content presents information in a way that makes you want to trust it, such as clear sourcing, evidence of expertise and background about the author or the site, for example through an author page or the site's About page."}
- {id: D3-C577, s: D3-S16, label: slide, ev: IMG_4828, ver: consistent, src: [messy-middle-report], topics: [consumer-decisions],
   text: "Google's slide defined the brand heuristic as a cognitive shortcut in which consumers use a brand's name and reputation as a proxy for product quality, reliability and value.",
   quote: "A cognitive shortcut where consumers use a brand's name and reputation as a proxy for product quality, reliability, and value", quote_checked: true}
- {id: D3-C578, s: D3-S16, label: stage, ev: [T:t09:15, IMG_4828], ver: consistent, src: [messy-middle-report], topics: [consumer-decisions],
   text: "In the reassurance step the brand heuristic is especially important: a brand familiar to the consumer conveys a lot of information and confidence."}
- {id: D3-C579, s: D3-S16, label: docs, ev: "", ver: source, src: [messy-middle-report], topics: [consumer-decisions],
   text: "Google's messy-middle report says leading brands keep a meaningful share of consumer preference even against competitors with much better offers, and calls brand one of the strongest heuristics in consumer choice."}
- {id: D3-C580, s: D3-S16, label: stage, ev: T:t09:15, ver: undocumented, topics: [consumer-decisions],
   text: "A new or less familiar brand should expect people to double-check it and should prepare assets that give them the extra reassurance they need at that last step."}
- {id: D3-C581, s: D3-S16, label: slide, ev: IMG_4829, ver: undocumented, topics: [consumer-decisions, trends-data],
   text: "A Google slide showed nine Google Trends charts of trust-checking searches in several markets and languages (source line: Google Trends, January 2016 to March 2026, web search), all rising toward the end of the range: 'is [brand] legit?' (two panels), '[brand] è affidabile?', '[brand] jest bezpieczne?', 'Is [brand] betrouwbaar?', 'Ist [brand] seriös?', '[brand] est fiable?', '¿es [brand] falso?' and 'trustpilot'."}
- {id: D3-C582, s: D3-S16, label: stage, ev: [T:t09:16, IMG_4829], ver: undocumented, topics: [consumer-decisions, trends-data],
   text: "Google Trends shows a rise since about 2020 in searches of the form 'is [brand] legit', in the UK and in most other countries Google looked at."}
- {id: D3-C583, s: D3-S16, label: stage, ev: T:t09:16, ver: n/a, topics: [consumer-decisions],
   text: "The speaker read the rise in 'is [brand] legit' searches as a signal that people go back to the brand's website and to Google Search to take an extra reassurance step."}
- {id: D3-C584, s: D3-S16, label: stage, ev: T:t09:17, ver: undocumented, topics: [consumer-decisions],
   text: "Consumers who use AI no longer feel frustrated by a lack of progress in a purchase decision; they feel they are moving through the funnel and feel like category experts."}
- {id: D3-C585, s: D3-S16, label: stage, ev: T:t09:18, ver: undocumented, topics: [consumer-decisions],
   text: "Consumers boosted by AI in their purchase decisions were still a small group in October 2026, but the group is growing as more people start using AI (the word 'boosted' is an uncertain reading at this point of the recording)."}
- {id: D3-C586, s: D3-S16, label: slide, ev: [IMG_4830, T:t09:18], ver: consistent, src: [ai-optimization-guide, helpful-content], topics: [helpful-content, seo-vs-geo, consumer-decisions],
   rel: [{type: repeats, to: D1-C058}],
   text: "Google's marketing research talk reached the same advice as Search: optimise for people to win in generative AI search.",
   quote: "Optimise for people to win in generative AI search", quote_checked: true}
- {id: D3-C587, s: D3-S16, label: stage, ev: T:t09:18, ver: n/a, topics: [helpful-content, consumer-decisions],
   text: "The reason given for optimising for people was that a human still makes the final purchase decision, so content has to be useful to that person."}
- {id: D3-C588, s: D3-S16, label: slide, ev: IMG_4830, ver: confirmed, src: [ai-optimization-guide, helpful-content], topics: [helpful-content],
   rel: [{type: repeats, to: D1-C055}],
   text: "Google's slide advised producing unique, helpful, human-centric content."}
- {id: D3-C589, s: D3-S16, label: docs, ev: "", ver: source, src: [ai-optimization-guide], topics: [helpful-content, seo-vs-geo],
   text: "Google's guide for generative AI features says creating content that people find unique, compelling and useful will likely influence a website's presence in generative AI search."}
- {id: D3-C590, s: D3-S16, label: slide, ev: [IMG_4830, T:t09:18], ver: undocumented, topics: [helpful-content, consumer-decisions],
   text: "Google's slide advised partnering with category opinion formers, such as YouTube creators, experts and institutions, who can give consumers extra reassurance."}
- {id: D3-C591, s: D3-S16, label: stage, ev: T:t09:19, ver: consistent, src: [messy-middle-report], topics: [consumer-decisions],
   text: "Because purchase journeys can be long and competitive, brands should be present where decisions are made: on Google Search and on their own brand website."}
- {id: D3-C592, s: D3-S16, label: stage, ev: T:t09:19, ver: n/a, topics: [consumer-decisions],
   text: "A brand's own website matters in AI-assisted journeys because it is the one source where the brand speaks in its own voice and controls the message."}
- {id: D3-C593, s: D3-S16, label: analysis, ev: "", ver: n/a, topics: [consumer-decisions, helpful-content],
   text: "For high-involvement products and services, make the double-check easy on your own site: company details, reviews, cancellation and return policies, guarantees and contact options should be on crawlable, indexable pages linked from product and service pages."}
- {id: D3-C594, s: D3-S16, label: analysis, ev: "", ver: n/a, topics: [consumer-decisions, trends-for-seo],
   text: "Track trust queries about your brand, such as '[brand] legit', '[brand] reviews' or '[brand] seriös', in Search Console and Google Trends for each market, and answer them on the site, for example with a trust or about page, instead of leaving the answer to third-party review sites."}
- {id: D3-C595, s: D3-S16, label: analysis, ev: "", ver: n/a, topics: [consumer-decisions],
   text: "The messy-middle findings come from Google's marketing research on consumer behaviour, not from Search documentation; they describe how people decide, not how Google ranks pages, and none of them is a ranking signal."}
- {id: D3-C596, s: D3-S16, label: analysis, ev: "", ver: n/a, topics: [consumer-decisions, measurement],
   text: "Google's finding that AI users visit more brand websites is Google's own research; check it against your own data, such as branded and direct traffic in analytics and the Generative AI performance report in Search Console, before planning on it."}
- {id: D3-C597, s: D3-S16, label: analysis, ev: "", ver: n/a, topics: [consumer-decisions, helpful-content],
   text: "Content that helps AI-assisted shoppers names the few features that decide a category (for a phone, battery and camera), compares options on them and shows what similar buyers chose, which matches the ease, assistance and suggestion benefits Google described."}

# ---------- D3-S17 How long does it take to..? ----------
- {id: D3-C598, s: D3-S17, label: stage, who: Gary Illyes, ev: [T:t10:1, T:t10:4, T:t10:6], ver: n/a, topics: [processing-times],
   text: "Google presented its processing times for crawling, indexing and serving as an experiment: estimates from its internal logs, meant to be informative and not something to obsess about, with feedback from the audience invited.",
   quote: "if you have an engineering mindset, then you can put a number to it."}
- {id: D3-C599, s: D3-S17, label: slide, ev: "IMG_4831, IMG_4832, IMG_4833, IMG_4834", ver: n/a, topics: [processing-times],
   text: "Each of Google's processing-time charts marks a minimum, a typical value and an end point on a scale from seconds to one year, with a dotted line for corner cases, and carries the footnote that the times are estimations based on internal analysis.",
   quote: "Times expressed on the diagram are estimations based on internal analysis.", quote_checked: true}
- {id: D3-C600, s: D3-S17, label: slide, ev: [IMG_4831, IMG_4832, T:t10:2, T:t10:3], ver: undocumented, topics: [processing-times, url-discovery],
   text: "Google estimated that discovering a new URL takes about 20 hours on average across all sites it knows of, with a minimum of seconds."}
- {id: D3-C601, s: D3-S17, label: slide, ev: [IMG_4831, T:t10:3, T:t10:4], ver: consistent, src: [crawl-budget-guide], topics: [processing-times, url-discovery, crawl-budget],
   text: "Google's crawl chart says the discovery of a new URL can take weeks or never happen, because the web is huge."}
- {id: D3-C602, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:3, ver: undocumented, topics: [url-discovery, crawl-budget],
   rel: [{type: extends, to: D1-C201}],
   text: "Google said it knows hundreds of trillions of URLs (as of October 2026)."}
- {id: D3-C603, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:3, ver: consistent, src: [crawl-budget-guide], topics: [crawl-budget, url-discovery],
   text: "Google does not crawl all the URLs it knows, because crawling everything would generally waste resources and a much smaller crawl space is enough."}
- {id: D3-C604, s: D3-S17, label: slide, ev: [IMG_4832, T:t10:5], ver: undocumented, topics: [processing-times, crawl-demand],
   text: "Google estimated that refreshing (recrawling) a known URL takes about 30 days on average, with a minimum of seconds and an end point of weeks to never."}
- {id: D3-C605, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:5, ver: undocumented, topics: [index-selection, crawl-demand],
   text: "Google's index drops URLs that have not been recrawled for a very long time, which is the 'never' end of the refresh estimate."}
- {id: D3-C606, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:5, ver: undocumented, topics: [processing-times, crawl-demand],
   rel: [{type: extends, to: D1-C466}],
   text: "For news sites in particular, Google said the refresh of a known URL can literally take seconds (the reading 'news sites' is likely but not certain)."}
- {id: D3-C607, s: D3-S17, label: stage, who: audience, ev: T:t10:7, ver: n/a, topics: [crawl-demand, processing-times],
   text: "An audience member reported recrawl intervals on one very large, popular client site: the homepage about 5 times a day, first-level pages about every 1.5 days (uncertain reading), and pages clustered as soft 404s every 160 to 190 days, adding that other sites will differ."}
- {id: D3-C608, s: D3-S17, label: stage, who: audience, ev: T:t10:7, ver: n/a, topics: [crawl-demand, crawlable-links, soft-404],
   text: "An audience member said that on the large site they observed, recrawl frequency followed the site hierarchy, demand and how well each page is internally linked."}
- {id: D3-C609, s: D3-S17, label: analysis, ev: [T:t10:5, T:t10:7], ver: n/a, topics: [crawl-demand, crawlable-links, soft-404],
   text: "With a typical refresh of about 30 days and deep or soft-404-like pages recrawled only every few months, link important deep pages from strong hub pages and fix pages that look like errors; then check recrawl intervals by site depth in server logs or the Crawl Stats report."}
- {id: D3-C610, s: D3-S17, label: slide, ev: [IMG_4832, T:t10:8, T:t10:9], ver: undocumented, topics: [processing-times, sitemaps],
   rel: [{type: extends, to: D1-C337}],
   text: "Google estimated that processing a sitemap takes about 24 hours on average, with a minimum of minutes."}
- {id: D3-C611, s: D3-S17, label: slide, ev: [IMG_4832, T:t10:9], ver: undocumented, topics: [sitemaps, processing-times],
   rel: [{type: extends, to: D1-C337}],
   text: "If a sitemap is useful to Google and the site is of high quality, Google tries to refetch the sitemap within 14 days at most."}
- {id: D3-C612, s: D3-S17, label: slide, ev: [IMG_4832, T:t10:9], ver: consistent, src: [build-sitemap], topics: [sitemaps],
   rel: [{type: extends, to: D1-C331}],
   text: "Google may never fetch a lower-quality site's sitemap again: once it figures out the site is of lower quality, it no longer wants to fetch the sitemap."}
- {id: D3-C613, s: D3-S17, label: slide, ev: [IMG_4832, T:t10:10], ver: confirmed, src: [robots-spec, submit-updated-robots-txt], topics: [robots-txt, processing-times],
   rel: [{type: extends, to: D1-C085}],
   text: "Google estimated that a robots.txt update is picked up in about 24 hours, with a minimum of seconds and an end point of 25 hours on the slide."}
- {id: D3-C614, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:10, ver: confirmed, src: [robots-spec, submit-updated-robots-txt], topics: [robots-txt, web-standards],
   rel: [{type: extends, to: D1-C085}],
   text: "Google said its service level objective is to refresh robots.txt every 24 hours, as RFC 9309 calls for, though delays happen now and then."}
- {id: D3-C615, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:10, ver: confirmed, src: [submit-updated-robots-txt, robots-txt-report], topics: [robots-txt],
   rel: [{type: extends, to: D1-C140}],
   text: "A site owner can submit robots.txt in Search Console to force Google to refresh it sooner."}
- {id: D3-C616, s: D3-S17, label: analysis, ev: [IMG_4832, T:t10:10], ver: n/a, src: [submit-updated-robots-txt], topics: [robots-txt],
   text: "Plan robots.txt changes a day ahead, because Google may use the old file for about 24 hours; for an urgent change, request a refresh in Search Console instead of waiting."}
- {id: D3-C617, s: D3-S17, label: slide, ev: [IMG_4832, T:t10:11], ver: undocumented, topics: [crawl-rate-limit, processing-times],
   rel: [{type: extends, to: D1-C493}],
   text: "Google's crawl chart puts a crawl capacity update at seconds when backing off, typically 4 hours or 1-2 weeks, and 1-3 weeks in recovery."}
- {id: D3-C618, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:11, ver: consistent, src: [crawl-budget-guide, reduce-crawl-rate, http-network-errors], topics: [crawl-rate-limit, crawl-errors],
   rel: [{type: extends, to: D1-C126}, {type: extends, to: D1-C354}, {type: extends, to: D1-C440}],
   text: "When a site starts serving 500 errors, Google lowers the crawl capacity allocated to the site within about four hours on average."}
- {id: D3-C619, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:11, ver: consistent, src: [crawl-budget-guide, reduce-crawl-rate], topics: [crawl-rate-limit, crawl-demand],
   text: "Increases in crawl capacity take longer than decreases, within one to three weeks, because Google first needs to know that the higher demand will last."}
- {id: D3-C620, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:11, ver: undocumented, topics: [crawl-rate-limit],
   text: "A continuously running process recalculates each site's crawl capacity within a month, so a capacity change takes up to about a month at most."}
- {id: D3-C621, s: D3-S17, label: analysis, ev: [IMG_4832, T:t10:11], ver: n/a, topics: [crawl-rate-limit, crawl-errors],
   text: "Spoken and slide figures for capacity increases differ (one to three weeks, up to a month, versus 1-2 weeks typical and 1-3 weeks in recovery), but the lesson is the same: a burst of 5xx errors cuts crawling within hours and recovery takes weeks, so keep servers stable before launches and migrations."}
- {id: D3-C622, s: D3-S17, label: slide, ev: [IMG_4832, T:t10:12], ver: undocumented, topics: [crawl-demand, processing-times],
   text: "Google estimated that a crawl demand update driven by Search takes about 20 hours on average, with a minimum of minutes and an end point of weeks to months."}
- {id: D3-C623, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:12, ver: consistent, src: [crawl-budget-guide], topics: [crawl-demand],
   rel: [{type: extends, to: D1-C093}, {type: extends, to: D1-C377}, {type: extends, to: D1-C439}],
   text: "When Google notices the web getting excited about a few URLs on a site, it allocates more crawl demand to the whole site so it does not miss content useful to future searchers."}
- {id: D3-C624, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:12, ver: consistent, src: [crawl-budget-guide], topics: [crawl-demand],
   rel: [{type: extends, to: D1-C375}, {type: repeats, to: D1-C538}],
   text: "Crawl demand can also come from other Google products, such as Shopping, and the roughly 20-hour estimate covers only demand from Search."}
- {id: D3-C625, s: D3-S17, label: slide, ev: [IMG_4833, T:t10:13], ver: consistent, src: [javascript-seo-basics], topics: [rendering, processing-times],
   text: "Google estimated that rendering takes seconds when done right away and hours when the page waits in the queue, with an end point of days to weeks."}
- {id: D3-C626, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:13, ver: consistent, src: [javascript-seo-basics], topics: [rendering, indexing-pipeline],
   rel: [{type: extends, to: D2-C170}],
   text: "Google renders pages in two ways: immediately after crawling, or later through a queue-based process that runs elsewhere."}
- {id: D3-C627, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:13, ver: consistent, src: [javascript-seo-basics], topics: [javascript-seo, rendering],
   rel: [{type: extends, to: D2-C172}],
   text: "Content that JavaScript adds to a page is typically seen by Google's indexing system within a few hours, and at worst within weeks."}
- {id: D3-C628, s: D3-S17, label: stage, who: Gary Illyes, ev: [IMG_4833, T:t10:14], ver: undocumented, topics: [rendering],
   rel: [{type: extends, to: D2-C256}],
   text: "Gary Illyes said Google keeps saying it renders every URL on the internet and that he would say this is not true, though it is what he was told; he went on to say that Google's logs show the rendering queue cleared within weeks.",
   quote: "we keep saying that we render every single URL on the internet. I would say that that's not true"}
- {id: D3-C629, s: D3-S17, label: stage, who: Gary Illyes, ev: [IMG_4833, T:t10:14], ver: undocumented, topics: [rendering],
   text: "According to Google's logs, everything in the rendering queue gets rendered within weeks."}
- {id: D3-C630, s: D3-S17, label: analysis, ev: [IMG_4833, T:t10:13, T:t10:14], ver: n/a, topics: [javascript-seo, rendering],
   text: "Put critical content, links and meta tags in the server HTML: content that needs JavaScript reaches indexing only after rendering, usually within hours but sometimes weeks, and even Google's own speaker doubted that every URL gets rendered."}
- {id: D3-C631, s: D3-S17, label: slide, ev: [IMG_4833, T:t10:15], ver: undocumented, topics: [robots-meta-tag, processing-times],
   text: "Google estimated that meta annotations, such as robots meta tags, are processed in typically 45 to 90 minutes, with a minimum of 200 seconds (about three minutes) and an end point of 1 to 4 days."}
- {id: D3-C632, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:15, ver: undocumented, topics: [indexing-pipeline, robots-meta-tag],
   text: "Meta annotation processing is a critical step of indexing: until a document passes it, Google cannot go on indexing the document."}
- {id: D3-C633, s: D3-S17, label: slide, ev: [IMG_4833, T:t10:15], ver: undocumented, topics: [processing-times, crawlable-links],
   text: "Google estimated that link annotations are processed in minutes to 1-3 weeks, with an end point of about one year on the slide."}
- {id: D3-C634, s: D3-S17, label: slide, ev: [IMG_4833, T:t10:16], ver: undocumented, topics: [indexing-pipeline, processing-times],
   text: "Google estimated that indexing a document end to end takes about 1.5 hours on average, with a minimum of seconds."}
- {id: D3-C635, s: D3-S17, label: slide, ev: [IMG_4833, T:t10:16], ver: undocumented, topics: [indexing-pipeline],
   text: "Google defined indexing end to end as the time from a document entering indexing until its critical processes finish and it reaches the serving index, tokenized and ready to be served as a result."}
- {id: D3-C636, s: D3-S17, label: slide, ev: IMG_4833, ver: consistent, src: [ask-google-to-recrawl], topics: [index-selection, processing-times],
   text: "Google's indexing chart says end-to-end indexing can take months or never happen, for reasons of quality."}
- {id: D3-C637, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:16, ver: n/a, topics: [processing-times],
   text: "Gary Illyes said the 1.5-hour indexing average is probably lowered by selection bias, because so many news sites push out articles."}
- {id: D3-C638, s: D3-S17, label: analysis, ev: [IMG_4831, IMG_4833, T:t10:2, T:t10:16], ver: n/a, topics: [url-discovery, processing-times],
   text: "By Google's own averages, getting found and crawled takes far longer than indexing (about 20 hours to discover a URL and 30 days to refresh one, against 1.5 hours to index), so for faster results work on discovery: internal links from often-crawled pages and accurate sitemaps."}
- {id: D3-C639, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:17, ver: consistent, src: [http-network-errors], topics: [processing-times, robots-meta-tag],
   text: "After Google processes a page that now returns a 404 or a noindex, it usually removes the page from its serving index within one to three weeks, sometimes much sooner."}
- {id: D3-C640, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:18, ver: consistent, src: [canonicalization-troubleshooting], topics: [canonical-selection, processing-times],
   text: "A change of canonical URL usually takes one to three weeks to show, though it can happen in seconds because Google allocates enough resources to canonicalization."}
- {id: D3-C641, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:18, ver: consistent, src: [search-docs-updates, canonicalization-troubleshooting], topics: [canonical-selection],
   text: "Gary Illyes said he had updated Google's documentation about canonicalization changes about a month before the event (around early September 2026)."}
- {id: D3-C642, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:19, ver: consistent, src: [crawl-budget-guide, site-move-with-url-changes], topics: [site-moves, canonical-selection],
   rel: [{type: extends, to: D2-C351}],
   text: "Google treats a site move as a complex canonicalization process in which every signal of the old site is recalculated and moved to the new one, and every indexing process has to run."}
- {id: D3-C643, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:19, ver: consistent, src: [site-move-with-url-changes], topics: [site-moves, processing-times],
   text: "A site move can finish within a few weeks for a small site, takes one to three months on average, and in the worst case about a year."}
- {id: D3-C644, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:19, ver: consistent, src: [site-move-with-url-changes], topics: [site-moves, indexing-signals],
   text: "Gary Illyes said a site move can take up to about a year in the worst case, because Google's slowest signal is recalculated only about once a year (some words of this passage are uncertain readings)."}
- {id: D3-C645, s: D3-S17, label: analysis, ev: T:t10:19, ver: n/a, src: [site-move-with-url-changes], topics: [site-moves],
   text: "Keep migration redirects in place for at least a year and judge a site move after one to three months, not days: Google's speaker said its slowest signal needs about a year to be recalculated (a partly uncertain passage of the recording), and Google's site move guide says to keep redirects generally at least one year."}
- {id: D3-C646, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:20, ver: undocumented, topics: [structured-data, processing-times],
   text: "Google usually picks up structured data updates within hours to one or two weeks, sometimes immediately."}
- {id: D3-C647, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:20, ver: consistent, src: [structured-data-guidelines], topics: [structured-data, rich-results],
   rel: [{type: extends, to: D2-C500}],
   text: "Google may never use structured data from a site it does not trust: once it sees markup it does not trust, it does not touch it."}
- {id: D3-C648, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:21, ver: undocumented, topics: [images, processing-times],
   text: "Google indexes images in hours to two days on average, and the fastest it can reliably index an image is under 150 seconds."}
- {id: D3-C649, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:21, ver: undocumented, topics: [images],
   text: "Google tries to index images from news sites much faster than usual, which lowers the average image indexing time (the reading 'news sites' is likely but not certain)."}
- {id: D3-C650, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:22, ver: undocumented, topics: [video, processing-times],
   text: "Google's deep analysis of a video, needed to actually understand it, can take months to finish."}
- {id: D3-C651, s: D3-S17, label: slide, ev: [IMG_4834, T:t10:23], ver: consistent, src: [removals-tool-help], topics: [processing-times],
   text: "Google estimated that a removal requested by the site owner in Search Console takes effect in about 2 hours on average, from minutes up to 24 hours."}
- {id: D3-C652, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:23, ver: undocumented, topics: [processing-times],
   text: "Search Console removals average about 2 hours because Google pushes removals out to its serving system about every 2 hours."}
- {id: D3-C653, s: D3-S17, label: analysis, ev: [IMG_4834, T:t10:17, T:t10:23], ver: n/a, src: [removals-tool-help], topics: [processing-times, robots-meta-tag],
   text: "To hide a URL from Google Search urgently, use the Removals tool in Search Console (about 2 hours) and also add a noindex or a 404, which takes one to three weeks to drop the page from the index."}
- {id: D3-C654, s: D3-S17, label: slide, ev: [IMG_4834, T:t10:24], ver: undocumented, topics: [snippet-controls, processing-times],
   text: "Google estimated that a snippet update takes 1-2 days on average and up to several weeks to months, because the page has to be reprocessed to extract the new text."}
- {id: D3-C655, s: D3-S17, label: slide, ev: [IMG_4834, T:t10:25], ver: undocumented, topics: [images, processing-times],
   text: "Google estimated that updating the image shown with a text result takes 1-2 weeks on average, from a minimum of days up to several weeks to months."}
- {id: D3-C656, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:25, ver: undocumented, topics: [images],
   text: "The image shown with a text result changes only after the image itself is indexed or reindexed and then goes through a further processing step involving embeddings."}
- {id: D3-C657, s: D3-S17, label: slide, ev: [IMG_4834, T:t10:26], ver: consistent, src: [title-links], topics: [snippet-controls, processing-times],
   text: "Google estimated that a title update takes as long as a snippet update: 1-2 days on average, up to several weeks to months."}
- {id: D3-C658, s: D3-S17, label: analysis, ev: [IMG_4834, T:t10:24, T:t10:26], ver: n/a, topics: [snippet-controls],
   text: "After changing a title or meta description, wait at least a few days before judging the result in Search; if nothing changes after several weeks, check that the page was recrawled, since snippets and titles are only re-extracted from a reprocessed page."}
- {id: D3-C659, s: D3-S17, label: slide, ev: [IMG_4834, T:t10:27], ver: consistent, src: [manual-actions-report], topics: [spam-policies, processing-times],
   text: "Google estimated that removing a manual action after a reconsideration request takes 1-2 weeks on average, at least 2-3 days, and 4-6 weeks or much longer for dormant sites."}
- {id: D3-C660, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:27, ver: consistent, src: [manual-actions-report], topics: [spam-policies],
   text: "For some sites a manual action is almost never removed, because the owners do not make the effort to actually clean up the site."}
- {id: D3-C661, s: D3-S17, label: slide, ev: [IMG_4834, T:t10:28], ver: undocumented, topics: [search-updates, processing-times],
   text: "Google estimated that a core update affects a site within 2 to 4 weeks from the beginning of its rollout."}
- {id: D3-C662, s: D3-S17, label: slide, ev: [IMG_4834, T:t10:28], ver: consistent, src: [core-updates], topics: [search-updates],
   rel: [{type: extends, to: D3-C294}],
   text: "Recovery after a core update typically takes 3 to 6 months once the site has put in work to regain traffic, and up to 6 months to a year, until the next core update."}
- {id: D3-C663, s: D3-S17, label: slide, ev: [IMG_4834, T:t10:29], ver: consistent, src: [spam-updates], topics: [spam-detection, processing-times],
   rel: [{type: extends, to: D3-C286}],
   text: "Google estimated that a spam update affects sites within 1-2 days of the rollout, 1-2 weeks for continuous processing (said on stage as 2 weeks on average) and months for batch refreshes."}
- {id: D3-C664, s: D3-S17, label: analysis, ev: [IMG_4834, T:t10:27, T:t10:28], ver: n/a, topics: [search-updates, spam-policies],
   text: "Set expectations for recovery work: a manual action can lift within weeks of a real clean-up, but recovery from a core update typically takes 3 to 6 months and may need the next core update, so do not judge quality work within the first weeks."}
- {id: D3-C665, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:30, ver: consistent, src: [how-search-works], topics: [pipeline-overview, processing-times],
   text: "Google's processes depend on each other: crawling happens first, then indexing, then serving, so a change such as a new canonical cannot be processed until the page has been recrawled."}
- {id: D3-C666, s: D3-S17, label: stage, who: Gary Illyes, ev: T:t10:31, ver: n/a, topics: [pipeline-overview],
   text: "Google said it structured the three days of the event as crawling, indexing and serving because that is literally how Search works."}
- {id: D3-C667, s: D3-S17, label: docs, ev: T:t10:10, ver: source, src: [submit-updated-robots-txt, robots-txt-report], topics: [robots-txt],
   rel: [{type: extends, to: D1-C528}],
   text: "Google's robots.txt guide says its crawlers update their cached copy of a site's robots.txt every 24 hours, and that the Request a recrawl option in Search Console's robots.txt report refreshes it faster."}
- {id: D3-C668, s: D3-S17, label: docs, ev: T:t10:11, ver: source, src: [reduce-crawl-rate], topics: [crawl-rate-limit, crawl-errors],
   text: "Google's crawl rate guide says that when a significant number of URLs return 500, 503 or 429, Google reduces the site's crawl rate, which starts increasing again automatically once the errors drop; it warns against doing this for longer than 1-2 days."}
- {id: D3-C669, s: D3-S17, label: docs, ev: T:t10:18, ver: source, src: [canonicalization-troubleshooting], topics: [canonical-selection],
   text: "Google's guide to fixing canonicalization issues says that even after content issues are fixed, Google might hold pages in a duplicate cluster for up to two weeks, and that pages split out faster when they differ clearly and significantly."}
- {id: D3-C670, s: D3-S17, label: analysis, ev: T:t10:18, ver: n/a, src: [search-docs-updates, canonicalization-troubleshooting], topics: [canonical-selection],
   text: "The canonicalization documentation update mentioned on stage appears in Google's documentation changelog on 10 July 2026 (re-evaluation time, page last updated 21 August 2026), earlier than 'about a month' before the event; its 'up to two weeks' sits at the short end of the one to three weeks said on stage."}
- {id: D3-C671, s: D3-S17, label: docs, ev: T:t10:19, ver: source, src: [site-move-with-url-changes], topics: [site-moves],
   text: "Google's site move guide says to keep redirects for as long as possible, generally at least one year, so that Google can transfer all signals to the new URLs."}
- {id: D3-C672, s: D3-S17, label: docs, ev: T:t10:19, ver: source, src: [site-move-with-url-changes], topics: [site-moves],
   text: "Google's site move guide says that, as a general rule, a small to medium-sized site can take a few weeks for most pages to move and larger sites take longer, depending on the number of URLs and server speed."}
- {id: D3-C673, s: D3-S17, label: docs, ev: T:t10:23, ver: source, src: [removals-tool-help], topics: [processing-times],
   text: "Google's Removals tool help says a temporary removal request usually takes up to a day to process and lasts only about six months, so the content must also be removed permanently, for example with a 404 or 410, a noindex or a password."}
- {id: D3-C674, s: D3-S17, label: docs, ev: T:t10:27, ver: source, src: [manual-actions-report], topics: [spam-policies],
   text: "Google's Manual actions report help says most reconsideration reviews take several days or weeks, and that some, such as link-related requests, may take longer."}
- {id: D3-C675, s: D3-S17, label: docs, ev: T:t10:26, ver: source, src: [title-links], topics: [snippet-controls],
   text: "Google's title link guide says Google has to recrawl and reprocess a page to notice changes to the sources of its title link, which may take a few days to a few weeks."}
- {id: D3-C676, s: D3-S17, label: analysis, ev: T:t10:14, ver: n/a, src: [javascript-seo-basics], topics: [rendering, javascript-seo],
   rel: [{type: extends, to: D2-C131}],
   text: "The stage doubt that every URL gets rendered sits beside Google's JavaScript guide, which says every page with a 200 status is queued for rendering unless a robots rule blocks indexing: queued is not the same as rendered, so do not rely on rendering for critical content."}
- {id: D3-C677, s: D3-S17, label: analysis, ev: T:t10:3, ver: n/a, src: [ranking-systems-guide], topics: [url-discovery, index-selection],
   text: "Google's ranking systems guide speaks of hundreds of billions of pages in its Search index; by the author's arithmetic, against the hundreds of trillions of URLs Google said it knows, only around one known URL in a thousand is indexed, if both figures are taken at face value."}

# ---------- D3-S18 Wrapping all up: AI, Search, and making sense of everything. ----------
- {id: D3-C678, s: D3-S18, label: stage, who: Gary Illyes, ev: [T:t10:32, T:t10:33], ver: n/a, topics: [ai-in-search-systems],
   text: "Google said there is so much going on in Search that AI topics were covered across the event only where contextually important, and its closing message was to use AI but understand how it works so as to use it responsibly."}
- {id: D3-C679, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:34, ver: undocumented, topics: [ai-in-search-systems],
   text: "Google described AI as an umbrella of many technologies working together, one of which is machine learning: systems that learn from large amounts of data to make informed decisions."}
- {id: D3-C680, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:35, ver: undocumented, topics: [ai-in-search-systems],
   rel: [{type: extends, to: D1-C041}, {type: repeats, to: D1-C209}],
   text: "Gary Illyes said machine learning is about 50 years old and that Google has been using it for 'probably 30 years', starting with statistical models that made the 'Did you mean' feature possible."}
- {id: D3-C681, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:36, ver: consistent, src: [ranking-systems-guide], topics: [ai-in-search-systems],
   text: "Some of Google's search ranking features are plain machine learning models, because for some tasks simple machine learning models are more useful than large language models."}
- {id: D3-C682, s: D3-S18, label: stage, who: Gary Illyes, ev: [T:t10:37, T:t10:38], ver: undocumented, topics: [ai-in-search-systems, gemini-and-search],
   text: "Google described large language models as deep learning on internet-scale data sets, trained so that the model has an internal vector space in which concepts are mapped by context."}
- {id: D3-C683, s: D3-S18, label: stage, who: Gary Illyes, ev: [T:t10:39, T:t10:40], ver: undocumented, topics: [ai-in-search-systems],
   text: "Google distinguished predictive language models, whose primary job is to predict the next word or words in a text, from generative models that produce output from a prompt; next-word prediction is a guess, made with some accuracy, from the context given."}
- {id: D3-C684, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:39, ver: consistent, src: [ranking-systems-guide], topics: [ai-in-search-systems],
   rel: [{type: extends, to: D1-C042}],
   text: "Predictive language models have been used a lot in Search, and BERT is one: technically, in the purest sense, an LLM."}
- {id: D3-C685, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:41, ver: n/a, topics: [ai-in-search-systems],
   text: "Google said it thinks generative AI is extremely helpful to its users."}
- {id: D3-C686, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:42, ver: consistent, src: [gen-ai-content-guide], topics: [ai-in-search-systems, ai-content-detection],
   rel: [{type: extends, to: D2-C462}],
   text: "Hallucinations can happen with any AI model, and with current training methods there is no way to get rid of them."}
- {id: D3-C687, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:42, ver: undocumented, topics: [ai-in-search-systems, gemini-and-search],
   text: "Adding grounding or retrieval-augmented generation (RAG) on top of a model reduces hallucinations but cannot eliminate them."}
- {id: D3-C688, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:43, ver: consistent, src: [gen-ai-content-guide], topics: [ai-in-search-systems],
   rel: [{type: extends, to: D2-C939}],
   text: "Generative models, including image diffusion models, make things up when they lack information or because of issues in their training."}
- {id: D3-C689, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:44, ver: confirmed, src: [rater-guidelines], topics: [search-quality-evaluation, helpful-content],
   text: "Google's Search Quality Rater Guidelines tell raters that any form of deception makes a page untrustworthy and earns it the lowest rating."}
- {id: D3-C690, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:45, ver: confirmed, src: [rater-guidelines, gen-ai-content-guide], topics: [search-quality-evaluation],
   rel: [{type: extends, to: D3-C160}],
   text: "Quality raters cannot give a site a penalty or a manual action; their ratings are converted into labels that Google uses to improve its algorithms."}
- {id: D3-C691, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:45, ver: consistent, src: [rater-guidelines, gen-ai-content-guide], topics: [search-quality-evaluation, ai-content-detection],
   text: "Publishing AI output without checking it can indirectly harm a site's standing in Search, because deceptive content rated lowest by raters feeds the labels used to improve the algorithms."}
- {id: D3-C692, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:46, ver: confirmed, src: [rater-guidelines], topics: [search-quality-evaluation, ai-content-detection],
   text: "Google sees fake online personas as a growing type of deception, for example a professional author bio whose headshot is an AI-generated image of a non-existent person, and pages doing this get the lowest rater rating."}
- {id: D3-C693, s: D3-S18, label: analysis, ev: T:t10:46, ver: n/a, src: [rater-guidelines], topics: [helpful-content, search-quality-evaluation],
   text: "Show only real authors with real photos and verifiable profiles; never invent author personas or use AI-generated headshots, which Google's raters treat as deception."}
- {id: D3-C694, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:47, ver: consistent, src: [spam-policies, gen-ai-content-guide], topics: [spam-detection, ai-content-detection],
   rel: [{type: extends, to: D3-C284}],
   text: "Scaled content abuse is becoming a problem again: in the early 2000s pages were churned out with Perl or PHP scripts, and now the same is done with LLMs."}
- {id: D3-C695, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:48, ver: consistent, src: [spam-policies], topics: [spam-detection, ai-content-detection],
   rel: [{type: extends, to: D2-C611}],
   text: "The cheaper tokens become, the more AI slop is created, and Google counts AI slop as scaled content abuse."}
- {id: D3-C696, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:48, ver: consistent, src: [spam-policies], topics: [spam-detection],
   text: "Google said it is going to great lengths to get AI slop out of its search results."}
- {id: D3-C697, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:49, ver: consistent, src: [rater-guidelines, spam-policies], topics: [search-quality-evaluation, ai-content-detection],
   rel: [{type: extends, to: D2-C611}, {type: repeats, to: D3-C190}],
   text: "Google's Search Quality Rater Guidelines point out that the tool used to create content is not the problem, but how it was used and what for.",
   quote: "it's not the tool that was used that is the problem, but rather how the tool was used and what for."}
- {id: D3-C698, s: D3-S18, label: slide, ev: [IMG_4836, T:t10:50, T:t10:56], ver: n/a, topics: [helpful-content, ai-in-search-systems],
   text: "Google's closing slide told site owners they should use AI, which can supercharge workflows, help with content creation and with website and customer management."}
- {id: D3-C699, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:50, ver: n/a, topics: [helpful-content, ai-content-detection],
   text: "Google encouraged brainstorming and even creating content and images with AI, while staying mindful of what AI can do, because it sometimes lies to its users and that hurts a business and its Google rankings."}
- {id: D3-C700, s: D3-S18, label: slide, ev: [IMG_4836, T:t10:56], ver: consistent, src: [gen-ai-content-guide], topics: [helpful-content, ai-content-detection],
   rel: [{type: extends, to: D2-C941}],
   text: "Google's closing slide said to use AI responsibly because AI hallucinates, and, especially when creating content briefs with AI, to make sure not to add to the sea of AI slop already flooding the internet."}
- {id: D3-C701, s: D3-S18, label: slide, ev: [IMG_4836, T:t10:56], ver: consistent, src: [ai-features-guide], topics: [seo-vs-geo],
   rel: [{type: repeats, to: D1-C050}, {type: extends, to: D1-C038}],
   text: "Google's closing slide said AI on Google is just SEO: AI features on Google Search use exactly the same processes as traditional results, so no new acronym is needed, as none was for mobile-first indexing or structured data.",
   quote: "AI features on Google Search use exactly the same processes as traditional results.", quote_checked: true}
- {id: D3-C702, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:51, ver: consistent, src: [ai-features-guide], topics: [seo-vs-geo, pipeline-overview],
   rel: [{type: repeats, to: D2-C726}, {type: repeats, to: D1-C038}],
   text: "AI Overviews and AI Mode are built on the Search infrastructure Google has used for 25 to 30 years and have very few processes of their own."}
- {id: D3-C703, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:52, ver: n/a, topics: [seo-vs-geo, search-evolution],
   text: "Gary Illyes concluded that SEO is not dead.",
   quote: "To me, that means that SEO is not dead."}
- {id: D3-C704, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:53, ver: n/a, topics: [helpful-content, query-fanout],
   rel: [{type: repeats, to: D3-C065}],
   text: "Google warned that shiny new things, such as trying to work out fan-out queries, distract from the real mission of creating helpful content, since Search is just piping that connects users to information."}
- {id: D3-C705, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:54, ver: undocumented, topics: [search-evolution],
   text: "Search has changed every year since its start, for example the Florida update in 2003 (before core updates existed), Universal Search and the Knowledge Graph."}
- {id: D3-C706, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:54, ver: n/a, topics: [search-evolution, seo-vs-geo],
   text: "Google said that each time Search changed someone declared SEO dead, but that new features just mean new opportunities."}
- {id: D3-C707, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:55, ver: consistent, src: [web-guide-blog], topics: [search-evolution, ai-links-to-web],
   text: "Google presented Web Guide as an alternative to AI Mode: it groups the search results into categories with a short summary for each, while the classic text results remain."}
- {id: D3-C708, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:57, ver: n/a, topics: [seo-scope],
   rel: [{type: extends, to: D1-C227}],
   text: "Google does not tell lightning-talk and poster speakers what to talk about; they bring their own ideas."}
- {id: D3-C709, s: D3-S18, label: stage, who: Gary Illyes, ev: T:t10:57, ver: n/a, topics: [seo-scope],
   text: "Gary Illyes said he hoped the community lightning talks and posters confirmed Google's on-stage message, and judged from them that the vast majority of SEOs have a very good handle on what is happening in Search."}
- {id: D3-C710, s: D3-S18, label: docs, ev: T:t10:46, ver: source, src: [rater-guidelines], topics: [search-quality-evaluation, ai-content-detection],
   text: "Google's Search Quality Rater Guidelines (September 2025) list fake owner or content creator profiles, such as made-up author profiles with AI-generated images, as deception, and say pages using deception of any type should be rated Lowest."}
- {id: D3-C711, s: D3-S18, label: docs, ev: T:t10:45, ver: source, src: [rater-guidelines], topics: [search-quality-evaluation],
   text: "Google's Search Quality Rater Guidelines say no single rating can directly change how a page appears in Google Search; ratings measure how well search works and give examples of helpful and unhelpful results to improve it."}
- {id: D3-C712, s: D3-S18, label: docs, ev: T:t10:55, ver: source, src: [web-guide-blog], topics: [search-evolution, query-fanout],
   text: "Google's July 2025 blog post introduced Web Guide as a Search Labs experiment that uses a custom version of Gemini and a query fan-out technique to group web links by aspects of the query."}
- {id: D3-C713, s: D3-S18, label: docs, ev: T:t10:49, ver: source, src: [search-docs-updates, gen-ai-content-guide], topics: [ai-content-detection, search-quality-evaluation],
   text: "Google updated its generative AI content guidance on 1 October 2026 with information from the Search Quality Rater Guidelines, to keep its documentation in sync with the presentations used at its developer events."}
