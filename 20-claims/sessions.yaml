# Every session of the event. IDs are stable: D<day>-S<nn>. Times are the official agenda times, in quotes.
# coverage: slides | notes | transcript | one-slide | video | none (one value or a list)
# kind: talk | lightning | panel | qa | poster | break (default talk). Optional: note (one line), role (printed after the speaker).
# D<day>-S00 = session not recorded: its slide/stage claims may name the speaker in `who` (any name, audience or unknown).
event:
  name: Search Central Live Deep Dive Europe 2026
  city: Barcelona
  dates: 2026-09-30 to 2026-10-02
days:
  - day: 1
    date: 2026-09-30
    theme: Crawling
    sessions:
      - {id: D1-S01, time: "11:00", title: "Welcome and opening keynotes", speaker: "Lino Cattaruzzi", role: "President, Google Iberia", coverage: [slides, transcript],
         note: "Covers two agenda slots: the 11:00 Welcome (event host) and the 11:20 Opening keynote by Lino Cattaruzzi, named in the host's on-stage hand-over; he also presented the Larry Page quote and the five ecosystem principles. Transcript from a second attendee recording; an audio recording covers the keynote from its first minute to the end."}
      - {id: D1-S02, time: "11:35", title: "What's new in the world of Search", speaker: "Gary Illyes", role: "Search Relations", coverage: [transcript, slides],
         note: "Speaker from his self-introduction at the start of the talk, in a second attendee recording."}
      - {id: D1-S03, time: "11:45", title: "How Search works and where's AI?", speaker: ["Cherry Prommawin", "Gary Illyes"], role: "Search Relations", coverage: [transcript, slides],
         note: "Cherry Prommawin presented crawling, indexing and serving in classic Search and Gary Illyes the AI parts (his hand-over and her self-introduction at the start). Transcript from a second attendee recording."}
      - {id: D1-S04, time: "13:10", title: "Lightning session A: Automation and AI", speaker: ["James Powley", "Rafael Kovashikawa", "Kira Breuer", "Carlos Ortega", "Thiago Pojda", "other community speakers"], kind: lightning, coverage: transcript,
         note: "Hosted by Gary Illyes and Cherry Prommawin. Seven talks: AI automation in agency SEO work (James Powley, SEO Director, Blue Array: self-introduction and hand-over); LLM errors on search data (Rafael Kovashikawa, AI Engineer & SEO Specialist, FUSE: hand-over 'Raphael', the only Rafael on the official speaker list); an LLM fix loop for structured data (a live demo with Google's Rich Results Test); automating monthly SEO reports (Kira Breuer, SEO Manager, Greven Medien GmbH & Co. KG: hand-over 'Kiran' in the speech-to-text and her self-description as an SEO manager at a local agency in Cologne, matched to the only Kira on the official speaker list, whose job and city agree); preparing sites for humans and AI agents (Carlos Ortega, Freelance SEO Consultant: the next speaker's back-reference 'as we were just shown by Carlos', the only Carlos on the official speaker list); GEO and its metrics (Thiago Pojda, SEO Director & Entrepreneur, SIXT SE: the host's hand-over and his self-introduction); AI search as a funnel. The other speakers were not named. Transcript from a second attendee recording and an audio recording; no slides photographed."}
      - {id: D1-S05, time: "14:05", title: "How crawling works", speaker: ["Cherry Prommawin", "Gary Illyes"], role: "Search Relations", coverage: [slides, transcript],
         note: "Speakers from on-stage hand-overs between the two and the host's thanks to Gary and Cherry. Transcript from a second attendee recording; two audio recordings cover the talk except for about three minutes before the crawling infrastructure part."}
      - {id: D1-S06, time: "14:35", title: "How crawling errors affect Search", speaker: ["Cherry Prommawin", "Gary Illyes"], role: "Search Relations", coverage: [notes, transcript],
         note: "Cherry Prommawin presented the status codes and Gary Illyes the DNS, network, CDN and soft 404 errors (on-stage hand-overs; the host thanked both). Transcript from a second attendee recording and a complete audio recording."}
      - {id: D1-S07, time: "15:10", title: "How Google interprets robots.txt", speaker: "Google", coverage: [slides, transcript],
         note: "Audio recording from the first minutes of the talk to its end, including a robots.txt quiz; the speaker is not named in the recording. The unknown-line slide stays with this talk: the recording reads out its example and value, although the photo's time stamp falls a few minutes after the hand-over to Lightning session B."}
      - {id: D1-S08, time: "15:30", title: "Lightning session B: Robots.txt", speaker: ["Dave Smart", "other community speakers"], kind: lightning, coverage: transcript,
         note: "One community talk was recorded: robots.txt pitfalls seen in the wild (Dave Smart, Tech SEO, Tame the Bots: the host's hand-over, his self-introduction and the official speaker list). The audio recording ends during his talk."}
      - {id: D1-S09, time: "15:40", title: "What would you do?: Crawling Edition", speaker: "Google", coverage: none}
      - {id: D1-S10, time: "16:00", title: "How Google thinks about crawl budget", speaker: "Cherry Prommawin", role: "Search Relations", coverage: [slides, transcript],
         note: "The second attendee recording starts mid-talk, so the opening is from slides only."}
      - {id: D1-S11, time: "16:20", title: "Lightning session C: Crawling", speaker: ["Tobias Schwarz", "Jovana Avramovic"], kind: lightning, coverage: transcript,
         note: "Two community talks were recorded: similar URLs (Tobias Schwarz, CTO and Founder, Audisto, from his self-introduction) and why technical SEO still matters in AI search (Jovana Avramovic, SEO Consultant: hand-over 'Joanna' in the speech-to-text, matched to the official speaker list). Transcript from a second attendee recording."}
      - {id: D1-S12, time: "16:35", title: "Q&A", speaker: ["John Mueller", "Gary Illyes"], role: "Search Relations", kind: qa, coverage: transcript,
         note: "Panel named in the moderator's invitation ('John and Gary'); an answer carries a name only where an on-stage cue names its speaker. Audience questioners are not named. Transcript from a second attendee recording; two audio recordings cover most of the panel as well (from the AI crawlers question to the llms.txt answers, and from the Search Console API answer to the end)."}
      - {id: D1-S13, time: "17:25", title: "Daily wrap-up", speaker: "Google", coverage: transcript,
         note: "Housekeeping only (second attendee recording); no claims."}
      - {id: D1-S00, time: "", title: "Day 1, session not recorded", speaker: "", coverage: notes,
         note: "Points from my notes where I did not write down which session they came from."}
